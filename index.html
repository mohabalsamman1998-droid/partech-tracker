function bindTreasuryAddButtons(){
  const el = document.getElementById('treasury-view');
  el.querySelectorAll('[data-add-entry-key]').forEach(btn=>{
    const key = btn.getAttribute('data-add-entry-key');
    const label = btn.getAttribute('data-add-entry-label') || 'دعم الصندوق من الخارج';
    btn.addEventListener('click', ()=>{
      // السجل الجديد بتاريخ اليوم — لو الفلتر على فترة ماضية بيتخلق وما بيظهر بالقائمة أبدًا
      // (المستخدم بيحسبه ما انضاف، فيضيف مرة تانية). منرجّع الفلتر لـ"الكل" حتى يشوفه.
      if(treasuryPeriodFilter !== 'all' && !dateMatchesPeriod(parseDMY(todayNumeric()), treasuryPeriodFilter)){
        treasuryPeriodFilter = 'all';
        renderTreasuryView();
        showToast('رجّعنا فلتر الفترة لـ"الكل" حتى يظهر السجل الجديد', 'ok');
      }
      if(!Array.isArray(appData.treasury[key])) appData.treasury[key] = [];
      const newEntry = {id: uid('exp'), amount:'', date: todayNumeric(), note:''};
      appData.treasury[key].push(newEntry);
      editingExpenseEntries[newEntry.id] = true;
      openExpenseHistoryModal(key, label);
    });
  });
}

/* سحب من عهدة عامر يدويًا — يرجع المبلغ للصندوق مباشرة (بنفس آلية "كاش" عند تحصيل مرتجع
   تشليح: قيد سالب بعهدة عامر يقلّل رصيدها ويزيد صافي الصندوق بنفس المبلغ).
   onSaved: دالة تحديث الشاشة بعد الحفظ — افتراضيًا شاشة الصندوق، أو شاشة سداد التشاليح لو استُدعيت منها. */
function openWithdrawCustodyModal(onSaved){
  const root = document.getElementById('modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" data-close-backdrop>' +
      '<div class="modal-card modal-card-sm" role="dialog" aria-modal="true">' +
        '<div class="modal-title">➖ سحب من عهدة عامر</div>' +
        '<p class="modal-sub">المبلغ يُخصم من رصيد المشتريات ويُضاف مباشرة لصافي الصندوق.</p>' +
        '<label class="field"><span class="field-label">المبلغ</span><input type="number" min="0" step="0.01" id="withdraw-custody-amount-input" placeholder="المبلغ"></label>' +
        '<label class="field"><span class="field-label">التاريخ</span><input type="date" id="withdraw-custody-date-input" value="'+dmyToIso(todayNumeric())+'"></label>' +
        '<label class="field"><span class="field-label">تفاصيل (اختياري)</span><input type="text" id="withdraw-custody-note-input" placeholder="مثلا: السبب"></label>' +
        '<div class="modal-footer-actions" style="margin-top:16px;justify-content:flex-end;">' +
          '<button type="button" class="btn btn-ghost" id="withdraw-custody-cancel-btn">إلغاء</button>' +
          '<button type="button" class="btn btn-primary" id="withdraw-custody-save-btn">💾 سحب</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  root.classList.add('modal-open');
  const close = ()=>{ root.innerHTML=''; root.classList.remove('modal-open'); };
  root.querySelector('[data-close-backdrop]').addEventListener('click', e=>{
    if(e.target.hasAttribute('data-close-backdrop')) close();
  });
  root.querySelector('#withdraw-custody-cancel-btn').addEventListener('click', close);
  root.querySelector('#withdraw-custody-save-btn').addEventListener('click', async ()=>{
    const amountInput = document.getElementById('withdraw-custody-amount-input');
    const dateInput = document.getElementById('withdraw-custody-date-input');
    const noteInput = document.getElementById('withdraw-custody-note-input');
    const amount = Number(amountInput.value);
    if(!amountInput.value || isNaN(amount) || amount<=0){ showToast('أدخل مبلغًا صحيحًا', 'error'); return; }
    if(!Array.isArray(appData.treasury.amerCustody)) appData.treasury.amerCustody = [];
    const newEntry = { id: uid('exp'), amount: -amount, date: isoToDmy(dateInput.value), note: (noteInput.value||'').trim() || 'سحب من عهدة عامر' };
    // الحفظ بالقاعدة أولًا: الكتابة بجدول الصندوق محصورة بدور "full"، فكان أي دور تاني يشوف
    // "تم السحب" والقيد بالذاكرة بس — يختفي مع أول إعادة تحميل.
    const saveBtn = root.querySelector('#withdraw-custody-save-btn');
    if(saveBtn) saveBtn.disabled = true;
    const saved = await persistTreasuryEntry(newEntry, 'amerCustody');
    if(saveBtn) saveBtn.disabled = false;
    if(!saved) return;
    appData.treasury.amerCustody.push(newEntry);
    close();
    (onSaved||renderTreasuryView)();
    showToast('تم السحب من العهدة وإضافة المبلغ للصندوق', 'ok');
  });
}

function bindExpenseEntryEvents(key){
  const list = document.querySelector('[data-entries-key="'+escapeHtml(key)+'"]');
  if(!list) return;
  list.querySelectorAll('.expense-entry-row').forEach(row=>{
    const entryId = row.getAttribute('data-entry-id');
    const entry = (appData.treasury[key]||[]).find(e=>e.id===entryId);
    if(!entry) return;
    const editBtn = row.querySelector('.expense-entry-edit-btn');
    if(editBtn){
      editBtn.addEventListener('click', ()=>{
        editingExpenseEntries[entryId] = true;
        refreshExpenseEntries(key);
      });
    }
    const saveBtn = row.querySelector('.expense-entry-save-btn');
    if(saveBtn){
      saveBtn.addEventListener('click', async ()=>{
        const amt = Number(entry.amount);
        // amt<=0 كان يرفض أي تعديل (حتى تصحيح تاريخ/ملاحظة بس) على حركات "عهدة عامر"/الدعم
        // الخارجي، يلي بالتصميم بتتخزن كمبلغ سالب (سحب/خصم) — المرفوض فعليًا هو الفاضي أو صفر بس.
        if(entry.amount==='' || isNaN(amt) || amt===0){ showToast('أدخل مبلغًا صحيحًا', 'error'); return; }
        // نعيد جلب العنصر الحي من appData الحالي وقت الحفظ (لا نعتمد على المرجع القديم)
        // لأن appData ممكن يكون انستبدل بالكامل بتحديث لحظي من مستخدم ثاني أثناء ما كنا نعدّل.
        const liveEntry = (appData.treasury[key]||[]).find(e=>e.id===entryId);
        if(!liveEntry){
          showToast('تعذر الحفظ — يبدو إن هذا العنصر تغيّر أو انحذف من مكان آخر', 'error');
          delete editingExpenseEntries[entryId];
          refreshExpenseEntries(key);
          return;
        }
        const prev = { amount: liveEntry.amount, date: liveEntry.date, note: liveEntry.note };
        liveEntry.amount = amt;
        liveEntry.date = entry.date;
        liveEntry.note = entry.note;
        const saved = await persistTreasuryEntry(liveEntry, key);
        // فشل الحفظ (RLS بتحصر الكتابة بدور "full") كان يخلّي القيمة الجديدة بالذاكرة مع رسالة
        // "تم حفظ المبلغ" — نرجّع القيم القديمة ونبقي الصف بوضع التعديل لإعادة المحاولة.
        if(!saved){ Object.assign(liveEntry, prev); refreshExpenseEntries(key); return; }
        delete editingExpenseEntries[entryId];
        refreshExpenseEntries(key);
        showToast('تم حفظ المبلغ', 'ok');
      });
    }
    const amountInput = row.querySelector('.expense-entry-amount-input');
    if(amountInput){
      amountInput.addEventListener('input', e=>{
        entry.amount = e.target.value===''? '' : Number(e.target.value);
        updateExpenseCategorySubtotal(key);
        updateTreasurySummary();
      });
    }
    const dateInput = row.querySelector('.expense-entry-date-input');
    if(dateInput){
      dateInput.addEventListener('input', e=>{ entry.date = isoToDmy(e.target.value); });
    }
    const noteInput = row.querySelector('.expense-entry-note-input');
    if(noteInput){
      noteInput.addEventListener('input', e=>{ entry.note = e.target.value; });
    }
    row.querySelector('.expense-entry-remove-btn').addEventListener('click', ()=>{
      confirmDeleteExpenseEntry(key, entryId);
    });
  });
}

function confirmDeleteExpenseEntry(key, entryId){
  confirmAction({
    title: 'حذف هذا المبلغ؟',
    message: 'هذا الإجراء نهائي ولا يمكن التراجع عنه.',
    confirmLabel: 'تأكيد الحذف',
    dangerous: true,
    onConfirm: async ()=>{
      // الحذف من القاعدة أولًا: لو RLS منعته (دور غير "full")، شيله من الذاكرة كان بيوهم إنه انحذف
      // فعليًا لحد ما يرجع يظهر مع أول تحديث/إعادة تحميل.
      const deleted = await deleteTreasuryEntry(entryId);
      if(!deleted) return;
      appData.treasury[key] = (appData.treasury[key]||[]).filter(e=>e.id!==entryId);
      delete editingExpenseEntries[entryId];
      refreshExpenseEntries(key);
      updateExpenseCategorySubtotal(key);
      updateTreasurySummary();
    }
  });
}

function refreshExpenseEntries(key){
  const list = document.querySelector('[data-entries-key="'+escapeHtml(key)+'"]');
  if(!list) return;
  const matching = (appData.treasury[key]||[]).filter(entryMatchesPeriod).slice().reverse();
  list.innerHTML = matching.length
    ? matching.map(entry=>expenseEntryRowHtml(entry,key)).join('')
    : '<div class="expense-empty-hint">ما فيه مبالغ ضمن هذه الفترة</div>';
  bindExpenseEntryEvents(key);
  updateExpenseCategorySubtotal(key);
  updateTreasurySummary();
  const historyBtn = document.querySelector('[data-history-key="'+escapeHtml(key)+'"]');
  if(historyBtn) historyBtn.textContent = '📋 '+matching.length;
}

/* عميل "متأخر" = عنده طلبية مسلَّمة وباقي عليه مبلغ، ومرّ 30 يوم فأكثر من تاريخ التسليم
   (أو آخر تعديل للطلبيات القديمة يلي ما فيها تاريخ تسليم مسجّل) */
function overdueCustomersCount(){
  const THRESHOLD_MS = 30 * 24 * 60 * 60 * 1000;
  const now = Date.now();
  let count = 0;
  (appData.customers||[]).forEach(c=>{
    const isOverdue = (appData.orders||[]).some(o=>{
      if(o.customerId !== c.id) return false;
      if(!o.supplied) return false;
      const t = orderTotals(o);
      if(!t.hasSell || t.customerRemaining<=0) return false;
      const refDate = o.suppliedAt || o.updatedAt;
      if(!refDate) return false;
      const ref = new Date(refDate).getTime();
      if(isNaN(ref)) return false;
      return (now - ref) >= THRESHOLD_MS;
    });
    if(isOverdue) count++;
  });
  return count;
}

/* عدد العملاء اللي عندهم مبلغ لازم يرجعلهم (مرتجعات بانتظار التأكيد) — يُجمع مع المتأخرين
   بالسداد بنفس الشارة، لأن الاثنين "أشياء تحتاج انتباهك بخصوص العملاء" */
function customersWithPendingRefundsCount(){
  return (appData.customers||[]).filter(c=> customerRefundTotal(c.id) > 0).length;
}

/* بنمشي على الطلبيات مش على العملاء: مبلغ لازم يرجع للزبون هو دين علينا حتى لو الطلبية
   مش مربوطة بعميل مسجّل (customerId فاضي، أو العميل انحذف بعدين) — كان بيختفي كليًا من
   المؤشرات لأن الحساب كان بيلف على appData.customers بس. */
function totalCustomerRefundsPending(){
  let total = 0;
  (appData.orders||[]).forEach(o=>{
    if(!o.confirmed || o.isQuote) return;
    (o.parts||[]).forEach(p=>{
      if(!p.returned || p.customerRefundConfirmed) return;
      if(!partIsIncludedInOrder(o,p)) return;
      const adj = (o.customerPayments||[]).find(pay=>pay.returnAdjustment && pay.linkedPartId===p.id);
      if(adj) total += Number(adj.amount)||0;
    });
  });
  return round2(total);
}

/* ---------- عهدة عامر (لسداد التشاليح) ----------
   بدل ما يُخصم من الصندوق كل ما تُعلَّم طلبية "تم سداد التشليح"، الطلبية تُخصم من عهدة عامر بس.
   الصندوق يتأثر فقط لحظة إضافة/سداد لعهدة عامر (من هون). عجز العهدة (لو صارت سالبة) = المبلغ
   اللي لازم تسدده لعامر عشان تغطي اللي دفعه فعليًا للتشاليح ولسه ما رجعتله إياه. */
function amerCustodyTopupsTotalAll(){
  return round2((appData.treasury.amerCustody||[]).reduce((sum,entry)=> sum + (Number(entry.amount)||0), 0));
}
function amerCustodyTopupsTotal(matchFn){
  const filterFn = matchFn || entryMatchesPeriod;
  return round2((appData.treasury.amerCustody||[]).filter(filterFn).reduce((sum,entry)=> sum + (Number(entry.amount)||0), 0));
}
/* إجمالي تكلفة التشليح "المسددة عبر عهدة عامر" فقط — يستبعد الطلبيات المعلَّمة custodyLegacy،
   وهي طلبيات قديمة اتّسدّدت مباشرة من الصندوق قبل ما تُستحدث العهدة أصلًا؛ لو دخلت بحساب العهدة
   بترجع تخلق عجز وهمي (دين على عامر ما إله علاقة بالعهدة الفعلية اللي انولّت له). */
function paidToScrapyardTotalForCustody(){
  let total = 0;
  (appData.orders||[]).forEach(o=>{
    if(!o.confirmed || !o.paidToAmer || o.custodyLegacy || o.isQuote) return;
    total += orderTotals(o).costToScrapyard;
  });
  return round2(total);
}
function amerCustodyBalance(){
  return round2(amerCustodyTopupsTotalAll() - paidToScrapyardTotalForCustody());
}
function amerCustodyDeficit(){
  return round2(Math.max(0, -amerCustodyBalance()));
}

function bindTaskCategoryEvents(key){
  document.getElementById('btn-back-to-tasks-menu').addEventListener('click', ()=>{
    activeTaskCategory = null;
    renderTasksView();
  });
  const addBtn = document.getElementById('add-task-btn');
  const input = document.getElementById('new-task-input');
  const addTask = async ()=>{
    const text = input.value.trim();
    if(!text) return;
    if(!Array.isArray(appData.tasks[key])) appData.tasks[key] = [];
    const newItem = {id: uid('task'), text, done:false, createdAt: new Date().toISOString()};
    // الحفظ بالقاعدة أولًا — بدون هيك، فشل الحفظ (دور غير "full") كان يترك المهمة ظاهرة
    // بالقائمة وبالعدّاد وهي مش محفوظة، وتختفي مع أول إعادة تحميل بدون أي إشعار.
    addBtn.disabled = true;
    const saved = await persistTaskItem(newItem, key);
    addBtn.disabled = false;
    if(!saved) return;
    appData.tasks[key].push(newItem);
    input.value = '';
    updateTasksBadge();
    refreshTaskItemsList(key);
  };
  addBtn.addEventListener('click', addTask);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addTask(); } });
  bindTaskItemEvents(key);
}

function bindTaskItemEvents(key){
  const list = document.getElementById('task-items-list');
  if(!list) return;
  list.querySelectorAll('.task-item-row').forEach(row=>{
    const tid = row.getAttribute('data-task-id');
    const item = (appData.tasks[key]||[]).find(t=>t.id===tid);
    if(!item) return;
    row.querySelector('.task-item-check').addEventListener('change', async e=>{
      // نجلب العنصر الحي وقت الحفظ (مو نعتمد على المرجع القديم يلي التقطناه وقت الرسم)
      // لنفس سبب حماية تعديل المصاريف — appData.tasks ممكن يكون تحدّث لحظيًا من مستخدم ثاني.
      const liveItem = (appData.tasks[key]||[]).find(t=>t.id===tid);
      if(!liveItem) return;
      const prevDone = liveItem.done;
      liveItem.done = e.target.checked;
      row.classList.toggle('task-item-done', liveItem.done);
      updateTasksBadge();
      const saved = await persistTaskItem(liveItem, key);
      // فشل الحفظ (الكتابة بجدول المهام محصورة بدور "full") كان يترك المربّع محدّد بالواجهة فقط
      if(!saved){
        liveItem.done = prevDone;
        e.target.checked = prevDone;
        row.classList.toggle('task-item-done', prevDone);
        updateTasksBadge();
      }
    });
    row.querySelector('.task-item-remove-btn').addEventListener('click', async ()=>{
      // الحذف من القاعدة أولًا — انظر ملاحظة confirmDeleteExpenseEntry
      const deleted = await deleteTaskItem(tid);
      if(!deleted) return;
      appData.tasks[key] = (appData.tasks[key]||[]).filter(t=>t.id!==tid);
      updateTasksBadge();
      refreshTaskItemsList(key);
    });
  });
}

/* ---------- full data export (Excel) — a portability/backup escape hatch ---------- */
/* حماية من "CSV/Formula injection" (CWE-1236) — أي حقل نصي حر بالتطبيق (اسم طلبية، وصف قطعة،
   اسم/ملاحظة مورد أو عميل...) ممكن يكتبه مستخدم أقل ثقة (غير مخوّل، أو عامر عبر اقتراح مقبول)
   ويقرأه لاحقًا مخوّل بفتح ملف التصدير — لو الملف انفتح ببرنامج جداول أقل تشدّدًا أو انحفظ لاحقًا
   كـCSV، خلية تبدأ بـ =/+/-/@ ممكن تتفسّر كصيغة حيّة بدل نص عادي. نحط علامة اقتباس ' بالبداية
   (اصطلاح إكسل نفسه لـ"فرض نص") لأي قيمة كهاي، قبل أي json_to_sheet — helper واحد بدل تكراره
   بكل ورقة من الأوراق العشر. */
function sanitizeForExcelFormula(value){
  if(typeof value !== 'string' || !value.length) return value;
  if(/^[=+\-@\t\r]/.test(value)) return "'" + value;
  return value;
}
function sheetRowsSafe(rows){
  return (rows||[]).map(row=>{
    const safe = {};
    Object.keys(row).forEach(k=>{ safe[k] = sanitizeForExcelFormula(row[k]); });
    return safe;
  });
}

  for(let i=0; i<rawJson.length; i+=CHUNK){ chunks.push([rawJson.slice(i, i+CHUNK)]); }
  if(chunks.length===0) chunks.push(['']);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(chunks), 'نسخة احتياطية');

/* ---------- Excel import — restores appData from the "نسخة احتياطية" sheet written by the exporter above ---------- */
function importDataFromExcelFile(file){
  if(typeof XLSX === 'undefined'){
    showToast('تعذر تحميل مكتبة Excel — تأكد من الاتصال بالإنترنت وحاول مرة أخرى', 'error');
    return;
  }
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{
      const wb = XLSX.read(reader.result, {type:'array'});
      const sheetName = wb.SheetNames.find(n=> n.indexOf('نسخة احتياطية')===0);
      if(!sheetName) throw new Error('NO_BACKUP_SHEET');
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1});
      const rawJson = rows.map(r=> (r && r[0]!=null) ? String(r[0]) : '').join('');
      parsed = JSON.parse(rawJson);
      if(!parsed || !Array.isArray(parsed.orders)) throw new Error('BAD_SHAPE');
    }catch(err){
      showToast('هذا الملف لا يحتوي نسخة صالحة للاستيراد — لازم يكون نفس ملف "تصدير Excel" من هذا النظام', 'error');
      return;
    }
    confirmImportOverwrite(parsed);
  };
  reader.onerror = ()=> showToast('تعذر قراءة الملف', 'error');
  reader.readAsArrayBuffer(file);
}

function normalizeImportedOrder(o){
  const base = {
    id: uid('ord'),
    orderNumber: '',
    orderLabel: '',
    parts: [],
    partsSelectionEnabled: false,
    paidToAmer: false,
    paidToSupplier: false,
    supplied: false,
    customerPhone: '',
    customerPayments: [],
    confirmed: false,
    feeEnabled: false,
    feePercent: 0,
    serviceFeeEnabled: false,
    serviceFeePercent: 0,
    deliveryFeeEnabled: false,
    deliveryFeeAmount: 0,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  const merged = Object.assign(base, o || {});
  if(!Array.isArray(merged.parts)) merged.parts = [];
  if(!Array.isArray(merged.customerPayments)) merged.customerPayments = [];
  return merged;
}

function confirmImportOverwrite(parsedData){
  const orderCount = Array.isArray(parsedData.orders) ? parsedData.orders.length : 0;
  // نسخ قديمة (قبل هذا الإصلاح) ما بتشمل suppliers/customers بالملف — نحافظ على القيم
  // الحالية بالذاكرة بدل ما نفرّغها لو الملف المستورد أقدم من هالإصلاح.
  const hasSuppliersInFile = Array.isArray(parsedData.suppliers);
  const hasCustomersInFile = Array.isArray(parsedData.customers);
  confirmAction({
    title: 'استيراد البيانات؟',
    message: 'الملف يحتوي '+orderCount+' طلبية. سيتم استبدال كل البيانات الحالية (الطلبيات، الصندوق، المهام، الموردين، العملاء) بمحتوى هذا الملف — إجراء نهائي ولا يمكن التراجع عنه.',
    confirmLabel: 'استبدال البيانات',
    dangerous: true,
    onConfirm: async ()=>{
      // migrateLegacy* بتشتغل على appData العام، فلازم نركّب النسخة الجديدة عليه — بس بنحتفظ
      // بنسخة من القديم، وأي فشل بمنتصف الكتابة بنعيد التحميل من القاعدة نفسها بدل ما نترك
      // الشاشة تعرض بيانات ملف ما انكتب فعليًا (كان بيوهم المستخدم إن الاستيراد نجح).
      const previousAppData = appData;
      appData = {
        orders: (Array.isArray(parsedData.orders) ? parsedData.orders : []).map(normalizeImportedOrder),
        treasury: Object.assign(defaultTreasury(), parsedData.treasury || {}),
        tasks: Object.assign(defaultTasks(), parsedData.tasks || {}),
        suppliers: hasSuppliersInFile ? parsedData.suppliers : (previousAppData.suppliers || []),
        customers: hasCustomersInFile ? parsedData.customers : (previousAppData.customers || [])
      };
      migrateLegacyCustomerPayment();
      migrateLegacyOrderLabel();
      migrateLegacyTreasury();
      migrateLegacyTasks();
      try{
        await replaceAllOrders(appData.orders);
        await replaceAllTreasuryEntries(appData.treasury);
        await replaceAllTaskItems(appData.tasks);
        if(hasSuppliersInFile) await replaceAllSuppliers(appData.suppliers);
        if(hasCustomersInFile) await replaceAllCustomers(appData.customers);
      }catch(e){
        appData = previousAppData;
        showToast('تعذر استبدال البيانات: ' + (e && e.message ? e.message : '') + ' — جاري إعادة التحميل من قاعدة البيانات', 'error');
        try{ await loadData(); }catch(e2){ /* loadData بتعرض خطأها لحالها */ }
        if(document.getElementById('treasury-view').style.display !== 'none'){ renderTreasuryView(); }
        renderKPIs();
        renderTable();
        renderQuotesList();
        updateTasksBadge();
        return;
      }
      if(document.getElementById('treasury-view').style.display !== 'none'){ renderTreasuryView(); }
      renderKPIs();
      renderTable();
      renderQuotesList();
      updateTasksBadge();
      updateSuppliersBadge();
      updateCustomersBadge();
      showToast('تم استيراد البيانات بنجاح', 'ok');
    }
  });
}

function consumeNotifUrlParam(){
  const params = new URLSearchParams(location.search);
  if(params.get('notif') !== '1') return false;
  params.delete('notif');
  const qs = params.toString();
  history.replaceState(null, '', location.pathname + (qs ? ('?'+qs) : ''));
  return true;
}

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i=0; i<rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

function isIosNonStandalone(){
  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  return isIos && !isStandalone;
}

function pushSupported(){
  return ('serviceWorker' in navigator) && ('PushManager' in window);
}

async function getExistingPushSubscription(){
  if(!pushSupported()) return null;
  try{
    const reg = await navigator.serviceWorker.getRegistration();
    if(!reg) return null;
    return await reg.pushManager.getSubscription();
  }catch(e){ return null; }
}

function updatePushButtonUi(subscribed){

}

async function refreshPushButtonState(){
  const btn = document.getElementById('btn-push-toggle');
  if(!btn) return;
  if(!pushSupported()){ btn.style.display = 'none'; return; }
  const sub = await getExistingPushSubscription();
  updatePushButtonUi(!!sub);
}

async function subscribeToPush(){
  if(isIosNonStandalone()){
    showToast('لازم تضيف الموقع لشاشتك الرئيسية أولًا (زر المشاركة ← إضافة للشاشة الرئيسية بالآيفون) وتفتحه من هناك', 'error');
    return;
  }
  if(!pushSupported()){ showToast('متصفحك ما يدعم إشعارات push', 'error'); return; }
  try{
    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){
      showToast('ما وافقت على الإشعارات من إعدادات المتصفح', 'error');
      return;
    }
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(PUSH_VAPID_PUBLIC_KEY)
      });
    }
    const subJson = sub.toJSON();
    const { error } = await sb.from('push_subscriptions').upsert({
      email: presenceEmail,
      endpoint: subJson.endpoint,
      p256dh: subJson.keys.p256dh,
      auth: subJson.keys.auth
    }, { onConflict: 'endpoint' });
    if(error){ showToast('تعذر حفظ الاشتراك: ' + error.message, 'error'); return; }
    updatePushButtonUi(true);
    showToast('تفعّلت الإشعارات على هذا الجهاز', 'ok');
  }catch(e){
    showToast('تعذر تفعيل الإشعارات: ' + (e && e.message ? e.message : ''), 'error');
  }
}

async function unsubscribeFromPush(){
  try{
    const sub = await getExistingPushSubscription();
    if(sub){
      const endpoint = sub.endpoint;
      await sub.unsubscribe();
      if(sb) await sb.from('push_subscriptions').delete().eq('endpoint', endpoint);
    }
    updatePushButtonUi(false);
    showToast('تم إيقاف الإشعارات على هذا الجهاز', 'ok');
  }catch(e){
    showToast('تعذر إيقاف الإشعارات', 'error');
  }
}

async function togglePushSubscription(){
  const sub = await getExistingPushSubscription();
  if(sub) await unsubscribeFromPush();
  else await subscribeToPush();
}

function applyRemoteOrderChange(payload){
  if(!Array.isArray(appData.orders)) appData.orders = [];
  if(payload.eventType === 'DELETE'){
    const oldId = payload.old && payload.old.id;
    if(!oldId) return;
    appData.orders = appData.orders.filter(o=>o.id!==oldId);
    // الطلبية يلي المستخدم فاتحها حاليًا انحذفت من جلسة تانية — تركها مفتوحة كان يخلي أي طلب
    // تعديل/اقتراح تسعير لاحق يتيتّم بصمت (order_id ما إله FK، فالإدخال ينجح لكن يعلق للأبد
    // بلا مراجع). نسكّر فورًا مع تنبيه واضح.
    if(draft && draft.id === oldId){
      closeModal();
      showToast('هذه الطلبية انحذفت من مكان تاني — سكّرنا النافذة', 'error');
    }
    if(quoteDraft && quoteDraft.id === oldId){
      closeQuoteModal();
      showToast('هذه الطلبية انحذفت من مكان تاني — سكّرنا النافذة', 'error');
    }
  } else {
    const row = payload.new;
    if(!row || !row.id) return;
    const order = orderRowToObject(row);
    const idx = appData.orders.findIndex(o=>o.id===order.id);
    if(idx>=0) appData.orders[idx] = order; else appData.orders.push(order);
  }
  renderKPIs();
  renderTable();
  renderQuotesList();
  updateCustomersBadge();
  updateSuppliersBadge();
  if(document.getElementById('treasury-view').style.display !== 'none'){ renderTreasuryView(); }
  // زي applyRemoteSupplierChange/applyRemoteCustomerChange بالضبط — ما نعيد بناء القائمة لو
  // في صف تعديل مفتوح حاليًا (editingSuppliers/editingCustomers)، حتى ما نمسح كتابة لسه ما
  // انحفظت (الحقول بتتحفظ عند blur بس، مش أول ما تتغيّر).
  if(document.getElementById('suppliers-view').style.display !== 'none' && Object.keys(editingSuppliers).length===0){ refreshSuppliersList(); }
  if(document.getElementById('customers-view').style.display !== 'none' && Object.keys(editingCustomers).length===0){ refreshCustomersList(); }
  refreshArchiveViewIfOpen();
  // صاحب الحساب لو فاتح شاشة سداد التشاليح/الجديد وقت وصول تعديل من مكان تاني — نحدّثها كمان
  const scrapRoot = document.getElementById('scrapyard-root');
  if(scrapRoot && scrapRoot.style.display !== 'none' && scrapyardSharedState.canManage && scrapyardCurrentScreen === 'settlement'){
    if(!scrapyardHasOpenEdit()) loadScrapyardData(scrapyardSharedState.activeKind).then(renderScrapyardView);
  }
}

/* ترجع true بس لو الحفظ نجح فعليًا بقاعدة البيانات.
   ملاحظة مهمة: .update() بدون .select() بترجع بلا خطأ حتى لو ما مسّت ولا صف (صلاحيات RLS
   فلترت الصف، أو الصف انحذف من مكان تاني) — يعني الفشل كان يبان زي النجاح تمامًا. لهيك
   بنطلب الصفوف المتأثرة ونعتبر "صفر صفوف" فشلًا. كل مستدعي لازم يفحص القيمة الراجعة قبل
   ما يعتبر الحفظ تمّ (يقفل النافذة، يمسح isNew، يحذف اقتراح...). */
async function persistOrder(order, isNew){
  try{
    if(!sb) throw new Error('NO_DB');
    const row = orderObjectToRow(order);
    const { data, error } = isNew
      ? await sb.from('orders').insert(row).select('id')
      : await sb.from('orders').update(row).eq('id', order.id).select('id');
    if(error) throw error;
    if(!data || !data.length){
      showToast('تعذر حفظ الطلبية — يبدو إنها اتغيّرت أو انحذفت من مكان تاني، أو ما عندك صلاحية عليها. أغلق النافذة وافتحها من جديد', 'error');
      return false;
    }
    return true;
  }catch(e){
    if(e && e.code === '23505'){
      showToast('رقم الطلبية '+order.orderNumber+' صار مستخدم لطلبية أخرى (على الأغلب حُفظت طلبيتان بنفس اللحظة) — أغلق النافذة وافتحها من جديد', 'error');
    } else {
      showToast('تعذر حفظ الطلبية: ' + (e && e.message ? e.message : ''), 'error');
    }
    return false;
  }
}

/* نفس فكرة persistOrder — .delete() بترجع بلا خطأ حتى لو RLS منعت الحذف (صفر صفوف)،

/* استبدال محتوى جدول بمحتوى نسخة احتياطية، بدون خطر تفريغ الجدول:
   1) بنجيب معرّفات الصفوف الموجودة، وبنحدد يلي مش موجودة بالنسخة (يعني الاستيراد قاصد يشيلها).
   2) بنحذف هدول أولًا — لازم قبل الحفظ، لأن orders.order_number عليه قيد UNIQUE: لو صف قديم
      رح ينحذف أصلًا كان ماسك رقم طلبية موجود بالنسخة، الحفظ قبل الحذف كان بيرمي 23505
      ويوقف الاستيراد كله قبل ما يُكتب ولا صف.
   3) بنحفظ (upsert) صفوف النسخة.
   الصفوف الموجودة بالجهتين ما بتتحذف أبدًا، فأسوأ فشل بالمنتصف بيشيل صفوف الاستيراد قاصد
   يشيلها أصلًا — مش تفريغ الجدول.
   ملاحظة: بنستخدم .in() بمصفوفة (supabase-js بيهرّب القيم لحاله) بدل بناء نص الاستعلام يدويًا —
   المعرّفات نص حر وكان معرّف فيه علامة تنصيص بيكسر الاستعلام. وبنقسّم على دفعات حتى ما يطول الرابط. */
async function replaceAllRowsSafely(table, rows){
  const CHUNK = 100;
  const keepIds = new Set(rows.map(r=>r.id));

  const { data: existing, error: selError } = await sb.from(table).select('id');
  if(selError) throw selError;
  const toDelete = (existing||[]).map(r=>r.id).filter(id=>!keepIds.has(id));

  for(let i=0; i<toDelete.length; i+=CHUNK){
    const { error } = await sb.from(table).delete().in('id', toDelete.slice(i, i+CHUNK));
    if(error) throw error;
  }
  for(let i=0; i<rows.length; i+=CHUNK){
    const { error } = await sb.from(table).upsert(rows.slice(i, i+CHUNK));
    if(error) throw error;
  }
}

async function replaceAllOrders(ordersArray){
  if(!sb) return;

function applyRemoteTreasuryChange(payload){
  if(!appData.treasury) appData.treasury = defaultTreasury();
  if(payload.eventType === 'DELETE'){
    const oldId = payload.old && payload.old.id;
    if(!oldId) return;
    Object.keys(appData.treasury).forEach(cat=>{
      if(Array.isArray(appData.treasury[cat])) appData.treasury[cat] = appData.treasury[cat].filter(e=>e.id!==oldId);
    });
  } else {
    const row = payload.new;
    if(!row || !row.category) return;
    if(!Array.isArray(appData.treasury[row.category])) appData.treasury[row.category] = [];
    const entry = { id: row.id, amount: row.amount, date: row.date||'', note: row.note||'' };
    const idx = appData.treasury[row.category].findIndex(e=>e.id===entry.id);
    if(idx>=0) appData.treasury[row.category][idx] = entry; else appData.treasury[row.category].push(entry);
  }
  const view = document.getElementById('treasury-view');
  if(view && view.style.display !== 'none'){ renderTreasuryView(); }
  // renderKPIs بتلمس #kpi-row يلي موجود بـ#app-root بس — لدور المشتريات (شاشة منفصلة) بترمي
  // أو ما بتعمل شي، فبنستدعيها لصاحب الحساب بس، وبنحدّث شاشة التسوية لو هو واقف عليها.
  const scrapRoot = document.getElementById('scrapyard-root');
  const onScrapyardScreen = scrapRoot && scrapRoot.style.display !== 'none';
  if(!onScrapyardScreen){
    renderKPIs(); // مؤشر "مستحق للتشليح" بالرئيسية (dueToScrapyard - amerCustodyBalance) لازم يتحدّث حتى لو شاشة الصندوق مقفولة
  } else if(scrapyardCurrentScreen === 'settlement' && scrapyardSharedState.activeKind === 'used' && !scrapyardHasOpenEdit()){
    // رصيد العهدة بيتغيّر بتعديل حركة صندوق — شاشة التسوية كانت تضل تعرض الرصيد القديم
    loadScrapyardData('used').then(renderScrapyardView);
  }
}

  if(payload.eventType === 'DELETE'){
    const oldId = payload.old && payload.old.id;
    if(!oldId) return;
    appData.customers = appData.customers.filter(c=>c.id!==oldId);
  } else {
    const row = payload.new;
    if(!row || !row.id) return;
    const customer = { id: row.id, name: row.name||'', phone: row.phone||'', notes: row.notes||'', createdAt: row.created_at || '' };
    const idx = appData.customers.findIndex(c=>c.id===customer.id);
    if(idx>=0) appData.customers[idx] = customer; else appData.customers.push(customer);
  }
  updateCustomersBadge();
  const view = document.getElementById('customers-view');
  // نفس ملاحظة applyRemoteSupplierChange — تجنّب تصفير أي تعديل مفتوح غير محفوظ بالقائمة
  if(view && view.style.display !== 'none' && Object.keys(editingCustomers).length===0){ refreshCustomersList(); }
}

async function persistCustomer(customer){

    const { error } = await sb.from('customers').upsert({ id: customer.id, name: customer.name||'', phone: customer.phone||'', notes: customer.notes||'' });

function supplierOwedAmount(supplierId){
  let total = 0;
  (appData.orders||[]).forEach(o=>{
    if(!o.supplied) return; // قبل اتمام التوريد ما يُحسب على المورد شي — بس يترتبط بالطلبية لغرض التحليل لاحقًا
    (o.parts||[]).forEach(p=>{
      if(p.supplierId !== supplierId) return;
      if(p.returned) return; // القطعة المرتجعة لها حسابها المنفصل (مسترجع بانتظار التحصيل)، مو ضمن المستحق العادي
      if(!partIsIncludedInOrder(o,p)) return; // قطعة مستبعدة يدويًا من الطلبية — ما تُحسب
      const paid = p.used ? o.paidToAmer : o.paidToSupplier;
      if(paid) return;
      total += (Number(p.qty)||1) * (Number(p.costPrice)||0);
    });
  });
  return round2(total);
}

function isoToDisplayDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '—';
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}

/* سجل مشتريات المورد — مقسّم لجارية (غير مسددة) وسابقة (مسددة)، كل صف يفتح طلبيته */
/* مجمّعة بالطلبية — مو بكل قطعة لحالها؛ الضغط يفتح الطلبية ويفرّد القطع هناك */
function supplierPurchaseHistory(supplierId){
  const ongoingMap = {}, pastMap = {};
  const ongoing = [], past = [];
  (appData.orders||[]).forEach(o=>{
    if(!o.supplied) return; // قبل اتمام التوريد الطلبية ما تظهر بسجل المشتريات، بس الربط محفوظ
    (o.parts||[]).forEach(p=>{
      if(p.supplierId !== supplierId) return;
      if(p.returned) return; // القطعة المرتجعة لها حسابها المنفصل (مسترجع بانتظار التحصيل)، مو ضمن سجل المشتريات العادي
      if(!partIsIncludedInOrder(o,p)) return; // قطعة مستبعدة يدويًا من الطلبية — ما تُحسب
      const paid = p.used ? o.paidToAmer : o.paidToSupplier;
      const map = paid ? pastMap : ongoingMap;
      const list = paid ? past : ongoing;
      if(!map[o.id]){
        map[o.id] = {
          orderId: o.id, orderNumber: o.orderNumber, orderLabel: o.orderLabel,
          amount: 0, count: 0, date: o.suppliedAt || o.updatedAt || o.createdAt || ''
        };
        list.push(map[o.id]);
      }
      map[o.id].amount = round2(map[o.id].amount + (Number(p.qty)||1) * (Number(p.costPrice)||0));
      map[o.id].count++;
    });
  });
  const byDateDesc = (a,b)=> new Date(b.date||0) - new Date(a.date||0);
  ongoing.sort(byDateDesc); past.sort(byDateDesc);
  return { ongoing, past };
}

/* قطع رجعها الزبون بعد ما كانت مدفوعة للمورد مسبقًا — المورد صار يستحق ردّها لحد ما تُحصّل فعليًا */
function supplierReturnReceivables(supplierId){
  const rows = [];
  (appData.orders||[]).forEach(o=>{
    if(!o.confirmed) return; // الإرجاع بكل تفرعاته يخص الطلبيات المؤكدة فقط
    (o.parts||[]).forEach(p=>{
      if(p.supplierId !== supplierId) return;
      if(!p.returned || !p.returnHasReceivable || p.returnCollected) return;
      if(!partIsIncludedInOrder(o,p)) return; // قطعة مستبعدة يدويًا من الطلبية — ما تُحسب
      rows.push({
        orderId: o.id, orderNumber: o.orderNumber, orderLabel: o.orderLabel, partId: p.id,
        description: p.description||'', amount: round2((Number(p.qty)||1)*(Number(p.costPrice)||0)),
        used: !!p.used
      });
    });
  });
  return rows;
}

function supplierReturnReceivableTotal(supplierId){
  return round2(supplierReturnReceivables(supplierId).reduce((s,r)=>s+r.amount,0));
}

function openSupplierHistoryModal(supplierId){
  const supplier = (appData.suppliers||[]).find(s=>s.id===supplierId);
  const label = supplier ? (supplier.name||supplier.phone||'مورد') : 'مورد';
  const { ongoing, past } = supplierPurchaseHistory(supplierId);
  const ongoingTotal = round2(ongoing.reduce((s,r)=>s+r.amount,0));
  const pastTotal = round2(past.reduce((s,r)=>s+r.amount,0));
  const receivables = supplierReturnReceivables(supplierId);
  const receivablesTotal = round2(receivables.reduce((s,r)=>s+r.amount,0));
  const root = document.getElementById('modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" data-close-backdrop>' +
      '<div class="modal-card modal-card-sm" role="dialog" aria-modal="true">' +
        '<div class="modal-header"><div class="modal-title">سجل مشتريات — '+escapeHtml(label)+'</div>' +
          '<button type="button" class="icon-btn" id="supplier-history-close-btn" aria-label="إغلاق">✕</button></div>' +
        (receivables.length ? '<div class="purchase-history-section">' +
          '<div class="purchase-history-section-title"><span>مرتجعات بانتظار التحصيل</span><span class="num text-green">'+fmtMoney(receivablesTotal)+'</span></div>' +
          receivables.map(returnReceivableRowHtml).join('') +

        '<div class="purchase-history-section">' +
          '<div class="purchase-history-section-title"><span>جارية (غير مسددة)</span><span class="num text-rust">'+fmtMoney(ongoingTotal)+'</span></div>' +
          (ongoing.length ? ongoing.map(purchaseHistoryRowHtml).join('') : '<div class="expense-empty-hint">ما فيه مشتريات جارية</div>') +
        '</div>' +
        '<div class="purchase-history-section">' +
          '<div class="purchase-history-section-title"><span>سابقة (مسددة)</span><span class="num text-green">'+fmtMoney(pastTotal)+'</span></div>' +
          (past.length ? past.map(purchaseHistoryRowHtml).join('') : '<div class="expense-empty-hint">ما فيه مشتريات سابقة</div>') +
        '</div>' +
      '</div>' +
    '</div>';

  const close = ()=>{ root.innerHTML=''; root.classList.remove('modal-open'); };
  root.querySelector('[data-close-backdrop]').addEventListener('click', e=>{
    if(e.target.hasAttribute('data-close-backdrop')) close();
  });

  root.querySelectorAll('[data-open-order]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      close();
      openModal('edit', btn.getAttribute('data-open-order'));
    });
  });
  root.querySelectorAll('.return-collect-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const orderId = btn.getAttribute('data-order-id');
      const partId = btn.getAttribute('data-part-id');
      const isUsed = btn.getAttribute('data-used')==='1';
      if(isUsed){
        confirmCollectScrapyardReturn(orderId, partId, supplierId);
      } else {
        confirmAction({
          title: 'تأكيد تحصيل هذا المبلغ من المورد؟',
          message: 'رح يُضاف المبلغ تلقائيًا لصافي الصندوق.',
          confirmLabel: 'تم التحصيل',
          onConfirm: async ()=>{
            const order = appData.orders.find(o=>o.id===orderId);
            if(!order) return;
            const part = (order.parts||[]).find(p=>p.id===partId);
            if(!part) return;
            const prevUpdatedAt = order.updatedAt;
            part.returnCollected = true;
            order.updatedAt = new Date().toISOString();
            const saved = await persistOrder(order);
            if(!saved){ part.returnCollected = false; order.updatedAt = prevUpdatedAt; return; }
            showToast('تم تسجيل التحصيل، وأُضيف المبلغ للصندوق', 'ok');

/* تحصيل مرتجع من تشليح: دايمًا يروح لرصيد المشتريات — نفس أثر أي تحصيل تشليح
   عادي، الصندوق ما يتأثر مباشرة. لو صاحب الحساب يبي يرجع المبلغ فعليًا للصندوق، عنده "سحب من
   العهدة" بشاشة الصندوق (منفصل عن التحصيل نفسه). */
function confirmCollectScrapyardReturn(orderId, partId, supplierId){
  confirmAction({
    title: 'تأكيد تحصيل هذا المبلغ من التشليح؟',
    message: 'رح يُضاف لرصيد المشتريات. لو تبي ترجعه للصندوق، فيه "سحب من العهدة" بشاشة الصندوق.',
    confirmLabel: 'تم التحصيل',
    onConfirm: async ()=>{
      const order = appData.orders.find(o=>o.id===orderId);
      if(!order) return;
      const part = (order.parts||[]).find(p=>p.id===partId);
      if(!part) return;
      const prevUpdatedAt = order.updatedAt;
      part.returnCollected = true;
      order.updatedAt = new Date().toISOString();
      const saved = await persistOrder(order);
      if(!saved){ part.returnCollected = false; order.updatedAt = prevUpdatedAt; return; }
      showToast('تم تسجيل التحصيل، وأُضيف لرصيد المشتريات', 'ok');
      refreshSuppliersList();
      updateSuppliersBadge();
      renderKPIs();
      if(document.getElementById('treasury-view') && document.getElementById('treasury-view').style.display !== 'none') renderTreasuryView();
      openSupplierHistoryModal(supplierId);
    }
  });
}

function suppliersMatchingSearch(){
  const q = suppliersSearchQuery.trim().toLowerCase();
  let rows = appData.suppliers||[];
  if(suppliersKindFilter==='new') rows = rows.filter(s=>s.handlesNew);
  else if(suppliersKindFilter==='used') rows = rows.filter(s=>s.handlesUsed);
  if(q){
    rows = rows.filter(s=>{
      const hay = [s.name, s.phone].concat(Array.isArray(s.extraPhones)?s.extraPhones:[]).join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  // اللي عندهم مسترجع بانتظار التحصيل يطلعوا فوق، وبعدها الأحدث إضافة فوق
  return [...rows].sort((a,b)=>{
    const ap = supplierReturnReceivableTotal(a.id)>0 ? 1 : 0;
    const bp = supplierReturnReceivableTotal(b.id)>0 ? 1 : 0;
    if(bp-ap) return bp-ap;
    return new Date(b.createdAt||0) - new Date(a.createdAt||0);
  });
}

    if(!name && !phone){ showToast('اكتب اسم أو رقم جوال على الأقل', 'error'); return; }
    if(!handlesNewCheck.checked && !handlesUsedCheck.checked){
      showToast('لازم تحدد نوع واحد على الأقل (قطع جديدة/مستعملة)', 'error');
      return;
    }
    const dup = findDuplicateSupplier(name, phone);
    if(dup){ showToast('مورد موجود مسبقًا بنفس الاسم أو الرقم: '+(dup.name||dup.phone||'مورد'), 'error'); return; }
    const newSupplier = {
      id: uid('sup'), name, phone, notes:'', extraPhones: [],
      handlesNew: handlesNewCheck.checked, handlesUsed: handlesUsedCheck.checked,
      createdAt: new Date().toISOString()
    };
    if(!Array.isArray(appData.suppliers)) appData.suppliers = [];
    // الحفظ بالقاعدة أولًا — لو فشل، ما نضيفه للقائمة ولا نفرّغ الحقول حتى يقدر يعيد المحاولة
    const saved = await persistSupplier(newSupplier);
    if(!saved) return;
    appData.suppliers.push(newSupplier);
    nameInput.value = ''; phoneInput.value = '';
    handlesNewCheck.checked = false; handlesUsedCheck.checked = false;
    refreshSuppliersList();
    updateSuppliersBadge();
  });
  const searchInput = document.getElementById('suppliers-search-input');
  searchInput.addEventListener('input', e=>{
    suppliersSearchQuery = e.target.value;
    refreshSuppliersList();
  });
  bindSupplierRowEvents();
}

function bindSupplierRowEvents(){
  document.querySelectorAll('#suppliers-items-list .task-item-row').forEach(row=>{
    const sid = row.getAttribute('data-supplier-id');
    const supplier = (appData.suppliers||[]).find(s=>s.id===sid);
    if(!supplier) return;

    const historyBtn = row.querySelector('.supplier-history-btn');
    if(historyBtn) historyBtn.addEventListener('click', ()=> openSupplierHistoryModal(sid));

    const contactBtn = row.querySelector('.supplier-contact-btn');
    if(contactBtn) contactBtn.addEventListener('click', ()=> openContactModal(supplier.phone, 'المورد'));

    const removeBtn = row.querySelector('.task-item-remove-btn');
    if(removeBtn){
      removeBtn.addEventListener('click', ()=>{
        const pendingReceivable = supplierReturnReceivableTotal(sid);
        confirmAction({
          title: 'حذف هذا المورد؟',
          message: (pendingReceivable>0
            ? '⚠️ عنده مسترجع بانتظار التحصيل بقيمة '+fmtMoney(pendingReceivable)+' — بيختفي فورًا من قائمة الموردين ومؤشرات الرئيسية/الصندوق لو حذفته. '
            : '') + 'الطلبيات القديمة المرتبطة به بتبقى، بس بدون اسم مورد محدد.',
          confirmLabel: 'تأكيد الحذف',
          dangerous: true,
          onConfirm: async ()=>{
            // الحذف من القاعدة أولًا — انظر ملاحظة confirmDeleteExpenseEntry
            const deleted = await deleteSupplier(sid);
            if(!deleted) return;
            appData.suppliers = (appData.suppliers||[]).filter(s=>s.id!==sid);
            delete editingSuppliers[sid];
            refreshSuppliersList();
            updateSuppliersBadge();
          }
        });
      });
    }

    const editBtn = row.querySelector('.supplier-edit-btn');
    if(editBtn){
      editBtn.addEventListener('click', ()=>{
        editingSuppliers[sid] = true;
        refreshSuppliersList();
      });
    }

    const saveBtn = row.querySelector('.supplier-save-btn');
    if(saveBtn){
      saveBtn.addEventListener('click', ()=>{
        delete editingSuppliers[sid];
        refreshSuppliersList();
      });
    }

    // نجيب أحدث نسخة من appData.suppliers لحظة كل تعديل فعلي (مش نعتمد على مرجع `supplier`
    // الملتقط وقت الربط) — لو وصل تعديل تزامني من جلسة تانية بمنتصف التحرير، applyRemoteSupplierChange
    // بيستبدل appData.suppliers[idx] بكائن جديد كليًا، والمرجع القديم يضل معزول عنه فيكتب حفظه فوق التعديل التاني.
    const freshSupplier = ()=> (appData.suppliers||[]).find(x=>x.id===sid) || supplier;

    const nameInput = row.querySelector('.supplier-name-input');
    if(nameInput){
      nameInput.addEventListener('change', async e=>{
        const s = freshSupplier(); const prev = { name: s.name };
        s.name = e.target.value;
        await persistFieldOrRevert(s, prev, persistSupplier, refreshSuppliersList);
      });
    }
    const phoneInput = row.querySelector('.supplier-phone-input');
    if(phoneInput){
      phoneInput.addEventListener('change', async e=>{
        const s = freshSupplier(); const prev = { phone: s.phone };
        s.phone = e.target.value;
        await persistFieldOrRevert(s, prev, persistSupplier, refreshSuppliersList);
      });
    }
    const addPhoneBtn = row.querySelector('.supplier-add-phone-btn');
    if(addPhoneBtn){
      addPhoneBtn.addEventListener('click', async ()=>{
        const s = freshSupplier();
        if(!Array.isArray(s.extraPhones)) s.extraPhones = [];
        const prev = { extraPhones: s.extraPhones.slice() };
        s.extraPhones.push('');
        refreshSuppliersList();
        await persistFieldOrRevert(s, prev, persistSupplier, refreshSuppliersList);
      });
    }
    const handlesNewCheck = row.querySelector('.supplier-handles-new-check');
    if(handlesNewCheck){
      handlesNewCheck.addEventListener('change', async e=>{
        const s = freshSupplier();
        if(!e.target.checked && !s.handlesUsed){
          e.target.checked = true;
          showToast('لازم تحدد نوع واحد على الأقل', 'error');
          return;
        }
        const prev = { handlesNew: s.handlesNew };
        s.handlesNew = e.target.checked;
        await persistFieldOrRevert(s, prev, persistSupplier, refreshSuppliersList);
      });
    }
    const handlesUsedCheck = row.querySelector('.supplier-handles-used-check');
    if(handlesUsedCheck){
      handlesUsedCheck.addEventListener('change', async e=>{
        const s = freshSupplier();
        if(!e.target.checked && !s.handlesNew){
          e.target.checked = true;
          showToast('لازم تحدد نوع واحد على الأقل', 'error');
          return;
        }
        const prev = { handlesUsed: s.handlesUsed };
        s.handlesUsed = e.target.checked;
        await persistFieldOrRevert(s, prev, persistSupplier, refreshSuppliersList);
      });
    }
    row.querySelectorAll('.supplier-extra-phone-input').forEach(inp=>{
      inp.addEventListener('change', async e=>{
        const idx = Number(inp.getAttribute('data-phone-index'));
        const s = freshSupplier();
        const prev = { extraPhones: s.extraPhones.slice() };
        s.extraPhones[idx] = e.target.value;
        await persistFieldOrRevert(s, prev, persistSupplier, refreshSuppliersList);
      });
    });
    row.querySelectorAll('.supplier-remove-phone-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const idx = Number(btn.getAttribute('data-phone-index'));
        const s = freshSupplier();
        const prev = { extraPhones: s.extraPhones.slice() };
        s.extraPhones.splice(idx, 1);
        refreshSuppliersList();
        await persistFieldOrRevert(s, prev, persistSupplier, refreshSuppliersList);
      });
    });
  });
}

function closeCustomersView(){
  document.getElementById('customers-view').style.display = 'none';

}

function customerOrderStats(customerId){
  let count = 0, remaining = 0;
  (appData.orders||[]).forEach(o=>{
    if(o.customerId !== customerId) return;
    if(!o.supplied) return; // قبل اتمام التوريد ما تُحسب على العميل — بس الربط محفوظ لغرض التحليل لاحقًا
    count++;
    const t = orderTotals(o);
    if(t.hasSell) remaining += t.customerRemaining;
  });
  return { count, remaining: round2(remaining) };
}

/* قطع رجعها العميل ودفع ثمنها مسبقًا — لازم إرجاع مبلغها له، ما تُخصم من الصندوق إلا بعد تأكيد صريح */
function customerRefundsPending(customerId){
  const rows = [];
  (appData.orders||[]).forEach(o=>{
    if(o.customerId !== customerId) return;
    if(!o.confirmed) return; // الإرجاع بكل تفرعاته يخص الطلبيات المؤكدة فقط
    (o.parts||[]).forEach(p=>{
      if(!p.returned || p.customerRefundConfirmed) return;
      if(!partIsIncludedInOrder(o,p)) return; // قطعة مستبعدة يدويًا من الطلبية — ما تُحسب
      const adjustment = (o.customerPayments||[]).find(pay=>pay.returnAdjustment && pay.linkedPartId===p.id);
      if(!adjustment) return;
      rows.push({
        orderId: o.id, orderNumber: o.orderNumber, orderLabel: o.orderLabel, partId: p.id,
        description: p.description||'', amount: round2(Number(adjustment.amount)||0)
      });
    });
  });
  return rows;
}

function customerRefundTotal(customerId){
  return round2(customerRefundsPending(customerId).reduce((s,r)=>s+r.amount,0));
}

function customerRefundRowHtml(row){

    '</div>' +
  '</div>';
}

/* سجل طلبيات العميل — مقسّم لجارية (لسه ما تسدد بالكامل) وسابقة (مسددة)، كل صف يفتح طلبيته */
function customerOrderHistory(customerId){
  const ongoing = [], past = [];
  (appData.orders||[]).forEach(o=>{
    if(o.customerId !== customerId) return;
    if(!o.supplied) return; // قبل اتمام التوريد الطلبية ما تظهر بسجل العميل، بس الربط محفوظ
    const t = orderTotals(o);
    const row = {
      orderId: o.id, orderNumber: o.orderNumber, orderLabel: o.orderLabel,
      total: t.hasSell ? t.sellTotal : 0, remaining: t.hasSell ? t.customerRemaining : 0,
      hasSell: t.hasSell,
      date: o.updatedAt || o.createdAt || ''
    };
    // طلبية توردت بس لسه ما تسعّرت للبيع (!hasSell) لسه محتاجة متابعة — تُحسب "جارية"،
    // مش "سابقة (مسددة)" — كانت تختفي عن متابعة العميل النشطة غلط.
    (!t.hasSell || t.customerRemaining>0 ? ongoing : past).push(row);
  });
  const byDateDesc = (a,b)=> new Date(b.date||0) - new Date(a.date||0);
  ongoing.sort(byDateDesc); past.sort(byDateDesc);
  return { ongoing, past };
}

function orderHistoryRowHtml(row){
  const amountHtml = row.hasSell===false
    ? '<span class="num text-amber">بانتظار تسعير</span>'
    : '<span class="num '+(row.remaining>0?'text-rust':'text-green')+'">'+fmtMoney(row.remaining>0?row.remaining:row.total)+'</span>';
  return '<button type="button" class="purchase-history-row" data-open-order="'+escapeHtml(row.orderId)+'">' +
    '<div class="purchase-history-row-main">' +
      '<span class="purchase-history-desc">'+escapeHtml(row.orderNumber||'')+(row.orderLabel?' — '+escapeHtml(row.orderLabel):'')+'</span>' +
      amountHtml +
    '</div>' +
    '<div class="purchase-history-row-sub"><span>'+isoToDisplayDate(row.date)+'</span></div>' +
  '</button>';
}

function openCustomerHistoryModal(customerId){
  const customer = (appData.customers||[]).find(c=>c.id===customerId);
  const label = customer ? (customer.name||customer.phone||'عميل') : 'عميل';
  const { ongoing, past } = customerOrderHistory(customerId);
  const ongoingTotal = round2(ongoing.reduce((s,r)=>s+r.remaining,0));
  const pastTotal = round2(past.reduce((s,r)=>s+r.total,0));
  const refunds = customerRefundsPending(customerId);
  const refundsTotal = round2(refunds.reduce((s,r)=>s+r.amount,0));
  const root = document.getElementById('modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" data-close-backdrop>' +
      '<div class="modal-card modal-card-sm" role="dialog" aria-modal="true">' +
        '<div class="modal-header"><div class="modal-title">سجل طلبيات — '+escapeHtml(label)+'</div>' +
          '<button type="button" class="icon-btn" id="customer-history-close-btn" aria-label="إغلاق">✕</button></div>' +
        (refunds.length ? '<div class="purchase-history-section">' +
          '<div class="purchase-history-section-title"><span>يجب إرجاعه للعميل</span><span class="num text-rust">'+fmtMoney(refundsTotal)+'</span></div>' +
          refunds.map(customerRefundRowHtml).join('') +
        '</div>' : '') +
        '<div class="purchase-history-section">' +
          '<div class="purchase-history-section-title"><span>جارية (لم تُسدد بالكامل)</span><span class="num text-rust">'+fmtMoney(ongoingTotal)+'</span></div>' +
          (ongoing.length ? ongoing.map(orderHistoryRowHtml).join('') : '<div class="expense-empty-hint">ما فيه طلبيات جارية</div>') +
        '</div>' +
        '<div class="purchase-history-section">' +
          '<div class="purchase-history-section-title"><span>سابقة (مسددة)</span><span class="num text-green">'+fmtMoney(pastTotal)+'</span></div>' +
          (past.length ? past.map(orderHistoryRowHtml).join('') : '<div class="expense-empty-hint">ما فيه طلبيات سابقة</div>') +
        '</div>' +
      '</div>' +
    '</div>';
  root.classList.add('modal-open');
  const close = ()=>{ root.innerHTML=''; root.classList.remove('modal-open'); };
  root.querySelector('[data-close-backdrop]').addEventListener('click', e=>{
    if(e.target.hasAttribute('data-close-backdrop')) close();
  });
  root.querySelector('#customer-history-close-btn').addEventListener('click', close);
  root.querySelectorAll('[data-open-order]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      close();
      openModal('edit', btn.getAttribute('data-open-order'));
    });
  });
  root.querySelectorAll('.customer-refund-confirm-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const orderId = btn.getAttribute('data-order-id');
      const partId = btn.getAttribute('data-part-id');
      confirmAction({
        title: 'تأكيد إرجاع هذا المبلغ للعميل؟',
        message: 'رح يُخصم المبلغ تلقائيًا من صافي الصندوق.',
        confirmLabel: 'تم الإرجاع',
        dangerous: true,
        onConfirm: async ()=>{
          const order = appData.orders.find(o=>o.id===orderId);
          if(!order) return;
          const part = (order.parts||[]).find(p=>p.id===partId);
          if(!part) return;
          const prevUpdatedAt = order.updatedAt;
          part.customerRefundConfirmed = true;
          order.updatedAt = new Date().toISOString();
          const saved = await persistOrder(order);
          if(!saved){ delete part.customerRefundConfirmed; order.updatedAt = prevUpdatedAt; return; }
          showToast('تم تسجيل إرجاع المبلغ، وخُصم من الصندوق', 'ok');
          refreshCustomersList();
          updateCustomersBadge();
          renderKPIs();
          openCustomerHistoryModal(customerId);
        }
      });
    });
  });
}

let customersSearchQuery = '';
function customersMatchingSearch(){
  const q = customersSearchQuery.trim().toLowerCase();
  let rows = appData.customers||[];
  if(q){
    rows = rows.filter(c=>{
      const hay = [c.name, c.phone].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  // اللي لازم يرجعلهم مبلغ (بانتظار التحويل) يطلعوا فوق، وبعدها الأحدث إضافة فوق
  return [...rows].sort((a,b)=>{
    const ap = customerRefundTotal(a.id)>0 ? 1 : 0;
    const bp = customerRefundTotal(b.id)>0 ? 1 : 0;
    if(bp-ap) return bp-ap;
    return new Date(b.createdAt||0) - new Date(a.createdAt||0);
  });
}

function customersItemsListHtml(){
  const rows = customersMatchingSearch();
  if(!rows.length) return '<div class="expense-empty-hint">'+(customersSearchQuery.trim() ? 'ما فيه نتائج مطابقة' : 'ما فيه عملاء مضافين بعد')+'</div>';
  return rows.map(customerRowHtml).join('');
}

  if(!list) return;

  bindCustomerRowEvents();
}

  const el = document.getElementById('customers-view');
  el.innerHTML = customersViewHtml();
  bindCustomersViewEvents();
}

function bindCustomersViewEvents(){
  document.getElementById('btn-back-to-orders-from-customers').addEventListener('click', closeCustomersView);
  bindBusyButton(document.getElementById('add-customer-btn'), async ()=>{
    const nameInput = document.getElementById('new-customer-name-input');
    const phoneInput = document.getElementById('new-customer-phone-input');
    const name = nameInput.value.trim();
    const phone = phoneInput.value.trim();
    if(!name && !phone){ showToast('اكتب اسم أو رقم جوال على الأقل', 'error'); return; }
    const dup = findDuplicateCustomer(name, phone);
    if(dup){ showToast('عميل موجود مسبقًا بنفس الاسم أو الرقم: '+(dup.name||dup.phone||'عميل'), 'error'); return; }
    const newCustomer = { id: uid('cust'), name, phone, notes:'', createdAt: new Date().toISOString() };
    if(!Array.isArray(appData.customers)) appData.customers = [];
    // الحفظ بالقاعدة أولًا — انظر ملاحظة إضافة المورد بشاشة الموردين
    const saved = await persistCustomer(newCustomer);
    if(!saved) return;
    appData.customers.push(newCustomer);
    nameInput.value = ''; phoneInput.value = '';
    refreshCustomersList();
    updateCustomersBadge();
  });
  const searchInput = document.getElementById('customers-search-input');
  searchInput.addEventListener('input', e=>{
    customersSearchQuery = e.target.value;
    refreshCustomersList();
  });
  bindCustomerRowEvents();
}

function bindCustomerRowEvents(){
  document.querySelectorAll('#customers-items-list .task-item-row').forEach(row=>{
    const cid = row.getAttribute('data-customer-id');
    const customer = (appData.customers||[]).find(c=>c.id===cid);
    if(!customer) return;

    // نفس ملاحظة bindSupplierRowEvents — نجيب أحدث نسخة من appData.customers لحظة كل تعديل
    // فعلي، مش نعتمد على مرجع `customer` الملتقط وقت الربط.
    const freshCustomer = ()=> (appData.customers||[]).find(x=>x.id===cid) || customer;

    const nameInput = row.querySelector('.customer-name-input');
    if(nameInput){
      nameInput.addEventListener('change', async e=>{
        const c = freshCustomer(); const prev = { name: c.name };
        c.name = e.target.value;
        await persistFieldOrRevert(c, prev, persistCustomer, refreshCustomersList);
      });
    }
    const phoneInput = row.querySelector('.customer-phone-input');
    if(phoneInput){
      phoneInput.addEventListener('change', async e=>{
        const c = freshCustomer(); const prev = { phone: c.phone };
        c.phone = e.target.value;
        await persistFieldOrRevert(c, prev, persistCustomer, refreshCustomersList);
      });
    }
    const historyBtn = row.querySelector('.customer-history-btn');
    if(historyBtn) historyBtn.addEventListener('click', ()=> openCustomerHistoryModal(cid));

    const contactBtn = row.querySelector('.customer-contact-btn');
    if(contactBtn) contactBtn.addEventListener('click', ()=> openContactModal(customer.phone, 'الزبون'));

    const editBtn = row.querySelector('.customer-edit-btn');
    if(editBtn){
      editBtn.addEventListener('click', ()=>{
        editingCustomers[cid] = true;
        refreshCustomersList();
      });
    }
    const saveBtn = row.querySelector('.customer-save-btn');
    if(saveBtn){
      saveBtn.addEventListener('click', ()=>{
        delete editingCustomers[cid];
        refreshCustomersList();
      });
    }

    const removeBtn = row.querySelector('.task-item-remove-btn');
    if(removeBtn){
      removeBtn.addEventListener('click', ()=>{
        confirmAction({
          title: 'حذف هذا العميل؟',
          message: 'الطلبيات القديمة المرتبطة فيه بتبقى، بس بدون عميل محدد.',
          confirmLabel: 'تأكيد الحذف',
          dangerous: true,
          onConfirm: async ()=>{
            // الحذف من القاعدة أولًا — انظر ملاحظة confirmDeleteExpenseEntry
            const deleted = await deleteCustomer(cid);
            if(!deleted) return;
            appData.customers = (appData.customers||[]).filter(c=>c.id!==cid);
            delete editingCustomers[cid];
            refreshCustomersList();
            updateCustomersBadge();
          }
        });
      });
    }
  });
}

/* ---------- access gate (Supabase Auth — email magic link, restricted to an allowlist) ---------- */
let appInitDone = false;

function showAuthGate(msg, msgType){
  document.getElementById('app-root').style.display = 'none';
  // شاشة عامر كمان لازم تنخفي — كانت بتضل ظاهرة تحت بوابة الدخول بعد أي خروج/فشل تحقق
  const scrapRoot = document.getElementById('scrapyard-root');
  if(scrapRoot) scrapRoot.style.display = 'none';
  hideLocationGate(); // ما نخلي حجب الموقع يحجب شاشة الدخول نفسها لو انتهت الجلسة وهو ظاهر
  shownForEmail = null;
  scrapyardSharedState.canManage = false;
  currentUserIsElevated = false;
  // رجّع خطوة إدخال البريد بس لو ما في رمز قيد الانتظار فعليًا (pendingAuthEmail فاضي) — قبل
  // هالفحص كانت شاشة "تم إرسال الرمز" (وأي رسالة تانية بمنتصف التحقق، متل رمز غلط) بتستدعي
  // showAuthGate() وترجّع المستخدم لخطوة البريد فورًا، فتختفي خانة إدخال الرمز قبل ما يقدر
  // حتى يكتبه. pendingAuthEmail بيتصفّر بس عند "رجوع" الصريح أو بعد تحقق ناجح فعليًا.
  const stepEmail = document.getElementById('auth-step-email');
  const stepCode = document.getElementById('auth-step-code');
  const codeInput = document.getElementById('auth-code-input');
  if(!pendingAuthEmail){
    if(stepEmail) stepEmail.style.display = '';
    if(stepCode) stepCode.style.display = 'none';
    if(codeInput) codeInput.value = '';
  }
  document.getElementById('auth-gate').classList.remove('hidden');
  const msgEl = document.getElementById('auth-message');
  msgEl.textContent = msg || '';
  msgEl.className = 'auth-message' + (msgType ? ' '+msgType : '');
}

let shownForEmail = null; // البريد يلي التطبيق معروض له حاليًا — حارس ضد إعادة التهيئة المتكررة
// حارس تزامن: onAuthStateChange (بدون فلترة على اسم الحدث) وgetSession() بالأسفل بالـ
// bootstrapAuth بينادوا showAppIfAllowed بنفس اللحظة تقريبًا عند التحميل الأول. حارس
// shownForEmail بس ما بيكفي لأنه بينحط بعد أول await — لو النداءان بلشوا قبل ما ينحط، الاثنان
// بيعدّوا الفحص وبيصير استعلام مزدوج وربما init()/initScrapyardView() تشتغل مرتين بالتوازي.
// هالمتغير بينحط SYNCHRONOUSLY (قبل أي await) فبيوقف النداء الثاني فورًا.
let showAppInFlightFor = null;

/* زر "إعادة المحاولة" ببوابة الدخول — لفشل التحقق المؤقت مع جلسة لسه صالحة */
function showAuthRetry(session){
  const msgEl = document.getElementById('auth-message');
  if(!msgEl || document.getElementById('auth-retry-btn')) return;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.id = 'auth-retry-btn';
  btn.className = 'btn btn-primary auth-send-btn';
  btn.style.marginTop = '12px';
  btn.textContent = 'إعادة المحاولة';
  btn.addEventListener('click', ()=>{ btn.remove(); showAppIfAllowed(session); });
  msgEl.parentNode.insertBefore(btn, msgEl.nextSibling);
}

async function showAppIfAllowed(session){
  const email = (session && session.user && session.user.email || '').toLowerCase();
  if(!email) return;
  // حارس التكرار: أي حدث جلسة تاني لنفس المستخدم (تجديد توكن، إعادة بث بين التبويبات،
  // INITIAL_SESSION مع getSession) ما لازم يعيد بناء الواجهة — كان بيرجّع عامر للرئيسية
  // ويفقده مكانه. الفحص على البريد مش على اسم الحدث، فبيغطي كل الحالات وبيسمح بتبديل الحساب.
  if(shownForEmail === email) return;
  // fired مرتين تقريبًا بنفس اللحظة عند التحميل الأول (onAuthStateChange + getSession).
  // shownForEmail بس ما بيكفي لأنه بينحط بعد أول await — النداء الثاني ممكن يوصل هالسطر
  // قبل ما الأول يخلص أول استعلام، فيعدّي الفحص وبيشتغل init()/initScrapyardView() مرتين
  // بالتوازي. هالحارس بينحط SYNCHRONOUSLY (قبل أي await) فبيوقف أي نداء ثاني فورًا.
  if(showAppInFlightFor === email) return;
  showAppInFlightFor = email;

  try{
    let role = 'full';
    try{
      const { data, error } = await sb.from('allowed_emails').select('email, role').eq('email', email).maybeSingle();
      if(error) throw error;
      if(!data){
        await sb.auth.signOut();
        showAuthGate('هذا البريد (' + email + ') غير مصرّح له بالدخول لهذا التطبيق. تواصل مع الإدارة إذا كنت تعتقد إنه خطأ.', 'error');
        return;
      }
      role = data.role || 'full';
      currentUserRole = role;
    }catch(e){
      // فشل مؤقت (انقطاع نت) كان يترك المستخدم عالق ببوابة الدخول وجلسته صالحة وبدون أي
      // طريقة يعيد المحاولة — منعطيه زر إعادة محاولة يستخدم نفس الجلسة.
      showAuthGate('تعذر التحقق من صلاحية الدخول — تحقق من الاتصال.', 'error');
      showAuthRetry(session);
      return;
    }
    await refreshElevatedAccessEmails(email);
    if(shownForEmail === email) return; // نداء تاني (نادرًا) سبقنا وخلّص وقت انتظار refreshElevatedAccessEmails
    document.getElementById('auth-gate').classList.add('hidden');
    shownForEmail = email;

    if(role === 'scrapyard'){
      document.getElementById('app-root').style.display = 'none'; // الشاشتان حصريتان على بعض
      document.getElementById('scrapyard-root').style.display = '';
      initScrapyardView(email);
      return;
    }

    document.getElementById('scrapyard-root').style.display = 'none';
    document.getElementById('app-root').style.display = '';
    startPresenceHeartbeat(email);
    const treasuryBtn = document.getElementById('btn-open-treasury');
    if(treasuryBtn) treasuryBtn.style.display = currentUserIsElevated ? '' : 'none';
    const announcementBtn = document.getElementById('btn-announcement');
    if(announcementBtn) announcementBtn.style.display = currentUserIsElevated ? '' : 'none';
    const whoOnlineBtn = document.getElementById('btn-who-online');
    if(whoOnlineBtn) whoOnlineBtn.style.display = (currentUserIsElevated || WHO_ONLINE_EXTRA_VISIBLE_EMAILS.includes(email)) ? '' : 'none';
    const employeeMapBtnVis = document.getElementById('btn-employee-map');
    if(employeeMapBtnVis) employeeMapBtnVis.style.display = currentUserIsElevated ? '' : 'none';
    if(!appInitDone){
      appInitDone = true;
      init();
    }
  } finally {
    if(showAppInFlightFor === email) showAppInFlightFor = null;
  }
}

/* ---------- shared settlement screen — يخدم نوعين: 'used' (سداد التشاليح) و 'new' (سداد الجديد للموردين).
   يُستخدم من الموظف (canManage=false، بيقرأ عن طريق RPC وبيقترح تعديلات بدون لمس app_data)
   ومن صاحب الحساب (canManage=true، بيقرأ appData.orders محليًا وبيقدر يقبل/يرفض مباشرة). */
const SETTLEMENT_KINDS = {
  used: { title:'سداد التشاليح', homeLabel:'🧾 سداد التشاليح', rpc:'get_scrapyard_used_parts', paidField:'paidToAmer' },
  new:  { title:'سداد الجديد',   homeLabel:'🧾 سداد الجديد',   rpc:'get_new_parts_supplier',   paidField:'paidToSupplier' }
};

let scrapyardSharedState = { email:'', canManage:false, activeKind:'used', parts:[], returnReceivables:[], proposals:[], confirmations:[], partsByKind:{used:[],new:[]}, tasks:[], suppliers:[], custodyBalance:0, custodyEntryCount:0 };
let scrapyardCurrentScreen = null; // 'home' | 'settlement' — يحدّد هل نحدّث الشاشة تلقائيًا عند وصول تغيير لحظي
                                    // ("طلبات التسعير"/"المهام" صارت أقسام مطوية بالرئيسية، انظر scrapyardHomeOpenSection)

async function initScrapyardView(email){
  scrapyardSharedState.email = email;
  scrapyardSharedState.canManage = currentUserIsElevated;
  const root = document.getElementById('scrapyard-root');
  root.innerHTML = '<div class="loading">جاري تحميل البيانات…</div>';
  // دخول عامر المباشر ما بيمر بـ init()، فلازم نسجّل حضوره يدويًا حتى يظهر بقائمة "آخر ظهور" عند صاحب الحساب
  startPresenceHeartbeat(email);
  // ونشترك بالتحديث اللحظي هون كمان (الدالتين محميتين من التكرار)
  subscribeScrapyardRealtime();
  subscribeScrapyardAppDataRealtime();
  refreshActivityEvents();
  subscribeActivityEventsRealtime();
  loadAnnouncement();
  subscribeAnnouncementRealtime();
  // دخول عامر المباشر (دوره "scrapyard") يوديه للصفحة الرئيسية لقسم المشتريات؛
  // دخول صاحب الحساب من داخل التطبيق (زر الصندوق) يوديه لشاشة السداد مباشرة كالمعتاد
  if(scrapyardSharedState.canManage){
    await loadScrapyardData('used');
    renderScrapyardView();
  } else {

  }
  const openedFromUrl = consumeNotifUrlParam();
  if(pendingOpenActivityLogFromPush || openedFromUrl){ pendingOpenActivityLogFromPush = false; openActivityLog(); }
