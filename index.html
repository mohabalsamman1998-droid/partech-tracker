function bindSearchableSelect(wrapEl, getOptions, onSelect, onCreateNew) {
    const input = wrapEl.querySelector(".searchable-select-input");
    const dropdown = wrapEl.querySelector(".searchable-select-dropdown");
    if (!input || !dropdown) return;
    const renderOptions = filterText => {
        const q = (filterText || "").trim().toLowerCase();
        const options = getOptions();
        const matches = q ? options.filter(o => !o.id || o.label.toLowerCase().includes(q) || (o.sublabel || "").toLowerCase().includes(q)) : options;
        if (matches.length) {
            dropdown.innerHTML = matches.map(o => '<button type="button" class="searchable-select-option" data-id="' + escapeHtml(o.id) + '">' + escapeHtml(o.label) + (o.sublabel ? " — " + escapeHtml(o.sublabel) : "") + "</button>").join("");
        } else if (q && onCreateNew) {
            dropdown.innerHTML = '<button type="button" class="searchable-select-option searchable-select-create">➕ إضافة "' + escapeHtml(filterText.trim()) + '" كعميل جديد</button>';
        } else {
            dropdown.innerHTML = '<div class="searchable-select-empty">ما فيه نتائج</div>';
        }
        dropdown.querySelectorAll(".searchable-select-option[data-id]").forEach(btn => {
            btn.addEventListener("mousedown", e => {
                e.preventDefault();
                const opt = options.find(o => o.id === btn.getAttribute("data-id"));
                const hasReal = opt && opt.id;
                input.value = hasReal ? opt.label : "";
                input.classList.toggle("select-empty-warn", !hasReal);
                wrapEl.setAttribute("data-selected-id", opt ? opt.id : "");
                dropdown.style.display = "none";
                onSelect(opt ? opt.id : "");
            });
        });
        const createBtn = dropdown.querySelector(".searchable-select-create");
        if (createBtn) {
            createBtn.addEventListener("mousedown", e => {
                e.preventDefault();
                dropdown.style.display = "none";
                onCreateNew(filterText.trim());
            });
        }
    };
    input.addEventListener("focus", () => {
        input.select();
        renderOptions("");
        dropdown.style.display = "block";
    });
    input.addEventListener("input", () => {
        renderOptions(input.value);
        dropdown.style.display = "block";
    });
    input.addEventListener("blur", () => {
        setTimeout(() => {
            dropdown.style.display = "none";
            const selectedId = wrapEl.getAttribute("data-selected-id");
            const selected = selectedId ? getOptions().find(o => o.id === selectedId) : null;
            input.value = selected ? selected.label : "";
            input.classList.toggle("select-empty-warn", !selected);
        }, 150);
    });
}

function partDisplayName(p) {
    const base = (p.description || "").trim();
    return p.used ? base + " (مستعمل)" : base;
}

function nextOrderNumber() {
    const ORDER_NUMBER_FLOOR = 959;
    let max = 0;
    appData.orders.forEach(o => {
        const m = /^PT-(\d+)$/.exec(o.orderNumber || "");
        if (m) {
            const n = parseInt(m[1], 10);
            if (n > max) max = n;
        }
    });
    const next = Math.max(max + 1, ORDER_NUMBER_FLOOR);
    return "PT-" + String(next).padStart(4, "0");
}

function orderActiveParts(order) {
    const parts = order.parts || [];
    return order.partsSelectionEnabled ? parts.filter(p => p.included !== false) : parts;
}

function partIsIncludedInOrder(order, part) {
    return !order.partsSelectionEnabled || part.included !== false;
}

function computeCustomerPaidAmount(order, excludePaymentId) {
    return (order.customerPayments || []).reduce((sum, p) => {
        if (excludePaymentId && p.id === excludePaymentId) return sum;
        const amt = Number(p.amount) || 0;
        return p.returnAdjustment ? sum - amt : sum + amt;
    }, 0);
}

function computeCustomerPaidAmountForBox(order) {
    return (order.customerPayments || []).reduce((sum, p) => {
        const amt = Number(p.amount) || 0;
        if (!p.returnAdjustment) return sum + amt;
        const linkedPart = (order.parts || []).find(pp => pp.id === p.linkedPartId);
        const confirmed = linkedPart && linkedPart.customerRefundConfirmed;
        return confirmed ? sum - amt : sum;
    }, 0);
}

const CUSTOMER_REMAINING_TOLERANCE = 1;

function orderTotals(order) {
    let costTotal = 0, costToScrapyard = 0, costToSupplier = 0, partsSellTotal = 0, pricedCount = 0, sellEligibleCount = 0;
    const activeParts = orderActiveParts(order);
    activeParts.forEach(p => {
        const qty = Number(p.qty) || 1;
        const returned = !!p.returned;
        const keepCost = !returned || p.returnHasReceivable && !p.returnCollected;
        const keepSell = !returned;
        if (keepCost) {
            const lineCost = qty * (Number(p.costPrice) || 0);
            costTotal += lineCost;
            if (p.used) {
                costToScrapyard += lineCost;
            } else {
                costToSupplier += lineCost;
            }
        }
        if (keepSell) {
            sellEligibleCount++;
            if (p.sellPrice !== null && p.sellPrice !== undefined && p.sellPrice !== "") {
                partsSellTotal += qty * (Number(p.sellPrice) || 0);
                pricedCount++;
            }
        }
    });
    const hasSell = pricedCount > 0;
    const fullyPriced = sellEligibleCount > 0 && pricedCount === sellEligibleCount;
    const allPartsReturned = activeParts.length > 0 && sellEligibleCount === 0;
    const noActiveParts = activeParts.length === 0 && (order.parts || []).length > 0;
    const feeEnabled = !!order.feeEnabled;
    const feePercent = Math.max(0, Number(order.feePercent) || 0);
    const returnKeptFeeAmount = round2(Math.max(0, Number(order.returnKeptFeeAmount) || 0));
    const returnKeptServiceFeeAmount = round2(Math.max(0, Number(order.returnKeptServiceFeeAmount) || 0));
    const returnKeptDeliveryAmount = round2(Math.max(0, Number(order.returnKeptDeliveryAmount) || 0));
    const returnKeptExcessAmount = round2(Math.max(0, Number(order.returnKeptExcessAmount) || 0));
    const feeAmount = round2((hasSell && feeEnabled ? partsSellTotal * feePercent / 100 : 0) + returnKeptFeeAmount);
    const serviceFeeEnabled = !!order.serviceFeeEnabled;
    const serviceFeePercent = Math.max(0, Number(order.serviceFeePercent) || 0);
    const serviceFeeAmount = round2((hasSell && serviceFeeEnabled ? partsSellTotal * serviceFeePercent / 100 : 0) + returnKeptServiceFeeAmount);
    const deliveryFeeEnabled = !!order.deliveryFeeEnabled;
    const deliveryFeeAmount = round2((hasSell && deliveryFeeEnabled ? Math.max(0, Number(order.deliveryFeeAmount) || 0) : 0) + returnKeptDeliveryAmount);
    const sellTotal = partsSellTotal + feeAmount + serviceFeeAmount + deliveryFeeAmount + returnKeptExcessAmount;
    const customerPaidAmount = round2(computeCustomerPaidAmount(order));
    const customerPaidAmountForBox = round2(computeCustomerPaidAmountForBox(order));
    const hasChargeable = hasSell || returnKeptFeeAmount + returnKeptServiceFeeAmount + returnKeptDeliveryAmount + returnKeptExcessAmount > .01;
    const customerRemaining = hasChargeable ? round2(sellTotal - customerPaidAmount) : 0;
    const customerFullyPaid = hasChargeable && customerRemaining < CUSTOMER_REMAINING_TOLERANCE;
    const deliveryCost = round2(Math.max(0, Number(order.deliveryCost) || 0));
    const costBasis = costTotal + deliveryCost;
    const profit = sellTotal - costBasis;
    let collectedProfit = 0;
    if (hasChargeable && profit > 0) {
        collectedProfit = round2(Math.max(0, Math.min(customerPaidAmount - costBasis, profit)));
    }
    const uncollectedProfit = hasChargeable ? round2(profit - collectedProfit) : 0;
    return {
        costTotal: costTotal,
        costToScrapyard: costToScrapyard,
        costToSupplier: costToSupplier,
        deliveryCost: deliveryCost,
        partsSellTotal: partsSellTotal,
        feeAmount: feeAmount,
        feePercent: feePercent,
        feeEnabled: feeEnabled,
        serviceFeeAmount: serviceFeeAmount,
        serviceFeePercent: serviceFeePercent,
        serviceFeeEnabled: serviceFeeEnabled,
        deliveryFeeAmount: deliveryFeeAmount,
        deliveryFeeEnabled: deliveryFeeEnabled,
        sellTotal: sellTotal,
        customerPaidAmount: customerPaidAmount,
        customerPaidAmountForBox: customerPaidAmountForBox,
        customerRemaining: customerRemaining,
        customerFullyPaid: customerFullyPaid,
        hasSell: hasSell,
        hasChargeable: hasChargeable,
        fullyPriced: fullyPriced,
        allPartsReturned: allPartsReturned,
        noActiveParts: noActiveParts,
        profit: profit,
        collectedProfit: collectedProfit,
        uncollectedProfit: uncollectedProfit
    };
}

function scrapyardCostSettled(order, t) {
    t = t || orderTotals(order);
    return t.costToScrapyard <= 0 || !!(order.paidToAmer || order.paidToOmar || order.paidToSupplier);
}

function newPartsCostSettled(order, t) {
    t = t || orderTotals(order);
    if (t.costToSupplier <= 0) return true;
    if (t.costToScrapyard > 0) return !!(order.paidToAmerNew || order.paidToOmarNew || order.paidToSupplierNew);
    return !!(order.paidToAmer || order.paidToOmar || order.paidToSupplier);
}

function orderIsMixedPartType(t) {
    return t.costToScrapyard > 0 && t.costToSupplier > 0;
}

function orderPurchaseSettled(order, t) {
    if (!order) return false;
    t = t || orderTotals(order);
    return scrapyardCostSettled(order, t) && newPartsCostSettled(order, t);
}

function partPurchaseCostSettled(order, part, t) {
    t = t || orderTotals(order);
    return part && part.used ? scrapyardCostSettled(order, t) : newPartsCostSettled(order, t);
}

function costSplitStatusLabel(order, bucket) {
    const supplier = bucket === "new" ? order.paidToSupplierNew : order.paidToSupplier;
    const amer = bucket === "new" ? order.paidToAmerNew : order.paidToAmer;
    const omar = bucket === "new" ? order.paidToOmarNew : order.paidToOmar;
    if (supplier) return "✓ سداد مباشر";
    if (amer) return "✓ من عهدة عامر";
    if (omar) return "✓ من عهدة عمر";
    return "غير مسدد";
}

function orderStatusFlags(order) {
    const t = orderTotals(order);
    return Object.assign({}, t, {
        waitingAmerPayment: order.confirmed && order.supplied && t.costToScrapyard > 0 && !scrapyardCostSettled(order, t),
        waitingSupplierPayment: order.confirmed && order.supplied && t.costToSupplier > 0 && !newPartsCostSettled(order, t),
        waitingSupply: order.confirmed && !order.supplied,
        waitingPricing: !t.fullyPriced && !t.allPartsReturned && !t.noActiveParts,
        waitingCustomerPayment: order.confirmed && order.supplied && t.hasChargeable && !t.customerFullyPaid,
        complete: order.confirmed && order.supplied && (t.costTotal === 0 || orderPurchaseSettled(order, t)) && t.customerFullyPaid && (t.fullyPriced || t.allPartsReturned && t.hasChargeable)
    });
}

const ORDER_PROMOTED_KEYS = [ "id", "orderNumber", "orderLabel", "customerPhone", "customerId", "confirmed", "supplied", "suppliedAt", "paidToAmer", "paidToOmar", "paidToSupplier", "paidToAmerNew", "paidToOmarNew", "paidToSupplierNew", "parts", "customerPayments", "createdAt", "updatedAt" ];

function orderRowToObject(row) {
    const obj = Object.assign({}, row.extra || {});
    obj.id = row.id;
    obj.orderNumber = row.order_number || "";
    obj.orderLabel = row.order_label || "";
    obj.customerPhone = row.customer_phone || "";
    obj.customerId = row.customer_id || null;
    obj.confirmed = !!row.confirmed;
    obj.supplied = !!row.supplied;
    obj.suppliedAt = row.supplied_at ? new Date(row.supplied_at).toISOString() : null;
    obj.paidToAmer = !!row.paid_to_amer;
    obj.paidToOmar = !!row.paid_to_omar;
    obj.paidToSupplier = !!row.paid_to_supplier;
    obj.paidToAmerNew = !!row.paid_to_amer_new;
    obj.paidToOmarNew = !!row.paid_to_omar_new;
    obj.paidToSupplierNew = !!row.paid_to_supplier_new;
    obj.parts = Array.isArray(row.parts) ? row.parts : [];
    obj.customerPayments = Array.isArray(row.customer_payments) ? row.customer_payments : [];
    obj.createdAt = row.created_at ? new Date(row.created_at).toISOString() : "";
    obj.updatedAt = row.updated_at ? new Date(row.updated_at).toISOString() : "";
    return obj;
}

function orderObjectToRow(order) {
    const extra = {};
    Object.keys(order || {}).forEach(k => {
        if (!ORDER_PROMOTED_KEYS.includes(k)) extra[k] = order[k];
    });
    return {
        id: order.id,
        order_number: order.orderNumber || "",
        order_label: order.orderLabel || "",
        customer_phone: order.customerPhone || "",
        customer_id: order.customerId || null,
        confirmed: !!order.confirmed,
        supplied: !!order.supplied,
        supplied_at: order.suppliedAt || null,
        paid_to_amer: !!order.paidToAmer,
        paid_to_omar: !!order.paidToOmar,
        paid_to_supplier: !!order.paidToSupplier,
        paid_to_amer_new: !!order.paidToAmerNew,
        paid_to_omar_new: !!order.paidToOmarNew,
        paid_to_supplier_new: !!order.paidToSupplierNew,
        parts: Array.isArray(order.parts) ? order.parts : [],
        customer_payments: Array.isArray(order.customerPayments) ? order.customerPayments : [],
        extra: extra,
        created_at: order.createdAt || (new Date).toISOString(),
        updated_at: order.updatedAt || (new Date).toISOString()
    };
}

function groupSupplierOrCustomerRows(rows) {
    return (rows || []).map(r => ({

        notes: r.notes || "",

    }));
}

let archivedOrdersHydration = null;

const ORDERS_ACTIVE_FILTER = "extra->archived.is.null,extra->>archived.eq.false";

async function hydrateArchivedOrders() {
    try {
        if (!sb) return;
        const {data: data, error: error} = await withRetry(() => sb.from("orders").select("*"), 3, 1500);
        if (error) throw error;
        const existingIds = new Set(appData.orders.map(o => o.id));
        let addedAny = false;
        (data || []).forEach(row => {
            if (existingIds.has(row.id)) return;
            appData.orders.push(orderRowToObject(row));
            addedAny = true;
        });
        if (addedAny) {
            migrateLegacyCustomerPayment();
            migrateLegacyOrderLabel();
            updateArchivePendingBadge();
            scheduleOrderRenderCascade();
        }
    } catch (e) {
        console.error("hydrateArchivedOrders:", e);
        showToast("تعذر تحميل باقي الطلبيات بالخلفية — بعض البيانات قد تكون ناقصة مؤقتًا، جرّب تحديث الصفحة", "error");
    }
}

async function loadData() {
    try {
        if (!sb) throw new Error("NO_DB");
        const [ordersRes, treasuryRes, tasksRes, suppliersRes, customersRes, amerCustodyBalanceRes, omarCustodyBalanceRes] = await Promise.all([ sb.from("orders").select("*").or(ORDERS_ACTIVE_FILTER), sb.from("treasury_entries").select("*"), sb.from("tasks").select("*"), sb.from("suppliers").select("*"), sb.from("customers").select("*"), sb.rpc("get_amer_custody_balance"), sb.rpc("get_omar_custody_balance") ]);
        if (ordersRes.error) throw ordersRes.error;
        if (treasuryRes.error) throw treasuryRes.error;
        if (tasksRes.error) throw tasksRes.error;
        if (suppliersRes.error) throw suppliersRes.error;
        if (customersRes.error) throw customersRes.error;
        if (!amerCustodyBalanceRes.error) {
            serverAmerCustodyBalance = Number(amerCustodyBalanceRes.data) || 0;
        } else {
            refreshServerAmerCustodyBalance().then(renderKPIs);
        }
        if (!omarCustodyBalanceRes.error) {
            serverOmarCustodyBalance = Number(omarCustodyBalanceRes.data) || 0;
        } else {
            refreshServerOmarCustodyBalance().then(renderKPIs);
        }
        appData = {
            orders: (ordersRes.data || []).map(orderRowToObject),
            treasury: groupTreasuryRows(treasuryRes.data),
            tasks: groupTaskRows(tasksRes.data),
            suppliers: groupSupplierOrCustomerRows(suppliersRes.data),
            customers: groupSupplierOrCustomerRows(customersRes.data)
        };
        archivedOrdersHydration = hydrateArchivedOrders();
    } catch (e) {
        appData = {
            orders: [],
            treasury: defaultTreasury(),
            tasks: defaultTasks(),
            suppliers: [],
            customers: []
        };
        showToast("تعذر الاتصال بقاعدة البيانات — تحقق من إعداد Supabase (SUPABASE_URL / SUPABASE_ANON_KEY)", "error");
    }
    migrateLegacyCustomerPayment();
    migrateLegacyOrderLabel();
    migrateLegacyTreasury();
    migrateLegacyTasks();
}

function migrateLegacyTreasury() {
    if (!appData.treasury) appData.treasury = defaultTreasury();
    EXPENSE_CATEGORIES.forEach(c => {
        const val = appData.treasury[c.key];
        if (!Array.isArray(val)) {
            const num = Number(val) || 0;
            appData.treasury[c.key] = num > 0 ? [ {
                id: uid("exp"),
                amount: num,
                date: ""
            } ] : [];
        }
    });

}

function migrateLegacyTasks() {
    if (!appData.tasks) appData.tasks = defaultTasks();
    TASK_CATEGORIES.forEach(c => {
        if (!Array.isArray(appData.tasks[c.key])) appData.tasks[c.key] = [];
    });
}

function migrateLegacyOrderLabel() {
    appData.orders.forEach(o => {
        if (!o.orderLabel && o.address) {
            o.orderLabel = o.address;
        }
    });
}

function migrateLegacyCustomerPayment() {
    appData.orders.forEach(o => {
        if (!Array.isArray(o.customerPayments)) o.customerPayments = [];
        if (o.customerPayments.length === 0 && Number(o.customerPaidAmount) > 0) {
            o.customerPayments.push({
                id: uid("pay"),
                amount: Number(o.customerPaidAmount) || 0,
                method: o.customerPaymentMethod || "",
                date: o.customerPaymentDate || ""
            });
        } else if (o.customerPayments.length === 0 && o.customerPaid === true) {
            const t = orderTotals(o);
            if (t.sellTotal > 0) {
                o.customerPayments.push({
                    id: uid("pay"),
                    amount: t.sellTotal,
                    method: "",
                    date: ""
                });
            }
        }
    });
}

function showToast(msg, type) {
    const root = document.getElementById("toast-root");
    const el = document.createElement("div");
    el.className = "toast " + (type === "error" ? "toast-error" : "toast-ok");
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(() => {
        el.classList.add("toast-out");
        setTimeout(() => el.remove(), 300);
    }, 2600);
}

function computeAggregateFinancials(matchPeriodFn) {
    const realOrders = appData.orders.filter(o => !o.isQuote);
    const confirmedOrders = realOrders.filter(o => o.confirmed).filter(o => matchPeriodFn ? matchPeriodFn(o) : true);
    let dueToScrapyard = 0, dueToSuppliers = 0, dueFromCustomers = 0, dueFromCustomersCount = 0, collectedProfit = 0, uncollectedProfit = 0;
    let dueToScrapyardCount = 0, dueToSuppliersCount = 0;
    let paidToScrapyardTotal = 0, paidToSuppliersTotal = 0, customerReceiptsTotal = 0;
    confirmedOrders.forEach(o => {
        const t = orderTotals(o);
        if (!scrapyardCostSettled(o, t)) {
            if (o.supplied && t.costToScrapyard > 0) {
                dueToScrapyard += t.costToScrapyard;
                dueToScrapyardCount++;
            }
        } else paidToScrapyardTotal += t.costToScrapyard;
        if (!newPartsCostSettled(o, t)) {
            if (o.supplied && t.costToSupplier > 0) {
                dueToSuppliers += t.costToSupplier;
                dueToSuppliersCount++;
            }
        } else paidToSuppliersTotal += t.costToSupplier;
        if (o.supplied && t.hasChargeable && !t.customerFullyPaid) {
            dueFromCustomers += t.customerRemaining;
            dueFromCustomersCount++;
        }
        customerReceiptsTotal += t.customerPaidAmountForBox;
        if (t.hasChargeable) {
            collectedProfit += t.collectedProfit;
            uncollectedProfit += t.uncollectedProfit;
        }
    });
    return {
        confirmedCount: confirmedOrders.length,
        unconfirmedCount: realOrders.length - confirmedOrders.length,
        dueToScrapyard: dueToScrapyard,
        dueToScrapyardCount: dueToScrapyardCount,
        dueToSuppliers: dueToSuppliers,
        dueToSuppliersCount: dueToSuppliersCount,
        dueFromCustomers: dueFromCustomers,
        dueFromCustomersCount: dueFromCustomersCount,
        collectedProfit: collectedProfit,
        uncollectedProfit: uncollectedProfit,
        paidToScrapyardTotal: paidToScrapyardTotal,
        paidToSuppliersTotal: paidToSuppliersTotal,
        customerReceiptsTotal: customerReceiptsTotal
    };
}

function renderKPIs() {
    const el = document.getElementById("kpi-row");
    const f = computeAggregateFinancials();
    const supplierReceivablesById = supplierReturnReceivablesIndex().bySupplier;
    const returnsOwedToUs = round2((appData.suppliers || []).reduce((sum, s) => sum + (supplierReceivablesById[s.id] || 0), 0));
    const custodyBalance = purchasingCustodyBalance();
    const dueToScrapyardNet = round2(f.dueToScrapyard - custodyBalance);
    const dueToScrapyardShown = Math.max(0, dueToScrapyardNet);
    const suppliersWithReceivables = (appData.suppliers || []).filter(s => (supplierReceivablesById[s.id] || 0) > 0).length;
    const term = (label, amount) => ({
        label: label,
        amount: Math.abs(round2(amount)),
        negative: amount < 0
    });
    const confirmedBreakdown = {
        note: f.unconfirmedCount > 0 ? f.confirmedCount + " مؤكدة + " + f.unconfirmedCount + " بانتظار التأكيد" : "كل الطلبيات الغير مؤرشفة (" + f.confirmedCount + ") مؤكدة"
    };
    const dueToScrapyardBreakdown = {
        terms: [ term("مستحق للتشليح (قبل خصم رصيد المشتريات)", f.dueToScrapyard), term("رصيد المشتريات", -custodyBalance) ],
        note: dueToScrapyardNet < 0 ? "رصيد المشتريات يغطي كل المستحق حاليًا" : null
    };
    const dueToSuppliersBreakdown = {
        note: f.dueToSuppliersCount > 0 ? "مجموع المستحق على " + f.dueToSuppliersCount + " طلبية موردة لسه ما سُددت للمورد" : "ما فيه طلبيات موردة عليها مبلغ مستحق للموردين حاليًا"
    };
    const dueFromCustomersBreakdown = {
        note: f.dueFromCustomersCount > 0 ? "مجموع المتبقي على " + f.dueFromCustomersCount + " طلبية مسلّمة لسه ما سُددت بالكامل" : "ما فيه طلبيات مسلّمة عليها مبلغ متبقي حاليًا"
    };
    const returnReceivablesBreakdown = {
        note: "مرتجعات مستحقة من " + suppliersWithReceivables + " مورد/تشليح"
    };

function normalizeArabicSearch(s) {
    return (s || "").toLowerCase().replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 1632)).replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) - 1776));
}

function orderMatchesFilterAndSearch(order, filter, search, customerIndex) {
    const f = orderStatusFlags(order);
    if (filter === "unconfirmed" && order.confirmed) return false;
    if (filter === "confirmed" && !order.confirmed) return false;
    if (filter === "waitingSupply" && !f.waitingSupply) return false;
    if (filter === "supplied" && !order.supplied) return false;
    if (filter === "waitingPricing" && !f.waitingPricing) return false;
    if (filter === "waitingAmer" && !f.waitingAmerPayment) return false;
    if (filter === "waitingSupplier" && !f.waitingSupplierPayment) return false;
    if (filter === "waitingCustomer" && !f.waitingCustomerPayment) return false;
    if (filter === "complete" && !f.complete) return false;
    if (filter === "justified" && (!order.unsuccessfulReason || order.confirmed)) return false;
    if (search) {
        const words = normalizeArabicSearch(search.trim()).split(/\s+/).filter(Boolean);
        if (words.length) {
            const customer = order.customerId ? customerIndex ? customerIndex.get(order.customerId) : (appData.customers || []).find(c => c.id === order.customerId) : null;
            const haystack = normalizeArabicSearch([ order.orderNumber || "", order.orderLabel || "", order.vin || "", order.customerPhone || "", customer && customer.name || "", ...(order.parts || []).map(p => p.description || "") ].join(" "));
            if (!words.every(w => haystack.includes(w))) return false;
        }
    }
    return true;
}

function buildCustomerByIdIndex() {
    const map = new Map;
    (appData.customers || []).forEach(c => {
        if (c && c.id) map.set(c.id, c);

}

function renderTable() {
    const el = document.getElementById("table-container");
    try {
        const custIdx = buildCustomerByIdIndex();
        const includeArchived = currentFilter !== "all" || (currentSearch || "").trim() !== "";
        const orders = appData.orders.filter(o => !o.isQuote).filter(o => includeArchived || !o.archived).filter(o => orderMatchesFilterAndSearch(o, currentFilter, currentSearch, custIdx)).sort((a, b) => orderNumberSortKey(b) - orderNumberSortKey(a));
        if (orders.length === 0) {
            el.innerHTML = '<div class="empty-state">' + '<div class="empty-title">لا توجد طلبيات مطابقة</div>' + '<div class="empty-sub">جرّب تغيير الفلتر أو ابدأ طلبية جديدة من فوق.</div>' + "</div>";
            return;
        }
        el.innerHTML = ordersTableAndCardsHtml(orders, includeArchived);
        el.querySelectorAll("[data-open]").forEach(b => {
            b.addEventListener("click", () => openModal("edit", b.getAttribute("data-open")));
        });
        el.querySelectorAll("[data-contact-open]").forEach(btn => {
            btn.addEventListener("click", e => {
                e.stopPropagation();
                const order = appData.orders.find(o => o.id === btn.getAttribute("data-contact-open"));
                openContactModal(order ? order.customerPhone : "");
            });
        });
        el.querySelectorAll("[data-confirm-toggle]").forEach(btn => {
            btn.addEventListener("click", e => {
                e.stopPropagation();
                confirmToggleConfirmation(btn.getAttribute("data-confirm-toggle"));
            });
        });
        el.querySelectorAll("[data-archive]").forEach(btn => {
            btn.addEventListener("click", e => {
                e.stopPropagation();
                archiveOrder(btn.getAttribute("data-archive"));
            });
        });
        el.querySelectorAll("[data-restore]").forEach(btn => {
            btn.addEventListener("click", e => {
                e.stopPropagation();
                restoreOrder(btn.getAttribute("data-restore"));
            });
        });
        el.querySelectorAll("[data-unsuccessful-reason]").forEach(btn => {
            btn.addEventListener("click", e => {
                e.stopPropagation();
                openUnsuccessfulReasonPicker(btn.getAttribute("data-unsuccessful-reason"));
            });
        });
    } catch (e) {
        showPersistentErrorToast("تعذر عرض الطلبيات: " + (e && e.message ? e.message : e));
        el.innerHTML = '<div class="empty-state">' + '<div class="empty-title">صار خطأ بعرض الطلبيات</div>' + '<div class="empty-sub">' + escapeHtml(e && e.message ? e.message : String(e)) + "</div>" + '<button type="button" class="btn btn-ghost btn-sm" id="btn-retry-render-table" style="margin-top:10px;">🔄 إعادة المحاولة</button>' + "</div>";
        const retryBtn = document.getElementById("btn-retry-render-table");
        if (retryBtn) retryBtn.addEventListener("click", renderTable);
    }
}

function bindOrderActionButtons() {
    const root = document.getElementById("modal-root");
    const delBtn = root.querySelector("#modal-delete-btn");
    if (delBtn) {
        delBtn.addEventListener("click", async () => {
            if (orderDeleteGated()) {
                requestOrderDelete();
                return;
            }
            if (orderDeleteCountPending) return;
            const id = draft.id;
            const label = delBtn.textContent;
            delBtn.disabled = true;
            delBtn.textContent = "جاري التحقق…";
            orderDeleteCountPending = true;
            let mediaN = 0;
            try {
                mediaN = await orderMediaCountSafe(id);
            } finally {
                orderDeleteCountPending = false;
                if (delBtn.isConnected) {
                    delBtn.disabled = false;
                    delBtn.textContent = label;
                }
            }
            if (!orderModalStillOpen(id)) return;
            const cr = document.getElementById("confirm-root");
            if (cr && cr.classList.contains("modal-open")) return;
            closeModal();
            confirmDelete(id, mediaN);
        });
    }
    const returnOrderBtn = root.querySelector("#modal-return-order-btn");
    if (returnOrderBtn) {
        returnOrderBtn.addEventListener("click", () => {
            if (fieldGated()) {
                requestOrderReturn();
                return;
            }
            confirmReturnWholeOrder();
        });
    }
}

async function requestOrderCustomerChange(newCustomerId) {
    if (pendingFieldProposal("customerId", null)) {

        refreshOrderCustomerBlock();
        return;

    const {error: error} = await sb.from("edit_proposals").insert({
        order_id: draft.id,
        kind: "order_field",
        field: "customerId",
        part_id: null,
        current_value: draft.customerId,
        proposed_value: newCustomerId,
        submitted_by: presenceEmail

    if (error) {

    refreshOrderCustomerBlock();
}

function normalizeVin(s) {
    return String(s == null ? "" : s).replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 1632)).replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) - 1776)).replace(/[\s\u061C\u200B-\u200F\u202A-\u202E\u2066-\u2069\uFEFF\u2022\u00B7]/g, "").toUpperCase().slice(0, 30);
}

function vinCharsetOk(s) {
    return /^[A-Z0-9-]*$/.test(s || "");
}

function vinHasLetter(s) {
    return /[A-Z]/.test(s || "");
}

function vinLooksValid(s) {
    return /^[A-HJ-NPR-Z0-9]{17}$/.test(s || "");
}

function vinHintHtml(raw) {
    const v = normalizeVin(raw);
    if (!v) return "";
    if (!vinCharsetOk(v)) return '<span class="text-rust">رقم الهيكل: حروف إنجليزية وأرقام فقط</span>';
    if (!vinHasLetter(v)) return '<span class="text-rust">هذا مو رقم هيكل — رقم الهيكل فيه حروف إنجليزية</span>';
    if (vinLooksValid(v)) return '<span class="text-green">✓ 17 خانة</span>';
    return '<span class="text-amber">رقم الهيكل عادة 17 خانة بدون I/O/Q</span>';
}

    return '<div class="field">' + '<span class="field-label">رقم الهيكل VIN (اختياري)</span>' + '<div class="phone-field-row">' + '<input type="text" id="' + prefix + '-vin-input" dir="ltr" style="text-align:right;" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="40" placeholder="' + (ro ? "ما انكتب رقم هيكل" : "اكتبه أو صوّر الاستمارة") + '" value="' + escapeHtml(v) + '"' + (ro ? " readonly" : "") + ">" + btn + "</div>" + (ro ? "" : '<div class="add-part-hint" id="' + prefix + '-vin-hint" style="margin-top:4px;"' + (hint ? "" : " hidden") + ">" + hint + "</div>") + mediaStripHtml(d.id, "_order:vin", ro ? "view" : "edit") + "</div>";

    const el = document.getElementById(prefix + "-vin-hint");

}

function bindVinInput(prefix, getDraft) {
    const input = document.getElementById(prefix + "-vin-input");
    if (!input || input.readOnly) return;
    input.addEventListener("input", e => {
        const d = getDraft();
        if (!d) return;
        d.vin = e.target.value;
        const hintEl = document.getElementById(prefix + "-vin-hint");
        if (hintEl && !hintEl.hidden) refreshVinHint(prefix, d.vin);
    });
    input.addEventListener("blur", e => {
        const d = getDraft();
        if (!d) return;
        const n = normalizeVin(e.target.value);
        if (vinCharsetOk(n)) {
            d.vin = n;
            if (e.target.value !== n) e.target.value = n;
        }
        refreshVinHint(prefix, e.target.value);
    });
}

function vinApplyForSave(d, prefix) {
    const v = normalizeVin(d && d.vin);
    if (!vinCharsetOk(v)) {
        showToast("رقم الهيكل: حروف إنجليزية وأرقام فقط", "error");
        refreshVinHint(prefix, d.vin);
        return false;
    }
    if (v && !vinHasLetter(v)) {
        showToast("هذا مو رقم هيكل — رقم الهيكل فيه حروف إنجليزية", "error");
        refreshVinHint(prefix, d.vin);
        return false;
    }
    if (v) d.vin = v; else delete d.vin;
    const input = document.getElementById(prefix + "-vin-input");
    if (input && input.value !== (d.vin || "")) input.value = d.vin || "";
    return true;
}

    pendingPartProposalPurges = new Set;
    editRequestMode = false;

        draft = {

            parts: [],
            partsSelectionEnabled: false,
            paidToAmer: false,
            paidToOmar: false,
            paidToSupplier: false,
            supplied: false,

            customerId: null,
            customerPayments: [],

            deliveryCost: 0,

            updatedAt: (new Date).toISOString(),
            isNew: true
        };
    } else {
        const found = appData.orders.find(o => o.id === orderId);

            modalCloseCallback = null;
            showToast("هذه الطلبية غير موجودة (يمكن انحذفت)", "error");

    const root = document.getElementById("modal-root");
    root.innerHTML = "";

    closeMediaOverlays();
    draft = null;
    pendingScrapyardCancellations.clear();
    pendingEditProposalsCancellation = false;
    pendingPartProposalPurges.clear();
    document.removeEventListener("keydown", escListener);
    if (modalCloseCallback) {
        const cb = modalCloseCallback;
        modalCloseCallback = null;
        cb();
    }
}

function escListener(e) {

}

function friendlyErrorText(e) {
    const code = e && e.code;
    const msg = String(e && e.message || e || "");
    if (code === "23505") return "قيمة مستخدمة أصلًا بسجل آخر (تعارض تكرار)";
    if (code === "PT422" || e && e.hint === "media_part_not_saved") return "القطعة لسه ما انحفظت";
    if (code === "PT412" || e && e.hint === "media_objects_missing") return "الرفع ما كمل — جرّب مرة تانية";
    if (code === "PT410" || e && e.hint === "media_deleted") return "الملف انحذف";
    if (msg === "NO_DB") return "الاتصال بقاعدة البيانات غير متاح حاليًا";
    if (code === "PGRST202") return "نسخة التطبيق عندك قديمة — حدّث الصفحة وحاول مرة تانية";
    if (/fetch|network|Network|timeout|Timeout/.test(msg)) return "تحقق من اتصال الإنترنت وحاول مرة تانية";
    if (/JWT|session|Session/.test(msg)) return "انتهت صلاحية الجلسة — سجّل دخول من جديد";
    if (/permission|policy|RLS|denied/i.test(msg)) return "ما عندك صلاحية على هالعملية";
    return "خطأ غير متوقع — لو تكرر بلّغ الدعم الفني";
}

function bindBusyButton(btn, handler) {

        } finally {
            btn.disabled = false;
        }
    });
}

async function persistFieldOrRevert(obj, prevSnapshot, persistFn, refreshFn) {

    if (!saved) {
        Object.assign(obj, prevSnapshot);
        refreshFn();
    }
    return saved;
}

async function loadAnnouncement() {
    try {
        if (!sb) return;
        const {data: data, error: error} = await sb.from("announcement").select("id, text, updated_by");
        if (error) throw error;
        (data || []).forEach(row => {
            announcementTexts[row.id] = row.text || null;
            announcementSenders[row.id] = row.updated_by || null;
        });
    } catch (e) {
        console.error("loadAnnouncement:", e);

    refreshScrapyardAnnouncementIfVisible();

function subscribeAnnouncementRealtime() {
    if (!sb || announcementChannel) return;
    announcementChannel = sb.channel("announcement-changes").on("postgres_changes", {
        event: "UPDATE",
        schema: "public",
        table: "announcement"
    }, payload => {
        const row = payload.new;
        if (!row) return;
        announcementTexts[row.id] = row.text || null;
        announcementSenders[row.id] = row.updated_by || null;
        renderAnnouncementBanner();
        refreshScrapyardAnnouncementIfVisible();
    }).subscribe();
}

async function saveAnnouncementField(targetEmail, newText, saved) {
    const now = (new Date).toISOString();
    const changed = (announcementTexts[targetEmail] || "") !== newText;
    const {data: data, error: error} = await sb.from("announcement").update({
        text: newText || null,
        updated_by: presenceEmail,
        updated_at: now
    }).eq("id", targetEmail).select("id");
    if (error) {
        showToast("تعذر حفظ الإعلان", "error");
        return;
    }
    if (!data || !data.length) {
        showToast("تعذر حفظ الإعلان — ما عندك صلاحية", "error");
        return;
    }
    announcementTexts[targetEmail] = newText || null;
    announcementSenders[targetEmail] = presenceEmail;
    renderAnnouncementBanner();
    refreshScrapyardAnnouncementIfVisible();
    saved();
    showToast("تم الحفظ", "ok");
    if (changed && newText) {
        try {
            await sb.from("activity_events").insert({
                kind: "announcement_posted",
                target_email: targetEmail,
                actor_email: presenceEmail,
                message: "📢 إعلان جديد: " + newText
            });

            console.error("logAnnouncementPosted:", e);
        }
    }
}

function confirmReturnWholeOrder() {
    const activeParts = orderActiveParts(draft).filter(p => !p.returned);
    if (!activeParts.length) {
        showToast("لا يوجد قطع قابلة للإرجاع بهذه الطلبية", "error");
        return;
    }
    const missingSupplier = activeParts.some(p => {
        const hasReceivable = partPurchaseCostSettled(draft, p);
        return hasReceivable && !p.supplierId;
    });
    if (missingSupplier) {
        showToast("حدد المورد لكل قطعة مدفوعة مسبقًا قبل تأكيد الإرجاع", "error");
        return;
    }
    const shareAmount = liveWholeOrderReturnShare(draft).total;
    if (shareAmount > .01) {
        openReturnFeeChoiceModal(shareAmount, true, keepFee => proceedReturnWholeOrder(activeParts, keepFee));
    } else {
        proceedReturnWholeOrder(activeParts, false);
    }
}

function proceedReturnWholeOrder(activeParts, keepFee) {
    const anyPaid = activeParts.some(p => partPurchaseCostSettled(draft, p));
    confirmAction({
        title: "تأكيد إرجاع الطلبية بالكامل (" + activeParts.length + " قطعة)؟",
        message: anyPaid ? "بعض القطع مدفوعة مسبقًا — مبلغها رح يظهر كمسترجع بانتظار التحصيل بشاشة الموردين، وينخصم من دفعة الزبون تلقائيًا." : "رح تُستبعد كل قطع الطلبية من حساباتها مباشرة.",
        confirmLabel: "تأكيد إرجاع الطلبية",
        dangerous: true,
        onConfirm: () => {
            let totalLeftoverExcess = 0;
            activeParts.forEach((p, i) => {
                const s = computeReturnFeeShare(draft, p);
                const isLast = i === activeParts.length - 1;
                const t = isLast ? orderTotals(draft) : null;
                const liveDelivery = isLast ? round2(Math.max(0, t.deliveryFeeAmount - (draft.returnKeptDeliveryAmount || 0))) : 0;
                if (keepFee) {
                    p.returnKeptFeeShare = s.feeShare;
                    p.returnKeptServiceFeeShare = s.serviceFeeShare;
                    if (isLast && liveDelivery > .01) p.returnKeptDeliveryShare = liveDelivery;
                    draft.returnKeptFeeAmount = round2((draft.returnKeptFeeAmount || 0) + s.feeShare);
                    draft.returnKeptServiceFeeAmount = round2((draft.returnKeptServiceFeeAmount || 0) + s.serviceFeeShare);
                    if (isLast) draft.returnKeptDeliveryAmount = round2((draft.returnKeptDeliveryAmount || 0) + liveDelivery);
                    totalLeftoverExcess = applyPartReturn(p, 0);
                } else {
                    totalLeftoverExcess = applyPartReturn(p, round2(s.feeShare + s.serviceFeeShare + liveDelivery));
                }
                pendingPartProposalPurges.add(p.id);
                pendingScrapyardCancellations.add(p.id);
            });
            refreshPartsList();
            refreshPaymentsList();
            totalLeftoverExcess = round2(totalLeftoverExcess);
            if (totalLeftoverExcess > .01) {
                const lastReturnedPart = activeParts[activeParts.length - 1];
                const excessOpenedForDraftId = draft.id;
                openReturnExcessChoiceModal(totalLeftoverExcess, draft, lastReturnedPart, () => {
                    if (!draft || draft.id !== excessOpenedForDraftId) return;
                    refreshPartsList();
                    refreshPaymentsList();
                });
            }
        }
    });
}

function confirmSinglePartReturn(part) {
    const hasReceivable = partPurchaseCostSettled(draft, part);

        return;
    }
    const s = computeReturnFeeShare(draft, part);
    const shareAmount = round2(s.feeShare + s.serviceFeeShare);
    if (shareAmount > .01) {
        openReturnFeeChoiceModal(shareAmount, false, keepFee => proceedSinglePartReturn(part, hasReceivable, keepFee));
    } else {
        proceedSinglePartReturn(part, hasReceivable, false);
    }
}

function proceedSinglePartReturn(part, hasReceivable, keepFee) {
    confirmAction({
        title: "تأكيد إرجاع هذه القطعة؟",
        message: hasReceivable ? "القطعة مدفوعة مسبقًا — مبلغها رح يظهر كمسترجع بانتظار التحصيل بشاشة الموردين، وينخصم من دفعة الزبون تلقائيًا." : "رح تُستبعد من حسابات الطلبية مباشرة.",
        confirmLabel: "تأكيد الإرجاع",
        dangerous: true,
        onConfirm: () => {
            const s = computeReturnFeeShare(draft, part);
            let leftoverExcess = 0;
            if (keepFee) {
                part.returnKeptFeeShare = s.feeShare;
                part.returnKeptServiceFeeShare = s.serviceFeeShare;
                draft.returnKeptFeeAmount = round2((draft.returnKeptFeeAmount || 0) + s.feeShare);
                draft.returnKeptServiceFeeAmount = round2((draft.returnKeptServiceFeeAmount || 0) + s.serviceFeeShare);
                leftoverExcess = applyPartReturn(part, 0);
            } else {
                leftoverExcess = applyPartReturn(part, round2(s.feeShare + s.serviceFeeShare));
            }
            pendingPartProposalPurges.add(part.id);
            pendingScrapyardCancellations.add(part.id);
            refreshPartsList();
            refreshPaymentsList();
            if (leftoverExcess > .01) {
                const excessOpenedForDraftId = draft.id;
                openReturnExcessChoiceModal(leftoverExcess, draft, part, () => {
                    if (!draft || draft.id !== excessOpenedForDraftId) return;
                    refreshPartsList();
                    refreshPaymentsList();
                });
            }
        }
    });
}

function computeReturnFeeShare(order, part) {
    const t = orderTotals(order);
    const sellAmount = part.sellPrice !== null && part.sellPrice !== undefined && part.sellPrice !== "" ? (Number(part.qty) || 1) * Number(part.sellPrice) : 0;
    if (sellAmount <= 0 || t.partsSellTotal <= 0) return {
        feeShare: 0,
        serviceFeeShare: 0
    };
    const liveFeeAmount = round2(Math.max(0, t.feeAmount - (Number(order.returnKeptFeeAmount) || 0)));
    const liveServiceFeeAmount = round2(Math.max(0, t.serviceFeeAmount - (Number(order.returnKeptServiceFeeAmount) || 0)));
    const ratio = sellAmount / t.partsSellTotal;
    return {
        feeShare: round2(liveFeeAmount * ratio),
        serviceFeeShare: round2(liveServiceFeeAmount * ratio)
    };
}

function liveWholeOrderReturnShare(order) {
    const t = orderTotals(order);
    const liveFeeAmount = round2(Math.max(0, t.feeAmount - (Number(order.returnKeptFeeAmount) || 0)));
    const liveServiceFeeAmount = round2(Math.max(0, t.serviceFeeAmount - (Number(order.returnKeptServiceFeeAmount) || 0)));
    const liveDeliveryAmount = round2(Math.max(0, t.deliveryFeeAmount - (Number(order.returnKeptDeliveryAmount) || 0)));
    return {
        feeAmount: liveFeeAmount,
        serviceFeeAmount: liveServiceFeeAmount,
        deliveryAmount: liveDeliveryAmount,
        total: round2(liveFeeAmount + liveServiceFeeAmount + liveDeliveryAmount)
    };
}

function openReturnFeeChoiceModal(shareAmount, includesDelivery, onChoice) {
    const root = document.getElementById("confirm-root");

function applyPartReturnOnOrder(order, part, extraRefundCap) {
    extraRefundCap = round2(Math.max(0, Number(extraRefundCap) || 0));
    const hasReceivable = partPurchaseCostSettled(order, part);
    part.returned = true;
    part.returnHasReceivable = hasReceivable;
    part.returnCollected = false;
    const sellAmount = part.sellPrice !== null && part.sellPrice !== undefined && part.sellPrice !== "" ? (Number(part.qty) || 1) * Number(part.sellPrice) : 0;
    const t = orderTotals(order);
    const overpay = round2(t.customerPaidAmount - t.sellTotal);
    let leftoverExcess = 0;
    if (overpay > .01) {
        const cap = round2(sellAmount + extraRefundCap);
        const refundAmount = round2(cap > 0 ? Math.min(overpay, cap) : overpay);
        leftoverExcess = round2(Math.max(0, overpay - refundAmount));
        part.customerRefundConfirmed = false;
        if (!Array.isArray(order.customerPayments)) order.customerPayments = [];
        order.customerPayments.push({
            id: uid("pay"),
            amount: refundAmount,
            method: "مرتجع",
            date: todayNumeric(),
            returnAdjustment: true,
            linkedPartId: part.id
        });
    }
    return leftoverExcess;
}

function applyPartReturn(part, extraRefundCap) {
    return applyPartReturnOnOrder(draft, part, extraRefundCap);
}

function orderCustomerRefundStatusHtml(order) {
    let pendingTotal = 0, confirmedTotal = 0;
    (order.parts || []).forEach(p => {
        if (!p.returned) return;

        if (p.customerRefundConfirmed) confirmedTotal += Number(adj.amount) || 0; else pendingTotal += Number(adj.amount) || 0;
    });
    pendingTotal = round2(pendingTotal);
    confirmedTotal = round2(confirmedTotal);
    if (pendingTotal <= 0 && confirmedTotal <= 0) return "";

    return (pendingTotal > 0 ? '<div class="customer-refund-status customer-refund-status-pending">يجب إرجاع ' + fmtMoney(pendingTotal) + " للزبون " + confirmBtn + "</div>" : "") + (confirmedTotal > 0 ? '<div class="customer-refund-status customer-refund-status-done">✅ تم إرجاع ' + fmtMoney(confirmedTotal) + " للزبون</div>" : "");
}

async function onSaveOrder() {
    if (!draft.isNew) {
        const liveOrder = appData.orders.find(o => o.id === draft.id);
        if (!liveOrder) {
            showToast("هذه الطلبية انحذفت من مكان تاني — أغلقنا النافذة حتى ما ترجع تنحفظ من جديد", "error");
            closeModal();
            return false;
        }
        if (draftOpenedAtUpdatedAt && liveOrder.updatedAt && liveOrder.updatedAt !== draftOpenedAtUpdatedAt) {
            document.removeEventListener("keydown", escListener);
            const proceedAnyway = await new Promise(resolve => {
                confirmAction({
                    title: "الطلبية اتغيّرت من مكان تاني",
                    message: "صار عليها تحديث (ممكن قبول اقتراح تسعير من عامر، أو تعديل من مستخدم تاني) بعد ما فتحت هالنافذة. لو كملت وحفظت، بيضيع هداك التحديث. الأفضل تسكّر وتفتحها من جديد لتشوف آخر نسخة.",
                    confirmLabel: "كمّل واحفظ نسختي (بيلغي تعديلهم)",
                    cancelLabel: "سكّر بدون حفظ",
                    dangerous: true,
                    onConfirm: () => resolve(true),
                    onCancel: () => resolve(false)
                });
            });
            if (!proceedAnyway) {
                closeModal();
                return false;
            }
            document.addEventListener("keydown", escListener);
        }
    }
    if (!draft.orderNumber || !draft.orderNumber.trim()) {
        showToast("لازم تكتب رقم الطلب", "error");
        return false;
    }
    const dup = appData.orders.find(o => o.orderNumber.trim() === draft.orderNumber.trim() && o.id !== draft.id);
    if (dup) {
        showToast("رقم الطلب مستخدم من قبل، غيّره", "error");
        return false;
    }
    if (!vinApplyForSave(draft, "order")) return false;
    if (mediaStagedOnBlankParts(draft.id, draft.parts)) return false;
    const cleanedParts = draft.parts.filter(p => p.description && p.description.trim()).map(p => Object.assign({}, p, {
        id: p.id,
        description: p.description.trim(),
        qty: p.qty === "" || p.qty == null || Number(p.qty) <= 0 ? 1 : Math.max(1, Number(p.qty)),
        costPrice: p.costPrice === "" ? 0 : Math.max(0, Number(p.costPrice) || 0),
        sellPrice: p.sellPrice === "" || p.sellPrice === null || p.sellPrice === undefined ? null : Math.max(0, Number(p.sellPrice) || 0),
        used: !!p.used,
        included: p.included !== false,
        supplierId: p.supplierId || null,
        returned: !!p.returned,
        returnHasReceivable: !!p.returnHasReceivable,
        returnCollected: !!p.returnCollected,
        customerRefundConfirmed: !!p.customerRefundConfirmed
    }));
    if (cleanedParts.length === 0) {
        showToast("لازم تضيف وصف لقطعة وحدة على الأقل", "error");
        return false;
    }
    if (currentUserRole === "full" && !hasElevatedAccess() && !draft.customerId) {
        document.removeEventListener("keydown", escListener);
        await confirmReminder("ما حددت عميل لهذه الطلبية.");
        document.addEventListener("keydown", escListener);
    }
    const paymentsMissingMethod = (draft.customerPayments || []).some(p => !p.returnAdjustment && p.amount !== "" && p.amount != null && Number(p.amount) > 0 && !p.method);
    if (paymentsMissingMethod) {
        showToast("لازم تحدد طريقة الدفع (كاش/شبكة) لكل دفعة قبل الحفظ", "error");
        return false;
    }
    const cleanedPayments = (draft.customerPayments || []).filter(p => p.amount !== "" && p.amount != null && Number(p.amount) > 0).map(p => ({
        id: p.id,
        amount: Number(p.amount) || 0,
        method: p.method || "",
        date: (p.date || "").trim(),
        returnAdjustment: !!p.returnAdjustment,
        linkedPartId: p.linkedPartId || null
    }));
    draft.parts = cleanedParts;
    draft.customerPayments = cleanedPayments;
    draft.orderNumber = draft.orderNumber.trim();
    draft.orderLabel = (draft.orderLabel || "").trim();
    draft.updatedAt = (new Date).toISOString();
    const orderWasNew = !!draft.isNew;
    const draftId = draft.id;
    const savingOrder = draft;
    const scrapyardCancellationsSnapshot = new Set(pendingScrapyardCancellations);
    const editProposalsCancellationSnapshot = pendingEditProposalsCancellation;
    const partProposalPurgesSnapshot = new Set(pendingPartProposalPurges);
    const mediaSnap = mediaTakeStagedSnapshot(draftId);
    const savedVin = savingOrder.vin || "";
    const saved = await persistOrder(savingOrder, orderWasNew);
    if (!saved) {
        mediaRestoreStagedSnapshot(mediaSnap);
        return false;
    }
    delete savingOrder.isNew;
    const idx = appData.orders.findIndex(o => o.id === savingOrder.id);
    if (idx >= 0) appData.orders[idx] = savingOrder; else appData.orders.push(savingOrder);
    mediaAfterSaveSuccess(savingOrder.id, mediaSnap, cleanedParts);
    if (scrapyardCancellationsSnapshot.size) {
        for (const partId of scrapyardCancellationsSnapshot) {
            await cancelPendingScrapyardProposalsForPart(partId);
        }
    }
    if (editProposalsCancellationSnapshot) {
        await cancelPendingSuppliedGatedProposalsForOrder(savingOrder.id);
        await cancelPendingScrapyardProposalsForOrder(savingOrder.id);
    }
    if (partProposalPurgesSnapshot.size) {
        for (const partId of partProposalPurgesSnapshot) {
            await purgeEditProposalsForPart(savingOrder.id, partId);
        }
    }
    renderKPIs();
    renderTable();
    updateCustomersBadge();
    updateSuppliersBadge();
    showToast("تم حفظ الطلبية", "ok");
    if (!orderModalStillOpen(draftId)) return true;
    draftOpenedAtUpdatedAt = draft.updatedAt;
    draftVinAtOpen = savedVin;
    editingPayments = {};
    pendingScrapyardCancellations.clear();
    pendingEditProposalsCancellation = false;
    pendingPartProposalPurges.clear();
    const root = document.getElementById("modal-root");
    const prevBackdrop = root.querySelector(".modal-backdrop");
    const prevScrollTop = prevBackdrop ? prevBackdrop.scrollTop : 0;
    root.innerHTML = modalHtml(draft);
    attachModalHandlers();
    updateModalTotals();
    const newBackdrop = root.querySelector(".modal-backdrop");
    if (newBackdrop) newBackdrop.scrollTop = prevScrollTop;
    return true;
}

function newMediaId() {
    const c = typeof crypto !== "undefined" ? crypto : null;
    if (c && typeof c.randomUUID === "function") return String(c.randomUUID()).toLowerCase();
    const b = new Uint8Array(16);
    if (c && typeof c.getRandomValues === "function") c.getRandomValues(b); else for (let i = 0; i < 16; i++) b[i] = Math.floor(Math.random() * 256);
    b[6] = b[6] & 15 | 64;
    b[8] = b[8] & 63 | 128;
    let h = "";
    for (let i = 0; i < 16; i++) h += (b[i] < 16 ? "0" : "") + b[i].toString(16);
    return h.slice(0, 8) + "-" + h.slice(8, 12) + "-" + h.slice(12, 16) + "-" + h.slice(16, 20) + "-" + h.slice(20);
}
