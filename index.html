function refreshSuppliersList(){
  const list = document.getElementById('suppliers-items-list');
  if(!list) return;
  list.innerHTML = suppliersItemsListHtml();
  bindSupplierRowEvents();
}

function renderSuppliersView(){
  const el = document.getElementById('suppliers-view');
  el.innerHTML = suppliersViewHtml();
  bindSuppliersViewEvents();
}

function bindSuppliersViewEvents(){
  document.getElementById('btn-back-to-orders-from-suppliers').addEventListener('click', closeSuppliersView);
  document.getElementById('add-supplier-btn').addEventListener('click', async ()=>{
    const nameInput = document.getElementById('new-supplier-name-input');
    const phoneInput = document.getElementById('new-supplier-phone-input');
    const handlesNewCheck = document.getElementById('new-supplier-handles-new-check');
    const handlesUsedCheck = document.getElementById('new-supplier-handles-used-check');
    const name = nameInput.value.trim();
    const phone = phoneInput.value.trim();
    if(!name && !phone){ showToast('اكتب اسم أو رقم جوال على الأقل', 'error'); return; }
    if(!handlesNewCheck.checked && !handlesUsedCheck.checked){
      showToast('لازم تحدد نوع واحد على الأقل (قطع جديدة/مستعملة)', 'error');
      return;
    }
    const newSupplier = {
      id: uid('sup'), name, phone, notes:'', extraPhones: [],
      handlesNew: handlesNewCheck.checked, handlesUsed: handlesUsedCheck.checked
    };
    if(!Array.isArray(appData.suppliers)) appData.suppliers = [];
    appData.suppliers.push(newSupplier);
    nameInput.value = ''; phoneInput.value = '';
    handlesNewCheck.checked = false; handlesUsedCheck.checked = false;
    refreshSuppliersList();
    await persistSupplier(newSupplier);
  });
  const searchInput = document.getElementById('suppliers-search-input');
  searchInput.addEventListener('input', e=>{
    suppliersSearchQuery = e.target.value;
    refreshSuppliersList();
  });
  bindSupplierRowEvents();
}

function bindSupplierRowEvents(){
  document.querySelectorAll('#suppliers-items-list .task-item-row').forEach(row=>{
    const sid = row.getAttribute('data-supplier-id');
    const supplier = (appData.suppliers||[]).find(s=>s.id===sid);
    if(!supplier) return;

    const historyBtn = row.querySelector('.supplier-history-btn');
    if(historyBtn) historyBtn.addEventListener('click', ()=> openSupplierHistoryModal(sid));

    const removeBtn = row.querySelector('.task-item-remove-btn');
    if(removeBtn){
      removeBtn.addEventListener('click', ()=>{
        confirmAction({
          title: 'حذف هذا المورد؟',
          message: 'الطلبيات القديمة المرتبطة به بتبقى، بس بدون اسم مورد محدد.',
          confirmLabel: 'تأكيد الحذف',
          dangerous: true,
          onConfirm: async ()=>{
            appData.suppliers = appData.suppliers.filter(s=>s.id!==sid);
            delete editingSuppliers[sid];
            refreshSuppliersList();
            await deleteSupplier(sid);
          }
        });
      });
    }

    const editBtn = row.querySelector('.supplier-edit-btn');
    if(editBtn){
      editBtn.addEventListener('click', ()=>{
        editingSuppliers[sid] = true;
        refreshSuppliersList();
      });
    }

    const saveBtn = row.querySelector('.supplier-save-btn');
    if(saveBtn){
      saveBtn.addEventListener('click', ()=>{
        delete editingSuppliers[sid];
        refreshSuppliersList();
      });
    }

    const nameInput = row.querySelector('.supplier-name-input');
    if(nameInput){
      nameInput.addEventListener('change', async e=>{
        supplier.name = e.target.value; await persistSupplier(supplier);
      });
    }
    const phoneInput = row.querySelector('.supplier-phone-input');
    if(phoneInput){
      phoneInput.addEventListener('change', async e=>{
        supplier.phone = e.target.value; await persistSupplier(supplier);
      });
    }
    const addPhoneBtn = row.querySelector('.supplier-add-phone-btn');
    if(addPhoneBtn){
      addPhoneBtn.addEventListener('click', async ()=>{
        if(!Array.isArray(supplier.extraPhones)) supplier.extraPhones = [];
        supplier.extraPhones.push('');
        refreshSuppliersList();
        await persistSupplier(supplier);
      });
    }
    const handlesNewCheck = row.querySelector('.supplier-handles-new-check');
    if(handlesNewCheck){
      handlesNewCheck.addEventListener('change', async e=>{
        if(!e.target.checked && !supplier.handlesUsed){
          e.target.checked = true;
          showToast('لازم تحدد نوع واحد على الأقل', 'error');
          return;
        }
        supplier.handlesNew = e.target.checked; await persistSupplier(supplier);
      });
    }
    const handlesUsedCheck = row.querySelector('.supplier-handles-used-check');
    if(handlesUsedCheck){
      handlesUsedCheck.addEventListener('change', async e=>{
        if(!e.target.checked && !supplier.handlesNew){
          e.target.checked = true;
          showToast('لازم تحدد نوع واحد على الأقل', 'error');
          return;
        }
        supplier.handlesUsed = e.target.checked; await persistSupplier(supplier);
      });
    }
    row.querySelectorAll('.supplier-extra-phone-input').forEach(inp=>{
      inp.addEventListener('change', async e=>{
        const idx = Number(inp.getAttribute('data-phone-index'));
        supplier.extraPhones[idx] = e.target.value;
        await persistSupplier(supplier);
      });
    });
    row.querySelectorAll('.supplier-remove-phone-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const idx = Number(btn.getAttribute('data-phone-index'));
        supplier.extraPhones.splice(idx, 1);
        refreshSuppliersList();
        await persistSupplier(supplier);
      });
    });
  });
}

function customerOrderStats(customerId){
  let count = 0, remaining = 0;
  (appData.orders||[]).forEach(o=>{
    if(o.customerId !== customerId) return;
    if(!o.supplied) return; // قبل اتمام التوريد ما تُحسب على العميل — بس الربط محفوظ لغرض التحليل لاحقًا
    count++;
    const t = orderTotals(o);
    if(t.hasSell) remaining += t.customerRemaining;
  });
  return { count, remaining: round2(remaining) };
}

/* قطع رجعها العميل ودفع ثمنها مسبقًا — لازم إرجاع مبلغها له، ما تُخصم من الصندوق إلا بعد تأكيد صريح */
function customerRefundsPending(customerId){
  const rows = [];
  (appData.orders||[]).forEach(o=>{
    if(o.customerId !== customerId) return;
    if(!o.confirmed) return; // الإرجاع بكل تفرعاته يخص الطلبيات المؤكدة فقط
    (o.parts||[]).forEach(p=>{
      if(!p.returned || p.customerRefundConfirmed) return;
      if(!partIsIncludedInOrder(o,p)) return; // قطعة مستبعدة يدويًا من الطلبية — ما تُحسب
      const adjustment = (o.customerPayments||[]).find(pay=>pay.returnAdjustment && pay.linkedPartId===p.id);
      if(!adjustment) return;
      rows.push({
        orderId: o.id, orderNumber: o.orderNumber, orderLabel: o.orderLabel, partId: p.id,
        description: p.description||'', amount: round2(Number(adjustment.amount)||0)
      });
    });
  });
  return rows;
}

function customerRefundTotal(customerId){
  return round2(customerRefundsPending(customerId).reduce((s,r)=>s+r.amount,0));
}

}

/* سجل طلبيات العميل — مقسّم لجارية (لسه ما تسدد بالكامل) وسابقة (مسددة)، كل صف يفتح طلبيته */
function customerOrderHistory(customerId){
  const ongoing = [], past = [];
  (appData.orders||[]).forEach(o=>{
    if(o.customerId !== customerId) return;
    if(!o.supplied) return; // قبل اتمام التوريد الطلبية ما تظهر بسجل العميل، بس الربط محفوظ
    const t = orderTotals(o);
    const row = {
      orderId: o.id, orderNumber: o.orderNumber, orderLabel: o.orderLabel,
      total: t.hasSell ? t.sellTotal : 0, remaining: t.hasSell ? t.customerRemaining : 0,
      date: o.updatedAt || o.createdAt || ''
    };
    (t.hasSell && t.customerRemaining>0 ? ongoing : past).push(row);
  });
  const byDateDesc = (a,b)=> new Date(b.date||0) - new Date(a.date||0);
  ongoing.sort(byDateDesc); past.sort(byDateDesc);
  return { ongoing, past };
}

function orderHistoryRowHtml(row){
  return '<button type="button" class="purchase-history-row" data-open-order="'+row.orderId+'">' +
    '<div class="purchase-history-row-main">' +

      '<span class="num '+(row.remaining>0?'text-rust':'text-green')+'">'+fmtMoney(row.remaining>0?row.remaining:row.total)+'</span>' +
    '</div>' +
    '<div class="purchase-history-row-sub"><span>'+isoToDisplayDate(row.date)+'</span></div>' +
  '</button>';
}

function openCustomerHistoryModal(customerId){
  const customer = (appData.customers||[]).find(c=>c.id===customerId);
  const label = customer ? (customer.name||customer.phone||'عميل') : 'عميل';
  const { ongoing, past } = customerOrderHistory(customerId);
  const ongoingTotal = round2(ongoing.reduce((s,r)=>s+r.remaining,0));
  const pastTotal = round2(past.reduce((s,r)=>s+r.total,0));
  const refunds = customerRefundsPending(customerId);
  const refundsTotal = round2(refunds.reduce((s,r)=>s+r.amount,0));
  const root = document.getElementById('modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" data-close-backdrop>' +
      '<div class="modal-card modal-card-sm" role="dialog" aria-modal="true">' +
        '<div class="modal-header"><div class="modal-title">سجل طلبيات — '+escapeHtml(label)+'</div>' +
          '<button type="button" class="icon-btn" id="customer-history-close-btn" aria-label="إغلاق">✕</button></div>' +
        (refunds.length ? '<div class="purchase-history-section">' +
          '<div class="purchase-history-section-title"><span>يجب إرجاعه للعميل</span><span class="num text-rust">'+fmtMoney(refundsTotal)+'</span></div>' +
          refunds.map(customerRefundRowHtml).join('') +
        '</div>' : '') +
        '<div class="purchase-history-section">' +
          '<div class="purchase-history-section-title"><span>جارية (لم تُسدد بالكامل)</span><span class="num text-rust">'+fmtMoney(ongoingTotal)+'</span></div>' +
          (ongoing.length ? ongoing.map(orderHistoryRowHtml).join('') : '<div class="expense-empty-hint">ما فيه طلبيات جارية</div>') +
        '</div>' +
        '<div class="purchase-history-section">' +
          '<div class="purchase-history-section-title"><span>سابقة (مسددة)</span><span class="num text-green">'+fmtMoney(pastTotal)+'</span></div>' +
          (past.length ? past.map(orderHistoryRowHtml).join('') : '<div class="expense-empty-hint">ما فيه طلبيات سابقة</div>') +
        '</div>' +
      '</div>' +
    '</div>';
  root.classList.add('modal-open');
  const close = ()=>{ root.innerHTML=''; root.classList.remove('modal-open'); };
  root.querySelector('[data-close-backdrop]').addEventListener('click', e=>{
    if(e.target.hasAttribute('data-close-backdrop')) close();
  });
  root.querySelector('#customer-history-close-btn').addEventListener('click', close);
  root.querySelectorAll('[data-open-order]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      close();
      openModal('edit', btn.getAttribute('data-open-order'));
    });
  });
  root.querySelectorAll('.customer-refund-confirm-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const orderId = btn.getAttribute('data-order-id');
      const partId = btn.getAttribute('data-part-id');
      confirmAction({
        title: 'تأكيد إرجاع هذا المبلغ للعميل؟',
        message: 'رح يُخصم المبلغ تلقائيًا من صافي الصندوق.',
        confirmLabel: 'تم الإرجاع',
        dangerous: true,
        onConfirm: async ()=>{
          const order = appData.orders.find(o=>o.id===orderId);
          if(!order) return;
          const part = (order.parts||[]).find(p=>p.id===partId);
          if(!part) return;
          part.customerRefundConfirmed = true;
          order.updatedAt = new Date().toISOString();
          await persistOrder(order);
          showToast('تم تسجيل إرجاع المبلغ، وخُصم من الصندوق', 'ok');
          refreshCustomersList();
          updateCustomersBadge();
          openCustomerHistoryModal(customerId);
        }
      });
    });
  });
}

let customersSearchQuery = '';
function customersMatchingSearch(){
  const q = customersSearchQuery.trim().toLowerCase();
  let rows = appData.customers||[];
  if(q){
    rows = rows.filter(c=>{
      const hay = [c.name, c.phone].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  // اللي لازم يرجعلهم مبلغ (بانتظار التحويل) يطلعوا فوق
  return [...rows].sort((a,b)=>{
    const ap = customerRefundTotal(a.id)>0 ? 1 : 0;
    const bp = customerRefundTotal(b.id)>0 ? 1 : 0;
    return bp-ap;
  });
}

function customersItemsListHtml(){
  const rows = customersMatchingSearch();
  if(!rows.length) return '<div class="expense-empty-hint">'+(customersSearchQuery.trim() ? 'ما فيه نتائج مطابقة' : 'ما فيه عملاء مضافين بعد')+'</div>';
  return rows.map(customerRowHtml).join('');
}

function bindCustomersViewEvents(){
  document.getElementById('btn-back-to-orders-from-customers').addEventListener('click', closeCustomersView);
  document.getElementById('add-customer-btn').addEventListener('click', async ()=>{
    const nameInput = document.getElementById('new-customer-name-input');

    const phone = phoneInput.value.trim();

  });

function bindCustomerRowEvents(){
  document.querySelectorAll('#customers-items-list .task-item-row').forEach(row=>{
    const cid = row.getAttribute('data-customer-id');
    const customer = (appData.customers||[]).find(c=>c.id===cid);
    if(!customer) return;

    const nameInput = row.querySelector('.customer-name-input');
    if(nameInput){
      nameInput.addEventListener('change', async e=>{
        customer.name = e.target.value; await persistCustomer(customer);
      });
    }
    const phoneInput = row.querySelector('.customer-phone-input');
    if(phoneInput){
      phoneInput.addEventListener('change', async e=>{
        customer.phone = e.target.value; await persistCustomer(customer);
      });
    }
    const historyBtn = row.querySelector('.customer-history-btn');
    if(historyBtn) historyBtn.addEventListener('click', ()=> openCustomerHistoryModal(cid));

    const editBtn = row.querySelector('.customer-edit-btn');
    if(editBtn){
      editBtn.addEventListener('click', ()=>{
        editingCustomers[cid] = true;
        refreshCustomersList();
      });
    }
    const saveBtn = row.querySelector('.customer-save-btn');
    if(saveBtn){
      saveBtn.addEventListener('click', ()=>{
        delete editingCustomers[cid];
        refreshCustomersList();
      });
    }

    const removeBtn = row.querySelector('.task-item-remove-btn');
    if(removeBtn){
      removeBtn.addEventListener('click', ()=>{
        confirmAction({
          title: 'حذف هذا العميل؟',
          message: 'الطلبيات القديمة المرتبطة فيه بتبقى، بس بدون عميل محدد.',
          confirmLabel: 'تأكيد الحذف',
          dangerous: true,
          onConfirm: async ()=>{
            appData.customers = appData.customers.filter(c=>c.id!==cid);
            delete editingCustomers[cid];
            refreshCustomersList();
            await deleteCustomer(cid);
          }
        });
      });
    }
  });
}

/* ---------- access gate (Supabase Auth — email magic link, restricted to an allowlist) ---------- */
let appInitDone = false;

function showAuthGate(msg, msgType){
  document.getElementById('app-root').style.display = 'none';
  document.getElementById('auth-gate').classList.remove('hidden');
  const msgEl = document.getElementById('auth-message');
  msgEl.textContent = msg || '';
  msgEl.className = 'auth-message' + (msgType ? ' '+msgType : '');
}

async function showAppIfAllowed(session){
  const email = (session && session.user && session.user.email || '').toLowerCase();
  let role = 'full';
  try{
    const { data, error } = await sb.from('allowed_emails').select('email, role').eq('email', email).maybeSingle();
    if(error) throw error;
    if(!data){
      await sb.auth.signOut();
      showAuthGate('هذا البريد (' + email + ') غير مصرّح له بالدخول لهذا التطبيق. تواصل مع الإدارة إذا كنت تعتقد إنه خطأ.', 'error');
      return;
    }
    role = data.role || 'full';
  }catch(e){
    showAuthGate('تعذر التحقق من صلاحية الدخول، حاول مرة أخرى.', 'error');
    return;
  }
  document.getElementById('auth-gate').classList.add('hidden');

  if(role === 'scrapyard'){
    document.getElementById('scrapyard-root').style.display = '';
    initScrapyardView(email);
    return;
  }

  document.getElementById('app-root').style.display = '';
  startPresenceHeartbeat(email);
  const treasuryBtn = document.getElementById('btn-open-treasury');
  if(treasuryBtn) treasuryBtn.style.display = TREASURY_ALLOWED_EMAILS.includes(email) ? '' : 'none';
  if(!appInitDone){
    appInitDone = true;
    init();
  }
}

/* ---------- shared settlement screen — يخدم نوعين: 'used' (سداد التشاليح) و 'new' (سداد الجديد للموردين).
   يُستخدم من الموظف (canManage=false، بيقرأ عن طريق RPC وبيقترح تعديلات بدون لمس app_data)
   ومن صاحب الحساب (canManage=true، بيقرأ appData.orders محليًا وبيقدر يقبل/يرفض مباشرة). */
const SETTLEMENT_KINDS = {
  used: { title:'سداد التشاليح', homeLabel:'🧾 سداد التشاليح', rpc:'get_scrapyard_used_parts', paidField:'paidToAmer' },
  new:  { title:'سداد الجديد',   homeLabel:'🧾 سداد الجديد',   rpc:'get_new_parts_supplier',   paidField:'paidToSupplier' }
};

let scrapyardSharedState = { email:'', canManage:false, activeKind:'used', parts:[], returnReceivables:[], proposals:[], confirmations:[], partsByKind:{used:[],new:[]}, tasks:[], suppliers:[], custodyBalance:0 };
let scrapyardCurrentScreen = null; // 'home' | 'settlement' | 'tasks' — يحدّد هل نحدّث الشاشة تلقائيًا عند وصول تغيير لحظي

async function initScrapyardView(email){
  scrapyardSharedState.email = email;
  scrapyardSharedState.canManage = TREASURY_ALLOWED_EMAILS.includes(email);
  const root = document.getElementById('scrapyard-root');
  root.innerHTML = '<div class="loading">جاري تحميل البيانات…</div>';
  // دخول عامر المباشر ما بيمر بـ init()، فلازم نسجّل حضوره يدويًا حتى يظهر بقائمة "آخر ظهور" عند صاحب الحساب
  startPresenceHeartbeat(email);
  // ونشترك بالتحديث اللحظي هون كمان (الدالتين محميتين من التكرار)
  subscribeScrapyardRealtime();
  subscribeScrapyardAppDataRealtime();
  // دخول عامر المباشر (دوره "scrapyard") يوديه للصفحة الرئيسية لقسم المشتريات؛
  // دخول صاحب الحساب من داخل التطبيق (زر الصندوق) يوديه لشاشة السداد مباشرة كالمعتاد
  if(scrapyardSharedState.canManage){
    await loadScrapyardData('used');
    renderScrapyardView();
  } else {
    await loadScrapyardHomeTotals();
    renderScrapyardHomeView();
  }
}

async function openScrapyardSharedView(kind){
  document.getElementById('app-root').style.display = 'none';
  document.getElementById('scrapyard-root').style.display = '';
  document.getElementById('scrapyard-root').innerHTML = '<div class="loading">جاري تحميل البيانات…</div>';
  scrapyardSharedState.email = presenceEmail;
  scrapyardSharedState.canManage = TREASURY_ALLOWED_EMAILS.includes(presenceEmail);
  await loadScrapyardData(kind);
  renderScrapyardView();
}

function closeScrapyardSharedView(){
  document.getElementById('scrapyard-root').style.display = 'none';
  document.getElementById('app-root').style.display = '';
}

function ownerScrapyardPartsFromAppData(kind){
  const list = [];
  const paidField = SETTLEMENT_KINDS[kind].paidField;
  const wantUsed = kind === 'used';
  // الطلبيات يلي تم توريدها فقط — غير الموردة ما بتظهر بشاشة السداد
  appData.orders.filter(o=>o.supplied && !o[paidField]).forEach(o=>{
    (o.parts||[]).forEach(p=>{
      if(p.returned) return; // القطعة المرتجعة لها مسارها المنفصل (مرتجعات)، مو ضمن قائمة "غير المسدّدة"
      if(!partIsIncludedInOrder(o,p)) return; // قطعة مستبعدة يدويًا من الطلبية — ما تُحسب
      if(!!p.used === wantUsed){
        list.push({ order_id:o.id, order_number:o.orderNumber, order_label:o.orderLabel, supplied_at:o.suppliedAt||null, part_id:p.id, description:p.description, qty:p.qty, cost_price:p.costPrice, supplier_id:p.supplierId||null });
      }
    });
  });
  return list;
}

/* قطع مرتجعة مدفوعة مسبقًا وبانتظار التحصيل — تُخصم من إجمالي المستحق للسداد بهذه الشاشة
   (لصاحب الحساب محليًا؛ لعامر عن طريق get_scrapyard_return_receivables). عرض فقط، بدون
   إمكانية تأكيد التحصيل هون — هذا حصريًا بشاشة الموردين عند صاحب الحساب. */
function ownerScrapyardReturnReceivablesFromAppData(kind){
  const list = [];
  const wantUsed = kind === 'used';
  appData.orders.filter(o=>o.confirmed).forEach(o=>{
    (o.parts||[]).forEach(p=>{
      if(!p.returned || !p.returnHasReceivable || p.returnCollected) return;
      if(!!p.used !== wantUsed) return;
      if(!partIsIncludedInOrder(o,p)) return; // قطعة مستبعدة يدويًا من الطلبية — ما تُحسب
      list.push({ order_id:o.id, order_number:o.orderNumber, order_label:o.orderLabel, part_id:p.id, description:p.description, qty:p.qty, cost_price:p.costPrice, supplier_id:p.supplierId||null });
    });
  });
  return list;
}

/* رجوع عامر لصفحته الرئيسية — بيحدّث المجاميع والمهام أول ما يرجع */
function goToScrapyardHome(){

/* يُستخدم فقط لصفحة عامر الرئيسية — يجيب مجموع كل نوع (تشاليح + جديد) لعرضهم كمؤشرين، والمهام */
async function loadScrapyardHomeTotals(){
  const [usedRes, newRes, tasksRes, suppliersRes, custodyRes] = await Promise.all([
    sb.rpc('get_scrapyard_used_parts'),
    sb.rpc('get_new_parts_supplier'),
    sb.rpc('get_purchases_tasks'),
    sb.from('suppliers').select('*'),
    sb.rpc('get_amer_custody_balance')
  ]);
  if(usedRes.error) console.error('get_scrapyard_used_parts:', usedRes.error);
  if(newRes.error) console.error('get_new_parts_supplier:', newRes.error);
  if(tasksRes.error) console.error('get_purchases_tasks:', tasksRes.error);
  if(suppliersRes.error) console.error('suppliers:', suppliersRes.error);
  if(custodyRes.error) console.error('get_amer_custody_balance:', custodyRes.error);
  scrapyardSharedState.partsByKind.used = usedRes.error ? [] : (usedRes.data || []);
  scrapyardSharedState.partsByKind.new = newRes.error ? [] : (newRes.data || []);
  scrapyardSharedState.tasks = tasksRes.error ? [] : (tasksRes.data || []);
  scrapyardSharedState.suppliers = suppliersRes.error ? [] : (suppliersRes.data || []);
  scrapyardSharedState.custodyBalance = custodyRes.error ? 0 : (Number(custodyRes.data)||0);
}

async function loadScrapyardData(kind){
  scrapyardSharedState.activeKind = kind;
  try{
    if(scrapyardSharedState.canManage){
      scrapyardSharedState.parts = ownerScrapyardPartsFromAppData(kind);
      scrapyardSharedState.returnReceivables = ownerScrapyardReturnReceivablesFromAppData(kind);
      const [proposalsRes, confirmationsRes, suppliersRes] = await Promise.all([
        sb.from('scrapyard_proposals').select('*').eq('kind', kind).order('created_at', {ascending:false}),
        sb.from('scrapyard_order_confirmations').select('*').eq('kind', kind),
        sb.from('suppliers').select('*')
      ]);
      if(proposalsRes.error) throw proposalsRes.error;
      scrapyardSharedState.proposals = proposalsRes.data || [];
      scrapyardSharedState.confirmations = confirmationsRes.data || [];
      scrapyardSharedState.suppliers = suppliersRes.error ? [] : (suppliersRes.data || []);
    } else {
      const [partsRes, returnReceivablesRes, proposalsRes, confirmationsRes, suppliersRes] = await Promise.all([
        sb.rpc(SETTLEMENT_KINDS[kind].rpc),
        sb.rpc('get_scrapyard_return_receivables', { p_kind: kind }),
        sb.from('scrapyard_proposals').select('*').eq('kind', kind).eq('submitted_by', scrapyardSharedState.email).order('created_at', {ascending:false}),
        sb.from('scrapyard_order_confirmations').select('*').eq('kind', kind),
        sb.from('suppliers').select('*')
      ]);
      if(partsRes.error) throw partsRes.error;
      scrapyardSharedState.parts = partsRes.data || [];
      scrapyardSharedState.returnReceivables = returnReceivablesRes.error ? [] : (returnReceivablesRes.data || []);
      scrapyardSharedState.proposals = proposalsRes.data || [];
      scrapyardSharedState.confirmations = confirmationsRes.data || [];
      scrapyardSharedState.suppliers = suppliersRes.error ? [] : (suppliersRes.data || []);
    }
  }catch(e){
    showToast('تعذر تحميل بيانات '+SETTLEMENT_KINDS[kind].title, 'error');
  }
}

function groupScrapyardPartsByOrder(parts){
  const map = {}; const order = [];
  parts.forEach(p=>{
    if(!map[p.order_id]){ map[p.order_id] = { order_id:p.order_id, order_number:p.order_number, order_label:p.order_label, supplied_at:p.supplied_at||null, parts:[] }; order.push(map[p.order_id]); }
    map[p.order_id].parts.push(p);
  });
  return order;
}

/* عدد الأيام من تاريخ "تم التوريد" — لمعرفة كم مرّ على كل طلبية غير مسدّدة بعد */
function scrapyardDaysSinceSupply(suppliedAt){
  if(!suppliedAt) return null;
  const supplied = new Date(suppliedAt);
  if(isNaN(supplied.getTime())) return null;
  return Math.max(0, Math.floor((Date.now() - supplied.getTime()) / 86400000));
}

function arabicDaysLabel(n){
  if(n === 0) return 'منذ اليوم';
  if(n === 1) return 'منذ يوم';
  if(n === 2) return 'منذ يومان';
  if(n <= 10) return 'منذ '+n+' أيام';
  return 'منذ '+n+' يوم';
}

function scrapyardDaysSinceSupplyBadgeHtml(suppliedAt){
  const days = scrapyardDaysSinceSupply(suppliedAt);
  if(days == null) return '';
  const level = days > 7 ? 'text-rust' : (days >= 4 ? 'text-amber' : 'muted');
  return '<span class="scrapyard-days-since '+level+'" title="مرّ على التوريد — لمعرفة التأخير بالسداد">⏱️ '+arabicDaysLabel(days)+'</span>';
}

function scrapyardProposalForPart(partId){
  return scrapyardSharedState.proposals.find(pr=>pr.part_id===partId && pr.action!=='add');
}

function scrapyardAddProposalsForOrder(orderId){
  return scrapyardSharedState.proposals.filter(pr=>pr.order_id===orderId && pr.action==='add');
}

function scrapyardConfirmationForOrder(orderId){
  return scrapyardSharedState.confirmations.find(c=>c.order_id===orderId);
}

/* مسوّدات محلية للإدخال المباشر داخل الصف — بدون أي نافذة خارجية */
let scrapyardPriceDrafts = {};   // part_id -> السعر المقترح يلي عم يُكتب حاليًا
let scrapyardAddDrafts = {};     // order_id -> {description, qty, price} لصف القطعة الجديدة المفتوح
let scrapyardEditOpenFor = {};   // part_id -> true — خانة تعديل السعر مفتوحة (تظهر فقط بعد الضغط على "تعديل")

/* مجموع جديد للطلبية بعد اقتراح سعر جديد (سواء وهو عم يُكتب أو بعد إرساله) — null لو ما فيه أي تغيير مقترح */
function scrapyardGroupProposedSubtotal(group){
  let changed = false;
  let total = group.parts.reduce((s,p)=>{
    const qty = Number(p.qty)||1;
    const pr = scrapyardProposalForPart(p.part_id);
    if(pr){
      changed = true;
      if(pr.action === 'delete') return s;
      if(pr.action === 'edit') return s + (Number(pr.cost_price)||0)*qty;
      return s + (Number(p.cost_price)||0)*qty;
    }
    if(scrapyardEditOpenFor[p.part_id]){
      const draft = scrapyardPriceDrafts[p.part_id];
      if(draft!==undefined && draft!=='' && !isNaN(Number(draft))){
        changed = true;
        return s + Number(draft)*qty;
      }
    }
    return s + (Number(p.cost_price)||0)*qty;
  }, 0);
  const addProposals = scrapyardAddProposalsForOrder(group.order_id);
  if(addProposals.length){
    changed = true;
    total += addProposals.reduce((s,pr)=> s + (Number(pr.cost_price)||0)*(Number(pr.qty)||1), 0);
  }
  const addDraft = scrapyardAddDrafts[group.order_id];
  if(addDraft && addDraft.price){
    changed = true;
    total += (Number(addDraft.price)||0) * (Number(addDraft.qty)||1);
  }
  return changed ? total : null;
}

/* عامر بيقدر يعلّم المهمة كمنجزة/غير منجزة — التعديل بيصير مباشرة بقاعدة البيانات
   عن طريق دالة RPC مخصصة (عامر ما عنده appData كامل بجهازه أصلًا) */
async function togglePurchasesTaskDone(taskId, newDone){
  const task = (scrapyardSharedState.tasks||[]).find(t=>t.id===taskId);
  if(task) task.done = newDone; // تحديث فوري بالواجهة قبل رد السيرفر
  renderPurchasesTasksView();
  const { error } = await sb.rpc('set_purchases_task_done', { p_task_id: taskId, p_done: newDone });
  if(error){
    console.error('set_purchases_task_done:', error);
    if(task) task.done = !newDone; // رجّعها لحالتها لو فشل التحديث
    renderPurchasesTasksView();
    showToast('تعذر تحديث المهمة', 'error');
  }
}

/* المستحق لكل تشليح على حدة (صافي) — مبني على القطع المستعملة غير المسدّدة الظاهرة حاليًا،
   مطروح منه أي مبلغ مسترجع بانتظار التحصيل من نفس التشليح */
function scrapyardSupplierTotalsHtml(){
  const totals = {};
  (scrapyardSharedState.parts||[]).forEach(p=>{
    if(!p.supplier_id) return;
    totals[p.supplier_id] = round2((totals[p.supplier_id]||0) + (Number(p.cost_price)||0)*(Number(p.qty)||1));
  });
  (scrapyardSharedState.returnReceivables||[]).forEach(p=>{
    if(!p.supplier_id) return;
    totals[p.supplier_id] = round2((totals[p.supplier_id]||0) - (Number(p.cost_price)||0)*(Number(p.qty)||1));
  });
  const ids = Object.keys(totals);
  if(!ids.length) return '';
  const rows = ids.map(sid=>{
    const supplier = (scrapyardSharedState.suppliers||[]).find(s=>s.id===sid);
    const name = supplier ? (supplier.name||supplier.phone||'مورد') : 'غير معروف';
    return '<div class="scrapyard-supplier-total-row"><span>'+escapeHtml(name)+'</span><span class="num text-amber">'+fmtMoney(totals[sid])+'</span></div>';
  }).join('');
  return '<div class="section-block"><div class="section-head"><span class="section-title">المستحق لكل تشليح</span></div>' + rows + '</div>';
}

/* عرض القطع المرتجعة اللي المفروض تُحصّل قيمتها من المورد/التشليح — معلومة فقط بهذي الشاشة،
   ما فيها زر تحصيل (هذا حصريًا بشاشة الموردين عند صاحب الحساب) */

  const rowsHtml = rows.map(p=>{
    const supplier = (scrapyardSharedState.suppliers||[]).find(s=>s.id===p.supplier_id);
    const name = supplier ? (supplier.name||supplier.phone||'مورد') : 'غير محدد';
    const amount = round2((Number(p.cost_price)||0)*(Number(p.qty)||1));
    return '<div class="scrapyard-part-row">' +
      '<span class="scrapyard-part-desc">'+escapeHtml(p.description||'')+'</span>' +
      '<span class="num scrapyard-qty-slot">×'+(p.qty||1)+'</span>' +

/* تحديث المجموع الجديد فور الكتابة بخانة السعر — بدون إعادة رسم كامل الشاشة حتى لا يفقد التركيز */
function updateScrapyardSubtotalDisplay(orderId){
  const el = document.getElementById('scrapyard-subtotal-values-'+orderId);
  if(!el) return;
  const parts = scrapyardSharedState.parts.filter(p=>p.order_id===orderId);
  const subtotal = parts.reduce((s,p)=> s + (Number(p.cost_price)||0)*(Number(p.qty)||1), 0);
  const proposedSubtotal = scrapyardGroupProposedSubtotal({ order_id: orderId, parts });
  el.innerHTML = scrapyardSubtotalValuesHtml(subtotal, proposedSubtotal);
}

function bindScrapyardEvents(){
  const root = document.getElementById('scrapyard-root');
  const exitBtn = document.getElementById('btn-exit-scrapyard-shared');
  if(exitBtn) exitBtn.addEventListener('click', closeScrapyardSharedView);
  const backHomeBtn = document.getElementById('btn-scrapyard-back-home');
  if(backHomeBtn) backHomeBtn.addEventListener('click', goToScrapyardHome);
  const scrapLogo = document.getElementById('scrapyard-logo-img');
  if(scrapLogo) scrapLogo.addEventListener('click', goHomeFromLogo);
  bindScrapyardThemeToggle();
  const addSupplierBtn = document.getElementById('btn-add-scrapyard-supplier');
  if(addSupplierBtn) addSupplierBtn.addEventListener('click', openQuickAddScrapyardSupplierModal);

  // خانة تعديل السعر تظهر فقط بعد الضغط على "تعديل"
  root.querySelectorAll('[data-open-price-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      scrapyardEditOpenFor[btn.getAttribute('data-open-price-edit')] = true;
      renderScrapyardView();
    });
  });
  root.querySelectorAll('[data-cancel-price-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const partId = btn.getAttribute('data-cancel-price-edit');
      delete scrapyardEditOpenFor[partId];
      delete scrapyardPriceDrafts[partId];
      renderScrapyardView();
    });
  });

  // إدخال السعر المقترح مباشرة بالصف — والمجموع الجديد يتحدّث فورًا مع الكتابة
  root.querySelectorAll('[data-price-draft]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      scrapyardPriceDrafts[inp.getAttribute('data-price-draft')] = e.target.value;
      updateScrapyardSubtotalDisplay(inp.getAttribute('data-order-id'));
    });
    inp.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        sendScrapyardPriceProposal(inp.getAttribute('data-order-id'), inp.getAttribute('data-price-draft'));
      }
    });
  });
  root.querySelectorAll('[data-send-price]').forEach(btn=>{
    btn.addEventListener('click', ()=> sendScrapyardPriceProposal(btn.getAttribute('data-order-id'), btn.getAttribute('data-send-price')));
  });

  // صف اقتراح قطعة جديدة داخل نفس الصفحة
  root.querySelectorAll('[data-add-desc]').forEach(inp=>{
    inp.addEventListener('input', e=>{ scrapyardAddDrafts[inp.getAttribute('data-add-desc')].description = e.target.value; });
  });
  root.querySelectorAll('[data-add-qty]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const orderId = inp.getAttribute('data-add-qty');
      scrapyardAddDrafts[orderId].qty = e.target.value===''?1:Number(e.target.value);
      updateScrapyardSubtotalDisplay(orderId);
    });
  });
  root.querySelectorAll('[data-add-price]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const orderId = inp.getAttribute('data-add-price');
      scrapyardAddDrafts[orderId].price = e.target.value===''?null:Number(e.target.value);
      updateScrapyardSubtotalDisplay(orderId);
    });
  });
  root.querySelectorAll('[data-send-add]').forEach(btn=>{
    btn.addEventListener('click', ()=> sendScrapyardAddProposal(btn.getAttribute('data-send-add')));
  });
  root.querySelectorAll('[data-cancel-add]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      delete scrapyardAddDrafts[btn.getAttribute('data-cancel-add')];
      renderScrapyardView();
    });
  });

  root.querySelectorAll('[data-propose-delete]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const partId = btn.getAttribute('data-propose-delete');
      const orderId = btn.getAttribute('data-order-id');
      confirmAction({
        title: 'اقتراح حذف هذه القطعة؟',
        message: 'بيوصل اقتراحك لصاحب الحساب للمراجعة، وما رح يتغيّر شي عندك حالًا.',
        confirmLabel: 'إرسال الاقتراح',
        dangerous: true,
        onConfirm: async ()=>{
          const { error } = await sb.from('scrapyard_proposals').insert({
            order_id: orderId, part_id: partId, action: 'delete', submitted_by: scrapyardSharedState.email, kind: scrapyardSharedState.activeKind
          });
          if(error){ showToast('تعذر إرسال الاقتراح', 'error'); return; }
          showToast('تم إرسال اقتراح الحذف', 'ok');
          await loadScrapyardData(scrapyardSharedState.activeKind);
          renderScrapyardView();
        }
      });
    });
  });
  root.querySelectorAll('[data-add-part-order]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      scrapyardAddDrafts[btn.getAttribute('data-add-part-order')] = { description:'', qty:1, price:null };
      renderScrapyardView();
    });
  });
  root.querySelectorAll('[data-confirm-order]').forEach(btn=>{
    btn.addEventListener('click', ()=> confirmScrapyardOrder(btn.getAttribute('data-confirm-order')));
  });
  root.querySelectorAll('[data-unconfirm-order]').forEach(btn=>{
    btn.addEventListener('click', ()=> unconfirmScrapyardOrder(btn.getAttribute('data-unconfirm-order')));
  });
  root.querySelectorAll('.scrapyard-supplier-select').forEach(sel=>{
    sel.addEventListener('change', async e=>{
      const partId = sel.getAttribute('data-part-id');
      const orderId = sel.getAttribute('data-order-id');
      const supplierId = e.target.value || null;
      const { error } = await sb.rpc('set_part_supplier', { p_order_id: orderId, p_part_id: partId, p_supplier_id: supplierId });
      if(error){ showToast('تعذر حفظ التشليح: ' + error.message, 'error'); return; }
      showToast('تم حفظ التشليح', 'ok');
      await loadScrapyardData(scrapyardSharedState.activeKind);
      renderScrapyardView();
    });
  });
  root.querySelectorAll('[data-withdraw-proposal]').forEach(btn=>{
    btn.addEventListener('click', ()=> withdrawScrapyardProposal(btn.getAttribute('data-withdraw-proposal')));
  });
  root.querySelectorAll('[data-accept-proposal]').forEach(btn=>{
    btn.addEventListener('click', ()=> handleScrapyardProposalDecision(btn.getAttribute('data-accept-proposal'), true));
  });
  root.querySelectorAll('[data-reject-proposal]').forEach(btn=>{
    btn.addEventListener('click', ()=> handleScrapyardProposalDecision(btn.getAttribute('data-reject-proposal'), false));
  });

  // لصاحب الحساب — الضغط على عنوان الطلبية يفتحها مباشرة بنافذة التعديل الكاملة
  root.querySelectorAll('[data-open-order-scrapyard]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const orderId = el.getAttribute('data-open-order-scrapyard');
      closeScrapyardSharedView();
      openModal('edit', orderId);
    });
  });

}

/* إرسال السعر المقترح المكتوب داخل صف القطعة — بدون أي نافذة خارجية */
async function sendScrapyardPriceProposal(orderId, partId){
  const raw = scrapyardPriceDrafts[partId];
  const val = Number(raw);
  if(raw===undefined || raw===null || raw==='' || !val || val<0){ showToast('اكتب السعر المقترح أولاً', 'error'); return; }
  const part = scrapyardSharedState.parts.find(p=>p.part_id===partId);
  if(part && Number(part.cost_price) === val){ showToast('السعر المقترح نفس السعر الحالي', 'error'); return; }
  const { error } = await sb.from('scrapyard_proposals').insert({
    order_id: orderId, part_id: partId, action: 'edit', cost_price: val, submitted_by: scrapyardSharedState.email, kind: scrapyardSharedState.activeKind
  });
  if(error){ showToast('تعذر إرسال الاقتراح', 'error'); return; }
  delete scrapyardPriceDrafts[partId];
  delete scrapyardEditOpenFor[partId];
  showToast('تم إرسال السعر المقترح', 'ok');
  await loadScrapyardData(scrapyardSharedState.activeKind);
  renderScrapyardView();
}

/* إرسال اقتراح قطعة جديدة من صف الإدخال المباشر */
async function sendScrapyardAddProposal(orderId){
  const d = scrapyardAddDrafts[orderId];
  if(!d) return;
  const desc = (d.description||'').trim();
  const qty = Number(d.qty)||1;
  const price = Number(d.price);
  if(!desc){ showToast('أدخل وصف القطعة', 'error'); return; }
  if(!price || price<0){ showToast('أدخل سعر صحيح', 'error'); return; }
  const { error } = await sb.from('scrapyard_proposals').insert({
    order_id: orderId, action: 'add', description: desc, qty, cost_price: price, submitted_by: scrapyardSharedState.email, kind: scrapyardSharedState.activeKind
  });
  if(error){ showToast('تعذر إرسال الاقتراح', 'error'); return; }
  delete scrapyardAddDrafts[orderId];
  showToast('تم إرسال الاقتراح', 'ok');
  await loadScrapyardData(scrapyardSharedState.activeKind);
  renderScrapyardView();
}

/* لما صاحب الحساب يغيّر تصنيف القطعة (مستعمل/جديد) من داخل الطلبية، أي اقتراح معلّق
   عليها بشاشة سداد التشاليح/الجديد بيصير غير منطقي (مبني على التصنيف القديم) — فنلغيه تلقائيًا */
async function cancelPendingScrapyardProposalsForPart(partId){
  if(!sb) return;
  const { data, error } = await sb.from('scrapyard_proposals').select('id').eq('part_id', partId);
  if(error || !data || !data.length) return;
  const { error: delError } = await sb.from('scrapyard_proposals').delete().eq('part_id', partId);
  if(delError){ console.error('cancelPendingScrapyardProposalsForPart:', delError); return; }
  showToast('تم إلغاء الاقتراح المعلّق على هذه القطعة تلقائيًا بعد تغيير تصنيفها', 'ok');
  refreshScrapyardPendingCount();
}

/* ---------- presence ("من متصل الآن") — tied to real interaction, updated live via Supabase Realtime ---------- */
const PRESENCE_HEARTBEAT_MS = 15000;
const PRESENCE_ACTIVE_IDLE_LIMIT_MS = 60000; // must have interacted within the last minute to count as "online"
const PRESENCE_RECHECK_MS = 8000; // how often we re-derive the visible online list from the local cache (no network call)
let presenceTimer = null;
let presenceRecheckTimer = null;
let presenceEmail = null;
let lastActivityAt = Date.now();
let presenceCache = {}; // email -> last_seen (ms epoch), kept in sync via realtime
let presenceChannel = null;

function markActivity(){ lastActivityAt = Date.now(); }

function sendPresenceHeartbeat(){
  if(!sb || !presenceEmail) return;
  if(Date.now() - lastActivityAt > PRESENCE_ACTIVE_IDLE_LIMIT_MS) return; // idle — don't report as online
  sb.from('presence').upsert({ email: presenceEmail, last_seen: new Date(lastActivityAt).toISOString() }).then(()=>{}, ()=>{});
}

function computeOnlineList(){
  const cutoff = Date.now() - PRESENCE_ACTIVE_IDLE_LIMIT_MS;
  return Object.keys(presenceCache)
    .filter(email => presenceCache[email] >= cutoff)
    .sort((a,b)=> presenceCache[b] - presenceCache[a]);
}

function refreshOnlineBadge(){
  const online = computeOnlineList();
  const btn = document.getElementById('btn-who-online');
  if(btn) btn.textContent = '👥 ' + online.length;
  // إذا نافذة "آخر ظهور" مفتوحة، حدّثها بنفس قائمة كل الموظفين (متصل + غير متصل) — بدون ما نرجّعها للشكل القديم
  if(document.getElementById('online-users-list')){
    loadAllPresenceRows().then(rows=>{
      const listEl = document.getElementById('online-users-list');
      if(listEl) listEl.innerHTML = presenceListHtml(rows);
    });
  }
}

async function loadPresenceCache(){
  try{
    const cutoff = new Date(Date.now() - PRESENCE_ACTIVE_IDLE_LIMIT_MS).toISOString();
    const { data, error } = await sb.from('presence').select('email,last_seen').gte('last_seen', cutoff);
    if(error) throw error;
    presenceCache = {};
    (data||[]).forEach(row=>{ presenceCache[row.email] = new Date(row.last_seen).getTime(); });
  }catch(e){ /* best-effort */ }
  refreshOnlineBadge();
}

function subscribePresenceRealtime(){
  if(!sb || presenceChannel) return;
  presenceChannel = sb.channel('presence-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'presence' }, (payload)=>{
      if(payload.eventType === 'DELETE'){
        const oldRow = payload.old;
        if(oldRow && oldRow.email) delete presenceCache[oldRow.email];
      } else if(payload.new && payload.new.email){
        presenceCache[payload.new.email] = new Date(payload.new.last_seen).getTime();
      }
      refreshOnlineBadge();
    })
    .subscribe();
}

function startPresenceHeartbeat(email){
  presenceEmail = email;
  lastActivityAt = Date.now();
  ['mousemove','keydown','mousedown','touchstart','scroll'].forEach(evt=>{
    document.addEventListener(evt, markActivity, { passive:true });
  });
  sendPresenceHeartbeat();
  loadPresenceCache();
  subscribePresenceRealtime();
  if(presenceTimer) clearInterval(presenceTimer);
  presenceTimer = setInterval(sendPresenceHeartbeat, PRESENCE_HEARTBEAT_MS);
  if(presenceRecheckTimer) clearInterval(presenceRecheckTimer);
  presenceRecheckTimer = setInterval(refreshOnlineBadge, PRESENCE_RECHECK_MS);
}

/* وقت نسبي بالعربي لآخر ظهور (قبل دقيقة/ساعة/يوم...) */
function arabicMinutesLabel(n){
  if(n === 1) return 'دقيقة';
  if(n === 2) return 'دقيقتين';
  if(n >= 3 && n <= 10) return n+' دقائق';
  return n+' دقيقة';
}
function arabicHoursLabel(n){
  if(n === 1) return 'ساعة';
  if(n === 2) return 'ساعتين';
  if(n >= 3 && n <= 10) return n+' ساعات';
  return n+' ساعة';
}
function arabicDaysCountLabel(n){
  if(n === 1) return 'يوم';
  if(n === 2) return 'يومين';
  if(n >= 3 && n <= 10) return n+' أيام';
  return n+' يوم';
}

/* وقت نسبي دقيق بالدقائق: قبل 30 دقيقة / قبل ساعة و30 دقيقة / قبل يوم و3 ساعات... */
function arabicRelativeTime(ms){
  const diffSec = Math.floor((Date.now() - ms) / 1000);
  const diffMin = Math.floor(diffSec / 60);
  if(diffMin < 1) return 'الآن';
  if(diffMin < 60) return 'قبل '+arabicMinutesLabel(diffMin);
  const diffHour = Math.floor(diffMin / 60);
  const remMin = diffMin % 60;
  if(diffHour < 24){
    return 'قبل '+arabicHoursLabel(diffHour)+(remMin>0 ? ' و '+arabicMinutesLabel(remMin) : '');
  }
  const diffDay = Math.floor(diffHour / 24);
  const remHour = diffHour % 24;
  if(diffDay <= 30){
    return 'قبل '+arabicDaysCountLabel(diffDay)+(remHour>0 ? ' و '+arabicHoursLabel(remHour) : '');
  }
  const diffMonth = Math.floor(diffDay / 30);
  if(diffMonth === 1) return 'قبل شهر';
  return 'قبل '+diffMonth+' أشهر';
}

/* كل الموظفين (متصلين وغير متصلين) مع وقت آخر ظهور لكل وحد */
async function loadAllPresenceRows(){
  try{
    const { data, error } = await sb.from('presence').select('email,last_seen').order('last_seen', {ascending:false});
    if(error) throw error;
    return data || [];
  }catch(e){ return null; }
}

function presenceListHtml(rows){
  if(rows == null) return 'تعذر تحميل بيانات الظهور';
  if(!rows.length) return 'ما فيه بيانات ظهور حتى الآن';
  return '<div class="task-items-list">' + rows.map(row=>{
    const ms = new Date(row.last_seen).getTime();
    const online = (Date.now() - ms) <= PRESENCE_ACTIVE_IDLE_LIMIT_MS;
    const label = online ? 'متصل الآن' : arabicRelativeTime(ms);
    return '<div class="task-item-row"><span class="task-item-text">'+(online?'🟢':'⚪')+' '+escapeHtml(row.email)+(row.email===presenceEmail?' (أنت)':'')+' — '+label+'</span></div>';
  }).join('') + '</div>';
}

function showWhoIsOnline(){
  const root = document.getElementById('modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" data-close-confirm>' +
      '<div class="modal-card modal-card-sm" role="dialog" aria-modal="true">' +
        '<div class="modal-title">👥 آخر ظهور للموظفين</div>' +
        '<div id="online-users-list" class="expense-empty-hint" style="margin-top:14px;">جاري التحميل…</div>' +
        '<div class="modal-footer-actions" style="margin-top:16px;justify-content:flex-end;">' +
          '<button type="button" class="btn btn-ghost" id="close-online-btn">إغلاق</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  root.classList.add('modal-open');
  const close = ()=>{ root.innerHTML=''; root.classList.remove('modal-open'); };
  root.querySelector('[data-close-confirm]').addEventListener('click', e=>{
    if(e.target.hasAttribute('data-close-confirm')) close();
  });
  root.querySelector('#close-online-btn').addEventListener('click', close);
  loadAllPresenceRows().then(rows=>{
    const listEl = document.getElementById('online-users-list');
    if(listEl) listEl.innerHTML = presenceListHtml(rows);
  });
}

let pendingAuthEmail = '';

function bindAuthGate(){
  const emailInput = document.getElementById('auth-email-input');
  const sendBtn = document.getElementById('auth-send-btn');
  const codeInput = document.getElementById('auth-code-input');
  const verifyBtn = document.getElementById('auth-verify-btn');
  const backBtn = document.getElementById('auth-back-btn');
  const stepEmail = document.getElementById('auth-step-email');
  const stepCode = document.getElementById('auth-step-code');

  const trySend = async ()=>{
    const email = emailInput.value.trim();
    if(!email){ showAuthGate('اكتب بريدك الإلكتروني أولاً', 'error'); return; }
    if(!sb){ showAuthGate('تعذر الاتصال بخدمة تسجيل الدخول', 'error'); return; }
    sendBtn.disabled = true;
    sendBtn.textContent = 'جاري الإرسال…';
    try{
      const { error } = await sb.auth.signInWithOtp({ email });
      if(error) throw error;
      pendingAuthEmail = email;
      stepEmail.style.display = 'none';
      stepCode.style.display = '';
      codeInput.value = '';
      showAuthGate('تم إرسال رمز الدخول إلى ' + email + ' — افتح بريدك وأدخل الرمز تحت.', 'ok');
      codeInput.focus();
    }catch(e){
      showAuthGate('تعذر إرسال رمز الدخول: ' + (e && e.message ? e.message : ''), 'error');
    }finally{
      sendBtn.disabled = false;
      sendBtn.textContent = 'إرسال رمز الدخول';
    }
  };

  const tryVerify = async ()=>{
    const code = codeInput.value.trim();
    if(!code){ showAuthGate('اكتب الرمز أولاً', 'error'); return; }
    if(!sb || !pendingAuthEmail){ showAuthGate('تعذر التحقق — ارجع وأدخل بريدك من جديد', 'error'); return; }
    verifyBtn.disabled = true;
    verifyBtn.textContent = 'جاري التحقق…';
    try{
      const { error } = await sb.auth.verifyOtp({ email: pendingAuthEmail, token: code, type: 'email' });
      if(error) throw error;
    }catch(e){
      showAuthGate('رمز غير صحيح أو منتهي الصلاحية: ' + (e && e.message ? e.message : ''), 'error');
    }finally{
      verifyBtn.disabled = false;
      verifyBtn.textContent = 'تأكيد الرمز';
    }
  };

  sendBtn.addEventListener('click', trySend);
  emailInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); trySend(); } });
  verifyBtn.addEventListener('click', tryVerify);
  codeInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); tryVerify(); } });
  backBtn.addEventListener('click', ()=>{
    pendingAuthEmail = '';
    stepCode.style.display = 'none';
    stepEmail.style.display = '';
    showAuthGate();
  });
}

/* ---------- day/night theme toggle — persisted per browser, applies even on the login screen ---------- */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  try{ localStorage.setItem('partech-theme', theme); }catch(e){}
  const emoji = theme === 'light' ? '🌙' : '🌞';
  const btn = document.getElementById('btn-theme-toggle');
  if(btn) btn.textContent = emoji;
  const scrapBtn = document.getElementById('btn-theme-toggle-scrapyard');
  if(scrapBtn) scrapBtn.textContent = emoji;
}

function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  applyTheme(current === 'light' ? 'dark' : 'light');
}

function handleLogout(){
  confirmAction({
    title: 'تسجيل الخروج؟',
    message: 'رح تحتاج تسجّل دخول من جديد لاستخدام التطبيق.',
    confirmLabel: 'تسجيل خروج',
    dangerous: true,
    onConfirm: async ()=>{
      await sb.auth.signOut();
      window.location.reload();
    }
  });
}

function scrapyardThemeToggleHtml(){
  const emoji = document.documentElement.getAttribute('data-theme') === 'light' ? '🌙' : '🌞';
  return '<button type="button" id="btn-theme-toggle-scrapyard" class="corner-mini-btn" title="تبديل الوضع الليلي/النهاري">'+emoji+'</button>';
}

function bindScrapyardThemeToggle(){
  const btn = document.getElementById('btn-theme-toggle-scrapyard');
  if(btn) btn.addEventListener('click', toggleTheme);
}

function initTheme(){
  let saved = 'dark';
  try{ saved = localStorage.getItem('partech-theme') || 'dark'; }catch(e){}
  applyTheme(saved);
}
initTheme();

/* اللوجو موجود بكل الصفحات — الضغط عليه يرجّع للصفحة الرئيسية (الطلبيات) */
function goHomeFromLogo(){
  const scrapRoot = document.getElementById('scrapyard-root');
  if(scrapRoot && scrapRoot.style.display !== 'none'){
    if(!scrapyardSharedState.canManage){
      // موظف التشاليح (عامر) — يرجّعه لصفحته الرئيسية (قسم المشتريات)
      goToScrapyardHome();
      return;
    }
    closeScrapyardSharedView();
  }
  const treasuryEl = document.getElementById('treasury-view');
  if(treasuryEl) treasuryEl.style.display = 'none';
  const tasksEl = document.getElementById('tasks-view');
  if(tasksEl) tasksEl.style.display = 'none';
  const ordersEl = document.getElementById('orders-view');
  if(ordersEl) ordersEl.style.display = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function getAuthErrorFromUrl(){
  try{
    const raw = (window.location.hash || '').replace(/^#/, '') || (window.location.search || '').replace(/^\?/, '');
    const params = new URLSearchParams(raw);
    const desc = params.get('error_description');
    if(desc) return desc.replace(/\+/g, ' ');
    return params.get('error');
  }catch(e){ return null; }
}

async function bootstrapAuth(){
  bindAuthGate();
  if(!sb){
    showAuthGate('تعذر الاتصال بخدمة تسجيل الدخول — تحقق من إعداد Supabase', 'error');
    return;
  }
  const urlError = getAuthErrorFromUrl();
  const noSessionMsg = urlError ? 'تعذر تسجيل الدخول: الرابط منتهي الصلاحية أو تم استخدامه من قبل. اطلب رابط دخول جديد من هذه الصفحة.' : undefined;
  sb.auth.onAuthStateChange((event, session)=>{
    if(session){ showAppIfAllowed(session); }
    else { showAuthGate(noSessionMsg, noSessionMsg ? 'error' : undefined); }
  });
  const { data: { session } } = await sb.auth.getSession();
  if(session){ showAppIfAllowed(session); } else { showAuthGate(noSessionMsg, noSessionMsg ? 'error' : undefined); }
}
bootstrapAuth();
