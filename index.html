                    renderQuotesList();
                    renderKPIs();
                    renderTable();
                    showToast("تم الحذف", "ok");
                }
            });
        });
    }
}

function cleanedQuoteParts() {
    return quoteDraft.parts.filter(p => p.description && p.description.trim()).map(p => Object.assign({}, p, {
        id: p.id,
        description: p.description.trim(),
        notes: (p.notes || "").trim(),
        purchasingNotes: (p.purchasingNotes || "").trim(),
        qty: p.qty === "" || p.qty == null || Number(p.qty) <= 0 ? 1 : Math.max(1, Number(p.qty)),
        costPrice: p.costPrice === "" ? 0 : Math.max(0, Number(p.costPrice) || 0),
        sellPrice: p.sellPrice === "" || p.sellPrice === null || p.sellPrice === undefined ? null : Math.max(0, Number(p.sellPrice) || 0),
        used: p.used === null ? null : !!p.used,
        included: p.included !== false,
        supplierId: p.supplierId || null
    }));
}

function quotePartIsPriced(p) {
    return Number(p.costPrice) > 0;
}

function quoteMissingSupplierForPricedParts() {
    return quoteDraft.parts.some(p => {
        if (!p.description || !p.description.trim()) return false;
        if (p.used === null || p.supplierId) return false;
        return quotePartIsPriced(p);
    });
}

function quoteMissingConditionForPricedUsedParts() {
    return quoteDraft.parts.some(p => {
        if (!p.description || !p.description.trim()) return false;
        if (p.used !== true || p.condition) return false;
        return quotePartIsPriced(p);
    });
}

async function checkQuoteSaveConflict() {
    if (quoteDraft.isNew) return true;
    const liveOrder = appData.orders.find(o => o.id === quoteDraft.id);
    if (!liveOrder) {
        showToast("هذه التسعيرة ما عادت موجودة — يمكن انعتمدت أو انحذفت من مكان تاني. أغلقنا النافذة، افتح آخر نسخة من القائمة", "error");
        closeQuoteModal();
        return false;
    }
    if (!quoteOpenedAtUpdatedAt || !liveOrder.updatedAt || liveOrder.updatedAt === quoteOpenedAtUpdatedAt) return true;
    if (quoteModalRole === "purchasing") {
        await handleScrapyardQuoteConflict(quoteDraft.id);
        return false;
    }
    document.removeEventListener("keydown", quoteEscListener);
    const proceed = await new Promise(resolve => {
        confirmAction({
            title: "التسعيرة اتغيّرت من مكان تاني",
            message: "صار عليها تحديث (ممكن حفظ من عامر أو من المبيعات) بعد ما فتحت هالنافذة. لو كملت وحفظت، بيضيع هداك التحديث. الأفضل تسكّر وتفتحها من جديد لتشوف آخر نسخة.",
            confirmLabel: "كمّل واحفظ نسختي (بيلغي تعديلهم)",
            cancelLabel: "سكّر بدون حفظ",
            dangerous: true,
            onConfirm: () => resolve(true),
            onCancel: () => resolve(false)
        });
    });
    if (!proceed) {
        closeQuoteModal();
        return false;
    }
    document.addEventListener("keydown", quoteEscListener);
    return true;
}

function quoteModalStillOpen(draftId) {
    return !!quoteDraft && quoteDraft.id === draftId;
}

async function saveQuoteDraft(markSent) {
    if (!await checkQuoteSaveConflict()) return false;
    const dup = appData.orders.find(o => o.orderNumber.trim() === quoteDraft.orderNumber.trim() && o.id !== quoteDraft.id);
    if (dup) {
        showToast("رقم التسعيرة تضارب مع طلبية أخرى، أعد فتح النافذة", "error");
        return false;
    }
    if (!vinApplyForSave(quoteDraft, "quote")) return false;
    if (mediaStagedOnBlankParts(quoteDraft.id, quoteDraft.parts)) return false;
    const cleanedParts = cleanedQuoteParts();
    if (cleanedParts.length === 0) {
        showToast("لازم تضيف وصف لقطعة وحدة على الأقل", "error");
        return false;
    }
    quoteDraft.parts = cleanedParts;
    quoteDraft.orderLabel = (quoteDraft.orderLabel || "").trim();
    quoteDraft.updatedAt = (new Date).toISOString();
    if (markSent) {
        quoteDraft.quoteReady = false;
    }
    const wasPendingReturn = !!quoteDraft.pendingReturnToQuote;
    if (markSent && wasPendingReturn) {
        quoteDraft.isQuote = true;
        quoteDraft.quoteReady = false;
    }
    delete quoteDraft.pendingReturnToQuote;
    const quoteWasNew = !!quoteDraft.isNew;
    const draftId = quoteDraft.id;
    const savingDraft = quoteDraft;
    const mediaSnap = mediaTakeStagedSnapshot(draftId);
    const saved = await persistOrder(quoteDraft, quoteWasNew);
    if (!saved) {
        if (wasPendingReturn) {
            savingDraft.pendingReturnToQuote = true;
            savingDraft.isQuote = false;
        }
        mediaRestoreStagedSnapshot(mediaSnap);
        return false;
    }
    mediaAfterSaveSuccess(draftId, mediaSnap, cleanedParts);
    if (markSent) {
        const orderRef = "#" + savingDraft.orderNumber + (savingDraft.orderLabel ? " — " + savingDraft.orderLabel : "");
        try {
            await sb.from("activity_events").insert({
                kind: "order_needs_pricing",
                order_id: savingDraft.id,
                order_ref: orderRef,
                actor_email: presenceEmail,
                audience_role: "scrapyard",
                message: "طلبية جديدة تحتاج تسعير: " + orderRef
            });
        } catch (e) {
            console.error("logOrderNeedsPricing:", e);
        }
    }
    if (!quoteModalStillOpen(draftId)) return true;
    delete quoteDraft.isNew;
    quoteOpenedAtUpdatedAt = quoteDraft.updatedAt;
    const idx = appData.orders.findIndex(o => o.id === quoteDraft.id);
    if (idx >= 0) appData.orders[idx] = quoteDraft; else appData.orders.push(quoteDraft);
    quoteOriginalSnapshot = quoteContentSnapshot(quoteDraft);
    const root = document.getElementById("modal-root");
    const prevBackdrop = root.querySelector(".modal-backdrop");
    const prevScrollTop = prevBackdrop ? prevBackdrop.scrollTop : 0;
    root.innerHTML = quoteModalHtml(quoteDraft);
    attachQuoteModalHandlers();
    updateQuoteModalTotals();
    const newBackdrop = root.querySelector(".modal-backdrop");
    if (newBackdrop) newBackdrop.scrollTop = prevScrollTop;
    renderQuotesList();
    showToast(markSent ? "تم الحفظ والإرسال" : "تم الحفظ", "ok");
    return true;
}

async function onSaveQuote() {
    return saveQuoteDraft(false);
}

}

function scrapyardQuotePricingRpcParams(order, quoteReady, expectedUpdatedAt) {
    return {
        p_order_id: order.id,
        p_parts: (order.parts || []).map(p => ({
            id: p.id,
            description: p.description || "",
            qty: Math.max(1, Number(p.qty) || 1),
            costPrice: Math.max(0, Number(p.costPrice) || 0),
            supplierId: p.supplierId || null,
            purchasingNotes: p.purchasingNotes || "",
            used: p.used === null ? null : !!p.used,
            condition: p.condition || null
        })),
        p_quote_ready: !!quoteReady,
        p_order_label: order.orderLabel || "",
        p_expected_updated_at: expectedUpdatedAt
    };
}

function isQuoteSaveConflictError(e) {
    return !!e && (e.code === "PT409" || e.hint === "quote_conflict");
}

async function persistScrapyardQuotePricing(order, quoteReady, expectedUpdatedAt) {
    if (!expectedUpdatedAt) return {
        status: "conflict"
    };
    try {
        if (!sb) throw new Error("NO_DB");
        const {data: data, error: error} = await sb.rpc("scrapyard_save_quote_pricing", scrapyardQuotePricingRpcParams(order, quoteReady, expectedUpdatedAt));
        if (error) {
            if (isQuoteSaveConflictError(error)) return {
                status: "conflict"
            };
            throw error;
        }
        if (!data) {
            showToast("تعذر الحفظ — التسعيرة ما عادت موجودة، أغلق النافذة وافتحها من جديد", "error");
            return {
                status: "error"
            };
        }
        const ts = new Date(data);
        return {
            status: "ok",
            updatedAt: isNaN(ts) ? String(data) : ts.toISOString()
        };
    } catch (e) {
        showToast("تعذر حفظ التسعيرة: " + friendlyErrorText(e), "error");
        return {
            status: "error"
        };
    }
}

async function handleScrapyardQuoteConflict(draftId) {
    let freshRows;
    try {
        const {data: data, error: error} = await withTimeout(sb.rpc("get_scrapyard_home_quotes"), GUARDED_AWAIT_TIMEOUT_MS, "get_scrapyard_home_quotes");
        if (error) throw error;
        freshRows = data || [];
    } catch (e) {
        console.error("handleScrapyardQuoteConflict:", e);
        showToast("التسعيرة انعدّلت من مكان تاني وما قدرنا نحمّل آخر نسخة — تحقق من الاتصال وحاول مرة تانية", "error");
        return "failed";
    }
    appData.orders = [ ...freshRows.map(orderRowToObject), ...appData.orders.filter(o => !o.isQuote) ];
    renderQuotesList();
    if (!quoteModalStillOpen(draftId)) return "closed";
    const pendingReturn = modalCloseCallback;
    modalCloseCallback = null;
    const mediaSnap = mediaTakeStagedSnapshot(draftId);
    closeQuoteModal();
    modalCloseCallback = pendingReturn;
    if (!appData.orders.some(o => o.id === draftId && o.isQuote)) {
        showToast("هذه التسعيرة ما عادت متاحة للتسعير — يمكن المبيعات اعتمدتها أو حذفتها", "error");
        mediaRestoreStagedSnapshot(mediaSnap);
        if (modalCloseCallback) {
            const cb = modalCloseCallback;
            modalCloseCallback = null;
            cb();
        }
        return "closed";
    }
    openQuoteModal("edit", draftId, "purchasing");
    mediaAfterQuoteConflict(draftId, mediaSnap, true);
    confirmAction({
        title: "التسعيرة انعدّلت وأنت فاتحها",
        message: "حدا عدّل هالتسعيرة (غالبًا المبيعات ضافت أو عدّلت قطعة) بعد ما فتحتها، فما حفظنا تسعيرك حتى ما ينمسح تعديلهم. فتحنالك آخر نسخة — راجع القطع وأعد إدخال تسعيرك واحفظ من جديد.",
        confirmLabel: "تمام",
        onlyConfirm: true
    });
    return "reopened";
}

async function onSaveQuotePricing() {
    if (!await checkQuoteSaveConflict()) return;
    if (mediaStagedOnBlankParts(quoteDraft.id, quoteDraft.parts)) return;
    const cleanedParts = cleanedQuoteParts();
    if (cleanedParts.length === 0) {
        showToast("لازم تضيف وصف لقطعة وحدة على الأقل", "error");
        return;
    }
    if (quoteMissingSupplierForPricedParts()) {
        showToast("لازم تحدد المورد للقطع اللي أضفت سعر شرائها قبل الحفظ", "error");
        return;
    }
    if (quoteMissingConditionForPricedUsedParts()) {
        showToast("لازم تحدد حالة كل قطعة مستعملة (نظيف تماما / نظيف مع ملاحظات / غير نظيف) قبل الحفظ", "error");
        return;
    }
    quoteDraft.parts = cleanedParts;
    quoteDraft.orderLabel = (quoteDraft.orderLabel || "").trim();
    const draftId = quoteDraft.id;
    const savedDraft = quoteDraft;
    const mediaSnap = mediaTakeStagedSnapshot(draftId);
    const res = await persistScrapyardQuotePricing(quoteDraft, !!quoteDraft.quoteReady, quoteOpenedAtUpdatedAt);
    if (res.status === "conflict") {
        const how = await handleScrapyardQuoteConflict(draftId);
        mediaAfterQuoteConflict(draftId, mediaSnap, how === "reopened");
        return;
    }
    if (res.status !== "ok") {
        mediaRestoreStagedSnapshot(mediaSnap);
        return;
    }
    mediaAfterSaveSuccess(draftId, mediaSnap, cleanedParts);
    savedDraft.updatedAt = res.updatedAt;
    const idx = appData.orders.findIndex(o => o.id === draftId);
    if (idx >= 0) appData.orders[idx] = savedDraft;
    if (!quoteModalStillOpen(draftId)) return;
    quoteOpenedAtUpdatedAt = res.updatedAt;
    const root = document.getElementById("modal-root");
    const prevBackdrop = root.querySelector(".modal-backdrop");
    const prevScrollTop = prevBackdrop ? prevBackdrop.scrollTop : 0;
    root.innerHTML = quoteModalHtml(quoteDraft);
    attachQuoteModalHandlers();
    updateQuoteModalTotals();
    const newBackdrop = root.querySelector(".modal-backdrop");
    if (newBackdrop) newBackdrop.scrollTop = prevScrollTop;
    renderQuotesList();
    showToast("تم الحفظ", "ok");
}

async function onSaveAndSendQuotePricing() {
    if (!await checkQuoteSaveConflict()) return;
    if (mediaStagedOnBlankParts(quoteDraft.id, quoteDraft.parts)) return;
    const cleanedParts = cleanedQuoteParts();
    if (cleanedParts.length === 0) {
        showToast("لازم تضيف وصف لقطعة وحدة على الأقل", "error");
        return;
    }
    if (quoteMissingSupplierForPricedParts()) {
        showToast("لازم تحدد المورد للقطع اللي أضفت سعر شرائها قبل الحفظ", "error");
        return;
    }
    if (quoteMissingConditionForPricedUsedParts()) {
        showToast("لازم تحدد حالة كل قطعة مستعملة (نظيف تماما / نظيف مع ملاحظات / غير نظيف) قبل الحفظ", "error");
        return;
    }
    quoteDraft.parts = cleanedParts;
    quoteDraft.orderLabel = (quoteDraft.orderLabel || "").trim();
    quoteDraft.quoteReady = true;
    const draftId = quoteDraft.id;
    const sentDraft = quoteDraft;
    const mediaSnap = mediaTakeStagedSnapshot(draftId);
    const res = await persistScrapyardQuotePricing(quoteDraft, true, quoteOpenedAtUpdatedAt);
    if (res.status !== "ok") {
        sentDraft.quoteReady = false;
        if (res.status === "conflict") {
            const how = await handleScrapyardQuoteConflict(draftId);
            mediaAfterQuoteConflict(draftId, mediaSnap, how === "reopened");
        } else mediaRestoreStagedSnapshot(mediaSnap);
        return;
    }
    mediaAfterSaveSuccess(draftId, mediaSnap, cleanedParts);
    sentDraft.updatedAt = res.updatedAt;
    if (quoteModalStillOpen(draftId)) quoteOpenedAtUpdatedAt = res.updatedAt;
    const idx = appData.orders.findIndex(o => o.id === draftId);
    if (idx >= 0) appData.orders[idx] = sentDraft;
    renderQuotesList();
    showToast("تم الحفظ والإرسال", "ok");
    if (!quoteModalStillOpen(draftId)) return;
    closeQuoteModal();
}

function normalizePhoneForWhatsapp(phone) {
    let p = (phone || "").replace(/[^\d+]/g, "");
    if (p.startsWith("+")) p = p.slice(1);
    if (p.startsWith("0")) p = "966" + p.slice(1); else if (!p.startsWith("966")) p = "966" + p;
    return p;
}

function findDuplicateCustomer(name, phone) {
    const n = (name || "").trim().toLowerCase();
    const p = (phone || "").trim() ? normalizePhoneForWhatsapp(phone) : "";
    return (appData.customers || []).find(c => {
        const cPhone = (c.phone || "").trim() ? normalizePhoneForWhatsapp(c.phone) : "";
        if (p && cPhone) return p === cPhone;
        return !!(n && (c.name || "").trim().toLowerCase() === n);
    });
}

function findDuplicateSupplier(name, phone, list) {
    const n = (name || "").trim().toLowerCase();
    const p = (phone || "").trim() ? normalizePhoneForWhatsapp(phone) : "";
    return (list || appData.suppliers || []).find(s => {
        const sPhone = (s.phone || "").trim() ? normalizePhoneForWhatsapp(s.phone) : "";
        if (p && sPhone) return p === sPhone;
        return !!(n && (s.name || "").trim().toLowerCase() === n);
    });
}

async function orderMediaCountSafe(orderId) {
    try {
        if (!sb || !orderId) return 0;
        const {data: data, error: error} = await withTimeout(sb.rpc("order_media_count", {
            p_order_id: orderId
        }), 5e3, "order_media_count");
        if (error) throw error;
        const n = Math.floor(Number(data));
        return n > 0 ? n : 0;
    } catch (e) {
        console.warn("order_media_count:", e);
        return 0;
    }
}

const pendingConfirmToggleIds = new Set;

function confirmToggleConfirmation(orderId) {
    if (pendingConfirmToggleIds.has(orderId)) return;
    const order = appData.orders.find(o => o.id === orderId);
    if (!order) return;
    const willConfirm = !order.confirmed;
    const willResetSupply = !willConfirm && order.supplied;
    confirmAction({
        title: willConfirm ? "تأكيد الطلبية " + order.orderNumber + "؟" : "إلغاء تأكيد الطلبية " + order.orderNumber + "؟",
        message: willConfirm ? "بعد التأكيد، أرقام هذه الطلبية بتدخل ضمن مجموع الطلبيات المؤكدة بمؤشرات الأعلى." : "بعد الإلغاء، أرقام هذه الطلبية بتُستثنى من مجموع الطلبيات المؤكدة بمؤشرات الأعلى." + (willResetSupply ? ' وبيتلغى معها تحديد "تم التوريد"، فبتختفي من شاشة السداد.' : ""),
        cancelLabel: "تراجع",
        confirmLabel: willConfirm ? "تأكيد الطلبية" : "إلغاء التأكيد",
        onConfirm: async () => {
            pendingConfirmToggleIds.add(orderId);
            try {
                const order = appData.orders.find(o => o.id === orderId);
                if (!order) return;
                const prev = {
                    confirmed: order.confirmed,
                    supplied: order.supplied,
                    suppliedAt: order.suppliedAt,
                    updatedAt: order.updatedAt,
                    unsuccessfulReason: order.unsuccessfulReason,
                    unsuccessfulReasonDetails: order.unsuccessfulReasonDetails
                };
                order.confirmed = willConfirm;
                if (willResetSupply) {
                    order.supplied = false;
                    order.suppliedAt = null;
                }
                if (willConfirm && order.unsuccessfulReason) {
                    order.unsuccessfulReason = null;
                    order.unsuccessfulReasonDetails = "";
                }
                order.updatedAt = (new Date).toISOString();
                const saved = await persistOrder(order);
                if (!saved) {
                    Object.assign(order, prev);
                    renderTable();
                    return;
                }
                if (willResetSupply) {
                    await cancelPendingSuppliedGatedProposalsForOrder(orderId);
                    await cancelPendingScrapyardProposalsForOrder(orderId);
                }
                renderKPIs();
                renderTable();
                refreshArchiveViewIfOpen();
                showToast(willConfirm ? "تم تأكيد الطلبية" : "تم إلغاء تأكيد الطلبية", "ok");
            } finally {
                pendingConfirmToggleIds.delete(orderId);
            }
        }
    });
}

function todayNumeric() {
    const d = new Date;
    const day = String(d.getDate()).padStart(2, "0");
    const month = String(d.getMonth() + 1).padStart(2, "0");
    return day + "/" + month + "/" + d.getFullYear();
}

function fmtDateShort(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    const day = String(d.getDate()).padStart(2, "0");
    const month = String(d.getMonth() + 1).padStart(2, "0");
    return day + "/" + month + "/" + d.getFullYear();
}

function fmtNum(n) {
    const v = Number(n) || 0;
    return Math.round(v).toLocaleString("en-US");
}

function round2(n) {
    return Math.round((Number(n) || 0) * 100) / 100;
}

function computeVatAmount(subtotalInclVat) {

<div class="doc-meta-field field-cr doc-cr-line"><span>ر.ض العميل</span><input type="text" id="doc-cr-input" value="' + escapeHtml(data.customerCR) + '"></div>' + '<div class="doc-billto-extra">' + '<div class="doc-meta-field field-car"><span>السيارة</span><input type="text" id="doc-car-input" value="' + escapeHtml(data.carModel) + '" placeholder="موديل السيارة"></div>' + '<div class="doc-meta-field field-vin"><span>رقم الهيكل VIN</span><input type="text" id="doc-vin-input" value="' + escapeHtml(data.vin) + '" placeholder="رقم الهيكل"></div>' + "</div>" + (docVinMismatch(order, data) ? '<div class="doc-vat-toggle no-print" style="cursor:default;flex-wrap:wrap;color:#9C6A00;font-weight:700;">' + '<span>رقم الهيكل بالطلبية: <span dir="ltr" style="overflow-wrap:anywhere;">' + escapeHtml(order.vin) + "</span> —</span>" + '<button type="button" class="icon-btn" id="doc-vin-replace-btn" style="color:#171717;border-color:#BDBDBD;">استبدال؟</button>' + "</div>" : "") + "</div>" + '<table class="doc-table"><thead><tr><th>البيـان</th><th>العدد</th><th>السعر الإفرادي</th><th>السعر الإجمالي</th></tr></thead>' + "<tbody>" + (Array.isArray(data.partsSnapshot) ? partsTableRowsHtmlFromSnapshot(data.partsSnapshot) : partsTableRowsHtml(order)) + "</tbody></table>" + '<label class="doc-vat-toggle no-print"><input type="checkbox" id="doc-vat-toggle-input" ' + (showVat ? "checked" : "") + "><span>إظهار تفاصيل الضريبة المضافة</span></label>" + '<div class="doc-totals">' + (showVat ? '<div class="doc-totals-row"><span>قيمة الضريبة المضافة (15%)</span><span class="num">' + fmtNum(vatAmount) + " ريال</span></div>" : "") + (showVat ? '<div class="doc-totals-row"><span>مجموع سعر القطع شامل الضريبة</span><span class="num">' + fmtNum(subtotal) + " ريال</span></div>" : "") + (feeEnabled ? '<div class="doc-totals-row doc-totals-row-fee"><span>' + feeLabel + " (" + feePercent + '%)</span><span class="num">' + fmtNum(fee) + " ريال</span></div>" : "") + (t.serviceFeeEnabled && t.serviceFeeAmount > 0 ? '<div class="doc-totals-row doc-totals-row-fee"><span>رسوم خدمات (' + t.serviceFeePercent + '%)</span><span class="num">' + fmtNum(t.serviceFeeAmount) + " ريال</span></div>" : "") + (t.deliveryFeeEnabled && t.deliveryFeeAmount > 0 ? '<div class="doc-totals-row doc-totals-row-fee"><span>أجور التوصيل</span><span class="num">' + fmtNum(t.deliveryFeeAmount) + " ريال</span></div>" : "") + '<div class="doc-totals-row grand"><span>الإجمالي المستحق</span><span class="num" id="doc-grand-total">' + fmtNum(grand) + " ريال</span></div>" + "</div>" + '<div id="doc-footer-input" class="doc-footer-note-input" contenteditable="true">' + footerNoteLinesHtml(data.footerNote) + "</div>" + "</div>" + "</div>";

function docVinMismatch(order, data) {
    const a = normalizeVin(order && order.vin), b = normalizeVin(data && data.vin);

function openDocumentView(orderId, type) {
    const order = appData.orders.find(o => o.id === orderId);
    if (!order) return;
    const t = orderTotals(order);
    if (order.parts.length === 0 || !t.fullyPriced) {
        showToast("لازم تسعّر كل القطع قبل إصدار " + (type === "invoice" ? "الفاتورة" : "عرض السعر"), "error");
        return;
    }
    const field = type === "invoice" ? "invoiceDoc" : "quoteDoc";
    const existing = order[field];
    const data = Object.assign({
        number: order.orderNumber,
        date: todayNumeric(),
        customerName: "",
        carModel: "",
        vin: "",
        customerCR: "",
        footerNote: defaultFooterNoteFor(type),
        showVat: false
    }, existing || {});
    if (!String(data.vin || "").trim() && order.vin) data.vin = order.vin;
    docState = {
        orderId: orderId,
        type: type,
        data: data
    };
    const root = document.getElementById("doc-root");
    root.innerHTML = docSheetHtml(order, type, data);
    root.classList.add("doc-open");
    bindDocHandlers();
    document.addEventListener("keydown", docEscListener);
    window.addEventListener("beforeprint", markEmptyDocFields);
}

function refreshDocSheet() {
    if (!docState) return;

function openDocHistory() {

        const ms = new Date(entry._savedAt).getTime();

    }).join("") + "</div>" : '<p class="add-part-locked-hint">ما فيه نسخ سابقة محفوظة بالسجل بعد — تنضاف تلقائيًا أول ما تحمّل PDF أو تطبع أو تشارك</p>') + "</div>" + '<div class="modal-footer-actions" style="margin-top:16px;justify-content:flex-end;">' + '<button type="button" class="btn btn-ghost" id="doc-history-close-btn">إغلاق</button>' + "</div>" + "</div>" + "</div>";
    root.classList.add("modal-open");

        root.innerHTML = "";
        root.classList.remove("modal-open");
    };

    });

function docEscListener(e) {

let printModeTimer = null;

let printModeStartedAt = 0;

function beginPrintMode() {
    printModeStartedAt = Date.now();
    document.body.classList.add("printing");
    if (printModeTimer) clearTimeout(printModeTimer);
    printModeTimer = setTimeout(endPrintMode, 2e4);
}

function endPrintMode() {
    if (printModeTimer) {
        clearTimeout(printModeTimer);
        printModeTimer = null;
    }
    printModeStartedAt = 0;
    document.body.classList.remove("printing");
}

function endPrintModeOnReturn() {
    if (!printModeStartedAt) return;
    if (Date.now() - printModeStartedAt < 1200) return;
    endPrintMode();
}

window.addEventListener("beforeprint", () => {
    const docRoot = document.getElementById("doc-root");
    if (docRoot && docRoot.classList.contains("doc-open")) beginPrintMode();
});

window.addEventListener("afterprint", endPrintMode);

const printMediaQuery = window.matchMedia ? window.matchMedia("print") : null;

if (printMediaQuery) {
    const onPrintMqChange = e => {
        if (!e.matches) endPrintMode();
    };
    if (printMediaQuery.addEventListener) printMediaQuery.addEventListener("change", onPrintMqChange); else if (printMediaQuery.addListener) printMediaQuery.addListener(onPrintMqChange);
}

document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") endPrintModeOnReturn();
});

window.addEventListener("focus", endPrintModeOnReturn);

window.addEventListener("pointerdown", endPrintModeOnReturn);

window.addEventListener("keydown", endPrintModeOnReturn);

window.addEventListener("pageshow", endPrintMode);

function markEmptyDocFields() {
    const root = document.getElementById("doc-root");
    if (!root) return;

async function persistDocMeta(showToastMsg, appendHistory) {
    if (!docState) return false;
    const order = appData.orders.find(o => o.id === docState.orderId);
    if (!order) return false;
    const field = docState.type === "invoice" ? "invoiceDoc" : "quoteDoc";
    const historyField = docState.type === "invoice" ? "invoiceDocHistory" : "quoteDocHistory";
    const prevFieldValue = order[field];
    const prevHistoryValue = Array.isArray(order[historyField]) ? order[historyField].slice() : order[historyField];
    const prevUpdatedAt = order.updatedAt;
    order[field] = Object.assign({}, docState.data);
    if (appendHistory) {
        if (!Array.isArray(order[historyField])) order[historyField] = [];
        const snapshot = Object.assign({}, docState.data);
        if (Array.isArray(docState.data.partsSnapshot) && docState.data.totalsSnapshot) {
            snapshot.partsSnapshot = docState.data.partsSnapshot;
            snapshot.totalsSnapshot = docState.data.totalsSnapshot;
        } else {
            const st = orderTotals(order);
            snapshot.partsSnapshot = orderActiveParts(order).filter(p => !p.returned).map(p => ({
                name: partDisplayName(p),
                qty: Number(p.qty) || 1,
                sellPrice: Number(p.sellPrice) || 0
            }));
            snapshot.totalsSnapshot = {
                partsSellTotal: st.partsSellTotal,
                feePercent: st.feePercent,
                feeEnabled: st.feeEnabled,
                feeAmount: st.feeAmount,
                serviceFeeEnabled: st.serviceFeeEnabled,
                serviceFeeAmount: st.serviceFeeAmount,
                serviceFeePercent: st.serviceFeePercent,
                deliveryFeeEnabled: st.deliveryFeeEnabled,
                deliveryFeeAmount: st.deliveryFeeAmount,
                sellTotal: st.sellTotal
            };
        }
        const last = order[historyField][order[historyField].length - 1];
        const lastData = last ? Object.assign({}, last, {
            _historyId: undefined,
            _savedAt: undefined
        }) : null;
        if (!last || JSON.stringify(lastData) !== JSON.stringify(snapshot)) {
            order[historyField].push(Object.assign({
                _historyId: uid("doc"),
                _savedAt: (new Date).toISOString()
            }, snapshot));
        }
    }
    order.updatedAt = (new Date).toISOString();
    const saved = await persistOrder(order);
    if (!saved) {
        order[field] = prevFieldValue;
        order[historyField] = prevHistoryValue;
        order.updatedAt = prevUpdatedAt;
        return false;
    }
    renderTable();
    if (showToastMsg) showToast("تم حفظ بيانات " + (docState.type === "invoice" ? "الفاتورة" : "عرض السعر"), "ok");
    return true;
}

function buildDocWhatsAppText(order, type, data) {
    const isInvoice = type === "invoice";
    const t = data.totalsSnapshot || orderTotals(order);
    const feePercent = t.feePercent;
    const feeEnabled = t.feeEnabled;
    const fee = t.feeAmount;
    const grand = t.sellTotal;
    const parts = Array.isArray(data.partsSnapshot) ? data.partsSnapshot : orderActiveParts(order).filter(p => !p.returned).map(p => ({
        name: partDisplayName(p),
        qty: p.qty,
        sellPrice: p.sellPrice
    }));
    const lines = [];
    lines.push("*PARTECH*");
    lines.push((isInvoice ? "فاتورة نقدية" : "عرض أسعار") + " رقم " + data.number);
    lines.push("التاريخ: " + data.date);
    if (data.customerName) lines.push("العميل: " + data.customerName);
    if (data.customerCR) lines.push("ر.ض: " + data.customerCR);
    if (data.carModel) lines.push("السيارة: " + data.carModel);
    if (data.vin) lines.push("VIN: " + data.vin);
    lines.push("");
    lines.push("القطع:");
    parts.forEach((p, i) => {
        const qty = Number(p.qty) || 1;
        const unit = Number(p.sellPrice) || 0;
        lines.push(i + 1 + ". " + (p.name != null ? p.name : partDisplayName(p)) + " × " + qty + " — " + fmtNum(qty * unit) + " ريال");
    });
    lines.push("");
    if (data.showVat !== false) {
        const vatAmt = computeVatAmount(t.partsSellTotal);
        lines.push("قيمة الضريبة المضافة (15%): " + fmtNum(vatAmt) + " ريال");
        lines.push("مجموع سعر القطع شامل الضريبة: " + fmtNum(t.partsSellTotal) + " ريال");
    } else {
        lines.push("مجموع القطع: " + fmtNum(t.partsSellTotal) + " ريال");
    }
    if (feeEnabled) {
        lines.push((isInvoice ? "رسوم خدمات وتوصيل" : "رسوم خدمات شامل التوصيل") + " (" + feePercent + "%): " + fmtNum(fee) + " ريال");
    }
    if (t.serviceFeeEnabled && t.serviceFeeAmount > 0) {
        lines.push("رسوم خدمات (" + t.serviceFeePercent + "%): " + fmtNum(t.serviceFeeAmount) + " ريال");
    }
    if (t.deliveryFeeEnabled && t.deliveryFeeAmount > 0) {
        lines.push("أجور التوصيل: " + fmtNum(t.deliveryFeeAmount) + " ريال");
    }
    lines.push("الإجمالي: " + fmtNum(grand) + " ريال");
    lines.push("");
    const footerNote = data.footerNote === undefined || data.footerNote === null ? defaultFooterNoteFor(type) : String(data.footerNote).trim();
    if (footerNote) lines.push(footerNote);
    return lines.join("\n");
}

async function writeTextToClipboard(text) {
    try {
        await navigator.clipboard.writeText(text);
        return true;
    } catch (e) {
        try {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            return true;
        } catch (e2) {
            return false;
        }
    }
}

async function copyDocToClipboard() {
    const order = appData.orders.find(o => o.id === docState.orderId);
    if (!order) return;
    const text = buildDocWhatsAppText(order, docState.type, docState.data);
    const ok = await writeTextToClipboard(text);
    showToast(ok ? "تم نسخ النص، الصقه بالواتساب" : "تعذر النسخ التلقائي، انسخ النص يدويًا", ok ? "ok" : "error");
    const saved = await persistDocMeta(false, true);
    if (!saved) showToast('تم النسخ، لكن تعذر حفظ نسخة المستند بالسجل — حاول "حفظ" يدويًا', "error");
}

function docPdfFilename() {
    const num = docState && docState.data && docState.data.number ? docState.data.number : "PARTECH";
    return "PARTECH-" + num + ".pdf";
}

async function buildDocPdfBlob() {
    try {
        await ensureHtml2pdf();
    } catch (e) {
        throw new Error("LIB_MISSING");
    }
    if (typeof html2pdf === "undefined") {
        throw new Error("LIB_MISSING");
    }
    const sheet = document.getElementById("doc-sheet");
    if (!sheet) throw new Error("NO_SHEET");
    sheet.classList.add("pdf-export-mode");
    sheet.querySelectorAll("input").forEach(inp => {
        inp.setAttribute("value", inp.value);
    });
    try {
        if (document.fonts && document.fonts.ready) {
            try {
                await document.fonts.ready;
            } catch (e) {}
        }
        const opt = {
            margin: 8,
            filename: docPdfFilename(),
            image: {
                type: "jpeg",
                quality: .98
            },
            html2canvas: {
                scale: 2,
                useCORS: true,
                backgroundColor: "#ffffff",
                windowWidth: 900
            },
            jsPDF: {
                unit: "mm",
                format: "a4",
                orientation: "portrait"
            }
        };
        return await html2pdf().set(opt).from(sheet).outputPdf("blob");
    } finally {
        sheet.classList.remove("pdf-export-mode");
    }
}

async function downloadDocPdf() {
    if (!docState) return;
    const openedDocState = docState;
    const btn = document.getElementById("doc-pdf-btn");
    const closeBtn = document.getElementById("doc-close-btn");
    const setBusy = b => {
        if (btn) {
            btn.disabled = b;
            btn.textContent = b ? "جاري التجهيز…" : "📄 تحميل PDF";
        }
        if (closeBtn) closeBtn.disabled = b;
        if (b) document.removeEventListener("keydown", docEscListener); else if (docState === openedDocState) document.addEventListener("keydown", docEscListener);
    };
    setBusy(true);
    try {
        const saved = await persistDocMeta(false, true);
        if (!saved) {
            showToast("تعذر حفظ نسخة المستند — التحميل أُلغي، حاول مرة تانية", "error");
            return;
        }
        if (docState !== openedDocState) return;
        markEmptyDocFields();
        const blob = await buildDocPdfBlob();
        if (docState !== openedDocState) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = docPdfFilename();
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 4e3);

async function shareDoc() {
    if (!docState) return;
    const openedDocState = docState;
    const order = appData.orders.find(o => o.id === docState.orderId);
    if (!order) return;
    const btn = document.getElementById("doc-share-btn");
    const closeBtn = document.getElementById("doc-close-btn");
    const setBusy = b => {
        if (btn) {
            btn.disabled = b;
            btn.textContent = b ? "جاري التجهيز…" : "📤 مشاركة";
        }
        if (closeBtn) closeBtn.disabled = b;
        if (b) document.removeEventListener("keydown", docEscListener); else if (docState === openedDocState) document.addEventListener("keydown", docEscListener);
    };
    setBusy(true);
    try {
        markEmptyDocFields();
        let fileShareSupported = false;
        if (navigator.share && navigator.canShare) {
            try {
                const dummy = new File([ "%PDF" ], "test.pdf", {
                    type: "application/pdf"
                });
                fileShareSupported = navigator.canShare({
                    files: [ dummy ]
                });
            } catch (e) {
                fileShareSupported = false;
            }
        }
        const [saved, blob] = await Promise.all([ persistDocMeta(false, true), fileShareSupported ? buildDocPdfBlob().catch(() => null) : Promise.resolve(null) ]);
        if (docState !== openedDocState) return;
        if (!saved) {
            showToast("تعذر حفظ نسخة المستند — المشاركة أُلغيت، حاول مرة تانية", "error");
            return;
        }
        if (fileShareSupported && !blob) fileShareSupported = false;
        const liveOrder = appData.orders.find(o => o.id === docState.orderId) || order;
        const isInvoice = docState.type === "invoice";
        const shareTitle = "PARTECH — " + (isInvoice ? "فاتورة نقدية" : "عرض أسعار") + " " + docState.data.number;
        const fullText = buildDocWhatsAppText(liveOrder, docState.type, docState.data);
        if (fileShareSupported) {
            try {
                const file = new File([ blob ], docPdfFilename(), {
                    type: "application/pdf"
                });
                await navigator.share({
                    files: [ file ],
                    title: shareTitle,
                    text: shareTitle
                });
                return;
            } catch (errFile) {
                if (errFile && errFile.name === "AbortError") return;
            }
        }
        if (navigator.share) {
            try {
                await navigator.share({
                    title: shareTitle,
                    text: fullText
                });
                return;
            } catch (errText) {
                if (errText && errText.name === "AbortError") return;
            }

    } catch (e) {
        showToast("حدث خطأ أثناء محاولة المشاركة", "error");
    } finally {
        setBusy(false);
    }
}

function statementPdfFilename(customer) {
    const phoneDigits = customer && customer.phone ? String(customer.phone).replace(/[^0-9]/g, "") : "";
    const safeId = phoneDigits || (customer ? customer.id : "customer");
    return "PARTECH-Statement-" + safeId + ".pdf";
}

function statementOrderRowsHtml(rows) {
    return rows.map(r => {
        const statusHtml = r.hasChargeable === false ? '<span class="num text-amber">بانتظار تسعير</span>' : r.remaining >= CUSTOMER_REMAINING_TOLERANCE ? '<span class="num text-rust">' + fmtNum(r.remaining) + "</span>" : '<span class="num text-green">مسدد</span>';

    }).join("");
}

function computeStatementTotals(ongoing, refunds, opts) {
    opts = opts || {};
    const showRefunds = opts.showRefunds !== false;
    const totalRemaining = round2(ongoing.reduce((s, r) => s + (r.hasChargeable !== false ? Math.max(0, r.remaining) : 0), 0));
    const totalRefunds = showRefunds ? round2((refunds || []).reduce((s, r) => s + r.amount, 0)) : 0;
    const net = round2(totalRemaining - totalRefunds);
    return {
        totalRemaining: totalRemaining,
        totalRefunds: totalRefunds,
        net: net
    };
}

d="statement-show-paid-input" ' + (showPaid ? "checked" : "") + "><span>إظهار المسدد</span></label>" + '<label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="statement-show-refunds-input" ' + (showRefunds ? "checked" : "") + "><span>إظهار المرتجع</span></label>" + "</div>" + '<div class="doc-totals" style="margin-bottom:18px;">' + '<div class="doc-totals-row"><span>مستحق</span><span class="num">' + fmtNum(totalRemaining) + " ريال</span></div>" + (showRefunds && totalRefunds > 0 ? '<div class="doc-totals-row"><span>مرتجعات</span><span class="num">' + fmtNum(totalRefunds) + " ريال</span></div>" : "") + '<div class="doc-totals-row grand"><span' + (net < -.01 ? ' class="text-green"' : "") + ">" + (net < -.01 ? "رصيد لصالحكم" : "المطلوب منكم") + '</span><span class="num' + (net < -.01 ? " text-green" : "") + '">' + fmtNum(Math.abs(net)) + " ريال</span></div>" + "</div>" + (ongoing.length ? '<div class="doc-section-title" style="font-weight:700;margin:10px 0;">طلبيات جارية</div>' + '<table class="doc-table"><thead><tr><th>الطلبية</th><th>التاريخ</th><th>الإجمالي</th><th>الحالة</th></tr></thead>' + "<tbody>" + statementOrderRowsHtml(ongoing) + "</tbody></table>" : "") + (showPaid && past.length ? '<div class="doc-section-title" style="font-weight:700;margin:16px 0 10px;">طلبيات مسددة</div>' + '<table class="doc-table"><thead><tr><th>الطلبية</th><th>التاريخ</th><th>الإجمالي</th><th>الحالة</th></tr></thead>' + "<tbody>" + statementOrderRowsHtml(past) + "</tbody></table>" : "") + (showRefunds && refunds.length ? '<div class="doc-section-title" style="font-weight:700;margin:16px 0 10px;">مرتجعات مستحقة</div>' + '<table class="doc-table"><thead><tr><th>الطلبية</th><th>القطعة</th><th>المبلغ</th></tr></thead><tbody>' + refunds.map(r => '<tr data-open-order="' + escapeHtml(r.orderId) + '" style="cursor:pointer;"><td>' + escapeHtml(r.orderNumber || "") + (r.orderLabel ? " — " + escapeHtml(r.orderLabel) : "") + "</td><td>" + escapeHtml(r.description || " function buildStatementWhatsAppText(customer, ongoing, past, refunds, opts) {
    opts = opts || {};
    const showPaid = opts.showPaid !== false;
    const showRefunds = opts.showRefunds !== false;
    const label = customer.name || customer.phone || "عميل";
    const {totalRemaining: totalRemaining, totalRefunds: totalRefunds, net: net} = computeStatementTotals(ongoing, refunds, opts);
    const lines = [];
    lines.push("*PARTECH*");
    lines.push("كشف حساب — " + label);
    lines.push("التاريخ: " + todayNumeric());
    lines.push("");
    if (ongoing.length) {
        lines.push("طلبيات جارية:");
        ongoing.forEach((r, i) => {
            const status = r.hasChargeable === false ? "بانتظار تسعير" : r.remaining >= CUSTOMER_REMAINING_TOLERANCE ? fmtNum(r.remaining) + " ريال متبقي" : "مسدد";
            lines.push(i + 1 + ". " + (r.orderNumber || "") + (r.orderLabel ? " — " + r.orderLabel : "") + " (" + isoToDisplayDate(r.date) + ") — " + status);
        });
        lines.push("");
    }
    if (showPaid && past.length) {
        lines.push("طلبيات مسددة: " + past.length);
        lines.push("");
    }
    if (showRefunds && refunds.length) {
        lines.push("مرتجعات مستحقة:");
        refunds.forEach((r, i) => {
            lines.push(i + 1 + ". " + (r.orderNumber || "") + " — " + (r.description || "") + " — " + fmtNum(r.amount) + " ريال");
        });
        lines.push("");
    }
    lines.push("مستحق: " + fmtNum(totalRemaining) + " ريال");
    if (showRefunds && totalRefunds > 0) lines.push("مرتجعات: " + fmtNum(totalRefunds) + " ريال");
    lines.push((net < -.01 ? "رصيد لصالحكم" : "المطلوب منكم") + ": " + fmtNum(Math.abs(net)) + " ريال");
    return lines.join("\n");
}

async function saveStatementOrderLabel(orderId, newLabel) {

function applyScrapyardProposal(pr) {
    const order = appData.orders.find(o => o.id === pr.order_id);
    if (!order) return false;
    if (pr.action === "edit") {
        const part = (order.parts || []).find(p => p.id === pr.part_id);
        if (!part) return false;
        part.costPrice = Math.max(0, Number(pr.cost_price) || 0);
    } else if (pr.action === "delete") {
        if (!(order.parts || []).some(p => p.id === pr.part_id)) return false;
        order.parts = (order.parts || []).filter(p => p.id !== pr.part_id);
    } else if (pr.action === "add") {
        order.parts = order.parts || [];
        order.parts.push({
            id: uid("p"),
            description: pr.description || "",
            qty: Math.max(1, Number(pr.qty) || 1),
            costPrice: Math.max(0, Number(pr.cost_price) || 0),
            sellPrice: null,
            used: pr.kind === "used",
            supplierId: null
        });
    } else {
        return false;
    }
    order.updatedAt = (new Date).toISOString();
    return true;
}

function handleScrapyardProposalDecision(proposalId, accept) {
    const pr = scrapyardMgmtState.proposals.find(p => p.id === proposalId);
    if (!pr) return;
    confirmAction({
        title: accept ? "قبول هذا الاقتراح؟" : "رفض هذا الاقتراح؟",
        message: accept ? "بيتطبّق التعديل مباشرة على حساباتك." : "الاقتراح بيُحذف بدون أي تغيير على حساباتك.",
        confirmLabel: accept ? "قبول وتطبيق" : "تأكيد الرفض",
        dangerous: !accept,
        onConfirm: async () => {
            const {data: deletedRows, error: delError} = await sb.from("scrapyard_proposals").delete().eq("id", pr.id).select();
            if (delError) {
                showToast("تعذر تحديث حالة الاقتراح", "error");
                return;
            }
            if (!deletedRows || !deletedRows.length) {
                showToast("هذا الاقتراح انعالج فعلًا من مكان تاني", "error");
                await loadScrapyardData(scrapyardSharedState.activeKind);
                renderScrapyardView();
                refreshScrapyardPendingCount();
                return;
            }
            const restoreProposal = async () => {
                const {error: error} = await sb.from("scrapyard_proposals").insert(deletedRows[0]);
                if (error) console.error("restoreProposal:", error);
                await loadScrapyardData(scrapyardSharedState.activeKind);
                renderScrapyardView();
                refreshScrapyardPendingCount();
            };
            if (accept) {
                const claimed = deletedRows[0];
                const order = appData.orders.find(o => o.id === claimed.order_id);
                const partsSnapshot = order ? JSON.parse(JSON.stringify(order.parts || [])) : null;
                const prevUpdatedAt = order ? order.updatedAt : null;
                const applied = applyScrapyardProposal(claimed);
                if (!applied) {
                    showToast("تعذر تطبيق الاقتراح — الطلبية أو القطعة غير موجودة. رجّعنا الاقتراح مكانه", "error");
                    await restoreProposal();
                    return;
                }
                const saved = await persistOrder(order);
                if (!saved) {
                    if (partsSnapshot) {
                        order.parts = partsSnapshot;
                        order.updatedAt = prevUpdatedAt;
                    }
                    showToast("تعذر حفظ التعديل على الطلبية — رجّعنا الاقتراح مكانه، جرّب مرة تانية", "error");
                    await restoreProposal();
                    return;
                }
                renderKPIs();
                renderTable();
            }
            showToast(accept ? "تم القبول والتطبيق" : "تم رفض الاقتراح", "ok");
            await loadScrapyardData(scrapyardSharedState.activeKind);
            renderScrapyardView();
            refreshScrapyardPendingCount();
        }
    });
}

async function saveScrapyardPartNote(orderId, partId, value) {
    const order = appData.orders.find(o => o.id === orderId);
    if (!order) return;
    const part = (order.parts || []).find(p => p.id === partId);
    if (!part) return;
    const trimmed = (value || "").trim();
    if ((part.scrapyardNote || "") === trimmed) return;
    const prevNote = part.scrapyardNote;
    const prevUpdatedAt = order.updatedAt;
    part.scrapyardNote = trimmed;
    order.updatedAt = (new Date).toISOString();
    const saved = await persistOrder(order);
    if (!saved) {
        part.scrapyardNote = prevNote;
        order.updatedAt = prevUpdatedAt;
        return;
    }
    showToast("تم حفظ الملاحظة", "ok");
}

async function sendFieldEditRequest(fieldKey, partId) {

    if (partId) {
        const part = (draft.parts || []).find(p => p.id === partId);
        currentValue = part ? part[fieldKey] : null;
    } else {
        currentValue = draft[fieldKey];

        order_id: draft.id,

let lastEditProposalLeftoverExcess = 0;

function applyEditProposal(pr, orderOverride, opts) {
    opts = opts || {};
    lastEditProposalLeftoverExcess = 0;
    const order = orderOverride || appData.orders.find(o => o.id === pr.order_id);
    if (!order) return false;
    if (pr.kind === "part_field") {
        const part = (order.parts || []).find(p => p.id === pr.part_id);
        if (!part || part.returned) return false;
        if (pr.field === "costPrice") part.costPrice = Math.max(0, Number(pr.proposed_value) || 0); else if (pr.field === "sellPrice") part.sellPrice = Math.max(0, Number(pr.proposed_value) || 0); else if (pr.field === "description") part.description = String(pr.proposed_value || ""); else if (pr.field === "qty") part.qty = Math.max(1, Number(pr.proposed_value) || 1); else if (pr.field === "used") {
            part.used = !!pr.proposed_value;
            part.supplierId = null;
        } else if (pr.field === "supplierId") part.supplierId = pr.proposed_value || null; else return false;
    } else if (pr.kind === "order_field") {
        if (pr.field === "feePercent") order.feePercent = Math.max(0, Number(pr.proposed_value) || 0); else if (pr.field === "serviceFeePercent") order.serviceFeePercent = Math.max(0, Number(pr.proposed_value) || 0); else if (pr.field === "deliveryFeeAmount") order.deliveryFeeAmount = Math.max(0, Number(pr.proposed_value) || 0); else if (pr.field === "deliveryCost") order.deliveryCost = Math.max(0, Number(pr.proposed_value) || 0); else if (pr.field === "feeEnabled") order.feeEnabled = !!pr.proposed_value; else if (pr.field === "serviceFeeEnabled") order.serviceFeeEnabled = !!pr.proposed_value; else if (pr.field === "deliveryFeeEnabled") order.deliveryFeeEnabled = !!pr.proposed_value; else if (pr.field === "customerId") {
            order.customerId = pr.proposed_value || null;
            const c = (appData.customers || []).find(c => c.id === order.customerId);
            order.customerPhone = c ? c.phone || "" : "";
        } else return false;
    } else if (pr.kind === "payment_add") {
        if (!Array.isArray(order.customerPayments)) order.customerPayments = [];
        const pv = pr.proposed_value || {};
        order.customerPayments.push({
            id: uid("pay"),
            amount: Math.max(0, Number(pv.amount) || 0),
            method: pv.method || "",
            date: pv.date || todayNumeric()
        });
    } else if (pr.kind === "payment_edit") {
        const payment = (order.customerPayments || []).find(p => p.id === pr.payment_id);
        if (!payment) return false;
        const pv = pr.proposed_value || {};
        payment.amount = Math.max(0, Number(pv.amount) || 0);
        payment.method = pv.method || "";
        payment.date = pv.date || payment.date;
    } else if (pr.kind === "payment_delete") {
        const existed = (order.customerPayments || []).some(p => p.id === pr.payment_id);
        if (!existed) return false;
        order.customerPayments = (order.customerPayments || []).filter(p => p.id !== pr.payment_id);
    } else if (pr.kind === "part_exclude") {
        const part = (order.parts || []).find(p => p.id === pr.part_id);
        if (!part) return false;
        part.included = false;
    } else if (pr.kind === "part_delete") {
        const targetPart = (order.parts || []).find(p => p.id === pr.part_id);
        if (!targetPart || targetPart.returned) return false;
        order.parts = (order.parts || []).filter(p => p.id !== pr.part_id);
    } else if (pr.kind === "part_return") {
        const part = (order.parts || []).find(p => p.id === pr.part_id);
        if (!part || part.returned) return false;
        const hasReceivable = partPurchaseCostSettled(order, part);
        if (hasReceivable && !part.supplierId) return false;
        const s = computeReturnFeeShare(order, part);
        if (opts.keepFee) {
            part.returnKeptFeeShare = s.feeShare;
            part.returnKeptServiceFeeShare = s.serviceFeeShare;
            order.returnKeptFeeAmount = round2((order.returnKeptFeeAmount || 0) + s.feeShare);
            order.returnKeptServiceFeeAmount = round2((order.returnKeptServiceFeeAmount || 0) + s.serviceFeeShare);
            lastEditProposalLeftoverExcess = applyPartReturnOnOrder(order, part, 0);
        } else {
            lastEditProposalLeftoverExcess = applyPartReturnOnOrder(order, part, round2(s.feeShare + s.serviceFeeShare));
        }
    } else if (pr.kind === "order_return") {
        const activeParts = orderActiveParts(order).filter(p => !p.returned);
        if (!activeParts.length) return false;
        const missingSupplier = activeParts.some(p => {
            const hasReceivable = partPurchaseCostSettled(order, p);
            return hasReceivable && !p.supplierId;
        });
        if (missingSupplier) return false;
        activeParts.forEach((p, i) => {
            const s = computeReturnFeeShare(order, p);
            const isLast = i === activeParts.length - 1;
            const t = isLast ? orderTotals(order) : null;
            const liveDelivery = isLast ? round2(Math.max(0, t.deliveryFeeAmount - (order.returnKeptDeliveryAmount || 0))) : 0;
            if (opts.keepFee) {
                p.returnKeptFeeShare = s.feeShare;
                p.returnKeptServiceFeeShare = s.serviceFeeShare;
                if (isLast && liveDelivery > .01) p.returnKeptDeliveryShare = liveDelivery;
                order.returnKeptFeeAmount = round2((order.returnKeptFeeAmount || 0) + s.feeShare);
                order.returnKeptServiceFeeAmount = round2((order.returnKeptServiceFeeAmount || 0) + s.serviceFeeShare);
                if (isLast) order.returnKeptDeliveryAmount = round2((order.returnKeptDeliveryAmount || 0) + liveDelivery);
                lastEditProposalLeftoverExcess = applyPartReturnOnOrder(order, p, 0);
            } else {
                lastEditProposalLeftoverExcess = applyPartReturnOnOrder(order, p, round2(s.feeShare + s.serviceFeeShare + liveDelivery));
            }
        });
    } else if (pr.kind === "return_collect") {
        const part = (order.parts || []).find(p => p.id === pr.part_id);
        if (!part || !part.returned || !part.returnHasReceivable || part.returnCollected) return false;
        part.returnCollected = true;
    } else if (pr.kind === "customer_refund_confirm") {
        const part = (order.parts || []).find(p => p.id === pr.part_id);
        if (!part || !part.returned || part.customerRefundConfirmed) return false;
        const adjustment = (order.customerPayments || []).find(pay => pay.returnAdjustment && pay.linkedPartId === part.id);
        if (!adjustment) return false;
        part.customerRefundConfirmed = true;
    } else {
        return false;
    }
    order.updatedAt = (new Date).toISOString();
    return true;
}

async function handleEditProposalDecision(proposalId, accept) {
    const pr = (editProposals || []).find(p => p.id === proposalId);
    if (!pr) return;
    const needsFeeChoice = accept && (pr.kind === "part_return" || pr.kind === "order_return");
    if (needsFeeChoice) {
        let shareAmount = 0;
        try {
            const {data: freshRow} = await sb.from("orders").select("*").eq("id", pr.order_id).maybeSingle();
            if (freshRow) {
                const order = orderRowToObject(freshRow);
                if (pr.kind === "part_return") {
                    const part = (order.parts || []).find(p => p.id === pr.part_id);
                    if (part) {
                        const s = computeReturnFeeShare(order, part);
                        shareAmount = round2(s.feeShare + s.serviceFeeShare);
                    }
                } else {
                    shareAmount = liveWholeOrderReturnShare(order).total;
                }
            }
        } catch (e) {}
        if (shareAmount > .01) {
            openReturnFeeChoiceModal(shareAmount, pr.kind === "order_return", keepFee => proceedEditProposalDecision(proposalId, accept, keepFee));
            return;
        }
    }
    proceedEditProposalDecision(proposalId, accept, false);
}

function proceedEditProposalDecision(proposalId, accept, keepFee) {
    const pr = (editProposals || []).find(p => p.id === proposalId);
    if (!pr) return;
    const orderRefForLog = (() => {
        const o = appData.orders.find(o => o.id === pr.order_id);
        return o ? "#" + o.orderNumber + (o.orderLabel ? " — " + o.orderLabel : "") : "طلبية #" + pr.order_id;
    })();
    confirmAction({
        title: accept ? "قبول هذا الطلب؟" : "رفض هذا الطلب؟",
        message: accept ? "بيتطبّق التعديل مباشرة على الطلبية." : "الطلب بيُحذف بدون أي تغيير.",
        confirmLabel: accept ? "قبول وتطبيق" : "تأكيد الرفض",
        dangerous: !accept,
        onConfirm: async () => {
            const {data: deletedRows, error: delError} = await sb.from("edit_proposals").delete().eq("id", pr.id).select();
            if (delError) {
                showToast("تعذر تحديث حالة الطلب", "error");
                return;
            }
            if (!deletedRows || !deletedRows.length) {
                showToast("هذا الطلب انعالج فعلًا من مكان تاني", "error");
                await refreshEditProposals();
                return;
            }
            const restoreProposal = async () => {
                const {error: error} = await sb.from("edit_proposals").insert(deletedRows[0]);
                if (error) console.error("restoreEditProposal:", error);
                await refreshEditProposals();
            };
            if (accept) {
                const claimed = deletedRows[0];
                if (claimed.kind === "order_delete") {
                    const deleted = await deleteOrder(claimed.order_id);
                    if (!deleted) {
                        showToast("تعذر حذف الطلبية — رجّعنا الطلب مكانه، جرّب مرة تانية", "error");
                        await restoreProposal();
                        return;
                    }
                    appData.orders = appData.orders.filter(o => o.id !== claimed.order_id);
                    if (draft && draft.id === claimed.order_id) closeModal();
                    await purgeEditProposalsForOrder(claimed.order_id);
                    renderKPIs();
                    renderTable();
                } else {
                    const {data: freshRow, error: fetchError} = await sb.from("orders").select("*").eq("id", claimed.order_id).maybeSingle();
                    if (fetchError || !freshRow) {
                        showToast("تعذر تطبيق الطلب — الطلبية غير موجودة. رجّعنا الطلب مكانه", "error");
                        await restoreProposal();
                        return;
                    }
                    const order = orderRowToObject(freshRow);
                    const applied = applyEditProposal(claimed, order, {
                        keepFee: keepFee
                    });
                    if (!applied) {
                        showToast("تعذر تطبيق الطلب — الطلبية أو القطعة/الدفعة غير موجودة. رجّعنا الطلب مكانه", "error");
                        await restoreProposal();
                        return;
                    }
                    const saved = await persistOrder(order);
                    if (!saved) {
                        showToast("تعذر حفظ التعديل على الطلبية — رجّعنا الطلب مكانه، جرّب مرة تانية", "error");
                        await restoreProposal();
                        return;
                    }
                    const idx = appData.orders.findIndex(o => o.id === order.id);
                    if (idx >= 0) appData.orders[idx] = order; else appData.orders.push(order);
                    if (claimed.kind === "part_delete" || claimed.kind === "part_return") {
                        await purgeEditProposalsForPart(order.id, claimed.part_id);
                    } else if (claimed.kind === "order_return") {
                        const returnedPartIds = (order.parts || []).filter(p => p.returned).map(p => p.id);
                        await purgeEditProposalsForParts(order.id, returnedPartIds);
                    }
                    if (draft && draft.id === order.id) {
                        draft.parts = JSON.parse(JSON.stringify(order.parts || []));
                        draft.customerPayments = JSON.parse(JSON.stringify(order.customerPayments || []));
                        draft.customerId = order.customerId;
                        draft.customerPhone = order.customerPhone;
                        draft.feePercent = order.feePercent;
                        draft.serviceFeePercent = order.serviceFeePercent;
                        draft.deliveryFeeAmount = order.deliveryFeeAmount;
                        draft.feeEnabled = order.feeEnabled;
                        draft.serviceFeeEnabled = order.serviceFeeEnabled;
                        draft.deliveryFeeEnabled = order.deliveryFeeEnabled;
                        draft.returnKeptFeeAmount = order.returnKeptFeeAmount;
                        draft.returnKeptServiceFeeAmount = order.returnKeptServiceFeeAmount;
                        draft.returnKeptDeliveryAmount = order.returnKeptDeliveryAmount;
                        draft.returnKeptExcessAmount = order.returnKeptExcessAmount;
                        draft.updatedAt = order.updatedAt;
                        syncDraftVinFromOrder(order);
                        draftOpenedAtUpdatedAt = order.updatedAt;
                        refreshPartsList();
                        refreshFeeFieldsBlock();
                        refreshOrderCustomerBlock();
                        refreshPaymentsList();
                        updateModalTotals();
                    }
                    renderKPIs();
                    renderTable();
                    if (round2(lastEditProposalLeftoverExcess) > .01) {
                        const returnedParts = (order.parts || []).filter(p => p.returned);
                        const linkedPart = claimed.part_id && (order.parts || []).find(p => p.id === claimed.part_id) || (returnedParts.length ? returnedParts[returnedParts.length - 1] : null);
                        const excessAmountToApply = round2(lastEditProposalLeftoverExcess);
                        const linkedPartId = linkedPart ? linkedPart.id : null;
                        await new Promise(resolve => {
                            openReturnExcessChoiceModal(excessAmountToApply, order, linkedPart, async choice => {
                                const {data: freshRow2} = await sb.from("orders").select("*").eq("id", order.id).maybeSingle();
                                if (!freshRow2) {
                                    showToast("تعذر حفظ قرار الزيادة — الطلبية لم تعد موجودة", "error");
                                    renderKPIs();
                                    renderTable();
                                    resolve();
                                    return;
                                }
                                const freshOrder = orderRowToObject(freshRow2);
                                if (choice === "keep") {
                                    freshOrder.returnKeptExcessAmount = round2((Number(freshOrder.returnKeptExcessAmount) || 0) + excessAmountToApply);
                                    const freshLinkedPart = linkedPartId ? (freshOrder.parts || []).find(p => p.id === linkedPartId) : null;
                                    if (freshLinkedPart) freshLinkedPart.returnKeptExcessShare = excessAmountToApply;
                                } else {
                                    const existing = linkedPartId ? (freshOrder.customerPayments || []).find(pay => pay.returnAdjustment && pay.linkedPartId === linkedPartId) : null;
                                    if (existing) {
                                        existing.amount = round2((Number(existing.amount) || 0) + excessAmountToApply);
                                    } else {
                                        if (!Array.isArray(freshOrder.customerPayments)) freshOrder.customerPayments = [];
                                        freshOrder.customerPayments.push({
                                            id: uid("pay"),
                                            amount: excessAmountToApply,
                                            method: "مرتجع",
                                            date: todayNumeric(),
                                            returnAdjustment: true,
                                            linkedPartId: linkedPartId || null
                                        });
                                    }
                                }
                                const savedExcess = await persistOrder(freshOrder);
                                if (!savedExcess) {
                                    showToast("تعذر حفظ قرار الزيادة — حاول تعديله يدويًا من داخل الطلبية", "error");
                                    renderKPIs();
                                    renderTable();
                                    resolve();
                                    return;
                                }
                                const idx2 = appData.orders.findIndex(o => o.id === freshOrder.id);
                                if (idx2 >= 0) appData.orders[idx2] = freshOrder; else appData.orders.push(freshOrder);
                                if (draft && draft.id === freshOrder.id) {
                                    draft.parts = JSON.parse(JSON.stringify(freshOrder.parts || []));
                                    draft.customerPayments = JSON.parse(JSON.stringify(freshOrder.customerPayments || []));
                                    draft.returnKeptExcessAmount = freshOrder.returnKeptExcessAmount;
                                    syncDraftVinFromOrder(freshOrder);
                                    draftOpenedAtUpdatedAt = freshOrder.updatedAt;
                                    refreshPartsList();
                                    refreshPaymentsList();
                                    updateModalTotals();
                                }
                                renderKPIs();
                                renderTable();
                                resolve();
                            });
                        });
                    }
                }
            }
            try {
                await sb.from("activity_events").insert({
                    kind: "edit_proposal_decided",
                    order_id: pr.order_id,
                    order_ref: orderRefForLog,
                    actor_email: presenceEmail,
                    target_email: deletedRows[0].submitted_by,
                    message: (accept ? "تم قبول طلب التعديل على الطلبية: " : "تم رفض طلب التعديل على الطلبية: ") + orderRefForLog
                });
            } catch (e) {
                console.error("logEditProposalDecided:", e);
            }
            showToast(accept ? "تم القبول والتطبيق" : "تم رفض الطلب", "ok");
            await refreshEditProposals();
        }
    });
}

let activityEvents = [];

let activityEventsLastSeenAt = "1970-01-01T00:00:00Z";

let activityEventsChannel = null;

let activityLogModalOpen = false;

function activityEventMatchesAudience(ev) {
    if (ev.target_email) return ev.target_email === presenceEmail;
    if (ev.elevated_only) return currentUserIsElevated;
    if (ev.audience_role) return ev.audience_role === currentUserRole;
    return true;
}

async function refreshActivityEvents() {
    try {
        if (!sb || !presenceEmail) return;
        await loadActivityEventsSeenMark();
        const audienceOr = "target_email.eq." + presenceEmail + ",audience_role.eq." + currentUserRole + (currentUserIsElevated ? ",elevated_only.eq.true" : "");
        const {data: data, error: error} = await sb.from("activity_events").select("*").or(audienceOr).order("created_at", {
            ascending: false
        }).limit(200);
        if (error) throw error;
        activityEvents = (data || []).filter(activityEventMatchesAudience);
    } catch (e) {
        console.error("refreshActivityEvents:", e);
        return;
    }
    updateActivityLogBadge();
    if (activityLogModalOpen) renderActivityLogList();
}

async function loadActivityEventsSeenMark() {
    try {
        if (!sb || !presenceEmail) return;
        const {data: data, error: error} = await sb.from("activity_events_seen").select("last_seen_at").eq("email", presenceEmail).maybeSingle();
        if (error) throw error;
        activityEventsLastSeenAt = data && data.last_seen_at || "1970-01-01T00:00:00Z";
    } catch (e) {
        console.error("loadActivityEventsSeenMark:", e);
    }
}

function updateActivityLogBadge() {
    const seenMs = new Date(activityEventsLastSeenAt).getTime();
    const count = activityEvents.filter(ev => new Date(ev.created_at).getTime() > seenMs).length;
    [ "activity-log-badge", "activity-log-badge-scrapyard" ].forEach(id => {
        const badge = document.getElementById(id);
        if (!badge) return;
        badge.textContent = count > 0 ? count : "";
        badge.style.display = count > 0 ? "flex" : "none";
    });
}

async function markActivityEventsSeen() {
    if (activityEvents.length) activityEventsLastSeenAt = activityEvents[0].created_at;
    updateActivityLogBadge();
    try {
        if (!sb || !presenceEmail) return;
        await sb.from("activity_events_seen").upsert({
            email: presenceEmail,
            last_seen_at: activityEventsLastSeenAt
        }, {
            onConflict: "email"
        });
    } catch (e) {
        console.error("markActivityEventsSeen:", e);
    }
}

function subscribeActivityEventsRealtime() {
    if (!sb || activityEventsChannel) return;
    activityEventsChannel = sb.channel("activity-events-changes").on("postgres_changes", {
        event: "INSERT",
        schema: "public",
        table: "activity_events"
    }, () => {
        refreshActivityEvents();
    }).subscribe();
}

function closeActivityLog() {
    const root = document.getElementById("modal-root");
    root.innerHTML = "";
    root.classList.remove("modal-open");
    activityLogModalOpen = false;
    document.removeEventListener("keydown", activityLogEscListener);
}

function activityLogEscListener(e) {
    if (e.key === "Escape") closeActivityLog();
}

let activityLogOpening = false;

async function openActivityLog() {
    if (activityLogModalOpen || activityLogOpening) return;
    if (draft || quoteDraft) {
        showToast("عندك نافذة مفتوحة حاليًا — سكّرها الأول وبعدين افتح سجل الإشعارات 🛎️", "error");
        return;
    }
    activityLogOpening = true;
    try {
        await withTimeout(refreshActivityEvents(), GUARDED_AWAIT_TIMEOUT_MS, "refreshActivityEvents").catch(e => console.error("openActivityLog:", e));
        if (draft || quoteDraft) return;
        const root = document.getElementById("modal-root");
        root.innerHTML = '<div class="modal-backdrop" data-close-confirm>' + '<div class="modal-card modal-card-sm" role="dialog" aria-modal="true">' + '<div class="modal-title">🛎️ سجل الإشعارات</div>' + '<div id="activity-log-list" style="margin-top:14px;max-height:60vh;overflow-y:auto;">' + activityLogListHtml() + "</div>" + '<div class="modal-footer-actions" style="margin-top:16px;justify-content:flex-end;">' + '<button type="button" class="btn btn-ghost" id="close-activity-log-btn">إغلاق</button>' + "</div>" + "</div>" + "</div>";
        root.classList.add("modal-open");
        root.querySelector("[data-close-confirm]").addEventListener("click", e => {
            if (e.target.hasAttribute("data-close-confirm")) closeActivityLog();
        });
        root.querySelector("#close-activity-log-btn").addEventListener("click", closeActivityLog);
        root.querySelector("#activity-log-list").addEventListener("click", e => {
            const row = e.target.closest(".activity-log-row");
            if (!row) return;
            if (row.hasAttribute("data-open-stats")) {
                closeActivityLog();
                openStatisticsView();
                return;
            }
            const orderId = row.getAttribute("data-open-order-id");
            if (!orderId) return;
            const order = appData.orders.find(o => o.id === orderId);
            closeActivityLog();
            if (!order) {
                showToast("الطلبية يلي يخصها هالإشعار ما عادت متوفرة", "error");
                return;
            }
            modalCloseCallback = () => openActivityLog();
            if (currentUserRole === "scrapyard") {
                if (order.isQuote) openQuoteModal("edit", orderId, "purchasing"); else openApprovedQuoteViewModal(orderId);
                return;
            }
            if (order.isQuote) {
                openQuoteModal("edit", orderId);
                return;
            }
            openModal("edit", orderId);
        });
        document.addEventListener("keydown", activityLogEscListener);
        activityLogModalOpen = true;
        markActivityEventsSeen();
    } finally {
        activityLogOpening = false;
    }
}

let editProposalDelegationBound = false;

function bindEditProposalGlobalDelegation() {
    if (editProposalDelegationBound) return;
    editProposalDelegationBound = true;
    const root = document.getElementById("modal-root");
    root.addEventListener("click", e => {
        const reqBtn = e.target.closest(".field-request-btn");
        if (reqBtn) {
            const fieldKey = reqBtn.getAttribute("data-request-field");
            const partId = reqBtn.getAttribute("data-part-id");
            if (reqBtn.hasAttribute("data-request-boolean")) {
                const part = partId ? (draft.parts || []).find(p => p.id === partId) : null;
                const currentValue = partId ? !!(part && part[fieldKey]) : !!(draft && draft[fieldKey]);
                requestBooleanFieldChange(fieldKey, partId || null, currentValue);
                return;
            }
            composingProposalFields.add(composeKey(fieldKey, partId));
            refreshGatedFieldViews();
            return;
        }
        const cancelFieldBtn = e.target.closest(".field-request-cancel-btn");
        if (cancelFieldBtn) {
            composingProposalFields.delete(composeKey(cancelFieldBtn.getAttribute("data-cancel-field"), cancelFieldBtn.getAttribute("data-part-id")));
            refreshGatedFieldViews();
            return;
        }
        const sendFieldBtn = e.target.closest(".field-request-send-btn");
        if (sendFieldBtn) {
            sendFieldEditRequest(sendFieldBtn.getAttribute("data-send-field"), sendFieldBtn.getAttribute("data-part-id") || null);
            return;
        }
        const withdrawBtn = e.target.closest(".proposal-withdraw-btn");
        if (withdrawBtn) {
            withdrawEditProposal(withdrawBtn.getAttribute("data-withdraw-proposal"));
            return;
        }
        const acceptBtn = e.target.closest(".proposal-accept-btn");
        if (acceptBtn) {
            handleEditProposalDecision(acceptBtn.getAttribute("data-accept-proposal"), true);
            return;
        }
        const rejectBtn = e.target.closest(".proposal-reject-btn");
        if (rejectBtn) {
            handleEditProposalDecision(rejectBtn.getAttribute("data-reject-proposal"), false);
            return;
        }
    });
}

function refreshEditProposalsModal() {

    const root = document.getElementById("modal-root");
    root.innerHTML = editProposalsModalHtml();
    bindEditProposalsModalEvents();
}

function closeEditProposalsModal() {
    editProposalsModalOpen = false;
    const root = document.getElementById("modal-root");
    root.innerHTML = "";
    root.classList.remove("modal-open");
}

function bindEditProposalsModalEvents() {
    const root = document.getElementById("modal-root");
    root.querySelector("[data-close-backdrop]").addEventListener("click", e => {
        if (e.target.hasAttribute("data-close-backdrop")) closeEditProposalsModal();
    });
    root.querySelector("#edit-proposals-close-btn").addEventListener("click", closeEditProposalsModal);
    root.querySelectorAll(".edit-proposal-review-head").forEach(head => {
        head.style.cursor = "pointer";
        head.addEventListener("click", () => {
            const orderId = head.closest("[data-open-order-proposal]").getAttribute("data-open-order-proposal");
            closeEditProposalsModal();
            modalCloseCallback = () => openEditProposalsModal();
            openModal("edit", orderId);
        });
    });
}
