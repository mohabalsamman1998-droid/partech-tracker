function updateModalTotals(){
  const t = orderTotals(draft);
  document.getElementById('total-cost-display').textContent = fmtMoney(t.costTotal);
  document.getElementById('total-sell-display').textContent = t.hasSell? fmtMoney(t.sellTotal) : (t.allPartsReturned?'مرتجعة':(t.noActiveParts?'بدون قطع محددة':'لم يُسعّر بعد'));
  const costSupplierEl = document.getElementById('cost-supplier-display');
  if(costSupplierEl) costSupplierEl.textContent = fmtMoney(t.costToSupplier);
  const costAmerEl = document.getElementById('cost-amer-display');
  if(costAmerEl) costAmerEl.textContent = fmtMoney(t.costToScrapyard);
  const feePreviewEl = document.getElementById('fee-amount-preview');
  if(feePreviewEl){
    feePreviewEl.textContent = (t.feeEnabled && t.feeAmount>0) ? ('= '+fmtMoney(t.feeAmount)) : '';
  }
  const serviceFeePreviewEl = document.getElementById('service-fee-amount-preview');
  if(serviceFeePreviewEl){
    serviceFeePreviewEl.textContent = (t.serviceFeeEnabled && t.serviceFeeAmount>0) ? ('= '+fmtMoney(t.serviceFeeAmount)) : '';
  }
  const profitEl = document.getElementById('total-profit-display');
  profitEl.textContent = t.hasSell? fmtMoney(t.profit) : '—';
  profitEl.classList.remove('text-green','text-rust','text-amber');
  if(t.hasSell){
    if(t.profit<0) profitEl.classList.add('text-rust');
    else if(t.customerFullyPaid) profitEl.classList.add('text-green');
    else profitEl.classList.add('text-amber');
  }
  const profitSubEl = document.getElementById('total-profit-sub');
  if(profitSubEl){
    if(t.hasSell && t.customerPaidAmount>0 && !t.customerFullyPaid){
      profitSubEl.innerHTML = 'محصّل <span class="text-green">'+fmtMoney(t.collectedProfit)+'</span> · متبقي <span class="text-amber">'+fmtMoney(t.uncollectedProfit)+'</span>';
    } else {
      profitSubEl.innerHTML = '';
    }
  }
  const remainEl = document.getElementById('customer-remaining-display');
  const remainLabelEl = document.getElementById('customer-remaining-label');
  if(remainEl){
    const isExcess = t.hasSell && t.customerRemaining < -0.01;
    if(remainLabelEl) remainLabelEl.textContent = isExcess ? 'زيادة' : 'المتبقي عليه';
    remainEl.textContent = t.hasSell ? fmtMoney(isExcess ? Math.abs(t.customerRemaining) : Math.max(t.customerRemaining,0)) : (t.allPartsReturned?'مرتجعة':(t.noActiveParts?'بدون قطع محددة':'لم يُسعّر بعد'));
    remainEl.classList.remove('text-green','text-amber');
    remainEl.classList.toggle('text-green', t.hasSell && t.customerRemaining<=0.01 && !isExcess);
    remainEl.classList.toggle('text-amber', t.hasSell && (t.customerRemaining>0.01 || isExcess));
  }
  const paidEl = document.getElementById('total-paid-display');
  if(paidEl) paidEl.textContent = fmtMoney(t.customerPaidAmount);
  const refundStatusWrap = document.getElementById('customer-refund-status-wrap');
  if(refundStatusWrap){
    refundStatusWrap.innerHTML = orderCustomerRefundStatusHtml(draft);
    // إعادة الربط بعد كل إعادة رسم: الزر كان يتربط مرة وحدة بس داخل attachModalHandlers، وهاي
    // السطر بيستبدل العنصر بعنصر جديد بلا مستمع مع كل تحديث للمجاميع — يعني بالحالة الطبيعية
    // (إرجاع قطعة والنافذة مفتوحة) الزر كان يظهر لأول مرة *بعد* الربط، فيطلع ميت ما بيسوي إشي.
    bindOrderRefundConfirmButton();
  }
}

/* زر "تم رد المبلغ للزبون" داخل نافذة الطلبية — دالة مستقلة لأنها تُستدعى بعد كل إعادة رسم
   لكتلة حالة الاسترداد، مش مرة وحدة وقت فتح النافذة. */
function bindOrderRefundConfirmButton(){
  const root = document.getElementById('modal-root');
  if(!root) return;
  const confirmRefundBtn = root.querySelector('#order-confirm-refund-btn');
  if(!confirmRefundBtn) return;
  confirmRefundBtn.addEventListener('click', ()=>{
    confirmAction({
      title: 'تأكيد رد المبلغ للزبون؟',
      message: 'رح يُخصم المبلغ من صافي الصندوق. احفظ الطلبية بعدها حتى يتثبّت.',
      confirmLabel: 'تم الرد',
      dangerous: true,
      onConfirm: ()=>{
        if(!draft) return; // النافذة انسكّرت والمستخدم لسه ماسك مربع التأكيد
        (draft.parts||[]).forEach(p=>{
          if(!p.returned || p.customerRefundConfirmed) return;
          const adj = (draft.customerPayments||[]).find(pay=>pay.returnAdjustment && pay.linkedPartId===p.id);
          if(adj) p.customerRefundConfirmed = true;
        });
        refreshPartsList();
        updateModalTotals();
        showToast('تم التعليم — اضغط "حفظ الطلبية" لتثبيته', 'ok');
      }
    });
  });
}

/* حالة إرجاع مبلغ الزبون لهذه الطلبية — قطعة رجعت وكان مدفوع ثمنها: "يجب إرجاع X للزبون"
   لحد ما يُأكَّد الإرجاع فعليًا من شاشة العملاء (عندها تتحول لـ"تم الإرجاع") */
function orderCustomerRefundStatusHtml(order){
  let pendingTotal = 0, confirmedTotal = 0;
  (order.parts||[]).forEach(p=>{
    if(!p.returned) return;
    const adj = (order.customerPayments||[]).find(pay=>pay.returnAdjustment && pay.linkedPartId===p.id);
    if(!adj) return;
    if(p.customerRefundConfirmed) confirmedTotal += Number(adj.amount)||0;
    else pendingTotal += Number(adj.amount)||0;
  });
  pendingTotal = round2(pendingTotal); confirmedTotal = round2(confirmedTotal);
  if(pendingTotal<=0 && confirmedTotal<=0) return '';
  // زر التأكيد كان موجود بشاشة العميل بس — فطلبية بلا عميل مربوط كان استردادها ما بينقفل أبدًا.
  // منعرضه هون كمان (للمخوّلين) حتى يكون في طريقة تقفله من داخل الطلبية نفسها.
  const confirmBtn = (pendingTotal>0 && hasElevatedAccess())
    ? '<button type="button" class="btn btn-sm btn-danger-ghost" id="order-confirm-refund-btn">تم رد المبلغ للزبون</button>'
    : '';
  return (pendingTotal>0 ? '<div class="customer-refund-status customer-refund-status-pending">يجب إرجاع '+fmtMoney(pendingTotal)+' للزبون '+confirmBtn+'</div>' : '') +
    (confirmedTotal>0 ? '<div class="customer-refund-status customer-refund-status-done">✅ تم إرجاع '+fmtMoney(confirmedTotal)+' للزبون</div>' : '');
}

async function onSaveOrder(){
  // فحص تعارض: هل حد غيّر هالطلبية بقاعدة البيانات بعد ما فتحنا هالنافذة (مثلاً قبول اقتراح
  // تسعير من عامر)؟ لو نكمل نحفظ نسخة draft القديمة كأنه ما صار شي، بنلغي هداك التعديل بصمت.
  if(!draft.isNew){
    const liveOrder = appData.orders.find(o=>o.id===draft.id);
    // اختفت من appData = انحذفت من مكان تاني. الحفظ هون بيعيد إنشاءها (بعث من الموت) —
    // مش "ما في تعارض" زي ما كان الفحص القديم بيعتبرها.
    if(!liveOrder){
      showToast('هذه الطلبية انحذفت من مكان تاني — أغلقنا النافذة حتى ما ترجع تنحفظ من جديد', 'error');
      closeModal();
      return false;
    }
    if(draftOpenedAtUpdatedAt && liveOrder.updatedAt && liveOrder.updatedAt !== draftOpenedAtUpdatedAt){
      document.removeEventListener('keydown', escListener); // Esc كان يقفل النافذة والوعد معلّق
      const proceedAnyway = await new Promise(resolve=>{
        confirmAction({
          title: 'الطلبية اتغيّرت من مكان تاني',
          message: 'صار عليها تحديث (ممكن قبول اقتراح تسعير من عامر، أو تعديل من مستخدم تاني) بعد ما فتحت هالنافذة. لو كملت وحفظت، بيضيع هداك التحديث. الأفضل تسكّر وتفتحها من جديد لتشوف آخر نسخة.',
          // الخيار الآمن لازم يكون هو نتيجة أي إلغاء (ضغطة برّا المربع/زر الإلغاء) — قبل كان
          // الضغط برّا بيكمّل الحفظ ويكتب فوق تعديل الطرف التاني، عكس المقصود.
          confirmLabel: 'كمّل واحفظ نسختي (بيلغي تعديلهم)',
          cancelLabel: 'سكّر بدون حفظ',
          dangerous: true,
          onConfirm: ()=> resolve(true),
          onCancel: ()=> resolve(false)
        });
      });
      if(!proceedAnyway){ closeModal(); return false; }
      document.addEventListener('keydown', escListener);
    }
  }
  if(!draft.orderNumber || !draft.orderNumber.trim()){
    showToast('لازم تكتب رقم الطلب', 'error'); return false;
  }
  const dup = appData.orders.find(o=>o.orderNumber.trim()===draft.orderNumber.trim() && o.id!==draft.id);
  if(dup){ showToast('رقم الطلب مستخدم من قبل، غيّره', 'error'); return false; }

  // Object.assign فوق القطعة الأصلية حتى ما نمسح أي حقل مش مذكور هون (كانت ملاحظات المبيعات
  // notes وملاحظات عامر purchasingNotes بتنمسح عند أول حفظ لطلبية معتمدة) — نفس مبدأ cleanedQuoteParts
  const cleanedParts = draft.parts
    .filter(p=>p.description && p.description.trim())
    .map(p=>Object.assign({}, p, {
      id:p.id,
      description:p.description.trim(),
      qty: (p.qty===''||p.qty==null||Number(p.qty)<=0) ? 1 : Math.max(1, Number(p.qty)),
      costPrice: p.costPrice===''? 0 : Math.max(0, Number(p.costPrice)||0),
      sellPrice: (p.sellPrice===''||p.sellPrice===null||p.sellPrice===undefined)? null : Math.max(0, Number(p.sellPrice)||0),
      used: !!p.used,
      included: p.included!==false,
      supplierId: p.supplierId || null,
      returned: !!p.returned,
      returnHasReceivable: !!p.returnHasReceivable,
      returnCollected: !!p.returnCollected,
      customerRefundConfirmed: !!p.customerRefundConfirmed
    }));
  if(cleanedParts.length===0){ showToast('لازم تضيف وصف لقطعة وحدة على الأقل', 'error'); return false; }

  const paymentsMissingMethod = (draft.customerPayments||[]).some(p=>
    !p.returnAdjustment && p.amount!=='' && p.amount!=null && Number(p.amount)>0 && !p.method
  );
  if(paymentsMissingMethod){
    showToast('لازم تحدد طريقة الدفع (كاش/شبكة) لكل دفعة قبل الحفظ', 'error');
    return false;
  }

  const cleanedPayments = (draft.customerPayments||[])
    .filter(p=>p.amount!=='' && p.amount!=null && Number(p.amount)>0)
    .map(p=>({
      id:p.id,
      amount: Number(p.amount)||0,
      method: p.method||'',
      date: (p.date||'').trim(),
      returnAdjustment: !!p.returnAdjustment,
      linkedPartId: p.linkedPartId || null
    }));

  // أي زيادة بمجموع الدفعات عن المستحق مقبولة الآن (تظهر "زيادة" بملخص الطلبية) — بدون حظر الحفظ
  draft.parts = cleanedParts;
  draft.customerPayments = cleanedPayments;
  draft.orderNumber = draft.orderNumber.trim();
  draft.orderLabel = (draft.orderLabel||'').trim();
  draft.updatedAt = new Date().toISOString();
  const orderWasNew = !!draft.isNew;
  // نلتقط مرجع الطلبية والـid والمجموعات المعلّقة *قبل* أي await — لو المستخدم سكّر النافذة أو
  // فتح طلبية تانية أثناء الحفظ، draft العام بيصير null أو يشاور على غيرها؛ العمل من هون وطالع
  // على النسخ الملتقطة (savingOrder وليس draft) يمنع الانهيار (delete على null) وتلويث طلبية
  // تانية فُتحت بالمنتصف بالخطأ — نفس درس quoteModalStillOpen بالضبط.
  const draftId = draft.id;
  const savingOrder = draft;
  const scrapyardCancellationsSnapshot = new Set(pendingScrapyardCancellations);
  const editProposalsCancellationSnapshot = pendingEditProposalsCancellation;
  const partProposalPurgesSnapshot = new Set(pendingPartProposalPurges);

  // ما منمسح isNew ولا منقدّم خط أساس التعارض إلا بعد ما نتأكد إن الحفظ نجح فعليًا — لو فشل
  // الإدراج ومسحنا isNew، كل محاولة لاحقة بتتحوّل لتحديث صف مش موجود بالقاعدة (بتبان ناجحة وهي فاشلة).
  const saved = await persistOrder(savingOrder, orderWasNew);
  if(!saved) return false;

  delete savingOrder.isNew;

  const idx = appData.orders.findIndex(o=>o.id===savingOrder.id);
  if(idx>=0) appData.orders[idx]=savingOrder; else appData.orders.push(savingOrder);

  // الطلبية اتحفظت فعليًا هلق — نفّذ إلغاء أي اقتراح تسعير معلّق لقطع غيّرنا تصنيفها بهالجلسة
  // (على نسخة الالتقاط، مش المجموعات العامة الحالية — ممكن تكون صارت لطلبية تانية فُتحت بالمنتصف)
  if(scrapyardCancellationsSnapshot.size){
    for(const partId of scrapyardCancellationsSnapshot){
      await cancelPendingScrapyardProposalsForPart(partId);
    }
  }
  if(editProposalsCancellationSnapshot){
    await cancelPendingSuppliedGatedProposalsForOrder(savingOrder.id);
  }
  if(partProposalPurgesSnapshot.size){
    for(const partId of partProposalPurgesSnapshot){
      await purgeEditProposalsForPart(savingOrder.id, partId);
    }
  }

  renderKPIs();
  renderTable();
  updateCustomersBadge();
  updateSuppliersBadge();
  showToast('تم حفظ الطلبية', 'ok');

  // النافذة انسكّرت أو تحوّلت لطلبية تانية أثناء الحفظ — الحفظ نجح وانعكس بالجدول فوق، بس ما
  // في داعي (ولا يصح) نلمس draft/الواجهة الحالية يلي ممكن تخص طلبية تانية هلق
  if(!orderModalStillOpen(draftId)) return true;

  draftOpenedAtUpdatedAt = draft.updatedAt; // المودال بيضل مفتوح بعد الحفظ — هاي صارت خط الأساس الجديد لأي حفظ لاحق بنفس الجلسة
  editingPayments = {};
  pendingScrapyardCancellations.clear();
  pendingEditProposalsCancellation = false;
  pendingPartProposalPurges.clear();

  // حفظ الطلبية ما يطلعك منها — يبقى المودال مفتوح، بس يحدّث حالته (زي تحول "جديدة" لموجودة، إلخ)
  const root = document.getElementById('modal-root');
  // استبدال innerHTML بيصفّر تمرير المودال (عنصر جديد = بدون ذاكرة تمرير) — نحفظه ونرجّعه حتى الشاشة تضل ثابتة
  const prevBackdrop = root.querySelector('.modal-backdrop');
  const prevScrollTop = prevBackdrop ? prevBackdrop.scrollTop : 0;
  root.innerHTML = modalHtml(draft);
  attachModalHandlers();
  updateModalTotals();
  const newBackdrop = root.querySelector('.modal-backdrop');
  if(newBackdrop) newBackdrop.scrollTop = prevScrollTop;

  return true;
}

/* إرجاع طلبية موجودة لحالة "طلب تسعير" — يفتح نفس السجل مباشرة بنافذة طلب التسعير للمراجعة/التعديل،
   بدون أي حفظ فعلي هون؛ تبقى طلبية عادية فعليًا (ما توصل عند عامر) لحد ما يضغط "حفظ و اعادة طلب"
   جوا النافذة يلي فتحت — لو سكّرها بدون حفظ، ما يصير أي تغيير. */
function confirmReturnOrderToQuote(){
  confirmAction({
    title: 'إرجاع هذه الطلبية لطلب تسعير؟',
    message: 'رح تنفتح كطلب تسعير للمراجعة — ما توصل لعامر إلا لما تضغط "حفظ و اعادة طلب" جوا.',
    confirmLabel: 'تأكيد الإرجاع',
    dangerous: true,
    onConfirm: ()=>{
      const id = draft.id;
      closeModal();
      openQuoteModal('edit', id);
      if(quoteDraft){
        // ما منحوّلها لتسعيرة بالذاكرة هون — قبل، أي ضغطة "💾 حفظ" كانت بتثبّت التحويل بصمت
        // وتطلّع الطلبية من قائمة الطلبيات، عكس نص المربع نفسه. التحويل بيصير بس عند
        // "حفظ و اعادة طلب" (saveQuoteDraft بـ markSent=true).
        quoteDraft.pendingReturnToQuote = true;
      }
    }
  });
}

/* ---------- طلبات التسعير: نسخة مصغّرة من نافذة الطلبية (بدون سعر بيع/دفعات/رسوم) —
   نفس رقم تسلسل الطلبيات (PT-)، ومخزّنة بنفس appData.orders بعلامة isQuote:true حتى
   تختفي عن قائمة "الطلبيات" وكل الحسابات المالية إلى أن تُعتمد (يومها تصير طلبية عادية
   فعليًا — نفس السجل، بدون نسخ أو رقم جديد). ---------- */
let quoteDraft = null;
let selectedQuotePartType = null;
let quoteModalRole = 'sales'; // 'sales' (المبيعات — يملأ الطلب، يعتمد، يحذف) | 'purchasing' (عامر — يسعّر فقط)
let quoteOpenedAtUpdatedAt = null; // updatedAt التسعيرة وقت فتح المودال — لفحص التعارض عند الحفظ (نفس فكرة draftOpenedAtUpdatedAt)

/* واتساب ما يوفر رابط يفتح كاميرا/جروب مع كابشن تلقائي على مرفق — أقصى شي ممكن: فتح رابط
   دعوة الجروب (يفتح الجروب مباشرة لو عامر عضو فيه أصلاً) + نسخ نص "رقم الطلبية — اسم القطعة"
   للحافظة حتى يلصقه هو كابشن يدويًا قبل ما يرسل الصورة/الفيديو. */
const WHATSAPP_OPS_GROUP_LINK = 'https://chat.whatsapp.com/GRWLhskD8kXJemXSRrFouj?s=cl&p=i&mlu=0&ilr=0';

function openWhatsAppForPart(part){
  const caption = [quoteDraft.orderNumber, quoteDraft.orderLabel, part.description].filter(Boolean).join(' — ');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(caption).catch(()=>{});
  }
  window.open(WHATSAPP_OPS_GROUP_LINK, '_blank');
  showToast('نُسخ "'+caption+'" — الصقه كابشن قبل ما ترسل الصورة/الفيديو بجروب العمليات', 'ok');
}
let quoteOriginalSnapshot = null; // حالة الطلب وقت الفتح — لمقارنتها وقت الحفظ ومعرفة هل صار تعديل فعلي أو لا

function quotesMatchingList(){
  return (appData.orders||[]).filter(o=>o.isQuote).sort((a,b)=> orderNumberSortKey(b) - orderNumberSortKey(a));
}

function quoteRowHtml(o){
  const ready = !!o.quoteReady;
  return '<div class="task-item-row quote-row'+(ready?' quote-row-ready':'')+'" data-quote-id="'+escapeHtml(o.id)+'">' +
    '<span class="quote-row-number">'+escapeHtml(o.orderNumber)+'</span>' +
    '<span class="quote-row-label">'+escapeHtml(o.orderLabel||'—')+'</span>' +
  '</div>';
}

function quotesListHtml(){
  const rows = quotesMatchingList();
  if(!rows.length) return '<div class="expense-empty-hint">ما فيه طلبات تسعير بعد</div>';
  return rows.map(quoteRowHtml).join('');
}

function renderQuotesList(){
  const el = document.getElementById('quotes-table-container');
  if(el){
    el.innerHTML = quotesListHtml();
    el.querySelectorAll('.quote-row').forEach(row=>{
      row.addEventListener('click', ()=> openQuoteModal('edit', row.getAttribute('data-quote-id')));
    });
  }
  refreshScrapyardQuotesListIfOpen();
  updateQuotesReadyBadge();
}

/* عدد طلبات التسعير يلي عامر سعّرها و أرسلها وبتستنى مراجعة/اعتماد المبيعات — العدد الصغير يلي يطلع على زر "طلبات التسعير" بالرئيسية */
function updateQuotesReadyBadge(){
  const badge = document.getElementById('quotes-ready-badge');
  if(!badge) return;
  const count = quotesMatchingList().filter(o=>o.quoteReady).length;
  badge.textContent = count>0 ? count : '';
  badge.style.display = count>0 ? 'flex' : 'none';
}

function quotePartTypeGateHtml(){
  return '<div class="part-type-gate">' +
      '<span class="part-type-gate-label">حدد نوع القطعة قبل الإضافة</span>' +
      '<div class="part-type-pills">' +
        '<button type="button" class="type-pill type-pill-new'+(selectedQuotePartType==='new'?' type-pill-active':'')+'" data-quote-part-type="new">غير مستعملة</button>' +
        '<button type="button" class="type-pill type-pill-used'+(selectedQuotePartType==='used'?' type-pill-active':'')+'" data-quote-part-type="used">مستعملة</button>' +
      '</div>' +
    '</div>' +
    '<div class="add-part-action" id="quote-add-part-action">' +
      (selectedQuotePartType
        ? '<button type="button" id="quote-add-part-btn" class="btn btn-sm '+(selectedQuotePartType==='used'?'btn-add-used-part':'btn-add-part')+'">+ إضافة قطعة '+(selectedQuotePartType==='used'?'(مستعملة)':'(غير مستعملة)')+'</button>'
        : '<span class="add-part-hint">اختر النوع فوق ليظهر زر الإضافة</span>') +

}

function bindQuotePartTypeGate(){

  if(!wrap) return;
  wrap.querySelectorAll('.type-pill').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedQuotePartType = btn.getAttribute('data-quote-part-type');
      refreshQuotePartAddControls();
    });
  });
  const addBtn = document.getElementById('quote-add-part-btn');
  if(addBtn){
    addBtn.addEventListener('click', ()=>{
      quoteDraft.parts.push({id:uid('p'), description:'', qty:1, costPrice:'', sellPrice:null, used: selectedQuotePartType==='used', supplierId: null});
      refreshQuotePartsList();
    });
  }
}

function quotePartAddControlsHtml(){
  if(!quoteDraft.parts || quoteDraft.parts.length===0){
    return quotePartTypeGateHtml();
  }
  return '<div class="add-part-btns">' +
    '<button type="button" id="quote-add-part-btn-new" class="btn btn-sm btn-add-part">+ جديد</button>' +
    '<button type="button" id="quote-add-part-btn-used" class="btn btn-sm btn-add-used-part">+ مستعمل</button>' +
    '<button type="button" id="quote-add-part-btn-either" class="btn btn-sm btn-ghost">+ جديد أو مستعمل</button>' +
  '</div>';
}

function refreshQuotePartAddControls(){
  const wrap = document.getElementById('quote-part-type-gate-wrap');
  if(!wrap) return;
  wrap.innerHTML = quotePartAddControlsHtml();
  bindQuotePartAddControls();
}

function bindQuotePartAddControls(){
  if(!quoteDraft.parts || quoteDraft.parts.length===0){
    bindQuotePartTypeGate();
    return;
  }
  const wrap = document.getElementById('quote-part-type-gate-wrap');
  if(!wrap) return;
  const newBtn = wrap.querySelector('#quote-add-part-btn-new');
  const usedBtn = wrap.querySelector('#quote-add-part-btn-used');
  const eitherBtn = wrap.querySelector('#quote-add-part-btn-either');
  if(newBtn) newBtn.addEventListener('click', ()=>{
    quoteDraft.parts.push({id:uid('p'), description:'', qty:1, costPrice:'', sellPrice:null, used:false, supplierId: null});
    refreshQuotePartsList();
  });
  if(usedBtn) usedBtn.addEventListener('click', ()=>{
    quoteDraft.parts.push({id:uid('p'), description:'', qty:1, costPrice:'', sellPrice:null, used:true, supplierId: null});
    refreshQuotePartsList();
  });
  if(eitherBtn) eitherBtn.addEventListener('click', ()=>{
    // used:null = لسه ما تحدد نوعها — عامر يحسمها (جديد/مستعمل) بشاشة التسعير عنده
    quoteDraft.parts.push({id:uid('p'), description:'', qty:1, costPrice:'', sellPrice:null, used:null, supplierId: null});
    refreshQuotePartsList();
  });
}

function quotePartRowHtml(p, i){
  const costVal = (p.costPrice===''||p.costPrice==null) ? '' : p.costPrice;
  const qtyVal = (p.qty===''||p.qty==null) ? 1 : p.qty;
  const readOnly = quoteModalRole==='purchasing';
  const ro = readOnly ? ' readonly' : '';
  const undetermined = p.used===null; // "جديد أو مستعمل" — لسه ما تحدد، عامر يحسمها

  // زر واحد يتبدّل بالضغط (نفس نمط زر المبيعات) — عامر يقدر يبدّل نوع أي قطعة بأي وقت
  const usedLabel = undetermined ? 'جديد أو مستعمل' : (p.used ? 'مستعمل' : (readOnly ? 'جديد' : 'غير مستعمل'));
  const usedBadgeHtml = '<button type="button" class="used-badge'+(p.used?'':' used-badge-off')+'" data-toggle-used="'+escapeHtml(p.id)+'">'+usedLabel+' ✏️</button>';

  // الموردين/التشاليح شغلة المشتريات (عامر) حصرًا — المبيعات ما بتشوفها أبدًا، تظهر بس بعد
  // الإرسال لعامر، وحتى عنده لازم يكون النوع محسوم الأول (جديد/مستعمل) قبل ما تظهر.
  const supplierListLabel = p.used===null ? 'المورد/التشليح' : (p.used?'التشليح':'المورد');
  const supplierPlaceholder = p.used===null ? '— بدون مورد/تشليح —' : (p.used?'— بدون تشليح —':'— بدون مورد —');
  const supplierFieldHtml = (!readOnly || undetermined) ? '' : (
    '<label class="mini-label mini-label-supplier">'+supplierListLabel+
      searchableSelectHtml('quote-part-supplier-select',
        (appData.suppliers||[]).filter(s=> p.used===null ? (s.handlesNew||s.handlesUsed) : (p.used ? s.handlesUsed : s.handlesNew)).map(s=>({id:s.id, label:s.name||s.phone||'مورد', sublabel:s.phone})),
        p.supplierId, supplierPlaceholder) +
    '</label>'
  );

  // ملاحظات المبيعات: قابلة للتعديل عند المبيعات، وللقراءة فقط عند عامر (يشوفها بس)
  // بدون بادئة "ملاحظة المبيعات:" — النص يظهر فورًا كما هو (طلب صريح، مو تسمية تلقائية)
  const salesNotesHtml = readOnly
    ? (p.notes ? '<div class="part-notes-readonly">'+escapeHtml(p.notes)+'</div>' : '')
    : '<input type="text" class="part-notes-input" placeholder="ملاحظات (اختياري)" value="'+escapeHtml(p.notes||'')+'">';

  // ملاحظات عامر: قابلة للتعديل عنده بس، وللقراءة فقط عند المبيعات (يشوفوها بعد ما يرسلها)
  // نفس الشي، بدون بادئة "ملاحظة عامر:"
  const purchasingNotesHtml = readOnly
    ? '<input type="text" class="part-purchasing-notes-input" placeholder="ملاحظاتك (اختياري)" value="'+escapeHtml(p.purchasingNotes||'')+'">'
    : (p.purchasingNotes ? '<div class="part-notes-readonly">'+escapeHtml(p.purchasingNotes)+'</div>' : '');

  return '<div class="part-row" data-part-id="'+escapeHtml(p.id)+'">' +
    '<div class="part-desc-wrap">' +
      '<div class="part-desc-row">' +
        '<span class="part-index-badge">'+((i!=null?i:0)+1)+'</span>' +
        // وصف القطعة تكتبه المبيعات — عامر بيسعّر بس، فيكون للقراءة عنده (كان يقدر يفضّيه)
        '<input type="text" class="part-desc-input" placeholder="وصف القطعة" value="'+escapeHtml(p.description)+'"'+ro+'>' +
      '</div>' +
      salesNotesHtml +
      purchasingNotesHtml +
      usedBadgeHtml +
    '</div>' +
    '<div class="part-price-group">' +
      '<label class="mini-label">العدد<input type="number" min="1" step="1" class="part-qty-input num" value="'+escapeHtml(qtyVal)+'"'+ro+'></label>' +
      '<label class="mini-label mini-label-cost">سعر الشراء<input type="number" min="0" step="0.01" class="part-cost-input num" value="'+escapeHtml(costVal)+'"></label>' +
      supplierFieldHtml +
    '</div>' +
    '<button type="button" class="btn btn-sm part-whatsapp-btn" data-whatsapp-part="'+escapeHtml(p.id)+'" aria-label="إرسال صورة القطعة بجروب العمليات">📷 صورة</button>' +
    // زر الحذف متاح لعامر (المشتريات) كمان — قطعة ما قدر يوفّرها أو غير مطلوبة بعد المراجعة
    '<button type="button" class="part-remove-btn" data-remove-quote-part="'+escapeHtml(p.id)+'" aria-label="حذف القطعة">✕</button>' +
  '</div>';
}

function bindQuotePartRowEvents(){
  const root = document.getElementById('modal-root');
  const readOnly = quoteModalRole==='purchasing';
  root.querySelectorAll('#quote-parts-list .part-row').forEach(row=>{
    const pid = row.getAttribute('data-part-id');
    const part = quoteDraft.parts.find(p=>p.id===pid);
    if(!part) return;
    const descInput = row.querySelector('.part-desc-input');
    if(descInput && !readOnly) descInput.addEventListener('input', e=>{ part.description = e.target.value; });
    const whatsappBtn = row.querySelector('[data-whatsapp-part]');
    if(whatsappBtn) whatsappBtn.addEventListener('click', ()=> openWhatsAppForPart(part));
    const toggleUsedBtn = row.querySelector('[data-toggle-used]');
    if(toggleUsedBtn){
      toggleUsedBtn.addEventListener('click', ()=>{
        part.used = part.used===null ? true : !part.used;
        // المورد/التشليح حقل مشتريات حصريًا (عامر بس بيشوفه ويختاره) — المبيعات لازم ما تلمسه.
        // كان التصفير بينفّذ للدورين، فتبديل المبيعات لتصنيف القطعة كان بيمسح اختيار عامر بصمت.
        if(readOnly) part.supplierId = null;
        refreshQuotePartsList();
      });
    }
    if(!readOnly){
      const notesInput = row.querySelector('.part-notes-input');
      if(notesInput) notesInput.addEventListener('input', e=>{ part.notes = e.target.value; });
      const qtyInput = row.querySelector('.part-qty-input');
      if(qtyInput){
        qtyInput.addEventListener('input', e=>{
          part.qty = e.target.value===''? 1 : Math.max(1, Number(e.target.value)||1);
          updateQuoteModalTotals();
        });
      }
    } else {
      const purchasingNotesInput = row.querySelector('.part-purchasing-notes-input');
      if(purchasingNotesInput) purchasingNotesInput.addEventListener('input', e=>{ part.purchasingNotes = e.target.value; });
    }
    // الحذف متاح للدورين الاثنين الآن — refreshQuotePartsList بتحدّث المجموع لحالها
    const removeBtn = row.querySelector('[data-remove-quote-part]');
    if(removeBtn){
      removeBtn.addEventListener('click', ()=>{
        quoteDraft.parts = quoteDraft.parts.filter(p=>p.id!==pid);
        refreshQuotePartsList();
      });
    }
    const costInput = row.querySelector('.part-cost-input');
    if(costInput){
      costInput.addEventListener('input', e=>{
        part.costPrice = e.target.value===''? '' : Math.max(0, Number(e.target.value)||0);
        updateQuoteModalTotals();
      });
    }
    const supplierSelectEl = row.querySelector('.quote-part-supplier-select');
    const supplierSelectWrap = supplierSelectEl ? supplierSelectEl.closest('.searchable-select') : null;
    if(supplierSelectWrap){
      bindSearchableSelect(supplierSelectWrap,
        ()=> (appData.suppliers||[]).filter(s=> part.used===null ? (s.handlesNew||s.handlesUsed) : (part.used ? s.handlesUsed : s.handlesNew)).map(s=>({id:s.id, label:s.name||s.phone||'مورد', sublabel:s.phone})),
        (id)=>{ part.supplierId = id || null; }
      );
    }
  });
}

function refreshQuotePartsList(){
  const list = document.getElementById('quote-parts-list');
  list.innerHTML = quoteDraft.parts.map(quotePartRowHtml).join('');
  bindQuotePartRowEvents();
  refreshQuotePartAddControls();
  updateQuoteModalTotals();

        '<div class="section-block section-sales">' +
          '<div class="totals-row">' +
            '<div class="total-box"><span>مجموع الشراء</span><span class="num text-rust" id="quote-total-cost-display">0 ر.س</span></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="modal-footer">' +
        '<div class="modal-footer-utility">' + footerUtilityHtml + '</div>' +
        '<span></span>' +
        '<div class="modal-footer-actions">' + footerActionsHtml + '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

/* بصمة محتوى طلب التسعير (وصف/ملاحظات المبيعات/العدد/السعر/النوع/المورد لكل قطعة + الطلبية + العميل) —
   تُقارَن وقت الحفظ بحالتها وقت الفتح لمعرفة هل المبيعات عدّل شي فعليًا (مش بس ضغط حفظ بدون تغيير) */
function quoteContentSnapshot(d){
  return JSON.stringify({
    orderLabel: (d.orderLabel||'').trim(),
    customerId: d.customerId||null,
    parts: (d.parts||[]).filter(p=>p.description && p.description.trim()).map(p=>({
      description: (p.description||'').trim(),
      notes: (p.notes||'').trim(),
      qty: (p.qty===''||p.qty==null||Number(p.qty)<=0) ? 1 : Number(p.qty),
      costPrice: p.costPrice===''? 0 : Math.max(0, Number(p.costPrice)||0),
      used: p.used===null ? null : !!p.used,
      supplierId: p.supplierId||null
    }))
  });
}

function openQuoteModal(mode, orderId, role){
  quoteModalRole = role==='purchasing' ? 'purchasing' : 'sales';
  selectedQuotePartType = null;
  if(mode==='create'){
    quoteDraft = {
      id: uid('ord'),
      orderNumber: nextOrderNumber(),
      orderLabel: '',
      parts: [],
      partsSelectionEnabled:false,
      paidToAmer:false,
      paidToSupplier:false,
      supplied:false,
      customerPhone:'',
      customerId: null,
      customerPayments:[],
      confirmed:false,
      feeEnabled:false,
      feePercent:0,
      serviceFeeEnabled:false,
      serviceFeePercent:0,
      deliveryFeeEnabled:false,
      deliveryFeeAmount:0,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      isQuote: true,
      quoteReady: false,
      isNew: true
    };
  } else {
    const found = appData.orders.find(o=>o.id===orderId);
    if(!found){ showToast('هذه الطلبية غير موجودة (يمكن انحذفت)', 'error'); return; }
    quoteDraft = JSON.parse(JSON.stringify(found));
    quoteDraft.isNew = false;
  }
  quoteOriginalSnapshot = quoteContentSnapshot(quoteDraft);
  quoteOpenedAtUpdatedAt = quoteDraft.updatedAt || null;
  const root = document.getElementById('modal-root');
  root.innerHTML = quoteModalHtml(quoteDraft);
  root.classList.add('modal-open');
  attachQuoteModalHandlers();
  updateQuoteModalTotals();
  document.addEventListener('keydown', quoteEscListener);
}

function closeQuoteModal(){
  const root = document.getElementById('modal-root');
  root.innerHTML='';
  root.classList.remove('modal-open');
  quoteDraft=null;
  document.removeEventListener('keydown', quoteEscListener);
}

function quoteEscListener(e){ if(e.key==='Escape') closeQuoteModal(); }

function attachQuoteModalHandlers(){
  const root = document.getElementById('modal-root');
  const isPurchasing = quoteModalRole==='purchasing';
  root.querySelector('[data-close-backdrop]').addEventListener('click', (e)=>{
    if(e.target.hasAttribute('data-close-backdrop')) closeQuoteModal();
  });
  root.querySelector('#quote-modal-close-btn').addEventListener('click', closeQuoteModal);
  root.querySelector('#quote-cancel-btn').addEventListener('click', closeQuoteModal);

  if(!isPurchasing){
    root.querySelector('#quote-label-input').addEventListener('input', e=>{ quoteDraft.orderLabel = e.target.value; });
    const quoteQuickAddCustomer = (prefill)=>{
      openQuickAddCustomerModal((newCustomer)=>{
        quoteDraft.customerId = newCustomer.id;
        quoteDraft.customerPhone = newCustomer.phone || '';
        const wrap = document.querySelector('#quote-customer-select .searchable-select');
        if(wrap){
          wrap.setAttribute('data-selected-id', newCustomer.id);
          const input = wrap.querySelector('.searchable-select-input');
          if(input){
            input.value = newCustomer.name || newCustomer.phone || 'عميل';
            input.classList.remove('select-empty-warn');
          }
        }
      }, prefill);
    };
    bindSearchableSelect(root.querySelector('#quote-customer-select .searchable-select'),
      ()=> (appData.customers||[]).map(c=>({id:c.id, label:c.name||c.phone||'عميل', sublabel:c.phone})),
      (id)=>{
        quoteDraft.customerId = id || null;
        const c = (appData.customers||[]).find(c=>c.id===quoteDraft.customerId);
        quoteDraft.customerPhone = c ? (c.phone||'') : '';
      },
      (typedText)=> quoteQuickAddCustomer(looksLikePhoneNumber(typedText) ? {phone: typedText} : {name: typedText})
    );
    root.querySelector('#quote-add-customer-btn').addEventListener('click', ()=> quoteQuickAddCustomer());
  }

  bindQuotePartAddControls();
  bindQuotePartRowEvents();

  if(isPurchasing){
    bindBusyButton(root.querySelector('#quote-save-btn'), onSaveQuotePricing);
    bindBusyButton(root.querySelector('#quote-save-send-btn'), onSaveAndSendQuotePricing);
    const addScrapyardBtn = root.querySelector('#quote-add-scrapyard-btn');
    if(addScrapyardBtn){
      addScrapyardBtn.addEventListener('click', ()=>{
        openQuickAddScrapyardSupplierModal((newSupplier)=>{
          if(!Array.isArray(appData.suppliers)) appData.suppliers = [];
          appData.suppliers.push({
            id: newSupplier.id, name: newSupplier.name, phone: newSupplier.phone,
            extraPhones: [], handlesNew: false, handlesUsed: true, createdAt: new Date().toISOString()
          });
        });
      });
    }
    return;
  }

  bindBusyButton(root.querySelector('#quote-save-btn'), onSaveQuote);
  bindBusyButton(root.querySelector('#quote-send-btn'), onSendQuote);
  bindBusyButton(root.querySelector('#quote-approve-btn'), onApproveQuote);

  const deleteBtn = root.querySelector('#quote-delete-btn');
  if(deleteBtn){
    deleteBtn.addEventListener('click', ()=>{
      // نفس الفحص الموجود على حذف الطلبية بنافذة الطلبية — كان ناقص هون، فغير المخوّل كان
      // يشوف "تم الحذف" والقاعدة رافضة الحذف بصمت (والصف يرجع يظهر مع أول تحديث).
      if(!hasElevatedAccess()){
        showToast('غير متاح', 'error');
        return;
      }
      const id = quoteDraft.id;
      const number = quoteDraft.orderNumber;
      // لو النافذة انفتحت عن طريق "إرجاع للتسعير"، فهاي طلبية حقيقية بدفعاتها — لازم
      // المربع يقول هيك بدل "طلب تسعير"، حتى ما يحذف المستخدم طلبية وهو مفكرها مجرد تسعيرة.
      const live = appData.orders.find(o=>o.id===id);
      const hasPayments = !!(live && (live.customerPayments||[]).length);
      confirmAction({
        title: hasPayments ? ('حذف الطلبية '+number+' نهائيًا؟') : 'حذف طلب التسعير هذا؟',
        message: hasPayments
          ? '⚠️ هذه طلبية حقيقية رجعت للتسعير، وعليها دفعات مسجّلة للزبون — الحذف بيمسحها هي ودفعاتها نهائيًا.'
          : 'هذا الإجراء نهائي ولا يمكن التراجع عنه.',
        confirmLabel: 'تأكيد الحذف',
        dangerous: true,
        onConfirm: async ()=>{
          const deleted = await deleteOrder(id);
          if(!deleted) return; // deleteOrder عرضت سبب الفشل — لا تقفل ولا تشيلها من القائمة
          closeQuoteModal();
          appData.orders = appData.orders.filter(o=>o.id!==id);
          renderQuotesList();
          renderKPIs();
          renderTable();
          showToast('تم الحذف', 'ok');
        }
      });
    });
  }
}

/* مهم: زر "إرجاع للتسعير" بيمرّر طلبيات حقيقية (مسعّرة، مدفوعة، فيها مرتجعات) من خلال هالنافذة،
   فأي حقل ما بننسخه هون بينمسح نهائيًا من الطلبية. لهيك بنبني القطعة بـ Object.assign فوق القطعة
   الأصلية (تحافظ على أي حقل حالي أو مستقبلي تلقائيًا) وبنطبّع الحقول يلي بتتعدّل بهالنافذة بس —
   بدل قائمة حقول ثابتة كانت بتمسح returned/returnHasReceivable/returnCollected/customerRefundConfirmed
   وبتصفّر sellPrice وبترجّع included لـ true. */
function cleanedQuoteParts(){
  return quoteDraft.parts
    .filter(p=>p.description && p.description.trim())
    .map(p=>Object.assign({}, p, {
      id:p.id,
      description:p.description.trim(),
      notes: (p.notes||'').trim(),
      purchasingNotes: (p.purchasingNotes||'').trim(),
      qty: (p.qty===''||p.qty==null||Number(p.qty)<=0) ? 1 : Math.max(1, Number(p.qty)),
      costPrice: p.costPrice===''? 0 : Math.max(0, Number(p.costPrice)||0),
      sellPrice: (p.sellPrice===''||p.sellPrice===null||p.sellPrice===undefined)? null : Math.max(0, Number(p.sellPrice)||0),
      used: p.used===null ? null : !!p.used,
      included: p.included!==false,
      supplierId: p.supplierId || null
    }));
}

/* حفظ (بدون إرسال) وحفظ و إرسال يشتركان بنفس منطق التحقق والحفظ — يختلفان فقط إذا صار تعديل
   فعلي (مقارنة ببصمة وقت الفتح) وقت "حفظ و إرسال" فقط: عندها ترجع الطلبية معلّقة (صفراء) عند عامر. */
/* فحص تعارض: هل حد غيّر هالتسعيرة بقاعدة البيانات بعد ما فتحنا هالنافذة (مثلاً عامر حفظ تسعيره
   بمنتصف تعديل المبيعات لنفس التسعيرة، أو العكس)؟ لو نكمل نحفظ نسخة quoteDraft القديمة، بنلغي
   هداك التعديل بصمت — نفس فكرة الفحص الموجود بـ onSaveOrder لكن لنافذة التسعير. */
async function checkQuoteSaveConflict(){
  if(quoteDraft.isNew) return true;
  const liveOrder = appData.orders.find(o=>o.id===quoteDraft.id);

  // اختفت من appData كليًا = المبيعات اعتمدتها (صارت طلبية) أو حذفتها. هاي مش "ما في تعارض" —
  // هاي أقوى تعارض ممكن: الحفظ رح يحاول يحدّث صف مش موجود، أو يرجّع تسعيرة معتمدة لحالتها القديمة.
  if(!liveOrder){
    showToast('هذه التسعيرة ما عادت موجودة — يمكن انعتمدت أو انحذفت من مكان تاني. أغلقنا النافذة، افتح آخر نسخة من القائمة', 'error');
    closeQuoteModal();
    return false;
  }
  if(!quoteOpenedAtUpdatedAt || !liveOrder.updatedAt || liveOrder.updatedAt===quoteOpenedAtUpdatedAt) return true;

  // مربع التحذير بينفتح فوق نافذة التسعير — لازم نوقف مستمع Esc تبع النافذة طول ما هو مفتوح،
  // غير هيك ضغطة Esc بتقفل نافذة التسعير وتصفّر quoteDraft والوعد لسه معلّق (انهيار عند الإكمال).
  document.removeEventListener('keydown', quoteEscListener);
  const proceed = await new Promise(resolve=>{
    confirmAction({
      title: 'التسعيرة اتغيّرت من مكان تاني',
      message: 'صار عليها تحديث (ممكن حفظ من عامر أو من المبيعات) بعد ما فتحت هالنافذة. لو كملت وحفظت، بيضيع هداك التحديث. الأفضل تسكّر وتفتحها من جديد لتشوف آخر نسخة.',
      // الزر الرئيسي (وأي إلغاء: ضغطة برّا المربع، أو زر الإلغاء) لازم يكون الخيار الآمن —
      // قبل كان الضغط برّا المربع بيكمّل الحفظ ويكتب فوق تعديل الطرف التاني، عكس المقصود تمامًا.
      confirmLabel: 'كمّل واحفظ نسختي (بيلغي تعديلهم)',
      cancelLabel: 'سكّر بدون حفظ',
      dangerous: true,
      onConfirm: ()=> resolve(true),
      onCancel: ()=> resolve(false)
    });
  });
  if(!proceed){
    closeQuoteModal();
    return false;
  }
  document.addEventListener('keydown', quoteEscListener); // النافذة ضلت مفتوحة — رجّع المستمع
  return true;
}

/* بعد أي await، النافذة ممكن تكون انقفلت (زر ✕ / Esc / ضغطة برّا) وquoteDraft صار null —
   أي كود بيكمّل بعدها بينهار. كل دالة حفظ بتفحص هذا قبل ما تكمّل. */
function quoteModalStillOpen(draftId){
  return !!quoteDraft && quoteDraft.id === draftId;
}

async function saveQuoteDraft(markSent){
  if(!(await checkQuoteSaveConflict())) return false;
  const dup = appData.orders.find(o=>o.orderNumber.trim()===quoteDraft.orderNumber.trim() && o.id!==quoteDraft.id);
  if(dup){ showToast('رقم التسعيرة تضارب مع طلبية أخرى، أعد فتح النافذة', 'error'); return false; }
  const cleanedParts = cleanedQuoteParts();
  if(cleanedParts.length===0){ showToast('لازم تضيف وصف لقطعة وحدة على الأقل', 'error'); return false; }

  quoteDraft.parts = cleanedParts;
  quoteDraft.orderLabel = (quoteDraft.orderLabel||'').trim();
  quoteDraft.updatedAt = new Date().toISOString();
  // "حفظ و اعادة طلب" دايمًا يرجّعها لعامر (تصفرّ/تصير "بانتظار التسعير") حتى لو المبيعات ما
  // غيّرت أي شي فعليًا — الضغطة نفسها هي طلب إعادة نظر صريح، مو مشروطة بوجود تعديل حقيقي
  if(markSent){
    quoteDraft.quoteReady = false;
  }
  // "إرجاع للتسعير" ما بيثبّت التحويل إلا مع "حفظ و اعادة طلب" — انظر confirmReturnOrderToQuote
  const wasPendingReturn = !!quoteDraft.pendingReturnToQuote;
  if(markSent && wasPendingReturn){
    quoteDraft.isQuote = true;
    quoteDraft.quoteReady = false;
  }
  delete quoteDraft.pendingReturnToQuote;
  const quoteWasNew = !!quoteDraft.isNew;
  const draftId = quoteDraft.id;
  const savingDraft = quoteDraft;

  // ما منمسح isNew ولا منقدّم خط أساس التعارض ولا منلمس appData إلا بعد نجاح فعلي بالقاعدة
  const saved = await persistOrder(quoteDraft, quoteWasNew);
  if(!saved){
    // رجّع حالة "بانتظار الإرجاع" حتى إعادة المحاولة تشتغل صح
    if(wasPendingReturn){ savingDraft.pendingReturnToQuote = true; savingDraft.isQuote = false; }
    return false;
  }
  if(markSent){
    // إشعار "تحتاج تسعير" صار يُدرَج هون صراحة، مش من ترصّد انتقال حالة تلقائي — طالما الزر
    // اسمه "حفظ و اعادة طلب"، الضغطة نفسها لازم توصل إشعار لعامر حتى لو الطلبية أصلًا كانت
    // "بانتظار تسعير" ومافي أي تعديل فعلي (تذكير صريح)، مو بس أول مرة تدخل هالحالة.
    const orderRef = '#'+savingDraft.orderNumber+(savingDraft.orderLabel?' — '+savingDraft.orderLabel:'');
    try{
      await sb.from('activity_events').insert({
        kind: 'order_needs_pricing',
        order_id: savingDraft.id,
        order_ref: orderRef,
        actor_email: presenceEmail,
        audience_role: 'scrapyard',
        message: 'طلبية جديدة تحتاج تسعير: ' + orderRef
      });
    }catch(e){ console.error('logOrderNeedsPricing:', e); }
  }

  if(!quoteModalStillOpen(draftId)) return true; // انحفظت، بس المستخدم سكّر النافذة أثناء الحفظ

  delete quoteDraft.isNew;
  quoteOpenedAtUpdatedAt = quoteDraft.updatedAt;

  const idx = appData.orders.findIndex(o=>o.id===quoteDraft.id);
  if(idx>=0) appData.orders[idx]=quoteDraft; else appData.orders.push(quoteDraft);
  quoteOriginalSnapshot = quoteContentSnapshot(quoteDraft);

  const root = document.getElementById('modal-root');
  const prevBackdrop = root.querySelector('.modal-backdrop');
  const prevScrollTop = prevBackdrop ? prevBackdrop.scrollTop : 0;
  root.innerHTML = quoteModalHtml(quoteDraft);
  attachQuoteModalHandlers();
  updateQuoteModalTotals();
  const newBackdrop = root.querySelector('.modal-backdrop');
  if(newBackdrop) newBackdrop.scrollTop = prevScrollTop;

  renderQuotesList();
  showToast(markSent ? 'تم الحفظ والإرسال' : 'تم الحفظ', 'ok');
  return true;
}

async function onSaveQuote(){ return saveQuoteDraft(false); }
async function onSendQuote(){ return saveQuoteDraft(true); }

async function onApproveQuote(){
  if(!(await checkQuoteSaveConflict())) return;
  const dup = appData.orders.find(o=>o.orderNumber.trim()===quoteDraft.orderNumber.trim() && o.id!==quoteDraft.id);
  if(dup){ showToast('رقم التسعيرة تضارب مع طلبية أخرى، أعد فتح النافذة', 'error'); return; }
  const cleanedParts = cleanedQuoteParts();
  if(cleanedParts.length===0){ showToast('لازم تضيف وصف لقطعة وحدة على الأقل', 'error'); return; }
  if(cleanedParts.some(p=>p.used===null)){ showToast('في قطعة لسه ما تحدد نوعها (جديد/مستعمل) — لازم تُحسم قبل الاعتماد', 'error'); return; }

  quoteDraft.parts = cleanedParts;
  quoteDraft.orderLabel = (quoteDraft.orderLabel||'').trim();
  quoteDraft.updatedAt = new Date().toISOString();
  quoteDraft.isQuote = false;
  const quoteWasNew = !!quoteDraft.isNew;

  const approvedId = quoteDraft.id;
  const approvedNumber = quoteDraft.orderNumber;
  const approvedDraft = quoteDraft;

  const saved = await persistOrder(quoteDraft, quoteWasNew);
  if(!saved){
    approvedDraft.isQuote = true; // رجّعها لحالتها بالذاكرة — الاعتماد ما صار فعليًا بالقاعدة
    return;
  }

  delete approvedDraft.isNew;
  quoteOpenedAtUpdatedAt = approvedDraft.updatedAt;

  const idx = appData.orders.findIndex(o=>o.id===approvedId);
  if(idx>=0) appData.orders[idx]=approvedDraft; else appData.orders.push(approvedDraft);

  renderKPIs();
  renderTable();
  renderQuotesList();
  showToast('تم اعتماد طلب التسعير — صار طلبية '+approvedNumber, 'ok');

  // النافذة انسكّرت أو تحوّلت لتسعيرة تانية أثناء الحفظ — الاعتماد نجح وانعكس فوق، بس فتح/إغلاق
  // مودالات هلق ممكن يمسح نافذة تانية فتحها المستخدم بالمنتصف (نفس درس saveQuoteDraft/
  // onSaveQuotePricing)
  if(!quoteModalStillOpen(approvedId)) return;

  closeQuoteModal();
  openModal('edit', approvedId);
}

/* حفظ عامر بيمرّ عبر RPC مخصص بدل persistOrder: هو بيستقبل التسعيرة منقّاة (بدون سعر بيع،
   دفعات، رسوم، أو بيانات زبون) عشان ما تتسرّبله، فلو حفظ الصف كامل رح يكتب الفراغات فوق
   الأصل ويمسح شغل المبيعات. الـRPC بتحفظ حقول المشتريات بس وبتقرأ الباقي من الصف نفسه. */
async function persistScrapyardQuotePricing(order, quoteReady){
  try{
    if(!sb) throw new Error('NO_DB');
    const { data, error } = await sb.rpc('scrapyard_save_quote_pricing', {
      p_order_id: order.id,
      p_parts: (order.parts||[]).map(p=>({
        id: p.id, description: p.description||'', qty: Math.max(1, Number(p.qty)||1),
        costPrice: Math.max(0, Number(p.costPrice)||0),
        supplierId: p.supplierId || null,
        purchasingNotes: p.purchasingNotes || '',
        used: p.used===null ? null : !!p.used
      })),
      p_quote_ready: !!quoteReady
    });
    if(error) throw error;
    if(data === false){
      showToast('تعذر الحفظ — التسعيرة ما عادت موجودة، أغلق النافذة وافتحها من جديد', 'error');
      return false;
    }
    return true;
  }catch(e){
    showToast('تعذر حفظ التسعيرة: ' + (e && e.message ? e.message : ''), 'error');
    return false;
  }
}

/* عامر بس بيسعّر — "حفظ" يحفظ التقدّم بدون ما يعلّمها جاهزة (تبقى صفراء)،
   و"حفظ و إرسال" يعلّمها جاهزة (quoteReady) فترجع خضراء عند المبيعات لمراجعتها/اعتمادها. */
async function onSaveQuotePricing(){
  if(!(await checkQuoteSaveConflict())) return;
  const cleanedParts = cleanedQuoteParts();
  if(cleanedParts.length===0){ showToast('لازم تضيف وصف لقطعة وحدة على الأقل', 'error'); return; }

  quoteDraft.parts = cleanedParts;
  quoteDraft.updatedAt = new Date().toISOString();
  const draftId = quoteDraft.id;

  const saved = await persistScrapyardQuotePricing(quoteDraft, !!quoteDraft.quoteReady);
  if(!saved) return;
  if(!quoteModalStillOpen(draftId)) return;

  quoteOpenedAtUpdatedAt = quoteDraft.updatedAt;
  const idx = appData.orders.findIndex(o=>o.id===quoteDraft.id);
  if(idx>=0) appData.orders[idx]=quoteDraft;

  const root = document.getElementById('modal-root');
  const prevBackdrop = root.querySelector('.modal-backdrop');
  const prevScrollTop = prevBackdrop ? prevBackdrop.scrollTop : 0;
  root.innerHTML = quoteModalHtml(quoteDraft);
  attachQuoteModalHandlers();
  updateQuoteModalTotals();
  const newBackdrop = root.querySelector('.modal-backdrop');
  if(newBackdrop) newBackdrop.scrollTop = prevScrollTop;

  renderQuotesList();
  showToast('تم الحفظ', 'ok');
}

async function onSaveAndSendQuotePricing(){
  if(!(await checkQuoteSaveConflict())) return;
  const cleanedParts = cleanedQuoteParts();
  if(cleanedParts.length===0){ showToast('لازم تضيف وصف لقطعة وحدة على الأقل', 'error'); return; }

  quoteDraft.parts = cleanedParts;
  quoteDraft.updatedAt = new Date().toISOString();
  quoteDraft.quoteReady = true;
  const draftId = quoteDraft.id;
  const sentDraft = quoteDraft;

  const saved = await persistScrapyardQuotePricing(quoteDraft, true);
  if(!saved){
    sentDraft.quoteReady = false; // ما انبعتت فعليًا — لا تخليها تبان جاهزة بالذاكرة
    return;
  }

  quoteOpenedAtUpdatedAt = sentDraft.updatedAt;
  const idx = appData.orders.findIndex(o=>o.id===draftId);
  if(idx>=0) appData.orders[idx]=sentDraft;

  renderQuotesList();
  showToast('تم الحفظ والإرسال', 'ok');

  if(!quoteModalStillOpen(draftId)) return; // نفس درس onApproveQuote — ما نلمس نافذة تانية فُتحت بالمنتصف
  closeQuoteModal();
}

/* ---------- contact customer: call or WhatsApp, from either the orders list or inside the order modal ---------- */
function normalizePhoneForWhatsapp(phone){
  let p = (phone||'').replace(/[^\d+]/g,'');
  if(p.startsWith('+')) p = p.slice(1);
  if(p.startsWith('0')) p = '966' + p.slice(1);
  else if(!p.startsWith('966')) p = '966' + p;
  return p;
}

/* يمنع تكرار العميل (نفس الاسم أو نفس رقم الجوال بعد توحيد صيغته) قبل إضافته —
   يتجاهل حقول فاضية حتى ما يتصادم عملاء بدون اسم/رقم مع بعض. */
function findDuplicateCustomer(name, phone){
  const n = (name||'').trim().toLowerCase();
  const p = (phone||'').trim() ? normalizePhoneForWhatsapp(phone) : '';
  return (appData.customers||[]).find(c=>{
    if(n && (c.name||'').trim().toLowerCase()===n) return true;
    if(p && (c.phone||'').trim() && normalizePhoneForWhatsapp(c.phone)===p) return true;
    return false;
  });
}

function findDuplicateSupplier(name, phone){
  const n = (name||'').trim().toLowerCase();
  const p = (phone||'').trim() ? normalizePhoneForWhatsapp(phone) : '';
  return (appData.suppliers||[]).find(s=>{
    if(n && (s.name||'').trim().toLowerCase()===n) return true;
    if(p && (s.phone||'').trim() && normalizePhoneForWhatsapp(s.phone)===p) return true;
    return false;
  });
}

/* ---------- unified confirmation dialog — used everywhere a destructive/consequential action needs a yes/no ----------
   uses its own #confirm-root (separate from #modal-root) so it can appear on top of an already-open modal
   (e.g. confirming a part/payment deletion or a paid-status toggle while the order-edit modal is open) without
   destroying that modal's DOM/state. */
function confirmAction(opts){
  opts = opts || {};
  const root = document.getElementById('confirm-root');
  root.innerHTML =
    '<div class="modal-backdrop" data-close-confirm>' +
      '<div class="modal-card modal-card-sm" role="alertdialog" aria-modal="true">' +
        '<div class="modal-title">'+escapeHtml(opts.title||'')+'</div>' +
        (opts.message ? '<p class="modal-sub">'+escapeHtml(opts.message)+'</p>' : '') +
        '<div class="modal-footer-actions" style="margin-top:16px;justify-content:flex-end;">' +
          '<button type="button" class="btn btn-ghost" id="confirm-action-cancel-btn">'+escapeHtml(opts.cancelLabel||'إلغاء')+'</button>' +
          '<button type="button" class="btn '+(opts.dangerous?'btn-danger':'btn-primary')+'" id="confirm-action-ok-btn">'+escapeHtml(opts.confirmLabel||'تأكيد')+'</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  root.classList.add('modal-open');
  const close = ()=>{ root.innerHTML=''; root.classList.remove('modal-open'); };
  root.querySelector('[data-close-confirm]').addEventListener('click', e=>{
    if(e.target.hasAttribute('data-close-confirm')){ close(); if(opts.onCancel) opts.onCancel(); }
  });
  root.querySelector('#confirm-action-cancel-btn').addEventListener('click', ()=>{ close(); if(opts.onCancel) opts.onCancel(); });
  root.querySelector('#confirm-action-ok-btn').addEventListener('click', ()=>{ close(); if(opts.onConfirm) opts.onConfirm(); });
}

/* ---------- confirm / unconfirm order (two-step) ---------- */
function confirmToggleConfirmation(orderId){
  const order = appData.orders.find(o=>o.id===orderId);
  if(!order) return;
  const willConfirm = !order.confirmed;
  const willResetSupply = !willConfirm && order.supplied;
  confirmAction({
    title: willConfirm ? 'تأكيد الطلبية '+order.orderNumber+'؟' : 'إلغاء تأكيد الطلبية '+order.orderNumber+'؟',
    message: willConfirm
      ? 'بعد التأكيد، أرقام هذه الطلبية بتدخل ضمن مجموع الطلبيات المؤكدة بمؤشرات الأعلى.'
      : 'بعد الإلغاء، أرقام هذه الطلبية بتُستثنى من مجموع الطلبيات المؤكدة بمؤشرات الأعلى.'
        + (willResetSupply ? ' وبيتلغى معها تحديد "تم التوريد"، فبتختفي من شاشة السداد.' : ''),
    cancelLabel: 'تراجع',
    confirmLabel: willConfirm ? 'تأكيد الطلبية' : 'إلغاء التأكيد',
    onConfirm: async ()=>{
      // إعادة الجلب هون (مو الاعتماد على order يلي جُلبت قبل فتح نافذة التأكيد) — لو وصل تعديل
      // لحظي من مستخدم تاني أثناء انتظار ضغطة المستخدم، appData.orders[idx] بيصير عنصر جديد
      // كليًا (applyRemoteOrderChange)، والمرجع القديم يضل معزول عنه، وحفظه بيرجّع تعديل التاني.
      const order = appData.orders.find(o=>o.id===orderId);
      if(!order) return;
      const prev = { confirmed: order.confirmed, supplied: order.supplied, suppliedAt: order.suppliedAt, updatedAt: order.updatedAt };
      order.confirmed = willConfirm;
      if(willResetSupply){
        order.supplied = false;
        order.suppliedAt = null;
      }
      order.updatedAt = new Date().toISOString();
      const saved = await persistOrder(order);
      if(!saved){ Object.assign(order, prev); renderTable(); return; } // رجّع الحالة بالذاكرة لتطابق القاعدة
      renderKPIs();
      renderTable();
      showToast(willConfirm ? 'تم تأكيد الطلبية' : 'تم إلغاء تأكيد الطلبية', 'ok');
    }
  });
}

function refreshArchiveViewIfOpen(){
  const view = document.getElementById('archive-view');
  if(view && view.style.display !== 'none'){ refreshArchiveList(); }
}

function archiveOrder(orderId){
  const order = appData.orders.find(o=>o.id===orderId);
  if(!order) return;
  confirmAction({
    title: 'أرشفة الطلبية '+order.orderNumber+'؟',
    message: 'بتختفي من قائمة الطلبيات العادية، وتقدر ترجّعها في أي وقت من "🗄️ الأرشيف".',
    confirmLabel: 'أرشفة',
    onConfirm: async ()=>{
      const order = appData.orders.find(o=>o.id===orderId); // إعادة جلب — انظر ملاحظة confirmToggleConfirmation
      if(!order) return;
      const prevUpdatedAt = order.updatedAt;
      order.archived = true;
      order.updatedAt = new Date().toISOString();
      const saved = await persistOrder(order);
      if(!saved){ order.archived = false; order.updatedAt = prevUpdatedAt; return; }
      renderTable();
      refreshArchiveViewIfOpen();
      updateArchivePendingBadge();
      showToast('تم أرشفة الطلبية', 'ok');
    }
  });
}

async function restoreOrder(orderId){
  const order = appData.orders.find(o=>o.id===orderId);
  if(!order) return;
  const prevUpdatedAt = order.updatedAt;
  order.archived = false;
  order.updatedAt = new Date().toISOString();

  if(!saved){ order.archived = true; order.updatedAt = prevUpdatedAt; return; }

function openUnsuccessfulReasonPicker(orderId){
  const root = document.getElementById('confirm-root');
  let selectedReason = null;

          '</div>' +
          (selectedReason ? (
            '<label class="field" style="margin-top:12px;"><span class="field-label">تفاصيل إضافية (اختياري)</span>' +
              '<input type="text" id="unsuccessful-reason-details-input" value="'+escapeHtml(order.unsuccessfulReason===selectedReason ? (order.unsuccessfulReasonDetails||'') : '')+'" placeholder="اكتب التفاصيل...">' +
            '</label>'
          ) : '') +
          '<div class="modal-footer-actions" style="margin-top:16px;justify-content:flex-end;flex-wrap:wrap;">' +
            (order.unsuccessfulReason ? '<button type="button" class="btn btn-ghost" id="unsuccessful-reason-clear-btn">مسح السبب</button>' : '') +
            '<button type="button" class="btn btn-ghost" id="unsuccessful-reason-cancel-btn">إلغاء</button>' +
            '<button type="button" class="btn btn-primary" id="unsuccessful-reason-save-btn"'+(selectedReason?'':' disabled')+'>حفظ</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    root.classList.add('modal-open');
    const close = ()=>{ root.innerHTML=''; root.classList.remove('modal-open'); };
    root.querySelector('[data-close-confirm]').addEventListener('click', e=>{
      if(e.target.hasAttribute('data-close-confirm')) close();
    });
    root.querySelector('#unsuccessful-reason-cancel-btn').addEventListener('click', close);
    root.querySelectorAll('[data-reason]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ selectedReason = btn.getAttribute('data-reason'); render(); });
    });
    const clearBtn = root.querySelector('#unsuccessful-reason-clear-btn');
    if(clearBtn){
      clearBtn.addEventListener('click', async ()=>{
        const prevReason = order.unsuccessfulReason, prevDetails = order.unsuccessfulReasonDetails, prevUpdatedAt = order.updatedAt;
        order.unsuccessfulReason = null;
        order.unsuccessfulReasonDetails = '';
        order.updatedAt = new Date().toISOString();
        const saved = await persistOrder(order);
        if(!saved){
          order.unsuccessfulReason = prevReason; order.unsuccessfulReasonDetails = prevDetails; order.updatedAt = prevUpdatedAt;
          selectedReason = null; render(); // نرجّع عرض المودال يطابق الحالة الفعلية (المرتجعة) بدل ما يبقى واقف على اختيار ما انحفظ
          return;
        }
        close();
        renderTable();
        refreshArchiveViewIfOpen();
        showToast('تم مسح السبب', 'ok');
      });
    }
    const saveBtn = root.querySelector('#unsuccessful-reason-save-btn');
    if(saveBtn){
      saveBtn.addEventListener('click', async ()=>{
        if(!selectedReason) return;
        const detailsInput = document.getElementById('unsuccessful-reason-details-input');
        const prevReason = order.unsuccessfulReason, prevDetails = order.unsuccessfulReasonDetails, prevUpdatedAt = order.updatedAt;
        order.unsuccessfulReason = selectedReason;
        order.unsuccessfulReasonDetails = detailsInput ? detailsInput.value.trim() : '';
        order.updatedAt = new Date().toISOString();
        const saved = await persistOrder(order);
        if(!saved){
          order.unsuccessfulReason = prevReason; order.unsuccessfulReasonDetails = prevDetails; order.updatedAt = prevUpdatedAt;
          selectedReason = null; render(); // نفس الفكرة — نرجّع عرض المودال يطابق الحالة الفعلية المرتجعة
          return;
        }
        close();
        renderTable();
        refreshArchiveViewIfOpen();
        showToast('تم حفظ السبب', 'ok');
      });
    }
  }

  render();
}

/* ---------- invoice / quote documents ---------- */
function todayNumeric(){
  const d = new Date();
  const day = String(d.getDate()).padStart(2,'0');
  const month = String(d.getMonth()+1).padStart(2,'0');
  return day+'/'+month+'/'+d.getFullYear();
}

function fmtDateShort(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  const day = String(d.getDate()).padStart(2,'0');
  const month = String(d.getMonth()+1).padStart(2,'0');
  return day+'/'+month+'/'+d.getFullYear();
}

function fmtNum(n){
  const v = Number(n)||0;
  return v.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
}
function round2(n){
  return Math.round((Number(n)||0)*100)/100;
}

let docState = null; // {orderId, type, data}

function partsTableRowsHtml(order){
  return orderActiveParts(order).filter(p=>!p.returned).map(p=>{
    const qty = Number(p.qty)||1;
    const unit = Number(p.sellPrice)||0;
    return '<tr>' +
      '<td>'+escapeHtml(partDisplayName(p))+'</td>' +
      '<td style="text-align:center;" class="num">'+qty+'</td>' +
      '<td style="text-align:center;" class="num">'+fmtNum(unit)+'</td>' +
      '<td style="text-align:center;" class="num">'+fmtNum(qty*unit)+'</td>' +
    '</tr>';
  }).join('');
}

function defaultFooterNoteFor(type){
  return type==='invoice'
    ? 'لا يتم إرجاع البضاعة المباعة إلا مع وجود الفاتورة الأصلية\nيجب إبراز الفاتورة الأصل عند المراجعة'
    : 'عرض السعر هذا صالح لمدة يومين فقط من تاريخه';
}

function footerNoteLinesHtml(text){
  return (text||'').split('\n').map(line=>'<div>'+escapeHtml(line)+'</div>').join('');
}

  const titleAr = isInvoice ? 'فاتورة نقدية' : 'عرض أسعار';

      '<div class="doc-toolbar no-print">' +

        '<div class="doc-toolbar-actions">' +

          '<button type="button" class="btn btn-ghost btn-sm" id="doc-save-btn">حفظ البيانات</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" id="doc-copy-btn">نسخ نص للواتساب</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" id="doc-share-btn">📤 مشاركة</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" id="doc-pdf-btn">📄 تحميل PDF</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" id="doc-history-btn">📜 السجل</button>' +
          '<button type="button" class="btn btn-primary btn-sm" id="doc-print-btn">طباعة</button>' +
        '</div>' +
      '</div>' +
      '<div class="doc-sheet" id="doc-sheet">' +
        '<div class="doc-header-band">' +
          '<div class="doc-brand-col">' +
            '<img class="doc-logo-img" src="'+PARTECH_LOGO_DATA_URI+'" alt="PARTECH">' +
            '<div class="doc-co-info">س.ت: 1009069725 &nbsp;·&nbsp; ج: 0581206709</div>' +
          '</div>' +
          '<div class="doc-identity-col">' +
            '<div class="doc-type-badge">'+titleAr+'</div>' +
            '<div class="doc-type-badge-en">'+titleEn+'</div>' +
            '<div class="doc-identity-row"><span class="doc-identity-label">رقم المستند</span><input type="text" id="doc-number-input" class="doc-identity-input" value="'+escapeHtml(data.number)+'" readonly></div>' +
            '<div class="doc-identity-row"><span class="doc-identity-label">التاريخ</span><input type="text" id="doc-date-input" class="doc-identity-input" value="'+escapeHtml(data.date)+'"></div>' +
          '</div>' +
        '</div>' +
        '<div class="doc-billto">' +
          '<span class="doc-billto-label">العميل</span>' +

          '<div class="doc-billto-extra">' +
            '<div class="doc-meta-field field-car"><span>السيارة</span><input type="text" id="doc-car-input" value="'+escapeHtml(data.carModel)+'" placeholder="موديل السيارة"></div>' +
            '<div class="doc-meta-field field-vin"><span>رقم الهيكل VIN</span><input type="text" id="doc-vin-input" value="'+escapeHtml(data.vin)+'" placeholder="رقم الهيكل"></div>' +

function openDocumentView(orderId, type){
  const order = appData.orders.find(o=>o.id===orderId);
  if(!order) return;
  const t = orderTotals(order);
  if(order.parts.length===0 || !t.fullyPriced){
    showToast('لازم تسعّر كل القطع قبل إصدار '+(type==='invoice'?'الفاتورة':'عرض السعر'), 'error');
    return;
  }
  const field = type==='invoice' ? 'invoiceDoc' : 'quoteDoc';
  const existing = order[field];
  const data = Object.assign(
    { number: order.orderNumber, date: todayNumeric(), customerName:'', carModel:'', vin:'', customerCR:'', footerNote: defaultFooterNoteFor(type), showVat: false },
    existing || {}
  );
  docState = { orderId, type, data };
  const root = document.getElementById('doc-root');
  root.innerHTML = docSheetHtml(order, type, data);
  root.classList.add('doc-open');
  bindDocHandlers();
  document.addEventListener('keydown', docEscListener);
  // الطباعة من قائمة المتصفح (Ctrl+P) ما بتمر على أزرارنا، فالحقول الفاضية كانت تطبع بإطاراتها
  window.addEventListener('beforeprint', markEmptyDocFields);
}

function refreshDocSheet(){
  if(!docState) return;
  const order = appData.orders.find(o=>o.id===docState.orderId);
  if(!order) return;
  const root = document.getElementById('doc-root');
  root.innerHTML = docSheetHtml(order, docState.type, docState.data);
  bindDocHandlers();
}

/* نسخ محفوظة سابقًا من نفس نوع المستند (فاتورة أو عرض سعر) لهاي الطلبية — تنضاف عند تحميل PDF/
   طباعة/مشاركة/نسخ فقط، انظر persistDocMeta */
function docHistoryList(){
  if(!docState) return [];
  const order = appData.orders.find(o=>o.id===docState.orderId);
  if(!order) return [];
  const historyField = docState.type==='invoice' ? 'invoiceDocHistory' : 'quoteDocHistory';
  return Array.isArray(order[historyField]) ? order[historyField] : [];
}

function openDocHistory(){
  if(!docState) return;
  const list = docHistoryList().slice().reverse(); // الأحدث أولًا
  const root = document.getElementById('confirm-root');
  root.innerHTML =
    '<div class="modal-backdrop" data-close-confirm>' +
      '<div class="modal-card modal-card-sm" role="dialog" aria-modal="true">' +
        '<div class="modal-title">📜 سجل '+(docState.type==='invoice'?'الفواتير':'عروض الأسعار')+' السابقة</div>' +
        '<div style="margin-top:14px;max-height:60vh;overflow-y:auto;">' +
          (list.length
            ? '<div class="task-items-list">'+list.map(entry=>{
                const ms = new Date(entry._savedAt).getTime();
                return '<div class="task-item-row doc-history-row" data-history-id="'+escapeHtml(entry._historyId)+'">' +
                  '<span class="task-item-text">رقم '+escapeHtml(entry.number||'')+(entry.customerName?' — '+escapeHtml(entry.customerName):'')+'</span>' +
                  '<span class="muted" style="white-space:nowrap;">'+arabicRelativeTime(ms)+'</span>' +
                '</div>';
              }).join('')+'</div>'
            : '<p class="add-part-locked-hint">ما فيه نسخ سابقة محفوظة بالسجل بعد — تنضاف تلقائيًا أول ما تحمّل PDF أو تطبع أو تشارك</p>') +
        '</div>' +
        '<div class="modal-footer-actions" style="margin-top:16px;justify-content:flex-end;">' +
          '<button type="button" class="btn btn-ghost" id="doc-history-close-btn">إغلاق</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  root.classList.add('modal-open');
  const close = ()=>{ root.innerHTML=''; root.classList.remove('modal-open'); };
  root.querySelector('[data-close-confirm]').addEventListener('click', e=>{
    if(e.target.hasAttribute('data-close-confirm')) close();
  });
  root.querySelector('#doc-history-close-btn').addEventListener('click', close);
  root.querySelectorAll('.doc-history-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const historyId = row.getAttribute('data-history-id');
      const entry = docHistoryList().find(e=>e._historyId===historyId);
      close();
      if(!entry || !docState) return;
      const snapshot = Object.assign({}, entry);
      delete snapshot._historyId;
      delete snapshot._savedAt;
      docState.data = snapshot;
      refreshDocSheet();
      showToast('عرض نسخة محفوظة من '+arabicRelativeTime(new Date(entry._savedAt).getTime()), 'ok');
    });
  });
}

function closeDocView(){
  const root = document.getElementById('doc-root');
  root.innerHTML='';
  root.classList.remove('doc-open');
  docState=null;
  document.removeEventListener('keydown', docEscListener);
  window.removeEventListener('beforeprint', markEmptyDocFields);
}
function closeDocViewAndReturn(){
  const orderId = docState ? docState.orderId : null;
  closeDocView();
  if(orderId) openModal('edit', orderId);
}
/* Esc كان يقفل شاشة المستند بدون حفظ — أي شي انكتب بالفاتورة (اسم العميل، السيارة، VIN...)
   بيضيع بلا تحذير. صار يحفظ أولًا زي زر ✕ بالضبط. */
async function closeDocViewSavingAndReturn(){
  await persistDocMeta(false);
  closeDocViewAndReturn();
}
function docEscListener(e){ if(e.key==='Escape') closeDocViewSavingAndReturn(); }

function markEmptyDocFields(){
  const root = document.getElementById('doc-root');
  if(!root) return;
  ['field-car','field-vin','field-cr'].forEach(cls=>{
    const el = root.querySelector('.'+cls);
    if(!el) return;
    const input = el.querySelector('input');
    const isEmpty = !input || !input.value.trim();
    el.classList.toggle('field-empty', isEmpty);
  });
}

function bindDocHandlers(){
  const root = document.getElementById('doc-root');
  root.querySelector('#doc-close-btn').addEventListener('click', async ()=>{ await persistDocMeta(false); closeDocViewAndReturn(); });
  root.querySelector('#doc-save-btn').addEventListener('click', ()=>{ persistDocMeta(true); });
  root.querySelector('#doc-print-btn').addEventListener('click', async ()=>{ await persistDocMeta(false, true); markEmptyDocFields(); window.print(); });
  root.querySelector('#doc-copy-btn').addEventListener('click', copyDocToClipboard);
  root.querySelector('#doc-share-btn').addEventListener('click', shareDoc);
  root.querySelector('#doc-pdf-btn').addEventListener('click', downloadDocPdf);
  root.querySelector('#doc-history-btn').addEventListener('click', openDocHistory);

  const customerInput = root.querySelector('#doc-customer-input');
  customerInput.addEventListener('input', e=>{ docState.data.customerName = e.target.innerText; });
  customerInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); e.target.blur(); } });
  root.querySelector('#doc-date-input').addEventListener('input', e=>{ docState.data.date = e.target.value; });
  root.querySelector('#doc-car-input').addEventListener('input', e=>{ docState.data.carModel = e.target.value; });
  root.querySelector('#doc-vin-input').addEventListener('input', e=>{ docState.data.vin = e.target.value; });
  root.querySelector('#doc-cr-input').addEventListener('input', e=>{ docState.data.customerCR = e.target.value; });
  const vatToggleInput = root.querySelector('#doc-vat-toggle-input');
  if(vatToggleInput){
    vatToggleInput.addEventListener('change', e=>{
      docState.data.showVat = e.target.checked;
      refreshDocSheet();
    });
  }

  const footerInput = root.querySelector('#doc-footer-input');
  if(footerInput){
    footerInput.addEventListener('input', e=>{ docState.data.footerNote = e.target.innerText; });
  }
}

/* appendHistory=true (عند تحميل PDF/طباعة/مشاركة/نسخ فقط — مش عند "حفظ البيانات" العادي ولا
   الإغلاق) بيضيف نسخة جديدة لسجل invoiceDocHistory/quoteDocHistory بدل ما يكتفي بتحديث invoiceDoc/
   quoteDoc الحالي — هيك فاتورة سابقة صدرت فعليًا للزبون ما تضيع لو صدرت فاتورة تانية لنفس الطلبية
   بعدها. مقارنة بآخر نسخة بالسجل تمنع تكرار نفس المحتوى بالضبط (مثلاً تحميل PDF مرتين ورا بعض
   بدون أي تعديل). */
async function persistDocMeta(showToastMsg, appendHistory){
  if(!docState) return false;
  const order = appData.orders.find(o=>o.id===docState.orderId);
  if(!order) return false;
  const field = docState.type==='invoice' ? 'invoiceDoc' : 'quoteDoc';
  order[field] = Object.assign({}, docState.data);
  if(appendHistory){
    const historyField = docState.type==='invoice' ? 'invoiceDocHistory' : 'quoteDocHistory';
    if(!Array.isArray(order[historyField])) order[historyField] = [];
    const snapshot = Object.assign({}, docState.data);
    const last = order[historyField][order[historyField].length-1];
    const lastData = last ? Object.assign({}, last, {_historyId:undefined, _savedAt:undefined}) : null;
    if(!last || JSON.stringify(lastData)!==JSON.stringify(snapshot)){
      order[historyField].push(Object.assign({ _historyId: uid('doc'), _savedAt: new Date().toISOString() }, snapshot));
    }
  }
  // لازم نقدّم updatedAt زي أي حفظ تاني — بدونه عمود updated_at بالقاعدة ما بيتحرك (ما فيه
  // trigger)، فحفظ بيانات المستند كان يمرّ "خفي" على فحصي التعارض بنافذة الطلبية والتسعيرة.
  order.updatedAt = new Date().toISOString();
  const saved = await persistOrder(order);
  if(!saved) return false;
  renderTable();
  if(showToastMsg) showToast('تم حفظ بيانات '+(docState.type==='invoice'?'الفاتورة':'عرض السعر'), 'ok');
  return true;
}

function buildDocWhatsAppText(order, type, data){
  const isInvoice = type==='invoice';
  const t = orderTotals(order);
  const feePercent = t.feePercent;
  const feeEnabled = t.feeEnabled;
  const fee = t.feeAmount;
  const grand = t.sellTotal;
  const lines = [];
  lines.push('*PARTECH*');
  lines.push((isInvoice?'فاتورة نقدية':'عرض أسعار')+' رقم '+data.number);
  lines.push('التاريخ: '+data.date);
  if(data.customerName) lines.push('العميل: '+data.customerName);
  if(data.customerCR) lines.push('ر.ض: '+data.customerCR);
  if(data.carModel) lines.push('السيارة: '+data.carModel);
  if(data.vin) lines.push('VIN: '+data.vin);
  lines.push('');
  lines.push('القطع:');
  orderActiveParts(order).filter(p=>!p.returned).forEach((p,i)=>{
    const qty = Number(p.qty)||1;
    const unit = Number(p.sellPrice)||0;
    lines.push((i+1)+'. '+partDisplayName(p)+' × '+qty+' — '+fmtNum(qty*unit)+' ريال');
  });
  lines.push('');
  if(data.showVat !== false){
    const vatAmt = round2(t.partsSellTotal - (t.partsSellTotal/1.15));
    lines.push('قيمة الضريبة المضافة (15%): '+fmtNum(vatAmt)+' ريال');
    lines.push('مجموع سعر القطع شامل الضريبة: '+fmtNum(t.partsSellTotal)+' ريال');
  } else {
    lines.push('مجموع القطع: '+fmtNum(t.partsSellTotal)+' ريال');
  }
  if(feeEnabled){
    lines.push((isInvoice?'رسوم خدمات وتوصيل':'رسوم خدمات شامل التوصيل')+' ('+feePercent+'%): '+fmtNum(fee)+' ريال');
  }
  if(t.serviceFeeEnabled && t.serviceFeeAmount>0){
    lines.push('رسوم خدمات ('+t.serviceFeePercent+'%): '+fmtNum(t.serviceFeeAmount)+' ريال');
  }
  if(t.deliveryFeeEnabled && t.deliveryFeeAmount>0){
    lines.push('أجور التوصيل: '+fmtNum(t.deliveryFeeAmount)+' ريال');
  }
  lines.push('الإجمالي: '+fmtNum(grand)+' ريال');
  lines.push('');
  // `||` كانت بترجّع الشروط الافتراضية لما يمسح المستخدم الملاحظة عمدًا — فنص واتساب بيعيد
  // تأكيد شروط (صلاحية/إرجاع) المستخدم قصد يشيلها. التمييز لازم يكون بين "غير معرّفة" و"فاضية".
  const footerNote = (data.footerNote===undefined || data.footerNote===null)
    ? defaultFooterNoteFor(type)
    : String(data.footerNote).trim();
  if(footerNote) lines.push(footerNote);
  return lines.join('\n');
}

async function writeTextToClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;
    }catch(e2){
      return false;
    }
  }
}

async function copyDocToClipboard(){
  const order = appData.orders.find(o=>o.id===docState.orderId);
  if(!order) return;
  const text = buildDocWhatsAppText(order, docState.type, docState.data);
  const ok = await writeTextToClipboard(text);
  showToast(ok ? 'تم نسخ النص، الصقه بالواتساب' : 'تعذر النسخ التلقائي، انسخ النص يدويًا', ok ? 'ok' : 'error');
  await persistDocMeta(false, true);
}

/* ---------- PDF export + native share ---------- */
function docPdfFilename(){
  const num = (docState && docState.data && docState.data.number) ? docState.data.number : 'PARTECH';
  return 'PARTECH-' + num + '.pdf';
}

// renders #doc-sheet (as currently on screen, with live input values) into a PDF Blob.
// forces a desktop-width layout during capture so the PDF looks the same whether generated from a phone or a computer.
async function buildDocPdfBlob(){
  if(typeof html2pdf === 'undefined'){
    throw new Error('LIB_MISSING');
  }
  const sheet = document.getElementById('doc-sheet');
  if(!sheet) throw new Error('NO_SHEET');
  sheet.classList.add('pdf-export-mode');
  // html2canvas clones the DOM before rendering and only sees the "value" attribute, not
  // the live "value" property — sync every input's current value into its attribute so
  // typed changes actually show up in the exported PDF.
  sheet.querySelectorAll('input').forEach(inp=>{ inp.setAttribute('value', inp.value); });
  try{
    if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
    const opt = {
      margin: 8,
      filename: docPdfFilename(),
      image: { type:'jpeg', quality:0.98 },
      html2canvas: { scale:2, useCORS:true, backgroundColor:'#ffffff', windowWidth:900 },
      jsPDF: { unit:'mm', format:'a4', orientation:'portrait' }
    };
    return await html2pdf().set(opt).from(sheet).outputPdf('blob');
  }finally{
    sheet.classList.remove('pdf-export-mode');
  }
}

async function downloadDocPdf(){
  if(!docState) return;
  // مرجع الكائن نفسه (مش orderId بس) — لو المستخدم سكّر شاشة المستند وفتح مستند تاني (حتى لنفس
  // الطلبية)، docState صار كائن جديد كليًا؛ الفحص بعد أي await بيوقف اللمس بحالة ما تخصنا هلق.
  const openedDocState = docState;
  const btn = document.getElementById('doc-pdf-btn');
  const closeBtn = document.getElementById('doc-close-btn');
  const setBusy = (b)=>{
    if(btn){ btn.disabled=b; btn.textContent = b ? 'جاري التجهيز…' : '📄 تحميل PDF'; }
    if(closeBtn) closeBtn.disabled = b;
    if(b) document.removeEventListener('keydown', docEscListener); else if(docState===openedDocState) document.addEventListener('keydown', docEscListener);
  };
  setBusy(true);
  try{
    await persistDocMeta(false, true);
    if(docState !== openedDocState) return;
    markEmptyDocFields();
    const blob = await buildDocPdfBlob();
    if(docState !== openedDocState) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = docPdfFilename();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    showToast('تم تحميل ملف PDF', 'ok');
  }catch(e){
    showToast(e && e.message==='LIB_MISSING' ? 'تعذر تحميل مكتبة PDF — تأكد من الاتصال بالإنترنت' : 'تعذر إنشاء ملف PDF', 'error');
  }finally{
    setBusy(false);
  }
}

// tries to share the actual PDF via the device's native share sheet (WhatsApp, Mail, etc.);
// falls back to sharing formatted text, then to a plain clipboard copy, depending on what the browser supports.
async function shareDoc(){
  if(!docState) return;
  const openedDocState = docState; // انظر ملاحظة downloadDocPdf — نفس الفحص بعد أي await هون
  const order = appData.orders.find(o=>o.id===docState.orderId);
  if(!order) return;
  const btn = document.getElementById('doc-share-btn');
  const closeBtn = document.getElementById('doc-close-btn');
  const setBusy = (b)=>{
    if(btn){ btn.disabled=b; btn.textContent = b ? 'جاري التجهيز…' : '📤 مشاركة'; }
    if(closeBtn) closeBtn.disabled = b;
    if(b) document.removeEventListener('keydown', docEscListener); else if(docState===openedDocState) document.addEventListener('keydown', docEscListener);
  };
  setBusy(true);
  try{
    // markEmptyDocFields لازم يصير قبل أي انتظار (لأنه بيأثر على شكل الورقة قبل ما تُلتقط
    // كصورة/PDF)، وfileShareSupported فحص متزامن رخيص — نخليهم أول شي بدل ما نأخرهم بعد
    // await، حتى نقلّل الوقت قبل استدعاء navigator.share() (نافذة تفعيل المستخدم بالمتصفح
    // محدودة بثواني، ومتصفحات زي سفاري بالآيفون صارمة معها).
    markEmptyDocFields();
    let fileShareSupported = false;
    if(navigator.share && navigator.canShare){
      try{
        const dummy = new File(['%PDF'], 'test.pdf', {type:'application/pdf'});
        fileShareSupported = navigator.canShare({files:[dummy]});
      }catch(e){ fileShareSupported = false; }
    }

    // persistDocMeta (حفظ عبر الشبكة) وbuildDocPdfBlob (توليد PDF) ما بيعتمدان على بعض —
    // نشغّلهما بالتوازي بدل التسلسل حتى يقصر إجمالي وقت الانتظار قبل navigator.share().
    // buildDocPdfBlob ملفوفة بـ catch: فشلها (مثلاً مكتبة PDF ما تحمّلت) كان بيلغي المشاركة
    // كلها عبر Promise.all، مع إن مشاركة النص لسه ممكنة تمامًا.
    const [, blob] = await Promise.all([
      persistDocMeta(false, true),
      fileShareSupported ? buildDocPdfBlob().catch(()=>null) : Promise.resolve(null)
    ]);
    if(docState !== openedDocState) return; // النافذة انسكّرت أو تحوّلت لمستند تاني أثناء الانتظار
    if(fileShareSupported && !blob) fileShareSupported = false; // انزل لمشاركة النص
    // إعادة جلب الطلبية بعد الانتظار (await) — ممكن يكون وصل تعديل من جلسة تانية بهالفترة
    // القصيرة، ونص المشاركة لازم يعكس آخر نسخة مش النسخة يلي كانت وقت فتح شاشة المستند.
    const liveOrder = appData.orders.find(o=>o.id===docState.orderId) || order;
    const isInvoice = docState.type==='invoice';
    const shareTitle = 'PARTECH — ' + (isInvoice?'فاتورة نقدية':'عرض أسعار') + ' ' + docState.data.number;
    const fullText = buildDocWhatsAppText(liveOrder, docState.type, docState.data);

    if(fileShareSupported){
      try{
        const file = new File([blob], docPdfFilename(), {type:'application/pdf'});
        await navigator.share({files:[file], title:shareTitle, text:shareTitle});
        return;
      }catch(errFile){
        if(errFile && errFile.name==='AbortError') return; // user cancelled the share sheet
        // otherwise fall through to the text-share fallback below
      }
    }

    if(navigator.share){
      try{
        await navigator.share({title:shareTitle, text:fullText});
        return;
      }catch(errText){
        if(errText && errText.name==='AbortError') return;
      }
    }

    const ok = await writeTextToClipboard(fullText);
    showToast(ok ? 'المشاركة غير مدعومة بهذا المتصفح، تم نسخ النص — الصقه في واتساب' : 'تعذرت المشاركة، جرّب متصفح Chrome', ok ? 'ok' : 'error');
  }catch(e){
    showToast('حدث خطأ أثناء محاولة المشاركة', 'error');
  }finally{
    setBusy(false);
  }
}
