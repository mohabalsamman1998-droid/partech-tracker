<!DOCTYPE html>
<!-- deploy nudge: force Pages resync -->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تتبع القطع · بارتك</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192-v2.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بارتك">
<meta name="theme-color" content="#22D07A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1210;
    --surface:#161B18;
    --surface-2:#1E2521;
    --border:#2A332D;
    --border-soft:#212821;
    --text:#EEF1ED;
    --text-dim:#9CA89F;
    --text-faint:#6C7871;
    --green:#22D07A;
    --green-ink:#06170F;
    --green-dim:rgba(34,208,122,.13);
    --green-line:rgba(34,208,122,.4);
    --rust:#E2703A;
    --rust-dim:rgba(226,112,58,.14);
    --rust-line:rgba(226,112,58,.45);
    --amber:#E8B23D;
    --amber-ink:#06170F;
    --amber-dim:rgba(232,178,61,.14);
    --amber-line:rgba(232,178,61,.45);
    --radius:12px;
    --radius-sm:8px;
  }
  /* day/light mode — for working outdoors under direct sunlight */
  :root[data-theme="light"]{
    --bg:#F6F8F6;
    --surface:#FFFFFF;
    --surface-2:#EEF2EE;
    --border:#D5DCD5;
    --border-soft:#E3E9E3;
    --text:#12180F;
    --text-dim:#465043;
    --text-faint:#77837A;
    --green:#0C8F51;
    --green-ink:#FFFFFF;
    --green-dim:rgba(12,143,81,.12);
    --green-line:rgba(12,143,81,.5);
    --rust:#B5481D;
    --rust-dim:rgba(181,72,29,.12);
    --rust-line:rgba(181,72,29,.5);
    --amber:#9C6A00;
    --amber-ink:#FFFFFF;
    --amber-dim:rgba(156,106,0,.14);
    --amber-line:rgba(156,106,0,.5);
  }
  *{box-sizing:border-box;}
  ::placeholder{font-style:normal;opacity:1;}
  input[type="number"]{-moz-appearance:textfield;}
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  /* شبكة أمان عامة ضد فيض عرضي — أي عنصر داخلي (صف flex/grid فيه نص عربي طويل ما بينكسر لأن
     الطفل ما إله min-width:0) بيضل مقصوص هون بدل ما يدفع الصفحة كلها ويعمل سحب أفقي خفي على
     الجوال. مو بديل عن تصليح كل حالة على حدة، بس يمنع أعراضها (محتوى مقطوع/مزاح) من التفشي. */
  html,body{min-height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;max-width:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(34,208,122,.07), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Tajawal',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.num,.chip,.btn,.stamp{font-family:'Cairo',system-ui,sans-serif;}
  .num{font-variant-numeric:tabular-nums;font-weight:700;}
  .page{max-width:1180px;margin:0 auto;padding:22px 20px 60px;}

  /* header */
  .topbar{
    display:flex;justify-content:flex-end;align-items:flex-end;gap:16px;
    padding-bottom:16px;margin-bottom:20px;
    border-bottom:1px dashed var(--border);
  }
  .topbar-actions{display:flex;gap:8px;flex-wrap:wrap;}

  /* buttons */
  .btn{
    border:1px solid var(--border);background:var(--surface-2);color:var(--text);
    padding:10px 16px;border-radius:var(--radius-sm);font-weight:700;font-size:14px;
    cursor:pointer;transition:.15s ease;white-space:nowrap;
    min-width:0;overflow:hidden;text-overflow:ellipsis;
  }
  .btn:hover{border-color:var(--text-faint);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .contact-options-col{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
  .contact-options-col a.btn{display:block;text-align:center;text-decoration:none;}
  .btn-primary{background:var(--green);border-color:var(--green);color:var(--green-ink);}
  .btn-primary:hover{background:#2be389;border-color:#2be389;}
  .btn-amber{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);}
  .btn-amber:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;}
  .btn-sm{padding:7px 12px;font-size:13px;}
  .btn-with-badge{position:relative;overflow:visible;}

  /* auth gate — shown until the user completes email magic-link sign-in */
  #auth-gate{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
  #auth-gate.hidden{display:none;}
  .location-gate{position:fixed;inset:0;background:var(--bg);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;}
  .location-gate-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 26px;max-width:380px;width:100%;text-align:center;}
  .location-gate-icon{font-size:40px;margin-bottom:14px;}
  .location-gate-title{font-size:17px;font-weight:800;margin-bottom:10px;}
  .location-gate-sub{color:var(--text-dim);font-size:13px;line-height:1.7;margin-bottom:20px;}
  .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 26px;max-width:380px;width:100%;text-align:center;}
  .auth-sub{color:var(--text-dim);font-size:13px;line-height:1.7;margin:10px 0 20px;}
  .auth-email-input{
    width:100%;box-sizing:border-box;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:11px 14px;border-radius:var(--radius-sm);font-size:14px;font-family:'Tajawal',sans-serif;text-align:center;
    margin-bottom:12px;
  }
  .auth-email-input:focus{outline:none;border-color:var(--green-line);}
  .auth-code-input{letter-spacing:6px;font-size:20px;font-weight:800;direction:ltr;}
  .auth-send-btn{width:100%;}
  .auth-message{margin-top:14px;font-size:12.5px;color:var(--text-dim);line-height:1.7;min-height:1em;}
  .auth-message.error{color:var(--rust);}
  .auth-message.ok{color:var(--green);}
  .app-top-utility-row{display:flex;flex-direction:column;gap:10px;margin-bottom:0;}
  .app-top-logo-row{display:flex;justify-content:flex-end;}
  .app-top-divider{border-bottom:2px solid var(--text-faint);margin:12px 0 14px;opacity:.55;}
  .announcement-banner{color:var(--rust);font-weight:800;font-size:23px;line-height:1.6;margin-bottom:14px;text-align:center;overflow-wrap:break-word;white-space:pre-wrap;}
  .corner-mini-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-start;}
  .app-corner-logo{height:30px;width:auto;flex-shrink:0;filter:brightness(0) saturate(100%) invert(1);opacity:.9;cursor:pointer;transition:.15s ease;}
  .app-corner-logo:hover{opacity:1;transform:scale(1.05);}
  .auth-logo{height:34px;width:auto;filter:brightness(0) saturate(100%) invert(1);opacity:.9;margin-bottom:12px;}
  :root[data-theme="light"] .auth-logo{filter:brightness(0) saturate(100%);}
  :root[data-theme="light"] .app-corner-logo{filter:brightness(0) saturate(100%);}
  .corner-mini-btn{
    border:1px solid var(--border);background:var(--surface);color:var(--text-faint);
    font-size:11px;padding:4px 8px;border-radius:999px;cursor:pointer;
    font-family:'Tajawal',sans-serif;line-height:1.4;
  }
  .corner-mini-btn:hover{border-color:var(--text-faint);color:var(--text-dim);}
  .employee-map-wrap{width:100%;height:min(420px,45vh);border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);margin-top:14px;}
  .employee-map-marker{background:transparent!important;border:none!important;width:auto!important;height:auto!important;}
  .employee-map-marker-label{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.25);font-family:inherit;}
  .employee-map-marker-stale .employee-map-marker-label{opacity:.55;}
  .employee-map-legend{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:12.5px;color:var(--text-dim);}
  .tasks-badge{
    display:none;align-items:center;justify-content:center;
    position:absolute;top:-7px;inset-inline-end:-7px;
    min-width:19px;height:19px;padding:0 4px;border-radius:999px;
    background:var(--rust);color:#fff;border:2px solid var(--bg);
    font-family:'Cairo',sans-serif;font-weight:800;font-size:11px;line-height:1;
  }
  .btn-danger{background:var(--rust);border-color:var(--rust);color:#1c0a03;}
  .btn-danger:hover{background:#ef8354;}
  .btn-danger-ghost{background:transparent;border-color:var(--rust-line);color:var(--rust);}
  .btn-supplied-on{background:var(--green-dim);border-color:var(--green-line);color:var(--green);}
  .btn-supplied-on:hover{background:rgba(34,208,122,.22);}

  /* KPI */
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .kpi-row > *{min-width:0;}
  /* صفحة عامر: كروت المؤشرات ثابتة عمودين دايمًا (بدل auto-fit) حتى ما تصغّر على شاشات عريضة */
  .scrapyard-kpi-row{grid-template-columns:repeat(2,1fr);}
  .new-order-btn-row{display:flex;justify-content:flex-end;gap:10px;margin-bottom:14px;}
  .top-toggle-row .btn{flex:1;}
  .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;min-width:0;max-width:100%;}
  .kpi-label{color:var(--text-dim);font-size:12.5px;margin-bottom:8px;}
  .kpi-value{font-size:19px;}
  .kpi-sub{font-size:11px;color:var(--amber);margin-top:4px;font-weight:600;}
  .kpi-rust .kpi-value{color:var(--rust);}
  .kpi-amber .kpi-value{color:var(--amber);}
  /* بخلاف kpi-amber (تلوين تصنيف ثابت)، هذا يبرز الكرت بصريًا فقط لما فيه شي فعليًا يحتاج انتباه */
  .kpi-attention{border-color:var(--amber-line);background:var(--amber-dim);}
  .kpi-attention .kpi-value{color:var(--amber);}
  .kpi-green .kpi-value{color:var(--green);}

  /* treasury (الصندوق) */
  .treasury-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .treasury-title{font-size:19px;font-weight:800;font-family:'Cairo',sans-serif;}
  .brand{font-size:19px;font-weight:800;font-family:'Cairo',sans-serif;color:var(--text);}
  .brand-accent{color:var(--green);}
  .purchases-task-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border-soft);font-size:14px;width:100%;background:transparent;border-left:none;border-right:none;border-top:none;cursor:pointer;font-family:'Tajawal',sans-serif;text-align:right;color:var(--text);min-width:0;}
  .purchases-task-row:hover{background:var(--surface-2);}
  .purchases-task-row:last-child{border-bottom:none;}
  .purchases-task-row-done{color:var(--text-faint);text-decoration:line-through;}
  .purchases-task-check{font-size:16px;flex-shrink:0;}
  .purchases-task-text{min-width:0;overflow-wrap:break-word;text-align:right;}
  .treasury-profit-card{
    background:var(--surface);border:1px solid var(--green-line);border-radius:var(--radius);
    padding:20px 22px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
    min-width:0;max-width:100%;
  }
  /* الصندوق حاليًا هو الرقم الفعلي الأهم بكل هالقائمة — يتميّز عن باقي البطاقات (توقعات/ديون/مستحقات) بخلفية أوضح وخط أكبر */
  .treasury-profit-card-primary{background:var(--green-dim);border-width:2px;}
  .treasury-profit-card-primary .treasury-profit-value{font-size:32px;}
  .treasury-profit-label{color:var(--text-dim);font-size:13px;font-weight:700;}
  .treasury-profit-value{font-family:'Cairo',sans-serif;font-size:28px;font-weight:800;color:var(--green);}
  /* أي كارت مؤشر بالصندوق قابل للضغط ليفتح توضيح بسيط تحته — flex-basis:100% تحطّ التوضيح
     بسطر لحاله تحت العنوان/الرقم (الكارت أصلًا flex-wrap) بدل ما يزاحمهم بنفس السطر */
  .treasury-card-clickable{cursor:pointer;}
  .treasury-card-clickable:hover{border-color:var(--green);}
  .card-breakdown{flex-basis:100%;min-width:0;display:flex;flex-direction:column;gap:4px;margin-top:4px;padding-top:10px;border-top:1px dashed var(--border-soft);}
  .card-breakdown-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--text-dim);min-width:0;}
  .card-breakdown-row span:first-child{min-width:0;overflow-wrap:break-word;}
  .card-breakdown-row .num{font-weight:700;font-size:12.5px;flex-shrink:0;}
  .card-breakdown-note{font-size:12.5px;color:var(--text-dim);overflow-wrap:break-word;}
  .treasury-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;}
  .treasury-block-title{font-size:13px;font-weight:800;color:var(--text-dim);}
  .treasury-block-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .expense-type-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .expense-categories{display:flex;flex-direction:column;}
  .expense-category-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--border-soft);}
  .expense-category-row:last-child{border-bottom:none;}
  .expense-category-label{font-size:13.5px;font-weight:700;color:var(--text);flex:1;}
  .expense-category-subtotal{font-size:13.5px;}
  .expense-history-btn{
    background:transparent;border:1px solid var(--border);color:var(--text-dim);
    padding:6px 10px;border-radius:999px;font-size:12px;cursor:pointer;flex-shrink:0;
    font-family:'Cairo',sans-serif;font-weight:700;
  }
  .expense-history-btn:hover{border-color:var(--text-faint);color:var(--text);}
  .expense-entries-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
  .expense-empty-hint{font-size:12px;color:var(--text-faint);padding:4px 0;}
  .purchase-history-section{margin-top:14px;}
  .purchase-history-section-title{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--text-dim);margin-bottom:8px;}
  .purchase-history-row{
    display:block;width:100%;text-align:right;background:var(--surface-2);border:1px solid var(--border-soft);
    border-radius:8px;padding:10px 12px;margin-bottom:6px;cursor:pointer;font-family:'Tajawal',sans-serif;
  }
  .purchase-history-row:hover{border-color:var(--green-line);}
  .purchase-history-row-main{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;min-width:0;}
  .purchase-history-desc{color:var(--text);flex:1;min-width:0;overflow-wrap:break-word;}
  .purchase-history-row-sub{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--text-faint);margin-top:4px;flex-wrap:wrap;min-width:0;}

  /* shared scrapyard settlement screen (employee + owner) */
  /* بطاقة مستقلة لكل طلبية — تباين واضح عن خلفية القسم وعن الطلبية يلي جنبها */
  .scrapyard-order-group{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:14px;}
  .scrapyard-order-group:last-child{margin-bottom:0;}
  .scrapyard-order-header{font-family:'Cairo',sans-serif;font-weight:800;font-size:14px;color:var(--green);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border-soft);}
  .scrapyard-order-header-clickable{cursor:pointer;}
  .scrapyard-order-header-clickable:hover{text-decoration:underline;}
  .scrapyard-part-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;}
  .scrapyard-part-row:last-of-type{border-bottom:none;}
  .scrapyard-part-desc{flex:1;min-width:120px;font-size:15px;font-weight:700;color:var(--text);}
  .scrapyard-confirmed-check{display:inline-block;margin-inline-start:8px;font-size:13px;}
  .scrapyard-days-since{display:inline-block;margin-inline-start:8px;font-size:11.5px;font-weight:700;}
  .scrapyard-part-actions{display:flex;gap:6px;min-width:96px;justify-content:flex-end;flex:0 0 auto;}
  .scrapyard-qty-slot{min-width:26px;text-align:center;}
  /* صف المجموع يحجز نفس أعمدة صف القطعة (اسم | عدد | سعر | إجراءات) حتى يقع المجموع تحت الأسعار تمامًا */
  .scrapyard-order-subtotal{display:flex;align-items:center;gap:10px;padding:8px 2px 4px;margin-top:2px;border-top:1px dashed var(--border-soft);font-size:13.5px;font-weight:700;color:var(--text-dim);flex-wrap:wrap;}
  .scrapyard-subtotal-label{flex:1;min-width:120px;}
  .scrapyard-subtotal-values{display:flex;align-items:center;gap:6px;}
  .scrapyard-subtotal-arrow{color:var(--text-faint);font-weight:400;}
  .scrapyard-subtotal-current{color:var(--green);}
  .scrapyard-subtotal-new{color:var(--amber);}
  .scrapyard-order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  /* السعرين جمب بعض على نفس صف القطعة وعلى نفس مستوى اسم القطعة — بنفس أسلوب إدخال أسعار القطعة في الطلبية */
  .scrapyard-price-group{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .scrapyard-price-cell{display:inline-flex;flex-direction:row;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--text-faint);white-space:nowrap;}
  .scrapyard-price-cell-current{color:var(--text-dim);}
  .scrapyard-price-cell-proposed{color:var(--amber);}
  .scrapyard-price-static{padding:4px 9px;border:1px solid var(--border-soft);border-radius:6px;background:var(--surface-2);font-size:13.5px;font-weight:700;text-align:center;color:var(--text);}
  .scrapyard-price-static-proposed{color:var(--amber);border-color:var(--amber-line);background:var(--amber-dim);}
  .scrapyard-price-input{
    width:80px;background:var(--bg);border:1px solid var(--amber-line);color:var(--amber);
    padding:6px 8px;border-radius:6px;font-size:13.5px;font-weight:700;font-family:'Cairo',sans-serif;
  }
  .scrapyard-price-input:focus{outline:none;border-color:var(--amber);}
  .scrapyard-supplier-select{
    width:120px;background:var(--bg);border:1px solid var(--border);color:var(--text-dim);
    padding:6px 6px;border-radius:6px;font-size:12px;font-family:'Tajawal',sans-serif;flex:0 0 auto;
  }
  .inline-count-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--rust);color:#fff;font-family:'Cairo',sans-serif;font-weight:800;font-size:11px;line-height:1;margin-inline-start:4px;vertical-align:middle;}
  .scrapyard-mgmt-actions{display:flex;gap:4px;min-width:96px;justify-content:flex-end;flex:0 0 auto;}
  .icon-btn.icon-btn-accept{color:var(--green);border-color:var(--green-line);background:var(--green-dim);}
  .icon-btn.icon-btn-accept:hover{filter:brightness(1.15);}
  .icon-btn.icon-btn-reject{color:var(--rust);border-color:var(--rust-line);background:var(--rust-dim);}
  .icon-btn.icon-btn-reject:hover{filter:brightness(1.15);}
  .btn-confirmed-green{background:var(--green);border-color:var(--green);color:var(--green-ink);opacity:.9;cursor:pointer;}
  .btn-confirmed-green:hover{opacity:1;}
  .treasury-chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .unsuccessful-reason-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .expense-entry-row{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:6px;padding:6px 8px;flex-wrap:wrap;}
  .expense-entry-amount-input{
    width:90px;background:var(--bg);border:1px solid var(--border);color:var(--rust);
    padding:6px 8px;border-radius:6px;font-size:13px;font-weight:700;text-align:left;
  }
  .expense-entry-amount-input.support-amount{color:var(--green);border-color:var(--green-line);}
  .expense-entry-date-input{
    flex:1;min-width:110px;background:var(--bg);border:1px solid var(--border);color:var(--text-dim);
    padding:6px 8px;border-radius:6px;font-size:12.5px;font-family:'Tajawal',sans-serif;
  }
  .expense-entry-note-input{
    flex:2;min-width:140px;background:var(--bg);border:1px solid var(--border);color:var(--text-dim);
    padding:6px 8px;border-radius:6px;font-size:12.5px;font-family:'Tajawal',sans-serif;
  }
  .expense-entry-amount-input:focus,.expense-entry-date-input:focus,.expense-entry-note-input:focus{outline:none;border-color:var(--rust-line);}
  .expense-entry-remove-btn{
    background:transparent;border:1px solid var(--border);color:var(--text-faint);
    width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:11px;flex-shrink:0;
  }
  .expense-entry-remove-btn:hover{border-color:var(--rust-line);color:var(--rust);}
  .expense-add-entry-btn{color:var(--green);border-color:var(--green-line);background:var(--green-dim);}
  .expense-add-entry-btn:hover{background:rgba(34,208,122,.22);}
  .expense-entry-view-amount{min-width:70px;}
  .expense-entry-view-date{font-size:12.5px;color:var(--text-dim);flex:1;}
  .expense-entry-view-note{font-size:12.5px;color:var(--text-faint);flex:2;min-width:100px;}
  .treasury-period-filter{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .extra-indicators-month-input{
    border:1px solid var(--border);background:var(--surface);color:var(--text);
    padding:6px 12px;border-radius:999px;font-size:12.5px;font-family:'Tajawal',sans-serif;
  }
  .extra-indicators-month-input:focus{outline:none;border-color:var(--green-line);}
  .extra-indicators-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .extra-indicators-row > *{min-width:0;}
  .extra-indicators-row .treasury-profit-card{margin-bottom:0;padding:14px 16px;}
  .extra-indicators-row .treasury-profit-value{font-size:19px;}
  .treasury-summary{display:flex;flex-direction:column;gap:8px;margin-top:6px;padding-top:14px;border-top:1px dashed var(--border);}
  .treasury-summary-row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:700;}
  .treasury-summary-row.net{font-size:17px;padding-top:6px;border-top:1px solid var(--border-soft);}

  /* data management (export/import) — deliberately small and understated, this is a rarely-used escape hatch */
  .data-mgmt-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px dashed var(--border);}
  .data-mgmt-label{font-size:11px;color:var(--text-faint);font-weight:700;margin-inline-end:4px;}
  .data-mgmt-row .btn-sm{font-size:11.5px;padding:5px 10px;opacity:.75;}
  .data-mgmt-row .btn-sm:hover{opacity:1;}

  /* tasks (TASKS) */
  .tasks-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .tasks-title{font-size:19px;font-weight:800;font-family:'Cairo',sans-serif;}
  .tasks-menu{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .task-category-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;
    cursor:pointer;color:var(--text);text-align:center;transition:.15s ease;font-family:'Tajawal',sans-serif;
  }
  .task-category-card:hover{border-color:var(--green-line);background:var(--surface-2);}
  .task-category-icon{font-size:30px;}
  .task-category-label{font-family:'Cairo',sans-serif;font-weight:800;font-size:16px;}
  .task-category-count{font-size:12px;color:var(--text-dim);font-weight:600;}
  .task-add-row{display:flex;gap:8px;margin-bottom:16px;}
  .task-add-input{
    flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:var(--radius-sm);font-size:14px;font-family:'Tajawal',sans-serif;
  }
  .task-add-input:focus{outline:none;border-color:var(--green-line);}
  .task-items-list{display:flex;flex-direction:column;gap:8px;}
  .task-item-row{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;min-width:0;}
  .quote-row{cursor:pointer;border-inline-start:3px solid var(--amber-line);}
  .quote-row:hover{border-color:var(--amber-line);}
  .quote-row-number{color:var(--text-faint);font-size:12.5px;}
  .quote-row-label{font-size:19px;font-weight:800;color:var(--amber);}
  .quote-row-ready{border-inline-start-color:var(--green-line);}
  .quote-row-ready .quote-row-label{color:var(--green);}
  .activity-log-row{cursor:pointer;}
  .activity-log-row:hover{border-color:var(--text-faint);}
  .doc-history-row{cursor:pointer;}
  .doc-history-row:hover{border-color:var(--text-faint);}
  .task-item-check{width:20px;height:20px;accent-color:var(--green);cursor:pointer;flex-shrink:0;}
  .task-item-text{flex:1;min-width:0;overflow-wrap:break-word;font-size:14px;}
  .task-item-done{opacity:.55;}
  .task-item-done .task-item-text{text-decoration:line-through;color:var(--text-faint);}
  .task-item-remove-btn{
    background:transparent;border:1px solid var(--border);color:var(--text-faint);
    width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:12px;flex-shrink:0;
  }
  .task-item-remove-btn:hover{border-color:var(--rust-line);color:var(--rust);}
  .supplier-name-input,.supplier-phone-input,.customer-name-input,.customer-phone-input{
    background:var(--bg);border:1px solid var(--border);color:var(--text);
    padding:8px 10px;border-radius:6px;font-size:13px;font-family:'Tajawal',sans-serif;
  }
  .supplier-name-input,.customer-name-input{flex:2;min-width:100px;}
  .supplier-phone-input,.customer-phone-input{flex:1;min-width:90px;}
  .supplier-name-input:focus,.supplier-phone-input:focus,.customer-name-input:focus,.customer-phone-input:focus{
    outline:none;border-color:var(--green-line);
  }
  .supplier-item-row{flex-direction:column;align-items:stretch;}
  .supplier-row-main{display:flex;align-items:center;gap:10px;}
  .customer-item-row{flex-direction:column;align-items:stretch;}
  .customer-row-main{display:flex;align-items:center;gap:10px;}
  .supplier-add-phone-btn{color:var(--green);border-color:var(--green-line);flex-shrink:0;}
  .supplier-add-phone-btn:hover{background:var(--green-dim);}
  .supplier-extra-phones{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding-inline-start:12px;border-inline-start:2px solid var(--border-soft);}
  .supplier-extra-phone-row{display:flex;align-items:center;gap:8px;}
  .supplier-extra-phone-input{
    flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);
    padding:6px 10px;border-radius:6px;font-size:13px;font-family:'Tajawal',sans-serif;
  }
  .supplier-extra-phone-input:focus{outline:none;border-color:var(--green-line);}
  .supplier-remove-phone-btn{
    background:transparent;border:1px solid var(--border);color:var(--text-faint);
    width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:11px;flex-shrink:0;
  }
  .supplier-remove-phone-btn:hover{border-color:var(--rust-line);color:var(--rust);}
  .supplier-kinds-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px;}
  .supplier-kind-toggle{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-dim);cursor:pointer;}
  .supplier-kind-toggle input{accent-color:var(--green);cursor:pointer;}

  /* toolbar */
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .filter-toggle-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .filter-chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    border:1px solid var(--border);background:var(--surface);color:var(--text-dim);
    padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .chip-active{background:var(--green-dim);border-color:var(--green-line);color:var(--green);}
  .search-input{
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    padding:9px 14px;border-radius:999px;font-size:13px;min-width:240px;font-family:'Tajawal',sans-serif;
  }
  .search-input:focus{outline:none;border-color:var(--green-line);}

  /* table */
  .table-container{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .orders-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .orders-table thead th{
    text-align:right;background:var(--surface-2);color:var(--text-dim);
    font-weight:700;font-size:12px;padding:12px 14px;border-bottom:1px solid var(--border);
  }
  .orders-table td{padding:12px 14px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
  .orders-table tbody tr:last-child td{border-bottom:none;}
  .orders-table tbody tr:hover{background:var(--surface-2);}
  .cell-order{color:var(--green);font-weight:700;font-size:14px;}
  .order-label-tag{color:var(--green);font-weight:700;font-family:'Cairo',system-ui,sans-serif;margin-inline-start:14px;padding-inline-start:14px;border-inline-start:1px solid var(--border);}
  .confirm-cell{text-align:center;width:1%;white-space:nowrap;}
  .confirm-btn{
    border:1px solid var(--border);background:transparent;
    padding:5px 11px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;
    font-family:'Cairo',sans-serif;white-space:nowrap;
  }
  .confirm-btn-off{color:var(--amber);border-color:var(--amber-line);background:var(--amber-dim);}
  .confirm-btn-off:hover{background:rgba(232,178,61,.22);}
  .confirm-btn-on{color:var(--green);border-color:var(--green-line);background:var(--green-dim);}
  .confirm-btn-on:hover{background:rgba(34,208,122,.22);}
  .row-unconfirmed{opacity:.68;}
  .row-unconfirmed .cell-order{color:var(--amber);}
  .card-unconfirmed{opacity:.68;border-style:dashed;}
  .card-unconfirmed .cell-order{color:var(--amber);}
  tr.row-supplied{background:var(--green-dim);}
  tr.row-not-supplied{background:var(--amber-dim);}
  .order-card.card-supplied{background:var(--green-dim);}
  .order-card.card-not-supplied{background:var(--amber-dim);}
  .muted{color:var(--text-faint);font-weight:400;}
  .text-green{color:var(--green);}
  .text-rust{color:var(--rust);}
  .text-amber{color:var(--amber);}
  .row-actions{display:flex;gap:6px;white-space:nowrap;}
  .icon-btn{
    border:1px solid var(--border);background:transparent;color:var(--text-dim);
    padding:6px 10px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;cursor:pointer;font-family:'Tajawal',sans-serif;
  }
  .icon-btn:hover{border-color:var(--text-faint);color:var(--text);}
  .icon-btn.icon-btn-danger{color:var(--rust);border-color:var(--rust-line);background:var(--rust-dim);}
  .icon-btn.icon-btn-danger:hover{filter:brightness(1.15);}

  /* stamps */
  .stamp{
    display:inline-block;padding:3px 11px;border-radius:5px;font-size:11px;font-weight:700;
    border:1.5px solid; letter-spacing:.01em;
  }
  .stamp-green{color:var(--green);border-color:var(--green-line);background:var(--green-dim);}
  .stamp-rust{color:var(--rust);border-color:var(--rust-line);background:var(--rust-dim);}
  .stamp-amber{color:var(--amber);border-color:var(--amber-line);background:var(--amber-dim);}

  /* cards (mobile) */
  .cards-list{display:none;padding:10px;gap:10px;flex-direction:column;}
  .order-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;}
  .order-card-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .order-card-head-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .order-card-row{display:flex;align-items:center;justify-content:flex-start;gap:6px;font-size:13px;color:var(--text-dim);padding:3px 0;}
  .order-card-row .num{color:var(--text);}
  .order-card-badges{display:flex;align-items:center;gap:8px;margin:10px 0;flex-wrap:wrap;}
  .order-card-actions{display:flex;gap:8px;margin-top:8px;}

  .empty-state{padding:60px 20px;text-align:center;}
  .empty-title{font-weight:700;font-size:15px;margin-bottom:6px;}
  .empty-sub{color:var(--text-dim);font-size:13px;}
  .loading{padding:40px;text-align:center;color:var(--text-dim);}

  @media (max-width:760px){
    .orders-table{display:none;}
    .cards-list{display:flex;}
  }

  /* modal */
  #modal-root{display:none;}
  #modal-root.modal-open{display:block;}
  #confirm-root{display:none;}
  #confirm-root.modal-open{display:block;}
  #confirm-root .modal-backdrop{z-index:90;}
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(4,6,5,.72);backdrop-filter:blur(2px);
    display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow-y:auto;
  }
  .modal-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    width:100%;max-width:600px;padding:22px;animation:pop .15s ease;
  }
  .modal-card-sm{max-width:420px;}
  @keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
  .modal-title{font-size:17px;font-weight:800;}
  .modal-sub{color:var(--text-dim);font-size:12.5px;margin-top:4px;}
  .field{display:block;margin-bottom:16px;}
  .field-label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:700;}
  .order-date-caption{font-size:11.5px;color:var(--text-faint);margin-bottom:4px;font-weight:500;}
  .field-label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;}
  .field-label-row .field-label{margin-bottom:0;}
  .field input[type="text"],.field input[type="tel"],.field select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:var(--radius-sm);font-size:14px;font-family:'Cairo',sans-serif;font-weight:700;
  }
  .field input[readonly]{background:var(--bg);color:var(--text-dim);cursor:default;}
  .field input:focus{outline:none;border-color:var(--green-line);}
  .phone-field-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .phone-field-row input,.phone-field-row select,.phone-field-row>div{flex:1;min-width:0;}
  /* أرقام الجوال بصفحة RTL بتنعكس بصريًا (الأرقام و+ بتختلط بترتيب الكتابة) لما تُلصق —
     نفرض اتجاه القراءة LTR على حقول الجوال (محتواها أرقام بس دايمًا) مع إبقاء المحاذاة يمين
     عشان يبقى شكلها متناسق مع باقي الحقول بالنموذج. */
  input[type="tel"]{direction:ltr;text-align:right;}
  .customer-phone-input,.supplier-phone-input,.supplier-extra-phone-input{direction:ltr;text-align:right;}

  .section-block{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:14px;}
  .section-sales{
    background:linear-gradient(180deg, rgba(34,208,122,.09), rgba(34,208,122,.02));
    border:1px solid var(--green-line);
    border-inline-start:4px solid var(--green);
  }
  .section-head{margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .section-title{font-size:12.5px;font-weight:800;color:var(--text-dim);}
  .section-sales .section-title{color:var(--green);}

  .parts-list{display:flex;flex-direction:column;gap:10px;margin-bottom:10px;}
  .part-type-gate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .part-type-gate-label{font-size:12.5px;color:var(--text-dim);font-weight:700;}
  .part-type-pills{display:flex;gap:8px;}
  .type-pill{
    border:1px solid var(--border);background:var(--surface);color:var(--text-dim);
    padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;
  }
  .type-pill-new.type-pill-active{background:var(--green-dim);border-color:var(--green-line);color:var(--green);}
  .type-pill-used.type-pill-active{background:var(--amber-dim);border-color:var(--amber-line);color:var(--amber);}
  .add-part-action{margin-bottom:4px;}
  .add-part-hint{font-size:12px;color:var(--text-faint);}
  .add-part-locked-hint{font-size:12px;color:var(--text-faint);margin:6px 0 0;}
  .add-part-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .btn-add-part{color:var(--green);border-color:var(--green-line);background:var(--green-dim);}
  .btn-add-part:hover{background:rgba(34,208,122,.22);border-color:var(--green);}
  .btn-add-used-part{color:var(--amber);border-color:var(--amber-line);background:var(--amber-dim);}
  .btn-add-used-part:hover{background:rgba(232,178,61,.22);border-color:var(--amber);}
  .part-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:10px;}
  .part-include-check{flex-shrink:0;align-self:center;width:18px;height:18px;accent-color:var(--green);cursor:pointer;}
  .part-row-excluded{opacity:.5;}
  .part-row-excluded .part-desc-input{text-decoration:line-through;}
  .part-row-returned{opacity:.7;background:var(--surface-2);}
  .part-desc-returned{color:var(--text);font-size:13.5px;font-family:'Tajawal',sans-serif;text-decoration:line-through;}
  .part-desc-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .part-index-badge{
    flex-shrink:0;color:var(--text-dim);font-family:'Cairo',sans-serif;font-weight:800;font-size:12.5px;
  }
  .part-desc-row .part-desc-input{flex:1;min-width:0;}
  .part-desc-wrap{flex:1 1 100%;display:flex;flex-direction:column;gap:4px;}
  .part-desc-input{
    flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);
    padding:8px 10px;border-radius:6px;font-size:13.5px;font-family:'Tajawal',sans-serif;
  }
  .part-notes-input,.part-purchasing-notes-input{
    background:var(--bg);border:1px solid var(--border-soft);color:var(--rust);font-weight:800;
    padding:6px 10px;border-radius:6px;font-size:12.5px;font-family:'Tajawal',sans-serif;
  }
  .part-purchasing-notes-input{border-color:var(--amber-line);}
  .part-notes-readonly{font-size:12.5px;color:var(--rust);font-weight:800;padding:2px 2px;}
  .used-badge{align-self:flex-start;font-size:10px;font-weight:700;color:var(--amber);background:var(--amber-dim);border:1px solid var(--amber-line);border-radius:4px;padding:1px 8px;cursor:pointer;font-family:'Tajawal',sans-serif;}
  .used-badge:hover{filter:brightness(1.1);}
  .used-badge-off{color:var(--text-faint);background:var(--surface-2);border-color:var(--border-soft);}
  .part-price-group{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 auto;}
  .mini-label{display:flex;flex-direction:column;gap:4px;font-size:10.5px;color:var(--text-faint);font-weight:700;}
  .mini-label-cost{color:var(--rust);}
  .mini-label-sell{color:var(--green);}
  .part-cost-input,.part-sell-input{
    width:104px;background:var(--bg);border:1px solid var(--border);
    padding:8px 8px;border-radius:6px;font-size:13px;font-weight:700;
  }
  .part-cost-input{color:var(--rust);border-color:var(--rust-line);}
  .part-sell-input{color:var(--green);border-color:var(--green-line);}
  .part-qty-input{
    width:62px;background:var(--bg);border:1px solid var(--border);color:var(--text);
    padding:8px 6px;border-radius:6px;font-size:13px;text-align:center;
  }
  .part-supplier-select{
    width:110px;background:var(--bg);border:1px solid var(--border);color:var(--text-dim);
    padding:8px 6px;border-radius:6px;font-size:12px;font-family:'Tajawal',sans-serif;
  }
  .part-desc-input:focus,.part-qty-input:focus{outline:none;border-color:var(--green-line);}
  .part-cost-input:focus{outline:none;border-color:var(--rust);}
  .part-sell-input:focus{outline:none;border-color:var(--green);}
  .part-remove-btn{
    background:transparent;border:1px solid var(--border);color:var(--text-faint);
    width:34px;height:34px;border-radius:6px;cursor:pointer;font-size:13px;flex-shrink:0;align-self:flex-start;
  }
  .part-remove-btn:hover{border-color:var(--rust-line);color:var(--rust);}
  .part-whatsapp-btn{flex-shrink:0;align-self:flex-end;color:var(--green);border-color:var(--green-line);background:var(--green-dim);white-space:nowrap;}
  .part-whatsapp-btn:hover{background:rgba(34,208,122,.22);border-color:var(--green);}

  .searchable-select{position:relative;}
  .searchable-select-input{
    background:var(--bg);border:1px solid var(--border);color:var(--text-dim);
    padding:8px 8px;border-radius:6px;font-size:12px;font-family:'Tajawal',sans-serif;width:100%;
  }
  .searchable-select-input:focus{outline:none;border-color:var(--green-line);}
  /* عميل/مورد ما تم اختياره — نلوّن الخانة أحمر بس لجذب الانتباه، مو منع حفظ (الحقل يضل اختياري) */
  /* input.select-empty-warn (لا .select-empty-warn لوحدها) عشان تفوز على ".field input[type=text]"
     يلي بيحدد خلفية/حدود الحقول جوا .field بتخصيص أعلى (element+attribute) — بدونها اللون الأحمر
     ما كان يظهر أبدًا على خانة العميل تحديدًا (هي وحدها جوا .field، خانة المورد لأ). */
  input.searchable-select-input.select-empty-warn{border-color:var(--rust-line);background:var(--rust-dim);}
  input.searchable-select-input.select-empty-warn:focus{border-color:var(--rust);}
  .searchable-select-dropdown{
    position:absolute;top:calc(100% + 4px);right:0;left:0;z-index:60;
    background:var(--surface);border:1px solid var(--border);border-radius:8px;
    max-height:220px;overflow-y:auto;box-shadow:0 8px 20px rgba(0,0,0,.25);
  }
  .searchable-select-option{
    display:block;width:100%;text-align:right;background:transparent;border:none;
    color:var(--text);padding:9px 10px;font-size:13px;font-family:'Tajawal',sans-serif;cursor:pointer;
    border-bottom:1px solid var(--border-soft);
  }
  .searchable-select-option:last-child{border-bottom:none;}
  .searchable-select-option:hover{background:var(--surface-2);}
  .searchable-select-option.searchable-select-create{color:var(--green);font-weight:700;}
  .searchable-select-empty{padding:10px;font-size:12.5px;color:var(--text-faint);text-align:center;}

  .toggle-row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;font-weight:600;cursor:pointer;}
  .toggle-row input{width:17px;height:17px;accent-color:var(--green);cursor:pointer;}
  .fee-percent-row{display:flex;align-items:center;gap:8px;margin-top:8px;margin-inline-start:25px;font-size:12.5px;color:var(--text-dim);}
  .fee-percent-row input{width:70px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:6px;font-size:13px;text-align:center;}
  .fee-percent-row input:focus{outline:none;border-color:var(--green-line);}
  .fee-amount-preview{color:var(--green);font-weight:700;font-size:12.5px;}
  .service-fee-amount-preview{color:var(--green);font-weight:700;font-size:12.5px;}

  .totals-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px;}
  .total-box{background:var(--surface);border:1px solid var(--border-soft);border-radius:6px;padding:9px 10px;display:flex;flex-direction:column;gap:5px;}
  .total-box span:first-child{font-size:10.5px;color:var(--text-faint);font-weight:600;}
  .total-box span.num{font-size:13.5px;}
  .total-box-sub{font-size:10px;color:var(--text-faint);font-weight:600;}

  /* بطاقة ملخص السداد: تجمع "الإجمالي" و"رصيد العهدة" و"المتبقي" ببطاقة وحدة
     بدل 3 بطاقات منفصلة متطابقة الشكل — "المتبقي" هو الرقم الفعلي المهم فيبان أكبر وأوضح */
  .settlement-summary-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px;display:flex;flex-direction:column;gap:8px;}
  .settlement-summary-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--text-dim);font-weight:600;}
  .settlement-summary-row .num{font-size:13.5px;font-weight:700;}
  .settlement-summary-divider{border-top:1px dashed var(--border-soft);}
  .settlement-summary-final{display:flex;justify-content:space-between;align-items:center;}
  .settlement-summary-final span:first-child{font-size:13.5px;font-weight:800;color:var(--text);}
  .settlement-summary-final .num{font-size:23px;font-weight:800;}

  .scrapyard-supplier-total-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:8px 2px;border-bottom:1px solid var(--border-soft);gap:8px;min-width:0;}
  .scrapyard-supplier-total-row span:first-child{min-width:0;overflow-wrap:break-word;}
  .scrapyard-supplier-total-row .num{flex-shrink:0;}
  .scrapyard-supplier-total-row:last-child{border-bottom:none;}

  .cost-split-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;}
  .cost-split-box{
    background:var(--surface);border:1px solid var(--border-soft);border-radius:6px;padding:9px 10px;
    display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:right;font-family:'Tajawal',sans-serif;
    transition:.15s ease;
  }
  .cost-split-box:hover{border-color:var(--text-faint);}
  .cost-split-box span:first-child{font-size:10.5px;color:var(--text-faint);font-weight:600;}
  .cost-split-box .num{color:var(--rust);font-size:13.5px;font-family:'Cairo',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;}
  .cost-split-status{font-size:10.5px;color:var(--rust);font-weight:700;}
  .cost-split-box.cost-split-paid{border-color:var(--green-line);background:var(--green-dim);}
  .cost-split-box.cost-split-paid .num{color:var(--green);}
  .cost-split-box.cost-split-paid .cost-split-status{color:var(--green);}

  .payments-block{margin-top:14px;}
  .payments-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .payment-row{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:8px 10px;flex-wrap:wrap;}
  .payment-row-return{background:var(--rust-dim);border-color:var(--rust-line);justify-content:space-between;}
  .payment-return-label{color:var(--rust);font-weight:800;font-size:13.5px;font-family:'Cairo',sans-serif;}

  /* ---------- edit_proposals: طلبات تعديل الطلبية بعد "تم التوريد" ---------- */
  .field-readonly-value{background:var(--surface-2);border:1px dashed var(--border);border-radius:6px;padding:7px 9px;font-size:13px;color:var(--text-dim);display:inline-block;min-width:0;overflow-wrap:break-word;}
  .field-readonly-desc{width:100%;box-sizing:border-box;min-width:0;}
  .field-request-btn{padding:4px 7px;font-size:11px;margin-inline-start:4px;}
  .field-request-compose{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .field-request-input{width:100px;background:var(--bg);border:1px solid var(--green-line);color:var(--text);padding:7px 9px;border-radius:6px;font-size:13px;}
  .field-request-send-btn,.field-request-cancel-btn{padding:5px 8px;font-size:12px;}

  .proposal-pending-banner{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--amber-dim);border:1px solid var(--amber-line);border-radius:var(--radius-sm);padding:6px 9px;}
  .proposal-pending-text{font-size:12px;color:var(--amber);font-weight:700;}
  .proposal-accept-btn{color:var(--green);border-color:var(--green-line);}
  .proposal-reject-btn,.proposal-withdraw-btn{color:var(--rust);border-color:var(--rust-line);}

  .payment-row-pending-add{background:var(--amber-dim);border-color:var(--amber-line);}

  .edit-proposal-review-row{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px;}
  .edit-proposal-review-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .edit-proposal-review-order{font-weight:700;color:var(--green);font-family:'Cairo',sans-serif;font-size:13.5px;}
  .edit-proposal-review-field{font-size:11.5px;color:var(--text-faint);font-weight:700;}
  .edit-proposal-review-meta{font-size:10.5px;color:var(--text-faint);margin-top:6px;}
  .proposal-pending-note{font-size:12px;color:var(--amber);font-weight:700;margin:6px 0 0;}
  .order-action-pending-wrap{display:inline-flex;}
  .part-action-pending-wrap{margin-top:12px;}
  .payment-amount-input{
    width:100px;background:var(--bg);border:1px solid var(--border);color:var(--text);
    padding:7px 9px;border-radius:6px;font-size:13px;
  }
  .payment-method-select{
    background:var(--bg);border:1px solid var(--border);color:var(--text);
    padding:7px 9px;border-radius:6px;font-size:13px;font-family:'Tajawal',sans-serif;
  }
  .payment-date-display{
    flex:1;min-width:110px;color:var(--text-dim);
    padding:7px 9px;font-size:13px;font-family:'Tajawal',sans-serif;
  }
  .payment-amount-input:focus,.payment-method-select:focus{outline:none;border-color:var(--green-line);}
  .payment-remove-btn{
    background:transparent;border:1px solid var(--border);color:var(--text-faint);
    width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:12px;flex-shrink:0;
  }
  .payment-remove-btn:hover{border-color:var(--rust-line);color:var(--rust);}
  .payment-summary-row{
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
    background:var(--surface);border:1px solid var(--border-soft);border-radius:6px;padding:10px 12px;font-size:12.5px;color:var(--text-dim);font-weight:700;
  }
  .payment-summary-row span{display:flex;flex-direction:column;gap:4px;}
  .payment-summary-row .num{color:var(--text);font-size:14px;}
  .payment-remaining-display{font-size:14px;}
  .customer-refund-status{margin-top:8px;padding:9px 12px;border-radius:6px;font-size:12.5px;font-weight:800;text-align:center;}
  .customer-refund-status-pending{background:var(--rust-dim);border:1px solid var(--rust-line);color:var(--rust);}
  .customer-refund-status-done{background:var(--green-dim);border:1px solid var(--green-line);color:var(--green);margin-top:6px;}

  .modal-footer{display:flex;justify-content:space-between;align-items:center;margin-top:6px;flex-wrap:wrap;gap:10px;overflow-x:hidden;}
  .modal-footer-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .modal-footer-utility{display:flex;flex-direction:column;align-items:flex-start;gap:6px;}
  .parts-clipboard-mini{display:flex;gap:6px;}
  .btn-clip-mini{
    border:1px solid var(--border);background:transparent;color:var(--text-faint);
    padding:4px 9px;border-radius:6px;font-size:10.5px;font-weight:700;cursor:pointer;font-family:'Tajawal',sans-serif;
  }
  .btn-clip-mini:hover{color:var(--text-dim);border-color:var(--text-faint);}

  /* toast */
  .toast-root{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;}
  .toast{
    padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;
    box-shadow:0 6px 20px rgba(0,0,0,.35);opacity:1;transition:opacity .3s ease;
  }
  .toast-ok{background:var(--green);color:var(--green-ink);}
  .toast-error{background:var(--rust);color:#1c0a03;}
  .toast-out{opacity:0;}

  .modal-footer-docs{display:flex;gap:8px;flex-wrap:wrap;}

  /* ---------- document (invoice / quote) sheet — redesigned from scratch, real PARTECH logo + brand colors ---------- */
  #doc-root{display:none;}
  #doc-root.doc-open{display:block;}
  .doc-overlay{position:fixed;inset:0;background:rgba(4,6,5,.78);z-index:70;overflow-y:auto;padding:26px 16px;}
  .doc-toolbar{max-width:820px;margin:0 auto 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .doc-toolbar-title{color:#fff;font-weight:700;font-size:13.5px;font-family:'Cairo',sans-serif;}
  .doc-toolbar-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .doc-sheet{
    max-width:820px;margin:0 auto;background:#FFFFFF;color:#171717;
    border-radius:6px;padding:32px 34px 30px;font-family:'Tajawal',sans-serif;
    box-shadow:0 14px 44px rgba(0,0,0,.45);
  }

  /* header band: logo + company info on one side, document identity (type/number/date) on the other */
  .doc-header-band{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:14px;border-bottom:2px solid #85F745;flex-wrap:wrap;}
  .doc-brand-col{display:flex;flex-direction:column;gap:8px;}
  .doc-logo-img{height:60px;width:auto;display:block;}
  .doc-co-info{font-size:11.5px;color:#555;line-height:1.7;}
  .doc-identity-col{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:160px;}
  .doc-type-badge{font-family:'Cairo',sans-serif;font-weight:800;font-size:15px;color:#171717;}
  .doc-type-badge-en{font-size:10px;color:#999;letter-spacing:.06em;font-weight:700;margin-bottom:2px;}
  .doc-identity-row{display:flex;align-items:center;gap:8px;font-size:12px;}
  .doc-identity-label{color:#888;font-weight:700;white-space:nowrap;}
  .doc-identity-input{border:none;background:transparent;color:#171717;font-family:'Cairo',sans-serif;font-weight:700;font-size:13px;width:100px;padding:2px 0;}
  .doc-identity-input[readonly]{opacity:.72;cursor:default;}
  .doc-identity-input:focus{outline:none;border-bottom:1px solid #85F745;}

  /* bill-to — plain text, no card/box, just a hairline rule underneath */
  .doc-billto{margin:18px 0 16px;padding-bottom:12px;border-bottom:1px solid #E4E4E4;}
  .doc-billto-label{display:block;font-size:10px;color:#999;font-weight:700;margin-bottom:5px;}
  .doc-customer-name-input{display:block;width:100%;box-sizing:border-box;border:none;background:transparent;font-family:'Cairo',sans-serif;font-weight:500;font-size:16px;color:#171717;padding:2px 0;text-align:right;direction:rtl;min-height:1.3em;}
  .doc-customer-name-input:focus{outline:none;border-bottom:1px solid #85F745;}
  .doc-billto-extra{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:9px;}
  .doc-cr-line{margin-top:4px;}
  .doc-meta-field{display:flex;align-items:baseline;gap:5px;}
  .doc-meta-field span:first-child{color:#999;font-weight:700;font-size:10.5px;white-space:nowrap;}
  .doc-meta-field input{border:none;background:transparent;font-size:12.5px;color:#171717;font-family:'Tajawal',sans-serif;padding:0;width:150px;}
  .doc-meta-field input:focus{outline:none;}

  /* items table */
  .doc-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:8px;}
  .doc-table th{background:#171717;color:#fff;border:1px solid #171717;padding:9px 10px;font-weight:700;text-align:center;}
  .doc-table th:first-child{text-align:right;}
  .doc-table td{border:1px solid #E2E2E2;padding:8px 10px;color:#222;}
  .doc-table td:first-child{text-align:right;}
  .doc-table tbody tr:nth-child(even){background:#FAFAFA;}

  .doc-vat-toggle{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:#666;cursor:pointer;font-family:'Tajawal',sans-serif;}
  .doc-vat-toggle input{cursor:pointer;}

  /* totals — grand total gets a solid brand-black bar with the amount in PARTECH green */
  .doc-totals{width:100%;max-width:300px;margin-top:12px;margin-inline-start:auto;}
  .doc-totals-row{display:flex;justify-content:space-between;align-items:center;padding:7px 2px;border-bottom:1px solid #EEE;font-size:13px;}
  .doc-totals-row.grand{border-bottom:none;border-top:3px double #171717;margin-top:8px;padding:10px 2px 4px;background:transparent;font-weight:800;font-size:15.5px;}
  .doc-totals-row.grand span:first-child{color:#171717;}
  .doc-totals-row.grand .num{color:#171717;}
  .doc-totals-row input{width:100px;border:1px solid #ccc;border-radius:4px;padding:5px 8px;font-size:12.5px;text-align:left;color:#111;}

  .doc-footer-note-input{
    display:block;width:100%;box-sizing:border-box;margin-top:22px;padding-top:14px;border:none;border-top:1px dashed #ccc;
    font-size:12.5px;font-weight:400;color:#555;text-align:right;font-family:'Tajawal',sans-serif;
    background:transparent;direction:rtl;
  }
  .doc-footer-note-input div{margin-bottom:6px;}
  .doc-footer-note-input div:last-child{margin-bottom:0;}
  .doc-footer-note-input:focus{outline:none;}

  @media print{
    /* visibility:hidden بتخفي الشكل بس وبتحتفظ بمساحة العنصر — فطباعة من قائمة المتصفح كانت
       تطلّع صفحات فاضية للتطبيق قبل/بعد المستند. display:none بتشيلها من التخطيط كليًا. */
    body > *{display:none !important;}
    #doc-root{display:block !important;position:absolute;inset:0;background:#fff;}
    #doc-root *{visibility:visible;}
    .doc-overlay{position:static;padding:0;background:#fff;overflow:visible;}
    .no-print{display:none !important;}
    .field-empty{display:none !important;}
    .doc-sheet{box-shadow:none;max-width:100%;border-radius:0;}
    .doc-totals-row input{border-color:#fff;}
    /* بدون هذا بتشيل المتصفحات خلفيات الجدول عند الطباعة، فيطلع نص أبيض على أبيض */
    .doc-table thead th, .doc-sheet [style*="background"]{
      -webkit-print-color-adjust:exact; print-color-adjust:exact;
    }
    @page{size:A4;margin:14mm;}
  }

  /* used while generating a PDF (share / download) so the exported file matches the printed look, regardless of the screen size it was generated from */
  .doc-sheet.pdf-export-mode .field-empty{display:none !important;}
  .doc-sheet.pdf-export-mode .no-print{display:none !important;}
  .doc-sheet.pdf-export-mode .doc-totals-row input{border-color:#fff !important;}
  /* خط أكبر وأوضح خاص بملف الـ PDF المُصدَّر فقط (لا يمس شكل الطباعة العادية ولا شاشة التحرير) — يقرأ بوضوح على الجوال دون تكبير يدوي */
  .doc-sheet.pdf-export-mode{padding:28px 28px 26px;}
  .doc-sheet.pdf-export-mode .doc-logo-img{height:76px;}
  .doc-sheet.pdf-export-mode .doc-co-info{font-size:14px;}
  .doc-sheet.pdf-export-mode .doc-type-badge{font-size:18px;}
  .doc-sheet.pdf-export-mode .doc-type-badge-en{font-size:12px;}
  .doc-sheet.pdf-export-mode .doc-identity-row{font-size:14px;}
  .doc-sheet.pdf-export-mode .doc-identity-input{font-size:15px;width:120px;}
  .doc-sheet.pdf-export-mode .doc-billto-label{font-size:12px;}
  .doc-sheet.pdf-export-mode .doc-customer-name-input{font-size:19px;}
  .doc-sheet.pdf-export-mode .doc-meta-field span:first-child{font-size:11.5px;}
  .doc-sheet.pdf-export-mode .doc-meta-field input{font-size:15px;width:180px;}
  .doc-sheet.pdf-export-mode .doc-table{font-size:15px;}
  .doc-sheet.pdf-export-mode .doc-table th,
  .doc-sheet.pdf-export-mode .doc-table td{padding:12px 12px;}
  .doc-sheet.pdf-export-mode .doc-totals{max-width:380px;}
  .doc-sheet.pdf-export-mode .doc-totals-row{font-size:15.5px;padding:9px 4px;}
  .doc-sheet.pdf-export-mode .doc-totals-row.grand{font-size:19px;padding:13px 4px 6px;}
  .doc-sheet.pdf-export-mode .doc-footer-note-input{font-size:14px;}
  .doc-table tr{break-inside:avoid;}

  /* ============ mobile (placed last so it wins the cascade) ============ */
  @media (max-width:760px){
    /* prevent iOS auto-zoom on focus + comfortable touch targets — !important needed since many
       component-specific rules elsewhere (e.g. .field input[type="text"]) have higher specificity
       and would otherwise win over this plain type-selector rule despite being defined earlier */
    input[type="text"],input[type="number"],input[type="password"],input[type="email"],input[type="month"],input[type="date"],input[type="datetime-local"],input[type="time"],select,textarea,[contenteditable="true"]{font-size:16px !important;}
    .btn{padding:12px 16px;font-size:14.5px;}
    .btn-sm{padding:10px 14px;font-size:13px;}
    .icon-btn{padding:9px 12px;font-size:12.5px;}
    .corner-mini-btn{font-size:15px;padding:9px 11px;min-height:40px;min-width:40px;}
    .toggle-row input{width:20px;height:20px;}
    .confirm-btn{min-height:32px;}
    .type-pill{padding:10px 16px;}

    /* page & header */
    .page{padding:calc(24px + env(safe-area-inset-top)) 12px calc(72px + env(safe-area-inset-bottom));}
    .topbar{flex-direction:column;align-items:stretch;gap:12px;}
    .topbar-actions{display:flex;gap:8px;flex-wrap:wrap;}
    .topbar-actions .btn{flex:1;min-width:100px;}

    /* KPIs */
    .kpi-row{grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;}
    .kpi-card{padding:11px 12px;}
    .kpi-label{font-size:11px;margin-bottom:5px;}
    .kpi-value{font-size:16px;}

    /* toolbar */
    .toolbar{flex-direction:column;align-items:stretch;gap:10px;}
    .search-input{width:100%;min-width:0;}
    .filter-chips{width:100%;}
    .chip{padding:9px 13px;font-size:12.5px;}

    /* cards */
    .order-card{padding:13px;}
    .order-card-actions .icon-btn,.row-actions .icon-btn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:center;}
    .order-card-actions,.row-actions{flex-wrap:wrap;}

    /* modal */
    .modal-backdrop{padding:calc(4vh + env(safe-area-inset-top)) 10px calc(4vh + env(safe-area-inset-bottom));}
    .modal-card{max-width:100%;padding:18px 14px;}
    .modal-title{font-size:15.5px;}
    .section-block{padding:12px;}
    .totals-row{gap:6px;}
    .total-box{padding:8px 8px;}

    /* footer: primary actions on top, destructive action last */
    .modal-footer{flex-direction:column-reverse;gap:10px;align-items:stretch;}
    .modal-footer-actions{display:flex;gap:8px;flex-wrap:wrap;}
    .modal-footer-actions .btn{flex:1 1 calc(50% - 4px);min-width:120px;}
    .modal-footer-docs{display:flex;gap:8px;width:100%;flex-wrap:wrap;}
    .modal-footer-docs .btn{flex:1 1 calc(50% - 4px);min-width:110px;}
    .modal-footer-utility{align-items:center;width:100%;}

    /* payment rows */
    .payment-amount-input{width:110px;}
    .payment-method-select{flex:1;min-width:100px;}
    .payment-date-display{flex:1 1 100%;}
    .payment-remove-btn{width:34px;height:34px;}

    /* fee row */
    .fee-percent-row input{width:80px;}

    /* invoice / quote document */
    .doc-overlay{padding:calc(12px + env(safe-area-inset-top)) 8px calc(12px + env(safe-area-inset-bottom));}
    .doc-toolbar{flex-direction:column;align-items:stretch;gap:10px;}
    .doc-toolbar-title{text-align:center;}
    .doc-toolbar-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .doc-toolbar-actions .btn{width:100%;}
    .doc-sheet{padding:20px 14px;}
    .doc-header-band{flex-direction:column;align-items:flex-start;gap:12px;}
    .doc-logo-img{height:50px;}
    .doc-identity-col{width:100%;}
    .doc-customer-name-input{font-size:16px;}
    .doc-billto-extra{flex-direction:column;}
    .doc-meta-field{min-width:0;}
    .doc-table{font-size:11px;}
    .doc-table th,.doc-table td{padding:6px 5px;}
    .doc-totals{max-width:100%;}

    /* treasury */
    .treasury-header{flex-direction:column;align-items:stretch;gap:10px;text-align:center;}
    /* السبب الحقيقي لفيض التفاصيل برّا الكرت عالجوال (تأكدت منه بمحاكاة حية بالمتصفح، مو تخمين):
       flex-wrap:wrap موروثة من قاعدة الديسكتوب (fallback) وتضل فعّالة بعد ما صار flex-direction:column
       هون — بس بوضع column، flex-wrap:wrap معناها "لف لعمود جديد جنبي" مش "لف لسطر تحت"، فـ
       .card-breakdown (اللي إله flex-basis:100%) كان يُحسب إنه "ما بينفع بنفس العمود" ويلف لعمود
       ثاني موضعه بره حدود الكرت تمامًا (تأكدت: بدون هالفيكس كان left يطلع بالسالب). nowrap هون
       بتمنع هالف نهائيًا فيضل كل شي بعمود واحد وبيتكدّس عمودي زي المتوقع. */
    .treasury-profit-card{flex-direction:column;align-items:flex-start;flex-wrap:nowrap;gap:6px;padding:16px;}
    .treasury-profit-card .card-breakdown{width:100%;}
    /* صف تفصيل (تسمية + مبلغ) بعرض ~130px بس — لو المبلغ عريض بياخذ مساحة تخلي التسمية تنكسر
       بمنتصف كلمة (overflow-wrap:break-word بالقاعدة الأساسية). نخلي الصف نفسه يلف بدل هيك:
       المبلغ ينزل تحت التسمية بمكانه لو ما ضلّ مكان جنبها، أوضح وأقرأ من كسر كلمة بالنص. */
    .card-breakdown-row{flex-wrap:wrap;justify-content:flex-start;gap:2px 8px;}
    .card-breakdown-row .num{margin-inline-start:auto;}
    .treasury-profit-value{font-size:22px;}
    .treasury-block{padding:14px;}
    .expense-category-row{flex-wrap:wrap;gap:6px;}
    .expense-entry-amount-input{width:100px;}
    .expense-entry-date-input{flex:1 1 100%;}
    .expense-entry-note-input{flex:1 1 100%;}
    .expense-entry-remove-btn{width:34px;height:34px;}
    .data-mgmt-row{justify-content:center;text-align:center;}
    .data-mgmt-label{width:100%;margin-inline-end:0;margin-bottom:2px;}

    /* new-order CTA: full-width, easy to tap */
    .new-order-btn-row{flex-wrap:wrap;}
    .new-order-btn-row .btn{width:100%;}
    /* الطلبيات/طلبات التسعير (وصف المشتريات: السداد/طلبات التسعير/المهام): بجانب بعض دايمًا،
       حتى على الشاشات الصغيرة — نص "طلبات التسعير" أطول من يكفي بحجم الخط العادي على شاشة
       ضيقة (~320-375px) لو الأزرار 3 بصف واحد، فنصغّر الخط والحشو هون بدل ما نخلي النص يطفح. */
    .top-toggle-row{flex-wrap:nowrap;}
    .top-toggle-row .btn{width:auto;flex:1;min-width:0;padding:9px 6px;font-size:12.5px;}

    /* suppliers / customers rows: many inline pieces (name, phone, count, amount, buttons) —
       wrap instead of overflowing horizontally, and let name/phone inputs take a full row each */
    .task-item-row,.supplier-row-main,.customer-row-main{flex-wrap:wrap;row-gap:8px;}
    .task-item-row .purchase-history-desc,.task-item-row .expense-entry-view-date{flex:1 1 auto;min-width:80px;}
    .task-item-row .supplier-name-input,.task-item-row .supplier-phone-input,
    .task-item-row .customer-name-input,.task-item-row .customer-phone-input{flex:1 1 140px;}
    .task-item-row .icon-btn,.task-item-row .task-item-remove-btn,.task-item-row .btn{flex-shrink:0;}
    .supplier-extra-phones{padding-inline-start:8px;}

    /* purchase / order history modal rows */
    .purchase-history-row-main{flex-wrap:wrap;gap:6px;}
    .purchase-history-desc{flex:1 1 100%;}
    .purchase-history-section-title{flex-wrap:wrap;}

    /* tasks */
    .tasks-header{flex-direction:column;align-items:stretch;gap:10px;text-align:center;}
    .tasks-menu{grid-template-columns:1fr;gap:10px;}
    .task-category-card{padding:20px 16px;}
    .task-add-row{flex-direction:column;}
    .task-item-check{width:22px;height:22px;}
    .task-item-remove-btn{width:34px;height:34px;}

    /* toast — keep clear of the home indicator / gesture bar */
    .toast-root{bottom:calc(20px + env(safe-area-inset-bottom));}
  }
</style>

/* نفس fmtMoney بس بإشارة صريحة (+/-) بدل ما نفترض دايمًا موجب — لازم لفئات زي عهدة عامر اللي
   ممكن تحتوي قيود سالبة (تحصيل كاش من مرتجع تشليح يُخصم من إجمالي العهدة). */
function fmtSigned(n){
  const v = Number(n)||0;
  return (v>=0?'+':'') + fmtMoney(v);
}

function escapeHtml(s){

}
