function openCustomerHistoryModal(customerId) {
    openCustomerHistoryId = customerId;
    const customer = (appData.customers || []).find(c => c.id === customerId);
    const label = customer ? customer.name || customer.phone || "عميل" : "عميل";
    const {ongoing: ongoing, past: past} = customerOrderHistory(customerId);
    const ongoingTotal = round2(ongoing.reduce((s, r) => s + r.remaining, 0));
    const pastTotal = round2(past.reduce((s, r) => s + r.total, 0));
    const refunds = customerRefundsPending(customerId);
    const refundsTotal = round2(refunds.reduce((s, r) => s + r.amount, 0));
    const pending = customerPendingOrders(customerId);
    const root = document.getElementById("modal-root");
    root.innerHTML = '<div class="modal-backdrop" data-close-backdrop>' + '<div class="modal-card modal-card-sm" role="dialog" aria-modal="true">' + '<div class="modal-header"><div class="modal-title">سجل طلبيات — ' + escapeHtml(label) + "</div>" + '<div style="display:flex;gap:6px;align-items:center;">' + '<button type="button" class="icon-btn" id="customer-statement-btn" title="إصدار كشف حساب" aria-label="إصدار كشف حساب">🧾 كشف حساب</button>' + '<button type="button" class="icon-btn" id="customer-history-close-btn" aria-label="إغلاق">✕</button>' + "</div>" + "</div>" + (refunds.length ? '<div class="purchase-history-section">' + '<div class="purchase-history-section-title"><span>يجب إرجاعه للعميل</span><span class="num text-rust">' + fmtMoney(refundsTotal) + "</span></div>" + refunds.map(customerRefundRowHtml).join("") + "</div>" : "") + '<div class="purchase-history-section">' + '<div class="purchase-history-section-title"><span>جارية (لم تُسدد بالكامل)</span><span class="num text-rust">' + fmtMoney(ongoingTotal) + "</span></div>" + (ongoing.length ? ongoing.map(orderHistoryRowHtml).join("") : '<div class="expense-empty-hint">ما فيه طلبيات جارية</div>') + "</div>" + '<div class="purchase-history-section">' + '<div class="purchase-history-section-title"><span>سابقة (مسددة)</span><span class="num text-green">' + fmtMoney(pastTotal) + "</span></div>" + (past.length ? past.map(orderHistoryRowHtml).join("") : '<div class="expense-empty-hint">ما فيه طلبيات سابقة</div>') + "</div>" + (pending.length ? '<div class="purchase-history-section">' + '<div class="purchase-history-section-title"><span>غير مورَّدة</span><span class="num text-dim">' + pending.length + "</span></div>" + pending.map(pendingOrderHistoryRowHtml).join("") + "</div>" : "") + "</div>" + "</div>";
    root.classList.add("modal-open");
    const close = () => {
        root.innerHTML = "";
        root.classList.remove("modal-open");
        openCustomerHistoryId = null;
    };
    root.querySelector("[data-close-backdrop]").addEventListener("click", e => {
        if (e.target.hasAttribute("data-close-backdrop")) close();
    });
    root.querySelector("#customer-history-close-btn").addEventListener("click", close);
    root.querySelector("#customer-statement-btn").addEventListener("click", () => openCustomerStatementView(customerId));
    root.querySelectorAll("[data-open-order]").forEach(btn => {
        btn.addEventListener("click", e => {
            if (e.target.closest(".proposal-pending-banner")) return;
            modalCloseCallback = () => openCustomerHistoryModal(customerId);
            close();
            openModal("edit", btn.getAttribute("data-open-order"));
        });
    });
    root.querySelectorAll(".customer-refund-confirm-btn").forEach(btn => {
        btn.addEventListener("click", async e => {
            e.stopPropagation();
            const orderId = btn.getAttribute("data-order-id");
            const partId = btn.getAttribute("data-part-id");
            if (!hasElevatedAccess()) {
                await requestCustomerRefundConfirm(orderId, partId);
                openCustomerHistoryModal(customerId);
                return;
            }
            confirmAction({
                title: "تأكيد إرجاع هذا المبلغ للعميل؟",
                message: "رح يُخصم المبلغ تلقائيًا من صافي الصندوق.",
                confirmLabel: "تم الإرجاع",
                dangerous: true,
                onConfirm: async () => {
                    const order = appData.orders.find(o => o.id === orderId);
                    if (!order) return;
                    const part = (order.parts || []).find(p => p.id === partId);
                    if (!part) return;
                    const prevUpdatedAt = order.updatedAt;
                    part.customerRefundConfirmed = true;
                    order.updatedAt = (new Date).toISOString();
                    const saved = await persistOrder(order);
                    if (!saved) {
                        delete part.customerRefundConfirmed;
                        order.updatedAt = prevUpdatedAt;
                        return;
                    }
                    showToast("تم تسجيل إرجاع المبلغ، وخُصم من الصندوق", "ok");
                    refreshCustomersList();
                    updateCustomersBadge();
                    renderKPIs();
                    openCustomerHistoryModal(customerId);
                }
            });
        });
    });
}

function customersMatchingSearch(refundsIdx, sortIdx) {

    if (q) {
        rows = rows.filter(c => {

        });
    }
    if (sortIdx) {
        return [ ...rows ].sort((a, b) => (sortIdx[b.id] || 0) - (sortIdx[a.id] || 0));
    }
    return [ ...rows ].sort((a, b) => {
        const ap = (idx[a.id] || 0) > 0 ? 1 : 0;
        const bp = (idx[b.id] || 0) > 0 ? 1 : 0;
        if (bp - ap) return bp - ap;
        return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
    });
}

function monthlySalesGrowth(monthsBack) {
    monthsBack = monthsBack || 6;
    const byMonth = {};
    (appData.orders || []).forEach(o => {
        if (!o.supplied || !o.suppliedAt) return;
        const d = new Date(o.suppliedAt);
        if (isNaN(d.getTime())) return;
        const t = orderTotals(o);
        if (!t.hasChargeable) return;
        const key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
        if (!byMonth[key]) byMonth[key] = {
            sales: 0,
            profit: 0,
            salesPaid: 0,
            profitPaid: 0
        };
        byMonth[key].sales += t.sellTotal;
        byMonth[key].profit += t.profit;
        byMonth[key].salesPaid += t.customerPaidAmount;
        byMonth[key].profitPaid += t.collectedProfit;
    });
    const now = new Date;
    const months = [];
    for (let i = monthsBack - 1; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        months.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"));
    }
    const emptyMonth = {
        sales: 0,
        profit: 0,
        salesPaid: 0,
        profitPaid: 0
    };
    const growthOf = (cur, prev) => prev > 0 ? round2((cur - prev) / prev * 100) : null;
    const rows = months.map((key, i) => {
        const cur = byMonth[key] || emptyMonth;
        const prev = i > 0 ? byMonth[months[i - 1]] || emptyMonth : emptyMonth;
        return {
            key: key,
            sales: round2(cur.sales),
            profit: round2(cur.profit),
            salesGrowth: i > 0 ? growthOf(cur.sales, prev.sales) : null,
            profitGrowth: i > 0 ? growthOf(cur.profit, prev.profit) : null,
            salesPaid: round2(cur.salesPaid),
            profitPaid: round2(cur.profitPaid),
            salesPaidGrowth: i > 0 ? growthOf(cur.salesPaid, prev.salesPaid) : null,
            profitPaidGrowth: i > 0 ? growthOf(cur.profitPaid, prev.profitPaid) : null
        };
    });
    const firstActiveIdx = rows.findIndex(r => r.sales > 0 || r.profit > 0);
    return firstActiveIdx === -1 ? rows.slice(-1) : rows.slice(firstActiveIdx);
}

function fmtPercentSigned(n) {
    if (n === null || n === undefined) return "—";

const SALES_KPI_BUSINESS_START_HOUR = 9;

const SALES_KPI_BUSINESS_END_HOUR = 18;

function stepTimingAverages(periodKey, customMonth) {
    if (!quoteReadyFirstByOrderId) return null;
    const toQuote = [], toSupply = [], total = [];
    (appData.orders || []).forEach(o => {
        if (!o.supplied || !o.suppliedAt || !o.createdAt) return;
        if (!dateMatchesPeriod(periodDateOf(o.createdAt), periodKey, customMonth)) return;
        const createdMs = new Date(o.createdAt).getTime();
        const suppliedMs = new Date(o.suppliedAt).getTime();
        if (isNaN(createdMs) || isNaN(suppliedMs) || suppliedMs <= createdMs) return;
        total.push(businessMinutesBetween(createdMs, suppliedMs, SALES_KPI_BUSINESS_START_HOUR, SALES_KPI_BUSINESS_END_HOUR));
        const quoteReadyIso = quoteReadyFirstByOrderId.get(o.id);
        if (quoteReadyIso) {
            const quoteMs = new Date(quoteReadyIso).getTime();
            if (!isNaN(quoteMs) && quoteMs > createdMs) toQuote.push(businessMinutesBetween(createdMs, quoteMs, SALES_KPI_BUSINESS_START_HOUR, SALES_KPI_BUSINESS_END_HOUR));
            if (!isNaN(quoteMs) && suppliedMs > quoteMs) toSupply.push(businessMinutesBetween(quoteMs, suppliedMs, SALES_KPI_BUSINESS_START_HOUR, SALES_KPI_BUSINESS_END_HOUR));
        }
    });
    const avgMinutes = arr => arr.length ? Math.round(arr.reduce((s, v) => s + v, 0) / arr.length) : null;
    return {
        toQuote: avgMinutes(toQuote),
        toQuoteCount: toQuote.length,
        toSupply: avgMinutes(toSupply),
        toSupplyCount: toSupply.length,
        total: avgMinutes(total),
        totalCount: total.length
    };
}

let storageUsageState = null;

let storageUsageGen = 0;

function fmtStorageBytes(n) {
    n = Math.max(0, Number(n) || 0);
    if (n >= 1e9) return (n / 1e9).toFixed(2) + " جيجا";
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e8 ? 0 : 1) + " ميجا";
    return Math.round(n / 1e3) + " كيلو";
}

function storageUsageSummary(u) {
    u = u || {};
    const lim = u.limits || {};
    const num = v => Math.max(0, Number(v) || 0);
    const pct = (used, quota) => quota > 0 ? Math.round(used / quota * 1e3) / 10 : null;
    const media = num(u.media_bytes), mediaQuota = num(lim.media_quota_bytes);
    const db = num(u.db_bytes), dbQuota = num(lim.db_quota_bytes);
    const groups = {
        photos: {
            n: 0,
            bytes: 0
        },
        videos: {
            n: 0,
            bytes: 0
        },
        vin: {
            n: 0,
            bytes: 0
        }
    };
    const bt = u.by_type || {};
    Object.keys(bt).forEach(k => {
        const v = bt[k] || {};
        const g = k === "image:vin" ? groups.vin : k.indexOf("video:") === 0 ? groups.videos : groups.photos;
        g.n += num(v.n);
        g.bytes += num(v.bytes);
    });
    const last30 = num(u.last30d_bytes);
    const runwayMonths = mediaQuota > 0 && last30 > 0 ? Math.max(0, Math.round((mediaQuota - media) / last30 * 10) / 10) : null;
    return {
        media: media,
        mediaQuota: mediaQuota,
        mediaPct: pct(media, mediaQuota),
        db: db,
        dbQuota: dbQuota,
        dbPct: pct(db, dbQuota),
        groups: groups,
        trash: num(u.trash_bytes),
        orphan: num(u.orphan_bytes),
        last30: last30,
        runwayMonths: runwayMonths,
        fired: Array.isArray(u.fired) ? u.fired : []
    };
}

function storageUsageBarRowHtml(label, pct) {
    const w = pct == null ? 0 : Math.min(100, Math.max(2, pct));
    const color = pct == null ? "" : pct >= 95 ? "var(--rust)" : pct >= 70 ? "var(--amber)" : "";
    return '<div class="stat-bar-row">' + '<span class="stat-bar-label" title="' + escapeHtml(label) + '">' + escapeHtml(label) + "</span>" + '<span class="stat-bar-track"><span class="stat-bar-fill" style="width:' + w + "%" + (color ? ";background:" + color : "") + '"></span></span>' + '<span class="stat-bar-value">' + (pct == null ? "—" : pct + "%") + "</span>" + "</div>";
}

function storageUsageCardInnerHtml() {
    const st = storageUsageState;
    const head = '<div class="stat-chart-title">💾 مساحة التخزين</div>';
    if (!st || st.status === "loading") return head + '<div class="expense-empty-hint">جارِ التحميل...</div>';
    if (st.status === "error") return head + '<div class="expense-empty-hint">تعذر تحميل أرقام التخزين — ' + escapeHtml(st.msg || "") + "</div>";
    const s = storageUsageSummary(st.data);
    const row = (label, value) => '<div class="treasury-summary-row" style="gap:10px;"><span>' + label + '</span><span class="num" style="text-align:left;">' + value + "</span></div>";
    const metricLabel = m => m === "db" ? "🗄️ القاعدة" : "📦 الوسائط";
    const firedHtml = s.fired.length ? '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;">' + s.fired.map(f => {
        const t = Number(f.threshold) || 0;
        const ms = new Date(f.fired_at).getTime();
        return '<span class="stamp ' + (t >= 95 ? "stamp-rust" : "stamp-amber") + '">' + metricLabel(f.metric) + " " + t + "%" + (isFinite(ms) ? " · " + escapeHtml(arabicRelativeTime(ms)) : "") + "</span>";
    }).join("") + "</div>" : "";
    return head + storageUsageBarRowHtml("الوسائط", s.mediaPct) + storageUsageBarRowHtml("القاعدة", s.dbPct) + '<div class="treasury-summary">' + row("📦 الصور والفيديو", fmtStorageBytes(s.media) + " من " + fmtStorageBytes(s.mediaQuota)) + row("🗄️ قاعدة البيانات", fmtStorageBytes(s.db) + " من " + fmtStorageBytes(s.dbQuota)) + row("📷 صور (" + s.groups.photos.n + ")", fmtStorageBytes(s.groups.photos.bytes)) + row("🎥 فيديو (" + s.groups.videos.n + ")", fmtStorageBytes(s.groups.videos.bytes)) + row("🪪 رقم الهيكل (" + s.groups.vin.n + ")", fmtStorageBytes(s.groups.vin.bytes)) + row("🗑️ سلة الوسائط", fmtStorageBytes(s.trash)) + row("❔ ملفات غير مرتبطة", fmtStorageBytes(s.orphan)) + row("📈 زيادة آخر 30 يوم", fmtStorageBytes(s.last30)) + row("⏳ المساحة بتكفي تقريبًا", s.runwayMonths == null ? "—" : s.runwayMonths > 99 ? "+99 شهر" : s.runwayMonths + " شهر") + "</div>" + firedHtml + '<p class="add-part-hint" style="margin:10px 0 0;">الترافيك (Egress) ما بينقاس من هون — راجع لوحة Supabase</p>';
}

async function loadStorageUsageCard() {
    const gen = ++storageUsageGen;
    storageUsageState = {
        status: "loading"
    };
    refreshStorageUsageCard();
    try {
        if (!sb) throw new Error("NO_DB");
        const {data: data, error: error} = await withTimeout(sb.rpc("get_storage_usage"), GUARDED_AWAIT_TIMEOUT_MS, "get_storage_usage");
        if (gen !== storageUsageGen) return;
        if (error) throw error;
        storageUsageState = {
            status: "ok",
            data: data || {}
        };
    } catch (e) {
        if (gen !== storageUsageGen) return;
        console.error("loadStorageUsageCard:", e);
        storageUsageState = {
            status: "error",
            msg: friendlyErrorText(e)
        };
    }
    refreshStorageUsageCard();
}

async function showAppIfAllowed(session) {
    const email = (session && session.user && session.user.email || "").toLowerCase();
    if (!email) return;
    if (shownForEmail === email) return;
    if (showAppInFlightFor === email) return;
    showAppInFlightFor = email;
    try {
        let role = "full";
        try {
            const {data: data, error: error} = await sb.from("allowed_emails").select("email, role").eq("email", email).maybeSingle();
            if (error) throw error;
            if (!data) {
                await sb.auth.signOut();
                showAuthGate("هذا البريد (" + email + ") غير مصرّح له بالدخول لهذا التطبيق. تواصل مع الإدارة إذا كنت تعتقد إنه خطأ.", "error");
                return;
            }
            role = data.role || "full";
            currentUserRole = role;
        } catch (e) {
            showAuthGate("تعذر التحقق من صلاحية الدخول — تحقق من الاتصال.", "error");
            showAuthRetry(session);
            return;
        }
        await refreshElevatedAccessEmails(email);
        if (shownForEmail === email) return;
        document.getElementById("auth-gate").classList.add("hidden");
        shownForEmail = email;
        mediaResetState();
        if (role === "scrapyard") {
            document.getElementById("app-root").style.display = "none";
            document.getElementById("scrapyard-root").style.display = "";
            initScrapyardView(email);
            return;
        }
        document.getElementById("scrapyard-root").style.display = "none";
        document.getElementById("app-root").style.display = "";
        startPresenceHeartbeat(email);
        const welcomeEl = document.getElementById("app-welcome-greeting");
        if (welcomeEl) welcomeEl.textContent = "اهلا " + displayNameForEmail(email);
        loadAnnouncement();
        subscribeAnnouncementRealtime();
        subscribeOrderMediaRealtime();
        const treasuryBtn = document.getElementById("btn-open-treasury");
        if (treasuryBtn) treasuryBtn.style.display = currentUserIsElevated ? "" : "none";
        const announcementBtn = document.getElementById("btn-announcement");
        if (announcementBtn) announcementBtn.style.display = currentUserIsElevated ? "" : "none";
        const whoOnlineBtn = document.getElementById("btn-who-online");
        if (whoOnlineBtn) whoOnlineBtn.style.display = currentUserIsElevated || WHO_ONLINE_EXTRA_VISIBLE_EMAILS.includes(email) ? "" : "none";
        const employeeMapBtnVis = document.getElementById("btn-employee-map");
        if (employeeMapBtnVis) employeeMapBtnVis.style.display = currentUserIsElevated ? "" : "none";
        const attendanceChartBtnVis = document.getElementById("btn-attendance-chart");
        if (attendanceChartBtnVis) attendanceChartBtnVis.style.display = currentUserIsElevated ? "" : "none";
        const suppliersBtn = document.getElementById("btn-open-suppliers");
        if (suppliersBtn) suppliersBtn.style.display = currentUserIsElevated ? "" : "none";
        const settlementViewerBtn = document.getElementById("btn-open-settlement-viewer");
        if (settlementViewerBtn) settlementViewerBtn.style.display = !currentUserIsElevated && SETTLEMENT_VIEWER_EMAILS.includes(email) ? "" : "none";
        if (!appInitDone) {
            appInitDone = true;
            init();
        }
    } finally {
        if (showAppInFlightFor === email) showAppInFlightFor = null;
    }
}

function ownerScrapyardPartsFromAppData(kind) {
    const list = [];
    const isPaid = SETTLEMENT_KINDS[kind].isPaid;
    const wantUsed = kind === "used";
    appData.orders.filter(o => o.supplied && !isPaid(o)).forEach(o => {
        (o.parts || []).forEach(p => {
            if (p.returned) return;
            if (!partIsIncludedInOrder(o, p)) return;
            if (!!p.used === wantUsed) {
                list.push({
                    order_id: o.id,
                    order_number: o.orderNumber,
                    order_label: o.orderLabel,
                    supplied_at: o.suppliedAt || null,
                    part_id: p.id,
                    description: p.description,
                    qty: p.qty,
                    cost_price: p.costPrice,
                    supplier_id: p.supplierId || null,
                    note: p.scrapyardNote || "",
                    condition: p.condition || null
                });
            }
        });
    });
    list.sort((a, b) => {
        if (!a.supplied_at && !b.supplied_at) return 0;
        if (!a.supplied_at) return 1;
        if (!b.supplied_at) return -1;
        return new Date(b.supplied_at) - new Date(a.supplied_at);
    });
    return list;
}

function ownerScrapyardReturnReceivablesFromAppData(kind) {
    const list = [];
    const wantUsed = kind === "used";
    appData.orders.filter(o => o.confirmed).forEach(o => {
        (o.parts || []).forEach(p => {
            if (!p.returned || !p.returnHasReceivable || p.returnCollected) return;
            if (!!p.used !== wantUsed) return;
            if (!partIsIncludedInOrder(o, p)) return;
            list.push({
                order_id: o.id,
                order_number: o.orderNumber,
                order_label: o.orderLabel,
                part_id: p.id,
                description: p.description,
                qty: p.qty,
                cost_price: p.costPrice,
                supplier_id: p.supplierId || null,
                condition: wantUsed ? p.condition || null : null
            });
        });
    });
    return list;
}

function scrapyardCustodyUnseenCount() {

let scrapyardDataLoadSeq = 0;

async function loadScrapyardData(kind) {
    const mySeq = ++scrapyardDataLoadSeq;
    const previousKind = scrapyardSharedState.activeKind;
    let result;
    try {
        if (scrapyardSharedState.viewerOnly) {
            const parts = ownerScrapyardPartsFromAppData(kind);
            const returnReceivables = ownerScrapyardReturnReceivablesFromAppData(kind);
            const [amerCustodyRes, omarCustodyRes, supNamesRes, proposalsRes] = await Promise.all([ kind === "used" ? sb.rpc("get_amer_custody_balance") : Promise.resolve({
                data: 0
            }), kind === "used" ? sb.rpc("get_omar_custody_balance") : Promise.resolve({
                data: 0
            }), sb.rpc("get_settlement_supplier_names"), sb.from("scrapyard_proposals").select("*").eq("kind", kind).order("created_at", {
                ascending: false
            }) ]);
            result = {
                parts: parts,
                returnReceivables: returnReceivables,
                custodyBalance: (amerCustodyRes.error ? 0 : Number(amerCustodyRes.data) || 0) + (omarCustodyRes.error ? 0 : Number(omarCustodyRes.data) || 0),
                proposals: proposalsRes.error ? [] : proposalsRes.data || [],
                confirmations: [],
                suppliers: supNamesRes.error ? [] : supNamesRes.data || []
            };
        } else if (scrapyardSharedState.canManage) {
            const parts = ownerScrapyardPartsFromAppData(kind);
            const returnReceivables = ownerScrapyardReturnReceivablesFromAppData(kind);
            const amerBalance = kind === "used" ? amerCustodyBalance() : 0;
            const omarBalance = kind === "used" ? omarCustodyBalance() : 0;
            const [proposalsRes, confirmationsRes, suppliersRes] = await Promise.all([ sb.from("scrapyard_proposals").select("*").eq("kind", kind).order("created_at", {
                ascending: false
            }), sb.from("scrapyard_order_confirmations").select("*").eq("kind", kind), sb.from("suppliers").select("*") ]);
            if (proposalsRes.error) throw proposalsRes.error;
            result = {
                parts: parts,
                returnReceivables: returnReceivables,
                custodyBalance: round2(amerBalance + omarBalance),
                amerCustodyBalance: amerBalance,
                omarCustodyBalance: omarBalance,
                proposals: proposalsRes.data || [],
                confirmations: confirmationsRes.data || [],
                suppliers: suppliersRes.error ? [] : suppliersRes.data || []
            };
        } else {
            const myCustodyRpc = scrapyardSharedState.email === "iomar.aljohnii@gmail.com" ? "get_omar_custody_balance" : "get_amer_custody_balance";
            const custodyPromise = kind === "used" ? sb.rpc(myCustodyRpc) : Promise.resolve({
                data: 0
            });
            const [partsRes, returnReceivablesRes, proposalsRes, confirmationsRes, suppliersRes, custodyRes] = await Promise.all([ sb.rpc(SETTLEMENT_KINDS[kind].rpc), sb.rpc("get_scrapyard_return_receivables", {
                p_kind: kind
            }), sb.from("scrapyard_proposals").select("*").eq("kind", kind).eq("submitted_by", scrapyardSharedState.email).order("created_at", {
                ascending: false
            }), sb.from("scrapyard_order_confirmations").select("*").eq("kind", kind), sb.from("suppliers").select("*"), custodyPromise ]);
            if (partsRes.error) throw partsRes.error;
            result = {
                parts: partsRes.data || [],
                returnReceivables: returnReceivablesRes.error ? [] : returnReceivablesRes.data || [],
                proposals: proposalsRes.data || [],
                confirmations: confirmationsRes.data || [],
                suppliers: suppliersRes.error ? [] : suppliersRes.data || [],
                custodyBalance: custodyRes.error ? 0 : Number(custodyRes.data) || 0
            };
        }
    } catch (e) {
        if (mySeq !== scrapyardDataLoadSeq) return false;
        scrapyardSharedState.activeKind = previousKind || kind;
        scrapyardSharedState.parts = [];
        scrapyardSharedState.returnReceivables = [];
        scrapyardSharedState.proposals = [];
        scrapyardSharedState.confirmations = [];
        scrapyardSharedState.loadFailed = true;
        showToast("تعذر تحميل بيانات " + SETTLEMENT_KINDS[kind].title + " — تحقق من الاتصال وحاول مرة تانية", "error");
        return false;
    }
    if (mySeq !== scrapyardDataLoadSeq) return false;
    Object.assign(scrapyardSharedState, result, {
        activeKind: kind,
        loadFailed: false
    });
    if (previousKind && previousKind !== kind) {
        scrapyardAddDrafts = {};
        scrapyardPriceDrafts = {};
        scrapyardEditOpenFor = {};
    }
    return true;
}

function groupScrapyardPartsByOrder(parts) {
    const map = {};
    const order = [];
    parts.forEach(p => {
        if (!map[p.order_id]) {
            map[p.order_id] = {
                order_id: p.order_id,
                order_number: p.order_number,
                order_label: p.order_label,
                supplied_at: p.supplied_at || null,
                parts: []
            };
            order.push(map[p.order_id]);
        }
        map[p.order_id].parts.push(p);
    });
    return order;
}

function scrapyardDaysSinceSupply(suppliedAt) {
    if (!suppliedAt) return null;
    const supplied = new Date(suppliedAt);
    if (isNaN(supplied.getTime())) return null;
    return Math.max(0, Math.floor((Date.now() - supplied.getTime()) / 864e5));
}

function arabicDaysLabel(n) {
    if (n === 0) return "منذ اليوم";
    if (n === 1) return "منذ يوم";
    if (n === 2) return "منذ يومان";
    if (n <= 10) return "منذ " + n + " أيام";
    return "منذ " + n + " يوم";
}

function scrapyardDaysSinceSupplyBadgeHtml(suppliedAt) {
    const days = scrapyardDaysSinceSupply(suppliedAt);
    if (days == null) return "";
    const level = days > 7 ? "text-rust" : days >= 4 ? "text-amber" : "muted";
    return '<span class="scrapyard-days-since ' + level + '" title="مرّ على التوريد — لمعرفة التأخير بالسداد">⏱️ ' + arabicDaysLabel(days) + "</span>";
}

function scrapyardGroupProposedSubtotal(group) {
    let changed = false;
    let total = group.parts.reduce((s, p) => {
        const qty = Number(p.qty) || 1;
        const pr = scrapyardProposalForPart(p.part_id);
        if (pr) {
            changed = true;
            if (pr.action === "delete") return s;
            if (pr.action === "edit") return s + (Number(pr.cost_price) || 0) * qty;
            return s + (Number(p.cost_price) || 0) * qty;
        }
        if (scrapyardEditOpenFor[p.part_id]) {
            const draft = scrapyardPriceDrafts[p.part_id];
            if (draft !== undefined && draft !== "" && !isNaN(Number(draft))) {
                changed = true;
                return s + Number(draft) * qty;
            }
        }
        return s + (Number(p.cost_price) || 0) * qty;
    }, 0);
    const addProposals = scrapyardAddProposalsForOrder(group.order_id);
    if (addProposals.length) {
        changed = true;
        total += addProposals.reduce((s, pr) => s + (Number(pr.cost_price) || 0) * (Number(pr.qty) || 1), 0);
    }
    const addDraft = scrapyardAddDrafts[group.order_id];
    if (addDraft && addDraft.price) {
        changed = true;
        total += (Number(addDraft.price) || 0) * (Number(addDraft.qty) || 1);
    }
    return changed ? total : null;
}

function scrapyardSupplierTotals() {
    const totals = {};
    (scrapyardSharedState.parts || []).forEach(p => {
        if (!p.supplier_id) return;
        totals[p.supplier_id] = round2((totals[p.supplier_id] || 0) + (Number(p.cost_price) || 0) * (Number(p.qty) || 1));
    });
    (scrapyardSharedState.returnReceivables || []).forEach(p => {
        if (!p.supplier_id || totals[p.supplier_id] === undefined) return;
        totals[p.supplier_id] = round2(totals[p.supplier_id] - (Number(p.cost_price) || 0) * (Number(p.qty) || 1));
    });
    Object.keys(totals).forEach(sid => {
        totals[sid] = Math.max(0, totals[sid]);
    });
    return totals;
}

function scrapyardMarkCollectedDirect(orderId, partId) {
    const order = appData.orders.find(o => o.id === orderId);
    if (!order) return;
    const part = (order.parts || []).find(p => p.id === partId);
    if (!part) return;
    const isUsed = !!part.used;
    confirmAction({
        title: isUsed ? "تأكيد تحصيل هذا المبلغ من التشليح؟" : "تأكيد تحصيل هذا المبلغ من المورد؟",
        message: isUsed ? 'رح يُضاف لرصيد المشتريات. لو تبي ترجعه للصندوق، فيه "سحب من العهدة" بشاشة الصندوق.' : "رح يُضاف المبلغ تلقائيًا لصافي الصندوق.",
        confirmLabel: "تم التحصيل",
        onConfirm: async () => {
            const freshOrder = appData.orders.find(o => o.id === orderId);
            if (!freshOrder) return;
            const freshPart = (freshOrder.parts || []).find(p => p.id === partId);
            if (!freshPart || freshPart.returnCollected) return;
            const prevUpdatedAt = freshOrder.updatedAt;
            freshPart.returnCollected = true;
            freshOrder.updatedAt = (new Date).toISOString();
            const saved = await persistOrder(freshOrder);
            if (!saved) {
                freshPart.returnCollected = false;
                freshOrder.updatedAt = prevUpdatedAt;
                return;
            }
            const stalePending = pendingActionProposalFor("return_collect", orderId, partId);
            if (stalePending) await sb.from("edit_proposals").delete().eq("id", stalePending.id);
            showToast("تم تسجيل التحصيل" + (isUsed ? "، وأُضيف لرصيد المشتريات" : "، وأُضيف المبلغ للصندوق"), "ok");
            await refreshEditProposals();
            await loadScrapyardData(scrapyardSharedState.activeKind);
            renderScrapyardView();
        }
    });
}

    const total = round2(rawTotal - returnReceivablesTotal);
    const canManage = scrapyardSharedState.canManage;
    const viewerOnly = scrapyardSharedState.viewerOnly;

div>' + '<div class="settlement-summary-final"><span>المتبقي للسداد</span><span class="num ' + (remainingToPay > 0 ? "text-rust" : "text-green") + '">' + fmtMoney(remainingToPay) + "</span></div>" + "</div>" : '<div class="total-box" style="margin-bottom:18px;"><span>إجمالي المستحق للسداد</span><span class="num text-amber">' + fmtMoney(total) + "</span></div>") + (kind === "used" && canManage ? '<div class="cost-split-row" style="margin-bottom:18px;">' + '<div class="settlement-summary-card" style="margin-bottom:0;">' + '<div class="settlement-summary-row"><span>عهدة عامر</span><span class="num ' + ((scrapyardSharedState.amerCustodyBalance || 0) < 0 ? "text-rust" : "text-green") + '">' + fmtMoney(scrapyardSharedState.amerCustodyBalance || 0) + "</span></div>" + '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">' + '<button type="button" class="btn btn-ghost btn-sm" id="btn-add-amer-custody-topup">+ سداد</button>' + '<button type="button" class="btn btn-ghost btn-sm" id="btn-withdraw-amer-custody">➖ سحب</button>' + '<button type="button" class="expense-history-btn" id="btn-history-amer-custody">📋 السجل (' + (appData.treasury.amerCustody || []).length + ")</button>" + "</div>" + "</div>" + '<div class="settlement-summary-card" style="margin-bottom:0;">' + '<div class="settlement-summary-row"><span>عهدة عمر</span><span class="num ' + ((scrapyardSharedState.omarCustodyBalance || 0) < 0 ? "text-rust" : "text-green") + '">' + fmtMoney(scrapyardSharedState.omarCustodyBalance || 0) + "</span></div>" + '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">' + '<button type="button" class="btn btn-ghost btn-sm" id="btn-add-omar-custody-topup">+ سداد</button>' + '<button type="button" class="btn btn-ghost btn-sm" id="btn-withdraw-omar-custody">➖ سحب</button>' + '<button type="button" class="expense-history-btn" id="btn-history-omar-custody">📋 السجل (' + (appData.treasury.omarCustody || []).length + ")</button>" + "</div>" + "</div>" + "</div>" : "") + (kind === "used" ? scrapyardSupplierTotalsHtml() : "") + scrapyardReturnReceivablesHtml() + '<div class="section-block"><div class="section-head"><span class="section-title">القطع (غير المسدّدة)</span></div>' + (groups.length ? groups.map(g => scrapyardOrderGroupHtml(g, canManage)).join("") : '<div class="expense-empty-hint">ما فيه قطع غير مسدّدة حاليًا</div>') + "</div>";

}

function confirmedAmountIsStale(confirmedAmount, currentAmount) {
    if (confirmedAmount == null || isNaN(confirmedAmount)) return false;
    return Math.abs(round2(confirmedAmount) - round2(currentAmount)) > .01;
}

function scrapyardOrderGroupHtml(group, canManage) {
    const subtotal = group.parts.reduce((s, p) => s + (Number(p.cost_price) || 0) * (Number(p.qty) || 1), 0);
    const proposedSubtotal = scrapyardGroupProposedSubtotal(group);
    const confirmation = scrapyardConfirmationForOrder(group.order_id);
    const addProposals = scrapyardAddProposalsForOrder(group.order_id);
    const addDraft = scrapyardAddDrafts[group.order_id];
    const confirmedAmount = confirmation && confirmation.confirmed_amount != null ? Number(confirmation.confirmed_amount) : null;
    const confirmationStale = confirmedAmountIsStale(confirmedAmount, subtotal);
    const isConfirmed = confirmedAmount != null;
    const isPaid = !!(confirmation && confirmation.paid);
    const canOpenOrderFromHere = canManage || scrapyardSharedState.viewerOnly;
    return '<div class="scrapyard-order-group' + (isPaid ? " scrapyard-order-group-paid" : "") + '">' + '<div class="scrapyard-order-header' + (canOpenOrderFromHere ? " scrapyard-order-header-clickable" : "") + '"' + (canOpenOrderFromHere ? ' data-open-order-scrapyard="' + escapeHtml(group.order_id) + '" title="فتح الطلبية"' : "") + ">" + escapeHtml(group.order_number || "") + (group.order_label ? " — " + escapeHtml(group.order_label) : "") + (isConfirmed && canManage ? confirmationStale ? '<span class="scrapyard-confirmed-check" title="أكّدها عامر على مبلغ ' + fmtMoney(confirmedAmount) + ' — المبلغ تغيّر بعدها">⚠️</span>' : '<span class="scrapyard-confirmed-check" title="أكّدها عامر">✅</span>' : "") + (isPaid && canManage ? '<span class="scrapyard-confirmed-check" title="سدّدها عامر">💰</span>' : "") + scrapyardDaysSinceSupplyBadgeHtml(group.supplied_at) + "</div>" + group.parts.map(p => scrapyardPartRowHtml(p, canManage)).join("") + addProposals.map(pr => scrapyardAddProposalInlineHtml(pr, canManage)).join("") + (addDraft ? scrapyardAddDraftRowHtml(group.order_id, addDraft) : "") + '<div class="scrapyard-order-subtotal">' + '<span class="scrapyard-subtotal-label">مجموع الطلبية</span>' + '<span class="scrapyard-qty-slot" aria-hidden="true"></span>' + '<div class="scrapyard-subtotal-values" id="scrapyard-subtotal-values-' + group.order_id + '">' + scrapyardSubtotalValuesHtml(subtotal, proposedSubtotal) + "</div>" + '<span class="scrapyard-mgmt-actions" aria-hidden="true"></span>' + "</div>" + (!canManage && !scrapyardSharedState.viewerOnly ? '<div class="scrapyard-order-actions">' + (addDraft ? "" : '<button type="button" class="btn btn-ghost btn-sm" data-add-part-order="' + escapeHtml(group.order_id) + '">+ اقتراح قطعة جديدة</button>') + (isConfirmed && !confirmationStale ? '<button type="button" class="btn btn-sm btn-confirmed-green" data-unconfirm-order="' + escapeHtml(group.order_id) + '" title="اضغط للتراجع عن التأكيد">✅ تم تأكيد المبلغ</button>' : isConfirmed ? '<button type="button" class="btn btn-amber btn-sm" data-confirm-order="' + escapeHtml(group.order_id) + '" title="أكّدت ' + fmtMoney(confirmedAmount) + ' والمبلغ تغيّر بعدها">⚠️ المبلغ تغيّر — أكّد من جديد</button>' : '<button type="button" class="btn btn-ghost btn-sm" data-confirm-order="' + escapeHtml(group.order_id) + '">تأكيد المبلغ</button>') + (isPaid ? '<button type="button" class="btn btn-sm btn-confirmed-green" data-unmark-paid-order="' + escapeHtml(group.order_id) + '" title="اضغط للتراجع عن السداد">✅ تم السداد</button>' : '<button type="button" class="btn btn-ghost btn-sm" data-mark-paid-order="' + escapeHtml(group.order_id) + '">💰 تم السداد</button>') + "</div>" : "") + "</div>";
}

function scrapyardSubtotalValuesHtml(subtotal, proposedSubtotal) {
    return '<span class="num scrapyard-subtotal-current">' + fmtMoney(subtotal) + "</span>" + (proposedSubtotal != null ? '<span class="scrapyard-subtotal-arrow">←</span><span class="num scrapyard-subtotal-new" title="المجموع الجديد بعد اقتراح السعر">' + fmtMoney(proposedSubtotal) + "</span>" : "");
}

function updateScrapyardSubtotalDisplay(orderId) {
    const el = document.getElementById("scrapyard-subtotal-values-" + orderId);
    if (!el) return;
    const parts = scrapyardSharedState.parts.filter(p => p.order_id === orderId);
    const subtotal = parts.reduce((s, p) => s + (Number(p.cost_price) || 0) * (Number(p.qty) || 1), 0);
    const proposedSubtotal = scrapyardGroupProposedSubtotal({
        order_id: orderId,
        parts: parts
    });
    el.innerHTML = scrapyardSubtotalValuesHtml(subtotal, proposedSubtotal);
}

function scrapyardPriceCellHtml(label, value, variant) {
    return '<div class="scrapyard-price-cell' + (variant ? " scrapyard-price-cell-" + variant : "") + '">' + "<span>" + label + "</span>" + '<span class="scrapyard-price-static' + (variant === "proposed" ? " scrapyard-price-static-proposed" : "") + ' num">' + fmtMoney(value) + "</span>" + "</div>";
}

function scrapyardPartRowHtml(p, canManage) {

            priceCells = scrapyardPriceCellHtml("السعر الحالي", p.cost_price, "current") + '<div class="scrapyard-price-cell scrapyard-price-cell-proposed"><span>المقترح</span><span class="stamp stamp-amber">حذف القطعة</span></div>';
        } else {
            priceCells = scrapyardPriceCellHtml("السعر الحالي", p.cost_price, "current") + scrapyardPriceCellHtml("السعر المقترح", proposal.cost_price, "proposed");
        }
        actions = scrapyardSharedState.viewerOnly ? "" : canManage ? '<div class="scrapyard-mgmt-actions">' + '<button type="button" class="icon-btn icon-btn-accept" data-accept-proposal="' + escapeHtml(proposal.id) + '" title="قبول" aria-label="قبول">✅</button>' + '<button type="button" class="icon-btn icon-btn-reject" data-reject-proposal="' + escapeHtml(proposal.id) + '" title="رفض" aria-label="رفض">❌</button>' + "</div>" : '<div class="scrapyard-mgmt-actions">' + '<button type="button" class="icon-btn" data-withdraw-proposal="' + escapeHtml(proposal.id) + '" title="تراجع عن السعر المقترح" aria-label="تراجع">↩️</button>' + "</div>";
    } else if (canManage || scrapyardSharedState.viewerOnly) {
        priceCells = scrapyardPriceCellHtml("السعر", p.cost_price, "current");
        actions = "";
    } else if (scrapyardEditOpenFor[p.part_id]) {
        const draftVal = scrapyardPriceDrafts[p.part_id];
        const inputVal = draftVal === undefined || draftVal === null ? "" : draftVal;
        priceCells = scrapyardPriceCellHtml("السعر الحالي", p.cost_price, "current") + '<div class="scrapyard-price-cell scrapyard-price-cell-proposed">' + "<span>السعر المقترح</span>" + '<input type="number" min="0" step="0.01" class="scrapyard-price-input num" placeholder="—" value="' + inputVal + '" data-price-draft="' + escapeHtml(p.part_id) + '" data-order-id="' + escapeHtml(p.order_id) + '" autofocus>' + "</div>";
        actions = '<div class="scrapyard-part-actions">' + '<button type="button" class="icon-btn icon-btn-accept" data-send-price="' + escapeHtml(p.part_id) + '" data-order-id="' + escapeHtml(p.order_id) + '" title="إرسال السعر المقترح" aria-label="إرسال السعر المقترح">✓</button>' + '<button type="button" class="icon-btn" data-cancel-price-edit="' + escapeHtml(p.part_id) + '" title="إلغاء" aria-label="إلغاء">✕</button>' + "</div>";
    } else {
        priceCells = scrapyardPriceCellHtml("السعر", p.cost_price, "current");
        actions = '<div class="scrapyard-part-actions">' + '<button type="button" class="icon-btn" data-open-price-edit="' + escapeHtml(p.part_id) + '" title="تعديل السعر" aria-label="تعديل السعر">✏️ تعديل</button>' + '<button type="button" class="icon-btn icon-btn-danger" data-propose-delete="' + escapeHtml(p.part_id) + '" data-order-id="' + escapeHtml(p.order_id) + '" title="اقتراح حذف" aria-label="اقتراح حذف">✕</button>' + "</div>";
    }
    const supplierSelectHtml = canManage || scrapyardSharedState.viewerOnly || scrapyardSharedState.activeKind !== "used" ? "" : '<div class="scrapyard-supplier-select-wrap" data-part-id="' + escapeHtml(p.part_id) + '" data-order-id="' + escapeHtml(p.order_id) + '">' + searchableSelectHtml("scrapyard-supplier-select", (scrapyardSharedState.suppliers || []).filter(s => s.handles_used !== false).map(s => ({
        id: s.id,
        label: s.name || s.phone || "مورد",
        sublabel: s.phone
    })), p.supplier_id, "— بدون تشليح —") + "</div>";
    const assignedSupplier = p.supplier_id ? (scrapyardSharedState.suppliers || []).find(s => s.id === p.supplier_id) : null;
    const isUsedKind = scrapyardSharedState.activeKind === "used";
    const supplierNameText = assignedSupplier ? assignedSupplier.name || assignedSupplier.phone || (isUsedKind ? "تشليح" : "مورد") : isUsedKind ? "ما تم اضافة تشليح" : "ما تم اضافة مورد";
    const supplierNameHtml = '<span class="scrapyard-part-supplier-name' + (assignedSupplier ? "" : " scrapyard-part-supplier-missing") + '">' + escapeHtml(supplierNameText) + "</span>";
    const conditionBadgeHtml = isUsedKind ? partConditionBadgeFromValue(p.condition) : "";
    const noteHtml = canManage ? '<div class="scrapyard-part-note-row"><input type="text" class="scrapyard-note-input" placeholder="ملاحظة لعامر (تظهر بالأحمر)…" value="' + escapeHtml(p.note || "") + '" data-scrapyard-note="' + escapeHtml(p.part_id) + '" data-order-id="' + escapeHtml(p.order_id) + '"></div>' : p.note ? '<div class="scrapyard-part-note-row scrapyard-part-note-amer">⚠️ ' + escapeHtml(p.note) + "</div>" : "";
    return '<div class="scrapyard-part-row">' + '<span class="scrapyard-part-desc">' + escapeHtml(p.description || "") + supplierNameHtml + conditionBadgeHtml + "</span>" + '<span class="num scrapyard-qty-slot">×' + (p.qty || 1) + "</span>" + '<div class="scrapyard-price-group">' + priceCells + "</div>" + supplierSelectHtml + actions + "</div>" + noteHtml;
}

function scrapyardAddProposalInlineHtml(pr, canManage) {
    const desc = "إضافة: " + escapeHtml(pr.description || "");

    if (canManage) {
        return '<div class="scrapyard-part-row">' + '<span class="scrapyard-part-desc">' + desc + "</span>" + '<span class="num scrapyard-qty-slot">×' + (pr.qty || 1) + "</span>" + '<div class="scrapyard-price-group">' + priceCells + "</div>" + '<div class="scrapyard-mgmt-actions">' + '<button type="button" class="icon-btn icon-btn-accept" data-accept-proposal="' + escapeHtml(pr.id) + '" title="قبول" aria-label="قبول">✅</button>' + '<button type="button" class="icon-btn icon-btn-reject" data-reject-proposal="' + escapeHtml(pr.id) + '" title="رفض" aria-label="رفض">❌</button>' + "</div>" + "</div>";

}

function scrapyardAddDraftRowHtml(orderId, d) {
    return '<div class="scrapyard-part-row" data-add-draft-order="' + escapeHtml(orderId) + '">' + '<input type="text" class="part-desc-input" placeholder="وصف القطعة" value="' + escapeHtml(d.description || "") + '" data-add-desc="' + escapeHtml(orderId) + '">' + '<div class="scrapyard-price-group">' + '<div class="scrapyard-price-cell"><span>العدد</span>' + '<input type="number" min="1" step="1" class="part-qty-input num" value="' + escapeHtml(d.qty || 1) + '" data-add-qty="' + escapeHtml(orderId) + '">' + "</div>" + '<div class="scrapyard-price-cell scrapyard-price-cell-proposed"><span>السعر المقترح</span>' + '<input type="number" min="0" step="0.01" class="scrapyard-price-input num" placeholder="—" value="' + escapeHtml(d.price == null ? "" : d.price) + '" data-add-price="' + escapeHtml(orderId) + '">' + "</div>" + "</div>" + '<div class="scrapyard-part-actions">' + '<button type="button" class="icon-btn icon-btn-accept" data-send-add="' + escapeHtml(orderId) + '" title="إرسال الاقتراح" aria-label="إرسال الاقتراح">✓</button>' + '<button type="button" class="icon-btn icon-btn-danger" data-cancel-add="' + escapeHtml(orderId) + '" title="إلغاء" aria-label="إلغاء">✕</button>' + "</div>" + "</div>";
}

function withdrawScrapyardProposal(proposalId) {
    confirmAction({
        title: "تراجع عن هذا الاقتراح؟",
        message: "رح يُحذف الاقتراح ولن يوصل لصاحب الحساب.",
        confirmLabel: "تراجع",
        dangerous: true,
        onConfirm: async () => {
            const {error: error} = await sb.from("scrapyard_proposals").delete().eq("id", proposalId);
            if (error) {
                showToast("تعذر التراجع عن الاقتراح", "error");
                return;
            }
            showToast("تم التراجع عن الاقتراح", "ok");
            await loadScrapyardData(scrapyardSharedState.activeKind);
            renderScrapyardView();
        }
    });
}

function scrapyardOrderCurrentAmount(orderId) {
    return round2((scrapyardSharedState.parts || []).filter(p => p.order_id === orderId).reduce((s, p) => s + (Number(p.cost_price) || 0) * (Number(p.qty) || 1), 0));
}

        order_id: orderId,
        kind: scrapyardSharedState.activeKind,
        confirmed_by: scrapyardSharedState.email,
        confirmed_at: (new Date).toISOString(),

function bindScrapyardEvents() {
    const root = document.getElementById("scrapyard-root");
    const exitBtn = document.getElementById("btn-exit-scrapyard-shared");
    if (exitBtn) exitBtn.addEventListener("click", closeScrapyardSharedView);
    const backHomeBtn = document.getElementById("btn-scrapyard-back-home");
    if (backHomeBtn) backHomeBtn.addEventListener("click", goToScrapyardHome);
    const viewerBackBtn = document.getElementById("btn-settlement-viewer-back");
    if (viewerBackBtn) viewerBackBtn.addEventListener("click", closeSettlementViewer);
    root.querySelectorAll("[data-settlement-viewer-kind]").forEach(btn => {
        btn.addEventListener("click", () => switchSettlementViewerKind(btn.getAttribute("data-settlement-viewer-kind")));
    });
    const scrapLogo = document.getElementById("scrapyard-logo-img");
    if (scrapLogo) scrapLogo.addEventListener("click", scrapyardSharedState.viewerOnly ? closeSettlementViewer : goHomeFromLogo);
    bindScrapyardThemeToggle();
    function refreshCustodyBalancesAfterEdit() {

async function sendScrapyardPriceProposal(orderId, partId) {
    if (scrapyardProposalSending.has(partId)) return;
    const raw = scrapyardPriceDrafts[partId];
    const val = Number(raw);
    if (raw === undefined || raw === null || raw === "" || isNaN(val) || val < 0) {
        showToast("اكتب السعر المقترح أولاً", "error");
        return;
    }
    const part = scrapyardSharedState.parts.find(p => p.part_id === partId);
    if (part && Number(part.cost_price) === val) {
        showToast("السعر المقترح نفس السعر الحالي", "error");
        return;
    }
    scrapyardProposalSending.add(partId);
    const {error: error} = await sb.from("scrapyard_proposals").insert({
        order_id: orderId,
        part_id: partId,
        action: "edit",
        cost_price: val,
        submitted_by: scrapyardSharedState.email,
        kind: scrapyardSharedState.activeKind
    });
    scrapyardProposalSending.delete(partId);
    if (error) {
        showToast("تعذر إرسال الاقتراح", "error");
        return;
    }
    delete scrapyardPriceDrafts[partId];
    delete scrapyardEditOpenFor[partId];
    showToast("تم إرسال السعر المقترح", "ok");
    await loadScrapyardData(scrapyardSharedState.activeKind);
    renderScrapyardView();
}

async function sendScrapyardAddProposal(orderId) {
    if (scrapyardProposalSending.has(orderId)) return;
    const d = scrapyardAddDrafts[orderId];
    if (!d) return;
    const desc = (d.description || "").trim();
    const qty = Number(d.qty) || 1;
    const price = Number(d.price);
    if (!desc) {
        showToast("أدخل وصف القطعة", "error");
        return;
    }
    if (!qty || qty <= 0) {
        showToast("أدخل عدد صحيح", "error");
        return;
    }
    if (d.price === undefined || d.price === null || d.price === "" || isNaN(price) || price < 0) {
        showToast("أدخل سعر صحيح", "error");
        return;
    }
    scrapyardProposalSending.add(orderId);
    const {error: error} = await sb.from("scrapyard_proposals").insert({
        order_id: orderId,
        action: "add",
        description: desc,
        qty: qty,
        cost_price: price,
        submitted_by: scrapyardSharedState.email,
        kind: scrapyardSharedState.activeKind
    });
    scrapyardProposalSending.delete(orderId);
    if (error) {
        showToast("تعذر إرسال الاقتراح", "error");
        return;
    }
    delete scrapyardAddDrafts[orderId];
    showToast("تم إرسال الاقتراح", "ok");
    await loadScrapyardData(scrapyardSharedState.activeKind);
    renderScrapyardView();
}

const PRESENCE_HEARTBEAT_MS = 15e3;

const PRESENCE_ACTIVE_IDLE_LIMIT_MS = 6e4;

const PRESENCE_RECHECK_MS = 8e3;

let presenceEmail = null;

let lastActivityAt = Date.now();

let presenceCache = {};

function markActivity() {
    lastActivityAt = Date.now();
}

function sendPresenceHeartbeat() {
    if (!sb || !presenceEmail) return;
    if (Date.now() - lastActivityAt > PRESENCE_ACTIVE_IDLE_LIMIT_MS) return;
    sb.from("presence").upsert({
        email: presenceEmail,
        last_seen: new Date(lastActivityAt).toISOString()
    }).then(() => {}, () => {});
}

function computeOnlineList() {
    const cutoff = Date.now() - PRESENCE_ACTIVE_IDLE_LIMIT_MS;
    return Object.keys(presenceCache).filter(email => presenceCache[email] >= cutoff).sort((a, b) => presenceCache[b] - presenceCache[a]);
}

let lastOnlineListFetchAt = 0;

const ONLINE_LIST_MIN_REFRESH_GAP_MS = 3e3;

function refreshOnlineBadge() {
    const online = computeOnlineList();
    const whoOnlineBtn = document.getElementById("btn-who-online");
    if (whoOnlineBtn) whoOnlineBtn.textContent = "👥 " + online.length;
    if (document.getElementById("online-users-list")) {
        const now = Date.now();
        if (now - lastOnlineListFetchAt < ONLINE_LIST_MIN_REFRESH_GAP_MS) return;
        lastOnlineListFetchAt = now;
        loadAllPresenceRows().then(rows => {
            const listEl = document.getElementById("online-users-list");
            if (listEl) listEl.innerHTML = presenceListHtml(rows);
        });
    }
}

async function loadPresenceCache() {
    try {
        const cutoff = new Date(Date.now() - PRESENCE_ACTIVE_IDLE_LIMIT_MS).toISOString();
        const {data: data, error: error} = await sb.from("presence").select("email,last_seen").gte("last_seen", cutoff);
        if (error) throw error;
        presenceCache = {};
        (data || []).forEach(row => {
            presenceCache[row.email] = new Date(row.last_seen).getTime();
        });
    } catch (e) {}
    refreshOnlineBadge();
}

function subscribePresenceRealtime() {
    if (!sb || presenceChannel) return;
    presenceChannel = sb.channel("presence-changes").on("postgres_changes", {
        event: "*",
        schema: "public",
        table: "presence"
    }, payload => {
        if (payload.eventType === "DELETE") {
            const oldRow = payload.old;
            if (oldRow && oldRow.email) delete presenceCache[oldRow.email];
        } else if (payload.new && payload.new.email) {
            presenceCache[payload.new.email] = new Date(payload.new.last_seen).getTime();
        }
        refreshOnlineBadge();
    }).subscribe();
}

function startPresenceHeartbeat(email) {
    presenceEmail = email;
    lastActivityAt = Date.now();
    [ "mousemove", "keydown", "mousedown", "touchstart", "scroll" ].forEach(evt => {
        document.addEventListener(evt, markActivity, {
            passive: true
        });
    });
    sendPresenceHeartbeat();
    loadPresenceCache();
    subscribePresenceRealtime();
    startContinuousLocationReporting();
    enforceLocationRequired(email);
    if (presenceTimer) clearInterval(presenceTimer);
    if (presenceRecheckTimer) clearInterval(presenceRecheckTimer);
    if (quoteElapsedTimer) clearInterval(quoteElapsedTimer);
    quoteElapsedTimer = setInterval(refreshQuoteElapsedBadges, 6e4);
    clearTimeout(presenceTimerStartTimeout);
    clearTimeout(presenceRecheckStartTimeout);
    presenceTimerStartTimeout = setTimeout(() => {
        presenceTimer = setInterval(sendPresenceHeartbeat, PRESENCE_HEARTBEAT_MS);
    }, 1e3 + Math.random() * 2e3);
    presenceRecheckStartTimeout = setTimeout(() => {
        presenceRecheckTimer = setInterval(refreshOnlineBadge, PRESENCE_RECHECK_MS);
    }, 2500 + Math.random() * 2e3);
}

function arabicMinutesLabel(n) {
    if (n === 1) return "دقيقة";
    if (n === 2) return "دقيقتين";
    if (n >= 3 && n <= 10) return n + " دقائق";
    return n + " دقيقة";
}

function arabicHoursLabel(n) {
    if (n === 1) return "ساعة";
    if (n === 2) return "ساعتين";
    if (n >= 3 && n <= 10) return n + " ساعات";
    return n + " ساعة";
}

function arabicDaysCountLabel(n) {
    if (n === 1) return "يوم";
    if (n === 2) return "يومين";
    if (n >= 3 && n <= 10) return n + " أيام";
    return n + " يوم";
}

function arabicDurationLabelFromMinutes(diffMin) {
    if (diffMin < 1) return "الآن";
    if (diffMin < 60) return arabicMinutesLabel(diffMin);
    const diffHour = Math.floor(diffMin / 60);
    const remMin = diffMin % 60;
    if (diffHour < 24) {
        return arabicHoursLabel(diffHour) + (remMin > 0 ? " و " + arabicMinutesLabel(remMin) : "");
    }
    const diffDay = Math.floor(diffHour / 24);
    const remHour = diffHour % 24;
    if (diffDay <= 30) {
        return arabicDaysCountLabel(diffDay) + (remHour > 0 ? " و " + arabicHoursLabel(remHour) : "");
    }
    const diffMonth = Math.floor(diffDay / 30);
    if (diffMonth === 1) return "شهر";
    return diffMonth + " أشهر";
}

function arabicDurationLabel(ms) {
    const diffMin = Math.floor((Date.now() - ms) / 6e4);
    return arabicDurationLabelFromMinutes(diffMin);
}

function arabicRelativeTime(ms) {
    const label = arabicDurationLabel(ms);
    return label === "الآن" ? label : "قبل " + label;
}

function presenceListHtml(rows) {
    if (rows == null) return "تعذر تحميل بيانات الظهور";
    if (!rows.length) return "ما فيه بيانات ظهور حتى الآن";
    return '<div class="task-items-list">' + rows.map(row => {
        const ms = new Date(row.last_seen).getTime();
        const online = Date.now() - ms <= PRESENCE_ACTIVE_IDLE_LIMIT_MS;
        const label = online ? "متصل الآن" : arabicRelativeTime(ms);
        return '<div class="task-item-row"><span class="task-item-text">' + (online ? "🟢" : "⚪") + " " + escapeHtml(displayNameForEmail(row.email)) + (row.email === presenceEmail ? " (أنت)" : "") + " — " + label + "</span></div>";
    }).join("") + "</div>";
}

function recordLocationPoint() {

    if (LOCATION_SHARING_EXCLUDED_EMAILS.includes(presenceEmail)) return;
    if (document.visibilityState !== "visible") return;
    navigator.geolocation.getCurrentPosition(async pos => {
        try {
            await sb.from("employee_location_history").insert({
                email: presenceEmail,
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                accuracy: pos.coords.accuracy,
                recorded_at: (new Date).toISOString()
            });
        } catch (e) {
            console.error("recordLocationPoint:", e);
        }
    }, e => {
        console.error("geolocation error:", e);
    }, {
        enableHighAccuracy: false,

function showLocationGate(retryFn, reason) {
    let gate = document.getElementById("location-gate");
    if (!gate) {
        gate = document.createElement("div");
        gate.id = "location-gate";
        gate.className = "location-gate";
        gate.innerHTML = '<div class="location-gate-card">' + '<div class="location-gate-icon">📍</div>' + '<div class="location-gate-title" id="location-gate-title">يتطلب تفعيل الموقع</div>' + '<div class="location-gate-help" id="location-gate-help" style="display:none;"></div>' + '<button type="button" class="btn btn-ghost" id="location-gate-help-btn" style="width:100%;margin-bottom:10px;">⚙️ كيف أفعّل صلاحية الموقع؟</button>' + '<button type="button" class="btn btn-primary" id="location-gate-retry-btn" style="width:100%;">حاول مرة ثانية</button>' + "</div>";
        document.body.appendChild(gate);
    }
    gate.style.display = "flex";
    document.getElementById("location-gate-title").textContent = reason === "unavailable" ? "خدمة الموقع مطفأة على جهازك" : "يتطلب تفعيل الموقع";
    document.getElementById("location-gate-retry-btn").onclick = retryFn;
    const helpBtn = document.getElementById("location-gate-help-btn");
    const helpBox = document.getElementById("location-gate-help");
    helpBtn.textContent = reason === "unavailable" ? "⚙️ كيف أفعّل خدمة الموقع؟" : "⚙️ كيف أفعّل صلاحية الموقع؟";
    helpBtn.onclick = () => {

        } else {

function enforceLocationRequired(email) {
    if (LOCATION_SHARING_EXCLUDED_EMAILS.includes(email)) return;
    if (!navigator.geolocation) return;
    function attempt() {
        navigator.geolocation.getCurrentPosition(async pos => {
            hideLocationGate();
            if (!sb) return;
            try {
                await sb.from("employee_location_history").insert({
                    email: email,
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude,
                    accuracy: pos.coords.accuracy,
                    recorded_at: (new Date).toISOString()
                });
            } catch (e) {
                console.error("enforceLocationRequired insert:", e);
            }
        }, err => {
            if (LOCATION_MANDATORY_EXEMPT_EMAILS.includes(email)) return;
            showLocationGate(attempt, err.code === 1 ? "denied" : "unavailable");
        }, {
            enableHighAccuracy: false,
            timeout: 15e3
        });
    }
    attempt();
}

function dateToDatetimeLocalValue(d) {

    renderEmployeeMapMarkers(await loadEmployeeLocations());

function employeeMapMarkerIcon(email, stale, variant) {
    const label = displayNameForEmail(email);
    const dot = variant === "history" ? "🕐" : stale ? "⚪" : "🟢";
    return L.divIcon({
        className: "employee-map-marker" + (stale ? " employee-map-marker-stale" : ""),
        html: '<div class="employee-map-marker-label">' + dot + " " + escapeHtml(label) + "</div>"
    });
}

function renderEmployeeMapMarkers(rows) {
    if (!employeeMapInstance) return;
    const seen = new Set;
    (rows || []).forEach(row => {
        if (!row.email || row.lat == null || row.lng == null) return;
        seen.add(row.email);
        const stale = Date.now() - new Date(row.recorded_at).getTime() > EMPLOYEE_LOCATION_STALE_MS;
        const icon = employeeMapMarkerIcon(row.email, stale);
        const tooltipText = (stale ? "قبل " : "محدَّث ") + arabicRelativeTime(new Date(row.recorded_at).getTime());
        if (employeeMapMarkers[row.email]) {
            employeeMapMarkers[row.email].setLatLng([ row.lat, row.lng ]).setIcon(icon).setTooltipContent(tooltipText);
        } else {
            employeeMapMarkers[row.email] = L.marker([ row.lat, row.lng ], {
                icon: icon
            }).addTo(employeeMapInstance).bindTooltip(tooltipText);
        }
    });
    Object.keys(employeeMapMarkers).forEach(email => {
        if (!seen.has(email)) {
            employeeMapInstance.removeLayer(employeeMapMarkers[email]);
            delete employeeMapMarkers[email];
        }
    });
}

async function handleEmployeeMapHistorySearch() {
    if (!employeeMapInstance) return;
    const select = document.getElementById("employee-map-history-select");
    const timeInput = document.getElementById("employee-map-history-time");
    const resultEl = document.getElementById("employee-map-history-result");
    const email = select && select.value;
    if (!email) {
        if (resultEl) resultEl.textContent = "اختر موظف أولًا";
        return;
    }
    const timeVal = timeInput && timeInput.value;
    const isLatest = !timeVal;
    const isoTime = isLatest ? (new Date).toISOString() : new Date(timeVal).toISOString();
    if (resultEl) resultEl.textContent = "جاري البحث…";
    const point = await searchLocationAtTime(email, isoTime);
    if (!employeeMapInstance) return;
    if (!point) {
        if (resultEl) resultEl.textContent = "ما في أي موقع مسجّل لهذا الموظف" + (isLatest ? "" : " قبل هذا الوقت");
        return;
    }
    if (employeeMapHistoryMarker) {
        employeeMapInstance.removeLayer(employeeMapHistoryMarker);
        employeeMapHistoryMarker = null;
    }
    employeeMapHistoryMarker = L.marker([ point.lat, point.lng ], {
        icon: employeeMapMarkerIcon(point.email, false, "history")
    }).addTo(employeeMapInstance);
    employeeMapInstance.setView([ point.lat, point.lng ], 15);
    const recordedLabel = new Date(point.recorded_at).toLocaleString("ar-SY", {
        hour: "2-digit",
        minute: "2-digit",
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
    });
    if (resultEl) resultEl.textContent = (isLatest ? "آخر موقع معروف لـ " : "آخر موقع مسجّل لـ ") + displayNameForEmail(point.email) + " — الساعة " + recordedLabel;
}

function sessionizeLocationHistoryRows(rows) {
    const byEmail = {};
    (rows || []).forEach(r => {
        if (!r || r.email == null || r.recorded_at == null) return;
        (byEmail[r.email] = byEmail[r.email] || []).push(r);
    });
    const sessions = {};
    Object.keys(byEmail).forEach(email => {
        const list = [];
        let cur = null;
        byEmail[email].forEach(r => {
            const t = new Date(r.recorded_at).getTime();
            if (cur && t - cur.endMs <= ATTENDANCE_SESSION_GAP_MS) {
                cur.endMs = t;
                cur.end = r.recorded_at;
                cur.count++;
            } else {
                cur = {
                    startMs: t,
                    endMs: t,
                    start: r.recorded_at,
                    end: r.recorded_at,
                    count: 1
                };
                list.push(cur);
            }
        });
        sessions[email] = list;
    });
    return sessions;
}

function attendanceChartEmployeeEmails() {

function fmtHm(ms) {
    return new Date(ms).toLocaleTimeString("ar-SY", {
        hour: "2-digit",
        minute: "2-digit"
    });
}

function attendanceSessionDurationLabel(startMs, endMs) {
    const diffMin = Math.max(1, Math.round((endMs - startMs) / 6e4));
    if (diffMin < 60) return arabicMinutesLabel(diffMin);
    const h = Math.floor(diffMin / 60), m = diffMin % 60;
    return arabicHoursLabel(h) + (m > 0 ? " و " + arabicMinutesLabel(m) : "");
}

function attendanceChartAxisHtml() {
    const refDayMs = new Date(2024, 0, 1, 0, 0).getTime();
    const marks = [];
    for (let m = 0; m <= 24 * 60; m += 60) marks.push(m);
    return '<div class="attendance-chart-axis">' + marks.map(m => "<span>" + fmtHm(refDayMs + m * 6e4) + "</span>").join("") + "</div>";
}

function attendanceChartRowsHtml(sessionsByEmail, dayStartMs, nowMs) {
    const dayMs = 24 * 60 * 60 * 1e3;
    const nowPct = nowMs != null ? Math.min(100, Math.max(0, (nowMs - dayStartMs) / dayMs * 100)) : null;
    return attendanceChartEmployeeEmails().map(email => {
        const sessions = sessionsByEmail[email] || [];
        const barsHtml = sessions.length ? sessions.map(s => {
            const leftPct = Math.max(0, Math.min(100, (s.startMs - dayStartMs) / dayMs * 100));
            const widthPct = Math.max(.6, Math.min(100 - leftPct, (s.endMs - s.startMs) / dayMs * 100));
            return '<button type="button" class="attendance-chart-bar" style="left:' + leftPct.toFixed(3) + "%;width:" + widthPct.toFixed(3) + '%;" ' + 'data-attendance-email="' + escapeHtml(email) + '" data-attendance-start="' + s.start + '" data-attendance-end="' + s.end + '" data-attendance-count="' + s.count + '" ' + 'title="' + fmtHm(s.startMs) + " – " + fmtHm(s.endMs) + '" aria-label="' + escapeHtml(displayNameForEmail(email)) + " " + fmtHm(s.startMs) + " – " + fmtHm(s.endMs) + '"></button>';
        }).join("") : '<div class="attendance-chart-empty-row">لا يوجد ظهور</div>';
        const nowLine = nowPct != null ? '<div class="attendance-chart-now-line" style="left:' + nowPct.toFixed(3) + '%;"></div>' : "";
        return '<div class="attendance-chart-row">' + '<div class="attendance-chart-name">' + escapeHtml(displayNameForEmail(email)) + "</div>" + '<div class="attendance-chart-track">' + barsHtml + nowLine + "</div>" + "</div>";
    }).join("");
}

function scrollAttendanceChartToTime(targetMs, dayStartMs) {
    const scrollEl = document.querySelector(".attendance-chart-scroll");
    const inner = document.querySelector(".attendance-chart-scroll-inner");
    const track = document.querySelector(".attendance-chart-track");
    if (!scrollEl || !inner || !track || !scrollEl.clientWidth) return;
    const dayMs = 24 * 60 * 60 * 1e3;
    const frac = Math.min(1, Math.max(0, (targetMs - dayStartMs) / dayMs));
    scrollEl.scrollLeft = Math.max(0, Math.min(inner.offsetWidth - scrollEl.clientWidth, frac * track.offsetWidth));
}

async function snapTraceToRoads(latlngs) {
    if (!Array.isArray(latlngs) || latlngs.length < 2) return null;
    let pts = latlngs;
    const MAX = 25;
    if (pts.length > MAX) {
        const step = (latlngs.length - 1) / (MAX - 1);
        pts = [];
        for (let i = 0; i < MAX; i++) pts.push(latlngs[Math.round(i * step)]);
        pts[pts.length - 1] = latlngs[latlngs.length - 1];
    }
    const coordStr = pts.map(p => p[1] + "," + p[0]).join(";");
    const url = "https://router.project-osrm.org/route/v1/driving/" + coordStr + "?geometries=geojson&overview=full";
    const ctrl = new AbortController;
    const timer = setTimeout(() => ctrl.abort(), 7e3);
    try {
        const res = await fetch(url, {
            signal: ctrl.signal
        });
        if (!res.ok) return null;
        const j = await res.json();
        const coords = j && j.code === "Ok" && j.routes && j.routes[0] && j.routes[0].geometry && j.routes[0].geometry.coordinates;
        if (!Array.isArray(coords) || coords.length < 2) return null;
        return coords.map(c => [ c[1], c[0] ]);
    } catch (e) {
        return null;
    } finally {
        clearTimeout(timer);
    }
}

async function showAttendanceSessionPathInline(email, startIso, endIso, btn) {
    if (!sb) return;
    const wrap = document.getElementById("attendance-chart-path-map-wrap");
    if (!wrap) return;
    if (btn) {
        btn.disabled = true;
        btn.textContent = "🗺️ جاري التحميل…";
    }
    const leafletPromise = ensureLeaflet();
    const {data: data, error: error} = await sb.from("employee_location_history").select("lat, lng, recorded_at").eq("email", email).gte("recorded_at", startIso).lte("recorded_at", endIso).order("recorded_at", {
        ascending: true
    });
    if (!document.getElementById("attendance-chart-path-map-wrap")) return;
    if (error || !data || !data.length) {
        wrap.innerHTML = '<div class="muted" style="margin-top:8px;">تعذر تحميل مسار هذه الفترة</div>';
        if (btn) btn.style.display = "none";
        return;
    }
    if (btn) btn.style.display = "none";
    wrap.innerHTML = '<div id="attendance-chart-path-map" class="employee-map-wrap" style="height:280px;margin-top:10px;"></div>' + '<div class="muted" id="attendance-chart-path-caption" style="margin-top:6px;font-size:12.5px;"></div>';
    if (attendanceChartPathMapInstance) {
        attendanceChartPathMapInstance.remove();
        attendanceChartPathMapInstance = null;
    }
    await leafletPromise;
    if (!document.getElementById("attendance-chart-path-map-wrap")) return;
    const map = L.map("attendance-chart-path-map");
    attendanceChartPathMapInstance = map;
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
        attribution: "Tiles &copy; Esri",
        maxZoom: 19
    }).addTo(map);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", {
        attribution: "Esri",
        maxZoom: 19
    }).addTo(map);
    const rawLatLngs = data.map(p => [ p.lat, p.lng ]);
    const pathColor = getComputedStyle(document.documentElement).getPropertyValue("--green").trim() || "#22D07A";
    map.invalidateSize();
    const provisionalLine = L.polyline(rawLatLngs, {
        color: pathColor,
        weight: 3,
        opacity: .5,
        dashArray: "5,6"
    }).addTo(map);
    const endMarker = L.marker(rawLatLngs[rawLatLngs.length - 1], {
        icon: employeeMapMarkerIcon(email, false, "history")
    }).addTo(map);
    map.fitBounds(L.latLngBounds(rawLatLngs), {
        padding: [ 24, 24 ],
        maxZoom: 17
    });
    const captionEl = document.getElementById("attendance-chart-path-caption");
    if (captionEl) captionEl.textContent = data.length + " نقطة مسجّلة خلال هذه الفترة";
    const roadPath = await snapTraceToRoads(rawLatLngs);
    if (attendanceChartPathMapInstance !== map || !document.getElementById("attendance-chart-path-map")) return;
    if (roadPath) {
        map.removeLayer(provisionalLine);
        L.polyline(roadPath, {
            color: pathColor,
            weight: 4,
            opacity: .9
        }).addTo(map);
        if (rawLatLngs.length <= 80) {
            rawLatLngs.forEach(ll => L.circleMarker(ll, {
                radius: 2.5,
                color: pathColor,
                weight: 1,
                opacity: .55,
                fillOpacity: .45
            }).addTo(map));
        }
        map.invalidateSize();
        map.fitBounds(L.latLngBounds(roadPath.concat(rawLatLngs)), {
            padding: [ 24, 24 ],
            maxZoom: 17
        });
    }
    if (captionEl) captionEl.textContent = data.length + " نقطة مسجّلة خلال هذه الفترة" + (roadPath ? " · المسار مطابَق للطرق" : " · تعذّر مطابقة الطريق — خط مستقيم بين النقاط");
}

let pendingAuthEmail = "";

function bindAuthGate() {
    const emailInput = document.getElementById("auth-email-input");
    const sendBtn = document.getElementById("auth-send-btn");
    const codeInput = document.getElementById("auth-code-input");
    const verifyBtn = document.getElementById("auth-verify-btn");
    const backBtn = document.getElementById("auth-back-btn");
    const stepEmail = document.getElementById("auth-step-email");
    const stepCode = document.getElementById("auth-step-code");
    const trySend = async () => {
        const email = emailInput.value.trim();
        if (!email) {
            showAuthGate("اكتب بريدك الإلكتروني أولاً", "error");
            return;
        }
        if (!sb) {
            showAuthGate("تعذر الاتصال بخدمة تسجيل الدخول", "error");
            return;
        }
        sendBtn.disabled = true;
        sendBtn.textContent = "جاري الإرسال…";
        try {
            const {error: error} = await sb.auth.signInWithOtp({
                email: email
            });
            if (error) throw error;
            pendingAuthEmail = email;
            stepEmail.style.display = "none";
            stepCode.style.display = "";
            codeInput.value = "";
            showAuthGate("تم إرسال رمز الدخول إلى " + email + " — افتح بريدك وأدخل الرمز تحت.", "ok");
            codeInput.focus();
        } catch (e) {
            showAuthGate("تعذر إرسال رمز الدخول: " + friendlyErrorText(e), "error");
        } finally {
            sendBtn.disabled = false;
            sendBtn.textContent = "إرسال رمز الدخول";
        }
    };
    const tryVerify = async () => {
        const code = codeInput.value.trim();
        if (!code) {
            showAuthGate("اكتب الرمز أولاً", "error");
            return;
        }
        if (!sb || !pendingAuthEmail) {
            showAuthGate("تعذر التحقق — ارجع وأدخل بريدك من جديد", "error");
            return;
        }
        verifyBtn.disabled = true;
        verifyBtn.textContent = "جاري التحقق…";
        try {
            const {error: error} = await sb.auth.verifyOtp({
                email: pendingAuthEmail,
                token: code,
                type: "email"
            });
            if (error) throw error;
            pendingAuthEmail = "";
        } catch (e) {
            showAuthGate("رمز غير صحيح أو منتهي الصلاحية: " + friendlyErrorText(e), "error");
        } finally {
            verifyBtn.disabled = false;
            verifyBtn.textContent = "تأكيد الرمز";
        }
    };
    sendBtn.addEventListener("click", trySend);
    emailInput.addEventListener("keydown", e => {
        if (e.key === "Enter") {
            e.preventDefault();
            trySend();
        }
    });
    verifyBtn.addEventListener("click", tryVerify);
    codeInput.addEventListener("keydown", e => {
        if (e.key === "Enter") {
            e.preventDefault();
            tryVerify();
        }
    });
    backBtn.addEventListener("click", () => {
        pendingAuthEmail = "";
        stepCode.style.display = "none";
        stepEmail.style.display = "";
        showAuthGate();
    });
}

    refreshActivityEvents();
    loadAnnouncement();
    if (document.getElementById("treasury-view").style.display !== "none") {
        renderTreasuryView();
    }
    const tasksView = document.getElementById("tasks-view");
    if (tasksView && tasksView.style.display !== "none") {
        if (activeTaskCategory) {
            if (document.getElementById("task-items-list")) refreshTaskItemsList(activeTaskCategory);
        } else renderTasksView();
    }
    if (document.getElementById("suppliers-view").style.display !== "none" && Object.keys(editingSuppliers).length === 0) {
        refreshSuppliersList();
    }
    if (document.getElementById("customers-view").style.display !== "none" && Object.keys(editingCustomers).length === 0) {
        refreshCustomersList();
    }
    refreshArchiveViewIfOpen();
    const scrapRoot = document.getElementById("scrapyard-root");
    if (scrapRoot && scrapRoot.style.display !== "none" && scrapyardSharedState.canManage && scrapyardCurrentScreen === "settlement") {
        if (!scrapyardHasOpenEdit()) {
            await loadScrapyardData(scrapyardSharedState.activeKind);
            if (myGen !== resumeRefreshGeneration) return;
            renderScrapyardView();
        }
    }
}

document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") refreshOnResume();
});

window.addEventListener("pageshow", e => {
    if (e.persisted) refreshOnResume();
});

window.addEventListener("online", refreshOnResume);

async function bootstrapAuth() {
    bindAuthGate();
    if (!sb) {
        showAuthGate("تعذر الاتصال بخدمة تسجيل الدخول — تحقق من إعداد Supabase", "error");
        return;
    }
    const urlError = getAuthErrorFromUrl();
    const noSessionMsg = urlError ? "تعذر تسجيل الدخول: الرابط منتهي الصلاحية أو تم استخدامه من قبل. اطلب رابط دخول جديد من هذه الصفحة." : undefined;
    sb.auth.onAuthStateChange((event, session) => {
        if (session) {
            showAppIfAllowed(session);
        } else {
            showAuthGate(noSessionMsg, noSessionMsg ? "error" : undefined);
        }
    });
    const {data: {session: session}} = await sb.auth.getSession();
    if (session) {
        showAppIfAllowed(session);
    } else {
        showAuthGate(noSessionMsg, noSessionMsg ? "error" : undefined);
    }
}

bootstrapAuth();</script>
