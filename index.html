function mediaPathValid(path, bucket) {
    const head = "^(shared|purch|sales)/[A-Za-z0-9_-]{1,64}/[A-Za-z0-9_-]{1,64}/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}";
    const tail = bucket === "order-photos" ? "(_t)?\\.jpg$" : bucket === "order-videos" ? "\\.mp4$" : "\\.(jpg|mp4)$";
    return typeof path === "string" && new RegExp(head + tail).test(path);
}

function mediaFitDims(w, h, shortSide) {
    w = Math.max(1, Number(w) || 1);
    h = Math.max(1, Number(h) || 1);
    const s = Math.min(1, (Number(shortSide) || 480) / Math.min(w, h));
    const f = n => Math.max(16, Math.floor((n * s + 1e-6) / 16) * 16);
    return {
        W: f(w),
        H: f(h)
    };
}

function mediaVideoPreset(name) {
    return name === "eco" ? {
        name: "eco",
        shortSide: 352,
        fps: 20,
        kfi: 4,
        vbps: 3e5,
        abps: 24e3
    } : {
        name: "std",
        shortSide: 480,
        fps: 24,
        kfi: 4,
        vbps: 45e4,
        abps: 32e3
    };
}

function mediaVideoPlan(src, presetName, maxSec) {
    const p = mediaVideoPreset(presetName);
    const d = mediaFitDims(src && src.w, src && src.h, p.shortSide);
    const avg = Number(src && src.avgBps) || 0;
    const vbps = avg > 0 ? Math.round(Math.min(p.vbps, Math.max(15e4, .8 * avg))) : p.vbps;
    const cap = Math.min(30, Math.max(1, Number(maxSec) || 15));
    const dur = Math.max(0, Number(src && src.durSec) || 0);
    const trimEnd = dur > cap ? cap : null;
    const outSec = trimEnd != null ? trimEnd : dur;
    const budgetAbps = Number(src && src.copiedAbps) > 0 ? Number(src.copiedAbps) : p.abps;
    return {
        preset: p.name,
        W: d.W,
        H: d.H,
        fps: p.fps,
        kfi: p.kfi,
        vbps: vbps,
        abps: p.abps,
        trimEnd: trimEnd,
        outSec: outSec,
        budgetBytes: Math.round((vbps + budgetAbps) * outSec / 8)
    };
}

function mediaDefaultAudience(role, kind, isElevated) {
    return role === "scrapyard" || role === "full" ? "shared" : null;
}

function mediaAltAudience(role, kind) {
    if (kind === "vin") return null;
    return role === "scrapyard" ? "purch" : role === "full" ? "sales" : null;
}

function mediaCanDelete(row, email, isElevated, nowMs) {
    if (!row) return false;
    if (isElevated) return true;
    if (!email || String(row.uploaded_by || "").toLowerCase() !== String(email).toLowerCase()) return false;
    const t = Date.parse(row.created_at);
    return isFinite(t) && nowMs - t < 15 * 60 * 1e3;
}

function mediaStagedFlushPlan(snapshot, savedPartIds) {
    const has = savedPartIds && typeof savedPartIds.has === "function" ? k => savedPartIds.has(k) : k => Array.isArray(savedPartIds) && savedPartIds.indexOf(k) >= 0;
    const flush = [], dropped = [];
    const visit = (items, key) => {
        if (!items || !items.length) return;
        (key === "_order" || key === "_order:vin" || has(key) ? flush : dropped).push({
            key: key,
            items: items
        });
    };
    if (snapshot && typeof snapshot.forEach === "function" && typeof snapshot.get === "function") snapshot.forEach(visit); else if (snapshot) Object.keys(snapshot).forEach(k => visit(snapshot[k], k));
    return {
        flush: flush,
        dropped: dropped
    };
}

function formatMediaDuration(ms) {
    const s = Math.max(0, Math.round((Number(ms) || 0) / 1e3));
    return Math.floor(s / 60) + ":" + (s % 60 < 10 ? "0" : "") + s % 60;
}

function bytesHasExifApp1(u8) {
    if (!u8) return false;
    const n = Math.min(u8.length, 65536);
    for (let i = 0; i + 9 < n; i++) {
        if (u8[i] === 255 && u8[i + 1] === 225 && u8[i + 4] === 69 && u8[i + 5] === 120 && u8[i + 6] === 105 && u8[i + 7] === 102 && u8[i + 8] === 0 && u8[i + 9] === 0) return true;
    }
    return false;
}

function bytesHasLocationAtom(u8) {
    if (!u8 || u8.length < 8) return true;
    const pats = [ [ 169, 120, 121, 122 ] ];
    [ "loci", "ISO6709", "com.apple.quicktime.location" ].forEach(s => {
        const a = [];
        for (let i = 0; i < s.length; i++) a.push(s.charCodeAt(i));
        pats.push(a);
    });
    const hit = (from, to) => {
        for (let i = from; i < to; i++) {
            for (let k = 0; k < pats.length; k++) {
                const p = pats[k];
                if (i + p.length > to || u8[i] !== p[0]) continue;
                let j = 1;
                while (j < p.length && u8[i + j] === p[j]) j++;
                if (j === p.length) return true;
            }
        }
        return false;
    };
    const n = u8.length;
    let off = 0, sawMoov = false;
    while (off < n) {
        if (off + 8 > n) return true;
        let size = u8[off] * 16777216 + (u8[off + 1] << 16) + (u8[off + 2] << 8) + u8[off + 3];
        const type = String.fromCharCode(u8[off + 4], u8[off + 5], u8[off + 6], u8[off + 7]);
        let hdr = 8;
        if (size === 1) {
            if (off + 16 > n) return true;
            size = (u8[off + 8] * 16777216 + (u8[off + 9] << 16) + (u8[off + 10] << 8) + u8[off + 11]) * 4294967296 + (u8[off + 12] * 16777216 + (u8[off + 13] << 16) + (u8[off + 14] << 8) + u8[off + 15]);
            hdr = 16;
        } else if (size === 0) {
            size = n - off;
        }
        if (size < hdr || off + size > n) return true;
        if (type === "moov") {
            sawMoov = true;
            if (hit(off + hdr, off + size)) return true;
        }
        off += size;
    }
    return !sawMoov;
}

function mediaPartKey(ctx) {
    return ctx.kind === "vin" ? "_order:vin" : ctx.partId || "_order";
}

function mediaRowKind(ctx, role) {
    if (ctx.kind === "vin") return "vin";
    if (role === "scrapyard") return "yard_part";
    return ctx.partId ? "customer_ref" : "other";
}

function mediaStagePut(draftId, partKey, item) {
    let st = mediaStaged.get(draftId);
    let n = 0, bytes = 0;
    if (st) st.forEach(arr => arr.forEach(it => {
        n++;
        bytes += it.bytes || 0;
    }));
    if (n >= 10 || bytes + (item.bytes || 0) > 20 * 1024 * 1024) return false;
    if (!st) {
        st = new Map;
        mediaStaged.set(draftId, st);
    }
    const arr = st.get(partKey) || [];
    arr.push(item);
    st.set(partKey, arr);
    item.phase = "staged";
    return true;
}

function mediaRevokeItem(it) {
    if (it && it.previewUrl) {
        try {
            URL.revokeObjectURL(it.previewUrl);
        } catch (e) {}
        it.previewUrl = null;
    }
}

function mediaResetState() {
    mediaStateGen++;
    closeMediaOverlays();
    mediaStaged.forEach(m => m.forEach(arr => arr.forEach(mediaRevokeItem)));
    mediaInFlightSnaps.forEach(m => m.forEach(arr => arr.forEach(mediaRevokeItem)));
    mediaUploads.forEach(mediaRevokeItem);
    mediaStaged.clear();
    mediaInFlightSnaps.clear();
    mediaUploads.clear();
    orderMediaIndex.clear();
    mediaIdToOrderId.clear();
    persistedPartIds.clear();
    mediaThumbUrlMemo.clear();
    mediaThumbInflight.clear();
    mediaThumbBroken.clear();
    mediaBlobLru.forEach(e => {
        try {
            URL.revokeObjectURL(e.url);
        } catch (err) {}
    });
    mediaBlobLru.clear();
    mediaBlobLruBytes = 0;
    mediaBlobInflight.clear();
    mediaConfig = null;
    mediaConfigAt = 0;
    mediaConfigPromise = null;
    mediaPendingPick = null;
    mediaFileQueue = Promise.resolve();
    mediaUploadChain = Promise.resolve();
    if (orderMediaChannel) {
        try {
            if (sb) sb.removeChannel(orderMediaChannel);
        } catch (e) {}
        orderMediaChannel = null;
    }
    if (mediaActiveSheet) mediaCancelSheet(mediaActiveSheet);
    mediaHideProgressSheet();
}

function mediaMaxSeconds() {
    const n = Number(mediaConfig && mediaConfig.video_max_seconds);
    return n >= 5 && n <= 30 ? n : 15;
}

function loadMediaConfig() {
    if (mediaConfig && Date.now() - mediaConfigAt < 10 * 60 * 1e3) {
        return Promise.resolve({
            video_preset: mediaConfig.video_preset === "eco" ? "eco" : "std",
            video_max_seconds: mediaMaxSeconds()
        });
    }
    if (mediaConfigPromise) return mediaConfigPromise;
    const gen = mediaStateGen;
    const p = (async () => {
        try {
            if (!sb) throw new Error("NO_DB");
            const {data: data, error: error} = await withTimeout(sb.from("app_limits").select("id, media_quota_bytes, db_quota_bytes, thresholds, video_preset, video_max_seconds").eq("id", 1).maybeSingle(), 8e3, "app_limits");
            if (error) throw error;
            if (data && gen === mediaStateGen) {
                mediaConfig = data;
                mediaConfigAt = Date.now();
            }
        } catch (e) {
            console.warn("loadMediaConfig:", e);
        }
        return {
            video_preset: mediaConfig && mediaConfig.video_preset === "eco" ? "eco" : "std",
            video_max_seconds: mediaMaxSeconds()
        };
    })();
    mediaConfigPromise = p;
    p.then(() => {
        if (mediaConfigPromise === p) mediaConfigPromise = null;
    });
    return p;
}

function mediaIndexInitEmpty(orderId) {
    if (orderId && !orderMediaIndex.has(orderId)) orderMediaIndex.set(orderId, {
        state: "loaded",
        gen: 0,
        rows: new Map,
        pending: new Map,
        promise: null
    });
}

function ensureOrderMediaLoaded(orderId, force) {
    if (!sb || !orderId) return Promise.resolve();
    const cur = orderMediaIndex.get(orderId);
    if (cur && cur.state === "loading") return cur.promise;
    if (cur && cur.state === "loaded" && !force) return Promise.resolve();
    const stateGen = mediaStateGen;
    const gen = (cur ? cur.gen : 0) + 1;
    const ent = {
        state: "loading",
        gen: gen,
        rows: cur ? cur.rows : new Map,
        pending: new Map,
        promise: null
    };
    orderMediaIndex.set(orderId, ent);
    ent.promise = (async () => {
        let data = null, failed = false;
        try {
            const res = await withTimeout(sb.from("order_media").select("*").eq("order_id", orderId).order("created_at", {
                ascending: true
            }), GUARDED_AWAIT_TIMEOUT_MS, "order_media");
            if (res.error) throw res.error;
            data = res.data || [];
        } catch (e) {
            console.error("ensureOrderMediaLoaded:", e);
            failed = true;
        }
        if (stateGen !== mediaStateGen || orderMediaIndex.get(orderId) !== ent || ent.gen !== gen) return;
        if (!failed) {
            ent.rows.forEach((r, id) => mediaIdToOrderId.delete(id));
            ent.rows = new Map;
            data.forEach(r => {
                ent.rows.set(r.id, r);
                mediaIdToOrderId.set(r.id, orderId);
            });
        }
        ent.pending.forEach((row, id) => {
            if (row) {
                ent.rows.set(id, row);
                mediaIdToOrderId.set(id, orderId);
            } else {
                ent.rows.delete(id);
                mediaIdToOrderId.delete(id);
            }
        });
        ent.pending = new Map;
        ent.state = failed ? "error" : "loaded";
        ent.rows.forEach((r, id) => mediaDropLocalForRow(id));
        refreshMediaStrips(orderId);
    })();
    return ent.promise;
}

function mediaIndexApply(orderId, id, row) {
    const ent = orderMediaIndex.get(orderId);
    if (!ent) return false;
    if (ent.state === "loading") ent.pending.set(id, row || null);
    if (row) {
        ent.rows.set(id, row);
        mediaIdToOrderId.set(id, orderId);
    } else {
        ent.rows.delete(id);
        mediaIdToOrderId.delete(id);
    }
    return true;
}

function mediaRowById(orderId, id) {
    const ent = orderMediaIndex.get(orderId);
    return ent && ent.rows.get(id) || null;
}

function mediaDropLocalForRow(id) {
    let hit = false;
    mediaUploads.forEach((it, localId) => {
        if (it.id === id && it.phase === "failed") {
            mediaUploads.delete(localId);
            mediaRevokeItem(it);
            hit = true;
        }
    });
    return hit;
}

function mediaForgetOrder(orderId) {
    const ent = orderMediaIndex.get(orderId);
    if (ent) ent.rows.forEach((r, id) => mediaIdToOrderId.delete(id));
    orderMediaIndex.delete(orderId);
    persistedPartIds.delete(orderId);
}

function subscribeOrderMediaRealtime() {
    if (!sb || orderMediaChannel) return;
    orderMediaChannel = sb.channel("order-media-changes").on("postgres_changes", {
        event: "INSERT",
        schema: "public",
        table: "order_media"
    }, mediaApplyRealtime).on("postgres_changes", {
        event: "DELETE",
        schema: "public",
        table: "order_media"
    }, mediaApplyRealtime).subscribe();
}

function mediaApplyRealtime(payload) {
    if (!payload) return;
    if (payload.eventType === "INSERT") {
        const row = payload.new;
        if (!row || !row.id || !row.order_id) return;
        const dropped = mediaDropLocalForRow(row.id);
        if (mediaIndexApply(row.order_id, row.id, row) || dropped) refreshMediaStrips(row.order_id);
    } else if (payload.eventType === "DELETE") {
        const id = payload.old && payload.old.id;
        if (!id) return;
        const orderId = mediaIdToOrderId.get(id);
        if (!orderId) {
            orderMediaIndex.forEach(ent => {
                if (ent.state === "loading") ent.pending.set(id, null);
            });
            return;
        }
        mediaIndexApply(orderId, id, null);
        refreshMediaStrips(orderId);
    }
}

function mediaSeedPersisted(orderId, parts) {
    if (!orderId) return;
    persistedPartIds.set(orderId, new Set((parts || []).map(p => p && p.id).filter(Boolean)));
}

function mediaTargetPersisted(ctx) {
    const s = persistedPartIds.get(ctx.orderId);
    if (!s) return false;
    if (ctx.kind === "vin" || !ctx.partId) return true;
    return s.has(ctx.partId);
}

function mediaDraftStillOpen(draftId) {
    return !!draftId && (!!draft && draft.id === draftId || !!quoteDraft && quoteDraft.id === draftId);
}

function mediaCurrentPartIds(orderId) {
    const d = draft && draft.id === orderId ? draft : quoteDraft && quoteDraft.id === orderId ? quoteDraft : (appData.orders || []).find(o => o.id === orderId);
    return d ? new Set((d.parts || []).map(p => p.id)) : null;
}

function mediaDiscardStaged(draftId) {
    const st = mediaStaged.get(draftId);
    if (!st) return;
    mediaStaged.delete(draftId);
    st.forEach(arr => arr.forEach(mediaRevokeItem));
}

function mediaDiscardStagedForPart(draftId, partKey) {
    const st = mediaStaged.get(draftId);
    if (!st || !st.has(partKey)) return;
    st.get(partKey).forEach(mediaRevokeItem);
    st.delete(partKey);
    if (!st.size) mediaStaged.delete(draftId);
}

function mediaStagedOnBlankParts(draftId, parts) {
    const st = mediaStaged.get(draftId);
    if (!st) return false;
    const blank = (parts || []).some(p => p && !(p.description && String(p.description).trim()) && (st.get(p.id) || []).length > 0);
    if (blank) showToast("القطعة بدون وصف — صورها ما رح تنحفظ", "error");
    return blank;
}

function mediaTakeStagedSnapshot(draftId) {
    const st = mediaStaged.get(draftId);
    if (!st || !st.size) return null;
    mediaStaged.delete(draftId);
    st.forEach(arr => arr.forEach(it => {
        it.phase = "saving";
    }));
    mediaInFlightSnaps.set(draftId, st);
    return {
        draftId: draftId,
        map: st
    };
}

function mediaReleaseSnapshot(snap) {
    if (snap && mediaInFlightSnaps.get(snap.draftId) === snap.map) mediaInFlightSnaps.delete(snap.draftId);
}

function mediaRestoreStagedSnapshot(snap) {
    if (!snap) return;
    mediaReleaseSnapshot(snap);
    if (!mediaDraftStillOpen(snap.draftId)) {
        let n = 0;
        snap.map.forEach(arr => arr.forEach(it => {
            n++;
            mediaRevokeItem(it);
        }));
        if (n) showToast(n + " صورة/فيديو ما انحفظت (النافذة انسكّرت قبل الحفظ)", "error");
        return;
    }
    let st = mediaStaged.get(snap.draftId);
    if (!st) {
        st = new Map;
        mediaStaged.set(snap.draftId, st);
    }
    snap.map.forEach((arr, key) => {
        arr.forEach(it => {
            it.phase = "staged";
        });
        st.set(key, arr.concat(st.get(key) || []));
    });
    refreshMediaStrips(snap.draftId);
}

function mediaFlushStaged(orderId, snap, savedIds) {
    if (!snap) return;
    mediaReleaseSnapshot(snap);
    const plan = mediaStagedFlushPlan(snap.map, savedIds || new Set);
    let dropped = 0;
    plan.dropped.forEach(g => g.items.forEach(it => {
        dropped++;
        mediaRevokeItem(it);
    }));
    plan.flush.forEach(g => g.items.forEach(it => {
        it.orderId = orderId;
        mediaEnqueueUpload(it);
    }));
    if (dropped) showToast(dropped + " صورة/فيديو ما انحفظت — قطعتها ما انحفظت", "error");
}

function mediaDrainPersistedStaged(draftId) {
    const st = mediaStaged.get(draftId);
    if (!st) return;
    st.forEach((arr, key) => {
        const ctx = {
            orderId: draftId,
            partId: key === "_order" || key === "_order:vin" ? null : key,
            kind: key === "_order:vin" ? "vin" : key === "_order" ? "order" : "part"
        };
        if (!mediaTargetPersisted(ctx)) return;
        st.delete(key);
        arr.forEach(mediaEnqueueUpload);
    });
    if (!st.size) mediaStaged.delete(draftId);
}

function mediaAfterSaveSuccess(orderId, snap, savedParts) {
    persistedPartIds.set(orderId, new Set((savedParts || []).map(p => p && p.id).filter(Boolean)));
    mediaIndexInitEmpty(orderId);
    mediaFlushStaged(orderId, snap, persistedPartIds.get(orderId));
    mediaDrainPersistedStaged(orderId);
    refreshMediaStrips(orderId);
}

function mediaAfterQuoteConflict(draftId, snap, reopened) {
    if (!snap) return;
    if (reopened && quoteModalStillOpen(draftId) && persistedPartIds.has(draftId)) mediaFlushStaged(draftId, snap, persistedPartIds.get(draftId)); else mediaRestoreStagedSnapshot(snap);
    refreshMediaStrips(draftId);
}

function mediaSleep(ms) {
    return new Promise(r => setTimeout(r, ms));
}

function mediaEnqueueUpload(item) {
    item.phase = "queued";
    item.error = null;
    mediaUploads.set(item.localId, item);
    refreshMediaStrips(item.orderId);
    const gen = mediaStateGen;
    mediaUploadChain = mediaUploadChain.then(() => gen === mediaStateGen && mediaUploads.get(item.localId) === item ? mediaUploadNow(item) : null).catch(e => console.error("mediaUploadNow:", e));
}

async function mediaAwaitRequest(item, promise, softMs, hardMs) {
    const settled = Promise.resolve(promise).then(v => ({
        v: v
    }), e => ({
        e: e || new Error("request_failed")
    }));
    let r = await Promise.race([ settled, mediaSleep(softMs).then(() => null) ]);
    if (r) return r;
    if (mediaUploads.get(item.localId) === item) {
        item.phase = "verifying";
        refreshMediaStrips(item.orderId);
    }
    r = await Promise.race([ settled, mediaSleep(hardMs).then(() => null) ]);
    return r || {
        timeout: true
    };
}

function mediaStorageDup(err) {
    if (!err) return false;
    return String(err.statusCode) === "409" || err.status === 409 || /already exists|duplicate/i.test(String(err.message || err.error || ""));
}

function mediaStorageDenied(err) {
    if (!err) return false;
    const m = String(err.message || err.error || "");
    return /row-level security/i.test(m) || (String(err.statusCode) === "403" || err.status === 403) && !/jwt|token/i.test(m);
}

function mediaInsertDeleted(err) {
    return !!err && (err.code === "PT410" || err.hint === "media_deleted" || err.message === "media_deleted");
}

async function mediaSelectRowById(id) {
    try {
        const {data: data, error: error} = await withTimeout(sb.from("order_media").select("*").eq("id", id).maybeSingle(), GUARDED_AWAIT_TIMEOUT_MS, "order_media by id");
        return error ? null : data || null;
    } catch (e) {
        return null;
    }
}

async function mediaRemoveObjects(pairs) {
    const byBucket = {};
    (pairs || []).forEach(p => {
        if (p && p[0] && p[1]) (byBucket[p[0]] = byBucket[p[0]] || []).push(p[1]);
    });
    for (const bucket of Object.keys(byBucket)) {
        try {
            const {error: error} = await withTimeout(sb.storage.from(bucket).remove(byBucket[bucket]), 15e3, "storage remove");
            if (error) console.warn("mediaRemoveObjects:", bucket, error);
        } catch (e) {
            console.warn("mediaRemoveObjects:", bucket, e);
        }
    }
}

async function mediaUploadPipeline(item, wasUnverified) {
    const isVideo = item.mediaType === "video";
    const bucket = isVideo ? "order-videos" : "order-photos";
    const objectPath = mediaObjectPath(item.audience, item.orderId, item.partId, item.id, isVideo ? "mp4" : "jpg");
    const thumbPath = mediaThumbPathFor(objectPath);
    if (!mediaPathValid(objectPath) || !mediaPathValid(thumbPath, "order-photos")) return {
        status: "failed",
        error: new Error("bad_path")
    };
    if (wasUnverified) {
        const f = await mediaSelectRowById(item.id);
        if (f) return {
            status: "ok",
            row: f
        };
    }
    const settleDenied = async () => {
        const f = await mediaSelectRowById(item.id);
        return f ? {
            status: "ok",
            row: f
        } : {
            status: "deleted"
        };
    };
    const T = isVideo ? 9e4 : 3e4;
    const opts = {
        upsert: false,
        cacheControl: "3600"
    };
    let r = await mediaAwaitRequest(item, sb.storage.from("order-photos").upload(thumbPath, item.thumb, opts), T, 18e4);
    if (r.timeout) return {
        status: "unverified"
    };
    let err = r.e || r.v && r.v.error;
    if (err && !mediaStorageDup(err)) {
        if (wasUnverified && mediaStorageDenied(err)) return await settleDenied();
        return {
            status: "failed",
            error: err
        };
    }
    r = await mediaAwaitRequest(item, sb.storage.from(bucket).upload(objectPath, item.full, opts), T, 18e4);
    if (r.timeout) return {
        status: "unverified"
    };
    err = r.e || r.v && r.v.error;
    if (err && !mediaStorageDup(err)) {
        const denied = wasUnverified && mediaStorageDenied(err);
        const res = denied ? await settleDenied() : {
            status: "failed",
            error: err
        };
        if (res.status !== "ok") await mediaRemoveObjects([ [ "order-photos", thumbPath ] ]);
        return res;
    }
    const row = {
        id: item.id,
        order_id: item.orderId,
        part_id: item.partId || null,
        audience: item.audience,
        kind: item.kind,
        media_type: item.mediaType,
        mime: isVideo ? "video/mp4" : "image/jpeg",
        object_path: objectPath,
        thumb_path: thumbPath,
        width: item.width,
        height: item.height,
        duration_ms: isVideo ? item.durationMs : null,
        audio: isVideo ? item.audio || "none" : null
    };
    r = await mediaAwaitRequest(item, sb.from("order_media").insert(row).select("*"), 15e3, 12e4);
    if (!r.timeout && !r.e && r.v && !r.v.error && r.v.data && r.v.data.length) return {
        status: "ok",
        row: r.v.data[0]
    };
    const found = await mediaSelectRowById(item.id);
    if (found) return {
        status: "ok",
        row: found
    };
    if (r.timeout) return {
        status: "unverified"
    };
    err = r.e || r.v && r.v.error || new Error("insert_empty");
    if (err.code === "23505") return {
        status: "unverified"
    };
    await mediaRemoveObjects([ [ bucket, objectPath ], [ "order-photos", thumbPath ] ]);
    if (mediaInsertDeleted(err)) return {
        status: "deleted"
    };
    return {
        status: err.code === "PT422" || err.hint === "media_part_not_saved" ? "restage" : "failed",
        error: err
    };
}

async function mediaUploadNow(item) {
    const gen = mediaStateGen;
    if (!sb) {
        item.phase = "failed";
        refreshMediaStrips(item.orderId);
        return;
    }
    const wasUnverified = !!item.unverified;
    item.phase = "uploading";
    item.unverified = false;
    refreshMediaStrips(item.orderId);
    let res;
    try {
        res = await mediaUploadPipeline(item, wasUnverified);
    } catch (e) {
        res = {
            status: "failed",
            error: e
        };
    }
    if (gen !== mediaStateGen || mediaUploads.get(item.localId) !== item) return;
    const landed = (res.status === "failed" || res.status === "unverified") && mediaRowById(item.orderId, item.id);
    if (res.status === "ok" || landed) {
        mediaUploads.delete(item.localId);
        mediaRevokeItem(item);
        if (res.row) mediaIndexApply(item.orderId, res.row.id, res.row);
        refreshMediaStrips(item.orderId);
        return;
    }
    if (res.status === "deleted") {
        mediaUploads.delete(item.localId);
        mediaRevokeItem(item);
        refreshMediaStrips(item.orderId);
        showToast(item.mediaType === "video" ? "الفيديو انحذف" : "الصورة انحذفت", "error");
        return;
    }
    if (res.status === "restage") {
        mediaUploads.delete(item.localId);
        const s = persistedPartIds.get(item.orderId);
        if (s && item.partId) s.delete(item.partId);
        if (mediaDraftStillOpen(item.draftId) && mediaStagePut(item.draftId, item.partKey, item)) {
            showToast("احفظ الطلبية أولًا — الملف بينرفع بعد الحفظ", "error");
        } else {
            mediaRevokeItem(item);
            showToast("القطعة ما عادت موجودة بالطلبية — الملف ما انحفظ", "error");
        }
        refreshMediaStrips(item.orderId);
        return;
    }
    item.phase = "failed";
    item.unverified = res.status === "unverified";
    item.error = res.error || null;
    refreshMediaStrips(item.orderId);
    showToast(item.unverified ? "الرفع ما تأكد (الشبكة بطيئة) — اضغط ↻ على المصغّرة لإعادة المحاولة" : "تعذر رفع " + (item.mediaType === "video" ? "الفيديو" : "الصورة") + ": " + friendlyErrorText(res.error), "error");
}

function mediaCancelLocal(localId) {
    const up = mediaUploads.get(localId);
    if (up) {
        if (up.phase !== "failed") return;
        mediaUploads.delete(localId);
        mediaRevokeItem(up);
        if (up.unverified && sb) {
            const isV = up.mediaType === "video";
            const op = mediaObjectPath(up.audience, up.orderId, up.partId, up.id, isV ? "mp4" : "jpg");
            mediaRemoveObjects([ [ isV ? "order-videos" : "order-photos", op ], [ "order-photos", mediaThumbPathFor(op) ] ]);
        }
        refreshMediaStrips(up.orderId);
        return;
    }
    let found = null;
    mediaStaged.forEach((m, draftId) => m.forEach((arr, key) => {
        const i = arr.findIndex(it => it.localId === localId);
        if (i >= 0) found = {
            draftId: draftId,
            key: key,
            arr: arr,
            i: i,
            m: m
        };
    }));
    if (!found) return;
    const it = found.arr.splice(found.i, 1)[0];
    mediaRevokeItem(it);
    if (!found.arr.length) found.m.delete(found.key);
    if (!found.m.size) mediaStaged.delete(found.draftId);
    refreshMediaStrips(it.orderId);
}

function mediaRetryLocal(localId) {
    const up = mediaUploads.get(localId);
    if (up && up.phase === "failed") mediaEnqueueUpload(up);
}

function mediaStripRows(orderId, key) {
    const ent = orderMediaIndex.get(orderId);
    if (!ent) return [];
    const all = Array.from(ent.rows.values());
    let out;
    if (key === "_order:vin") out = all.filter(r => r.kind === "vin"); else if (key === "_order") out = all.filter(r => !r.part_id && r.kind !== "vin"); else if (key === "_deleted") {
        const cur = mediaCurrentPartIds(orderId);
        out = cur ? all.filter(r => r.part_id && !cur.has(r.part_id)) : [];
    } else out = all.filter(r => r.part_id === key);
    return out.sort((a, b) => String(a.created_at || "").localeCompare(String(b.created_at || "")));
}

function mediaLocalItems(orderId, key) {
    const out = [];
    const add = m => {
        const arr = m && m.get(key);
        if (arr) arr.forEach(it => out.push(it));
    };
    add(mediaStaged.get(orderId));
    add(mediaInFlightSnaps.get(orderId));
    mediaUploads.forEach(it => {
        if (it.orderId === orderId && it.partKey === key) out.push(it);
    });
    return out;
}

function mediaCountLabel(orderId, key) {
    const n = mediaStripRows(orderId, key).length + mediaLocalItems(orderId, key).length;
    return n > 0 ? "📷 " + n : "📷 صورة";
}

function mediaCountAria(orderId, key) {
    const n = mediaStripRows(orderId, key).length + mediaLocalItems(orderId, key).length;
    return n > 0 ? "صور/فيديو القطعة: " + n + " — إضافة" : "صورة أو فيديو للقطعة";
}

function mediaStripInnerHtml(orderId, key, mode) {

function refreshMediaStrips(orderId) {
    if (!orderId) return;
    const prefix = orderId + "|";
    document.querySelectorAll("[data-media-strip]").forEach(el => {
        const k = el.getAttribute("data-media-strip") || "";
        if (k.indexOf(prefix) !== 0) return;
        el.innerHTML = mediaStripInnerHtml(orderId, k.slice(prefix.length), el.getAttribute("data-media-mode") || "view");
    });
    document.querySelectorAll("[data-media-count]").forEach(el => {
        const k = el.getAttribute("data-media-count") || "";
        if (k.indexOf(prefix) !== 0) return;
        el.textContent = mediaCountLabel(orderId, k.slice(prefix.length));
        el.setAttribute("aria-label", mediaCountAria(orderId, k.slice(prefix.length)));
    });
    const v = mediaViewer;
    if (v && !v.local && v.orderId === orderId) {
        const curId = v.ids[v.idx];
        v.ids = v.ids.filter(id => !!mediaRowById(orderId, id));
        const ni = v.ids.indexOf(curId);
        if (!v.ids.length) closeMediaViewer(); else if (ni >= 0) v.idx = ni; else {
            v.idx = Math.max(0, Math.min(v.idx, v.ids.length - 1));
            mediaRenderViewer();
        }
    }
    mediaScheduleHydrate();
}

function mediaScheduleHydrate() {
    if (mediaHydrateTimer) return;
    mediaHydrateTimer = setTimeout(() => {
        mediaHydrateTimer = null;
        hydrateMediaThumbs();
    }, 0);
}

async function hydrateMediaThumbs() {
    if (!sb) return;
    const now = Date.now();
    const need = [];
    document.querySelectorAll("img[data-media-thumb]").forEach(img => {
        const p = img.getAttribute("data-media-thumb");
        if (mediaThumbBroken.has(p)) {
            img.classList.add("media-tile-broken");
            return;
        }
        const m = mediaThumbUrlMemo.get(p);
        if (m && m.expMs - now > 12e4) {
            if (img.getAttribute("src") !== m.url) img.setAttribute("src", m.url);
            return;
        }
        if (!mediaThumbInflight.has(p) && need.indexOf(p) < 0) need.push(p);
    });
    if (!need.length) return;
    const gen = mediaStateGen;
    need.forEach(p => mediaThumbInflight.add(p));
    try {
        for (let i = 0; i < need.length; i += 100) {
            const batch = need.slice(i, i + 100);
            const {data: data, error: error} = await withTimeout(sb.storage.from("order-photos").createSignedUrls(batch, 900), GUARDED_AWAIT_TIMEOUT_MS, "thumb urls");
            if (gen !== mediaStateGen) return;
            if (error) throw error;
            const exp = Date.now() + 9e5;
            (data || []).forEach((d, k) => {
                const p = d && d.path || batch[k];
                if (d && d.signedUrl) mediaThumbUrlMemo.set(p, {
                    url: d.signedUrl,
                    expMs: exp
                }); else if (p) mediaThumbBroken.add(p);
            });
        }
    } catch (e) {
        console.warn("hydrateMediaThumbs:", e);
    } finally {
        if (gen === mediaStateGen) need.forEach(p => mediaThumbInflight.delete(p));
    }
    if (gen !== mediaStateGen) return;
    document.querySelectorAll("img[data-media-thumb]").forEach(img => {
        const p = img.getAttribute("data-media-thumb");
        const m = mediaThumbUrlMemo.get(p);
        if (m && img.getAttribute("src") !== m.url) img.setAttribute("src", m.url); else if (!m && mediaThumbBroken.has(p)) img.classList.add("media-tile-broken");
    });
}

function mediaBindDelegationOnce() {
    if (mediaDelegationBound) return;
    mediaDelegationBound = true;
    document.addEventListener("click", mediaDelegatedClick);
    document.addEventListener("error", e => {
        const t = e.target;
        if (t && t.tagName === "IMG" && t.hasAttribute && t.hasAttribute("data-media-thumb")) {
            t.classList.add("media-tile-broken");
            mediaThumbUrlMemo.delete(t.getAttribute("data-media-thumb"));
        }
    }, true);
}

function mediaDelegatedClick(e) {
    const t = e.target;
    if (!t || !t.closest) return;
    let el = t.closest("[data-media-cancel]");
    if (el) {
        e.preventDefault();
        mediaCancelLocal(el.getAttribute("data-media-cancel"));
        return;
    }
    el = t.closest("[data-media-retry]");
    if (el) {
        e.preventDefault();
        mediaRetryLocal(el.getAttribute("data-media-retry"));
        return;
    }
    el = t.closest("[data-media-add]");
    if (el) {
        e.preventDefault();
        mediaOnAddSpec(el.getAttribute("data-media-add"));
        return;
    }
    el = t.closest("[data-media-open-local]");
    if (el) {
        e.preventDefault();
        openMediaViewerLocal(el.getAttribute("data-media-open-local"));
        return;
    }
    el = t.closest("[data-media-open]");
    if (el) {
        e.preventDefault();
        const strip = el.closest("[data-media-strip]");
        const k = strip ? strip.getAttribute("data-media-strip") || "" : "";
        const bar = k.indexOf("|");
        if (bar > 0) openMediaViewer(k.slice(0, bar), el.getAttribute("data-media-open"), k.slice(bar + 1));
    }
}

function mediaOpenModalDraft() {
    const root = document.getElementById("modal-root");
    if (root && root.querySelector("#quote-parts-list") && quoteDraft) return quoteDraft;
    if (root && root.querySelector("#parts-list") && draft) return draft;
    return null;
}

function mediaOnAddSpec(spec) {
    let parts = String(spec || "").split("|");
    if (parts.length === 1 && parts[0] === "vin") {
        const d = mediaOpenModalDraft();
        if (!d) return;
        parts = [ "vin", d.id, "_order:vin" ];
    }
    const surface = parts[0], orderId = parts[1], key = parts[2] || "_order";
    if (!orderId) return;
    const isVin = key === "_order:vin";
    openMediaPicker({
        orderId: orderId,
        draftId: surface === "approved" ? null : orderId,
        partId: isVin || key === "_order" ? null : key,
        kind: isVin ? "vin" : key === "_order" ? "order" : "part",
        surface: surface
    });
}

function mediaCanAddTo(ctx) {
    if (!sb || !ctx || !ctx.orderId) return false;
    if (currentUserRole === "scrapyard") {
        if (ctx.kind === "vin") return false;
        const o = quoteDraft && quoteDraft.id === ctx.orderId ? quoteDraft : (appData.orders || []).find(x => x.id === ctx.orderId);
        return !!(o && (o.isQuote || o.wasQuote));
    }
    return currentUserRole === "full";
}

function mediaTargetLabel(ctx) {
    if (ctx.kind === "vin") return "صورة رقم الهيكل (الاستمارة أو لوحة VIN)";
    if (!ctx.partId) return "الطلبية كاملة";
    const d = draft && draft.id === ctx.orderId ? draft : quoteDraft && quoteDraft.id === ctx.orderId ? quoteDraft : (appData.orders || []).find(o => o.id === ctx.orderId);
    const p = d && (d.parts || []).find(x => x.id === ctx.partId);
    return "القطعة: " + (p && String(p.description || "").trim() || "بدون وصف");
}

function ensureMediaInputs() {
    if (document.getElementById("media-in-photo")) return;
    const mk = (id, accept, capture, multiple) => {
        const el = document.createElement("input");
        el.type = "file";
        el.id = id;
        el.accept = accept;
        el.style.display = "none";
        if (capture) el.setAttribute("capture", "environment");
        if (multiple) el.multiple = true;
        el.addEventListener("change", () => {
            const files = Array.from(el.files || []);
            el.value = "";
            const pick = mediaPendingPick;
            mediaPendingPick = null;
            if (!pick || pick.gen !== mediaStateGen || !files.length) return;
            mediaProcessFiles(files, pick);
        });
        document.body.appendChild(el);
    };
    mk("media-in-photo", "image/*", true, false);
    mk("media-in-video", "video/*", true, false);
    mk("media-in-gallery", "image/*,video/*", false, true);
}

    }
    mediaBindDelegationOnce();
    ensureMediaInputs();
    loadMediaConfig();
    const isVin = ctx.kind === "vin";
    const alt = mediaAltAudience(currentUserRole, ctx.kind);
    const persisted = mediaTargetPersisted(ctx);
    const isPurch = currentUserRole === "scrapyard";

    root.classList.add("modal-open");

        if (tg) {
            const st = mediaPickerState;
            if (!st) return;
            const k = tg.getAttribute("data-media-toggle");
            if (k === "alt") st.altOn = !st.altOn; else st.muteOn = !st.muteOn;
            const on = k === "alt" ? st.altOn : st.muteOn;
            tg.classList.toggle("chip-active", on);
            tg.setAttribute("aria-pressed", on ? "true" : "false");
            return;
        }
        const b = e.target.closest("[data-media-pick]");
        if (b) mediaPickerChoose(b.getAttribute("data-media-pick"));
    });
    window.addEventListener("keydown", mediaOverlayEscListener, true);
}

function mediaPickerChoose(which) {
    const st = mediaPickerState;
    if (which === "cancel" || !st) {
        closeMediaPicker();
        return;
    }
    const ctx = st.ctx;
    const input = document.getElementById(which === "photo" ? "media-in-photo" : which === "video" ? "media-in-video" : "media-in-gallery");
    if (!input) {
        closeMediaPicker();
        return;
    }
    if (which === "gallery") input.setAttribute("accept", ctx.kind === "vin" ? "image/*" : "image/*,video/*");
    const alt = mediaAltAudience(currentUserRole, ctx.kind);
    mediaPendingPick = {
        ctx: ctx,
        audience: st.altOn && alt ? alt : mediaDefaultAudience(currentUserRole, ctx.kind, currentUserIsElevated),
        mute: !!st.muteOn,
        source: which,
        gen: mediaStateGen
    };
    input.value = "";
    input.click();
    closeMediaPicker();
}

function closeMediaPicker() {
    mediaPickerState = null;
    const root = document.getElementById("confirm-root");
    if (root && root.querySelector("[data-media-picker]")) {
        root.innerHTML = "";
        root.classList.remove("modal-open");
    }
    mediaMaybeRemoveEsc();
}

function closeMediaOverlays() {
    closeMediaViewer();
    closeMediaPicker();
}

function mediaProgressSheetOpen() {
    return !!document.querySelector("#media-progress-root [data-media-progress]");
}

function mediaMaybeRemoveEsc() {
    const root = document.getElementById("confirm-root");
    if (mediaProgressSheetOpen()) return;
    if (!root || !root.querySelector("[data-media-viewer],[data-media-picker]")) window.removeEventListener("keydown", mediaOverlayEscListener, true);
}

function mediaOverlayEscListener(e) {
    if (e.key !== "Escape") return;
    if (mediaProgressSheetOpen()) {
        e.preventDefault();
        e.stopPropagation();
        return;
    }
    const root = document.getElementById("confirm-root");
    const isViewer = !!(root && root.querySelector("[data-media-viewer]"));
    const isPicker = !!(root && root.querySelector("[data-media-picker]"));
    if (!isViewer && !isPicker) {
        window.removeEventListener("keydown", mediaOverlayEscListener, true);
        return;
    }
    e.preventDefault();
    e.stopPropagation();
    if (isViewer) closeMediaViewer(); else closeMediaPicker();
}

function mediaErr(code) {
    const e = new Error(code);
    e.mediaCode = code;
    return e;
}

function mediaErrorText(e) {
    const c = e && e.mediaCode;
    if (c === "canceled") return "";
    if (c === "no_library") return "الفيديو غير متاح حاليًا — الصور شغالة";
    if (c === "too_big") return "الفيديو كبير — صوّر مقطع أقصر";
    if (c === "too_big_photo") return "الصورة كبيرة كتير — جرّب صورة تانية";
    if (c === "location") return "الفيديو فيه بيانات موقع وما قدرنا نشيلها — ما انرفع";
    if (c === "too_short") return "الفيديو قصير كتير";
    if (c === "too_long") return "الفيديو أطول من المسموح";
    if (c === "decode") return "الصورة ما انقرأت — جرّب صورة تانية (أو إعداد الكاميرا Most Compatible)";
    if (c === "exif" || c === "encode") return "ما قدرنا نجهّز الصورة — جرّب مرة تانية";
    if (c === "unsupported") return "نوع الملف مش مدعوم";
    if (c) return "الجهاز ما قدر يحوّل هالفيديو — جرّب مقطع تاني أو صوّر من جديد";
    return "تعذر تجهيز الملف: " + friendlyErrorText(e);
}

function mediaFileIsVideo(f) {
    return /^video\//i.test(f.type || "") || /\.(mov|mp4|m4v|3gp|webm|mkv)$/i.test(f.name || "");
}

function mediaFileIsImage(f) {
    return /^image\//i.test(f.type || "") || /\.(jpe?g|png|heic|heif|webp|gif|bmp)$/i.test(f.name || "");
}

function mediaProcessFiles(files, pick) {
    files.forEach(f => {
        mediaFileQueue = mediaFileQueue.then(() => mediaProcessOneFile(f, pick)).catch(e => console.error("mediaProcessOneFile:", e));
    });
}

async function mediaProcessOneFile(file, pick) {
    if (pick.gen !== mediaStateGen) return;
    const isVideo = mediaFileIsVideo(file);
    if (!isVideo && !mediaFileIsImage(file)) {
        showToast("نوع الملف مش مدعوم", "error");
        return;
    }
    if (isVideo && pick.ctx.kind === "vin") {
        showToast("رقم الهيكل: صورة بس", "error");
        return;
    }
    const gen = mediaStateGen;
    try {
        const c = isVideo ? await mediaCompressVideoWithSheet(file, pick) : await compressPhotoFile(file);
        if (!c || gen !== mediaStateGen) return;
        mediaAdd(pick.ctx, c, pick.audience);
    } catch (e) {
        if (gen === mediaStateGen) {
            const msg = mediaErrorText(e);
            if (msg) showToast(msg, "error");
        }
        if (!(e && e.mediaCode)) console.error("media process:", e);
    }
}

function mediaAdd(ctx, c, audience) {
    if (!audience || !c || !c.full || !c.thumb) return;
    const item = {
        localId: uid("mloc"),
        id: newMediaId(),
        orderId: ctx.orderId,
        draftId: ctx.draftId || null,
        partId: ctx.kind === "vin" ? null : ctx.partId || null,
        partKey: mediaPartKey(ctx),
        audience: audience,
        kind: mediaRowKind(ctx, currentUserRole),
        mediaType: c.mediaType,
        full: c.full,
        thumb: c.thumb,
        width: c.width,
        height: c.height,
        durationMs: c.durationMs || null,
        audio: c.audio || null,
        bytes: (c.full.size || 0) + (c.thumb.size || 0),
        previewUrl: null,
        phase: "staged"
    };
    try {
        item.previewUrl = URL.createObjectURL(c.thumb);
    } catch (e) {}
    if (mediaTargetPersisted(ctx)) {
        mediaEnqueueUpload(item);
        return;
    }
    if (!mediaDraftStillOpen(item.draftId)) {
        mediaRevokeItem(item);
        showToast("النافذة انسكّرت قبل الحفظ — الملف ما انضاف", "error");
        return;
    }
    if (!mediaStagePut(item.draftId, item.partKey, item)) {
        mediaRevokeItem(item);
        showToast("احفظ أولًا — في صور/فيديو كتير معلّقة بدون حفظ", "error");
        return;
    }
    refreshMediaStrips(item.orderId);
}

function mediaCanvasToJpeg(canvas, q) {
    if (typeof canvas.convertToBlob === "function") return canvas.convertToBlob({
        type: "image/jpeg",
        quality: q
    }).then(b => new Blob([ b ], {
        type: "image/jpeg"
    }));
    return new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(new Blob([ b ], {
        type: "image/jpeg"
    })) : reject(mediaErr("encode")), "image/jpeg", q));
}

function mediaCanvasJpeg(src, w0, h0, maxSide, q) {
    const s = Math.min(1, maxSide / Math.max(w0, h0));
    const w = Math.min(4096, Math.max(16, Math.round(w0 * s))), h = Math.min(4096, Math.max(16, Math.round(h0 * s)));
    const c = document.createElement("canvas");
    c.width = w;
    c.height = h;
    const g = c.getContext("2d");
    g.fillStyle = "#fff";
    g.fillRect(0, 0, w, h);
    g.drawImage(src, 0, 0, w, h);
    return mediaCanvasToJpeg(c, q).then(blob => {
        c.width = 0;
        c.height = 0;
        return {
            blob: blob,
            w: w,
            h: h
        };
    }, e => {
        c.width = 0;
        c.height = 0;
        throw e;
    });
}

async function compressPhotoFile(file) {
    const url = URL.createObjectURL(file);
    try {
        const img = new Image;
        img.decoding = "async";
        img.src = url;
        try {
            await img.decode();
        } catch (e) {
            throw mediaErr("decode");
        }
        const w0 = img.naturalWidth, h0 = img.naturalHeight;
        if (!w0 || !h0) throw mediaErr("decode");
        let full = await mediaCanvasJpeg(img, w0, h0, 1600, .75);
        if (full.blob.size > 19e5) full = await mediaCanvasJpeg(img, w0, h0, 1280, .6);
        if (full.blob.size > 2e6) throw mediaErr("too_big_photo");
        const thumb = await mediaCanvasJpeg(img, w0, h0, 320, .7);
        for (const b of [ full.blob, thumb.blob ]) {
            if (bytesHasExifApp1(new Uint8Array(await b.slice(0, 65536).arrayBuffer()))) throw mediaErr("exif");
        }
        return {
            mediaType: "image",
            full: full.blob,
            thumb: thumb.blob,
            width: full.w,
            height: full.h
        };
    } finally {
        URL.revokeObjectURL(url);
    }
}

function mediaShowProgressSheet() {
    const sheet = {
        canceled: false,
        cancelFn: null,
        onCancel: null,
        token: String(++mediaProgressSeq)
    };
    const root = document.getElementById("media-progress-root");
    root.innerHTML = '<div class="modal-backdrop" data-media-progress="' + sheet.token + '">' + '<div class="modal-card modal-card-sm" role="alertdialog" aria-modal="true">' + '<div class="modal-title">🎥 جاري ضغط الفيديو <span class="num" id="media-progress-pct"></span></div>' + '<p class="modal-sub" id="media-progress-sub">خلّي التطبيق مفتوح لحد ما يخلص</p>' + '<div class="stat-bar-track" style="margin-top:12px;"><span class="stat-bar-fill" id="media-progress-fill" style="width:0%"></span></div>' + '<div class="modal-footer-actions" style="margin-top:16px;justify-content:flex-end;">' + '<button type="button" class="btn btn-ghost" id="media-progress-cancel">إلغاء</button>' + "</div>" + "</div>" + "</div>";
    root.querySelector("#media-progress-cancel").addEventListener("click", () => {
        mediaCancelSheet(sheet);
        mediaHideProgressSheet(sheet);
    });
    mediaActiveSheet = sheet;
    window.addEventListener("keydown", mediaOverlayEscListener, true);
    return sheet;
}

function mediaCallCancelFn(fn) {
    try {
        const r = fn();
        if (r && typeof r.catch === "function") r.catch(() => {});
    } catch (e) {}
}

function mediaCancelSheet(sheet) {
    if (!sheet || sheet.canceled) return;
    sheet.canceled = true;
    if (sheet.cancelFn) mediaCallCancelFn(sheet.cancelFn);
    if (sheet.onCancel) sheet.onCancel();
}

function mediaUpdateProgressSheet(sheet, p, label) {
    if (sheet.canceled) return;
    const box = document.querySelector('#media-progress-root [data-media-progress="' + sheet.token + '"]');
    if (!box) {
        mediaCancelSheet(sheet);
        return;
    }
    const pct = Math.max(0, Math.min(100, Math.round((Number(p) || 0) * 100)));
    const fill = box.querySelector("#media-progress-fill");
    if (fill) fill.style.width = pct + "%";
    const pctEl = box.querySelector("#media-progress-pct");
    if (pctEl) pctEl.textContent = pct + "%";
    if (label) {
        const sub = box.querySelector("#media-progress-sub");
        if (sub) sub.textContent = label;
    }
}

function mediaHideProgressSheet(sheet) {
    const root = document.getElementById("media-progress-root");
    const box = root && root.querySelector("[data-media-progress]");
    if (!box || sheet && box.getAttribute("data-media-progress") !== sheet.token) return;
    root.innerHTML = "";
    if (!sheet || mediaActiveSheet === sheet) mediaActiveSheet = null;
    mediaMaybeRemoveEsc();
}

async function mediaCompressVideoWithSheet(file, pick) {
    const sheet = mediaShowProgressSheet();
    const canceledP = new Promise((_, reject) => {
        sheet.onCancel = () => reject(mediaErr("canceled"));
    });
    canceledP.catch(() => {});
    const guard = p => Promise.race([ p, canceledP ]);
    mediaUpdateProgressSheet(sheet, 0, "جاري تجهيز أداة الضغط…");
    let wake = null;
    try {
        let MB;
        try {
            MB = await guard(ensureMediabunny());
        } catch (e) {
            if (e && e.mediaCode === "canceled") throw e;
            console.warn("ensureMediabunny:", e);
            throw mediaErr("no_library");
        }
        const cfg = await guard(loadMediaConfig());
        try {
            if (navigator.wakeLock && navigator.wakeLock.request) wake = await navigator.wakeLock.request("screen");
        } catch (e) {}
        if (sheet.canceled) throw mediaErr("canceled");
        mediaUpdateProgressSheet(sheet, 0, "خلّي التطبيق مفتوح لحد ما يخلص");
        const r = await guard(compressVideoFile(file, {
            MB: MB,
            preset: cfg.video_preset,
            maxSec: cfg.video_max_seconds,
            mute: pick.mute,
            isCanceled: () => sheet.canceled,
            setCancel: fn => {
                sheet.cancelFn = fn;
                if (fn && sheet.canceled) mediaCallCancelFn(fn);
            },
            onProgress: (p, stage) => mediaUpdateProgressSheet(sheet, p, stage === "eco" ? "محاولة بحجم أصغر…" : stage === "remux" ? "تجهيز بدون إعادة ضغط…" : null)
        }));
        if (sheet.canceled) throw mediaErr("canceled");
        return {
            mediaType: "video",
            full: r.mp4,
            thumb: r.poster,
            width: r.width,
            height: r.height,
            durationMs: r.durationMs,
            audio: r.audio
        };
    } finally {
        if (wake) {
            try {
                wake.release();
            } catch (e) {}
        }
        if (mediaActiveSheet === sheet) mediaActiveSheet = null;
        mediaHideProgressSheet(sheet);
    }
}

async function mediaInspectVideoSource(MB, file) {
    const input = new MB.Input({
        source: new MB.BlobSource(file),
        formats: MB.ALL_FORMATS
    });
    try {
        const vt = await input.getPrimaryVideoTrack();
        if (!vt) throw mediaErr("no_video");
        const out = {
            w: await vt.getDisplayWidth(),
            h: await vt.getDisplayHeight(),
            durSec: await input.computeDuration(),
            avgBps: 0,
            isAvc: false,
            canDecode: false,
            hdr: false,
            hasAudio: false,
            abps: 0
        };
        try {
            out.avgBps = (await vt.computePacketStats(120)).averageBitrate || 0;
        } catch (e) {}
        try {
            out.isAvc = await vt.getCodec() === "avc";
        } catch (e) {}
        try {
            out.canDecode = await vt.canDecode();
        } catch (e) {}
        try {
            const cs = await vt.getColorSpace();
            out.hdr = !!cs && (cs.transfer === "hlg" || cs.transfer === "pq");
        } catch (e) {}
        try {
            const a = await input.getPrimaryAudioTrack();
            if (a) {
                out.hasAudio = true;
                try {
                    out.abps = (await a.computePacketStats(60)).averageBitrate || 0;
                } catch (e) {}
            }
        } catch (e) {}
        return out;
    } finally {
        try {
            input.dispose();
        } catch (e) {}
    }
}

async function mediaAudioPlan(MB, at, decodable, codec, abps) {
    if (!at) return {
        opts: null,
        mode: "none"
    };
    if (decodable) {
        let ok = false;
        if (typeof AudioEncoder !== "undefined") {
            try {
                const sr = await at.getSampleRate();
                ok = !!(await AudioEncoder.isConfigSupported({
                    codec: "mp4a.40.2",
                    numberOfChannels: 1,
                    sampleRate: sr,
                    bitrate: abps
                })).supported;
            } catch (e) {}
        }
        if (!ok) {
            try {
                await ensureWasmAac(MB);
                ok = true;
            } catch (e) {
                console.warn("ensureWasmAac:", e);
            }
        }
        if (ok) return {
            opts: {
                codec: "aac",
                numberOfChannels: 1,
                quality: new MB.Quality({
                    bitrate: abps
                }),
                forceTranscode: true
            },
            mode: "aac"
        };
    }
    if (codec === "aac") return {
        opts: {},
        mode: "copied"
    };
    return {
        opts: {
            discard: true
        },
        mode: "none",
        lost: true
    };
}

async function mediaVideoAttempt(MB, file, plan, o, mode) {
    if (o.isCanceled && o.isCanceled()) throw mediaErr("canceled");
    const input = new MB.Input({
        source: new MB.BlobSource(file),
        formats: MB.ALL_FORMATS
    });
    try {
        const vt = await input.getPrimaryVideoTrack();
        if (!vt) throw mediaErr("no_video");
        let at = null, decodable = false, codec = null;
        if (!o.mute) {
            at = await input.getPrimaryAudioTrack({
                filter: async t => await t.getCodec() !== null && await t.canDecode()
            });
            decodable = !!at;
            if (!at) at = await input.getPrimaryAudioTrack({
                filter: async t => await t.getCodec() === "aac"
            });
            if (at) codec = await at.getCodec();
        }
        const aPlan = await mediaAudioPlan(MB, at, decodable, codec, plan.abps);
        const videoOpts = mode === "transcode" ? {
            width: plan.W,
            height: plan.H,
            fit: "fill",
            codec: "avc",
            frameRate: plan.fps,
            keyFrameInterval: plan.kfi,
            quality: new MB.Quality(o.cbr ? {
                bitrate: plan.vbps,
                bitrateMode: "constant"
            } : {
                bitrate: plan.vbps
            }),
            forceTranscode: true,
            hardwareAcceleration: "no-preference"
        } : {};
        const output = new MB.Output({
            format: new MB.Mp4OutputFormat({
                fastStart: "in-memory"
            }),
            target: new MB.BufferTarget
        });
        const conv = await MB.Conversion.init({
            input: input,
            output: output,
            tags: {},
            showWarnings: false,
            trim: plan.trimEnd ? {
                end: plan.trimEnd
            } : undefined,
            video: t => t.id === vt.id ? videoOpts : {
                discard: true
            },
            audio: t => at && t.id === at.id && aPlan.opts ? aPlan.opts : {
                discard: true
            }
        });
        if (!conv.isValid || conv.discardedTracks.some(d => d.track.id === vt.id)) throw mediaErr("conv_invalid");
        const audioLost = !!aPlan.lost || !!(at && aPlan.mode !== "none" && conv.discardedTracks.some(d => d.track.id === at.id));
        if (o.setCancel) o.setCancel(() => conv.cancel());
        conv.onProgress = p => {
            if (o.onProgress) o.onProgress(p, o.stage || mode);
        };
        if (o.isCanceled && o.isCanceled()) throw mediaErr("canceled");
        try {
            await conv.execute();
        } catch (e) {
            if (o.isCanceled && o.isCanceled()) throw mediaErr("canceled");
            throw e;
        }
        if (o.isCanceled && o.isCanceled()) throw mediaErr("canceled");
        const buf = output.target.buffer;
        if (!buf) throw mediaErr("conv_invalid");
        return {
            buf: buf,
            bytes: buf.byteLength,
            audio: audioLost ? "none" : aPlan.mode,
            audioLost: audioLost,
            path: mode
        };
    } finally {
        if (o.setCancel) o.setCancel(null);
        try {
            input.dispose();
        } catch (e) {}
    }
}

async function mediaProbeVideoOutput(MB, blob, maxSec) {
    const input = new MB.Input({
        source: new MB.BlobSource(blob),
        formats: MB.ALL_FORMATS
    });
    try {
        const vt = await input.getPrimaryVideoTrack();
        if (!vt) throw mediaErr("probe");
        const cps = String(await vt.getCodecParameterString() || "");
        if (!/^avc1\.(42|4d|64)/i.test(cps)) throw mediaErr("probe_codec");
        const w = await vt.getDisplayWidth(), h = await vt.getDisplayHeight();
        if (!(w >= 16 && h >= 16 && w <= 4096 && h <= 4096)) throw mediaErr("probe");
        const auds = await input.getAudioTracks();
        for (const a of auds) {
            if (await a.getCodec() !== "aac") throw mediaErr("probe_audio");
        }
        const durationMs = Math.round(await input.computeDuration() * 1e3);
        if (!(durationMs >= 300)) throw mediaErr("too_short");
        if (durationMs > Math.min(31e3, (Number(maxSec) + .5) * 1e3)) throw mediaErr("too_long");
        return {
            w: w,
            h: h,
            durationMs: durationMs,
            hasAudio: auds.length > 0
        };
    } finally {
        try {
            input.dispose();
        } catch (e) {}
    }
}

async function mediaPosterViaSink(MB, blob) {
    if (typeof VideoDecoder === "undefined") throw new Error("no_decoder");
    const input = new MB.Input({
        source: new MB.BlobSource(blob),
        formats: MB.ALL_FORMATS
    });
    try {
        const vt = await input.getPrimaryVideoTrack();
        const w = await vt.getDisplayWidth(), h = await vt.getDisplayHeight();
        const s = Math.min(1, 320 / Math.max(w, h));
        const sink = new MB.CanvasSink(vt, {
            width: Math.max(16, Math.round(w * s)),
            height: Math.max(16, Math.round(h * s)),
            fit: "fill"
        });
        const first = await vt.getFirstTimestamp();
        const dur = await vt.computeDuration();
        const wc = await sink.getCanvas(first + Math.min(.5, Math.max(0, (dur - first) / 2))) || await sink.getCanvas(first);
        if (!wc || !wc.canvas) throw new Error("no_frame");
        return await mediaCanvasToJpeg(wc.canvas, .7);
    } finally {
        try {
            input.dispose();
        } catch (e) {}
    }
}

async function mediaPosterViaVideoEl(blob) {
    const url = URL.createObjectURL(blob);
    const v = document.createElement("video");
    v.muted = true;
    v.playsInline = true;
    v.setAttribute("playsinline", "");
    v.preload = "auto";
    const once = (ev, ms) => new Promise((res, rej) => {
        const t = setTimeout(() => rej(new Error("poster_" + ev)), ms);
        v.addEventListener(ev, () => {
            clearTimeout(t);
            res();
        }, {
            once: true
        });
    });
    try {
        const loaded = once("loadeddata", 1e4);
        v.src = url;
        await loaded;
        const seeked = once("seeked", 1e4);
        v.currentTime = isFinite(v.duration) && v.duration > 0 ? Math.min(.5, v.duration / 2) : .1;
        await seeked;
        const s = Math.min(1, 320 / Math.max(v.videoWidth || 1, v.videoHeight || 1));
        const c = document.createElement("canvas");
        c.width = Math.max(16, Math.round((v.videoWidth || 320) * s));
        c.height = Math.max(16, Math.round((v.videoHeight || 180) * s));
        c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
        return await mediaCanvasToJpeg(c, .7);
    } finally {
        try {
            v.removeAttribute("src");
            v.load();
        } catch (e) {}
        URL.revokeObjectURL(url);
    }
}

function mediaPlaceholderPoster(w, h) {
    const s = Math.min(1, 320 / Math.max(w || 320, h || 180));
    const c = document.createElement("canvas");
    c.width = Math.max(16, Math.round((w || 320) * s));
    c.height = Math.max(16, Math.round((h || 180) * s));
    const g = c.getContext("2d");
    g.fillStyle = "#1E2521";
    g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = "#EEF1ED";
    g.font = "bold " + Math.round(Math.min(c.width, c.height) * .4) + "px sans-serif";
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText("▶", c.width / 2, c.height / 2);
    return mediaCanvasToJpeg(c, .7);
}

async function mediaMakePoster(MB, mp4, probe) {
    try {
        return await mediaPosterViaSink(MB, mp4);
    } catch (e) {
        console.warn("poster (sink):", e);
    }
    try {
        return await mediaPosterViaVideoEl(mp4);
    } catch (e) {
        console.warn("poster (video):", e);
    }
    return await mediaPlaceholderPoster(probe.w, probe.h);
}

async function compressVideoFile(file, o) {
    const MB = o.MB || await ensureMediabunny();
    const canceled = () => !!(o.isCanceled && o.isCanceled());
    const src = await mediaInspectVideoSource(MB, file);
    if (canceled()) throw mediaErr("canceled");
    if (src.hdr) showToast("لو الألوان باهتة: الإعدادات › الكاميرا › HDR Video إيقاف", "ok");
    if (src.durSec > o.maxSec + .5) showToast("الفيديو أطول من " + o.maxSec + " ثانية — رح ينحفظ أول " + o.maxSec + " ثانية بس", "ok");
    const srcPlan = {
        w: src.w,
        h: src.h,
        durSec: src.durSec,
        avgBps: src.avgBps
    };
    let plan = mediaVideoPlan(srcPlan, o.preset, o.maxSec);
    let canTranscode = false;
    if (typeof VideoEncoder !== "undefined" && typeof VideoDecoder !== "undefined" && src.canDecode) {
        try {
            canTranscode = await MB.canEncodeVideo("avc", {
                width: plan.W,
                height: plan.H,
                quality: new MB.Quality({
                    bitrate: plan.vbps
                })
            });
        } catch (e) {}
    }
    const attempt = async (p, mode, extra) => {
        try {
            return await mediaVideoAttempt(MB, file, p, Object.assign({}, o, extra || {}), mode);
        } catch (e) {
            if (canceled() || e && e.mediaCode === "canceled") throw mediaErr("canceled");
            console.warn("media video " + mode + ":", e);
            return null;
        }
    };
    let res = canTranscode ? await attempt(plan, "transcode") : null;
    if (res && plan.preset === "std") {
        const budget = res.audio === "copied" && src.abps > 0 ? mediaVideoPlan(Object.assign({
            copiedAbps: src.abps
        }, srcPlan), "std", o.maxSec).budgetBytes : plan.budgetBytes;
        if (res.bytes > 1.3 * budget) {
            const eco = mediaVideoPlan(srcPlan, "eco", o.maxSec);
            const r2 = await attempt(eco, "transcode", {
                cbr: true,
                stage: "eco"
            });
            if (r2 && r2.bytes < res.bytes) {
                res = r2;
                plan = eco;
            }
        }
    }
    if (res && res.bytes >= file.size && src.isAvc && src.durSec <= o.maxSec + .5) {
        const r3 = await attempt(plan, "remux", {
            stage: "remux"
        });
        if (r3 && r3.bytes < res.bytes) res = r3;
    }
    if (!res) res = await attempt(plan, "remux", {
        stage: "remux"
    });
    if (canceled()) throw mediaErr("canceled");
    if (!res) throw mediaErr("conv_invalid");
    if (res.bytes > MEDIA_VIDEO_MAX_BYTES) throw mediaErr("too_big");
    if (bytesHasLocationAtom(new Uint8Array(res.buf))) throw mediaErr("location");
    const mp4 = new Blob([ res.buf ], {
        type: "video/mp4"
    });
    const probe = await mediaProbeVideoOutput(MB, mp4, o.maxSec);
    if (canceled()) throw mediaErr("canceled");
    const audio = probe.hasAudio ? res.audio === "none" ? "aac" : res.audio : "none";
    if (!o.mute && src.hasAudio && audio === "none") showToast("الصوت ما انحفظ", "error");
    const poster = await mediaMakePoster(MB, mp4, probe);
    if (canceled()) throw mediaErr("canceled");
    return {
        mp4: mp4,
        poster: poster,
        width: probe.w,
        height: probe.h,
        durationMs: probe.durationMs,
        audio: audio,
        path: res.path
    };
}

async function mediaLoadFullBlob(row) {
    const hit = mediaBlobLru.get(row.object_path);
    if (hit) {
        mediaBlobLru.delete(row.object_path);
        mediaBlobLru.set(row.object_path, hit);
        return hit.url;
    }
    const gen = mediaStateGen;
    const bucket = row.media_type === "video" ? "order-videos" : "order-photos";
    let dl = mediaBlobInflight.get(row.object_path);
    if (!dl) {
        const p = Promise.resolve(sb.storage.from(bucket).download(row.object_path));
        const clear = () => {
            if (mediaBlobInflight.get(row.object_path) === p) mediaBlobInflight.delete(row.object_path);
        };
        p.then(clear, clear);
        mediaBlobInflight.set(row.object_path, p);
        dl = p;
    }
    const {data: data, error: error} = await withTimeout(dl, row.media_type === "video" ? 9e4 : 3e4, "media download");
    if (error || !data) throw error || new Error("download_failed");
    if (gen !== mediaStateGen) throw new Error("stale");
    const again = mediaBlobLru.get(row.object_path);
    if (again) return again.url;
    const blob = data.type ? data : new Blob([ data ], {
        type: row.mime
    });
    const url = URL.createObjectURL(blob);
    mediaBlobLru.set(row.object_path, {
        url: url,
        bytes: blob.size || 0
    });
    mediaBlobLruBytes += blob.size || 0;
    for (const [k, e] of mediaBlobLru) {
        if (mediaBlobLruBytes <= MEDIA_BLOB_LRU_MAX_BYTES || k === row.object_path) break;
        mediaBlobLru.delete(k);
        mediaBlobLruBytes -= e.bytes;
        try {
            URL.revokeObjectURL(e.url);
        } catch (err) {}
    }
    return url;
}

function mediaRenderViewer() {
    const v = mediaViewer;
    if (!v) return;
    const gen = ++mediaViewerGen;
    if (v.localUrl) {
        try {
            URL.revokeObjectURL(v.localUrl);
        } catch (e) {}
        v.localUrl = null;
    }
    v.armed = false;
    let row = null, metaHtml = "", canDel = false;
    if (v.local) {
        metaHtml = escapeHtml(v.local.phase === "staged" || v.local.phase === "saving" ? "بينرفع بعد حفظ الطلبية" : "قيد الرفع");
    } else {
        row = mediaRowById(v.orderId, v.ids[v.idx]);
        if (!row) {
            closeMediaViewer();
            return;
        }
        metaHtml = mediaViewerMetaHtml(row);
        canDel = mediaCanDelete(row, shownForEmail || presenceEmail, currentUserIsElevated, Date.now());
    }
    const n = v.local ? 1 : v.ids.length;
    const root = document.getElementById("confirm-root");
    root.innerHTML = '<div class="modal-backdrop" data-close-confirm data-media-viewer>' + '<div class="media-viewer" role="dialog" aria-modal="true">' + '<div class="media-viewer-head"><span class="media-viewer-meta">' + metaHtml + "</span>" + '<button type="button" class="icon-btn" data-mv="close" aria-label="إغلاق">✕</button></div>' + '<div class="media-viewer-stage" id="media-viewer-stage">جاري التحميل…</div>' + '<div class="media-viewer-foot">' + (n > 1 ? '<button type="button" class="icon-btn" data-mv="prev"' + (v.idx <= 0 ? " disabled" : "") + ">→ السابق</button>" + '<span class="num">' + (v.idx + 1) + " / " + n + "</span>" + '<button type="button" class="icon-btn" data-mv="next"' + (v.idx >= n - 1 ? " disabled" : "") + ">التالي ←</button>" : "<span></span>") + (canDel ? '<button type="button" class="icon-btn icon-btn-danger" data-mv="del">🗑️ حذف</button>' : "") + "</div>" + "</div>" + "</div>";
    root.classList.add("modal-open");
    root.querySelector("[data-media-viewer]").addEventListener("click", mediaViewerClick);
    window.addEventListener("keydown", mediaOverlayEscListener, true);
    const isVideo = v.local ? v.local.mediaType === "video" : row.media_type === "video";
    let srcP;
    if (v.local) {
        try {
            v.localUrl = URL.createObjectURL(v.local.full);
            srcP = Promise.resolve(v.localUrl);
        } catch (e) {
            srcP = Promise.reject(e);
        }
    } else srcP = mediaLoadFullBlob(row);
    srcP.then(url => mediaViewerShow(gen, url, isVideo, row), err => {
        console.warn("media viewer:", err);
        mediaViewerFail(gen);
    });
}

function mediaViewerShow(gen, url, isVideo, row) {

}

function mediaViewerFail(gen) {

}

function mediaViewerClick(e) {
    const v = mediaViewer;
    if (!v) return;
    if (e.target.hasAttribute("data-media-viewer")) {
        closeMediaViewer();
        return;
    }
    const b = e.target.closest("[data-mv]");
    if (!b) return;
    const act = b.getAttribute("data-mv");
    if (act === "close") {
        closeMediaViewer();
        return;
    }
    if (act === "retry") {
        mediaRenderViewer();
        return;
    }
    if (act === "prev" && v.idx > 0) {
        v.idx--;
        mediaRenderViewer();
        return;
    }
    if (act === "next" && v.idx < v.ids.length - 1) {
        v.idx++;
        mediaRenderViewer();
        return;
    }
    if (act === "del") mediaViewerDeleteTap(b);
}

async function mediaViewerDeleteTap(btn) {
    const v = mediaViewer;
    if (!v || v.local || v.busy) return;
    if (!v.armed) {
        v.armed = true;
        btn.textContent = "اضغط مرة تانية للتأكيد";
        const armedGen = mediaViewerGen;
        setTimeout(() => {
            if (mediaViewer !== v || mediaViewerGen !== armedGen || !v.armed || v.busy) return;
            v.armed = false;
            const b = document.querySelector('#confirm-root [data-mv="del"]');
            if (b) b.textContent = "🗑️ حذف";
        }, 4e3);
        return;
    }
    const row = mediaRowById(v.orderId, v.ids[v.idx]);
    if (!row) return;
    v.busy = true;
    btn.disabled = true;
    btn.textContent = "جاري الحذف…";
    const ok = await mediaDeleteItem(row);
    v.busy = false;
    if (mediaViewer !== v) return;
    if (!ok) {
        mediaRenderViewer();
        return;
    }
    showToast("انحذف", "ok");
    v.ids = v.ids.filter(id => id !== row.id);
    if (!v.ids.length) {
        closeMediaViewer();
        return;
    }
    v.idx = Math.min(v.idx, v.ids.length - 1);
    mediaRenderViewer();
}

function businessMinutesBetween(startMs, endMs, startHour, endHour) {
    if (!(startMs < endMs)) return 0;
    let totalMs = 0;
    const dayCursor = new Date(startMs);
    dayCursor.setHours(0, 0, 0, 0);
    while (dayCursor.getTime() <= endMs) {
        const winStart = new Date(dayCursor);
        winStart.setHours(startHour, 0, 0, 0);
        const winEnd = new Date(dayCursor);
        winEnd.setHours(endHour, 0, 0, 0);
        const from = Math.max(winStart.getTime(), startMs);
        const to = Math.min(winEnd.getTime(), endMs);
        if (to > from) totalMs += to - from;
        dayCursor.setDate(dayCursor.getDate() + 1);
    }
    return Math.floor(totalMs / 6e4);
}

function quoteBusinessMinutesElapsed(createdAtIso, nowMs) {
    if (!createdAtIso) return 0;
    const startMs = new Date(createdAtIso).getTime();
    const now = nowMs != null ? nowMs : Date.now();
    return businessMinutesBetween(startMs, now, QUOTE_BUSINESS_START_HOUR, QUOTE_BUSINESS_END_HOUR);
}

function quoteElapsedSeverity(createdAtIso, nowMs) {

    if (mins >= 40) return "warn";

}

async function moveQuotePriority(orderId, dir) {
    if (!canReorderQuotePriority()) return;
    const list = quotesMatchingList();
    const idx = list.findIndex(o => o.id === orderId);
    if (idx < 0) return;
    const targetIdx = dir === "up" ? idx - 1 : idx + 1;
    if (targetIdx < 0 || targetIdx >= list.length) return;
    const reordered = list.slice();
    const tmp = reordered[idx];
    reordered[idx] = reordered[targetIdx];
    reordered[targetIdx] = tmp;
    const updates = [];
    reordered.forEach((o, i) => {
        const newPriority = i + 1;
        const prevPriority = Number.isFinite(o.priority) ? o.priority : null;
        if (prevPriority !== newPriority) updates.push({
            id: o.id,
            newPriority: newPriority,
            prevPriority: prevPriority
        });
    });
    if (!updates.length) return;
    updates.forEach(u => {
        const o = appData.orders.find(x => x.id === u.id);
        if (o) o.priority = u.newPriority;
    });
    renderQuotesList();
    const results = await Promise.all(updates.map(async u => {
        const fresh = appData.orders.find(x => x.id === u.id);
        if (!fresh) return true;
        fresh.priority = u.newPriority;
        fresh.updatedAt = (new Date).toISOString();
        return await persistOrder(fresh, false);
    }));
    if (results.some(r => !r)) {
        updates.forEach(u => {
            const o = appData.orders.find(x => x.id === u.id);
            if (o) o.priority = u.prevPriority;
        });
        renderQuotesList();
        showToast("تعذر تحديث ترتيب الأولوية", "error");
    }
}

            used: p.used === null ? null : !!p.used,
            supplierId: p.supplierId || null
        }))
    });

function openQuoteModal(mode, orderId, role) {
    quoteModalRole = role === "purchasing" ? "purchasing" : "sales";
    selectedQuotePartType = null;
    if (mode === "create") {
        quoteDraft = {
            id: uid("ord"),
            orderNumber: nextOrderNumber(),
            orderLabel: "",
            parts: [],
            partsSelectionEnabled: false,
            paidToAmer: false,
            paidToOmar: false,
            paidToSupplier: false,
            supplied: false,
            customerPhone: "",
            customerId: null,
            customerPayments: [],
            confirmed: false,
            feeEnabled: false,
            feePercent: 0,
            serviceFeeEnabled: false,
            serviceFeePercent: 0,
            deliveryFeeEnabled: false,
            deliveryFeeAmount: 0,
            deliveryCost: 0,
            createdAt: (new Date).toISOString(),
            updatedAt: (new Date).toISOString(),
            isQuote: true,
            wasQuote: true,
            quoteReady: false,
            isNew: true
        };
    } else {
        const found = appData.orders.find(o => o.id === orderId);
        if (!found) {
            modalCloseCallback = null;
            showToast("هذه الطلبية غير موجودة (يمكن انحذفت)", "error");
            return;
        }
        quoteDraft = JSON.parse(JSON.stringify(found));
        quoteDraft.isNew = false;
    }
    quoteOriginalSnapshot = quoteContentSnapshot(quoteDraft);
    quoteOpenedAtUpdatedAt = quoteDraft.updatedAt || null;
    if (quoteDraft.isNew) {
        persistedPartIds.delete(quoteDraft.id);
        mediaIndexInitEmpty(quoteDraft.id);
    } else mediaSeedPersisted(quoteDraft.id, quoteDraft.parts);
    const root = document.getElementById("modal-root");
    root.innerHTML = quoteModalHtml(quoteDraft);
    root.classList.add("modal-open");
    attachQuoteModalHandlers();
    updateQuoteModalTotals();
    if (!quoteDraft.isNew) ensureOrderMediaLoaded(quoteDraft.id, true);
    document.addEventListener("keydown", quoteEscListener);
}

function closeQuoteModal() {
    const root = document.getElementById("modal-root");
    root.innerHTML = "";
    root.classList.remove("modal-open");
    if (quoteDraft) mediaDiscardStaged(quoteDraft.id);
    closeMediaOverlays();
    quoteDraft = null;
    document.removeEventListener("keydown", quoteEscListener);
    if (modalCloseCallback) {
        const cb = modalCloseCallback;
        modalCloseCallback = null;
        cb();
    }
}

function quoteEscListener(e) {
    if (e.key !== "Escape") return;
    const confirmRoot = document.getElementById("confirm-root");
    if (confirmRoot && confirmRoot.classList.contains("modal-open")) return;
    closeQuoteModal();
}

function attachQuoteModalHandlers() {
    const root = document.getElementById("modal-root");
    const isPurchasing = quoteModalRole === "purchasing";
    root.querySelector("[data-close-backdrop]").addEventListener("click", e => {
        if (e.target.hasAttribute("data-close-backdrop")) closeQuoteModal();
    });
    root.querySelector("#quote-modal-close-btn").addEventListener("click", closeQuoteModal);
    root.querySelector("#quote-cancel-btn").addEventListener("click", closeQuoteModal);
    root.querySelector("#quote-label-input").addEventListener("input", e => {
        quoteDraft.orderLabel = e.target.value;
    });
    bindVinInput("quote", () => quoteDraft);
    bindVinCopyButtons(root);
    if (!isPurchasing) {
        const quoteQuickAddCustomer = prefill => {
            const openedForQuoteId = quoteDraft ? quoteDraft.id : null;
            openQuickAddCustomerModal(newCustomer => {
                if (!quoteDraft || quoteDraft.id !== openedForQuoteId) return;
                quoteDraft.customerId = newCustomer.id;
                quoteDraft.customerPhone = newCustomer.phone || "";
                const wrap = document.querySelector("#quote-customer-select .searchable-select");
                if (wrap) {
                    wrap.setAttribute("data-selected-id", newCustomer.id);
                    const input = wrap.querySelector(".searchable-select-input");
                    if (input) {
                        input.value = newCustomer.name || newCustomer.phone || "عميل";
                        input.classList.remove("select-empty-warn");
                    }
                }
            }, prefill);
        };
        bindSearchableSelect(root.querySelector("#quote-customer-select .searchable-select"), () => (appData.customers || []).map(c => ({
            id: c.id,
            label: c.name || c.phone || "عميل",
            sublabel: c.phone
        })), id => {
            quoteDraft.customerId = id || null;
            const c = (appData.customers || []).find(c => c.id === quoteDraft.customerId);
            quoteDraft.customerPhone = c ? c.phone || "" : "";
        }, typedText => quoteQuickAddCustomer(looksLikePhoneNumber(typedText) ? {
            phone: typedText
        } : {
            name: typedText
        }));
        root.querySelector("#quote-add-customer-btn").addEventListener("click", () => quoteQuickAddCustomer());
    }
    bindQuotePartAddControls();
    bindQuotePartRowEvents();

                confirmLabel: "تأكيد الحذف",

                onConfirm: async () => {
                    const deleted = await deleteOrder(id);
