          '<button type="button" class="btn '+(d.supplied?'btn-supplied-on':'btn-ghost')+'" id="modal-supplied-btn"'+(!d.confirmed?' disabled title="لازم تأكيد الطلبية أولًا"':'')+'>'+(d.supplied?'✅ تم التوريد':'🚚 تم التوريد')+'</button>' +
          '<button type="button" class="btn btn-primary" id="modal-save-btn">حفظ الطلبية</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function openModal(mode, orderId){
  selectedPartType = null;
  partReturnSelectionMode = false;
  partReturnSelected = {};
  editingPayments = {};
  if(mode==='create'){
    draft = {
      id: uid('ord'),
      orderNumber: nextOrderNumber(),
      orderLabel: '',
      parts: [],
      partsSelectionEnabled:false,
      paidToAmer:false,
      paidToSupplier:false,
      supplied:false,
      customerPhone:'',
      customerId: null,
      customerPayments:[],
      confirmed:false,
      feeEnabled:false,
      feePercent:0,
      serviceFeeEnabled:false,
      serviceFeePercent:0,
      deliveryFeeEnabled:false,
      deliveryFeeAmount:0,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      isNew:true
    };
  } else {
    const found = appData.orders.find(o=>o.id===orderId);
    if(!found) return;
    draft = JSON.parse(JSON.stringify(found));
    draft.isNew = false;
  }
  const root = document.getElementById('modal-root');
  root.innerHTML = modalHtml(draft);
  root.classList.add('modal-open');
  attachModalHandlers();
  updateModalTotals();
  document.addEventListener('keydown', escListener);
  const firstInput = root.querySelector('.order-number-input');
  if(firstInput) firstInput.focus();
}

function closeModal(){
  const root = document.getElementById('modal-root');
  root.innerHTML='';
  root.classList.remove('modal-open');
  draft=null;
  document.removeEventListener('keydown', escListener);
}

function escListener(e){ if(e.key==='Escape') closeModal(); }

function attachModalHandlers(){
  const root = document.getElementById('modal-root');
  root.querySelector('[data-close-backdrop]').addEventListener('click', (e)=>{
    if(e.target.hasAttribute('data-close-backdrop')) closeModal();
  });
  root.querySelector('#modal-close-btn').addEventListener('click', closeModal);
  root.querySelector('#modal-cancel-btn').addEventListener('click', closeModal);

  bindReturnModeControls();

  root.querySelector('#order-label-input').addEventListener('input', e=>{ draft.orderLabel = e.target.value; });
  root.querySelector('#order-customer-select').addEventListener('change', e=>{
    draft.customerId = e.target.value || null;
    const c = (appData.customers||[]).find(c=>c.id===draft.customerId);
    draft.customerPhone = c ? (c.phone||'') : '';
  });
  root.querySelector('#order-add-customer-btn').addEventListener('click', ()=>{
    openQuickAddCustomerModal((newCustomer)=>{
      draft.customerId = newCustomer.id;
      draft.customerPhone = newCustomer.phone || '';
      const sel = document.getElementById('order-customer-select');
      if(sel){
        const opt = document.createElement('option');
        opt.value = newCustomer.id;
        opt.textContent = newCustomer.name || newCustomer.phone || 'عميل';
        sel.appendChild(opt);
        sel.value = newCustomer.id;
      }
    });
  });
  root.querySelector('#btn-toggle-part-selection').addEventListener('click', ()=>{
    draft.partsSelectionEnabled = !draft.partsSelectionEnabled;
    refreshPartsList();
    const btn = root.querySelector('#btn-toggle-part-selection');
    if(btn){
      btn.classList.toggle('chip-active', draft.partsSelectionEnabled);
      btn.textContent = '🎯 تحديد القطع' + (draft.partsSelectionEnabled ? ' (مفعّل)' : '');
    }
  });

  bindPartAddControls();

  const copyBtn = root.querySelector('#copy-parts-btn');
  if(copyBtn) copyBtn.addEventListener('click', copyPartsToClipboard);
  const pasteBtn = root.querySelector('#paste-parts-btn');
  if(pasteBtn) pasteBtn.addEventListener('click', pastePartsFromClipboard);

  root.querySelector('#cost-split-amer-btn').addEventListener('click', ()=>{
    const willPay = !draft.paidToAmer;
    confirmAction({
      title: willPay ? 'تحديد الطلبية كـ"مسدد للتشليح"؟' : 'إلغاء تحديد الطلبية كـ"مسدد للتشليح"؟',
      confirmLabel: 'نعم',
      cancelLabel: 'لا',
      onConfirm: ()=>{
        draft.paidToAmer = willPay;
        const btn = document.getElementById('cost-split-amer-btn');
        if(btn){
          btn.classList.toggle('cost-split-paid', willPay);
          document.getElementById('cost-amer-status').textContent = willPay ? '✓ مسدد' : 'غير مسدد';
        }
      }
    });
  });
  root.querySelector('#cost-split-supplier-btn').addEventListener('click', ()=>{
    const willPay = !draft.paidToSupplier;
    confirmAction({
      title: willPay ? 'تحديد الطلبية كـ"مسدد للمورد"؟' : 'إلغاء تحديد الطلبية كـ"مسدد للمورد"؟',
      confirmLabel: 'نعم',
      cancelLabel: 'لا',
      onConfirm: ()=>{
        draft.paidToSupplier = willPay;
        const btn = document.getElementById('cost-split-supplier-btn');
        if(btn){
          btn.classList.toggle('cost-split-paid', willPay);
          document.getElementById('cost-supplier-status').textContent = willPay ? '✓ مسدد' : 'غير مسدد';
        }
      }
    });
  });
  const suppliedBtn = root.querySelector('#modal-supplied-btn');
  if(suppliedBtn){
    suppliedBtn.addEventListener('click', ()=>{
      const willSupply = !draft.supplied;
      confirmAction({
        title: willSupply ? 'تحديد الطلبية كـ"تم التوريد"؟' : 'إلغاء تحديد "تم التوريد"؟',
        confirmLabel: 'نعم',
        cancelLabel: 'لا',
        onConfirm: ()=>{
          draft.supplied = willSupply;
          draft.suppliedAt = willSupply ? new Date().toISOString() : null;
          suppliedBtn.textContent = willSupply ? '✅ تم التوريد' : '🚚 تم التوريد';
          suppliedBtn.classList.toggle('btn-supplied-on', willSupply);
          suppliedBtn.classList.toggle('btn-ghost', !willSupply);
        }
      });
    });
  }
  root.querySelector('#add-payment-btn').addEventListener('click', ()=>{
    if(!Array.isArray(draft.customerPayments)) draft.customerPayments = [];
    const newPayment = {id:uid('pay'), amount:'', method:'', date:todayNumeric()};
    draft.customerPayments.push(newPayment);
    editingPayments[newPayment.id] = true;
    refreshPaymentsList();
  });
  bindPaymentRowEvents();

  root.querySelector('#order-fee-toggle').addEventListener('change', (e)=>{
    draft.feeEnabled = e.target.checked;
    const row = document.getElementById('order-fee-percent-row');
    if(row) row.style.display = e.target.checked ? '' : 'none';
    updateModalTotals();
  });
  root.querySelector('#order-fee-percent-input').addEventListener('input', (e)=>{
    draft.feePercent = e.target.value===''? 0 : Number(e.target.value);
    updateModalTotals();
  });
  root.querySelector('#order-service-fee-toggle').addEventListener('change', (e)=>{
    draft.serviceFeeEnabled = e.target.checked;
    const row = document.getElementById('order-service-fee-percent-row');
    if(row) row.style.display = e.target.checked ? '' : 'none';
    updateModalTotals();
  });
  root.querySelector('#order-service-fee-percent-input').addEventListener('input', (e)=>{
    draft.serviceFeePercent = e.target.value===''? 0 : Number(e.target.value);
    updateModalTotals();
  });
  root.querySelector('#order-delivery-fee-toggle').addEventListener('change', (e)=>{
    draft.deliveryFeeEnabled = e.target.checked;
    const row = document.getElementById('order-delivery-fee-row');
    if(row) row.style.display = e.target.checked ? '' : 'none';
    updateModalTotals();
  });
  root.querySelector('#order-delivery-fee-input').addEventListener('input', (e)=>{
    draft.deliveryFeeAmount = e.target.value===''? 0 : Number(e.target.value);
    updateModalTotals();
  });

  bindPartRowEvents();

  root.querySelector('#modal-save-btn').addEventListener('click', onSaveOrder);

  const delBtn = root.querySelector('#modal-delete-btn');
  if(delBtn){
    delBtn.addEventListener('click', ()=>{
      const id = draft.id;
      closeModal();
      confirmDelete(id);
    });
  }

  const quoteBtn = root.querySelector('#modal-quote-btn');
  if(quoteBtn){
    quoteBtn.addEventListener('click', async ()=>{
      const id = draft.id;
      const ok = await onSaveOrder();
      if(ok) openDocumentView(id, 'quote');
    });
  }
  const invoiceBtn = root.querySelector('#modal-invoice-btn');
  if(invoiceBtn){
    invoiceBtn.addEventListener('click', async ()=>{
      const id = draft.id;
      const ok = await onSaveOrder();
      if(ok) openDocumentView(id, 'invoice');

function bindPartRowEvents(){
  const root = document.getElementById('modal-root');
  root.querySelectorAll('.part-row').forEach(row=>{
    const pid = row.getAttribute('data-part-id');
    const part = draft.parts.find(p=>p.id===pid);
    if(!part) return;
    const includeCheck = row.querySelector('.part-include-check');
    if(includeCheck){
      includeCheck.addEventListener('change', e=>{
        part.included = e.target.checked;
        refreshPartsList();
      });
    }
    const descInput = row.querySelector('.part-desc-input');
    if(descInput) descInput.addEventListener('input', e=>{ part.description = e.target.value; });
    const qtyInput = row.querySelector('.part-qty-input');
    if(qtyInput){
      qtyInput.addEventListener('input', e=>{
        part.qty = e.target.value===''? 1 : Number(e.target.value);
        updateModalTotals();
      });
    }
    const costInput = row.querySelector('.part-cost-input');
    if(costInput){
      costInput.addEventListener('input', e=>{
        part.costPrice = e.target.value===''? '' : Number(e.target.value);
        updateModalTotals();
      });
    }
    const sellInput = row.querySelector('.part-sell-input');
    if(sellInput){
      sellInput.addEventListener('input', e=>{
        part.sellPrice = e.target.value===''? null : Number(e.target.value);
        updateModalTotals();
      });
    }
    const supplierSelect = row.querySelector('.part-supplier-select');
    if(supplierSelect){
      supplierSelect.addEventListener('change', e=>{ part.supplierId = e.target.value || null; });
    }
    const removeBtn = row.querySelector('[data-remove-part]');
    if(removeBtn){
      removeBtn.addEventListener('click', ()=>{
        confirmAction({
          title: 'حذف هذه القطعة؟',
          message: part.description ? 'القطعة: '+part.description : undefined,
          confirmLabel: 'تأكيد الحذف',
          dangerous: true,
          onConfirm: ()=>{
            draft.parts = draft.parts.filter(p=>p.id!==pid);
            refreshPartsList();
          }
        });
      });
    }
    const toggleUsedBtn = row.querySelector('[data-toggle-used]');
    if(toggleUsedBtn){
      toggleUsedBtn.addEventListener('click', ()=>{
        const willBeUsed = !part.used;
        confirmAction({
          title: willBeUsed ? 'تغيير القطعة إلى مستعملة؟' : 'تغيير القطعة إلى غير مستعملة؟',
          message: part.description ? 'القطعة: '+part.description : undefined,
          confirmLabel: 'تأكيد التغيير',
          onConfirm: async ()=>{
            part.used = willBeUsed;
            refreshPartsList();
            await cancelPendingScrapyardProposalsForPart(part.id);
          }
        });
      });
    }
    const returnSelectCheck = row.querySelector('.part-return-select-check');
    if(returnSelectCheck){
      returnSelectCheck.addEventListener('change', e=>{
        if(e.target.checked) partReturnSelected[pid] = true; else delete partReturnSelected[pid];
        refreshReturnModeControls();
      });
    }
    const undoReturnBtn = row.querySelector('[data-undo-return-part]');
    if(undoReturnBtn){
      undoReturnBtn.addEventListener('click', ()=>{
        confirmAction({
          title: 'التراجع عن إرجاع هذه القطعة؟',
          message: 'رح ترجع القطعة لحساب الطلبية بشكل طبيعي.',
          confirmLabel: 'تراجع',
          onConfirm: ()=>{
            delete part.returned;
            delete part.returnHasReceivable;
            delete part.returnCollected;
            draft.customerPayments = (draft.customerPayments||[]).filter(p=>!(p.returnAdjustment && p.linkedPartId===pid));
            refreshPartsList();
            refreshPaymentsList();
          }
        });
      });
    }
  });
}

function refreshPartsList(){
  const list = document.getElementById('parts-list');
  list.innerHTML = draft.parts.map(partRowHtml).join('');
  bindPartRowEvents();
  refreshPartAddControls();
  updateModalTotals();
}

/* زر "إرجاع" جنب "حذف الطلبية" — يفعّل وضع تحديد القطع، وبعدها زر تأكيد يطبّق الإرجاع دفعة وحدة */
function returnModeControlsHtml(){
  const selectedCount = Object.keys(partReturnSelected).length;
  return '<button type="button" class="btn btn-sm btn-ghost" id="modal-toggle-return-btn">'+(partReturnSelectionMode?'✕ إلغاء التحديد':'🔄 إرجاع')+'</button>' +
    (partReturnSelectionMode ? '<button type="button" class="btn btn-sm btn-primary" id="modal-confirm-return-btn"'+(selectedCount?'':' disabled')+'>✅ تأكيد إرجاع المحدد ('+selectedCount+')</button>' : '');
}

function refreshReturnModeControls(){
  const wrap = document.getElementById('return-mode-controls');
  if(!wrap) return;
  wrap.innerHTML = returnModeControlsHtml();
  bindReturnModeControls();
}

function bindReturnModeControls(){
  const toggleBtn = document.getElementById('modal-toggle-return-btn');
  if(toggleBtn){
    toggleBtn.addEventListener('click', ()=>{
      partReturnSelectionMode = !partReturnSelectionMode;
      if(!partReturnSelectionMode) partReturnSelected = {};
      refreshPartsList();
      refreshReturnModeControls();
    });
  }
  const confirmBtn = document.getElementById('modal-confirm-return-btn');
  if(confirmBtn){
    confirmBtn.addEventListener('click', ()=>{
      const selectedIds = Object.keys(partReturnSelected).filter(id=>partReturnSelected[id]);
      if(!selectedIds.length) return;
      const selectedParts = draft.parts.filter(p=>selectedIds.includes(p.id));
      const missingSupplier = selectedParts.some(p=>{
        const hasReceivable = p.used ? draft.paidToAmer : draft.paidToSupplier;
        return hasReceivable && !p.supplierId;
      });
      if(missingSupplier){
        showToast('حدد المورد لكل قطعة مدفوعة مسبقًا قبل تأكيد الإرجاع', 'error');
        return;
      }
      const anyPaid = selectedParts.some(p=> p.used ? draft.paidToAmer : draft.paidToSupplier);
      confirmAction({
        title: 'تأكيد إرجاع '+selectedIds.length+' قطعة؟',
        message: anyPaid
          ? 'بعض القطع مدفوعة مسبقًا — مبلغها رح يظهر كمسترجع بانتظار التحصيل بشاشة الموردين، وينخصم من دفعة الزبون تلقائيًا.'
          : 'رح تُستبعد من حسابات الطلبية مباشرة.',
        confirmLabel: 'تأكيد الإرجاع',
        dangerous: true,
        onConfirm: ()=>{
          selectedParts.forEach(p=> applyPartReturn(p));
          partReturnSelected = {};
          partReturnSelectionMode = false;
          refreshPartsList();
          refreshPaymentsList();
          refreshReturnModeControls();
        }
      });
    });
  }
}

/* تطبيق إرجاع قطعة وحدة: تعليمها كمرتجعة، وإذا كان الزبون دفع أكثر من المطلوب بعد استبعادها
   (يعني كان دفع ثمنها ضمن دفعاته) نضيف تلقائيًا دفعة "مرتجع" سالبة الأثر تعادل الفرق،
   لحد ما يُحصّل مبلغها من المورد (عندها تُلغى تلقائيًا وترجع للحسابات — orderTotals يتكفّل بهيك). */
function applyPartReturn(part){
  const hasReceivable = part.used ? draft.paidToAmer : draft.paidToSupplier;
  part.returned = true;
  part.returnHasReceivable = hasReceivable;
  part.returnCollected = false;

  const sellAmount = (part.sellPrice!==null && part.sellPrice!==undefined && part.sellPrice!=='') ? (Number(part.qty)||1)*Number(part.sellPrice) : 0;
  if(sellAmount<=0) return;

  const t = orderTotals(draft);
  const overpay = round2(t.customerPaidAmount - (t.hasSell ? t.sellTotal : 0));
  if(overpay > 0.01){
    const refundAmount = round2(Math.min(overpay, sellAmount));
    part.customerRefundConfirmed = false; // ما يخصم من الصندوق إلا بعد تأكيد صريح من شاشة العملاء إنه رجع فعليًا
    if(!Array.isArray(draft.customerPayments)) draft.customerPayments = [];
    draft.customerPayments.push({
      id: uid('pay'), amount: refundAmount, method: 'مرتجع', date: todayNumeric(),
      returnAdjustment: true, linkedPartId: part.id
    });
  }
}

function bindPaymentRowEvents(){
  const root = document.getElementById('modal-root');
  root.querySelectorAll('.payment-row').forEach(row=>{
    const pid = row.getAttribute('data-payment-id');
    const payment = (draft.customerPayments||[]).find(p=>p.id===pid);
    if(!payment) return;
    const amountInput = row.querySelector('.payment-amount-input');
    if(amountInput){
      amountInput.addEventListener('input', e=>{
        let val = e.target.value===''? '' : Number(e.target.value);
        if(val !== '' && val < 0) val = 0;
        // أي زيادة عن المبلغ المستحق مقبولة — تظهر "زيادة" بدل "المتبقي عليه" بملخص الدفعات
        payment.amount = val;
        updateModalTotals();
      });
    }
    const methodSelect = row.querySelector('.payment-method-select');
    if(methodSelect) methodSelect.addEventListener('change', e=>{ payment.method = e.target.value; });
    const removeBtn = row.querySelector('[data-remove-payment]');
    if(removeBtn){
      removeBtn.addEventListener('click', ()=>{
        confirmAction({
          title: 'حذف هذه الدفعة؟',
          message: payment.amount ? 'المبلغ: '+fmtMoney(payment.amount) : undefined,
          confirmLabel: 'تأكيد الحذف',
          dangerous: true,
          onConfirm: ()=>{
            draft.customerPayments = draft.customerPayments.filter(p=>p.id!==pid);
            delete editingPayments[pid];
            refreshPaymentsList();
          }
        });
      });
    }
    const editBtn = row.querySelector('.payment-edit-btn');
    if(editBtn){
      editBtn.addEventListener('click', ()=>{
        editingPayments[pid] = true;
        refreshPaymentsList();
      });
    }
    const saveBtn = row.querySelector('.payment-save-btn');
    if(saveBtn){
      saveBtn.addEventListener('click', ()=>{
        if(!payment.method){
          showToast('لازم تحدد طريقة الدفع (كاش/شبكة) أولًا', 'error');
          return;
        }
        delete editingPayments[pid];
        refreshPaymentsList();
      });
    }
  });
}

function refreshPaymentsList(){
  const list = document.getElementById('payments-list');
  list.innerHTML = (draft.customerPayments||[]).map(paymentRowHtml).join('');
  bindPaymentRowEvents();
  updateModalTotals();
}

function updateModalTotals(){
  const t = orderTotals(draft);
  document.getElementById('total-cost-display').textContent = fmtMoney(t.costTotal);
  document.getElementById('total-sell-display').textContent = t.hasSell? fmtMoney(t.sellTotal) : (t.allPartsReturned?'مرتجعة':'لم يُسعّر بعد');
  const costSupplierEl = document.getElementById('cost-supplier-display');
  if(costSupplierEl) costSupplierEl.textContent = fmtMoney(t.costToSupplier);
  const costAmerEl = document.getElementById('cost-amer-display');
  if(costAmerEl) costAmerEl.textContent = fmtMoney(t.costToScrapyard);
  const feePreviewEl = document.getElementById('fee-amount-preview');
  if(feePreviewEl){
    feePreviewEl.textContent = (t.feeEnabled && t.feeAmount>0) ? ('= '+fmtMoney(t.feeAmount)) : '';
  }
  const serviceFeePreviewEl = document.getElementById('service-fee-amount-preview');
  if(serviceFeePreviewEl){
    serviceFeePreviewEl.textContent = (t.serviceFeeEnabled && t.serviceFeeAmount>0) ? ('= '+fmtMoney(t.serviceFeeAmount)) : '';
  }
  const profitEl = document.getElementById('total-profit-display');
  profitEl.textContent = t.hasSell? fmtMoney(t.profit) : '—';
  profitEl.classList.remove('text-green','text-rust','text-amber');
  if(t.hasSell){
    if(t.profit<0) profitEl.classList.add('text-rust');
    else if(t.customerFullyPaid) profitEl.classList.add('text-green');
    else profitEl.classList.add('text-amber');
  }
  const profitSubEl = document.getElementById('total-profit-sub');
  if(profitSubEl){
    if(t.hasSell && t.customerPaidAmount>0 && !t.customerFullyPaid){
      profitSubEl.innerHTML = 'محصّل <span class="text-green">'+fmtMoney(t.collectedProfit)+'</span> · متبقي <span class="text-amber">'+fmtMoney(t.uncollectedProfit)+'</span>';
    } else {
      profitSubEl.innerHTML = '';
    }
  }
  const remainEl = document.getElementById('customer-remaining-display');
  const remainLabelEl = document.getElementById('customer-remaining-label');
  if(remainEl){
    const isExcess = t.hasSell && t.customerRemaining < -0.01;
    if(remainLabelEl) remainLabelEl.textContent = isExcess ? 'زيادة' : 'المتبقي عليه';
    remainEl.textContent = t.hasSell ? fmtMoney(isExcess ? Math.abs(t.customerRemaining) : Math.max(t.customerRemaining,0)) : (t.allPartsReturned?'مرتجعة':'لم يُسعّر بعد');
    remainEl.classList.remove('text-green','text-amber');
    remainEl.classList.toggle('text-green', t.hasSell && t.customerRemaining<=0.01 && !isExcess);
    remainEl.classList.toggle('text-amber', t.hasSell && (t.customerRemaining>0.01 || isExcess));
  }
  const paidEl = document.getElementById('total-paid-display');
  if(paidEl) paidEl.textContent = fmtMoney(t.customerPaidAmount);
  const refundStatusWrap = document.getElementById('customer-refund-status-wrap');
  if(refundStatusWrap) refundStatusWrap.innerHTML = orderCustomerRefundStatusHtml(draft);
}

/* حالة إرجاع مبلغ الزبون لهذه الطلبية — قطعة رجعت وكان مدفوع ثمنها: "يجب إرجاع X للزبون"
   لحد ما يُأكَّد الإرجاع فعليًا من شاشة العملاء (عندها تتحول لـ"تم الإرجاع") */
function orderCustomerRefundStatusHtml(order){
  let pendingTotal = 0, confirmedTotal = 0;
  (order.parts||[]).forEach(p=>{
    if(!p.returned) return;
    const adj = (order.customerPayments||[]).find(pay=>pay.returnAdjustment && pay.linkedPartId===p.id);
    if(!adj) return;
    if(p.customerRefundConfirmed) confirmedTotal += Number(adj.amount)||0;
    else pendingTotal += Number(adj.amount)||0;
  });
  pendingTotal = round2(pendingTotal); confirmedTotal = round2(confirmedTotal);
  if(pendingTotal<=0 && confirmedTotal<=0) return '';
  return (pendingTotal>0 ? '<div class="customer-refund-status customer-refund-status-pending">يجب إرجاع '+fmtMoney(pendingTotal)+' للزبون</div>' : '') +
    (confirmedTotal>0 ? '<div class="customer-refund-status customer-refund-status-done">✅ تم إرجاع '+fmtMoney(confirmedTotal)+' للزبون</div>' : '');
}

async function onSaveOrder(){
  if(!draft.orderNumber || !draft.orderNumber.trim()){
    showToast('لازم تكتب رقم الطلب', 'error'); return false;
  }
  const dup = appData.orders.find(o=>o.orderNumber.trim()===draft.orderNumber.trim() && o.id!==draft.id);
  if(dup){ showToast('رقم الطلب مستخدم من قبل، غيّره', 'error'); return false; }

  const cleanedParts = draft.parts
    .filter(p=>p.description && p.description.trim())
    .map(p=>({
      id:p.id,
      description:p.description.trim(),
      qty: (p.qty===''||p.qty==null||Number(p.qty)<=0) ? 1 : Number(p.qty),
      costPrice: p.costPrice===''? 0 : Number(p.costPrice)||0,
      sellPrice: (p.sellPrice===''||p.sellPrice===null||p.sellPrice===undefined)? null : Number(p.sellPrice),
      used: !!p.used,
      included: p.included!==false,
      supplierId: p.supplierId || null,
      returned: !!p.returned,
      returnHasReceivable: !!p.returnHasReceivable,
      returnCollected: !!p.returnCollected,
      customerRefundConfirmed: !!p.customerRefundConfirmed
    }));
  if(cleanedParts.length===0){ showToast('لازم تضيف وصف لقطعة وحدة على الأقل', 'error'); return false; }

  const paymentsMissingMethod = (draft.customerPayments||[]).some(p=>
    !p.returnAdjustment && p.amount!=='' && p.amount!=null && Number(p.amount)>0 && !p.method
  );
  if(paymentsMissingMethod){
    showToast('لازم تحدد طريقة الدفع (كاش/شبكة) لكل دفعة قبل الحفظ', 'error');
    return false;
  }

  const cleanedPayments = (draft.customerPayments||[])
    .filter(p=>p.amount!=='' && p.amount!=null && Number(p.amount)>0)
    .map(p=>({
      id:p.id,
      amount: Number(p.amount)||0,
      method: p.method||'',
      date: (p.date||'').trim(),
      returnAdjustment: !!p.returnAdjustment,
      linkedPartId: p.linkedPartId || null
    }));

  // أي زيادة بمجموع الدفعات عن المستحق مقبولة الآن (تظهر "زيادة" بملخص الطلبية) — بدون حظر الحفظ
  draft.parts = cleanedParts;
  draft.customerPayments = cleanedPayments;
  draft.orderNumber = draft.orderNumber.trim();
  draft.orderLabel = (draft.orderLabel||'').trim();
  draft.updatedAt = new Date().toISOString();
  delete draft.isNew;

  const idx = appData.orders.findIndex(o=>o.id===draft.id);
  if(idx>=0) appData.orders[idx]=draft; else appData.orders.push(draft);

  await persistOrder(draft);

  // حفظ الطلبية ما يطلعك منها — يبقى المودال مفتوح، بس يحدّث حالته (زي تحول "جديدة" لموجودة، إلخ)
  editingPayments = {};
  const root = document.getElementById('modal-root');
  root.innerHTML = modalHtml(draft);
  attachModalHandlers();
  updateModalTotals();

  renderKPIs();
  renderTable();
  updateCustomersBadge();
  updateSuppliersBadge();
  showToast('تم حفظ الطلبية', 'ok');
  return true;
}

/* ---------- unified confirmation dialog — used everywhere a destructive/consequential action needs a yes/no ----------
   uses its own #confirm-root (separate from #modal-root) so it can appear on top of an already-open modal
   (e.g. confirming a part/payment deletion or a paid-status toggle while the order-edit modal is open) without
   destroying that modal's DOM/state. */
function confirmAction(opts){
  opts = opts || {};
  const root = document.getElementById('confirm-root');
  root.innerHTML =
    '<div class="modal-backdrop" data-close-confirm>' +
      '<div class="modal-card modal-card-sm" role="alertdialog" aria-modal="true">' +
        '<div class="modal-title">'+escapeHtml(opts.title||'')+'</div>' +
        (opts.message ? '<p class="modal-sub">'+escapeHtml(opts.message)+'</p>' : '') +
        '<div class="modal-footer-actions" style="margin-top:16px;justify-content:flex-end;">' +
          '<button type="button" class="btn btn-ghost" id="confirm-action-cancel-btn">'+escapeHtml(opts.cancelLabel||'إلغاء')+'</button>' +
          '<button type="button" class="btn '+(opts.dangerous?'btn-danger':'btn-primary')+'" id="confirm-action-ok-btn">'+escapeHtml(opts.confirmLabel||'تأكيد')+'</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  root.classList.add('modal-open');
  const close = ()=>{ root.innerHTML=''; root.classList.remove('modal-open'); };
  root.querySelector('[data-close-confirm]').addEventListener('click', e=>{
    if(e.target.hasAttribute('data-close-confirm')){ close(); if(opts.onCancel) opts.onCancel(); }
  });
  root.querySelector('#confirm-action-cancel-btn').addEventListener('click', ()=>{ close(); if(opts.onCancel) opts.onCancel(); });
  root.querySelector('#confirm-action-ok-btn').addEventListener('click', ()=>{ close(); if(opts.onConfirm) opts.onConfirm(); });
}

/* ---------- confirm / unconfirm order (two-step) ---------- */
function confirmToggleConfirmation(orderId){
  const order = appData.orders.find(o=>o.id===orderId);
  if(!order) return;
  const willConfirm = !order.confirmed;
  const willResetSupply = !willConfirm && order.supplied;
  confirmAction({
    title: willConfirm ? 'تأكيد الطلبية '+order.orderNumber+'؟' : 'إلغاء تأكيد الطلبية '+order.orderNumber+'؟',
    message: willConfirm
      ? 'بعد التأكيد، أرقام هذه الطلبية بتدخل ضمن مجموع الطلبيات المؤكدة بمؤشرات الأعلى.'
      : 'بعد الإلغاء، أرقام هذه الطلبية بتُستثنى من مجموع الطلبيات المؤكدة بمؤشرات الأعلى.'
        + (willResetSupply ? ' وبيتلغى معها تحديد "تم التوريد"، فبتختفي من شاشة السداد.' : ''),
    cancelLabel: 'تراجع',
    confirmLabel: willConfirm ? 'تأكيد الطلبية' : 'إلغاء التأكيد',
    onConfirm: async ()=>{
      order.confirmed = willConfirm;
      if(willResetSupply){
        order.supplied = false;
        order.suppliedAt = null;
      }
      order.updatedAt = new Date().toISOString();
      await persistOrder(order);
      renderKPIs();
      renderTable();
      showToast(willConfirm ? 'تم تأكيد الطلبية' : 'تم إلغاء تأكيد الطلبية', 'ok');
    }
  });
}

/* ---------- invoice / quote documents ---------- */
function todayNumeric(){
  const d = new Date();
  const day = String(d.getDate()).padStart(2,'0');
  const month = String(d.getMonth()+1).padStart(2,'0');
  return day+'/'+month+'/'+d.getFullYear();
}

function fmtNum(n){
  const v = Number(n)||0;
  return v.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
}
function round2(n){
  return Math.round((Number(n)||0)*100)/100;
}

function nextDocNumber(prefix, field){
  let max = 0;
  appData.orders.forEach(o=>{
    const doc = o[field];
    if(doc && doc.number){
      const m = new RegExp('^'+prefix+'-(\\d+)$').exec(doc.number);
      if(m){ const n=parseInt(m[1],10); if(n>max) max=n; }
    }
  });
  return prefix + '-' + String(max+1).padStart(4,'0');
}

function openDocumentView(orderId, type){
  const order = appData.orders.find(o=>o.id===orderId);
  if(!order) return;
  const t = orderTotals(order);
  if(order.parts.length===0 || !t.fullyPriced){
    showToast('لازم تسعّر كل القطع قبل إصدار '+(type==='invoice'?'الفاتورة':'عرض السعر'), 'error');
    return;
  }
  const field = type==='invoice' ? 'invoiceDoc' : 'quoteDoc';
  const existing = order[field];
  const data = Object.assign(
    { number: nextDocNumber(type==='invoice'?'WI':'WQ', field), date: todayNumeric(), customerName:'', carModel:'', vin:'', customerCR:'', footerNote: defaultFooterNoteFor(type), showVat: false },
    existing || {}
  );
  docState = { orderId, type, data };
  const root = document.getElementById('doc-root');
  root.innerHTML = docSheetHtml(order, type, data);
  root.classList.add('doc-open');
  bindDocHandlers();
  document.addEventListener('keydown', docEscListener);
}

function refreshDocSheet(){
  if(!docState) return;
  const order = appData.orders.find(o=>o.id===docState.orderId);
  if(!order) return;
  const root = document.getElementById('doc-root');
  root.innerHTML = docSheetHtml(order, docState.type, docState.data);
  bindDocHandlers();
}

function closeDocView(){
  const root = document.getElementById('doc-root');
  root.innerHTML='';
  root.classList.remove('doc-open');
  docState=null;
  document.removeEventListener('keydown', docEscListener);
}
function closeDocViewAndReturn(){
  const orderId = docState ? docState.orderId : null;
  closeDocView();
  if(orderId) openModal('edit', orderId);
}
function docEscListener(e){ if(e.key==='Escape') closeDocViewAndReturn(); }

function markEmptyDocFields(){
  const root = document.getElementById('doc-root');
  if(!root) return;
  ['field-car','field-vin','field-cr'].forEach(cls=>{
    const el = root.querySelector('.'+cls);
    if(!el) return;
    const input = el.querySelector('input');
    const isEmpty = !input || !input.value.trim();
    el.classList.toggle('field-empty', isEmpty);
  });
}

function bindDocHandlers(){
  const root = document.getElementById('doc-root');
  root.querySelector('#doc-close-btn').addEventListener('click', async ()=>{ await persistDocMeta(false); closeDocViewAndReturn(); });
  root.querySelector('#doc-save-btn').addEventListener('click', ()=>{ persistDocMeta(true); });
  root.querySelector('#doc-print-btn').addEventListener('click', async ()=>{ await persistDocMeta(false); markEmptyDocFields(); window.print(); });
  root.querySelector('#doc-copy-btn').addEventListener('click', copyDocToClipboard);
  root.querySelector('#doc-share-btn').addEventListener('click', shareDoc);
  root.querySelector('#doc-pdf-btn').addEventListener('click', downloadDocPdf);

  const customerInput = root.querySelector('#doc-customer-input');
  customerInput.addEventListener('input', e=>{ docState.data.customerName = e.target.innerText; });
  customerInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); e.target.blur(); } });
  root.querySelector('#doc-date-input').addEventListener('input', e=>{ docState.data.date = e.target.value; });
  root.querySelector('#doc-car-input').addEventListener('input', e=>{ docState.data.carModel = e.target.value; });
  root.querySelector('#doc-vin-input').addEventListener('input', e=>{ docState.data.vin = e.target.value; });
  root.querySelector('#doc-cr-input').addEventListener('input', e=>{ docState.data.customerCR = e.target.value; });
  const vatToggleInput = root.querySelector('#doc-vat-toggle-input');
  if(vatToggleInput){
    vatToggleInput.addEventListener('change', e=>{
      docState.data.showVat = e.target.checked;
      refreshDocSheet();
    });
  }

  const footerInput = root.querySelector('#doc-footer-input');
  if(footerInput){
    footerInput.addEventListener('input', e=>{ docState.data.footerNote = e.target.innerText; });
  }
}

async function persistDocMeta(showToastMsg){
  if(!docState) return;
  const order = appData.orders.find(o=>o.id===docState.orderId);
  if(!order) return;
  const field = docState.type==='invoice' ? 'invoiceDoc' : 'quoteDoc';
  order[field] = Object.assign({}, docState.data);
  await persistOrder(order);
  renderTable();
  if(showToastMsg) showToast('تم حفظ بيانات '+(docState.type==='invoice'?'الفاتورة':'عرض السعر'), 'ok');
}

  lines.push('التاريخ: '+data.date);
  if(data.customerName) lines.push('العميل: '+data.customerName);
  if(data.customerCR) lines.push('ر.ض: '+data.customerCR);
  if(data.carModel) lines.push('السيارة: '+data.carModel);
  if(data.vin) lines.push('VIN: '+data.vin);
  lines.push('');
  lines.push('القطع:');
  orderActiveParts(order).filter(p=>!p.returned).forEach((p,i)=>{
    const qty = Number(p.qty)||1;
    const unit = Number(p.sellPrice)||0;
    lines.push((i+1)+'. '+partDisplayName(p)+' × '+qty+' — '+fmtNum(qty*unit)+' ريال');
  });
  lines.push('');
  if(data.showVat !== false){
    const vatAmt = round2(t.partsSellTotal - (t.partsSellTotal/1.15));
    lines.push('قيمة الضريبة المضافة (15%): '+fmtNum(vatAmt)+' ريال');
    lines.push('مجموع سعر القطع شامل الضريبة: '+fmtNum(t.partsSellTotal)+' ريال');
  } else {
    lines.push('مجموع القطع: '+fmtNum(t.partsSellTotal)+' ريال');
  }
  if(feeEnabled){
    lines.push((isInvoice?'رسوم خدمات وتوصيل':'رسوم خدمات شامل التوصيل')+' ('+feePercent+'%): '+fmtNum(fee)+' ريال');
  }
  if(t.serviceFeeEnabled && t.serviceFeeAmount>0){
    lines.push('رسوم خدمات ('+t.serviceFeePercent+'%): '+fmtNum(t.serviceFeeAmount)+' ريال');
  }
  if(t.deliveryFeeEnabled && t.deliveryFeeAmount>0){
    lines.push('أجور التوصيل: '+fmtNum(t.deliveryFeeAmount)+' ريال');
  }
  lines.push('الإجمالي: '+fmtNum(grand)+' ريال');
  lines.push('');
  lines.push(data.footerNote || defaultFooterNoteFor(type));
  return lines.join('\n');
}

async function writeTextToClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;
    }catch(e2){
      return false;
    }
  }
}

/* ---------- PDF export + native share ---------- */
function docPdfFilename(){
  const num = (docState && docState.data && docState.data.number) ? docState.data.number : 'PARTECH';
  return 'PARTECH-' + num + '.pdf';
}

// renders #doc-sheet (as currently on screen, with live input values) into a PDF Blob.
// forces a desktop-width layout during capture so the PDF looks the same whether generated from a phone or a computer.
async function buildDocPdfBlob(){
  if(typeof html2pdf === 'undefined'){
    throw new Error('LIB_MISSING');
  }
  const sheet = document.getElementById('doc-sheet');
  if(!sheet) throw new Error('NO_SHEET');
  sheet.classList.add('pdf-export-mode');
  // html2canvas clones the DOM before rendering and only sees the "value" attribute, not
  // the live "value" property — sync every input's current value into its attribute so
  // typed changes actually show up in the exported PDF.
  sheet.querySelectorAll('input').forEach(inp=>{ inp.setAttribute('value', inp.value); });
  try{
    if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
    const opt = {
      margin: 8,
      filename: docPdfFilename(),
      image: { type:'jpeg', quality:0.98 },
      html2canvas: { scale:2, useCORS:true, backgroundColor:'#ffffff', windowWidth:900 },
      jsPDF: { unit:'mm', format:'a4', orientation:'portrait' }
    };
    return await html2pdf().set(opt).from(sheet).outputPdf('blob');
  }finally{
    sheet.classList.remove('pdf-export-mode');
  }
}

async function downloadDocPdf(){
  if(!docState) return;
  const btn = document.getElementById('doc-pdf-btn');
  const setBusy = (b)=>{ if(btn){ btn.disabled=b; btn.textContent = b ? 'جاري التجهيز…' : '📄 تحميل PDF'; } };
  setBusy(true);
  try{
    await persistDocMeta(false);
    markEmptyDocFields();
    const blob = await buildDocPdfBlob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = docPdfFilename();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    showToast('تم تحميل ملف PDF', 'ok');
  }catch(e){
    showToast(e && e.message==='LIB_MISSING' ? 'تعذر تحميل مكتبة PDF — تأكد من الاتصال بالإنترنت' : 'تعذر إنشاء ملف PDF', 'error');
  }finally{
    setBusy(false);
  }
}

// tries to share the actual PDF via the device's native share sheet (WhatsApp, Mail, etc.);
// falls back to sharing formatted text, then to a plain clipboard copy, depending on what the browser supports.
async function shareDoc(){
  if(!docState) return;
  const order = appData.orders.find(o=>o.id===docState.orderId);
  if(!order) return;
  const btn = document.getElementById('doc-share-btn');
  const setBusy = (b)=>{ if(btn){ btn.disabled=b; btn.textContent = b ? 'جاري التجهيز…' : '📤 مشاركة'; } };
  setBusy(true);
  try{
    await persistDocMeta(false);
    markEmptyDocFields();
    const isInvoice = docState.type==='invoice';
    const shareTitle = 'PARTECH — ' + (isInvoice?'فاتورة نقدية':'عرض أسعار') + ' ' + docState.data.number;
    const fullText = buildDocWhatsAppText(order, docState.type, docState.data);

    let fileShareSupported = false;
    if(navigator.share && navigator.canShare){
      try{
        const dummy = new File(['%PDF'], 'test.pdf', {type:'application/pdf'});
        fileShareSupported = navigator.canShare({files:[dummy]});
      }catch(e){ fileShareSupported = false; }
    }

    if(fileShareSupported){
      try{
        const blob = await buildDocPdfBlob();
        const file = new File([blob], docPdfFilename(), {type:'application/pdf'});
        await navigator.share({files:[file], title:shareTitle, text:shareTitle});
        return;
      }catch(errFile){
        if(errFile && errFile.name==='AbortError') return; // user cancelled the share sheet
        // otherwise fall through to the text-share fallback below
      }
    }

    if(navigator.share){
      try{
        await navigator.share({title:shareTitle, text:fullText});
        return;
      }catch(errText){
        if(errText && errText.name==='AbortError') return;
      }
    }

    const ok = await writeTextToClipboard(fullText);
    showToast(ok ? 'المشاركة غير مدعومة بهذا المتصفح، تم نسخ النص — الصقه في واتساب' : 'تعذرت المشاركة، جرّب متصفح Chrome', ok ? 'ok' : 'error');
  }catch(e){
    showToast('حدث خطأ أثناء محاولة المشاركة', 'error');
  }finally{
    setBusy(false);
  }
}

function applyScrapyardProposal(pr){
  const order = appData.orders.find(o=>o.id===pr.order_id);
  if(!order) return false;
  if(pr.action === 'edit'){
    const part = (order.parts||[]).find(p=>p.id===pr.part_id);
    if(!part) return false;
    part.costPrice = Number(pr.cost_price)||0;
  } else if(pr.action === 'delete'){
    order.parts = (order.parts||[]).filter(p=>p.id!==pr.part_id);
  } else if(pr.action === 'add'){
    order.parts = order.parts || [];
    order.parts.push({ id: uid('p'), description: pr.description||'', qty: Number(pr.qty)||1, costPrice: Number(pr.cost_price)||0, sellPrice: null, used: pr.kind === 'used', supplierId: null });
  } else {
    return false;
  }
  order.updatedAt = new Date().toISOString();
  return true;
}

function dmyToIso(str){
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(str||'').trim());
  if(!m) return '';
  return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
}

function isoToDmy(str){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(str||'').trim());
  if(!m) return '';
  return m[3]+'/'+m[2]+'/'+m[1];
}

function parseDMY(str){
  if(!str) return null;
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(str).trim());
  if(!m) return null;
  const d = new Date(parseInt(m[3],10), parseInt(m[2],10)-1, parseInt(m[1],10));
  return isNaN(d.getTime()) ? null : d;
}

function dateMatchesPeriod(d, periodKey, customMonth, rangeFrom, rangeTo){
  periodKey = periodKey || treasuryPeriodFilter;
  if(periodKey === 'all') return true;
  if(!d) return false;
  if(periodKey === 'customMonth'){
    const m = /^(\d{4})-(\d{2})$/.exec(customMonth||'');
    if(!m) return true;
    return d.getFullYear()===parseInt(m[1],10) && d.getMonth()===(parseInt(m[2],10)-1);
  }
  if(periodKey === 'customRange'){
    const from = /^\d{4}-\d{2}-\d{2}$/.test(rangeFrom||'') ? new Date(rangeFrom+'T00:00:00') : null;
    const to = /^\d{4}-\d{2}-\d{2}$/.test(rangeTo||'') ? new Date(rangeTo+'T00:00:00') : null;
    if(from && d.getTime() < from.getTime()) return false;
    if(to && d.getTime() > to.getTime()) return false;
    return true;
  }
  const now = new Date();
  const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if(periodKey === 'today'){
    return d.getTime() === today0.getTime();
  }
  if(periodKey === 'week'){
    const weekStart = new Date(today0); weekStart.setDate(weekStart.getDate() - now.getDay());
    return d.getTime() >= weekStart.getTime() && d.getTime() <= today0.getTime();
  }
  if(periodKey === 'month'){
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  }
  if(periodKey === 'lastMonth'){
    const lm = new Date(now.getFullYear(), now.getMonth()-1, 1);
    return d.getFullYear()===lm.getFullYear() && d.getMonth()===lm.getMonth();
  }
  return true;
}

function entryMatchesPeriod(entry){
  if(treasuryPeriodFilter === 'all') return true;
  return dateMatchesPeriod(parseDMY(entry.date), treasuryPeriodFilter);
}

function orderDateMatchesPeriod(order){
  if(treasuryPeriodFilter === 'all') return true;
  if(!order.updatedAt) return false;
  const dt = new Date(order.updatedAt);
  if(isNaN(dt.getTime())) return false;
  return dateMatchesPeriod(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()), treasuryPeriodFilter);
}

function orderMatchesExtraIndicatorsPeriod(order){
  if(extraIndicatorsPeriod === 'all') return true;
  if(!order.updatedAt) return false;
  const dt = new Date(order.updatedAt);
  if(isNaN(dt.getTime())) return false;
  return dateMatchesPeriod(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()), extraIndicatorsPeriod, extraIndicatorsCustomMonth, extraIndicatorsRangeFrom, extraIndicatorsRangeTo);
}

function entryMatchesExtraIndicatorsPeriod(entry){
  if(extraIndicatorsPeriod === 'all') return true;
  return dateMatchesPeriod(parseDMY(entry.date), extraIndicatorsPeriod, extraIndicatorsCustomMonth, extraIndicatorsRangeFrom, extraIndicatorsRangeTo);
}

function computeTreasuryVolumes(){
  const orders = appData.orders.filter(o=>o.confirmed).filter(orderMatchesExtraIndicatorsPeriod);
  let paidToSuppliersTotal = 0, paidToScrapyardTotal = 0, customerReceiptsTotal = 0, collectedProfit = 0;
  orders.forEach(o=>{
    const t = orderTotals(o);
    if(o.paidToSupplier) paidToSuppliersTotal += t.costToSupplier;
    if(o.paidToAmer) paidToScrapyardTotal += t.costToScrapyard;
    customerReceiptsTotal += t.customerPaidAmount;
    if(t.hasSell) collectedProfit += t.collectedProfit;
  });
  return {
    purchaseVolume: round2(paidToSuppliersTotal + paidToScrapyardTotal),
    salesVolume: round2(customerReceiptsTotal),
    profitVolume: round2(collectedProfit)
  };
}

function treasurySupportTotal(matchFn){
  const filterFn = matchFn || entryMatchesPeriod;
  return round2((appData.treasury.support||[]).filter(filterFn).reduce((sum,entry)=> sum + (Number(entry.amount)||0), 0));
}

function treasuryTotals(){
  // إجمالي المصاريف/الدعم المعروضة داخل قسم "المصاريف" نفسه — تتبع فلتر ذاك القسم (treasuryPeriodFilter)
  let totalExpenses = 0;
  EXPENSE_CATEGORIES.forEach(c=>{
    (appData.treasury[c.key]||[]).filter(entryMatchesPeriod).forEach(entry=>{ totalExpenses += Number(entry.amount)||0; });
  });
  totalExpenses = round2(totalExpenses);
  const totalSupport = treasurySupportTotal();

  // المؤشرات بالأعلى + مؤشرات إضافية كلها تتبع نفس فلتر "مؤشرات إضافية" (extraIndicatorsPeriod)
  const f = computeAggregateFinancials(orderMatchesExtraIndicatorsPeriod);
  let extraIndicatorsExpenses = 0;
  EXPENSE_CATEGORIES.forEach(c=>{
    (appData.treasury[c.key]||[]).filter(entryMatchesExtraIndicatorsPeriod).forEach(entry=>{ extraIndicatorsExpenses += Number(entry.amount)||0; });
  });
  const extraIndicatorsSupport = treasurySupportTotal(entryMatchesExtraIndicatorsPeriod);
  const extraIndicatorsAmerCustody = amerCustodyTopupsTotal(entryMatchesExtraIndicatorsPeriod);
  const custodyDeficit = amerCustodyDeficit();
  // صافي الصندوق = نقدي حقيقي: كل ما دفعه الزبائن + دعم خارجي، ناقص كل ما دُفع فعليًا للموردين + كل ما سُدد لعهدة عامر، ناقص مصاريف الصندوق
  // (سداد طلبية "تم سداد التشليح" ما يأثر على الصندوق مباشرة — يُخصم من عهدة عامر بس، لحد ما تسدد لعهدة عامر فعليًا)
  const net = round2(f.customerReceiptsTotal + extraIndicatorsSupport - f.paidToSuppliersTotal - extraIndicatorsAmerCustody - extraIndicatorsExpenses);
  // الصندوق بافتراض انتهاء التحصيل والسداد = لو تحصّلت كل ديون الزبائن، ودُفعت كل مستحقات الموردين،
  // وسدّدت عجز عهدة عامر (اللي دفعه فعليًا للتشاليح ولسه ما رجّعتله) + كل الطلبيات يلي لسه ما تسدد للتشليح،
  // وكمان لو تحصّلت كل مرتجعات الموردين المعلّقة ورجعت كل مبالغ العملاء المعلّقة
  const netAfterSettlement = round2(net + f.dueFromCustomers - custodyDeficit - f.dueToScrapyard - f.dueToSuppliers + totalSupplierReturnReceivables() - totalCustomerRefundsPending());
  // الديون للموردين = عجز عهدة عامر (تشاليح مدفوعة فعليًا ولسه ما رجّعتلها) + الطلبيات يلي لسه ما تسدد للتشليح + المستحق للموردين
  const debtsToSuppliers = round2(custodyDeficit + f.dueToScrapyard + f.dueToSuppliers);
  const volumes = computeTreasuryVolumes();
  // صافي الأرباح الشهرية = أرباح الطلبيات المحصّلة بالشهر المحدد ناقص مصاريف نفس الشهر (بنفس فلتر مؤشرات إضافية)
  const netProfitVolume = round2(volumes.profitVolume - extraIndicatorsExpenses);
  return {
    totalExpenses, totalSupport, net, netAfterSettlement, debtsToSuppliers, dueFromCustomers: f.dueFromCustomers, uncollectedProfit: f.uncollectedProfit,
    purchaseVolume: volumes.purchaseVolume, salesVolume: volumes.salesVolume, profitVolume: volumes.profitVolume, netProfitVolume: netProfitVolume,
    amerCustodyBalance: amerCustodyBalance(), amerCustodyDeficit: custodyDeficit
  };
}

function computeAllTimeTreasurySummary(){

function bindTreasuryPeriodFilter(){
  const toggleBtn = document.getElementById('btn-toggle-treasury-filter');
  if(toggleBtn){
    toggleBtn.addEventListener('click', ()=>{
      treasuryFilterOpen = !treasuryFilterOpen;
      const el = document.getElementById('treasury-period-filter');
      if(el) el.style.display = treasuryFilterOpen ? 'flex' : 'none';
    });
  }
  const el = document.getElementById('treasury-period-filter');
  if(!el) return;
  el.querySelectorAll('[data-period]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      treasuryPeriodFilter = btn.getAttribute('data-period');
      treasuryFilterOpen = true;
      renderTreasuryView();
    });
  });
}

function bindExtraIndicatorsFilter(){
  const toggleBtn = document.getElementById('btn-toggle-extra-filter');
  if(toggleBtn){
    toggleBtn.addEventListener('click', ()=>{
      extraIndicatorsFilterOpen = !extraIndicatorsFilterOpen;
      const el = document.getElementById('extra-indicators-period-filter');
      if(el) el.style.display = extraIndicatorsFilterOpen ? 'flex' : 'none';
    });
  }
  const el = document.getElementById('extra-indicators-period-filter');
  if(!el) return;
  el.querySelectorAll('[data-extra-period]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      extraIndicatorsPeriod = btn.getAttribute('data-extra-period');
      extraIndicatorsCustomMonth = '';
      extraIndicatorsRangeFrom = '';
      extraIndicatorsRangeTo = '';
      extraIndicatorsFilterOpen = true;
      renderTreasuryView();
    });
  });
  const monthInput = document.getElementById('extra-indicators-month-input');
  if(monthInput){
    monthInput.addEventListener('change', e=>{
      if(!e.target.value) return;
      extraIndicatorsPeriod = 'customMonth';
      extraIndicatorsCustomMonth = e.target.value;
      extraIndicatorsRangeFrom = '';
      extraIndicatorsRangeTo = '';
      extraIndicatorsFilterOpen = true;
      renderTreasuryView();
    });
  }
  const rangeFromInput = document.getElementById('extra-indicators-range-from');
  const rangeToInput = document.getElementById('extra-indicators-range-to');
  const applyRangeFilter = ()=>{
    const from = rangeFromInput ? rangeFromInput.value : '';
    const to = rangeToInput ? rangeToInput.value : '';
    if(!from && !to) return;
    extraIndicatorsPeriod = 'customRange';
    extraIndicatorsCustomMonth = '';
    extraIndicatorsRangeFrom = from;
    extraIndicatorsRangeTo = to;
    extraIndicatorsFilterOpen = true;
    renderTreasuryView();
  };
  if(rangeFromInput) rangeFromInput.addEventListener('change', applyRangeFilter);
  if(rangeToInput) rangeToInput.addEventListener('change', applyRangeFilter);
}

function bindTreasuryAddButtons(){
  const el = document.getElementById('treasury-view');
  el.querySelectorAll('[data-add-entry-key]').forEach(btn=>{
    const key = btn.getAttribute('data-add-entry-key');
    const label = btn.getAttribute('data-add-entry-label') || 'دعم الصندوق من الخارج';

      if(!Array.isArray(appData.treasury[key])) appData.treasury[key] = [];
      const newEntry = {id: uid('exp'), amount:'', date: todayNumeric(), note:''};

function bindExpenseEntryEvents(key){
  const list = document.querySelector('[data-entries-key="'+key+'"]');
  if(!list) return;
  list.querySelectorAll('.expense-entry-row').forEach(row=>{
    const entryId = row.getAttribute('data-entry-id');
    const entry = (appData.treasury[key]||[]).find(e=>e.id===entryId);
    if(!entry) return;
    const editBtn = row.querySelector('.expense-entry-edit-btn');
    if(editBtn){
      editBtn.addEventListener('click', ()=>{
        editingExpenseEntries[entryId] = true;
        refreshExpenseEntries(key);
      });
    }
    const saveBtn = row.querySelector('.expense-entry-save-btn');
    if(saveBtn){
      saveBtn.addEventListener('click', async ()=>{
        const amt = Number(entry.amount);
        if(entry.amount==='' || isNaN(amt) || amt<=0){ showToast('أدخل مبلغًا صحيحًا', 'error'); return; }
        // نعيد جلب العنصر الحي من appData الحالي وقت الحفظ (لا نعتمد على المرجع القديم)
        // لأن appData ممكن يكون انستبدل بالكامل بتحديث لحظي من مستخدم ثاني أثناء ما كنا نعدّل.
        const liveEntry = (appData.treasury[key]||[]).find(e=>e.id===entryId);
        if(!liveEntry){
          showToast('تعذر الحفظ — يبدو إن هذا العنصر تغيّر أو انحذف من مكان آخر', 'error');
          delete editingExpenseEntries[entryId];
          refreshExpenseEntries(key);
          return;
        }
        liveEntry.amount = amt;
        liveEntry.date = entry.date;
        liveEntry.note = entry.note;
        delete editingExpenseEntries[entryId];
        refreshExpenseEntries(key);
        await persistTreasuryEntry(liveEntry, key);
        showToast('تم حفظ المبلغ', 'ok');
      });
    }
    const amountInput = row.querySelector('.expense-entry-amount-input');
    if(amountInput){
      amountInput.addEventListener('input', e=>{
        entry.amount = e.target.value===''? '' : Number(e.target.value);
        updateExpenseCategorySubtotal(key);
        updateTreasurySummary();
      });
    }
    const dateInput = row.querySelector('.expense-entry-date-input');
    if(dateInput){
      dateInput.addEventListener('input', e=>{ entry.date = isoToDmy(e.target.value); });
    }
    const noteInput = row.querySelector('.expense-entry-note-input');
    if(noteInput){
      noteInput.addEventListener('input', e=>{ entry.note = e.target.value; });
    }
    row.querySelector('.expense-entry-remove-btn').addEventListener('click', ()=>{
      confirmDeleteExpenseEntry(key, entryId);
    });
  });
}

function confirmDeleteExpenseEntry(key, entryId){
  confirmAction({

    message: 'هذا الإجراء نهائي ولا يمكن التراجع عنه.',

/* عميل "متأخر" = عنده طلبية مسلَّمة وباقي عليه مبلغ، ومرّ 30 يوم فأكثر من تاريخ التسليم
   (أو آخر تعديل للطلبيات القديمة يلي ما فيها تاريخ تسليم مسجّل) */
function overdueCustomersCount(){
  const THRESHOLD_MS = 30 * 24 * 60 * 60 * 1000;
  const now = Date.now();
  let count = 0;
  (appData.customers||[]).forEach(c=>{
    const isOverdue = (appData.orders||[]).some(o=>{
      if(o.customerId !== c.id) return false;
      if(!o.supplied) return false;
      const t = orderTotals(o);
      if(!t.hasSell || t.customerRemaining<=0) return false;
      const refDate = o.suppliedAt || o.updatedAt;
      if(!refDate) return false;
      const ref = new Date(refDate).getTime();
      if(isNaN(ref)) return false;
      return (now - ref) >= THRESHOLD_MS;
    });
    if(isOverdue) count++;
  });
  return count;
}

/* عدد العملاء اللي عندهم مبلغ لازم يرجعلهم (مرتجعات بانتظار التأكيد) — يُجمع مع المتأخرين
   بالسداد بنفس الشارة، لأن الاثنين "أشياء تحتاج انتباهك بخصوص العملاء" */
function customersWithPendingRefundsCount(){
  return (appData.customers||[]).filter(c=> customerRefundTotal(c.id) > 0).length;
}

function totalCustomerRefundsPending(){
  return round2((appData.customers||[]).reduce((sum,c)=> sum + customerRefundTotal(c.id), 0));
}

/* ---------- عهدة عامر (لسداد التشاليح) ----------
   بدل ما يُخصم من الصندوق كل ما تُعلَّم طلبية "تم سداد التشليح"، الطلبية تُخصم من عهدة عامر بس.
   الصندوق يتأثر فقط لحظة إضافة/سداد لعهدة عامر (من هون). عجز العهدة (لو صارت سالبة) = المبلغ
   اللي لازم تسدده لعامر عشان تغطي اللي دفعه فعليًا للتشاليح ولسه ما رجعتله إياه. */
function amerCustodyTopupsTotalAll(){
  return round2((appData.treasury.amerCustody||[]).reduce((sum,entry)=> sum + (Number(entry.amount)||0), 0));
}
function amerCustodyTopupsTotal(matchFn){
  const filterFn = matchFn || entryMatchesPeriod;
  return round2((appData.treasury.amerCustody||[]).filter(filterFn).reduce((sum,entry)=> sum + (Number(entry.amount)||0), 0));
}
/* إجمالي تكلفة التشليح "المسددة عبر عهدة عامر" فقط — يستبعد الطلبيات المعلَّمة custodyLegacy،
   وهي طلبيات قديمة اتّسدّدت مباشرة من الصندوق قبل ما تُستحدث العهدة أصلًا؛ لو دخلت بحساب العهدة
   بترجع تخلق عجز وهمي (دين على عامر ما إله علاقة بالعهدة الفعلية اللي انولّت له). */
function paidToScrapyardTotalForCustody(){
  let total = 0;
  (appData.orders||[]).forEach(o=>{
    if(!o.confirmed || !o.paidToAmer || o.custodyLegacy) return;
    total += orderTotals(o).costToScrapyard;
  });
  return round2(total);
}
function amerCustodyBalance(){
  return round2(amerCustodyTopupsTotalAll() - paidToScrapyardTotalForCustody());
}
function amerCustodyDeficit(){
  return round2(Math.max(0, -amerCustodyBalance()));
}

function bindTaskCategoryEvents(key){
  document.getElementById('btn-back-to-tasks-menu').addEventListener('click', ()=>{

  });

  const input = document.getElementById('new-task-input');
  const addTask = async ()=>{
    const text = input.value.trim();
    if(!text) return;
    if(!Array.isArray(appData.tasks[key])) appData.tasks[key] = [];
    const newItem = {id: uid('task'), text, done:false, createdAt: new Date().toISOString()};
    appData.tasks[key].push(newItem);
    input.value = '';
    updateTasksBadge();
    await persistTaskItem(newItem, key);
    refreshTaskItemsList(key);
  };
  addBtn.addEventListener('click', addTask);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addTask(); } });

function bindTaskItemEvents(key){
  const list = document.getElementById('task-items-list');
  if(!list) return;
  list.querySelectorAll('.task-item-row').forEach(row=>{
    const tid = row.getAttribute('data-task-id');
    const item = (appData.tasks[key]||[]).find(t=>t.id===tid);
    if(!item) return;
    row.querySelector('.task-item-check').addEventListener('change', async e=>{
      // نجلب العنصر الحي وقت الحفظ (مو نعتمد على المرجع القديم يلي التقطناه وقت الرسم)
      // لنفس سبب حماية تعديل المصاريف — appData.tasks ممكن يكون تحدّث لحظيًا من مستخدم ثاني.
      const liveItem = (appData.tasks[key]||[]).find(t=>t.id===tid);
      if(!liveItem) return;
      liveItem.done = e.target.checked;
      row.classList.toggle('task-item-done', liveItem.done);
      updateTasksBadge();
      await persistTaskItem(liveItem, key);
    });
    row.querySelector('.task-item-remove-btn').addEventListener('click', async ()=>{
      appData.tasks[key] = appData.tasks[key].filter(t=>t.id!==tid);
      updateTasksBadge();
      await deleteTaskItem(tid);
      refreshTaskItemsList(key);
    });
  });
}

function refreshTaskItemsList(key){
  const list = document.getElementById('task-items-list');
  if(!list) return;
  const items = appData.tasks[key] || [];
  list.innerHTML = items.length ? items.map(taskItemRowHtml).join('') : '<div class="expense-empty-hint">ما فيه مهام مضافة بعد</div>';
  bindTaskItemEvents(key);
}

      paymentsRows.push({
        'رقم الطلب': o.orderNumber,
        'المبلغ': p.amount,
        'الطريقة': p.method==='cash' ? 'كاش' : (p.method==='card' ? 'شبكة' : ''),
        'التاريخ': p.date || ''
      });
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(paymentsRows), 'دفعات الزبائن');

  const expenseRows = [];
  EXPENSE_CATEGORIES.forEach(c=>{
    (appData.treasury[c.key]||[]).forEach(entry=>{
      expenseRows.push({ 'الفئة': c.label, 'المبلغ': entry.amount, 'التاريخ': entry.date || '', 'تفاصيل': entry.note || '' });
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(expenseRows), 'مصاريف الصندوق');

  const supportRows = (appData.treasury.support||[]).map(entry=>(
    { 'المبلغ': entry.amount, 'التاريخ': entry.date || '', 'تفاصيل': entry.note || '' }
  ));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(supportRows), 'دعم الصندوق الخارجي');

  const summary = computeAllTimeTreasurySummary();
  const summaryRows = [
    { 'المؤشر': 'الصندوق حاليًا', 'القيمة': summary.net },
    { 'المؤشر': 'الصندوق بافتراض انتهاء التحصيل والسداد', 'القيمة': summary.netAfterSettlement },
    { 'المؤشر': 'الربح غير المحصّل', 'القيمة': summary.uncollectedProfit },
    { 'المؤشر': 'الديون للموردين', 'القيمة': summary.debtsToSuppliers },
    { 'المؤشر': 'مستحق من الزبائن', 'القيمة': summary.dueFromCustomers },
    { 'المؤشر': 'إجمالي المصاريف', 'القيمة': summary.totalExpenses },
    { 'المؤشر': 'إجمالي الدعم الخارجي', 'القيمة': summary.totalSupport },
    { 'المؤشر': 'حجم الشراء', 'القيمة': summary.purchaseVolume },
    { 'المؤشر': 'حجم عمليات البيع', 'القيمة': summary.salesVolume },
    { 'المؤشر': 'حجم الأرباح', 'القيمة': summary.profitVolume }
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryRows), 'ملخص الصندوق');

  const taskRows = [];
  TASK_CATEGORIES.forEach(c=>{
    (appData.tasks[c.key]||[]).forEach(item=>{
      taskRows.push({
        'القسم': c.label,
        'المهمة': item.text,
        'منجزة': item.done ? 'نعم' : 'لا',
        'تاريخ الإضافة': item.createdAt || ''
      });
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(taskRows), 'المهام');

  // نسخة احتياطية خام (JSON) لضمان استعادة دقيقة ١٠٠٪ عند الاستيراد لاحقًا — لا تُعدَّل يدويًا
  const rawJson = JSON.stringify({ schemaVersion: DATA_SCHEMA_VERSION, exportedAt: new Date().toISOString(), orders: appData.orders, treasury: appData.treasury, tasks: appData.tasks });
  const CHUNK = 30000; // أقل من الحد الأقصى لطول الخلية في إكسل (32767 حرف)
  const chunks = [];
  for(let i=0; i<rawJson.length; i+=CHUNK){ chunks.push([rawJson.slice(i, i+CHUNK)]); }
  if(chunks.length===0) chunks.push(['']);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(chunks), 'نسخة احتياطية');

  const stamp = todayNumeric().replace(/\//g,'-');
  XLSX.writeFile(wb, 'PARTECH-بيانات-كاملة-'+stamp+'.xlsx');
  showToast('تم تحميل ملف Excel بكل بيانات النظام', 'ok');
}

/* ---------- Excel import — restores appData from the "نسخة احتياطية" sheet written by the exporter above ---------- */
function importDataFromExcelFile(file){
  if(typeof XLSX === 'undefined'){
    showToast('تعذر تحميل مكتبة Excel — تأكد من الاتصال بالإنترنت وحاول مرة أخرى', 'error');
    return;
  }
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{
      const wb = XLSX.read(reader.result, {type:'array'});
      const sheetName = wb.SheetNames.find(n=> n.indexOf('نسخة احتياطية')===0);
      if(!sheetName) throw new Error('NO_BACKUP_SHEET');
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1});
      const rawJson = rows.map(r=> (r && r[0]!=null) ? String(r[0]) : '').join('');
      parsed = JSON.parse(rawJson);
      if(!parsed || !Array.isArray(parsed.orders)) throw new Error('BAD_SHAPE');
    }catch(err){
      showToast('هذا الملف لا يحتوي نسخة صالحة للاستيراد — لازم يكون نفس ملف "تصدير Excel" من هذا النظام', 'error');
      return;
    }
    confirmImportOverwrite(parsed);
  };
  reader.onerror = ()=> showToast('تعذر قراءة الملف', 'error');
  reader.readAsArrayBuffer(file);
}

function normalizeImportedOrder(o){

    paidToSupplier: false,

  };

function confirmImportOverwrite(parsedData){
  const orderCount = Array.isArray(parsedData.orders) ? parsedData.orders.length : 0;
  confirmAction({
    title: 'استيراد البيانات؟',
    message: 'الملف يحتوي '+orderCount+' طلبية. سيتم استبدال كل البيانات الحالية (الطلبيات، الصندوق، المهام) بمحتوى هذا الملف — إجراء نهائي ولا يمكن التراجع عنه.',
    confirmLabel: 'استبدال البيانات',
    dangerous: true,
    onConfirm: async ()=>{
      appData = {
        orders: (Array.isArray(parsedData.orders) ? parsedData.orders : []).map(normalizeImportedOrder),
        treasury: Object.assign(defaultTreasury(), parsedData.treasury || {}),
        tasks: Object.assign(defaultTasks(), parsedData.tasks || {})
      };
      migrateLegacyCustomerPayment();
      migrateLegacyOrderLabel();
      migrateLegacyTreasury();
      migrateLegacyTasks();
      try{
        await replaceAllOrders(appData.orders);
        await replaceAllTreasuryEntries(appData.treasury);
        await replaceAllTaskItems(appData.tasks);
      }catch(e){
        showToast('تعذر استبدال البيانات: ' + (e && e.message ? e.message : ''), 'error');
        return;
      }
      if(document.getElementById('treasury-view').style.display !== 'none'){ renderTreasuryView(); }
      renderKPIs();
      renderTable();
      updateTasksBadge();
      showToast('تم استيراد البيانات بنجاح', 'ok');

  });
}

function applyRemoteOrderChange(payload){
  if(!Array.isArray(appData.orders)) appData.orders = [];
  if(payload.eventType === 'DELETE'){
    const oldId = payload.old && payload.old.id;
    if(!oldId) return;
    appData.orders = appData.orders.filter(o=>o.id!==oldId);
  } else {
    const row = payload.new;
    if(!row || !row.id) return;
    const order = orderRowToObject(row);
    const idx = appData.orders.findIndex(o=>o.id===order.id);
    if(idx>=0) appData.orders[idx] = order; else appData.orders.push(order);
  }
  renderKPIs();
  renderTable();
  updateCustomersBadge();
  updateSuppliersBadge();
  if(document.getElementById('treasury-view').style.display !== 'none'){ renderTreasuryView(); }
  if(document.getElementById('suppliers-view').style.display !== 'none'){ refreshSuppliersList(); }
  if(document.getElementById('customers-view').style.display !== 'none'){ refreshCustomersList(); }
  // صاحب الحساب لو فاتح شاشة سداد التشاليح/الجديد وقت وصول تعديل من مكان تاني — نحدّثها كمان
  const scrapRoot = document.getElementById('scrapyard-root');
  if(scrapRoot && scrapRoot.style.display !== 'none' && scrapyardSharedState.canManage && scrapyardCurrentScreen === 'settlement'){
    loadScrapyardData(scrapyardSharedState.activeKind).then(renderScrapyardView);
  }
}

  document.getElementById('suppliers-view').style.display = 'block';
  renderSuppliersView();
}

function closeSuppliersView(){
  document.getElementById('suppliers-view').style.display = 'none';
  document.getElementById('orders-view').style.display = '';
}

function supplierOwedAmount(supplierId){
  let total = 0;
  (appData.orders||[]).forEach(o=>{
    if(!o.supplied) return; // قبل اتمام التوريد ما يُحسب على المورد شي — بس يترتبط بالطلبية لغرض التحليل لاحقًا
    (o.parts||[]).forEach(p=>{
      if(p.supplierId !== supplierId) return;
      if(p.returned) return; // القطعة المرتجعة لها حسابها المنفصل (مسترجع بانتظار التحصيل)، مو ضمن المستحق العادي
      if(!partIsIncludedInOrder(o,p)) return; // قطعة مستبعدة يدويًا من الطلبية — ما تُحسب
      const paid = p.used ? o.paidToAmer : o.paidToSupplier;
      if(paid) return;
      total += (Number(p.qty)||1) * (Number(p.costPrice)||0);
    });
  });
  return round2(total);
}

function isoToDisplayDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '—';
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}

/* سجل مشتريات المورد — مقسّم لجارية (غير مسددة) وسابقة (مسددة)، كل صف يفتح طلبيته */
/* مجمّعة بالطلبية — مو بكل قطعة لحالها؛ الضغط يفتح الطلبية ويفرّد القطع هناك */
function supplierPurchaseHistory(supplierId){
  const ongoingMap = {}, pastMap = {};
  const ongoing = [], past = [];
  (appData.orders||[]).forEach(o=>{
    if(!o.supplied) return; // قبل اتمام التوريد الطلبية ما تظهر بسجل المشتريات، بس الربط محفوظ
    (o.parts||[]).forEach(p=>{
      if(p.supplierId !== supplierId) return;
      if(p.returned) return; // القطعة المرتجعة لها حسابها المنفصل (مسترجع بانتظار التحصيل)، مو ضمن سجل المشتريات العادي
      if(!partIsIncludedInOrder(o,p)) return; // قطعة مستبعدة يدويًا من الطلبية — ما تُحسب
      const paid = p.used ? o.paidToAmer : o.paidToSupplier;
      const map = paid ? pastMap : ongoingMap;
      const list = paid ? past : ongoing;
      if(!map[o.id]){
        map[o.id] = {
          orderId: o.id, orderNumber: o.orderNumber, orderLabel: o.orderLabel,
          amount: 0, count: 0, date: o.suppliedAt || o.updatedAt || o.createdAt || ''
        };
        list.push(map[o.id]);
      }
      map[o.id].amount = round2(map[o.id].amount + (Number(p.qty)||1) * (Number(p.costPrice)||0));
      map[o.id].count++;
    });
  });
  const byDateDesc = (a,b)=> new Date(b.date||0) - new Date(a.date||0);
  ongoing.sort(byDateDesc); past.sort(byDateDesc);
  return { ongoing, past };
}

/* قطع رجعها الزبون بعد ما كانت مدفوعة للمورد مسبقًا — المورد صار يستحق ردّها لحد ما تُحصّل فعليًا */
function supplierReturnReceivables(supplierId){
  const rows = [];
  (appData.orders||[]).forEach(o=>{
    if(!o.confirmed) return; // الإرجاع بكل تفرعاته يخص الطلبيات المؤكدة فقط
    (o.parts||[]).forEach(p=>{
      if(p.supplierId !== supplierId) return;
      if(!p.returned || !p.returnHasReceivable || p.returnCollected) return;
      if(!partIsIncludedInOrder(o,p)) return; // قطعة مستبعدة يدويًا من الطلبية — ما تُحسب
      rows.push({
        orderId: o.id, orderNumber: o.orderNumber, orderLabel: o.orderLabel, partId: p.id,
        description: p.description||'', amount: round2((Number(p.qty)||1)*(Number(p.costPrice)||0)),
        used: !!p.used
      });
    });
  });
  return rows;
}

function supplierReturnReceivableTotal(supplierId){
  return round2(supplierReturnReceivables(supplierId).reduce((s,r)=>s+r.amount,0));
}

/* إجمالي المبالغ المستحقة لنا من كل الموردين والتشاليح مجتمعين (مرتجعات بانتظار التحصيل) — لمؤشر الصفحة الرئيسية */
function totalSupplierReturnReceivables(){
  return round2((appData.suppliers||[]).reduce((sum,s)=> sum + supplierReturnReceivableTotal(s.id), 0));
}

function openSupplierHistoryModal(supplierId){
  const supplier = (appData.suppliers||[]).find(s=>s.id===supplierId);
  const label = supplier ? (supplier.name||supplier.phone||'مورد') : 'مورد';
  const { ongoing, past } = supplierPurchaseHistory(supplierId);
  const ongoingTotal = round2(ongoing.reduce((s,r)=>s+r.amount,0));
  const pastTotal = round2(past.reduce((s,r)=>s+r.amount,0));
  const receivables = supplierReturnReceivables(supplierId);
  const receivablesTotal = round2(receivables.reduce((s,r)=>s+r.amount,0));
  const root = document.getElementById('modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" data-close-backdrop>' +
      '<div class="modal-card modal-card-sm" role="dialog" aria-modal="true">' +
        '<div class="modal-header"><div class="modal-title">سجل مشتريات — '+escapeHtml(label)+'</div>' +
          '<button type="button" class="icon-btn" id="supplier-history-close-btn" aria-label="إغلاق">✕</button></div>' +
        (receivables.length ? '<div class="purchase-history-section">' +
          '<div class="purchase-history-section-title"><span>مرتجعات بانتظار التحصيل</span><span class="num text-green">'+fmtMoney(receivablesTotal)+'</span></div>' +
          receivables.map(returnReceivableRowHtml).join('') +
        '</div>' : '') +
        '<div class="purchase-history-section">' +
          '<div class="purchase-history-section-title"><span>جارية (غير مسددة)</span><span class="num text-rust">'+fmtMoney(ongoingTotal)+'</span></div>' +
          (ongoing.length ? ongoing.map(purchaseHistoryRowHtml).join('') : '<div class="expense-empty-hint">ما فيه مشتريات جارية</div>') +
        '</div>' +
        '<div class="purchase-history-section">' +
          '<div class="purchase-history-section-title"><span>سابقة (مسددة)</span><span class="num text-green">'+fmtMoney(pastTotal)+'</span></div>' +
          (past.length ? past.map(purchaseHistoryRowHtml).join('') : '<div class="expense-empty-hint">ما فيه مشتريات سابقة</div>') +
        '</div>' +
      '</div>' +
    '</div>';
  root.classList.add('modal-open');
  const close = ()=>{ root.innerHTML=''; root.classList.remove('modal-open'); };
  root.querySelector('[data-close-backdrop]').addEventListener('click', e=>{
    if(e.target.hasAttribute('data-close-backdrop')) close();
  });
  root.querySelector('#supplier-history-close-btn').addEventListener('click', close);
  root.querySelectorAll('[data-open-order]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      close();
      openModal('edit', btn.getAttribute('data-open-order'));
    });
  });
  root.querySelectorAll('.return-collect-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const orderId = btn.getAttribute('data-order-id');
      const partId = btn.getAttribute('data-part-id');
      const isUsed = btn.getAttribute('data-used')==='1';
      if(isUsed){
        confirmCollectScrapyardReturn(orderId, partId, supplierId);
      } else {
        confirmAction({
          title: 'تأكيد تحصيل هذا المبلغ من المورد؟',
          message: 'رح يُضاف المبلغ تلقائيًا لصافي الصندوق.',
          confirmLabel: 'تم التحصيل',
          onConfirm: async ()=>{
            const order = appData.orders.find(o=>o.id===orderId);
            if(!order) return;
            const part = (order.parts||[]).find(p=>p.id===partId);
            if(!part) return;
            part.returnCollected = true;
            order.updatedAt = new Date().toISOString();
            await persistOrder(order);
            showToast('تم تسجيل التحصيل، وأُضيف المبلغ للصندوق', 'ok');
            refreshSuppliersList();
            updateSuppliersBadge();
            openSupplierHistoryModal(supplierId);
          }
        });
      }
    });
  });
}

/* تحصيل مرتجع من تشليح: دايمًا يروح لرصيد العهدة (رصيد المشتريات) — نفس أثر أي تحصيل تشليح
   عادي، الصندوق ما يتأثر مباشرة. لو صاحب الحساب يبي يرجع المبلغ فعليًا للصندوق، عنده "سحب من
   العهدة" بشاشة الصندوق (منفصل عن التحصيل نفسه). */
function confirmCollectScrapyardReturn(orderId, partId, supplierId){
  confirmAction({
    title: 'تأكيد تحصيل هذا المبلغ من التشليح؟',
    message: 'رح يُضاف لرصيد العهدة (رصيد المشتريات). لو تبي ترجعه للصندوق، فيه "سحب من العهدة" بشاشة الصندوق.',
    confirmLabel: 'تم التحصيل',
    onConfirm: async ()=>{
      const order = appData.orders.find(o=>o.id===orderId);
      if(!order) return;
      const part = (order.parts||[]).find(p=>p.id===partId);
      if(!part) return;
      part.returnCollected = true;
      order.updatedAt = new Date().toISOString();
      await persistOrder(order);
      showToast('تم تسجيل التحصيل، وأُضيف لرصيد العهدة', 'ok');
      refreshSuppliersList();
      updateSuppliersBadge();
      renderKPIs();
      if(document.getElementById('treasury-view') && document.getElementById('treasury-view').style.display !== 'none') renderTreasuryView();
      openSupplierHistoryModal(supplierId);
    }
  });
}

      s.handlesNew ? 'قطع جديدة' : null,
      s.handlesUsed ? 'قطع مستعملة (تشليح)' : null

      ).join('') +

let suppliersSearchQuery = '';
function suppliersMatchingSearch(){
  const q = suppliersSearchQuery.trim().toLowerCase();
  let rows = appData.suppliers||[];
  if(q){
    rows = rows.filter(s=>{
      const hay = [s.name, s.phone].concat(Array.isArray(s.extraPhones)?s.extraPhones:[]).join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  // اللي عندهم مسترجع بانتظار التحصيل يطلعوا فوق
  return [...rows].sort((a,b)=>{
    const ap = supplierReturnReceivableTotal(a.id)>0 ? 1 : 0;
    const bp = supplierReturnReceivableTotal(b.id)>0 ? 1 : 0;
    return bp-ap;
  });
}

function suppliersItemsListHtml(){
  const rows = suppliersMatchingSearch();
  if(!rows.length) return '<div class="expense-empty-hint">'+(suppliersSearchQuery.trim() ? 'ما فيه نتائج مطابقة' : 'ما فيه موردين مضافين بعد')+'</div>';
  return rows.map(supplierRowHtml).join('');
}
