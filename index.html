/* قائمة اختيار قابلة للبحث (بديل عن <select> عادي) — لازمة كل ما يكبر عدد الخيارات (موردين/عملاء)
   وصار التمرير بينها بطيء. options: [{id,label,sublabel?}]. */
function searchableSelectHtml(inputClass, options, selectedId, placeholder){
  const selected = options.find(o=>o.id===selectedId);
  return '<div class="searchable-select" data-selected-id="'+escapeHtml(selectedId||'')+'">' +
    '<input type="text" dir="auto" class="searchable-select-input'+(selectedId?'':' select-empty-warn')+' '+inputClass+'" placeholder="'+escapeHtml(placeholder||'')+'" value="'+escapeHtml(selected?selected.label:'')+'" autocomplete="off">' +
    '<div class="searchable-select-dropdown" style="display:none;"></div>' +
  '</div>';
}

/* رقم جوال أغلبه أرقام (7+ خانة) — نستخدمه لتخمين هل النص المكتوب/الملصوق رقم جوال ولا اسم،
   عشان نعرف نحط القيمة بالحقل الصح (رقم/اسم) لما نفتح نافذة "إضافة عميل جديد". */
function looksLikePhoneNumber(text){
  return ((text||'').match(/\d/g)||[]).length >= 7;
}

/* getOptions: دالة ترجع [{id,label,sublabel?}] وقت الاستدعاء (مش مصفوفة ثابتة) عشان تعكس أي
   إضافة حديثة (مثلا مورد جديد انضاف بينما المودال مفتوح). onSelect(id) يستدعى بعد أي اختيار.
   onCreateNew (اختياري): لو محدّدة وما فيه أي خيار مطابق للنص المكتوب/الملصوق، تظهر بالقائمة
   المنسدلة نتيجة "➕ إضافة ... كعميل جديد" بدل "ما فيه نتائج" — عشان رقم جوال ملصوق ما يضيع بصمت
   لمجرد إنه ما يطابق عميل موجود أصلًا (لازم "إضافة عميل جديد" صريحة، مو مجرد كتابة بالحقل). */
function bindSearchableSelect(wrapEl, getOptions, onSelect, onCreateNew){
  const input = wrapEl.querySelector('.searchable-select-input');
  const dropdown = wrapEl.querySelector('.searchable-select-dropdown');
  if(!input || !dropdown) return;
  const renderOptions = (filterText)=>{
    const q = (filterText||'').trim().toLowerCase();
    const options = getOptions();
    const matches = q ? options.filter(o=> o.label.toLowerCase().includes(q) || (o.sublabel||'').toLowerCase().includes(q)) : options;
    if(matches.length){
      dropdown.innerHTML = matches.map(o=>'<button type="button" class="searchable-select-option" data-id="'+escapeHtml(o.id)+'">'+escapeHtml(o.label)+(o.sublabel?' — '+escapeHtml(o.sublabel):'')+'</button>').join('');
    } else if(q && onCreateNew){
      dropdown.innerHTML = '<button type="button" class="searchable-select-option searchable-select-create">➕ إضافة "'+escapeHtml(filterText.trim())+'" كعميل جديد</button>';
    } else {
      dropdown.innerHTML = '<div class="searchable-select-empty">ما فيه نتائج</div>';
    }
    dropdown.querySelectorAll('.searchable-select-option[data-id]').forEach(btn=>{
      btn.addEventListener('mousedown', e=>{
        e.preventDefault(); // قبل blur الـ input حتى ما يسكر القائمة قبل ما ياخذ الكلك
        const opt = options.find(o=>o.id===btn.getAttribute('data-id'));
        input.value = opt ? opt.label : '';
        input.classList.toggle('select-empty-warn', !opt);
        wrapEl.setAttribute('data-selected-id', opt ? opt.id : '');
        dropdown.style.display = 'none';
        onSelect(opt ? opt.id : '');
      });
    });
    const createBtn = dropdown.querySelector('.searchable-select-create');
    if(createBtn){
      createBtn.addEventListener('mousedown', e=>{
        e.preventDefault();
        dropdown.style.display = 'none';
        onCreateNew(filterText.trim());
      });
    }
  };
  input.addEventListener('focus', ()=>{ input.select(); renderOptions(''); dropdown.style.display='block'; });
  input.addEventListener('input', ()=>{ renderOptions(input.value); dropdown.style.display='block'; });
  // كتابة/لصق نص (مثلاً رقم جوال) بدون فعليًا اختيار عميل موجود أو إضافته كعميل جديد ما لازم يبقى
  // شكله "مقبول" بالحقل — لو ما صار اختيار فعلي، نرجّع الحقل لآخر عميل محفوظ فعليًا (أو نفرّغه).
  input.addEventListener('blur', ()=>{
    setTimeout(()=>{
      dropdown.style.display='none';
      const selectedId = wrapEl.getAttribute('data-selected-id');
      const selected = selectedId ? getOptions().find(o=>o.id===selectedId) : null;
      input.value = selected ? selected.label : '';
      input.classList.toggle('select-empty-warn', !selected);
    }, 150);
  });
}

function partDisplayName(p){
  const base = (p.description||'').trim();
  return p.used ? base+' (مستعمل)' : base;
}

function nextOrderNumber(){
  const ORDER_NUMBER_FLOOR = 959;
  let max = 0;
  appData.orders.forEach(o=>{
    const m = /^PT-(\d+)$/.exec(o.orderNumber||'');
    if(m){ const n=parseInt(m[1],10); if(n>max) max=n; }
  });
  const next = Math.max(max+1, ORDER_NUMBER_FLOOR);
  return 'PT-' + String(next).padStart(4,'0');
}

function orderActiveParts(order){
  const parts = order.parts||[];
  return order.partsSelectionEnabled ? parts.filter(p=>p.included!==false) : parts;
}

/* قطعة مستبعدة يدويًا عبر "🎯 تحديد القطع" (order.partsSelectionEnabled=true و part.included=false)
   ما لازم تدخل بأي حساب مورد/تشليح/عميل — نفس منطق orderActiveParts بس لاستخدامه بدوال تكرر
   على o.parts مباشرة (مو عن طريق orderTotals) */
function partIsIncludedInOrder(order, part){
  return !order.partsSelectionEnabled || part.included !== false;
}

/* إجمالي دفعات الزبون لحساب الطلبية نفسها (المتبقي عليه/حالة السداد) — يستبعد دائمًا أي دفعة
   "مرتجع" (returnAdjustment) بشكل فوري، بغض النظر عن تأكيد إرجاع المبلغ فعليًا، حتى تبقى أرقام
   الطلبية متزنة ومايتوقف الحفظ بسبب "تجاوز المبلغ المستحق". */
function computeCustomerPaidAmount(order, excludePaymentId){
  return (order.customerPayments||[]).reduce((sum,p)=>{
    if(excludePaymentId && p.id===excludePaymentId) return sum;
    const amt = Number(p.amount)||0;
    return p.returnAdjustment ? sum - amt : sum + amt;
  }, 0);
}

/* إجمالي دفعات الزبون لحساب الصندوق فقط — دفعة "مرتجع" ما تُخصم إلا بعد ما يتأكَّد فعليًا إنه
   المبلغ رجع للزبون (part.customerRefundConfirmed). قبل التأكيد الصندوق يبقى كأنه ما صار إرجاع
   أصلًا (نفس منطق تحصيل المورد: القطعة تبقى "مسدد عنها" بالصندوق لحد ما يصير تأكيد صريح). */
function computeCustomerPaidAmountForBox(order){
  return (order.customerPayments||[]).reduce((sum,p)=>{
    const amt = Number(p.amount)||0;
    if(!p.returnAdjustment) return sum + amt;
    const linkedPart = (order.parts||[]).find(pp=>pp.id===p.linkedPartId);
    const confirmed = linkedPart && linkedPart.customerRefundConfirmed;
    return confirmed ? sum - amt : sum;
  }, 0);
}

function orderTotals(order){
  let costTotal = 0, costToScrapyard = 0, costToSupplier = 0, partsSellTotal = 0, pricedCount = 0, sellEligibleCount = 0;
  const activeParts = orderActiveParts(order);
  activeParts.forEach(p=>{
    const qty = Number(p.qty)||1;
    const returned = !!p.returned;
    // قطعة مرتجعة قبل ما تُدفع تُستبعد فورًا من كل الحسابات؛ إذا كانت مدفوعة مسبقًا للمورد تبقى ضمن تكلفته
    // (وبالتالي ضمن "المستحق للمورد") لحد ما يُحصّل المبلغ منه فعليًا عبر شاشة الموردين — عندها تُستبعد كمان.
    const keepCost = !returned || (p.returnHasReceivable && !p.returnCollected);
    // القطعة المرتجعة ما تُحسب على الزبون مباشرة، بغض النظر عن حالة تحصيل مبلغها من المورد
    const keepSell = !returned;
    if(keepCost){
      const lineCost = qty * (Number(p.costPrice)||0);
      costTotal += lineCost;
      if(p.used){ costToScrapyard += lineCost; } else { costToSupplier += lineCost; }
    }
    if(keepSell){
      sellEligibleCount++;
      if(p.sellPrice !== null && p.sellPrice !== undefined && p.sellPrice !== ''){
        partsSellTotal += qty * (Number(p.sellPrice)||0);
        pricedCount++;
      }
    }
  });
  const hasSell = pricedCount>0;
  const fullyPriced = sellEligibleCount>0 && pricedCount===sellEligibleCount;
  // كل القطع النشطة رجعت (مافيه ولا وحدة تنتظر تسعير) — الحالة "مرتجعة" مو "لم تُسعّر بعد"
  const allPartsReturned = activeParts.length>0 && sellEligibleCount===0;
  // "🎯 تحديد القطع" مفعّلة والمستخدم ألغى تحديد كل القطع — ما ضل شي يستاهل تسعير أصلًا،
  // فهاي مش "بانتظار تسعير" (كانت عالقة بهالحالة للأبد بدون هالفحص).
  const noActiveParts = activeParts.length===0 && (order.parts||[]).length>0;
  const feeEnabled = !!order.feeEnabled;
  const feePercent = Math.max(0, Number(order.feePercent)||0);
  // مبالغ "محتفظ فيها" من قطع/طلبيات رجعت واختار المستخدم عدم استرجاع نسبتها المضافة للزبون
  // (تخييرFeeReturn) — تتجمّد وقت الإرجاع وتضل مضافة دائمًا، بغض النظر عن partsSellTotal الحالي
  // أو حتى تفعيل feeEnabled/serviceFeeEnabled/deliveryFeeEnabled لاحقًا (قرار مالي مؤكد وقتها)
  const returnKeptFeeAmount = round2(Math.max(0, Number(order.returnKeptFeeAmount)||0));
  const returnKeptServiceFeeAmount = round2(Math.max(0, Number(order.returnKeptServiceFeeAmount)||0));
  const returnKeptDeliveryAmount = round2(Math.max(0, Number(order.returnKeptDeliveryAmount)||0));
  const feeAmount = round2(((hasSell && feeEnabled) ? partsSellTotal * feePercent / 100 : 0) + returnKeptFeeAmount);
  const serviceFeeEnabled = !!order.serviceFeeEnabled;
  const serviceFeePercent = Math.max(0, Number(order.serviceFeePercent)||0);
  const serviceFeeAmount = round2(((hasSell && serviceFeeEnabled) ? partsSellTotal * serviceFeePercent / 100 : 0) + returnKeptServiceFeeAmount);
  const deliveryFeeEnabled = !!order.deliveryFeeEnabled;
  const deliveryFeeAmount = round2(((hasSell && deliveryFeeEnabled) ? Math.max(0, Number(order.deliveryFeeAmount)||0) : 0) + returnKeptDeliveryAmount);
  const sellTotal = partsSellTotal + feeAmount + serviceFeeAmount + deliveryFeeAmount; // المبلغ الكامل المستحق من الزبون (شامل نسبة الخدمة، نسبة الخدمات، وأجور التوصيل)
  const customerPaidAmount = round2(computeCustomerPaidAmount(order));
  const customerPaidAmountForBox = round2(computeCustomerPaidAmountForBox(order));
  // مبالغ محتفظ فيها بعد إرجاع كل القطع (hasSell=false) تخلي الزبون لسه مدين فيها — ما لازم
  // "المتبقي" يتصفّر عالغلط متل حالة "لسه ما تسعّرت" العادية (اللي فيها فعليًا ما فيه شي مستحق)
  const hasChargeable = hasSell || (returnKeptFeeAmount+returnKeptServiceFeeAmount+returnKeptDeliveryAmount) > 0.01;
  const customerRemaining = hasChargeable ? round2(sellTotal - customerPaidAmount) : 0;
  const customerFullyPaid = hasChargeable && customerRemaining <= 0.01;
  const profit = sellTotal - costTotal;
  // الربح المحصّل = أي مبلغ دفعه الزبون زيادة عن تكلفة القطع (استرداد التكلفة أولًا، ثم الزائد ربح محصّل).
  // مثال: تكلفة 1000، بيع 2000 (ربح 1000)، دُفع 1750 → محصّل = 1750-1000 = 750، غير محصّل = 1000-750 = 250.
  let collectedProfit = 0;
  if(hasChargeable && profit>0){
    collectedProfit = round2(Math.max(0, Math.min(customerPaidAmount - costTotal, profit)));
  }
  const uncollectedProfit = hasChargeable ? round2(profit - collectedProfit) : 0;
  return {
    costTotal,
    costToScrapyard,
    costToSupplier,
    partsSellTotal,
    feeAmount,
    feePercent,
    feeEnabled,
    serviceFeeAmount,
    serviceFeePercent,
    serviceFeeEnabled,
    deliveryFeeAmount,
    deliveryFeeEnabled,
    sellTotal,
    customerPaidAmount,
    customerPaidAmountForBox,
    customerRemaining,
    customerFullyPaid,
    hasSell,
    hasChargeable,
    fullyPriced,
    allPartsReturned,
    noActiveParts,
    profit,
    collectedProfit,
    uncollectedProfit
  };
}

function orderStatusFlags(order){
  const t = orderTotals(order);
  return Object.assign({}, t, {
    // "بانتظار السداد" لازم يتبع نفس منطق computeAggregateFinancials — قبل "تم التوريد" ما
    // في دين حقيقي بعد (انظر ملاحظة computeAggregateFinancials)، فما ينفع الفلتر/التلوين يقول
    // "بانتظار السداد" على طلبية ما صارت مستحقة أصلًا بمؤشرات الصندوق
    waitingAmerPayment: order.confirmed && order.supplied && t.costToScrapyard>0 && !order.paidToAmer,
    waitingSupplierPayment: order.confirmed && order.supplied && t.costToSupplier>0 && !order.paidToSupplier,
    waitingSupply: order.confirmed && !order.supplied,
    waitingPricing: !t.hasSell && !t.allPartsReturned && !t.noActiveParts,
    waitingCustomerPayment: order.confirmed && order.supplied && t.hasChargeable && !t.customerFullyPaid,
    complete: order.confirmed && order.supplied && (t.costToScrapyard===0 || order.paidToAmer) && (t.costToSupplier===0 || order.paidToSupplier) && t.customerFullyPaid && t.fullyPriced
  });
}

function defaultTreasury(){
  return { delivery:[], transport:[], unexpectedLosses:[], salaries:[], hr:[], other:[], support:[], amerCustody:[] };
}

function defaultTasks(){
  return { purchases:[], sales:[] };
}

function groupTreasuryRows(rows){
  const t = defaultTreasury();
  (rows||[]).forEach(r=>{
    if(!Array.isArray(t[r.category])) t[r.category] = [];
    t[r.category].push({ id: r.id, amount: r.amount, date: r.date||'', note: r.note||'' });
  });
  return t;
}

function groupTaskRows(rows){
  const t = defaultTasks();
  (rows||[]).forEach(r=>{
    if(!Array.isArray(t[r.category])) t[r.category] = [];
    t[r.category].push({ id: r.id, text: r.text||'', done: !!r.done, createdAt: r.created_at||'' });
  });
  return t;
}

/* حقول الطلبية يلي انصعدت لأعمدة حقيقية بجدول orders — أي حقل ثاني يترسم تلقائيًا بعمود extra */
const ORDER_PROMOTED_KEYS = ['id','orderNumber','orderLabel','customerPhone','customerId','confirmed','supplied',
  'suppliedAt','paidToAmer','paidToSupplier','parts','customerPayments','createdAt','updatedAt'];

function orderRowToObject(row){
  const obj = Object.assign({}, row.extra || {});
  obj.id = row.id;
  obj.orderNumber = row.order_number || '';
  obj.orderLabel = row.order_label || '';
  obj.customerPhone = row.customer_phone || '';
  obj.customerId = row.customer_id || null;
  obj.confirmed = !!row.confirmed;
  obj.supplied = !!row.supplied;
  obj.suppliedAt = row.supplied_at ? new Date(row.supplied_at).toISOString() : null;
  obj.paidToAmer = !!row.paid_to_amer;
  obj.paidToSupplier = !!row.paid_to_supplier;
  obj.parts = Array.isArray(row.parts) ? row.parts : [];
  obj.customerPayments = Array.isArray(row.customer_payments) ? row.customer_payments : [];
  obj.createdAt = row.created_at ? new Date(row.created_at).toISOString() : '';
  obj.updatedAt = row.updated_at ? new Date(row.updated_at).toISOString() : '';
  return obj;
}

function orderObjectToRow(order){
  const extra = {};
  Object.keys(order||{}).forEach(k=>{ if(!ORDER_PROMOTED_KEYS.includes(k)) extra[k] = order[k]; });
  return {
    id: order.id,
    order_number: order.orderNumber || '',
    order_label: order.orderLabel || '',
    customer_phone: order.customerPhone || '',
    customer_id: order.customerId || null,
    confirmed: !!order.confirmed,
    supplied: !!order.supplied,
    supplied_at: order.suppliedAt || null,
    paid_to_amer: !!order.paidToAmer,
    paid_to_supplier: !!order.paidToSupplier,
    parts: Array.isArray(order.parts) ? order.parts : [],
    customer_payments: Array.isArray(order.customerPayments) ? order.customerPayments : [],
    extra: extra,
    created_at: order.createdAt || new Date().toISOString(),
    updated_at: order.updatedAt || new Date().toISOString()
  };
}

function groupSupplierOrCustomerRows(rows){
  return (rows||[]).map(r=>({
    id: r.id, name: r.name||'', phone: r.phone||'', notes: r.notes||'',
    extraPhones: Array.isArray(r.extra_phones) ? r.extra_phones : [],
    handlesNew: r.handles_new !== false,
    handlesUsed: r.handles_used !== false,
    createdAt: r.created_at || ''
  }));
}

async function loadData(){
  try{
    if(!sb) throw new Error('NO_DB');
    const [ordersRes, treasuryRes, tasksRes, suppliersRes, customersRes] = await Promise.all([
      sb.from('orders').select('*'),
      sb.from('treasury_entries').select('*'),
      sb.from('tasks').select('*'),
      sb.from('suppliers').select('*'),
      sb.from('customers').select('*')
    ]);
    if(ordersRes.error) throw ordersRes.error;
    if(treasuryRes.error) throw treasuryRes.error;
    if(tasksRes.error) throw tasksRes.error;
    if(suppliersRes.error) throw suppliersRes.error;
    if(customersRes.error) throw customersRes.error;
    appData = {
      orders: (ordersRes.data||[]).map(orderRowToObject),
      treasury: groupTreasuryRows(treasuryRes.data),
      tasks: groupTaskRows(tasksRes.data),
      suppliers: groupSupplierOrCustomerRows(suppliersRes.data),
      customers: groupSupplierOrCustomerRows(customersRes.data)
    };
  }catch(e){
    appData = { orders: [], treasury: defaultTreasury(), tasks: defaultTasks(), suppliers: [], customers: [] };
    showToast('تعذر الاتصال بقاعدة البيانات — تحقق من إعداد Supabase (SUPABASE_URL / SUPABASE_ANON_KEY)', 'error');
  }
  migrateLegacyCustomerPayment();
  migrateLegacyOrderLabel();
  migrateLegacyTreasury();
  migrateLegacyTasks();
}

function migrateLegacyTreasury(){
  if(!appData.treasury) appData.treasury = defaultTreasury();
  EXPENSE_CATEGORIES.forEach(c=>{
    const val = appData.treasury[c.key];
    if(!Array.isArray(val)){
      const num = Number(val)||0;
      appData.treasury[c.key] = num>0 ? [{id: uid('exp'), amount: num, date: ''}] : [];
    }
  });
  if(!Array.isArray(appData.treasury.support)) appData.treasury.support = [];
}

function migrateLegacyTasks(){
  if(!appData.tasks) appData.tasks = defaultTasks();
  TASK_CATEGORIES.forEach(c=>{
    if(!Array.isArray(appData.tasks[c.key])) appData.tasks[c.key] = [];
  });
}

function migrateLegacyOrderLabel(){
  appData.orders.forEach(o=>{
    if((!o.orderLabel) && o.address){ o.orderLabel = o.address; }
  });
}

function migrateLegacyCustomerPayment(){
  appData.orders.forEach(o=>{
    if(!Array.isArray(o.customerPayments)) o.customerPayments = [];
    if(o.customerPayments.length===0 && Number(o.customerPaidAmount)>0){
      o.customerPayments.push({
        id: uid('pay'),
        amount: Number(o.customerPaidAmount)||0,
        method: o.customerPaymentMethod||'',
        date: o.customerPaymentDate||''
      });
    } else if(o.customerPayments.length===0 && o.customerPaid===true){
      const t = orderTotals(o);
      if(t.sellTotal>0){
        o.customerPayments.push({ id: uid('pay'), amount: t.sellTotal, method:'', date:'' });
      }
    }
  });
}

function showToast(msg, type){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast ' + (type==='error' ? 'toast-error' : 'toast-ok');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.classList.add('toast-out'); setTimeout(()=>el.remove(),300); }, 2600);
}

/* ---------- KPIs ---------- */
function computeAggregateFinancials(matchPeriodFn){
  const realOrders = appData.orders.filter(o=>!o.isQuote);
  const confirmedOrders = realOrders.filter(o=>o.confirmed).filter(o=> matchPeriodFn ? matchPeriodFn(o) : true);
  let dueToScrapyard = 0, dueToSuppliers = 0, dueFromCustomers = 0, dueFromCustomersCount = 0, collectedProfit = 0, uncollectedProfit = 0;
  let dueToScrapyardCount = 0, dueToSuppliersCount = 0;
  let paidToScrapyardTotal = 0, paidToSuppliersTotal = 0, customerReceiptsTotal = 0;
  confirmedOrders.forEach(o=>{
    const t = orderTotals(o);
    // قبل "تم التوريد" القطعة لسه ما استُلمت فعليًا — مش دين حقيقي على التشليح/المورد بعد
    // (ممكن يتغيّر/يتلغى قبل التسليم)، وأصلًا الطلبية ما بتظهر لعامر بشاشة السداد قبل هالخطوة،
    // فكانت "مستحق للتشليح/الموردين" تزيد فور التأكيد بينما عامر ما يقدر يشوف ولا يتصرف بالطلبية
    // أصلًا — يعطي انطباع بدين "معلّق بالهوا" لحد ما حدا يعلّم "تم التوريد". هذا القيد يخص بس
    // "لسه ما انسدد" (dueTo*) — فرع "انسدد فعليًا" (paidTo*Total) لازم يضل بدون قيد التوريد،
    // لأنه بيمثّل كاش خرج فعليًا من الصندوق بغض النظر عن حالة التوريد (مثلاً دفعة مقدّمة لمورد
    // قبل وصول القطعة) — تقييده كان بيخفي كاش حقيقي مدفوع عن net.
    if(!o.paidToAmer){ if(o.supplied && t.costToScrapyard>0){ dueToScrapyard += t.costToScrapyard; dueToScrapyardCount++; } } else paidToScrapyardTotal += t.costToScrapyard;
    if(!o.paidToSupplier){ if(o.supplied && t.costToSupplier>0){ dueToSuppliers += t.costToSupplier; dueToSuppliersCount++; } } else paidToSuppliersTotal += t.costToSupplier;
    // نفس مبدأ dueToScrapyard/dueToSuppliers فوق — ونفس شرط waitingCustomerPayment الأصلي
    // بـorderStatusFlags (كان already يشترط order.supplied، بعكس هالمجموع اللي كان يزيد فور
    // التأكيد بس): قبل التوريد المتبقي على الزبون لسه مو "مستحق تحصيله" فعليًا بنفس منطق الدين.
    if(o.supplied && t.hasSell && t.customerRemaining>0){ dueFromCustomers += t.customerRemaining; dueFromCustomersCount++; }
    customerReceiptsTotal += t.customerPaidAmountForBox;
    if(t.hasSell){
      collectedProfit += t.collectedProfit;
      uncollectedProfit += t.uncollectedProfit;
    }
  });
  return {
    confirmedCount: confirmedOrders.length,
    unconfirmedCount: realOrders.length - confirmedOrders.length,
    dueToScrapyard, dueToScrapyardCount, dueToSuppliers, dueToSuppliersCount, dueFromCustomers, dueFromCustomersCount, collectedProfit, uncollectedProfit,
    paidToScrapyardTotal, paidToSuppliersTotal, customerReceiptsTotal
  };
}

function renderKPIs(){
  const el = document.getElementById('kpi-row');
  const f = computeAggregateFinancials();
  const returnsOwedToUs = totalSupplierReturnReceivables();
  const custodyBalance = amerCustodyBalance();
  const dueToScrapyardNet = round2(f.dueToScrapyard - custodyBalance);
  const dueToScrapyardShown = Math.max(0, dueToScrapyardNet);
  const suppliersWithReceivables = (appData.suppliers||[]).filter(s=>supplierReturnReceivableTotal(s.id)>0).length;

  const term = (label, amount)=> ({ label, amount: Math.abs(round2(amount)), negative: amount<0 });
  const confirmedBreakdown = { note: (f.unconfirmedCount>0
    ? f.confirmedCount+' مؤكدة + '+f.unconfirmedCount+' بانتظار التأكيد'
    : 'كل الطلبيات الغير مؤرشفة ('+f.confirmedCount+') مؤكدة') };
  const dueToScrapyardBreakdown = {
    terms: [
      term('مستحق للتشليح (قبل خصم رصيد المشتريات)', f.dueToScrapyard),
      term('رصيد المشتريات', -custodyBalance)
    ],
    note: dueToScrapyardNet<0 ? 'رصيد المشتريات يغطي كل المستحق حاليًا' : null
  };
  const dueToSuppliersBreakdown = { note: f.dueToSuppliersCount>0
    ? 'مجموع المستحق على '+f.dueToSuppliersCount+' طلبية موردة لسه ما سُددت للمورد'
    : 'ما فيه طلبيات موردة عليها مبلغ مستحق للموردين حاليًا' };
  const dueFromCustomersBreakdown = { note: f.dueFromCustomersCount>0
    ? 'مجموع المتبقي على '+f.dueFromCustomersCount+' طلبية مسلّمة لسه ما سُددت بالكامل'
    : 'ما فيه طلبيات مسلّمة عليها مبلغ متبقي حاليًا' };
  const returnReceivablesBreakdown = { note: 'مرتجعات مستحقة من '+suppliersWithReceivables+' مورد/تشليح' };

  el.innerHTML =
    treasuryCardHtml('kpiConfirmed', 'الطلبيات المؤكدة',
      '<div class="kpi-value num">'+f.confirmedCount+'</div>',
      (f.unconfirmedCount>0?'<div class="kpi-sub">+ '+f.unconfirmedCount+' بانتظار التأكيد</div>':null),
      confirmedBreakdown, null, 'kpi-card') +
    treasuryCardHtml('kpiDueToScrapyard', 'مستحق للتشليح',
      '<div class="kpi-value num">'+fmtMoney(dueToScrapyardShown)+'</div>',
      null, dueToScrapyardBreakdown, 'kpi-rust', 'kpi-card') +
    treasuryCardHtml('kpiDueToSuppliers', 'مستحق للموردين',
      '<div class="kpi-value num">'+fmtMoney(f.dueToSuppliers)+'</div>',
      null, dueToSuppliersBreakdown, 'kpi-rust', 'kpi-card') +
    treasuryCardHtml('kpiDueFromCustomers', 'مستحق من الزبائن',
      '<div class="kpi-value num">'+fmtMoney(f.dueFromCustomers)+'</div>',
      null, dueFromCustomersBreakdown, 'kpi-amber', 'kpi-card') +
    (returnsOwedToUs>0 ? treasuryCardHtml('kpiReturnReceivables', 'لنا من التشاليح/الموردين (مرتجعات)',
      '<div class="kpi-value num">'+fmtMoney(returnsOwedToUs)+'</div>',
      null, returnReceivablesBreakdown, 'kpi-green', 'kpi-card') : '');
  bindTreasuryCardToggles(el);
}

function orderMatchesFilterAndSearch(order, filter, search){
  const f = orderStatusFlags(order);
  if(filter==='unconfirmed' && order.confirmed) return false;
  if(filter==='waitingSupply' && !f.waitingSupply) return false;
  if(filter==='waitingPricing' && !f.waitingPricing) return false;
  if(filter==='waitingAmer' && !f.waitingAmerPayment) return false;
  if(filter==='waitingSupplier' && !f.waitingSupplierPayment) return false;
  if(filter==='waitingCustomer' && !f.waitingCustomerPayment) return false;
  if(filter==='complete' && !f.complete) return false;
  // فيلتر خاص بالأرشيف بس (مو ضمن FILTERS المشتركة) — الطلبيات المؤرشفة غير المؤكدة يلي
  // انسجّل إلها سبب عدم نجاح
  if(filter==='justified' && !order.unsuccessfulReason) return false;
  if(search){
    // بحث ذكي: يشمل رقم الطلبية ووصفها (اسم الزبون/نوع السيارة) ورقم الجوال ووصف كل القطع.
    // بيقسّم البحث لكلمات، وأي طلبية تحوي كل الكلمات (بأي ترتيب وبأي حقل) تعتبر مطابقة.
    const words = search.trim().toLowerCase().split(/\s+/).filter(Boolean);
    if(words.length){
      const haystack = [
        order.orderNumber||'',
        order.orderLabel||'',
        order.customerPhone||'',
        ...(order.parts||[]).map(p=>p.description||'')
      ].join(' ').toLowerCase();
      if(!words.every(w=> haystack.includes(w))) return false;
    }
  }
  return true;
}

function orderMatches(order){
  return orderMatchesFilterAndSearch(order, currentFilter, currentSearch);
}

/* نفس منطق فلتر/بحث قائمة الطلبيات العادية، بس بحالة مستقلة (archiveFilter/archiveSearch)
   عشان فتح فلتر داخل الأرشيف ما يأثر على فلتر القائمة الرئيسية والعكس. */
function archiveOrderMatches(order){
  return orderMatchesFilterAndSearch(order, archiveFilter, archiveSearch);
}

function stampBadge(isDone, doneLabel, pendingLabel){
  return isDone
    ? '<span class="stamp stamp-green">'+doneLabel+'</span>'
    : '<span class="stamp stamp-rust">'+pendingLabel+'</span>';
}

function customerPaymentCellHtml(t, compact){
  if(!t.hasSell) return '<span class="muted">—</span>';
  if(t.customerFullyPaid) return '<span class="stamp stamp-green">'+(compact?'مدفوع':'مدفوع بالكامل')+'</span>';
  if(t.customerPaidAmount>0) return '<span class="stamp stamp-amber">متبقي '+fmtMoney(t.customerRemaining)+'</span>';
  return '<span class="stamp stamp-rust">'+(compact?'غير مدفوع':'لم يدفع الزبون')+'</span>';
}

function profitColorClass(t){
  if(!t.hasSell) return '';
  if(t.profit<0) return 'text-rust';
  return t.customerFullyPaid ? 'text-green' : 'text-amber';
}

/* عدد طلبات التعديل المعلّقة لطلبية معيّنة — يظهر كبادج صغير جنب رقمها بأي قائمة (الرئيسية أو
   الأرشيف، لأن rowHtml/cardHtml مشتركتين بين الاثنتين) عشان المخوّل ما يفوته طلب معلّق على
   طلبية مؤرشفة أو مو ظاهرة قدامه حاليًا */
function orderPendingProposalsCount(orderId){
  // للجميع، مو بس المخوّلين — مهاب طلب صراحة إنه أي شيء يحتاج انتباه يظهر إشعار عند الكل، حتى لو
  // القبول/الرفض يضل حصرًا لمهاب وهمام وبشار (نفس تفويض RLS: أي مستخدم مسموح يشوف الطلبات المعلّقة)

}

function orderNumberSortKey(order){
  const m = /(\d+)/.exec(order.orderNumber||'');
  return m ? parseInt(m[1],10) : 0;
}

function renderTable(){
  const el = document.getElementById('table-container');
  try{
    const orders = appData.orders.filter(o=>!o.isQuote).filter(o=>!o.archived).filter(orderMatches).sort((a,b)=> orderNumberSortKey(b) - orderNumberSortKey(a));

    if(orders.length===0){
      el.innerHTML = '<div class="empty-state">' +
        '<div class="empty-title">لا توجد طلبيات مطابقة</div>' +
        '<div class="empty-sub">جرّب تغيير الفلتر أو ابدأ طلبية جديدة من فوق.</div>' +
      '</div>';
      return;
    }

    el.innerHTML =
      '<table class="orders-table"><thead><tr>' +
        '<th>تأكيد</th><th>رقم الطلب</th><th>تواصل</th><th>إجمالي البيع</th><th>التشليح</th><th>المورد</th><th>الزبون</th><th></th>' +
      '</tr></thead><tbody>' + orders.map(rowHtml).join('') + '</tbody></table>' +
      '<div class="cards-list">' + orders.map(cardHtml).join('') + '</div>';

    el.querySelectorAll('[data-open]').forEach(b=>{
      b.addEventListener('click', ()=> openModal('edit', b.getAttribute('data-open')));
    });
    el.querySelectorAll('[data-contact-open]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const order = appData.orders.find(o=>o.id===btn.getAttribute('data-contact-open'));
        openContactModal(order ? order.customerPhone : '');
      });
    });
    el.querySelectorAll('[data-confirm-toggle]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        confirmToggleConfirmation(btn.getAttribute('data-confirm-toggle'));
      });
    });
    el.querySelectorAll('[data-archive]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        archiveOrder(btn.getAttribute('data-archive'));
      });
    });
  }catch(e){
    showPersistentErrorToast('تعذر عرض الطلبيات: ' + (e && e.message ? e.message : e));
    el.innerHTML = '<div class="empty-state">' +
      '<div class="empty-title">صار خطأ بعرض الطلبيات</div>' +
      '<div class="empty-sub">'+escapeHtml(e && e.message ? e.message : String(e))+'</div>' +
      '<button type="button" class="btn btn-ghost btn-sm" id="btn-retry-render-table" style="margin-top:10px;">🔄 إعادة المحاولة</button>' +
    '</div>';
    const retryBtn = document.getElementById('btn-retry-render-table');
    if(retryBtn) retryBtn.addEventListener('click', renderTable);
  }
}

/* ---------- modal (create/edit) ---------- */
let editingPayments = {}; // payment_id -> true — يُعاد تصفيره كل ما تُفتح نافذة الطلبية
let pendingPaymentAddDrafts = {}; // draft_key -> {amount,method,date} — دفعات غير المخوّلين قيد الصياغة (لسا ما أُرسلت كطلب)
/* أجزاء تغيّر تصنيفها (مستعمل/جديد) خلال الجلسة الحالية — إلغاء اقتراح التسعير المعلّق لهم
   يُؤجَّل لحد ما تُحفظ الطلبية فعليًا (onSaveOrder)، مش فور تأكيد التغيير بالمودال. لو المستخدم
   سكّر المودال أو ضغط "إلغاء" بدون حفظ، هالمجموعة تُترك بدون تنفيذ — تصنيف القطعة فعليًا ما تغيّر
   بقاعدة البيانات، فمالها داعي يتحذف اقتراح عامر المعلّق عليها. */
let pendingScrapyardCancellations = new Set();
/* نفس فكرة pendingScrapyardCancellations فوق — لو المخوّل ألغى "تم التوريد"، أي طلب تعديل سعر/اسم/نسبة
   معلّق (part_field/order_field) صار بلا معنى (شرط القفل نفسه ارتفع)، فنلغيه — بس بعد الحفظ الفعلي
   مش فور الضغط، غير هيك إلغاء بدون حفظ (تراجع/إغلاق المودال) بيكون ألغى طلبات لسا سارية فعليًا */
let pendingEditProposalsCancellation = false;
/* نفس المبدأ — قطع اتحذفت أو ارتجعت مباشرة (من مخوّل، أو قبل "تحديد القطع") جوا الجلسة الحالية،
   بيصير أي طلب تعديل/حذف/إرجاع معلّق عليها بالذات ميت. بنجمعها هون ونصفّي طلباتها بس بعد نجاح
   الحفظ الفعلي — إلغاء بدون حفظ يعني الحذف/الإرجاع نفسه ما صار فعليًا بقاعدة البيانات */
let pendingPartProposalPurges = new Set();

function paymentRowHtml(p){
  const amountVal = (p.amount===''||p.amount==null) ? '' : p.amount;
  if(p.returnAdjustment){
    return '<div class="payment-row payment-row-return" data-payment-id="'+escapeHtml(p.id)+'">' +
      '<span class="payment-return-label">'+fmtMoney(Number(p.amount)||0)+' مرتجع</span>' +
      '<span class="payment-date-display">'+escapeHtml(p.date||'')+'</span>' +
    '</div>';
  }

  // دفعة إلها طلب تعديل/حذف معلّق أصلًا — نعرض القيمة الحالية + شريط الطلب بدل أي أزرار تانية،
  // لحد ما يتقبل/يترفض (نفس درس sell_price_proposals: ما نسمح بطلب تاني فوق طلب لسا معلّق)
  const pendingProposal = pendingPaymentEditOrDeleteProposal(p.id);
  if(pendingProposal){
    return '<div class="payment-row payment-row-view" data-payment-id="'+escapeHtml(p.id)+'">' +
      '<span class="num">'+fmtMoney(Number(amountVal)||0)+'</span>' +
      '<span class="payment-date-display">'+escapeHtml(paymentMethodLabel(p.method))+'</span>' +
      '<span class="payment-date-display">'+escapeHtml(p.date||'')+'</span>' +
      editProposalPendingHtml(pendingProposal) +
    '</div>';
  }

  const elevated = hasElevatedAccess();

  if(!editingPayments[p.id]){
    return '<div class="payment-row payment-row-view" data-payment-id="'+escapeHtml(p.id)+'">' +
      '<span class="num">'+fmtMoney(Number(amountVal)||0)+'</span>' +
      '<span class="payment-date-display">'+escapeHtml(paymentMethodLabel(p.method))+'</span>' +
      '<span class="payment-date-display">'+escapeHtml(p.date||'')+'</span>' +
      (elevated
        ? '<button type="button" class="icon-btn payment-edit-btn" title="تعديل" aria-label="تعديل">✏️ تعديل</button>'
        : (
          '<button type="button" class="icon-btn payment-request-edit-btn" title="طلب تعديل" aria-label="طلب تعديل">✏️ طلب تعديل</button>' +
          '<button type="button" class="icon-btn payment-request-delete-btn" title="طلب حذف" aria-label="طلب حذف">🗑️</button>'
        )) +
    '</div>';
  }

  return '<div class="payment-row" data-payment-id="'+escapeHtml(p.id)+'">' +
    '<input type="number" min="0" step="0.01" class="payment-amount-input num" placeholder="المبلغ" value="'+escapeHtml(amountVal)+'">' +
    '<select class="payment-method-select">' +
      '<option value=""'+(!p.method?' selected':'')+'>اختر الطريقة *</option>' +
      '<option value="cash"'+(p.method==='cash'?' selected':'')+'>كاش</option>' +
      '<option value="card"'+(p.method==='card'?' selected':'')+'>شبكة</option>' +
    '</select>' +
    '<span class="payment-date-display">'+escapeHtml(p.date||'')+'</span>' +
    (elevated
      ? (
        '<button type="button" class="btn btn-sm expense-add-entry-btn payment-save-btn">💾 حفظ</button>' +
        '<button type="button" class="payment-remove-btn" data-remove-payment="'+escapeHtml(p.id)+'" aria-label="حذف الدفعة">✕</button>'
      ) : (
        '<button type="button" class="icon-btn payment-send-edit-request-btn" title="إرسال طلب التعديل">📨</button>' +
        '<button type="button" class="payment-remove-btn payment-cancel-edit-btn" aria-label="إلغاء">✕</button>'
      )) +
  '</div>';
}

let selectedPartType = null; // null | 'new' | 'used' — يُعاد تصفيره كل ما تُفتح نافذة الطلبية
let copiedPartsClipboard = null; // آخر مجموعة قطع تم نسخها (وصف/أسعار/عدد/حالة استعمال) — تبقى بالذاكرة بين فتح وإغلاق نوافذ الطلبيات المختلفة

function copyPartsToClipboard(){
  if(!draft.parts || draft.parts.length===0){
    showToast('ما فيه قطع بهذي الطلبية لنسخها', 'error');
    return;
  }
  copiedPartsClipboard = draft.parts.map(p=>({
    description: p.description,
    qty: p.qty,
    costPrice: p.costPrice,
    sellPrice: p.sellPrice,
    used: !!p.used
  }));
  showToast('تم نسخ '+copiedPartsClipboard.length+' قطعة — افتح أي طلبية واضغط لصق', 'ok');
}

function pastePartsFromClipboard(){
  if(fieldGated()){ showToast('غير متاح', 'error'); return; }
  if(!copiedPartsClipboard || copiedPartsClipboard.length===0){
    showToast('ما فيه قطع منسوخة بعد — افتح الطلبية المصدر واضغط نسخ أولاً', 'error');
    return;
  }
  copiedPartsClipboard.forEach(p=>{
    draft.parts.push({
      id: uid('p'),
      description: p.description,
      qty: p.qty,
      costPrice: p.costPrice,
      sellPrice: p.sellPrice,
      used: !!p.used,
      supplierId: null
    });
  });
  refreshPartsList();
  showToast('تم لصق '+copiedPartsClipboard.length+' قطعة', 'ok');
}

        '<button type="button" class="type-pill type-pill-new'+(selectedPartType==='new'?' type-pill-active':'')+'" data-part-type="new">غير مستعملة</button>' +
        '<button type="button" class="type-pill type-pill-used'+(selectedPartType==='used'?' type-pill-active':'')+'" data-part-type="used">مستعملة</button>' +

function bindPartTypeGate(){
  const wrap = document.getElementById('part-type-gate-wrap');
  if(!wrap) return;
  wrap.querySelectorAll('.type-pill').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedPartType = btn.getAttribute('data-part-type');
      refreshPartAddControls();
    });
  });
  const addBtn = document.getElementById('add-part-btn');
  if(addBtn){
    addBtn.addEventListener('click', ()=>{
      draft.parts.push({id:uid('p'), description:'', qty:1, costPrice:'', sellPrice:null, used: selectedPartType==='used', supplierId: null});
      refreshPartsList();
    });
  }
}

function partAddControlsHtml(){
  // إضافة قطعة جديدة لطلبية موردة تعني قيمة إضافية على الحساب بلا موافقة — نفس مبدأ باقي
  // الحقول المالية بعد التوريد، بس ما فيها منطق "طلب" (قطعة كاملة لسا فاضية، مو قيمة وحدة
  // تُقترح)، فبنقفلها كاملة على غير المخوّل بدل ما نسيبها بطريق مسدود (كانت تُضاف بدون
  // مشكلة بالواجهة بس تفشل لاحقًا بصمت — انظر تدقيق الجلسة)
  if(fieldGated()){
    return '<p class="add-part-locked-hint">غير متاح</p>';
  }
  if(!draft.parts || draft.parts.length===0){
    // أول قطعة بالطلبية — لازم تحديد النوع أولاً قبل ظهور زر الإضافة
    return partTypeGateHtml();
  }
  // من القطعة الثانية وطالع — رجوع للإعداد السابق: زرّان جاهزان مباشرة بدون اختيار مسبق
  return '<div class="add-part-btns">' +
    '<button type="button" id="add-part-btn-new" class="btn btn-sm btn-add-part">+ جديد</button>' +

function refreshPartAddControls(){
  const wrap = document.getElementById('part-type-gate-wrap');
  if(!wrap) return;
  wrap.innerHTML = partAddControlsHtml();
  bindPartAddControls();
}

function bindPartAddControls(){
  if(!draft.parts || draft.parts.length===0){
    bindPartTypeGate();
    return;
  }
  const wrap = document.getElementById('part-type-gate-wrap');
  if(!wrap) return;
  const newBtn = wrap.querySelector('#add-part-btn-new');
  const usedBtn = wrap.querySelector('#add-part-btn-used');
  if(newBtn) newBtn.addEventListener('click', ()=>{
    draft.parts.push({id:uid('p'), description:'', qty:1, costPrice:'', sellPrice:null, used:false, supplierId: null});
    refreshPartsList();
  });
  if(usedBtn) usedBtn.addEventListener('click', ()=>{
    draft.parts.push({id:uid('p'), description:'', qty:1, costPrice:'', sellPrice:null, used:true, supplierId: null});

  });
}

function orderActionButtonsHtml(d){
  if(d.isNew) return '';
  const deleteProposal = pendingOrderActionProposal('order_delete');
  const deleteBtnHtml = deleteProposal
    ? '<span class="order-action-pending-wrap">'+editProposalPendingHtml(deleteProposal)+'</span>'
    : '<button type="button" class="btn btn-sm btn-danger-ghost" id="modal-delete-btn">حذف الطلبية</button>';

  // الإرجاع معناه "قطعة استُلمت من المورد/التشليح ثم رجعت" — قبل "تم التوريد" أصلًا ما فيه شي
  // استُلم بعد، فما يصير كلامه إرجاع
  let returnBtnHtml = '';
  if(d.supplied){
    const returnProposal = pendingOrderActionProposal('order_return');
    returnBtnHtml = returnProposal
      ? '<span class="order-action-pending-wrap">'+editProposalPendingHtml(returnProposal)+'</span>'
      : '<button type="button" class="btn btn-sm btn-ghost" id="modal-return-order-btn">↩️ '+(fieldGated()?'طلب إرجاع الطلبية':'إرجاع الطلبية')+'</button>';
  }
  return deleteBtnHtml + returnBtnHtml;
}

function bindOrderActionButtons(){
  const root = document.getElementById('modal-root');
  const delBtn = root.querySelector('#modal-delete-btn');
  if(delBtn){
    delBtn.addEventListener('click', ()=>{
      if(!hasElevatedAccess()){ requestOrderDelete(); return; }
      const id = draft.id;
      closeModal();
      confirmDelete(id);
    });
  }
  const returnOrderBtn = root.querySelector('#modal-return-order-btn');
  if(returnOrderBtn){
    returnOrderBtn.addEventListener('click', ()=>{
      if(fieldGated()){ requestOrderReturn(); return; }
      confirmReturnWholeOrder();
    });
  }
}

function refreshOrderActionButtons(){
  const wrap = document.getElementById('order-action-buttons-wrap');
  if(!wrap || !draft) return;
  wrap.innerHTML = orderActionButtonsHtml(draft);
  bindOrderActionButtons();
}

function feeFieldRowHtml(d){
  const feePercentUi = fieldRequestUiHtml('feePercent', null, d.feePercent, '<span class="field-readonly-value num">'+(d.feePercent?d.feePercent:0)+'%</span>');
  const feePercentInputHtml = feePercentUi!=null ? feePercentUi : '<input type="number" min="0" step="0.1" id="order-fee-percent-input" class="num" value="'+escapeHtml(d.feePercent?d.feePercent:'')+'" placeholder="0">';
  const serviceFeePercentUi = fieldRequestUiHtml('serviceFeePercent', null, d.serviceFeePercent, '<span class="field-readonly-value num">'+(d.serviceFeePercent?d.serviceFeePercent:0)+'%</span>');
  const serviceFeePercentInputHtml = serviceFeePercentUi!=null ? serviceFeePercentUi : '<input type="number" min="0" step="0.1" id="order-service-fee-percent-input" class="num" value="'+escapeHtml(d.serviceFeePercent?d.serviceFeePercent:'')+'" placeholder="0">';
  const deliveryFeeUi = fieldRequestUiHtml('deliveryFeeAmount', null, d.deliveryFeeAmount, '<span class="field-readonly-value num">'+fmtMoney(Number(d.deliveryFeeAmount)||0)+'</span>');
  const deliveryFeeInputHtml = deliveryFeeUi!=null ? deliveryFeeUi : '<input type="number" min="0" step="0.5" id="order-delivery-fee-input" class="num" value="'+escapeHtml(d.deliveryFeeAmount?d.deliveryFeeAmount:'')+'" placeholder="0">';

  const feeEnabledUi = fieldRequestUiHtml('feeEnabled', null, d.feeEnabled, '<span class="field-readonly-value">'+(d.feeEnabled?'✓ مفعّلة':'غير مفعّلة')+'</span>');
  const feeToggleHtml = feeEnabledUi!=null ? feeEnabledUi : '<input type="checkbox" id="order-fee-toggle" '+(d.feeEnabled?'checked':'')+'>';
  const serviceFeeEnabledUi = fieldRequestUiHtml('serviceFeeEnabled', null, d.serviceFeeEnabled, '<span class="field-readonly-value">'+(d.serviceFeeEnabled?'✓ مفعّلة':'غير مفعّلة')+'</span>');
  const serviceFeeToggleHtml = serviceFeeEnabledUi!=null ? serviceFeeEnabledUi : '<input type="checkbox" id="order-service-fee-toggle" '+(d.serviceFeeEnabled?'checked':'')+'>';
  const deliveryFeeEnabledUi = fieldRequestUiHtml('deliveryFeeEnabled', null, d.deliveryFeeEnabled, '<span class="field-readonly-value">'+(d.deliveryFeeEnabled?'✓ مفعّلة':'غير مفعّلة')+'</span>');
  const deliveryFeeToggleHtml = deliveryFeeEnabledUi!=null ? deliveryFeeEnabledUi : '<input type="checkbox" id="order-delivery-fee-toggle" '+(d.deliveryFeeEnabled?'checked':'')+'>';

  return '<div id="order-fee-fields-wrap">' +
    '<label class="toggle-row">'+feeToggleHtml+'<span>احتساب نسبة رسوم خدمة وتوصيل</span></label>' +
    '<div class="fee-percent-row" id="order-fee-percent-row" style="'+(d.feeEnabled?'':'display:none;')+'"><span>النسبة</span>'+feePercentInputHtml+'<span>%</span><span class="fee-amount-preview" id="fee-amount-preview"></span></div>' +

function bindFeeFieldEvents(){
  const root = document.getElementById('modal-root');
  const feeToggle = root.querySelector('#order-fee-toggle');
  if(feeToggle) feeToggle.addEventListener('change', (e)=>{
    draft.feeEnabled = e.target.checked;
    const row = document.getElementById('order-fee-percent-row');
    if(row) row.style.display = e.target.checked ? '' : 'none';
    const amountRow = document.getElementById('order-fee-amount-row');
    if(amountRow) amountRow.style.display = e.target.checked ? '' : 'none';
    updateModalTotals();
  });
  const feePercentInput = root.querySelector('#order-fee-percent-input');
  if(feePercentInput) feePercentInput.addEventListener('input', (e)=>{
    draft.feePercent = e.target.value===''? 0 : Math.max(0, Number(e.target.value)||0);
    updateModalTotals();
  });
  const feeAmountInput = root.querySelector('#order-fee-amount-input');
  if(feeAmountInput) feeAmountInput.addEventListener('input', (e)=>{
    const amount = e.target.value===''? 0 : Math.max(0, Number(e.target.value)||0);
    const partsSellTotal = orderTotals(draft).partsSellTotal;
    draft.feePercent = partsSellTotal>0 ? round2(amount / partsSellTotal * 100) : 0;
    const percentInput = document.getElementById('order-fee-percent-input');
    if(percentInput) percentInput.value = draft.feePercent || '';
    updateModalTotals();
  });
  const serviceFeeToggle = root.querySelector('#order-service-fee-toggle');
  if(serviceFeeToggle) serviceFeeToggle.addEventListener('change', (e)=>{
    draft.serviceFeeEnabled = e.target.checked;
    const row = document.getElementById('order-service-fee-percent-row');
    if(row) row.style.display = e.target.checked ? '' : 'none';
    const amountRow = document.getElementById('order-service-fee-amount-row');
    if(amountRow) amountRow.style.display = e.target.checked ? '' : 'none';
    updateModalTotals();
  });
  const serviceFeePercentInput = root.querySelector('#order-service-fee-percent-input');
  if(serviceFeePercentInput) serviceFeePercentInput.addEventListener('input', (e)=>{
    draft.serviceFeePercent = e.target.value===''? 0 : Math.max(0, Number(e.target.value)||0);
    updateModalTotals();
  });
  const serviceFeeAmountInput = root.querySelector('#order-service-fee-amount-input');
  if(serviceFeeAmountInput) serviceFeeAmountInput.addEventListener('input', (e)=>{
    const amount = e.target.value===''? 0 : Math.max(0, Number(e.target.value)||0);
    const partsSellTotal = orderTotals(draft).partsSellTotal;
    // النسبة يلي المبلغ هذا يعادلها من سعر القطع — لو ما فيه سعر بعد ما نقدر نحسب نسبة
    draft.serviceFeePercent = partsSellTotal>0 ? round2(amount / partsSellTotal * 100) : 0;
    const percentInput = document.getElementById('order-service-fee-percent-input');
    if(percentInput) percentInput.value = draft.serviceFeePercent || '';
    updateModalTotals();
  });
  const deliveryFeeToggle = root.querySelector('#order-delivery-fee-toggle');
  if(deliveryFeeToggle) deliveryFeeToggle.addEventListener('change', (e)=>{
    draft.deliveryFeeEnabled = e.target.checked;
    const row = document.getElementById('order-delivery-fee-row');
    if(row) row.style.display = e.target.checked ? '' : 'none';
    updateModalTotals();
  });
  const deliveryFeeInput = root.querySelector('#order-delivery-fee-input');
  if(deliveryFeeInput) deliveryFeeInput.addEventListener('input', (e)=>{
    draft.deliveryFeeAmount = e.target.value===''? 0 : Math.max(0, Number(e.target.value)||0);
    updateModalTotals();
  });
}

function refreshFeeFieldsBlock(){
  const wrap = document.getElementById('order-fee-fields-wrap');
  if(!wrap || !draft) return;
  wrap.outerHTML = feeFieldRowHtml(draft);
  bindFeeFieldEvents();
  updateModalTotals();
}

function partRowHtml(p, i){

  const sellVal = (p.sellPrice===''||p.sellPrice==null) ? '' : p.sellPrice;
  const qtyVal = (p.qty===''||p.qty==null) ? 1 : p.qty;
  const selectionOn = !!(typeof draft !== 'undefined' && draft && draft.partsSelectionEnabled);
  const included = p.included !== false;

  if(p.returned){
    const statusLabel = p.returnHasReceivable
      ? (p.returnCollected ? '✅ مرتجعة — تم تحصيل المبلغ من المورد' : '🔄 مرتجعة — بانتظار تحصيل المبلغ من المورد')

    // "تم الرد" يتيمة — يعني فلوس طلعت من الصندوق بلا أثر. نقفل التراجع بهالحالة.
    const refundDone = !!p.customerRefundConfirmed;

function openModal(mode, orderId){
  selectedPartType = null;
  editingPayments = {};
  pendingScrapyardCancellations = new Set();
  pendingEditProposalsCancellation = false;
  pendingPartProposalPurges = new Set();
  editRequestMode = false;
  composingProposalFields = new Set();
  pendingPaymentAddDrafts = {};
  if(mode==='create'){
    draft = {
      id: uid('ord'),
      orderNumber: nextOrderNumber(),
      orderLabel: '',
      parts: [],
      partsSelectionEnabled:false,
      paidToAmer:false,
      paidToSupplier:false,
      supplied:false,
      customerPhone:'',
      customerId: null,
      customerPayments:[],
      confirmed:false,
      feeEnabled:false,
      feePercent:0,
      serviceFeeEnabled:false,
      serviceFeePercent:0,
      deliveryFeeEnabled:false,
      deliveryFeeAmount:0,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      isNew:true
    };
  } else {
    const found = appData.orders.find(o=>o.id===orderId);
    if(!found){ showToast('هذه الطلبية غير موجودة (يمكن انحذفت)', 'error'); return; }
    draft = JSON.parse(JSON.stringify(found));
    draft.isNew = false;
  }
  // نسخة updatedAt وقت الفتح — لو تغيّرت بقاعدة البيانات قبل ما نحفظ (مثلاً عامر تم قبول اقتراح
  // تسعير له بهاي الطلبية بالمنتصف)، draft يضل نسخة منفصلة ما بتعرف بالتحديث، وحفظها بيلغي التحديث
  // بصمت. draftOpenedAtUpdatedAt بيخلينا نكتشف هالتعارض وقت الحفظ بدل ما نتجاهله.
  draftOpenedAtUpdatedAt = draft.updatedAt || null;
  const root = document.getElementById('modal-root');
  root.innerHTML = modalHtml(draft);
  root.classList.add('modal-open');
  attachModalHandlers();
  updateModalTotals();
  document.addEventListener('keydown', escListener);
  const firstInput = root.querySelector('.order-number-input');
  if(firstInput) firstInput.focus();
}

function closeModal(){
  const root = document.getElementById('modal-root');
  root.innerHTML='';
  root.classList.remove('modal-open');
  draft=null;
  pendingScrapyardCancellations.clear(); // إلغاء بدون حفظ = تصنيف القطع ما تغيّر فعليًا، ما فيه داعي نلغي أي اقتراح
  pendingEditProposalsCancellation = false;
  pendingPartProposalPurges.clear(); // نفس المبدأ — الحذف/الإرجاع المباشر ما صار فعليًا بدون حفظ
  document.removeEventListener('keydown', escListener);
}

function escListener(e){ if(e.key==='Escape') closeModal(); }

/* بعد أي await جوا onSaveOrder، النافذة ممكن تكون انسكّرت (✕/Esc/برّا) أو تحوّلت لطلبية تانية —
   draft صار null أو صار يشاور على غيرها. نفس مبدأ quoteModalStillOpen بالضبط. */
function orderModalStillOpen(draftId){
  return !!draft && draft.id === draftId;
}

/* تعطيل الزر أثناء طلب شبكة قيد التنفيذ — يمنع ضغطة/نقرة مزدوجة سريعة (شائعة عالجوال) من إرسال
   نفس عملية الحفظ/الاعتماد مرتين بالتوازي (بتنتج INSERT مكرر بنفس الـid ورسالة خطأ مضلّلة "رقم
   الطلبية صار مستخدم" رغم إن الحفظ الأول نجح فعليًا). نفس نمط disabled=true الموجود أصلًا بأزرار
   إضافة العميل/المورد/تشليح — بس معمّم كـhelper واحد بدل تكراره بكل مكان. */
function bindBusyButton(btn, handler){
  if(!btn) return;
  btn.addEventListener('click', async ()=>{
    if(btn.disabled) return;
    btn.disabled = true;
    try{ await handler(); }
    finally{ btn.disabled = false; }
  });
}

/* حقول التعديل المباشر (بدون زر حفظ مخصص، على تغيير الحقل) بشاشتي الموردين/العملاء كانت تحفظ
   وتنسى نتيجة الحفظ — لو فشل (شبكة/RLS)، القيمة الجديدة تبقى ظاهرة بالواجهة وكأنها انحفظت لحد
   ما إعادة تحميل أو تحديث لحظي يمحيها بصمت تام. نفس درس محرر مصاريف الصندوق (persistTreasuryEntry
   + Object.assign(liveEntry, prev)) بس معمّم كـhelper واحد يستخدمه الموردين والعملاء سوا. */
async function persistFieldOrRevert(obj, prevSnapshot, persistFn, refreshFn){
  const saved = await persistFn(obj);
  if(!saved){ Object.assign(obj, prevSnapshot); refreshFn(); }
  return saved;
}

/* ---------- إعلان للموظفين — إعلانان منفصلان (sales/purchasing)، كل واحد بصفه الثابت بجدول
   announcement، يكتبهم مخوّل. #announcement-banner عنصر ثابت بـ#app-root (يعرض إعلان sales) ما
   بينلمس من أي إعادة رسم تانية فتحديثه مباشر وآمن؛ شاشتا عامر (renderScrapyardHomeView/
   renderScrapyardView) بيرسمان كامل من الصفر كل مرة (تعرضان إعلان purchasing)، فبنحط نفس الـHtml
   جوا القالب مباشرة هناك. */
let announcementTexts = { sales: null, purchasing: null };
let announcementSenders = { sales: null, purchasing: null };
let announcementChannel = null;

function announcementBannerHtml(audience){
  const text = announcementTexts[audience];
  if(!text) return '';
  return '<div class="announcement-banner">'+escapeHtml(text)+'</div>';
}

function renderAnnouncementBanner(){
  const el = document.getElementById('announcement-banner');
  if(el) el.innerHTML = announcementBannerHtml('sales');
}

function refreshScrapyardAnnouncementIfVisible(){
  const scrapRoot = document.getElementById('scrapyard-root');
  if(!scrapRoot || scrapRoot.style.display === 'none') return;
  if(scrapyardCurrentScreen === 'home') renderScrapyardHomeView();
  else if(scrapyardCurrentScreen === 'settlement') renderScrapyardView();
}

async function loadAnnouncement(){
  try{
    if(!sb) return;
    const { data, error } = await sb.from('announcement').select('id, text, updated_by');
    if(error) throw error;
    (data||[]).forEach(row=>{
      if(row.id!=='sales' && row.id!=='purchasing') return;
      announcementTexts[row.id] = row.text || null;
      announcementSenders[row.id] = row.updated_by || null;
    });
  }catch(e){ console.error('loadAnnouncement:', e); }
  renderAnnouncementBanner();
  refreshScrapyardAnnouncementIfVisible();
}

function subscribeAnnouncementRealtime(){
  if(!sb || announcementChannel) return;
  announcementChannel = sb.channel('announcement-changes')
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'announcement' }, (payload)=>{
      const row = payload.new;
      if(!row || (row.id!=='sales' && row.id!=='purchasing')) return;
      announcementTexts[row.id] = row.text || null;
      announcementSenders[row.id] = row.updated_by || null;
      renderAnnouncementBanner();
      refreshScrapyardAnnouncementIfVisible();
    })
    .subscribe();
}

// حفظ مستقل لكل إعلان (مبيعات/مشتريات) — كانا سابقًا يُحفظان معًا بزر واحد، وكان هذا يسبب
// إشعار جمهور "المبيعات" حتى لو المُعدَّل الوحيد كان نص "المشتريات" (وبالعكس)، لأن الحفظ
// المشترك كان يعيد إرسال إشعار announcement_posted لأي حقل نصه غير فاضي، بغض النظر هل تغيّر
// فعليًا أو كان محتوى قديم بالحقل التاني لم يُلمس. الآن كل حقل له DB update + إشعار مستقلين
// تمامًا، ويُشعر بس لو نصه هو نفسه تغيّر عن القيمة المحمّلة أصلًا.
async function saveAnnouncementField(audience, audienceRole, newText, saved){
  const now = new Date().toISOString();
  const changed = (announcementTexts[audience]||'') !== newText;
  const { error } = await sb.from('announcement').update({ text: newText || null, updated_by: presenceEmail, updated_at: now }).eq('id', audience);
  if(error){ showToast('تعذر حفظ الإعلان', 'error'); return; }
  announcementTexts[audience] = newText || null;
  announcementSenders[audience] = presenceEmail;
  renderAnnouncementBanner();
  refreshScrapyardAnnouncementIfVisible();
  saved();
  showToast('تم الحفظ', 'ok');
  // إشعار "إعلان جديد" بس لو النص نفسه تغيّر ومش فاضي — بأفضل مجهود، ما بيوقف نجاح الحفظ نفسه
  // لو فشل الإدراج. بدون ذكر اسم المُعلن (نفس مبدأ البانر).
  if(changed && newText){
    try{
      await sb.from('activity_events').insert({
        kind: 'announcement_posted', audience_role: audienceRole, actor_email: presenceEmail,
        message: '📢 إعلان جديد: '+newText
      });
    }catch(e){ console.error('logAnnouncementPosted:', e); }
  }
}

function bindPartRowEvents(){
  const root = document.getElementById('modal-root');
  root.querySelectorAll('.part-row').forEach(row=>{
    const pid = row.getAttribute('data-part-id');
    const part = draft.parts.find(p=>p.id===pid);
    if(!part) return;
    const includeCheck = row.querySelector('.part-include-check');
    if(includeCheck){
      includeCheck.addEventListener('change', e=>{
        // الاستبعاد (تحويل included من true إلى false) بس يلي بيأثر على الحسابات — لازم طلب
        // بعد التوريد لغير المخوّل. إعادة التحديد (false إلى true) بتزيد المستحق، تضل حرة.
        if(!e.target.checked && fieldGated()){
          e.target.checked = true;
          requestPartExclude(part);
          return;
        }
        part.included = e.target.checked;
        refreshPartsList();
      });
    }
    const descInput = row.querySelector('.part-desc-input');
    if(descInput) descInput.addEventListener('input', e=>{ part.description = e.target.value; });
    const qtyInput = row.querySelector('.part-qty-input');
    if(qtyInput){
      qtyInput.addEventListener('input', e=>{
        part.qty = e.target.value===''? 1 : Math.max(1, Number(e.target.value)||1);
        updateModalTotals();
      });
    }
    const costInput = row.querySelector('.part-cost-input');
    if(costInput){
      costInput.addEventListener('input', e=>{
        part.costPrice = e.target.value===''? '' : Math.max(0, Number(e.target.value)||0);
        updateModalTotals();
      });
    }
    const sellInput = row.querySelector('.part-sell-input');
    if(sellInput){
      sellInput.addEventListener('input', e=>{
        part.sellPrice = e.target.value===''? null : Math.max(0, Number(e.target.value)||0);
        updateModalTotals();
      });
    }
    const supplierSelectEl = row.querySelector('.part-supplier-select');
    const supplierSelectWrap = supplierSelectEl ? supplierSelectEl.closest('.searchable-select') : null;
    if(supplierSelectWrap){
      bindSearchableSelect(supplierSelectWrap,
        ()=> (appData.suppliers||[]).filter(s=> part.used ? s.handlesUsed : s.handlesNew).map(s=>({id:s.id, label:s.name||s.phone||'مورد', sublabel:s.phone})),
        (id)=>{ part.supplierId = id || null; }
      );
    }
    const actionsBtn = row.querySelector('[data-part-actions]');
    if(actionsBtn){
      actionsBtn.addEventListener('click', ()=> openPartActionChoice(part));
    }
    const toggleUsedBtn = row.querySelector('[data-toggle-used]');
    if(toggleUsedBtn){
      toggleUsedBtn.addEventListener('click', ()=>{
        const willBeUsed = !part.used;
        confirmAction({
          title: willBeUsed ? 'تغيير القطعة إلى مستعملة؟' : 'تغيير القطعة إلى غير مستعملة؟',
          message: part.description ? 'القطعة: '+part.description : undefined,
          confirmLabel: 'تأكيد التغيير',
          onConfirm: async ()=>{
            part.used = willBeUsed;
            part.supplierId = null; // المورد المرتبط كان لتصنيف مختلف (مستعمل/جديد) — لازم يُختار مورد جديد يطابق التصنيف الجديد
            refreshPartsList();
            pendingScrapyardCancellations.add(part.id); // يُنفَّذ فعليًا بس عند حفظ الطلبية — انظر الملاحظة أعلى تعريف المجموعة
          }
        });
      });
    }
    const undoReturnBtn = row.querySelector('[data-undo-return-part]');
    if(undoReturnBtn){
      undoReturnBtn.addEventListener('click', ()=>{
        confirmAction({
          title: 'التراجع عن إرجاع هذه القطعة؟',
          message: 'رح ترجع القطعة لحساب الطلبية بشكل طبيعي.',
          confirmLabel: 'تراجع',
          onConfirm: ()=>{
            if(part.customerRefundConfirmed){ // حماية إضافية لو وصل تأكيد الرد بين الرسم والضغط
              showToast('ما ينفع التراجع — المبلغ انرد للزبون فعلًا', 'error');
              return;
            }
            delete part.returned;
            delete part.returnHasReceivable;
            delete part.returnCollected;
            delete part.customerRefundConfirmed; // ما نخلي علامة يتيمة بعد إلغاء الإرجاع
            draft.customerPayments = (draft.customerPayments||[]).filter(p=>!(p.returnAdjustment && p.linkedPartId===pid));
            refreshPartsList();
            refreshPaymentsList();
          }
        });
      });
    }
  });
}

/* زر "إرجاع الطلبية" جنب "حذف الطلبية" — يرجع كل القطع النشطة بالطلبية دفعة وحدة */
function confirmReturnWholeOrder(){
  const activeParts = orderActiveParts(draft).filter(p=>!p.returned);
  if(!activeParts.length){
    showToast('لا يوجد قطع قابلة للإرجاع بهذه الطلبية', 'error');
    return;
  }
  const missingSupplier = activeParts.some(p=>{
    const hasReceivable = p.used ? draft.paidToAmer : draft.paidToSupplier;
    return hasReceivable && !p.supplierId;
  });
  if(missingSupplier){
    showToast('حدد المورد لكل قطعة مدفوعة مسبقًا قبل تأكيد الإرجاع', 'error');
    return;
  }
  const t = orderTotals(draft);
  const shareAmount = round2(t.feeAmount + t.serviceFeeAmount + t.deliveryFeeAmount);
  if(shareAmount > 0.01){
    openReturnFeeChoiceModal(shareAmount, true, (keepFee)=> proceedReturnWholeOrder(activeParts, keepFee));
  } else {
    proceedReturnWholeOrder(activeParts, false);
  }
}

function proceedReturnWholeOrder(activeParts, keepFee){
  const anyPaid = activeParts.some(p=> p.used ? draft.paidToAmer : draft.paidToSupplier);
  confirmAction({
    title: 'تأكيد إرجاع الطلبية بالكامل ('+activeParts.length+' قطعة)؟',
    message: anyPaid
      ? 'بعض القطع مدفوعة مسبقًا — مبلغها رح يظهر كمسترجع بانتظار التحصيل بشاشة الموردين، وينخصم من دفعة الزبون تلقائيًا.'
      : 'رح تُستبعد كل قطع الطلبية من حساباتها مباشرة.',
    confirmLabel: 'تأكيد إرجاع الطلبية',
    dangerous: true,
    onConfirm: ()=>{
      if(keepFee){
        const t = orderTotals(draft);
        draft.returnKeptFeeAmount = round2((draft.returnKeptFeeAmount||0) + t.feeAmount);
        draft.returnKeptServiceFeeAmount = round2((draft.returnKeptServiceFeeAmount||0) + t.serviceFeeAmount);
        draft.returnKeptDeliveryAmount = round2((draft.returnKeptDeliveryAmount||0) + t.deliveryFeeAmount);
      }
      activeParts.forEach(p=>{ applyPartReturn(p); pendingPartProposalPurges.add(p.id); });
      refreshPartsList();
      refreshPaymentsList();
    }
  });
}

/* زر "⋯" بجانب كل قطعة — يعرض خيار حذف القطعة أو إرجاعها لوحدها */
function openPartActionChoice(part){
  const root = document.getElementById('confirm-root');
  // نفس ملاحظة زر "↩️ إرجاع الطلبية" — إرجاع قطعة معناه استُلمت (من مورد/تشليح) وبعدين رجعت،
  // قبل "تم التوريد" ما فيه شي استُلم بعد
  const canReturn = !!(draft && draft.supplied);
  const gated = fieldGated();
  const pendingDelete = pendingPartActionProposal('part_delete', part.id);
  const pendingReturn = pendingPartActionProposal('part_return', part.id);
  const pendingExclude = pendingPartActionProposal('part_exclude', part.id);
  const anyPending = pendingDelete || pendingReturn || pendingExclude;
  root.innerHTML =
    '<div class="modal-backdrop" data-close-confirm>' +
      '<div class="modal-card modal-card-sm" role="alertdialog" aria-modal="true">' +
        '<div class="modal-title">'+escapeHtml(part.description||'القطعة')+'</div>' +
        '<p class="modal-sub">اختر الإجراء المطلوب لهذه القطعة</p>' +
        (anyPending ? '<div class="part-action-pending-wrap">'+editProposalPendingHtml(anyPending)+'</div>' : '') +
        '<div class="modal-footer-actions" style="margin-top:16px;justify-content:flex-end;flex-wrap:wrap;">' +
          '<button type="button" class="btn btn-ghost" id="part-action-cancel-btn">إلغاء</button>' +
          (canReturn && !anyPending ? '<button type="button" class="btn btn-ghost" id="part-action-return-btn">🔄 '+(gated?'طلب إرجاع':'إرجاع')+'</button>' : '') +
          (!anyPending ? '<button type="button" class="btn btn-danger" id="part-action-delete-btn">🗑️ '+(gated?'طلب حذف':'حذف')+'</button>' : '') +
        '</div>' +
      '</div>' +
    '</div>';
  root.classList.add('modal-open');
  const close = ()=>{ root.innerHTML=''; root.classList.remove('modal-open'); };
  root.querySelector('[data-close-confirm]').addEventListener('click', e=>{
    if(e.target.hasAttribute('data-close-confirm')) close();
  });
  root.querySelector('#part-action-cancel-btn').addEventListener('click', close);
  // هالنافذة برّا #modal-root — التفويض العام bindEditProposalGlobalDelegation ما بيغطّيها،
  // فلازم نربط أزرار القبول/الرفض/السحب هون محليًا لو في طلب معلّق ظاهر
  const acceptBtn = root.querySelector('[data-accept-proposal]');
  if(acceptBtn) acceptBtn.addEventListener('click', ()=>{ close(); handleEditProposalDecision(acceptBtn.getAttribute('data-accept-proposal'), true); });
  const rejectBtn = root.querySelector('[data-reject-proposal]');
  if(rejectBtn) rejectBtn.addEventListener('click', ()=>{ close(); handleEditProposalDecision(rejectBtn.getAttribute('data-reject-proposal'), false); });
  const withdrawBtn = root.querySelector('[data-withdraw-proposal]');
  if(withdrawBtn) withdrawBtn.addEventListener('click', ()=>{ close(); withdrawEditProposal(withdrawBtn.getAttribute('data-withdraw-proposal')); });
  const deleteBtn = root.querySelector('#part-action-delete-btn');
  if(deleteBtn){
    deleteBtn.addEventListener('click', ()=>{
      close();
      if(gated){ requestPartDelete(part); return; }
      confirmAction({
        title: 'حذف هذه القطعة؟',
        message: part.description ? 'القطعة: '+part.description : undefined,
        confirmLabel: 'تأكيد الحذف',
        dangerous: true,
        onConfirm: ()=>{
          draft.parts = draft.parts.filter(p=>p.id!==part.id);
          pendingPartProposalPurges.add(part.id);
          refreshPartsList();
        }
      });

  }
  const returnBtn = root.querySelector('#part-action-return-btn');
  if(returnBtn){
    returnBtn.addEventListener('click', ()=>{
      close();
      if(gated){ requestPartReturn(part); return; }
      confirmSinglePartReturn(part);
    });

function confirmSinglePartReturn(part){
  const hasReceivable = part.used ? draft.paidToAmer : draft.paidToSupplier;
  if(hasReceivable && !part.supplierId){
    showToast('حدد المورد لهذه القطعة قبل تأكيد الإرجاع', 'error');
    return;
  }
  const s = computeReturnFeeShare(draft, part);
  const shareAmount = round2(s.feeShare + s.serviceFeeShare);
  if(shareAmount > 0.01){
    openReturnFeeChoiceModal(shareAmount, false, (keepFee)=> proceedSinglePartReturn(part, hasReceivable, keepFee));
  } else {
    proceedSinglePartReturn(part, hasReceivable, false);
  }
}

function proceedSinglePartReturn(part, hasReceivable, keepFee){
  confirmAction({
    title: 'تأكيد إرجاع هذه القطعة؟',
    message: hasReceivable
      ? 'القطعة مدفوعة مسبقًا — مبلغها رح يظهر كمسترجع بانتظار التحصيل بشاشة الموردين، وينخصم من دفعة الزبون تلقائيًا.'
      : 'رح تُستبعد من حسابات الطلبية مباشرة.',
    confirmLabel: 'تأكيد الإرجاع',
    dangerous: true,
    onConfirm: ()=>{
      if(keepFee){
        const s = computeReturnFeeShare(draft, part);
        draft.returnKeptFeeAmount = round2((draft.returnKeptFeeAmount||0) + s.feeShare);
        draft.returnKeptServiceFeeAmount = round2((draft.returnKeptServiceFeeAmount||0) + s.serviceFeeShare);
      }
      applyPartReturn(part);
      pendingPartProposalPurges.add(part.id);
      refreshPartsList();
      refreshPaymentsList();
    }
  });
}

/* تطبيق إرجاع قطعة وحدة على أي طلبية (order) — عام، يشتغل على draft المفتوح أو على أي صف من
   appData.orders (لازم لتطبيق طلب إرجاع مقبول عبر edit_proposals على الطلبية بقاعدة البيانات،
   مو بس على draft المفتوح). تعليمها كمرتجعة، وإذا كان الزبون دفع أكثر من المطلوب بعد استبعادها
   (يعني كان دفع ثمنها ضمن دفعاته) نضيف تلقائيًا دفعة "مرتجع" سالبة الأثر تعادل الفرق،
   لحد ما يُحصّل مبلغها من المورد (عندها تُلغى تلقائيًا وترجع للحسابات — orderTotals يتكفّل بهيك). */
/* حصة قطعة معيّنة من نسبة الخدمة/الخدمات المضافة حاليًا على الطلبية — نسبيًا حسب سعر بيعها من
   مجموع سعر بيع كل القطع النشطة، قبل ما تُعلّم القطعة كمرتجعة (partsSellTotal بعدها بيهبط). */
function computeReturnFeeShare(order, part){
  const t = orderTotals(order);
  const sellAmount = (part.sellPrice!==null && part.sellPrice!==undefined && part.sellPrice!=='') ? (Number(part.qty)||1)*Number(part.sellPrice) : 0;
  if(sellAmount<=0 || t.partsSellTotal<=0) return { feeShare:0, serviceFeeShare:0 };
  const ratio = sellAmount / t.partsSellTotal;
  return { feeShare: round2(t.feeAmount*ratio), serviceFeeShare: round2(t.serviceFeeAmount*ratio) };
}

/* تخيير: يسترجع الزبون النسبة المضافة (وأجور التوصيل لو إرجاع طلبية كاملة) مع القطعة/الطلبية
   المرتجعة، أو تحتفظ الطلبية فيها؟ عند "الاحتفاظ"، المبلغ يتجمّد فورًا (order.returnKept*) ويضل
   مضافًا دائمًا (orderTotals)، حتى لو رجعت قطع تانية بعدين أو تغيّرت أسعار البيع. */
function openReturnFeeChoiceModal(shareAmount, includesDelivery, onChoice){
  const root = document.getElementById('confirm-root');
  const title = includesDelivery ? 'استرجاع النسبة المضافة والتوصيل مع الطلبية؟' : 'استرجاع النسبة المضافة مع هذه القطعة؟';
  const msg = 'المبلغ المرتبط: '+fmtMoney(shareAmount)+' ريال'+(includesDelivery ? ' (نسبة الخدمة/الخدمات + أجور التوصيل)' : ' (حصة هذه القطعة من نسبة الخدمة/الخدمات)')+'. يسترجعه الزبون مع الإرجاع، أو تحتفظ فيه الطلبية؟';
  root.innerHTML =
    '<div class="modal-backdrop" data-close-confirm>' +
      '<div class="modal-card modal-card-sm" role="alertdialog" aria-modal="true">' +
        '<div class="modal-title">'+escapeHtml(title)+'</div>' +
        '<p class="modal-sub">'+escapeHtml(msg)+'</p>' +
        '<div class="modal-footer-actions" style="margin-top:16px;justify-content:flex-end;flex-wrap:wrap;">' +
          '<button type="button" class="btn btn-ghost" id="fee-choice-cancel-btn">إلغاء</button>' +
          '<button type="button" class="btn btn-ghost" id="fee-choice-keep-btn">الاحتفاظ بها</button>' +
          '<button type="button" class="btn btn-primary" id="fee-choice-refund-btn">استرجاعها للزبون</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  root.classList.add('modal-open');
  const close = ()=>{ root.innerHTML=''; root.classList.remove('modal-open'); };
  root.querySelector('[data-close-confirm]').addEventListener('click', e=>{
    if(e.target.hasAttribute('data-close-confirm')) close();
  });
  root.querySelector('#fee-choice-cancel-btn').addEventListener('click', close);
  root.querySelector('#fee-choice-keep-btn').addEventListener('click', ()=>{ close(); onChoice(true); });
  root.querySelector('#fee-choice-refund-btn').addEventListener('click', ()=>{ close(); onChoice(false); });
}

function applyPartReturnOnOrder(order, part){
  const hasReceivable = part.used ? order.paidToAmer : order.paidToSupplier;
  part.returned = true;
  part.returnHasReceivable = hasReceivable;
  part.returnCollected = false;

  const sellAmount = (part.sellPrice!==null && part.sellPrice!==undefined && part.sellPrice!=='') ? (Number(part.qty)||1)*Number(part.sellPrice) : 0;

  // كان في `if(sellAmount<=0) return;` هون — يعني إرجاع قطعة غير مسعّرة ما بينتج أي استرداد
  // أبدًا، فأي عربون دفعه الزبون على طلبية رجعت قبل التسعير بيضل مسجّل عليه للأبد.
  // الاسترداد الصح مبني على الزيادة الفعلية: لو القطعة مسعّرة نحدّه بقيمتها، وإلا نرجّع الزيادة كلها.
  const t = orderTotals(order);
  // t.sellTotal أصلًا 0 لما hasSell=false بدون مبالغ محتفظ فيها (returnKept*) — فاستخدامه مباشرة
  // بيحافظ على نفس السلوك القديم، وبيمنع كمان اعتبار مبلغ محتفظ فيه "زيادة" ترجع للزبون بالغلط
  const overpay = round2(t.customerPaidAmount - t.sellTotal);
  if(overpay > 0.01){
    const refundAmount = round2(sellAmount > 0 ? Math.min(overpay, sellAmount) : overpay);
    part.customerRefundConfirmed = false; // ما يخصم من الصندوق إلا بعد تأكيد صريح من شاشة العملاء إنه رجع فعليًا
    if(!Array.isArray(order.customerPayments)) order.customerPayments = [];
    order.customerPayments.push({
      id: uid('pay'), amount: refundAmount, method: 'مرتجع', date: todayNumeric(),
      returnAdjustment: true, linkedPartId: part.id
    });
  }
}

function applyPartReturn(part){ applyPartReturnOnOrder(draft, part); }

function bindPaymentRowEvents(){
  const root = document.getElementById('modal-root');
  const elevated = hasElevatedAccess();
  root.querySelectorAll('.payment-row').forEach(row=>{
    const pid = row.getAttribute('data-payment-id');
    const payment = (draft.customerPayments||[]).find(p=>p.id===pid);
    if(!payment) return;
    if(elevated){
      const amountInput = row.querySelector('.payment-amount-input');
      if(amountInput){
        amountInput.addEventListener('input', e=>{
          let val = e.target.value===''? '' : Number(e.target.value);
          if(val !== '' && val < 0) val = 0;
          // أي زيادة عن المبلغ المستحق مقبولة — تظهر "زيادة" بدل "المتبقي عليه" بملخص الدفعات
          payment.amount = val;
          updateModalTotals();
        });
      }
      const methodSelect = row.querySelector('.payment-method-select');
      if(methodSelect) methodSelect.addEventListener('change', e=>{ payment.method = e.target.value; });
      const removeBtn = row.querySelector('[data-remove-payment]');
      if(removeBtn){
        removeBtn.addEventListener('click', ()=>{
          confirmAction({
            title: 'حذف هذه الدفعة؟',
            message: payment.amount ? 'المبلغ: '+fmtMoney(payment.amount) : undefined,
            confirmLabel: 'تأكيد الحذف',
            dangerous: true,
            onConfirm: ()=>{
              draft.customerPayments = draft.customerPayments.filter(p=>p.id!==pid);
              delete editingPayments[pid];
              refreshPaymentsList();
            }
          });
        });
      }
      const editBtn = row.querySelector('.payment-edit-btn');
      if(editBtn){
        editBtn.addEventListener('click', ()=>{
          editingPayments[pid] = true;
          refreshPaymentsList();
        });
      }
      const saveBtn = row.querySelector('.payment-save-btn');
      if(saveBtn){
        saveBtn.addEventListener('click', ()=>{
          if(!payment.method){
            showToast('لازم تحدد طريقة الدفع (كاش/شبكة) أولًا', 'error');
            return;
          }
          delete editingPayments[pid];
          refreshPaymentsList();
        });
      }
    } else {
      const requestEditBtn = row.querySelector('.payment-request-edit-btn');
      if(requestEditBtn){
        requestEditBtn.addEventListener('click', ()=>{
          editingPayments[pid] = true;
          refreshPaymentsList();
        });
      }
      const requestDeleteBtn = row.querySelector('.payment-request-delete-btn');
      if(requestDeleteBtn){
        requestDeleteBtn.addEventListener('click', ()=> requestDeletePayment(pid));
      }
      const sendEditBtn = row.querySelector('.payment-send-edit-request-btn');
      if(sendEditBtn){
        sendEditBtn.addEventListener('click', ()=> sendPaymentEditRequest(pid));
      }
      const cancelEditBtn = row.querySelector('.payment-cancel-edit-btn');
      if(cancelEditBtn){
        cancelEditBtn.addEventListener('click', ()=>{
          delete editingPayments[pid];
          refreshPaymentsList();
        });
      }
    }
  });
  root.querySelectorAll('[data-add-draft-key]').forEach(row=>{
    const key = row.getAttribute('data-add-draft-key');
    const d = pendingPaymentAddDrafts[key];
    if(!d) return;
    const amountInput = row.querySelector('.payment-add-draft-amount-input');
    if(amountInput) amountInput.addEventListener('input', e=>{ d.amount = e.target.value===''?'':Number(e.target.value); });
    const methodSelect = row.querySelector('.payment-add-draft-method-select');
    if(methodSelect) methodSelect.addEventListener('change', e=>{ d.method = e.target.value; });
    const sendBtn = row.querySelector('.payment-send-add-request-btn');
    if(sendBtn) sendBtn.addEventListener('click', ()=> sendPaymentAddRequest(key));
    const cancelBtn = row.querySelector('.payment-cancel-add-btn');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ delete pendingPaymentAddDrafts[key]; refreshPaymentsList(); });
  });
}
