function treasuryCardBreakdownHtml(entry){
  if(!entry) return '';
  const termRowHtml = t=> '<div class="card-breakdown-row"><span>'+escapeHtml(t.label)+'</span><span class="num '+(t.negative?'text-rust':'text-green')+'">'+(t.negative?'-':'+')+fmtMoney(t.amount)+'</span></div>';
  if(Array.isArray(entry)) return entry.map(termRowHtml).join('');
  // شكل كائن: { terms?: [...], note?: '...' } — يسمح بصفوف أرقام + ملاحظة توضيحية تحتهم سوا
  // (بخلاف صيغة { note } لحالها المستخدمة لمؤشرات بدون تفكيك رقمي أصلًا)
  const termsHtml = Array.isArray(entry.terms) ? entry.terms.map(termRowHtml).join('') : '';
  const noteHtml = entry.note ? '<div class="card-breakdown-note">'+escapeHtml(entry.note)+'</div>' : '';

function applyScrapyardProposal(pr){
  const order = appData.orders.find(o=>o.id===pr.order_id);
  if(!order) return false;
  if(pr.action === 'edit'){
    const part = (order.parts||[]).find(p=>p.id===pr.part_id);
    if(!part) return false;
    part.costPrice = Math.max(0, Number(pr.cost_price)||0);
  } else if(pr.action === 'delete'){
    order.parts = (order.parts||[]).filter(p=>p.id!==pr.part_id);
  } else if(pr.action === 'add'){
    order.parts = order.parts || [];
    order.parts.push({ id: uid('p'), description: pr.description||'', qty: Math.max(1, Number(pr.qty)||1), costPrice: Math.max(0, Number(pr.cost_price)||0), sellPrice: null, used: pr.kind === 'used', supplierId: null });
  } else {
    return false;
  }
  order.updatedAt = new Date().toISOString();
  return true;
}

function handleScrapyardProposalDecision(proposalId, accept){
  const pr = scrapyardMgmtState.proposals.find(p=>p.id===proposalId);
  if(!pr) return;
  confirmAction({
    title: accept ? 'قبول هذا الاقتراح؟' : 'رفض هذا الاقتراح؟',
    message: accept ? 'بيتطبّق التعديل مباشرة على حساباتك.' : 'الاقتراح بيُحذف بدون أي تغيير على حساباتك.',
    confirmLabel: accept ? 'قبول وتطبيق' : 'تأكيد الرفض',
    dangerous: !accept,
    onConfirm: async ()=>{
      // الحذف هو "المطالبة" الفعلية بالاقتراح — لو مسؤول تاني قبله/رفضه بنفس اللحظة (مربع
      // التأكيد فاضل مفتوح بالانتظار)، الحذف هون بيتصفّر (0 صفوف)، فنوقف قبل أي تطبيق مزدوج
      // بدل ما نعتمد بس على نسخة pr المحفوظة بالذاكرة وقت فتح المربع (ممكن تكون قديمة).
      const { data: deletedRows, error: delError } = await sb.from('scrapyard_proposals').delete().eq('id', pr.id).select();
      if(delError){ showToast('تعذر تحديث حالة الاقتراح', 'error'); return; }
      if(!deletedRows || !deletedRows.length){
        showToast('هذا الاقتراح انعالج فعلًا من مكان تاني', 'error');
        await loadScrapyardData(scrapyardSharedState.activeKind);
        renderScrapyardView();
        refreshScrapyardPendingCount();
        return;
      }
      // من هون وطالع، الاقتراح انحذف فعليًا. لو فشل التطبيق بعده لازم نرجّعه — غير هيك بيضيع
      // اقتراح عامر نهائيًا ورسالة النجاح بتكذب على المدير.
      const restoreProposal = async ()=>{
        const { error } = await sb.from('scrapyard_proposals').insert(deletedRows[0]);
        if(error) console.error('restoreProposal:', error);
        await loadScrapyardData(scrapyardSharedState.activeKind);
        renderScrapyardView();
        refreshScrapyardPendingCount();
      };
      if(accept){
        // بنطبّق الصف الراجع من الحذف (نسخة قاعدة البيانات لحظة المطالبة) مش نسخة pr المخزّنة
        // بالذاكرة وقت فتح المربع — الذاكرة ممكن تكون قديمة (عامر عدّل اقتراحه بالوقت الفاصل).
        const claimed = deletedRows[0];
        const order = appData.orders.find(o=>o.id===claimed.order_id);
        const partsSnapshot = order ? JSON.parse(JSON.stringify(order.parts||[])) : null;
        const prevUpdatedAt = order ? order.updatedAt : null;
        const applied = applyScrapyardProposal(claimed);
        if(!applied){
          showToast('تعذر تطبيق الاقتراح — الطلبية أو القطعة غير موجودة. رجّعنا الاقتراح مكانه', 'error');
          await restoreProposal();
          return;
        }
        const saved = await persistOrder(order);
        if(!saved){
          if(partsSnapshot){ order.parts = partsSnapshot; order.updatedAt = prevUpdatedAt; }
          showToast('تعذر حفظ التعديل على الطلبية — رجّعنا الاقتراح مكانه، جرّب مرة تانية', 'error');
          await restoreProposal();
          return;
        }
        renderKPIs();
        renderTable();
      }
      showToast(accept ? 'تم القبول والتطبيق' : 'تم رفض الاقتراح', 'ok');
      await loadScrapyardData(scrapyardSharedState.activeKind);
      renderScrapyardView();
      refreshScrapyardPendingCount();
    }
  });
}

let scrapyardProposalsChannel = null;
async function refreshScrapyardPendingCount(){
  // كانت مقصورة على المخوّلين — بس مهاب طلب صراحة إشعار "أي شيء يحتاج انتباه" يظهر عند الجميع.
  // القبول/الرفض الفعلي بشاشة التسوية يضل مقصور على المخوّلين لحاله (RLS دور 'full' أصلًا بيسمح
  // لأي موظف كامل يشوف الاقتراحات المعلّقة، مو بس المخوّلين الثلاثة)

    const { data, error } = await sb.from('scrapyard_proposals').select('*').order('created_at', {ascending:false});

   فكان تغيير أي طرف ما بيوصل للطرف التاني لحظيًا، لازم تحديث يدوي */
function subscribeScrapyardRealtime(){
  if(!sb || scrapyardProposalsChannel) return;
  scrapyardProposalsChannel = sb.channel('scrapyard-proposals-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'scrapyard_proposals' }, ()=>{
      refreshScrapyardPendingCount();
      if(document.getElementById('scrapyard-root').style.display !== 'none' && scrapyardCurrentScreen === 'settlement'){
        if(!scrapyardHasOpenEdit()) loadScrapyardData(scrapyardSharedState.activeKind).then(renderScrapyardView);
      }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'scrapyard_order_confirmations' }, ()=>{
      if(document.getElementById('scrapyard-root').style.display !== 'none' && scrapyardCurrentScreen === 'settlement'){
        if(!scrapyardHasOpenEdit()) loadScrapyardData(scrapyardSharedState.activeKind).then(renderScrapyardView);
      }
    })
    .subscribe();
}

/* ---------- edit_proposals: نظام موحّد لطلبات تعديل الطلبية بعد "تم التوريد" ----------
   يغطي: سعر الشراء/البيع/اسم القطعة (part_field)، نسب الرسوم على مستوى الطلبية (order_field)،
   وإضافة/تعديل/حذف دفعات الزبون (payment_add/payment_edit/payment_delete). أي مستخدم غير مخوّل
   (مو مهاب/همام/بشار) بعد ما تصير الطلبية "تم التوريد" ما يقدر يعدّل هالحقول مباشرة — بس يقدر
   يرسل طلب يظهر لصاحب الحساب جنب الحقل نفسه بزر قبول/رفض. مبني بنفس مبدأ scrapyard_proposals
   فوق (claim-via-delete + استرجاع لو فشل التطبيق) — نفس منطق السباق بالضبط. */
let editRequestMode = false; // يُصفّر كل ما تُفتح نافذة الطلبية من جديد
let composingProposalFields = new Set(); // مفاتيح الحقول يلي المستخدم فاتح لها صندوق كتابة طلب حاليًا
let editProposals = []; // كاش محلي لكل الطلبات المعلّقة (كل المستخدمين المسموحين يشوفوها — نفس درس sell_price_proposals)
let editProposalsChannel = null;
let editProposalSending = new Set();
let editProposalsModalOpen = false;

function composeKey(fieldKey, partId){ return (partId||'order') + '::' + fieldKey; }

/* بعد "تم التوريد"، غير المخوّلين ما يقدروا يعدّلوا مباشرة — لازم طلب. المخوّلين وغير الطلبيات
   الموردة يضلوا بنفس السلوك القديم (تعديل حر). */
function fieldGated(){ return !!(draft && draft.supplied) && !hasElevatedAccess(); }

function pendingFieldProposal(fieldKey, partId){
  if(!draft) return null;
  return (editProposals||[]).find(pr=> pr.order_id===draft.id && pr.field===fieldKey && (partId ? pr.part_id===partId : !pr.part_id));
}

function pendingPaymentEditOrDeleteProposal(paymentId){
  if(!draft) return null;
  return (editProposals||[]).find(pr=> pr.order_id===draft.id && pr.payment_id===paymentId && (pr.kind==='payment_edit'||pr.kind==='payment_delete'));
}

function pendingPaymentAddProposals(){
  if(!draft) return [];
  return (editProposals||[]).filter(pr=> pr.order_id===draft.id && pr.kind==='payment_add');
}

/* طلبات معلّقة على إجراء قطعة (استبعاد/حذف/إرجاع) أو إجراء على مستوى الطلبية كلها (حذف/إرجاع) */
function pendingPartActionProposal(kind, partId){
  if(!draft) return null;
  return (editProposals||[]).find(pr=> pr.order_id===draft.id && pr.kind===kind && pr.part_id===partId);
}

function pendingOrderActionProposal(kind){
  if(!draft) return null;
  return (editProposals||[]).find(pr=> pr.order_id===draft.id && pr.kind===kind && !pr.part_id);
}

/* حقول من نوع مفتاح/قفل (checkbox) — الطلب عليها إرسال فوري لعكس القيمة الحالية، مو صندوق كتابة
   قيمة زي باقي الحقول (composeFieldHtml). كل مفتاح وتسمية true/false الخاصة فيه بالعربي. */
const BOOLEAN_FIELD_LABELS = {
  used: {true:'مستعمل', false:'غير مستعمل'},
  feeEnabled: {true:'مفعّلة', false:'غير مفعّلة'},
  serviceFeeEnabled: {true:'مفعّلة', false:'غير مفعّلة'},
  deliveryFeeEnabled: {true:'مفعّلة', false:'غير مفعّلة'}
};
function isBooleanProposalField(fieldKey){ return !!BOOLEAN_FIELD_LABELS[fieldKey]; }

function formatProposalFieldValue(field, value){
  if(BOOLEAN_FIELD_LABELS[field]) return BOOLEAN_FIELD_LABELS[field][value ? 'true' : 'false'];
  if(field==='description') return value==null ? '—' : String(value);
  if(field==='feePercent' || field==='serviceFeePercent') return (value==null?0:value)+'%';
  if(field==='qty') return String(value==null?1:value);
  return fmtMoney(Number(value)||0);
}

function paymentMethodLabel(method){ return method==='cash' ? 'كاش' : (method==='card' ? 'شبكة' : '—'); }

function editProposalPendingHtml(pr){
  const mine = pr.submitted_by === presenceEmail;
  const elevated = hasElevatedAccess();
  let changeText;
  if(pr.kind==='payment_delete'){
    changeText = '🗑️ طلب حذف الدفعة';
  } else if(pr.kind==='payment_add'){
    const pv = pr.proposed_value||{};
    changeText = 'دفعة جديدة: '+fmtMoney(Number(pv.amount)||0)+' ('+paymentMethodLabel(pv.method)+')';
  } else if(pr.kind==='payment_edit'){
    const pv = pr.proposed_value||{};
    changeText = 'تعديل الدفعة إلى '+fmtMoney(Number(pv.amount)||0)+' ('+paymentMethodLabel(pv.method)+')';
  } else if(pr.kind==='part_exclude'){
    changeText = '🚫 طلب استبعاد القطعة من حسابات الطلبية';
  } else if(pr.kind==='part_delete'){
    changeText = '🗑️ طلب حذف القطعة';
  } else if(pr.kind==='part_return'){
    changeText = '🔄 طلب إرجاع القطعة';
  } else if(pr.kind==='order_delete'){
    changeText = '🗑️ طلب حذف الطلبية بالكامل';
  } else if(pr.kind==='order_return'){
    changeText = '🔄 طلب إرجاع الطلبية بالكامل';
  } else {
    changeText = escapeHtml(formatProposalFieldValue(pr.field, pr.current_value)) + ' ← ' + escapeHtml(formatProposalFieldValue(pr.field, pr.proposed_value));
  }
  return '<span class="proposal-pending-banner" data-proposal-id="'+escapeHtml(pr.id)+'">' +
    '<span class="proposal-pending-text">⏳ '+changeText+'</span>' +
    (elevated ? (
      '<button type="button" class="icon-btn proposal-accept-btn" data-accept-proposal="'+escapeHtml(pr.id)+'" title="قبول">✓</button>' +
      '<button type="button" class="icon-btn proposal-reject-btn" data-reject-proposal="'+escapeHtml(pr.id)+'" title="رفض">✗</button>'
    ) : (mine ? '<button type="button" class="icon-btn proposal-withdraw-btn" data-withdraw-proposal="'+escapeHtml(pr.id)+'" title="سحب الطلب">✕</button>' : '')) +
  '</span>';
}

function composeFieldHtml(fieldKey, partId, currentValue){
  const numeric = fieldKey !== 'description';
  return '<span class="field-request-compose">' +
    '<input type="'+(numeric?'number':'text')+'"'+(numeric?' min="0" step="0.01"':'')+' class="field-request-input num" data-field="'+escapeHtml(fieldKey)+'"'+(partId?' data-part-id="'+escapeHtml(partId)+'"':'')+' value="'+escapeHtml(currentValue==null?'':currentValue)+'" placeholder="القيمة الجديدة">' +
    '<button type="button" class="icon-btn field-request-send-btn" data-send-field="'+escapeHtml(fieldKey)+'"'+(partId?' data-part-id="'+escapeHtml(partId)+'"':'')+' title="إرسال الطلب">📨</button>' +
    '<button type="button" class="icon-btn field-request-cancel-btn" data-cancel-field="'+escapeHtml(fieldKey)+'"'+(partId?' data-part-id="'+escapeHtml(partId)+'"':'')+' title="إلغاء">✕</button>' +
  '</span>';
}

/* بيستخدم بمكان كل input حر (وصف/سعر شراء/سعر بيع/نسب) — بيرجع null لو الحقل مو مقفول أصلًا
   (يعني الطلبية غير موردة أو المستخدم مخوّل) فالمكان يلي استدعاها يرسم input العادي بدالها. */
function fieldRequestUiHtml(fieldKey, partId, currentValue, displayHtml){
  const pending = pendingFieldProposal(fieldKey, partId);
  if(pending) return editProposalPendingHtml(pending);
  if(!fieldGated()) return null;
  const boolean = isBooleanProposalField(fieldKey);
  if(!boolean){
    const key = composeKey(fieldKey, partId);
    if(composingProposalFields.has(key)) return composeFieldHtml(fieldKey, partId, currentValue);
  }
  return displayHtml + (editRequestMode ? '<button type="button" class="icon-btn field-request-btn" data-request-field="'+escapeHtml(fieldKey)+'"'+(partId?' data-part-id="'+escapeHtml(partId)+'"':'')+(boolean?' data-request-boolean="1"':'')+' title="طلب تعديل">✏️</button>' : '');
}

async function sendFieldEditRequest(fieldKey, partId){
  const key = composeKey(fieldKey, partId);
  if(editProposalSending.has(key)) return;
  if(pendingFieldProposal(fieldKey, partId)) return;
  const root = document.getElementById('modal-root');
  const selector = '.field-request-input[data-field="'+fieldKey+'"]'+(partId?'[data-part-id="'+partId+'"]':':not([data-part-id])');
  const input = root.querySelector(selector);
  if(!input) return;
  let proposedValue = input.value;
  const numeric = fieldKey !== 'description';
  if(numeric){
    if(proposedValue===''){ showToast('أدخل قيمة صحيحة', 'error'); return; }
    proposedValue = Math.max(0, Number(proposedValue)||0);
  } else {
    if(!proposedValue.trim()){ showToast('أدخل اسمًا للقطعة', 'error'); return; }
  }
  let currentValue;
  if(partId){
    const part = (draft.parts||[]).find(p=>p.id===partId);
    currentValue = part ? part[fieldKey] : null;
  } else {
    currentValue = draft[fieldKey];
  }
  editProposalSending.add(key);
  const { error } = await sb.from('edit_proposals').insert({
    order_id: draft.id, kind: partId ? 'part_field' : 'order_field', part_id: partId || null, field: fieldKey,
    current_value: currentValue, proposed_value: proposedValue, submitted_by: presenceEmail
  });
  editProposalSending.delete(key);
  if(error){ showToast('تعذر إرسال الطلب', 'error'); return; }
  composingProposalFields.delete(key);
  showToast('تم إرسال طلب التعديل', 'ok');
  await refreshEditProposals();
}

async function sendPaymentEditRequest(paymentId){
  const key = 'payment-edit-'+paymentId;
  if(editProposalSending.has(key)) return;
  if(pendingPaymentEditOrDeleteProposal(paymentId)) return;
  const root = document.getElementById('modal-root');
  const row = root.querySelector('.payment-row[data-payment-id="'+paymentId+'"]');
  if(!row) return;
  const amountInput = row.querySelector('.payment-amount-input');
  const methodSelect = row.querySelector('.payment-method-select');
  const amount = amountInput ? amountInput.value : '';
  const method = methodSelect ? methodSelect.value : '';
  if(amount===''||Number(amount)<0){ showToast('أدخل مبلغًا صحيحًا', 'error'); return; }
  if(!method){ showToast('لازم تحدد طريقة الدفع (كاش/شبكة) أولًا', 'error'); return; }
  const payment = (draft.customerPayments||[]).find(p=>p.id===paymentId);
  if(!payment) return;
  editProposalSending.add(key);
  const { error } = await sb.from('edit_proposals').insert({
    order_id: draft.id, kind: 'payment_edit', payment_id: paymentId,
    current_value: {amount: payment.amount, method: payment.method, date: payment.date},
    proposed_value: {amount: Math.max(0, Number(amount)||0), method, date: payment.date},
    submitted_by: presenceEmail
  });
  editProposalSending.delete(key);
  if(error){ showToast('تعذر إرسال الطلب', 'error'); return; }
  delete editingPayments[paymentId];
  showToast('تم إرسال طلب التعديل', 'ok');
  await refreshEditProposals();
}

function requestDeletePayment(paymentId){
  const payment = (draft.customerPayments||[]).find(p=>p.id===paymentId);
  if(!payment) return;
  if(pendingPaymentEditOrDeleteProposal(paymentId)) return;
  confirmAction({
    title: 'إرسال طلب حذف هذه الدفعة؟',
    message: payment.amount ? 'المبلغ: '+fmtMoney(payment.amount) : undefined,
    confirmLabel: 'إرسال الطلب',
    dangerous: true,
    onConfirm: async ()=>{
      const { error } = await sb.from('edit_proposals').insert({
        order_id: draft.id, kind: 'payment_delete', payment_id: paymentId,
        current_value: {amount: payment.amount, method: payment.method, date: payment.date},
        proposed_value: null, submitted_by: presenceEmail
      });
      if(error){ showToast('تعذر إرسال الطلب', 'error'); return; }
      showToast('تم إرسال طلب الحذف', 'ok');
      await refreshEditProposals();
    }
  });
}

async function sendPaymentAddRequest(draftKey){
  if(editProposalSending.has(draftKey)) return;
  const d = pendingPaymentAddDrafts[draftKey];
  if(!d) return;
  const root = document.getElementById('modal-root');
  const row = root.querySelector('[data-add-draft-key="'+draftKey+'"]');
  const amountInput = row ? row.querySelector('.payment-add-draft-amount-input') : null;
  const methodSelect = row ? row.querySelector('.payment-add-draft-method-select') : null;
  const amount = amountInput ? amountInput.value : d.amount;
  const method = methodSelect ? methodSelect.value : d.method;
  if(amount===''||amount==null||Number(amount)<0){ showToast('أدخل مبلغًا صحيحًا', 'error'); return; }
  if(!method){ showToast('لازم تحدد طريقة الدفع (كاش/شبكة) أولًا', 'error'); return; }
  editProposalSending.add(draftKey);
  const { error } = await sb.from('edit_proposals').insert({
    order_id: draft.id, kind: 'payment_add', current_value: null,
    proposed_value: {amount: Math.max(0, Number(amount)||0), method, date: d.date||todayNumeric()},
    submitted_by: presenceEmail
  });
  editProposalSending.delete(draftKey);
  if(error){ showToast('تعذر إرسال الطلب', 'error'); return; }
  delete pendingPaymentAddDrafts[draftKey];
  showToast('تم إرسال طلب الدفعة', 'ok');
  await refreshEditProposals();
}

/* بعد إلغاء "تم التوريد"، أي طلب معلّق شرط قفله مبني على "الطلبية موردة" بيفقد مبرر وجوده
   (شرط القفل نفسه ارتفع) فنلغيه — أسعار/اسم/نسب (part_field/order_field) واستبعاد/حذف/إرجاع
   قطعة (part_exclude/part_delete/part_return) وإرجاع الطلبية بالكامل (order_return)، كلهم
   مقفولين على old.supplied=true بالتريغر. order_delete وطلبات الدفعات (payment_*) ما إلهم
   علاقة بحالة التوريد أصلًا (مقفولين على المخوّلين دايمًا) فما تُلمس هون. */
async function cancelPendingSuppliedGatedProposalsForOrder(orderId){
  const { error } = await sb.from('edit_proposals').delete().eq('order_id', orderId)
    .in('kind', ['part_field','order_field','part_exclude','part_delete','part_return','order_return']);
  if(error) console.error('cancelPendingSuppliedGatedProposalsForOrder:', error);
  await refreshEditProposals();
}

/* الطلبية انحذفت فعليًا (مباشرة من مخوّل أو بقبول order_delete) — أي طلب تعديل تاني معلّق عليها
   (مهما كان نوعه) صار بلا معنى، ما رح ينطبق أبدًا (order.id ما بيرجع يلاقيه applyEditProposal)
   وبيضل يتكرّر بقائمة الطلبات المعلّقة للأبد لو ما انلغى هون */
async function purgeEditProposalsForOrder(orderId){
  const { error } = await sb.from('edit_proposals').delete().eq('order_id', orderId);
  if(error) console.error('purgeEditProposalsForOrder:', error);
  await refreshEditProposals();
}

/* نفس الفكرة — قطعة انحذفت أو رجعت مباشرة (من مخوّل، أو قبل ما "تحديد القطع" يصير فيه طلب أصلًا)
   بتخلي أي طلب معلّق عليها بالذات (سعر/اسم/استبعاد/حذف/إرجاع) ميت لا محالة */
async function purgeEditProposalsForPart(orderId, partId){
  const { error } = await sb.from('edit_proposals').delete().eq('order_id', orderId).eq('part_id', partId);
  if(error) console.error('purgeEditProposalsForPart:', error);
  await refreshEditProposals();
}

/* حقول boolean (تصنيف مستعمل/غير مستعمل، تفعيل نسب الرسوم) — إرسال فوري لعكس القيمة الحالية
   بدل صندوق كتابة (composeFieldHtml)، نفس مبدأ requestPartExclude بس عام لأي حقل boolean */
function requestBooleanFieldChange(fieldKey, partId, currentValue){
  if(pendingFieldProposal(fieldKey, partId)) return;
  const key = composeKey(fieldKey, partId);
  if(editProposalSending.has(key)) return;
  const proposedValue = !currentValue;
  const labels = BOOLEAN_FIELD_LABELS[fieldKey] || {};
  confirmAction({
    title: 'إرسال طلب تغيير "'+(EDIT_PROPOSAL_FIELD_LABELS[fieldKey]||fieldKey)+'" إلى '+(labels[proposedValue?'true':'false']||proposedValue)+'؟',
    confirmLabel: 'إرسال الطلب',
    onConfirm: async ()=>{
      editProposalSending.add(key);
      const { error } = await sb.from('edit_proposals').insert({
        order_id: draft.id, kind: partId ? 'part_field' : 'order_field', part_id: partId || null, field: fieldKey,
        current_value: !!currentValue, proposed_value: proposedValue, submitted_by: presenceEmail
      });
      editProposalSending.delete(key);
      if(error){ showToast('تعذر إرسال الطلب', 'error'); return; }
      showToast('تم إرسال الطلب', 'ok');
      await refreshEditProposals();
    }
  });
}

/* حذف/إرجاع/استبعاد قطعة — ثلاثة أنواع طلبات ما ينفع يتعايشوا على نفس القطعة بنفس الوقت
   (لو طلب حذف انقبل وبعده طلب استبعاد قدّم على نفس القطعة، الاستبعاد بيصير طلب ميت للأبد) */
function hasAnyPendingPartAction(partId){
  return !!(pendingPartActionProposal('part_exclude', partId) || pendingPartActionProposal('part_delete', partId) || pendingPartActionProposal('part_return', partId));
}

function requestPartExclude(part){
  if(hasAnyPendingPartAction(part.id)) return;
  confirmAction({
    title: 'إرسال طلب استبعاد هذه القطعة من حسابات الطلبية؟',
    message: part.description ? 'القطعة: '+part.description : undefined,
    confirmLabel: 'إرسال الطلب',
    onConfirm: async ()=>{
      const { error } = await sb.from('edit_proposals').insert({
        order_id: draft.id, kind: 'part_exclude', part_id: part.id,
        current_value: true, proposed_value: false, submitted_by: presenceEmail
      });
      if(error){ showToast('تعذر إرسال الطلب', 'error'); return; }
      showToast('تم إرسال الطلب', 'ok');
      await refreshEditProposals();
    }
  });
}

function requestPartDelete(part){
  if(hasAnyPendingPartAction(part.id)) return;
  confirmAction({
    title: 'إرسال طلب حذف هذه القطعة؟',
    message: part.description ? 'القطعة: '+part.description : undefined,
    confirmLabel: 'إرسال الطلب',
    dangerous: true,
    onConfirm: async ()=>{
      const { error } = await sb.from('edit_proposals').insert({
        order_id: draft.id, kind: 'part_delete', part_id: part.id,
        current_value: {description: part.description, costPrice: part.costPrice, sellPrice: part.sellPrice},
        proposed_value: null, submitted_by: presenceEmail
      });
      if(error){ showToast('تعذر إرسال الطلب', 'error'); return; }
      showToast('تم إرسال طلب الحذف', 'ok');
      await refreshEditProposals();
    }
  });
}

function requestPartReturn(part){
  const hasReceivable = part.used ? draft.paidToAmer : draft.paidToSupplier;
  if(hasReceivable && !part.supplierId){ showToast('حدد المورد لهذه القطعة قبل إرسال طلب الإرجاع', 'error'); return; }
  if(hasAnyPendingPartAction(part.id)) return;
  confirmAction({
    title: 'إرسال طلب إرجاع هذه القطعة؟',
    confirmLabel: 'إرسال الطلب',
    dangerous: true,
    onConfirm: async ()=>{
      const { error } = await sb.from('edit_proposals').insert({
        order_id: draft.id, kind: 'part_return', part_id: part.id,
        current_value: null, proposed_value: null, submitted_by: presenceEmail
      });
      if(error){ showToast('تعذر إرسال الطلب', 'error'); return; }
      showToast('تم إرسال طلب الإرجاع', 'ok');
      await refreshEditProposals();
    }
  });
}

function requestOrderDelete(){
  if(pendingOrderActionProposal('order_delete')){ showToast('في طلب حذف معلّق أصلًا لهذه الطلبية', 'error'); return; }
  confirmAction({
    title: 'إرسال طلب حذف هذه الطلبية؟',
    message: 'هذا إجراء نهائي بعد الموافقة — الطلبية بتُحذف بالكامل.',
    confirmLabel: 'إرسال الطلب',
    dangerous: true,
    onConfirm: async ()=>{
      const { error } = await sb.from('edit_proposals').insert({
        order_id: draft.id, kind: 'order_delete', current_value: null, proposed_value: null, submitted_by: presenceEmail
      });
      if(error){ showToast('تعذر إرسال الطلب', 'error'); return; }
      showToast('تم إرسال طلب الحذف', 'ok');
      await refreshEditProposals();
    }
  });
}

function requestOrderReturn(){
  const activeParts = orderActiveParts(draft).filter(p=>!p.returned);
  if(!activeParts.length){ showToast('لا يوجد قطع قابلة للإرجاع بهذه الطلبية', 'error'); return; }
  const missingSupplier = activeParts.some(p=>{
    const hasReceivable = p.used ? draft.paidToAmer : draft.paidToSupplier;
    return hasReceivable && !p.supplierId;
  });
  if(missingSupplier){ showToast('حدد المورد لكل قطعة مدفوعة مسبقًا قبل إرسال طلب الإرجاع', 'error'); return; }
  if(pendingOrderActionProposal('order_return')){ showToast('في طلب إرجاع معلّق أصلًا لهذه الطلبية', 'error'); return; }
  confirmAction({
    title: 'إرسال طلب إرجاع الطلبية بالكامل ('+activeParts.length+' قطعة)؟',
    confirmLabel: 'إرسال الطلب',
    dangerous: true,
    onConfirm: async ()=>{
      const { error } = await sb.from('edit_proposals').insert({
        order_id: draft.id, kind: 'order_return', current_value: null, proposed_value: null, submitted_by: presenceEmail
      });
      if(error){ showToast('تعذر إرسال الطلب', 'error'); return; }
      showToast('تم إرسال طلب الإرجاع', 'ok');
      await refreshEditProposals();
    }
  });
}

async function withdrawEditProposal(proposalId){
  const { data, error } = await sb.from('edit_proposals').delete().eq('id', proposalId).select();
  if(error){ showToast('تعذر سحب الطلب', 'error'); return; }
  // صفر صفوف = انعالج (قُبل/رُفض) من مكان تاني بنفس اللحظة — مو سحب فعلي، فما نقول "تم السحب" بالغلط
  showToast((data && data.length) ? 'تم سحب الطلب' : 'الطلب انعالج فعلًا من مكان تاني', (data && data.length) ? 'ok' : 'error');
  await refreshEditProposals();
}

function applyEditProposal(pr, orderOverride, opts){
  opts = opts || {};
  const order = orderOverride || appData.orders.find(o=>o.id===pr.order_id);
  if(!order) return false;
  if(pr.kind === 'part_field'){
    const part = (order.parts||[]).find(p=>p.id===pr.part_id);
    if(!part) return false;
    if(pr.field === 'costPrice') part.costPrice = Math.max(0, Number(pr.proposed_value)||0);
    else if(pr.field === 'sellPrice') part.sellPrice = Math.max(0, Number(pr.proposed_value)||0);
    else if(pr.field === 'description') part.description = String(pr.proposed_value||'');
    else if(pr.field === 'qty') part.qty = Math.max(1, Number(pr.proposed_value)||1);
    else if(pr.field === 'used'){ part.used = !!pr.proposed_value; part.supplierId = null; }
    else return false;
  } else if(pr.kind === 'order_field'){
    if(pr.field === 'feePercent') order.feePercent = Math.max(0, Number(pr.proposed_value)||0);
    else if(pr.field === 'serviceFeePercent') order.serviceFeePercent = Math.max(0, Number(pr.proposed_value)||0);
    else if(pr.field === 'deliveryFeeAmount') order.deliveryFeeAmount = Math.max(0, Number(pr.proposed_value)||0);
    else if(pr.field === 'feeEnabled') order.feeEnabled = !!pr.proposed_value;
    else if(pr.field === 'serviceFeeEnabled') order.serviceFeeEnabled = !!pr.proposed_value;
    else if(pr.field === 'deliveryFeeEnabled') order.deliveryFeeEnabled = !!pr.proposed_value;
    else return false;
  } else if(pr.kind === 'payment_add'){
    if(!Array.isArray(order.customerPayments)) order.customerPayments = [];
    const pv = pr.proposed_value || {};
    order.customerPayments.push({ id: uid('pay'), amount: Math.max(0, Number(pv.amount)||0), method: pv.method||'', date: pv.date||todayNumeric() });
  } else if(pr.kind === 'payment_edit'){
    const payment = (order.customerPayments||[]).find(p=>p.id===pr.payment_id);
    if(!payment) return false;
    const pv = pr.proposed_value || {};
    payment.amount = Math.max(0, Number(pv.amount)||0);
    payment.method = pv.method||'';
    payment.date = pv.date||payment.date;
  } else if(pr.kind === 'payment_delete'){
    const existed = (order.customerPayments||[]).some(p=>p.id===pr.payment_id);
    if(!existed) return false;
    order.customerPayments = (order.customerPayments||[]).filter(p=>p.id!==pr.payment_id);
  } else if(pr.kind === 'part_exclude'){
    const part = (order.parts||[]).find(p=>p.id===pr.part_id);
    if(!part) return false;
    part.included = false;
  } else if(pr.kind === 'part_delete'){
    const targetPart = (order.parts||[]).find(p=>p.id===pr.part_id);
    // نفس قيد part_return — قطعة مرتجعة أصلًا ما تنحذف (كان ممكن يصير لو حد رجّعها مباشرة
    // بالفترة الفاصلة بين إرسال طلب الحذف وقبوله)، غير هيك دفعة الاسترداد المرتبطة فيها
    // (returnAdjustment) بتضل معلّقة بلا قطعة توصلها، وأي مستحق للمورد عنها بيختفي بصمت
    if(!targetPart || targetPart.returned) return false;
    order.parts = (order.parts||[]).filter(p=>p.id!==pr.part_id);
  } else if(pr.kind === 'part_return'){
    const part = (order.parts||[]).find(p=>p.id===pr.part_id);
    if(!part || part.returned) return false;
    const hasReceivable = part.used ? order.paidToAmer : order.paidToSupplier;
    if(hasReceivable && !part.supplierId) return false; // نفس شرط الإرجاع المباشر — لازم مورد محدد أولًا
    if(opts.keepFee){
      const s = computeReturnFeeShare(order, part);
      order.returnKeptFeeAmount = round2((order.returnKeptFeeAmount||0) + s.feeShare);
      order.returnKeptServiceFeeAmount = round2((order.returnKeptServiceFeeAmount||0) + s.serviceFeeShare);
    }
    applyPartReturnOnOrder(order, part);
  } else if(pr.kind === 'order_return'){
    const activeParts = orderActiveParts(order).filter(p=>!p.returned);
    if(!activeParts.length) return false;
    const missingSupplier = activeParts.some(p=>{
      const hasReceivable = p.used ? order.paidToAmer : order.paidToSupplier;
      return hasReceivable && !p.supplierId;
    });
    if(missingSupplier) return false;
    if(opts.keepFee){
      const t = orderTotals(order);
      order.returnKeptFeeAmount = round2((order.returnKeptFeeAmount||0) + t.feeAmount);
      order.returnKeptServiceFeeAmount = round2((order.returnKeptServiceFeeAmount||0) + t.serviceFeeAmount);
      order.returnKeptDeliveryAmount = round2((order.returnKeptDeliveryAmount||0) + t.deliveryFeeAmount);
    }
    activeParts.forEach(p=> applyPartReturnOnOrder(order, p));
  } else {
    return false;
  }
  order.updatedAt = new Date().toISOString();
  return true;
}

/* إرجاع قطعة/طلبية عبر طلب تعديل (كتير غير مخوّل) — المخوّل يلي عم يقبل هو اللي بياخد قرار
   استرجاع النسبة المضافة للزبون أو الاحتفاظ فيها، بنفس لحظة القبول (المتقدّم بالطلب ما بيُسأل
   هالسؤال أصلًا، نفس مبدأ إن كل قرار مالي فعلي مقصور على المخوّلين) */
function handleEditProposalDecision(proposalId, accept){
  const pr = (editProposals||[]).find(p=>p.id===proposalId);
  if(!pr) return;
  const needsFeeChoice = accept && (pr.kind==='part_return' || pr.kind==='order_return');
  if(needsFeeChoice){
    const order = appData.orders.find(o=>o.id===pr.order_id);
    let shareAmount = 0;
    if(order){
      if(pr.kind==='part_return'){
        const part = (order.parts||[]).find(p=>p.id===pr.part_id);
        if(part){ const s = computeReturnFeeShare(order, part); shareAmount = round2(s.feeShare+s.serviceFeeShare); }
      } else {
        const t = orderTotals(order);
        shareAmount = round2(t.feeAmount + t.serviceFeeAmount + t.deliveryFeeAmount);
      }
    }
    if(shareAmount > 0.01){
      openReturnFeeChoiceModal(shareAmount, pr.kind==='order_return', (keepFee)=> proceedEditProposalDecision(proposalId, accept, keepFee));
      return;
    }
  }
  proceedEditProposalDecision(proposalId, accept, false);
}

function proceedEditProposalDecision(proposalId, accept, keepFee){
  const pr = (editProposals||[]).find(p=>p.id===proposalId);
  if(!pr) return;
  // نص مرجعي للطلبية يُلتقط الآن (نفس صيغة #الرقم — الاسم المستخدمة بكل مكان بهالمودال) — بعد
  // فرع الحذف الطلبية ما بتضل موجودة بـ appData.orders فما نقدر نجيبه وقتها
  const orderRefForLog = (()=>{
    const o = appData.orders.find(o=>o.id===pr.order_id);
    return o ? ('#'+o.orderNumber+(o.orderLabel?' — '+o.orderLabel:'')) : ('طلبية #'+pr.order_id);
  })();
  confirmAction({
    title: accept ? 'قبول هذا الطلب؟' : 'رفض هذا الطلب؟',
    message: accept ? 'بيتطبّق التعديل مباشرة على الطلبية.' : 'الطلب بيُحذف بدون أي تغيير.',
    confirmLabel: accept ? 'قبول وتطبيق' : 'تأكيد الرفض',
    dangerous: !accept,
    onConfirm: async ()=>{
      // نفس مبدأ الحذف كـ"مطالبة" بالاقتراح المستخدم مع scrapyard_proposals فوق — يمنع تطبيق مزدوج
      // لو مسؤول تاني قبل/رفض بنفس اللحظة
      const { data: deletedRows, error: delError } = await sb.from('edit_proposals').delete().eq('id', pr.id).select();
      if(delError){ showToast('تعذر تحديث حالة الطلب', 'error'); return; }
      if(!deletedRows || !deletedRows.length){
        showToast('هذا الطلب انعالج فعلًا من مكان تاني', 'error');
        await refreshEditProposals();
        return;
      }
      const restoreProposal = async ()=>{
        const { error } = await sb.from('edit_proposals').insert(deletedRows[0]);
        if(error) console.error('restoreEditProposal:', error);
        await refreshEditProposals();
      };
      if(accept){
        const claimed = deletedRows[0];
        // حذف الطلبية بالكامل — DELETE فعلي على orders، مش تعديل عبر applyEditProposal/persistOrder
        // متل باقي الأنواع (اللي كلها UPDATE على صف موجود)
        if(claimed.kind === 'order_delete'){
          const deleted = await deleteOrder(claimed.order_id);
          if(!deleted){
            showToast('تعذر حذف الطلبية — رجّعنا الطلب مكانه، جرّب مرة تانية', 'error');
            await restoreProposal();
            return;
          }
          appData.orders = appData.orders.filter(o=>o.id!==claimed.order_id);
          if(draft && draft.id === claimed.order_id) closeModal();
          await purgeEditProposalsForOrder(claimed.order_id);
          renderKPIs();
          renderTable();
        } else {
          // نجيب أحدث نسخة من الطلبية مباشرة من القاعدة قبل التطبيق — appData.orders المحلية
          // ممكن تكون قديمة شوي (تأخر بسيط بالتزامن اللحظي)، وبدون هيك حفظ لاحق كان بيدهس أي
          // تعديل تاني صار عالطلبية بالفترة الفاصلة بصمت (نفس درس draftOpenedAtUpdatedAt، هون
          // بلا draft مفتوح بالضرورة). العمل على نسخة منفصلة (مو appData.orders المخزّنة) يعني
          // كمان ما في داعي لأي "استرجاع" لو فشل التطبيق أو الحفظ — النسخة المخزّنة أصلًا ما انلمست.
          const { data: freshRow, error: fetchError } = await sb.from('orders').select('*').eq('id', claimed.order_id).maybeSingle();
          if(fetchError || !freshRow){
            showToast('تعذر تطبيق الطلب — الطلبية غير موجودة. رجّعنا الطلب مكانه', 'error');
            await restoreProposal();
            return;
          }
          const order = orderRowToObject(freshRow);
          const applied = applyEditProposal(claimed, order, {keepFee});
          if(!applied){
            showToast('تعذر تطبيق الطلب — الطلبية أو القطعة/الدفعة غير موجودة. رجّعنا الطلب مكانه', 'error');
            await restoreProposal();
            return;
          }
          const saved = await persistOrder(order);
          if(!saved){
            showToast('تعذر حفظ التعديل على الطلبية — رجّعنا الطلب مكانه، جرّب مرة تانية', 'error');
            await restoreProposal();
            return;
          }
          const idx = appData.orders.findIndex(o=>o.id===order.id);
          if(idx>=0) appData.orders[idx] = order; else appData.orders.push(order);
          // لو الطلبية المتأثرة مفتوحة حاليًا بالنافذة، لازم نزامن draft معها فورًا — غير هيك حفظ
          // لاحق من draft القديم بيلغي التعديل يلي لسا انطبق (نفس درس draftOpenedAtUpdatedAt)
          if(draft && draft.id === order.id){
            draft.parts = JSON.parse(JSON.stringify(order.parts||[]));
            draft.customerPayments = JSON.parse(JSON.stringify(order.customerPayments||[]));
            draft.feePercent = order.feePercent;
            draft.serviceFeePercent = order.serviceFeePercent;
            draft.deliveryFeeAmount = order.deliveryFeeAmount;
            draft.feeEnabled = order.feeEnabled;
            draft.serviceFeeEnabled = order.serviceFeeEnabled;
            draft.deliveryFeeEnabled = order.deliveryFeeEnabled;
            draft.returnKeptFeeAmount = order.returnKeptFeeAmount;
            draft.returnKeptServiceFeeAmount = order.returnKeptServiceFeeAmount;
            draft.returnKeptDeliveryAmount = order.returnKeptDeliveryAmount;
            draft.updatedAt = order.updatedAt;
            draftOpenedAtUpdatedAt = order.updatedAt;
            refreshPartsList();
            refreshFeeFieldsBlock();
            refreshPaymentsList();
            updateModalTotals();
          }
          renderKPIs();
          renderTable();
        }
      }
      try{
        await sb.from('activity_events').insert({
          kind: 'edit_proposal_decided',
          order_id: pr.order_id,
          order_ref: orderRefForLog,
          actor_email: presenceEmail,
          target_email: deletedRows[0].submitted_by,
          message: (accept ? 'تم قبول طلب التعديل على الطلبية: ' : 'تم رفض طلب التعديل على الطلبية: ') + orderRefForLog
        });
      }catch(e){ console.error('logEditProposalDecided:', e); }
      showToast(accept ? 'تم القبول والتطبيق' : 'تم رفض الطلب', 'ok');
      await refreshEditProposals();
    }
  });
}

/* focus جوا قوائم الطلبية القابلة للتعديل (مستخدم عم يكتب حاليًا) — تحديث كامل بالمنتصف بيقطع
   التركيز/مكان المؤشر، فبنأجل الرسم لحد ما يخلص */
function modalListFocused(){
  const ae = document.activeElement;
  if(!ae || !ae.closest) return false;
  return !!(ae.closest('#parts-list') || ae.closest('#order-fee-fields-wrap') || ae.closest('#payments-list'));
}

async function refreshEditProposals(){
  try{
    const { data, error } = await sb.from('edit_proposals').select('*').order('created_at', {ascending:false});
    if(error) throw error;
    editProposals = data || [];
  }catch(e){ /* البادج/الشرائط بس بتتخطى دورة التحديث هاي */ }
  updateEditProposalsBadge();
  if(draft && !modalListFocused()){
    refreshPartsList();
    refreshFeeFieldsBlock();
    refreshPaymentsList();
    refreshOrderActionButtons();
  }
  if(document.getElementById('treasury-view') && document.getElementById('treasury-view').style.display!=='none'){
    renderTreasuryView();
  }
  if(editProposalsModalOpen) refreshEditProposalsModal();
  // بادج كل طلبية بقائمتها (الرئيسية والأرشيف) — لازم يتحدّث لحظيًا لو وصل طلب جديد بالريل-تايم
  renderTable();
  refreshArchiveViewIfOpen();
}

function updateEditProposalsBadge(){
  const count = (editProposals||[]).length;
  const badge = document.getElementById('edit-proposals-badge');
  if(badge){ badge.textContent = count>0 ? count : ''; badge.style.display = count>0 ? 'flex' : 'none'; }
  updateArchivePendingBadge();
}

/* بادج على زر "🗄️ الأرشيف" نفسه — عشان طلب معلّق على طلبية مؤرشفة (مو ظاهرة أصلًا بالقائمة
   الرئيسية) ما يفوت المخوّل، لازم إشارة على مدخل الأرشيف قبل حتى ما يفتحه */
function updateArchivePendingBadge(){
  const badge = document.getElementById('archive-pending-badge');
  if(!badge) return;
  const archivedIds = new Set((appData.orders||[]).filter(o=>o.archived).map(o=>o.id));
  const count = (editProposals||[]).filter(pr=>archivedIds.has(pr.order_id)).length;
  badge.textContent = count>0 ? count : '';
  badge.style.display = count>0 ? 'flex' : 'none';
}

function subscribeEditProposalsRealtime(){
  if(!sb || editProposalsChannel) return;
  editProposalsChannel = sb.channel('edit-proposals-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'edit_proposals' }, ()=>{
      refreshEditProposals();
    })
    .subscribe();
}

/* ---------- سجل الإشعارات (activity_events) — أحداث غير مالية (طلبية تحتاج تسعير/اكتمل تسعيرها/
   توردت، طلب تعديل وصل/تم قبوله أو رفضه، مهمة جديدة بالمشتريات أو المبيعات) تُبنى تلقائيًا من
   DB triggers على orders/edit_proposals/tasks، عدا edit_proposal_decided يلي يُسجَّل مباشرة من
   handleEditProposalDecision (القرار مأخوذ بالعميل).
   كل مستخدم يشوف بس أحداثه: audience_role يطابق دوره، أو elevated_only ومعه صلاحية مخوّل، أو
   target_email يطابق بريده — القراءة من القاعدة مفتوحة للجميع، التصفية تصير هون بالعميل. */
let activityEvents = [];
let activityEventsLastSeenAt = '1970-01-01T00:00:00Z';
let activityEventsChannel = null;
let activityLogModalOpen = false;

function activityEventMatchesAudience(ev){
  if(ev.target_email) return ev.target_email === presenceEmail;
  if(ev.elevated_only) return currentUserIsElevated;
  if(ev.audience_role) return ev.audience_role === currentUserRole;
  return true;
}

/* التصفية بحسب الجمهور تصير أولًا بالاستعلام نفسه (شرط .or حسب دور/بريد المستخدم الحالي) قبل
   حد الـ200 صف — لو صارت بعد الحد كان ممكن حدث يهم دور هادئ (متل عامر) يتزحزح خارج النافذة
   المجلوبة بسبب زخم أحداث دور تاني. activityEventMatchesAudience تبقى فلترة دفاعية إضافية بعد
   الجلب (احتياط لو .or ما غطّى حالة ما كنا متوقعينها). */
async function refreshActivityEvents(){
  try{
    if(!sb || !presenceEmail) return;
    await loadActivityEventsSeenMark();
    const audienceOr = 'target_email.eq.'+presenceEmail+',audience_role.eq.'+currentUserRole+(currentUserIsElevated?',elevated_only.eq.true':'');
    const { data, error } = await sb.from('activity_events').select('*').or(audienceOr).order('created_at', {ascending:false}).limit(200);
    if(error) throw error;
    activityEvents = (data||[]).filter(activityEventMatchesAudience);
  }catch(e){ console.error('refreshActivityEvents:', e); return; }
  updateActivityLogBadge();
  if(activityLogModalOpen) renderActivityLogList();
}

async function loadActivityEventsSeenMark(){
  try{
    if(!sb || !presenceEmail) return;
    const { data, error } = await sb.from('activity_events_seen').select('last_seen_at').eq('email', presenceEmail).maybeSingle();
    if(error) throw error;
    activityEventsLastSeenAt = (data && data.last_seen_at) || '1970-01-01T00:00:00Z';
  }catch(e){ console.error('loadActivityEventsSeenMark:', e); }
}

function updateActivityLogBadge(){
  const seenMs = new Date(activityEventsLastSeenAt).getTime();
  const count = activityEvents.filter(ev=> new Date(ev.created_at).getTime() > seenMs).length;
  ['activity-log-badge','activity-log-badge-scrapyard'].forEach(id=>{
    const badge = document.getElementById(id);
    if(!badge) return;
    badge.textContent = count>0 ? count : '';
    badge.style.display = count>0 ? 'flex' : 'none';
  });
}

/* الوقت المستخدم كـ"آخر قراءة" هو created_at (وقت السيرفر) لأحدث حدث ظاهر فعليًا حاليًا —
   مو وقت الجهاز (Date.now()) يلي ممكن ينحرف عن وقت السيرفر ويخلي أحداث جديدة توصل "قبل" وقت
   القراءة المسجّل فتبقى مخفية عن البادج للأبد. activityEvents مرتبة created_at تنازليًا فأول
   عنصر هو الأحدث. */
async function markActivityEventsSeen(){
  if(activityEvents.length) activityEventsLastSeenAt = activityEvents[0].created_at;
  updateActivityLogBadge();
  try{
    if(!sb || !presenceEmail) return;
    await sb.from('activity_events_seen').upsert({ email: presenceEmail, last_seen_at: activityEventsLastSeenAt }, { onConflict: 'email' });
  }catch(e){ console.error('markActivityEventsSeen:', e); }
}

function subscribeActivityEventsRealtime(){
  if(!sb || activityEventsChannel) return;
  activityEventsChannel = sb.channel('activity-events-changes')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'activity_events' }, ()=>{
      refreshActivityEvents();
    })
    .subscribe();
}

function activityLogListHtml(){
  if(!activityEvents.length) return '<p class="add-part-locked-hint">ما فيه إشعارات حتى الآن</p>';
  return '<div class="task-items-list">' + activityEvents.map(ev=>{
    const ms = new Date(ev.created_at).getTime();
    const clickable = !!ev.order_id;
    return '<div class="task-item-row'+(clickable?' activity-log-row':'')+'"'+(clickable?' data-open-order-id="'+escapeHtml(ev.order_id)+'"':'')+'><span class="task-item-text">'+escapeHtml(ev.message)+'</span><span class="muted" style="white-space:nowrap;">'+arabicRelativeTime(ms)+'</span></div>';
  }).join('') + '</div>';
}

function renderActivityLogList(){
  const listEl = document.getElementById('activity-log-list');
  if(listEl) listEl.innerHTML = activityLogListHtml();
}

function closeActivityLog(){
  const root = document.getElementById('modal-root');
  root.innerHTML='';
  root.classList.remove('modal-open');
  activityLogModalOpen = false;
  document.removeEventListener('keydown', activityLogEscListener);
}

/* دالة ثابتة (اسم واحد طول عمر الصفحة) بدل closure جديد كل فتحة — نفس مبدأ escListener/
   quoteEscListener بالضبط. لو صار فتح مزدوج (ضغطة مزدوجة على الجرس، أو إشعاري push متتاليين قبل
   ما يسكّر الأول) كانت كل فتحة تصنع دالة جديدة وتربطها، بس المتغيّر المشترك يضل يشاور بس على
   آخر وحدة — الأولى تبقى معلّقة على document للأبد وتقفل أي مودال مفتوح لاحقًا بضغطة Esc عادية
   لا علاقة إلها بالسجل. اسم ثابت = addEventListener المكرر ما بيعمل شي إضافي أصلًا. */
function activityLogEscListener(e){ if(e.key==='Escape') closeActivityLog(); }

async function openActivityLog(){
  if(activityLogModalOpen) return; // مفتوحة أصلًا — فتحة مزدوجة (جرس بضغطتين، إشعاري push ورا بعض)
  if(draft || quoteDraft){
    // نافذة تعديل طلبية أو تسعير مفتوحة حاليًا وممكن فيها تعديل غير محفوظ — ما نلمسها أبدًا.
    // الزر نفسه أصلًا غير قابل للوصول وقتها (خلفية المودال المفتوح تغطي شريط الزاوية)، بس
    // الضغط على إشعار push بيوصل هون مباشرة (postMessage) متجاوزًا هالحماية بالكامل.
    showToast('عندك نافذة مفتوحة حاليًا — سكّرها الأول وبعدين افتح سجل الإشعارات 🛎️', 'error');
    return;
  }
  activityLogModalOpen = true;
  // نجيب أحدث حالة قبل ما نعرض/نعلّم كمقروء — غير هيك فجوة ريل-تايم عابرة (شبكة انقطعت لحظة/
  // الجهاز كان نايم) بتخلي حدث وصل فعلًا يبقى غير مقروء للأبد لأنه ما انعلّم unseen أصلًا
  await refreshActivityEvents();
  if(draft || quoteDraft){ activityLogModalOpen = false; return; } // فُتحت نافذة تانية أثناء التحميل
  const root = document.getElementById('modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" data-close-confirm>' +
      '<div class="modal-card modal-card-sm" role="dialog" aria-modal="true">' +

        '<div class="modal-footer-actions" style="margin-top:16px;justify-content:flex-end;">' +
          '<button type="button" class="btn btn-ghost" id="close-activity-log-btn">إغلاق</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  root.classList.add('modal-open');
  root.querySelector('[data-close-confirm]').addEventListener('click', e=>{
    if(e.target.hasAttribute('data-close-confirm')) closeActivityLog();
  });
  root.querySelector('#close-activity-log-btn').addEventListener('click', closeActivityLog);
  // تفويض على الحاوية الثابتة #activity-log-list مش على كل صف — renderActivityLogList() (لو
  // وصل تحديث لحظي والنافذة مفتوحة) بيستبدل محتواها بالكامل، فربط مباشر على الصفوف كان رح يفقد
  // مستمعاته بأول تحديث (نفس درس [[feedback_partech_rebind_and_persist_result]])
  root.querySelector('#activity-log-list').addEventListener('click', e=>{
    const row = e.target.closest('.activity-log-row');
    if(!row) return;
    const orderId = row.getAttribute('data-open-order-id');

    // قائمته المحلية المحدودة (get_scrapyard_home_quotes ما ترجّع إلا طلبات التسعير النشطة، فأي
    // طلبية تحوّلت لطلبية عادية بعد ما اعتُمدت بتختفي من قائمته). بدون هالفحص كان الضغط يسكّر
    // السجل وما يصير أي شي — بدون أي تفسير للمستخدم.
    const order = appData.orders.find(o=>o.id===orderId);
    closeActivityLog();
    if(!order){
      showToast('الطلبية يلي يخصها هالإشعار ما عادت متوفرة', 'error');
      return;
    }
    if(currentUserRole==='scrapyard'){ openQuoteModal('edit', orderId, 'purchasing'); return; }
    // طلبية لسا بحالة "طلب تسعير" (ما اعتمدها المبيعات بعد) لازم تفتح بنافذة مراجعة التسعير
    // (فيها زر "اعتماد" الصريح) مش بنافذة تعديل الطلبية العادية — فتحها بالعادية كانت تسحبها من
    // قائمة "طلبات التسعير" لقائمة "الطلبيات" بصمت بدون ما حد يضغط اعتماد فعليًا
    if(order.isQuote){ openQuoteModal('edit', orderId); return; }
    openModal('edit', orderId);
  });
  document.addEventListener('keydown', activityLogEscListener);
  markActivityEventsSeen();
}

/* تفويض واحد على مستوى #modal-root، يُربط مرة وحدة طول عمر الصفحة (مو داخل attachModalHandlers —
   هاي بتنعاد كل ما تُفتح الطلبية أو تُحفظ وهي مفتوحة، وroot نفسه ثابت DOM node طول عمر الصفحة
   ومحتواه بس يتغيّر، فربط بالصف كان بيتراكم مستمعات بلا حد. نفس الجذر مستخدم كمان لمودال مراجعة
   الطلبات "📋 طلبات التعديل" — التفويض الواحد هاد بيغطّي أزرار القبول/الرفض/السحب هناك كمان،
   فما في داعي (ولا يصح) نربطها مرة تانية من جوا bindEditProposalsModalEvents. */
let editProposalDelegationBound = false;
function bindEditProposalGlobalDelegation(){
  if(editProposalDelegationBound) return;
  editProposalDelegationBound = true;
  const root = document.getElementById('modal-root');
  root.addEventListener('click', (e)=>{
    const reqBtn = e.target.closest('.field-request-btn');
    if(reqBtn){
      const fieldKey = reqBtn.getAttribute('data-request-field');
      const partId = reqBtn.getAttribute('data-part-id');
      if(reqBtn.hasAttribute('data-request-boolean')){
        const part = partId ? (draft.parts||[]).find(p=>p.id===partId) : null;
        const currentValue = partId ? !!(part && part[fieldKey]) : !!(draft && draft[fieldKey]);
        requestBooleanFieldChange(fieldKey, partId || null, currentValue);
        return;
      }
      composingProposalFields.add(composeKey(fieldKey, partId));
      refreshGatedFieldViews();
      return;
    }
    const cancelFieldBtn = e.target.closest('.field-request-cancel-btn');
    if(cancelFieldBtn){
      composingProposalFields.delete(composeKey(cancelFieldBtn.getAttribute('data-cancel-field'), cancelFieldBtn.getAttribute('data-part-id')));
      refreshGatedFieldViews();
      return;
    }
    const sendFieldBtn = e.target.closest('.field-request-send-btn');
    if(sendFieldBtn){
      sendFieldEditRequest(sendFieldBtn.getAttribute('data-send-field'), sendFieldBtn.getAttribute('data-part-id') || null);
      return;
    }
    const withdrawBtn = e.target.closest('.proposal-withdraw-btn');
    if(withdrawBtn){ withdrawEditProposal(withdrawBtn.getAttribute('data-withdraw-proposal')); return; }
    const acceptBtn = e.target.closest('.proposal-accept-btn');
    if(acceptBtn){ handleEditProposalDecision(acceptBtn.getAttribute('data-accept-proposal'), true); return; }
    const rejectBtn = e.target.closest('.proposal-reject-btn');
    if(rejectBtn){ handleEditProposalDecision(rejectBtn.getAttribute('data-reject-proposal'), false); return; }
  });
}

let scrapyardAppDataChannel = null;
/* عامر ما عنده اشتراك على جدول orders/tasks مباشرة أصلًا (بيقرأ القطع/المهام عن طريق RPC بس) — من دون هاد
   الاشتراك، أي تعديل يسويه صاحب الحساب على طلبية (تأكيد/توريد/سعر...) ما بينعكس عند عامر
   إلا بتحديث يدوي. صاحب الحساب نفسه عنده تحديثه الخاص جوا subscribeOrdersRealtime فما بيحتاج هاد. */
function subscribeScrapyardAppDataRealtime(){
  if(!sb || scrapyardAppDataChannel || scrapyardSharedState.canManage) return;
  scrapyardAppDataChannel = sb.channel('scrapyard-app-data-changes')
    // الطلبيات (وقطعها) صارت بجدول orders منفصل — بيؤثر على شاشتي التسوية والرئيسية (مؤشراتها مبنية على القطع)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, ()=>{
      const scrapRoot = document.getElementById('scrapyard-root');
      if(!scrapRoot || scrapRoot.style.display === 'none') return;
      if(scrapyardCurrentScreen === 'settlement'){
        if(!scrapyardHasOpenEdit()) loadScrapyardData(scrapyardSharedState.activeKind).then(renderScrapyardView);
      } else if(scrapyardCurrentScreen === 'home'){
        loadScrapyardHomeTotals().then(renderScrapyardHomeView);
      }
    })
    // المهام (purchases tasks) بجدول tasks منفصل — بيؤثر بس على الرئيسية (المهام مطوية فيها)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, ()=>{
      const scrapRoot = document.getElementById('scrapyard-root');
      if(!scrapRoot || scrapRoot.style.display === 'none') return;
      if(scrapyardCurrentScreen === 'home'){
        loadScrapyardHomeTotals().then(renderScrapyardHomeView);
      }
    })
    // قائمة الموردين/التشاليح — لو صاحب الحساب أضاف مورد جديد وعامر فاتح شاشة التسوية وقتها
    .on('postgres_changes', { event: '*', schema: 'public', table: 'suppliers' }, ()=>{
      const scrapRoot = document.getElementById('scrapyard-root');
      if(!scrapRoot || scrapRoot.style.display === 'none') return;
      if(scrapyardCurrentScreen === 'settlement'){
        if(!scrapyardHasOpenEdit()) loadScrapyardData(scrapyardSharedState.activeKind).then(renderScrapyardView);
      }
    })
    // عهدة عامر (treasury_entries) — لو صاحب الحساب سدد لعهدة عامر وعامر فاتح شاشة سداد التشاليح أو الرئيسية وقتها
    .on('postgres_changes', { event: '*', schema: 'public', table: 'treasury_entries' }, ()=>{
      const scrapRoot = document.getElementById('scrapyard-root');
      if(!scrapRoot || scrapRoot.style.display === 'none') return;
      if(scrapyardCurrentScreen === 'settlement' && scrapyardSharedState.activeKind === 'used'){
        if(!scrapyardHasOpenEdit()) loadScrapyardData('used').then(renderScrapyardView);
      } else if(scrapyardCurrentScreen === 'home'){
        loadScrapyardHomeTotals().then(renderScrapyardHomeView);
      }
    })
    .subscribe();
}

function dmyToIso(str){
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(str||'').trim());
  if(!m) return '';
  return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
}

function isoToDmy(str){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(str||'').trim());
  if(!m) return '';
  return m[3]+'/'+m[2]+'/'+m[1];
}

function parseDMY(str){
  if(!str) return null;
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(str).trim());
  if(!m) return null;
  const d = new Date(parseInt(m[3],10), parseInt(m[2],10)-1, parseInt(m[1],10));
  return isNaN(d.getTime()) ? null : d;
}

function dateMatchesPeriod(d, periodKey, customMonth, rangeFrom, rangeTo){
  periodKey = periodKey || treasuryPeriodFilter;
  if(periodKey === 'all') return true;
  if(!d) return false;
  if(periodKey === 'customMonth'){
    const m = /^(\d{4})-(\d{2})$/.exec(customMonth||'');
    if(!m) return true;
    return d.getFullYear()===parseInt(m[1],10) && d.getMonth()===(parseInt(m[2],10)-1);
  }
  if(periodKey === 'customRange'){
    const from = /^\d{4}-\d{2}-\d{2}$/.test(rangeFrom||'') ? new Date(rangeFrom+'T00:00:00') : null;
    const to = /^\d{4}-\d{2}-\d{2}$/.test(rangeTo||'') ? new Date(rangeTo+'T00:00:00') : null;
    if(from && d.getTime() < from.getTime()) return false;
    if(to && d.getTime() > to.getTime()) return false;
    return true;
  }
  const now = new Date();
  const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if(periodKey === 'today'){
    return d.getTime() === today0.getTime();
  }
  if(periodKey === 'week'){
    const weekStart = new Date(today0); weekStart.setDate(weekStart.getDate() - now.getDay());
    return d.getTime() >= weekStart.getTime() && d.getTime() <= today0.getTime();
  }
  if(periodKey === 'month'){
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  }
  if(periodKey === 'lastMonth'){
    const lm = new Date(now.getFullYear(), now.getMonth()-1, 1);
    return d.getFullYear()===lm.getFullYear() && d.getMonth()===lm.getMonth();
  }
  return true;
}

function entryMatchesPeriod(entry){
  if(treasuryPeriodFilter === 'all') return true;
  return dateMatchesPeriod(parseDMY(entry.date), treasuryPeriodFilter);
}

/* ---------- تقرير "حركة الحسابات" اليومي ---------- */
/* دفعات الزبائن ومصاريف/دعم/عهدة الصندوق عندها تاريخ حقيقي لكل حركة (entry.date / payment.date)
   فيها نعتمد عليه مباشرة. سداد المورد/التشليح (paidToSupplier/paidToAmer) كانت مجرد علامة صح
   بدون تاريخ لحظة السداد نفسها — أضفنا paidToSupplierAt/paidToAmerAt (بالتوازي مع الحقلين
   القديمين، انظر أزرار المجموع للمورد/للتشليح بنافذة الطلبية) فمن تاريخ إضافتها فصاعدًا بيظهروا
   هون؛ الطلبيات المسدّدة قبل هالتاريخ ما إلها تاريخ سداد مسجّل، فما تظهر بأي يوم محدد. */
function isoDateMatches(d, isoDate){
  if(!d || isNaN(d.getTime())) return false;
  return dateMatchesPeriod(d, 'customRange', '', isoDate, isoDate);
}

function accountsActivityForDate(isoDate){
  const matchDmy = (dateStr)=> isoDateMatches(parseDMY(dateStr), isoDate);
  const matchIso = (isoStr)=>{
    if(!isoStr) return false;
    const dt = new Date(isoStr);
    if(isNaN(dt.getTime())) return false;
    return isoDateMatches(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()), isoDate);
  };

  const customerPayments = [], customerRefunds = [], supplierPayments = [], expenses = [], support = [], custody = [];

  (appData.orders||[]).forEach(o=>{
    if(o.isQuote) return;
    (o.customerPayments||[]).forEach(p=>{
      if(!matchDmy(p.date)) return;
      const row = { orderNumber: o.orderNumber, orderLabel: o.orderLabel, amount: Number(p.amount)||0, method: p.method||'' };
      if(p.returnAdjustment) customerRefunds.push(row); else customerPayments.push(row);
    });
    if(matchIso(o.paidToSupplierAt)){
      supplierPayments.push({ orderNumber: o.orderNumber, orderLabel: o.orderLabel, amount: orderTotals(o).costToSupplier, kind: 'مورد' });
    }
    if(matchIso(o.paidToAmerAt)){
      supplierPayments.push({ orderNumber: o.orderNumber, orderLabel: o.orderLabel, amount: orderTotals(o).costToScrapyard, kind: 'تشليح' });
    }
  });

  EXPENSE_CATEGORIES.forEach(c=>{
    (appData.treasury[c.key]||[]).forEach(entry=>{
      if(!matchDmy(entry.date)) return;
      expenses.push({ label: c.label, amount: Number(entry.amount)||0, note: entry.note||'' });
    });
  });
  (appData.treasury.support||[]).forEach(entry=>{
    if(!matchDmy(entry.date)) return;
    support.push({ amount: Number(entry.amount)||0, note: entry.note||'' });
  });
  (appData.treasury.amerCustody||[]).forEach(entry=>{
    if(!matchDmy(entry.date)) return;
    custody.push({ amount: Number(entry.amount)||0, note: entry.note||'' });
  });

  const sum = arr => round2(arr.reduce((s,r)=> s + (Number(r.amount)||0), 0));
  return {
    customerPayments, customerRefunds, supplierPayments, expenses, support, custody,
    totals: {
      customerPayments: sum(customerPayments),
      customerRefunds: sum(customerRefunds),
      supplierPayments: sum(supplierPayments),
      expenses: sum(expenses),
      support: sum(support),
      custody: sum(custody)
    }
  };
}

function orderDateMatchesPeriod(order){
  if(treasuryPeriodFilter === 'all') return true;
  if(!order.updatedAt) return false;
  const dt = new Date(order.updatedAt);
  if(isNaN(dt.getTime())) return false;
  return dateMatchesPeriod(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()), treasuryPeriodFilter);
}

function orderMatchesExtraIndicatorsPeriod(order){
  if(extraIndicatorsPeriod === 'all') return true;
  // بنصنّف حسب تاريخ التوريد، وإلا تاريخ الإنشاء — مش updatedAt: أي تعديل لاحق (حفظ، تأكيد،
  // أرشفة، حتى حفظ بيانات الفاتورة) كان بينقل كل تكاليف وأرباح طلبية قديمة لفترة اليوم،
  // فتظهر أرقام شهور ماضية وهي تتحرك كل ما حدا يفتح طلبية قديمة ويحفظها.
  const basis = order.suppliedAt || order.createdAt || order.updatedAt;
  if(!basis) return false;
  const dt = new Date(basis);
  if(isNaN(dt.getTime())) return false;
  return dateMatchesPeriod(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()), extraIndicatorsPeriod, extraIndicatorsCustomMonth, extraIndicatorsRangeFrom, extraIndicatorsRangeTo);
}

function entryMatchesExtraIndicatorsPeriod(entry){
  if(extraIndicatorsPeriod === 'all') return true;
  return dateMatchesPeriod(parseDMY(entry.date), extraIndicatorsPeriod, extraIndicatorsCustomMonth, extraIndicatorsRangeFrom, extraIndicatorsRangeTo);
}

function computeTreasuryVolumes(){
  // !o.isQuote زي computeAggregateFinancials — طلبية رجعت لحالة تسعيرة كانت تضل تضخّم
  // حجم الشراء/المبيعات/الأرباح مع إنها خارج الحسابات المالية بكل مكان تاني
  const orders = appData.orders.filter(o=>o.confirmed && !o.isQuote).filter(orderMatchesExtraIndicatorsPeriod);
  let paidToSuppliersTotal = 0, paidToScrapyardTotal = 0, customerReceiptsTotal = 0, collectedProfit = 0, fullProfit = 0;
  let costToSuppliersTotal = 0, costToScrapyardTotal = 0, sellTotalSum = 0;
  orders.forEach(o=>{
    const t = orderTotals(o);
    if(o.paidToSupplier) paidToSuppliersTotal += t.costToSupplier;
    if(o.paidToAmer) paidToScrapyardTotal += t.costToScrapyard;
    // costToSuppliersTotal/costToScrapyardTotal = التكلفة الكاملة بغض النظر عن حالة السداد —
    // "حجم الشراء" الرئيسي بقى يعرض هاي (الكامل)، و"تم سداد منه" بيعرض المدفوع فعليًا تحته
    costToSuppliersTotal += t.costToSupplier;
    costToScrapyardTotal += t.costToScrapyard;
    customerReceiptsTotal += t.customerPaidAmount;
    sellTotalSum += t.sellTotal;
    // fullProfit = الربح الكامل (سعر البيع - التكلفة) بغض النظر عن قد ايش الزبون دفع فعليًا —
    // بقى الرقم الرئيسي لـ"حجم الأرباح"، وcollectedProfit بقى "تم سداد منه" تحته
    if(t.hasSell){ collectedProfit += t.collectedProfit; fullProfit += t.profit; }
  });
  return {
    purchaseVolume: round2(costToSuppliersTotal + costToScrapyardTotal),
    purchaseVolumePaid: round2(paidToSuppliersTotal + paidToScrapyardTotal),
    paidToSuppliersVolume: round2(paidToSuppliersTotal),
    paidToScrapyardVolume: round2(paidToScrapyardTotal),
    costToSuppliersVolume: round2(costToSuppliersTotal),
    costToScrapyardVolume: round2(costToScrapyardTotal),
    salesVolume: round2(sellTotalSum),
    salesVolumePaid: round2(customerReceiptsTotal),
    profitVolume: round2(fullProfit),
    profitVolumePaid: round2(collectedProfit)
  };
}

function treasurySupportTotal(matchFn){
  const filterFn = matchFn || entryMatchesPeriod;
  return round2((appData.treasury.support||[]).filter(filterFn).reduce((sum,entry)=> sum + (Number(entry.amount)||0), 0));
}

function treasuryTotals(){
  // إجمالي المصاريف/الدعم المعروضة داخل قسم "المصاريف" نفسه — تتبع فلتر ذاك القسم (treasuryPeriodFilter)
  let totalExpenses = 0;
  EXPENSE_CATEGORIES.forEach(c=>{
    (appData.treasury[c.key]||[]).filter(entryMatchesPeriod).forEach(entry=>{ totalExpenses += Number(entry.amount)||0; });
  });
  totalExpenses = round2(totalExpenses);
  const totalSupport = treasurySupportTotal();

  // "الصندوق حاليًا"/"بافتراض انتهاء التحصيل والسداد"/"مستحق من الزبائن"/"الديون للموردين"/
  // "الربح غير المحصّل" هي لقطة حالة حالية (زي كشف حساب) — لازم تكون all-time دايمًا، بغض النظر
  // عن فلتر "مؤشرات إضافية" (extraIndicatorsPeriod). قبل هذا الإصلاح كانت هذي المؤشرات تُفلتر
  // بنفس فلتر الفترة، فديون/مستحقات من طلبيات قديمة خارج الفترة المختارة (مثلاً فتحت الفلتر
  // بس عشان تشوف حجم مبيعات الشهر) كانت تختفي بصمت من "الصندوق بافتراض انتهاء التحصيل والسداد"
  // — وبالأخص كانت تختلط بمجاميع تانية (amerCustodyBalance، مرتجعات الموردين، مرتجعات
  // العملاء المعلّقة) ما كانت أصلًا تتفلتر بالفترة أبدًا، فالخليط ما كان يمثّل ولا حالة منطقية
  // (لا لقطة حالية ولا حصر لفترة). نفس مبدأ renderKPIs() بالصفحة الرئيسية (all-time دايمًا)
  // وcomputeAllTimeTreasurySummary() (كانت أصلًا حل مؤقت لهاي بالضبط، بس لتصدير Excel فقط).
  const fSnapshot = computeAggregateFinancials();
  let allTimeExpenses = 0;
  EXPENSE_CATEGORIES.forEach(c=>{
    (appData.treasury[c.key]||[]).forEach(entry=>{ allTimeExpenses += Number(entry.amount)||0; });
  });
  allTimeExpenses = round2(allTimeExpenses);

  // مؤشرات "📊 مؤشرات إضافية" (حجم الشراء/البيع/المصاريف/الأرباح/صافي الأرباح الشهرية) هي
  // الوحيدة المفروض تتبع فلتر الفترة — موسمية بطبيعتها.
  let extraIndicatorsExpenses = 0;
  const extraIndicatorsExpensesByCategory = [];
  EXPENSE_CATEGORIES.forEach(c=>{
    let categoryTotal = 0;
    (appData.treasury[c.key]||[]).filter(entryMatchesExtraIndicatorsPeriod).forEach(entry=>{ categoryTotal += Number(entry.amount)||0; });
    extraIndicatorsExpenses += categoryTotal;
    if(categoryTotal>0) extraIndicatorsExpensesByCategory.push({ label: c.label, amount: categoryTotal });
  });
  const custodyDeficit = amerCustodyDeficit();
  const custodyBalance = amerCustodyBalance();
  const supportAllTime = treasurySupportTotal(()=>true);
  const custodyTopupsAllTime = amerCustodyTopupsTotalAll();
  const paidToScrapyardForCustody = paidToScrapyardTotalForCustody();
  const supplierReturnReceivables = totalSupplierReturnReceivables();
  const customerRefundsPending = totalCustomerRefundsPending();
  // صافي الصندوق = نقدي حقيقي: كل ما دفعه الزبائن + دعم خارجي، ناقص كل ما دُفع فعليًا للموردين + كل ما سُدد لعهدة عامر، ناقص مصاريف الصندوق (all-time)
  // (سداد طلبية "تم سداد التشليح" ما يأثر على الصندوق مباشرة — يُخصم من عهدة عامر بس، لحد ما تسدد لعهدة عامر فعليًا)
  const net = round2(fSnapshot.customerReceiptsTotal + supportAllTime - fSnapshot.paidToSuppliersTotal - custodyTopupsAllTime - allTimeExpenses);
  // الصندوق بافتراض انتهاء التحصيل والسداد = لو تحصّلت كل ديون الزبائن، ودُفعت كل مستحقات الموردين،
  // وسدّدت عجز عهدة عامر (اللي دفعه فعليًا للتشاليح ولسه ما رجّعتله) + كل الطلبيات يلي لسه ما تسدد للتشليح،
  // وكمان لو تحصّلت كل مرتجعات الموردين المعلّقة ورجعت كل مبالغ العملاء المعلّقة
  // + amerCustodyBalance() (الرصيد بإشارته) بدل - custodyDeficit: لو الرصيد سالب فهو نفس
  // الطرح القديم بالضبط، بس لو عامر ماسك فلوس ما صرفها بعد (رصيد موجب) فهاي كاش خرج من
  // الصندوق (انطرح ضمن net) ولسه قابل للاسترجاع ورح يغطي جزء من "مستحق للتشليح" — كان
  // بينخصم مرتين وبيطلّع الرقم أقل من الواقع.
  const netAfterSettlement = round2(net + fSnapshot.dueFromCustomers + custodyBalance - fSnapshot.dueToScrapyard - fSnapshot.dueToSuppliers + supplierReturnReceivables - customerRefundsPending);
  // الديون للموردين = عجز عهدة عامر (تشاليح مدفوعة فعليًا ولسه ما رجّعتلها) + الطلبيات يلي لسه ما تسدد للتشليح + المستحق للموردين
  const debtsToSuppliers = round2(custodyDeficit + fSnapshot.dueToScrapyard + fSnapshot.dueToSuppliers);
  const volumes = computeTreasuryVolumes();
  // صافي الأرباح الشهرية الفعلي = أرباح الطلبيات المحصّلة فعليًا بالشهر المحدد ناقص مصاريف نفس الشهر
  const netProfitVolume = round2(volumes.profitVolumePaid - extraIndicatorsExpenses);
  // بافتراض السداد والتحصيل = نفس الشي بس بافتراض إنه كل زبون بطلبيات الشهر دفع المستحق عليه
  // بالكامل — الربح الكامل (سعر البيع - التكلفة) بدل المحصّل بس. التكلفة نفسها ثابتة بغض النظر
  // عن سداد المورد/التشليح من عدمه (الربح محاسبيًا مبني على الالتزام لا الدفع الفعلي)، فالسداد
  // (تجاه المورد) ما يغيّر رقم الربح — بس خلّينا الاسم مطابق لمؤشر الصندوق المماثل للاتساق.
  const netProfitVolumeAfterSettlement = round2(volumes.profitVolume - extraIndicatorsExpenses);

  // تفاصيل كل مؤشر — لعرضها كتوضيح بسيط لما المستخدم يضغط على الكارت بالواجهة
  const term = (label, amount)=> ({ label, amount: Math.abs(round2(amount)), negative: amount<0 });
  const breakdowns = {
    net: [
      term('دفعات الزبائن (صافي)', fSnapshot.customerReceiptsTotal),
      term('الدعم الخارجي', supportAllTime),
      term('المدفوع للموردين', -fSnapshot.paidToSuppliersTotal),
      term('سداد عهدة المشتريات', -custodyTopupsAllTime),
      term('المصاريف', -allTimeExpenses)
    ],
    netAfterSettlement: [
      term('الصندوق حاليًا', net),
      term('مستحق من الزبائن', fSnapshot.dueFromCustomers),
      term('رصيد المشتريات', custodyBalance),
      term('مستحق للتشليح', -fSnapshot.dueToScrapyard),
      term('مستحق للموردين', -fSnapshot.dueToSuppliers),
      term('مرتجعات مستحقة لنا', supplierReturnReceivables),
      term('مرتجعات مستحقة للعملاء', -customerRefundsPending)
    ],
    uncollectedProfit: [
      term('الربح المحصّل (كل الطلبيات)', fSnapshot.collectedProfit),
      term('الربح غير المحصّل', fSnapshot.uncollectedProfit)
    ],
    debtsToSuppliers: [
      term('عجز عهدة المشتريات', custodyDeficit),
      term('مستحق للتشليح', fSnapshot.dueToScrapyard),
      term('مستحق للموردين', fSnapshot.dueToSuppliers)
    ],
    amerCustodyBalance: [
      term('إجمالي المسدد للعهدة (بالإشارة)', custodyTopupsAllTime),
      term('المدفوع فعليًا للتشليح من العهدة', -paidToScrapyardForCustody)
    ],
    dueFromCustomers: { note: fSnapshot.dueFromCustomersCount>0
      ? 'مجموع المتبقي على '+fSnapshot.dueFromCustomersCount+' طلبية مسلّمة لسه ما سُددت بالكامل'
      : 'ما فيه طلبيات مسلّمة عليها مبلغ متبقي حاليًا' },
    purchaseVolume: [
      term('التكلفة الكاملة — للموردين (بالفترة)', volumes.costToSuppliersVolume),
      term('التكلفة الكاملة — للتشليح (بالفترة)', volumes.costToScrapyardVolume),
      term('تم سداد منه — للموردين (بالفترة)', volumes.paidToSuppliersVolume),
      term('تم سداد منه — للتشليح (بالفترة)', volumes.paidToScrapyardVolume)
    ],
    salesVolume: [
      term('إجمالي مستحق الزبائن (بالفترة)', volumes.salesVolume),
      term('تم تحصيل (بالفترة)', volumes.salesVolumePaid)
    ],
    expensesVolume: extraIndicatorsExpensesByCategory.length
      ? extraIndicatorsExpensesByCategory.map(c=> term(c.label, c.amount))
      : { note: 'ما فيه مصاريف مسجّلة بهذه الفترة' },
    profitVolume: [
      term('الربح الكامل (بافتراض التحصيل)', volumes.profitVolume),
      term('تم تحصيل', volumes.profitVolumePaid)
    ],
    netProfitVolumeAfterSettlement: [
      term('الربح الكامل (بافتراض التحصيل)', volumes.profitVolume),
      term('المصاريف (الفترة)', -extraIndicatorsExpenses),
      term('تم تحصيل منه (صافي)', netProfitVolume)
    ]
  };

  return {
    totalExpenses, totalSupport, net, netAfterSettlement, debtsToSuppliers, dueFromCustomers: fSnapshot.dueFromCustomers, uncollectedProfit: fSnapshot.uncollectedProfit,
    purchaseVolume: volumes.purchaseVolume, purchaseVolumePaid: volumes.purchaseVolumePaid, salesVolume: volumes.salesVolume, salesVolumePaid: volumes.salesVolumePaid, profitVolume: volumes.profitVolume, profitVolumePaid: volumes.profitVolumePaid,
    expensesVolume: round2(extraIndicatorsExpenses),
    netProfitVolume: netProfitVolume, netProfitVolumeAfterSettlement: netProfitVolumeAfterSettlement,
    amerCustodyBalance: custodyBalance, amerCustodyDeficit: custodyDeficit,
    breakdowns
  };
}

function computeAllTimeTreasurySummary(){
  const savedPeriod = treasuryPeriodFilter;
  const savedExtraPeriod = extraIndicatorsPeriod;
  const savedExtraMonth = extraIndicatorsCustomMonth;
  treasuryPeriodFilter = 'all';
  extraIndicatorsPeriod = 'all';
  extraIndicatorsCustomMonth = '';
  const t = treasuryTotals();
  treasuryPeriodFilter = savedPeriod;
  extraIndicatorsPeriod = savedExtraPeriod;
  extraIndicatorsCustomMonth = savedExtraMonth;
  return t;
}

}

function accountsActivityModalHtml(){
  const iso = accountsActivityDate || dmyToIso(todayNumeric());
  const todayIso = dmyToIso(todayNumeric());
  const yesterdayIso = (()=>{ const d = new Date(); d.setDate(d.getDate()-1); return dmyToIso(String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()); })();
  const a = accountsActivityForDate(iso);

  const paymentsRowsHtml = a.customerPayments.map(r=>
    '<div class="purchase-history-row">' + accountsActivityRowHtml(
      r.orderNumber+(r.orderLabel?' — '+r.orderLabel:''),
      r.method==='cash'?'كاش':(r.method==='card'?'شبكة':''),
      r.amount, 'text-green'
    ) + '</div>'
  ).join('');
  const refundsRowsHtml = a.customerRefunds.map(r=>
    '<div class="purchase-history-row">' + accountsActivityRowHtml(
      r.orderNumber+(r.orderLabel?' — '+r.orderLabel:''), 'مرتجع', r.amount, 'text-amber'
    ) + '</div>'
  ).join('');
  const supplierRowsHtml = a.supplierPayments.map(r=>
    '<div class="purchase-history-row">' + accountsActivityRowHtml(
      r.orderNumber+(r.orderLabel?' — '+r.orderLabel:''), 'تسديد '+r.kind, r.amount, 'text-rust'
    ) + '</div>'
  ).join('');
  const expensesRowsHtml = a.expenses.map(r=>
    '<div class="purchase-history-row">' + accountsActivityRowHtml(r.label, r.note, r.amount, 'text-rust') + '</div>'
  ).join('');
  const supportRowsHtml = a.support.map(r=>
    '<div class="purchase-history-row">' + accountsActivityRowHtml('دعم الصندوق من الخارج', r.note, r.amount, 'text-green') + '</div>'
  ).join('');
  const custodyRowsHtml = a.custody.map(r=>

      (r.amount<0?'سحب من عهدة المشتريات':'سداد لعهدة المشتريات'), r.note, r.amount, (r.amount<0?'text-green':'text-rust')
    ) + '</div>'

  // مرتجعات الزبائن (دفعة returnAdjustment) مو خروج كاش فعلي بتاريخها — القطعة رجعت وصار فيه
  // التزام برد المبلغ، بس الكاش ما يطلع من الصندوق فعليًا إلا لحظة "تم رد المبلغ للزبون"
  // (customerRefundConfirmed)، وهاي كمان بلا تاريخ مسجّل حاليًا (نفس فجوة سداد المورد/التشليح).
  // فنعرض القسم للمعلومة بس ما ندخله بصافي حركة اليوم حتى ما نوهم إنه كاش طلع فعليًا.
  const netTotal = round2(a.totals.customerPayments - a.totals.supplierPayments - a.totals.expenses + a.totals.support - a.totals.custody);
  const hasAnything = a.customerPayments.length || a.customerRefunds.length || a.supplierPayments.length || a.expenses.length || a.support.length || a.custody.length;

  return '<div class="modal-backdrop" data-close-backdrop>' +
    '<div class="modal-card modal-card-sm" role="dialog" aria-modal="true">' +
      '<div class="modal-header"><div class="modal-title">📜 حركة الحسابات</div>' +
        '<button type="button" class="icon-btn" id="accounts-activity-close-btn" aria-label="إغلاق">✕</button></div>' +

      '</div>' +
      '<div class="treasury-summary" style="margin-bottom:6px;">' +
        '<div class="treasury-summary-row"><span>صافي حركة اليوم</span><span class="num '+(netTotal<0?'text-rust':'text-green')+'">'+fmtSigned(netTotal)+'</span></div>' +
      '</div>' +

function openAccountsActivityModal(){
  accountsActivityDate = dmyToIso(todayNumeric());
  const root = document.getElementById('modal-root');
  root.innerHTML = accountsActivityModalHtml();
  root.classList.add('modal-open');
  bindAccountsActivityModalEvents();
}

function refreshAccountsActivityModal(){
  const root = document.getElementById('modal-root');
  root.innerHTML = accountsActivityModalHtml();
  bindAccountsActivityModalEvents();
}

function closeAccountsActivityModal(){
  const root = document.getElementById('modal-root');
  root.innerHTML = '';
  root.classList.remove('modal-open');
}

function bindAccountsActivityModalEvents(){
  const root = document.getElementById('modal-root');
  root.querySelector('[data-close-backdrop]').addEventListener('click', e=>{
    if(e.target.hasAttribute('data-close-backdrop')) closeAccountsActivityModal();
  });
  root.querySelector('#accounts-activity-close-btn').addEventListener('click', closeAccountsActivityModal);
  root.querySelectorAll('[data-activity-date]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      accountsActivityDate = btn.getAttribute('data-activity-date');
      refreshAccountsActivityModal();
    });
  });
  const dateInput = root.querySelector('#accounts-activity-date-input');
  if(dateInput){
    dateInput.addEventListener('change', ()=>{
      if(!dateInput.value) return;
      accountsActivityDate = dateInput.value;
      refreshAccountsActivityModal();
    });
  }
}

function bindTreasuryPeriodFilter(){
  const toggleBtn = document.getElementById('btn-toggle-treasury-filter');
  if(toggleBtn){
    toggleBtn.addEventListener('click', ()=>{
      treasuryFilterOpen = !treasuryFilterOpen;
      const el = document.getElementById('treasury-period-filter');
      if(el) el.style.display = treasuryFilterOpen ? 'flex' : 'none';
    });
  }
  const el = document.getElementById('treasury-period-filter');
  if(!el) return;
  el.querySelectorAll('[data-period]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      treasuryPeriodFilter = btn.getAttribute('data-period');
      treasuryFilterOpen = true;
      renderTreasuryView();
    });
  });
}

function bindExtraIndicatorsFilter(){
  const toggleBtn = document.getElementById('btn-toggle-extra-filter');
  if(toggleBtn){
    toggleBtn.addEventListener('click', ()=>{
      extraIndicatorsFilterOpen = !extraIndicatorsFilterOpen;
      const el = document.getElementById('extra-indicators-period-filter');
      if(el) el.style.display = extraIndicatorsFilterOpen ? 'flex' : 'none';
    });
  }
  const el = document.getElementById('extra-indicators-period-filter');
  if(!el) return;
  el.querySelectorAll('[data-extra-period]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      extraIndicatorsPeriod = btn.getAttribute('data-extra-period');
      extraIndicatorsCustomMonth = '';
      extraIndicatorsRangeFrom = '';
      extraIndicatorsRangeTo = '';
      extraIndicatorsFilterOpen = true;
      renderTreasuryView();
    });
  });
  const monthInput = document.getElementById('extra-indicators-month-input');
  if(monthInput){
    monthInput.addEventListener('change', e=>{
      if(!e.target.value) return;
      extraIndicatorsPeriod = 'customMonth';
      extraIndicatorsCustomMonth = e.target.value;
      extraIndicatorsRangeFrom = '';
      extraIndicatorsRangeTo = '';
      extraIndicatorsFilterOpen = true;
      renderTreasuryView();
    });
  }
  const rangeFromInput = document.getElementById('extra-indicators-range-from');
  const rangeToInput = document.getElementById('extra-indicators-range-to');
  const applyRangeFilter = ()=>{
    const from = rangeFromInput ? rangeFromInput.value : '';
    const to = rangeToInput ? rangeToInput.value : '';
    if(!from && !to) return;
    extraIndicatorsPeriod = 'customRange';
    extraIndicatorsCustomMonth = '';
    extraIndicatorsRangeFrom = from;
    extraIndicatorsRangeTo = to;
    extraIndicatorsFilterOpen = true;
    renderTreasuryView();
  };
  if(rangeFromInput) rangeFromInput.addEventListener('change', applyRangeFilter);
  if(rangeToInput) rangeToInput.addEventListener('change', applyRangeFilter);
}
