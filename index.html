function ownerScrapyardPartsFromAppData(kind){
  const list = [];
  const paidField = SETTLEMENT_KINDS[kind].paidField;
  const wantUsed = kind === 'used';
  // الطلبيات يلي تم توريدها فقط — غير الموردة ما بتظهر بشاشة السداد
  appData.orders.filter(o=>o.supplied && !o[paidField]).forEach(o=>{
    (o.parts||[]).forEach(p=>{
      if(p.returned) return; // القطعة المرتجعة لها مسارها المنفصل (مرتجعات)، مو ضمن قائمة "غير المسدّدة"
      if(!partIsIncludedInOrder(o,p)) return; // قطعة مستبعدة يدويًا من الطلبية — ما تُحسب
      if(!!p.used === wantUsed){
        list.push({ order_id:o.id, order_number:o.orderNumber, order_label:o.orderLabel, supplied_at:o.suppliedAt||null, part_id:p.id, description:p.description, qty:p.qty, cost_price:p.costPrice, supplier_id:p.supplierId||null });
      }
    });
  });
  // من الأحدث للأقدم حسب تاريخ التوريد (نفس ترتيب الدالتين عند عامر) — الطلبيات بدون تاريخ توريد تنزل آخر شي
  list.sort((a,b)=>{
    if(!a.supplied_at && !b.supplied_at) return 0;
    if(!a.supplied_at) return 1;
    if(!b.supplied_at) return -1;
    return new Date(b.supplied_at) - new Date(a.supplied_at);
  });
  return list;
}

/* قطع مرتجعة مدفوعة مسبقًا وبانتظار التحصيل — تُخصم من إجمالي المستحق للسداد بهذه الشاشة
   (لصاحب الحساب محليًا؛ لعامر عن طريق get_scrapyard_return_receivables). عرض فقط، بدون
   إمكانية تأكيد التحصيل هون — هذا حصريًا بشاشة الموردين عند صاحب الحساب. */
function ownerScrapyardReturnReceivablesFromAppData(kind){
  const list = [];
  const wantUsed = kind === 'used';
  appData.orders.filter(o=>o.confirmed).forEach(o=>{
    (o.parts||[]).forEach(p=>{
      if(!p.returned || !p.returnHasReceivable || p.returnCollected) return;
      if(!!p.used !== wantUsed) return;
      if(!partIsIncludedInOrder(o,p)) return; // قطعة مستبعدة يدويًا من الطلبية — ما تُحسب
      list.push({ order_id:o.id, order_number:o.orderNumber, order_label:o.orderLabel, part_id:p.id, description:p.description, qty:p.qty, cost_price:p.costPrice, supplier_id:p.supplierId||null });
    });
  });
  return list;
}

/* رجوع عامر لصفحته الرئيسية — بيحدّث المجاميع والمهام أول ما يرجع */
function goToScrapyardHome(){
  loadScrapyardHomeTotals().then(renderScrapyardHomeView);
}

/* يُستخدم فقط لصفحة عامر الرئيسية — يجيب مجموع كل نوع (تشاليح + جديد) للمؤشرات، والمهام،
   وكمان بيانات طلبات التسعير (orders/customers/suppliers) حتى تصير جاهزة لقسم "طلبات التسعير"
   المطوي بنفس الصفحة بدون أي طلب إضافي، ولمؤشر عددها المعلّق. */
async function loadScrapyardHomeTotals(){
  // شاشة عامر الرئيسية بتستخدم appData.orders بس لقائمة طلبات التسعير (isQuote=true) — أي
  // طلبيات فعلية مسددة/غير مسددة ثانية ما بتنعرض هون أبدًا. لهيك بنجيبها عبر RPC مخصص
  // (get_scrapyard_home_quotes) بيرجّع طلبات التسعير بس وبيصفّر sellPrice من كل قطعة، بدل
  // sb.from('orders').select('*') يلي كان يجيب كل الطلبيات المسموح لعامر يشوفها بكل أعمدتها —
  // بما فيها سعر البيع وهامش الربح لطلبيات حقيقية — لجهازه مباشرة رغم إن الواجهة ما بتعرضهم له.
  const [usedRes, newRes, tasksRes, suppliersRes, ordersRes, customersRes, custodyRes] = await Promise.all([
    sb.rpc('get_scrapyard_used_parts'),
    sb.rpc('get_new_parts_supplier'),
    sb.rpc('get_purchases_tasks'),
    sb.from('suppliers').select('*'),
    sb.rpc('get_scrapyard_home_quotes'),
    sb.from('customers').select('*'),
    sb.from('treasury_entries').select('id').eq('category','amerCustody')
  ]);
  if(usedRes.error) console.error('get_scrapyard_used_parts:', usedRes.error);
  if(newRes.error) console.error('get_new_parts_supplier:', newRes.error);
  if(tasksRes.error) console.error('get_purchases_tasks:', tasksRes.error);
  if(suppliersRes.error) console.error('suppliers:', suppliersRes.error);
  if(ordersRes.error) console.error('get_scrapyard_home_quotes:', ordersRes.error);
  if(customersRes.error) console.error('customers:', customersRes.error);
  if(custodyRes.error) console.error('treasury_entries (amerCustody):', custodyRes.error);
  scrapyardSharedState.partsByKind.used = usedRes.error ? [] : (usedRes.data || []);
  scrapyardSharedState.partsByKind.new = newRes.error ? [] : (newRes.data || []);
  scrapyardSharedState.tasks = tasksRes.error ? [] : (tasksRes.data || []);
  scrapyardSharedState.suppliers = suppliersRes.error ? [] : (suppliersRes.data || []);
  appData.suppliers = suppliersRes.error ? [] : groupSupplierOrCustomerRows(suppliersRes.data);
  appData.orders = ordersRes.error ? [] : (ordersRes.data||[]).map(orderRowToObject);
  appData.customers = customersRes.error ? [] : groupSupplierOrCustomerRows(customersRes.data);
  scrapyardSharedState.custodyEntryCount = custodyRes.error ? 0 : (custodyRes.data||[]).length;
  // لو فشل أي من مصادر المستحقات، الشاشة كانت بتعرض "0 ر.س" بدون أي رسالة — يعني عامر يقرأ
  // "ما في مستحقات" وهي فعليًا "ما قدرنا نحمّل". منعلّم الفشل حتى تعرضه الشاشة كخطأ.
  scrapyardSharedState.homeLoadFailed = !!(usedRes.error || newRes.error || tasksRes.error || ordersRes.error);
  if(scrapyardSharedState.homeLoadFailed){
    showToast('تعذر تحميل بعض البيانات — الأرقام تحت ممكن تكون ناقصة. تحقق من الاتصال وحدّث الصفحة', 'error');
  }
}

/* عدد "سداد" جديد لعهدة عامر ما شافه بعد — نتابعه بـ localStorage محليًا على جهاز عامر (بدون جدول جديد)،
   أول مرة نخزّن العدد الحالي كـ"مُشاهَد" فورًا عشان ما يطلع رقم كبير وهمي على بيانات قديمة من قبل هالميزة. */
function scrapyardCustodyUnseenCount(){
  const current = scrapyardSharedState.custodyEntryCount || 0;
  const stored = localStorage.getItem('amerCustodySeenCount');
  if(stored === null){ localStorage.setItem('amerCustodySeenCount', String(current)); return 0; }
  return Math.max(0, current - Number(stored));
}
function markScrapyardCustodySeen(){
  localStorage.setItem('amerCustodySeenCount', String(scrapyardSharedState.custodyEntryCount || 0));
}

function scrapyardUnpaidPartsCount(){
  return (scrapyardSharedState.partsByKind.used||[]).length + (scrapyardSharedState.partsByKind.new||[]).length;
}

/* عدد قطع جديدة صارت "مستحقة للتشليح/الموردين" ما شافها عامر بعد — بيزيد كل ما صاحب الحساب يحفظ طلبية فيها
   قطع تشليح/مورد لسه ما تسددت، بنفس منطق تتبّع "شوهد/لسه" المحلي المستخدم لعهدة عامر. */
function scrapyardPartsUnseenCount(){
  const current = scrapyardUnpaidPartsCount();
  const stored = localStorage.getItem('amerPartsSeenCount');
  if(stored === null){ localStorage.setItem('amerPartsSeenCount', String(current)); return 0; }
  return Math.max(0, current - Number(stored));
}
function markScrapyardPartsSeen(){
  localStorage.setItem('amerPartsSeenCount', String(scrapyardUnpaidPartsCount()));
}

async function loadScrapyardData(kind){
  // ما منثبّت النوع الجديد إلا بعد نجاح التحميل — كان الفشل يترك الشاشة على نوع وبيانات نوع تاني
  const previousKind = scrapyardSharedState.activeKind;
  // المسوّدات مفهرسة بـ order_id/part_id بس، فمسودة "إضافة قطعة" مكتوبة على شاشة المستعمل
  // كانت تظهر (وتدخل بالمجموع) على شاشة الجديد لنفس الطلبية. نفضّيها عند تبديل النوع.
  if(previousKind && previousKind !== kind){
    scrapyardAddDrafts = {};
    scrapyardPriceDrafts = {};
    scrapyardEditOpenFor = {};
  }
  scrapyardSharedState.activeKind = kind;
  try{
    if(scrapyardSharedState.canManage){
      scrapyardSharedState.parts = ownerScrapyardPartsFromAppData(kind);
      scrapyardSharedState.returnReceivables = ownerScrapyardReturnReceivablesFromAppData(kind);
      scrapyardSharedState.custodyBalance = kind==='used' ? amerCustodyBalance() : 0;
      const [proposalsRes, confirmationsRes, suppliersRes] = await Promise.all([
        sb.from('scrapyard_proposals').select('*').eq('kind', kind).order('created_at', {ascending:false}),
        sb.from('scrapyard_order_confirmations').select('*').eq('kind', kind),
        sb.from('suppliers').select('*')
      ]);
      if(proposalsRes.error) throw proposalsRes.error;
      scrapyardSharedState.proposals = proposalsRes.data || [];
      scrapyardSharedState.confirmations = confirmationsRes.data || [];
      scrapyardSharedState.suppliers = suppliersRes.error ? [] : (suppliersRes.data || []);
    } else {
      const custodyPromise = kind==='used' ? sb.rpc('get_amer_custody_balance') : Promise.resolve({ data: 0 });
      const [partsRes, returnReceivablesRes, proposalsRes, confirmationsRes, suppliersRes, custodyRes] = await Promise.all([
        sb.rpc(SETTLEMENT_KINDS[kind].rpc),
        sb.rpc('get_scrapyard_return_receivables', { p_kind: kind }),
        sb.from('scrapyard_proposals').select('*').eq('kind', kind).eq('submitted_by', scrapyardSharedState.email).order('created_at', {ascending:false}),
        sb.from('scrapyard_order_confirmations').select('*').eq('kind', kind),
        sb.from('suppliers').select('*'),
        custodyPromise
      ]);
      if(partsRes.error) throw partsRes.error;
      scrapyardSharedState.parts = partsRes.data || [];
      scrapyardSharedState.returnReceivables = returnReceivablesRes.error ? [] : (returnReceivablesRes.data || []);
      scrapyardSharedState.proposals = proposalsRes.data || [];
      scrapyardSharedState.confirmations = confirmationsRes.data || [];
      scrapyardSharedState.suppliers = suppliersRes.error ? [] : (suppliersRes.data || []);
      scrapyardSharedState.custodyBalance = custodyRes.error ? 0 : (Number(custodyRes.data)||0);
    }
  }catch(e){
    scrapyardSharedState.activeKind = previousKind || kind;
    // نفضّي البيانات بدل ما نترك بيانات النوع القديم معروضة تحت عنوان النوع الجديد
    scrapyardSharedState.parts = [];
    scrapyardSharedState.returnReceivables = [];
    scrapyardSharedState.proposals = [];
    scrapyardSharedState.confirmations = [];
    scrapyardSharedState.loadFailed = true;
    showToast('تعذر تحميل بيانات '+SETTLEMENT_KINDS[kind].title+' — تحقق من الاتصال وحاول مرة تانية', 'error');
    return false;
  }
  scrapyardSharedState.loadFailed = false;
  return true;
}

function groupScrapyardPartsByOrder(parts){
  const map = {}; const order = [];
  parts.forEach(p=>{
    if(!map[p.order_id]){ map[p.order_id] = { order_id:p.order_id, order_number:p.order_number, order_label:p.order_label, supplied_at:p.supplied_at||null, parts:[] }; order.push(map[p.order_id]); }
    map[p.order_id].parts.push(p);
  });
  return order;
}

/* عدد الأيام من تاريخ "تم التوريد" — لمعرفة كم مرّ على كل طلبية غير مسدّدة بعد */
function scrapyardDaysSinceSupply(suppliedAt){
  if(!suppliedAt) return null;
  const supplied = new Date(suppliedAt);
  if(isNaN(supplied.getTime())) return null;
  return Math.max(0, Math.floor((Date.now() - supplied.getTime()) / 86400000));
}

function arabicDaysLabel(n){
  if(n === 0) return 'منذ اليوم';
  if(n === 1) return 'منذ يوم';
  if(n === 2) return 'منذ يومان';
  if(n <= 10) return 'منذ '+n+' أيام';
  return 'منذ '+n+' يوم';
}

function scrapyardDaysSinceSupplyBadgeHtml(suppliedAt){
  const days = scrapyardDaysSinceSupply(suppliedAt);
  if(days == null) return '';
  const level = days > 7 ? 'text-rust' : (days >= 4 ? 'text-amber' : 'muted');
  return '<span class="scrapyard-days-since '+level+'" title="مرّ على التوريد — لمعرفة التأخير بالسداد">⏱️ '+arabicDaysLabel(days)+'</span>';
}

function scrapyardProposalForPart(partId){
  return scrapyardSharedState.proposals.find(pr=>pr.part_id===partId && pr.action!=='add');
}

function scrapyardAddProposalsForOrder(orderId){
  return scrapyardSharedState.proposals.filter(pr=>pr.order_id===orderId && pr.action==='add');
}

function scrapyardConfirmationForOrder(orderId){
  return scrapyardSharedState.confirmations.find(c=>c.order_id===orderId);
}

/* مسوّدات محلية للإدخال المباشر داخل الصف — بدون أي نافذة خارجية */
let scrapyardPriceDrafts = {};   // part_id -> السعر المقترح يلي عم يُكتب حاليًا
let scrapyardAddDrafts = {};     // order_id -> {description, qty, price} لصف القطعة الجديدة المفتوح
let scrapyardEditOpenFor = {};   // part_id -> true — خانة تعديل السعر مفتوحة (تظهر فقط بعد الضغط على "تعديل")
/* حارس ضد إرسال مزدوج: نقرة زر + Enter بنفس اللحظة (أو نقرتين سريعتين) قبل ما أول طلب يخلص
   كانا يبعتوا نفس الاقتراح مرتين. المفتاح partId لاقتراح السعر، orderId لاقتراح إضافة قطعة. */
let scrapyardProposalSending = new Set();

/* شاشة عامر بتنبني من الصفر (root.innerHTML) مع أي حدث لحظي. مسوّدات الأسعار/الإضافة محفوظة
   بمتغيرات فوق فبترجع بعد إعادة البناء، لكن تعديل بيانات المورد بيتخزّن على كائن بـ
   scrapyardSharedState.suppliers يلي loadScrapyardData بتستبدله بمصفوفة جديدة كليًا — يعني
   الكتابة بتضيع. لهيك بنأجّل أي إعادة تحميل لحظية طول ما في صف تعديل مورد مفتوح. */
function scrapyardHasOpenEdit(){
  return Object.keys(editingScrapyardSuppliers||{}).length > 0;
}

/* مجموع جديد للطلبية بعد اقتراح سعر جديد (سواء وهو عم يُكتب أو بعد إرساله) — null لو ما فيه أي تغيير مقترح */
function scrapyardGroupProposedSubtotal(group){
  let changed = false;
  let total = group.parts.reduce((s,p)=>{
    const qty = Number(p.qty)||1;
    const pr = scrapyardProposalForPart(p.part_id);
    if(pr){
      changed = true;
      if(pr.action === 'delete') return s;
      if(pr.action === 'edit') return s + (Number(pr.cost_price)||0)*qty;
      return s + (Number(p.cost_price)||0)*qty;
    }
    if(scrapyardEditOpenFor[p.part_id]){
      const draft = scrapyardPriceDrafts[p.part_id];
      if(draft!==undefined && draft!=='' && !isNaN(Number(draft))){
        changed = true;
        return s + Number(draft)*qty;
      }
    }
    return s + (Number(p.cost_price)||0)*qty;
  }, 0);
  const addProposals = scrapyardAddProposalsForOrder(group.order_id);
  if(addProposals.length){
    changed = true;
    total += addProposals.reduce((s,pr)=> s + (Number(pr.cost_price)||0)*(Number(pr.qty)||1), 0);
  }
  const addDraft = scrapyardAddDrafts[group.order_id];
  if(addDraft && addDraft.price){
    changed = true;
    total += (Number(addDraft.price)||0) * (Number(addDraft.qty)||1);
  }
  return changed ? total : null;
}

/* عامر بيقدر يعلّم المهمة كمنجزة/غير منجزة — التعديل بيصير مباشرة بقاعدة البيانات
   عن طريق دالة RPC مخصصة (عامر ما عنده appData كامل بجهازه أصلًا) */
async function togglePurchasesTaskDone(taskId, newDone){
  const task = (scrapyardSharedState.tasks||[]).find(t=>t.id===taskId);
  if(task) task.done = newDone; // تحديث فوري بالواجهة قبل رد السيرفر
  renderScrapyardHomeView();
  const { error } = await sb.rpc('set_purchases_task_done', { p_task_id: taskId, p_done: newDone });
  if(error){
    console.error('set_purchases_task_done:', error);
    if(task) task.done = !newDone; // رجّعها لحالتها لو فشل التحديث
    renderScrapyardHomeView();
    showToast('تعذر تحديث المهمة', 'error');
  }
}

/* المستحق لكل تشليح على حدة (صافي) — مبني على القطع المستعملة غير المسدّدة الظاهرة حاليًا،
   مطروح منه أي مبلغ مسترجع بانتظار التحصيل من نفس التشليح */
function scrapyardSupplierTotalsHtml(){
  const totals = {};
  (scrapyardSharedState.parts||[]).forEach(p=>{
    if(!p.supplier_id) return;
    totals[p.supplier_id] = round2((totals[p.supplier_id]||0) + (Number(p.cost_price)||0)*(Number(p.qty)||1));
  });
  (scrapyardSharedState.returnReceivables||[]).forEach(p=>{
    if(!p.supplier_id) return;
    totals[p.supplier_id] = round2((totals[p.supplier_id]||0) - (Number(p.cost_price)||0)*(Number(p.qty)||1));
  });
  const ids = Object.keys(totals);
  if(!ids.length) return '';
  const rows = ids.map(sid=>{
    const supplier = (scrapyardSharedState.suppliers||[]).find(s=>s.id===sid);
    const name = supplier ? (supplier.name||supplier.phone||'مورد') : 'غير معروف';
    return '<div class="scrapyard-supplier-total-row"><span>'+escapeHtml(name)+'</span><span class="num text-amber">'+fmtMoney(totals[sid])+'</span></div>';
  }).join('');
  return '<div class="section-block"><div class="section-head"><span class="section-title">المستحق لكل تشليح</span></div>' + rows + '</div>';
}

/* عرض القطع المرتجعة اللي المفروض تُحصّل قيمتها من المورد/التشليح — معلومة فقط بهذي الشاشة،
   ما فيها زر تحصيل (هذا حصريًا بشاشة الموردين عند صاحب الحساب) */
function scrapyardReturnReceivablesHtml(){
  const rows = scrapyardSharedState.returnReceivables||[];
  if(!rows.length) return '';
  const total = round2(rows.reduce((s,p)=> s + (Number(p.cost_price)||0)*(Number(p.qty)||1), 0));
  const rowsHtml = rows.map(p=>{
    const supplier = (scrapyardSharedState.suppliers||[]).find(s=>s.id===p.supplier_id);
    const name = supplier ? (supplier.name||supplier.phone||'مورد') : 'غير محدد';
    const amount = round2((Number(p.cost_price)||0)*(Number(p.qty)||1));
    return '<div class="scrapyard-part-row">' +
      '<span class="scrapyard-part-desc">'+escapeHtml(p.description||'')+'</span>' +
      '<span class="num scrapyard-qty-slot">×'+(p.qty||1)+'</span>' +
      '<span class="num text-green">'+fmtMoney(amount)+'</span>' +
      '<span class="scrapyard-days-since muted">'+escapeHtml(name)+'</span>' +
    '</div>';
  }).join('');
  return '<div class="section-block"><div class="section-head"><span class="section-title">🔄 مرتجعات (مخصومة من الإجمالي أعلاه)</span><span class="num text-green">'+fmtMoney(total)+'</span></div>' + rowsHtml + '</div>';
}

  const kind = scrapyardSharedState.activeKind;

  root.innerHTML =
    '<div class="app-top-utility-row">' +
      '<div class="app-top-logo-row"><img class="app-corner-logo" src="'+PARTECH_LOGO_DATA_URI+'" id="scrapyard-logo-img" alt="PARTECH" title="الصفحة الرئيسية"></div>' +
      '<div class="corner-mini-bar">' +
        (canManage

          : '<button type="button" class="btn btn-ghost btn-sm" id="btn-scrapyard-back-home">→ الرئيسية</button>'+scrapyardThemeToggleHtml()+'<button id="btn-who-online-scrapyard" class="corner-mini-btn">👥</button>') +
      '</div>' +
    '</div>' +
    '<div class="app-top-divider"></div>' +
    announcementBannerHtml('purchasing') +
    '<div class="app-top-divider"></div>' +
    '<header class="topbar">' +
      '<div class="brand">'+SETTLEMENT_KINDS[kind].title+'</div>' +
    '</header>' +
    (kind==='used'
      ? '<div class="settlement-summary-card">' +
          '<div class="settlement-summary-row"><span>إجمالي المستحق للسداد</span><span class="num text-amber">'+fmtMoney(total)+'</span></div>' +
          '<div class="settlement-summary-row"><span>رصيد المشتريات (عهدتك)</span><span class="num '+(custodyBalance<0?'text-rust':'text-green')+'">'+fmtMoney(custodyBalance)+'</span></div>' +
          '<div class="settlement-summary-divider"></div>' +
          '<div class="settlement-summary-final"><span>المتبقي للسداد</span><span class="num '+(remainingToPay>0?'text-rust':'text-green')+'">'+fmtMoney(remainingToPay)+'</span></div>' +
        '</div>'
      : '<div class="total-box" style="margin-bottom:18px;"><span>إجمالي المستحق للسداد</span><span class="num text-amber">'+fmtMoney(total)+'</span></div>') +
    (kind==='used' && canManage ? '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;">' +
      '<button type="button" class="btn btn-ghost btn-sm" id="btn-add-amer-custody-topup">+ سداد لعهدة المشتريات</button>' +
      '<button type="button" class="btn btn-ghost btn-sm" id="btn-withdraw-amer-custody">➖ سحب من العهدة</button>' +
      '<button type="button" class="expense-history-btn" id="btn-history-amer-custody">📋 سجل العهدة ('+(appData.treasury.amerCustody||[]).length+')</button>' +
    '</div>' : '') +
    (kind==='used' ? scrapyardSupplierTotalsHtml() : '') +
    scrapyardReturnReceivablesHtml() +
    '<div class="section-block"><div class="section-head"><span class="section-title">القطع (غير المسدّدة)</span>' +
      (canManage || kind!=='used' ? '' : '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
        '<button type="button" class="btn btn-ghost btn-sm" id="btn-add-scrapyard-supplier">➕ تشليح جديد</button>' +
        '<button type="button" class="btn btn-ghost btn-sm" id="btn-manage-scrapyard-suppliers">✏️ تعديل الموردين</button>' +

      '<div class="modal-card modal-card-sm" role="dialog" aria-modal="true">' +
        '<div class="modal-title">إضافة تشليح جديد</div>' +

        '<label class="field"><span class="field-label">رقم الجوال</span><input type="tel" id="quick-scrapyard-phone-input" placeholder="05XXXXXXXX"></label>' +

          '<button type="button" class="btn btn-primary" id="quick-scrapyard-save-btn">💾 حفظ</button>' +

    const newSupplier = { id: uid('sup'), name, phone, notes:'', extraPhones: [], handlesNew: false, handlesUsed: true };
    const saved = await persistSupplier(newSupplier);

/* تعديل الموردين (التشاليح) من شاشة عامر — اسم/رقم/أرقام إضافية. نفس صلاحية الحفظ اللي عند
   صاحب الحساب (RLS بجدول suppliers مفتوحة لأي مستخدم مسموح، بما فيه عامر)، بس ما فيه واجهة
   له كانت أصلًا غير "إضافة تشليح جديد" — هذا يكمّلها بالتعديل. */
let editingScrapyardSuppliers = {};

function scrapyardSupplierEditRowHtml(s){
  const isEditing = !!editingScrapyardSuppliers[s.id];
  const extraPhones = Array.isArray(s.extra_phones) ? s.extra_phones : [];
  if(!isEditing){
    const phones = [s.phone].concat(extraPhones).filter(Boolean).join(' / ');
    return '<div class="task-item-row supplier-item-row" data-supplier-id="'+escapeHtml(s.id)+'">' +
      '<div class="supplier-row-main">' +
        '<span class="purchase-history-desc">'+escapeHtml(s.name||'بدون اسم')+'</span>' +
        '<span class="expense-entry-view-date">'+escapeHtml(phones||'—')+'</span>' +
        '<button type="button" class="icon-btn scrapyard-supplier-edit-btn" title="تعديل" aria-label="تعديل">✏️ تعديل</button>' +
      '</div>' +
    '</div>';
  }
  return '<div class="task-item-row supplier-item-row" data-supplier-id="'+escapeHtml(s.id)+'">' +
    '<div class="supplier-row-main">' +
      '<input type="text" class="supplier-name-input" placeholder="اسم المورد" value="'+escapeHtml(s.name||'')+'">' +
      '<input type="tel" class="supplier-phone-input" placeholder="رقم الجوال" value="'+escapeHtml(s.phone||'')+'">' +
      '<button type="button" class="icon-btn scrapyard-supplier-add-phone-btn" title="إضافة رقم آخر" aria-label="إضافة رقم">➕</button>' +
      '<button type="button" class="btn btn-sm expense-add-entry-btn scrapyard-supplier-save-btn">💾 حفظ</button>' +
    '</div>' +
    (extraPhones.length ? '<div class="supplier-extra-phones">' +
      extraPhones.map((ph,i)=>
        '<div class="supplier-extra-phone-row">' +
          '<input type="tel" class="supplier-extra-phone-input" data-phone-index="'+escapeHtml(i)+'" placeholder="رقم إضافي" value="'+escapeHtml(ph||'')+'">' +
          '<button type="button" class="icon-btn scrapyard-supplier-remove-phone-btn" data-phone-index="'+escapeHtml(i)+'" aria-label="حذف الرقم">✕</button>' +
        '</div>'
      ).join('') +
    '</div>' : '') +
  '</div>';
}

function scrapyardSupplierManageListHtml(){
  const rows = (scrapyardSharedState.suppliers||[]).filter(s=>s.handles_used!==false);
  if(!rows.length) return '<div class="expense-empty-hint">ما فيه موردين مضافين بعد</div>';
  return rows.map(scrapyardSupplierEditRowHtml).join('');
}

function openScrapyardSupplierManageModal(){
  editingScrapyardSuppliers = {};
  const root = document.getElementById('modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" data-close-backdrop>' +
      '<div class="modal-card modal-card-sm" role="dialog" aria-modal="true">' +
        '<div class="modal-header"><div class="modal-title">تعديل الموردين (التشاليح)</div>' +
          '<button type="button" class="icon-btn" id="scrapyard-supplier-manage-close-btn" aria-label="إغلاق">✕</button></div>' +
        '<div class="task-items-list" id="scrapyard-supplier-manage-list">' + scrapyardSupplierManageListHtml() + '</div>' +
      '</div>' +
    '</div>';
  root.classList.add('modal-open');
  const close = ()=>{ root.innerHTML=''; root.classList.remove('modal-open'); };
  root.querySelector('[data-close-backdrop]').addEventListener('click', e=>{
    if(e.target.hasAttribute('data-close-backdrop')) close();
  });
  root.querySelector('#scrapyard-supplier-manage-close-btn').addEventListener('click', close);
  bindScrapyardSupplierManageEvents();
}

function refreshScrapyardSupplierManageList(){
  const list = document.getElementById('scrapyard-supplier-manage-list');
  if(!list) return;
  list.innerHTML = scrapyardSupplierManageListHtml();
  bindScrapyardSupplierManageEvents();
}

function bindScrapyardSupplierManageEvents(){
  const list = document.getElementById('scrapyard-supplier-manage-list');
  if(!list) return;
  list.querySelectorAll('.supplier-item-row').forEach(row=>{
    const sid = row.getAttribute('data-supplier-id');
    const supplier = (scrapyardSharedState.suppliers||[]).find(s=>s.id===sid);
    if(!supplier) return;
    const editBtn = row.querySelector('.scrapyard-supplier-edit-btn');
    if(editBtn){
      editBtn.addEventListener('click', ()=>{
        editingScrapyardSuppliers[sid] = true;
        refreshScrapyardSupplierManageList();
      });
    }
    const nameInput = row.querySelector('.supplier-name-input');
    if(nameInput) nameInput.addEventListener('input', e=>{ supplier.name = e.target.value; });
    const phoneInput = row.querySelector('.supplier-phone-input');
    if(phoneInput) phoneInput.addEventListener('input', e=>{ supplier.phone = e.target.value; });
    const addPhoneBtn = row.querySelector('.scrapyard-supplier-add-phone-btn');
    if(addPhoneBtn){
      addPhoneBtn.addEventListener('click', ()=>{
        if(!Array.isArray(supplier.extra_phones)) supplier.extra_phones = [];
        supplier.extra_phones.push('');
        refreshScrapyardSupplierManageList();
      });
    }
    row.querySelectorAll('.supplier-extra-phone-input').forEach(inp=>{
      inp.addEventListener('input', e=>{
        const idx = Number(inp.getAttribute('data-phone-index'));
        supplier.extra_phones[idx] = e.target.value;
      });
    });
    row.querySelectorAll('.scrapyard-supplier-remove-phone-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = Number(btn.getAttribute('data-phone-index'));
        supplier.extra_phones.splice(idx, 1);
        refreshScrapyardSupplierManageList();
      });
    });
    const saveBtn = row.querySelector('.scrapyard-supplier-save-btn');
    if(saveBtn){
      saveBtn.addEventListener('click', async ()=>{
        const saved = await persistSupplier({
          id: supplier.id, name: supplier.name, phone: supplier.phone,
          extraPhones: Array.isArray(supplier.extra_phones) ? supplier.extra_phones.filter(Boolean) : [],
          handlesNew: supplier.handles_new !== false, handlesUsed: supplier.handles_used !== false
        });
        // فشل الحفظ كان يقفل وضع التعديل ويقول "تم حفظ المورد" — نبقي الصف مفتوح لإعادة المحاولة
        if(!saved) return;
        delete editingScrapyardSuppliers[sid];
        refreshScrapyardSupplierManageList();
        showToast('تم حفظ المورد', 'ok');
        renderScrapyardView();
      });
    }
  });
}

/* تأكيدات قديمة (قبل إضافة عمود confirmed_amount) ما عندها مبلغ مخزّن — ما منعتبرها قديمة
   حتى ما نطلّع تحذير على كل التأكيدات الموجودة أصلًا. */
function confirmedAmountIsStale(confirmedAmount, currentAmount){
  if(confirmedAmount==null || isNaN(confirmedAmount)) return false;
  return Math.abs(round2(confirmedAmount) - round2(currentAmount)) > 0.01;
}

function scrapyardOrderGroupHtml(group, canManage){
  const subtotal = group.parts.reduce((s,p)=> s + (Number(p.cost_price)||0)*(Number(p.qty)||1), 0);
  const proposedSubtotal = scrapyardGroupProposedSubtotal(group);
  const confirmation = scrapyardConfirmationForOrder(group.order_id);
  const addProposals = scrapyardAddProposalsForOrder(group.order_id);
  const addDraft = scrapyardAddDrafts[group.order_id];
  // التأكيد بينخزّن معه المبلغ وقتها — لو المبلغ الحالي اختلف بعده (تغيّر سعر/قطعة)، التأكيد
  // ما عاد يعني شي وبيصير مضلّل، فمنعرضه كـ"المبلغ تغيّر بعد التأكيد" بدل علامة صح.
  const confirmedAmount = confirmation && confirmation.confirmed_amount!=null ? Number(confirmation.confirmed_amount) : null;
  const confirmationStale = confirmedAmountIsStale(confirmedAmount, subtotal);
  return '<div class="scrapyard-order-group">' +
    '<div class="scrapyard-order-header'+(canManage?' scrapyard-order-header-clickable':'')+'"'+(canManage?' data-open-order-scrapyard="'+escapeHtml(group.order_id)+'" title="فتح الطلبية"':'')+'>'+escapeHtml(group.order_number||'')+(group.order_label?' — '+escapeHtml(group.order_label):'')+
      (confirmation && canManage
        ? (confirmationStale
            ? '<span class="scrapyard-confirmed-check" title="أكّدها عامر على مبلغ '+fmtMoney(confirmedAmount)+' — المبلغ تغيّر بعدها">⚠️</span>'
            : '<span class="scrapyard-confirmed-check" title="أكّدها عامر">✅</span>')
        : '') +
      scrapyardDaysSinceSupplyBadgeHtml(group.supplied_at) +
    '</div>' +
    group.parts.map(p=>scrapyardPartRowHtml(p, canManage)).join('') +
    addProposals.map(pr=>scrapyardAddProposalInlineHtml(pr, canManage)).join('') +
    (addDraft ? scrapyardAddDraftRowHtml(group.order_id, addDraft) : '') +
    '<div class="scrapyard-order-subtotal">' +
      '<span class="scrapyard-subtotal-label">مجموع الطلبية</span>' +
      '<span class="scrapyard-qty-slot" aria-hidden="true"></span>' +
      '<div class="scrapyard-subtotal-values" id="scrapyard-subtotal-values-'+group.order_id+'">' +
        scrapyardSubtotalValuesHtml(subtotal, proposedSubtotal) +
      '</div>' +
      '<span class="scrapyard-mgmt-actions" aria-hidden="true"></span>' +
    '</div>' +
    (!canManage ?
      '<div class="scrapyard-order-actions">' +
        (addDraft ? '' : '<button type="button" class="btn btn-ghost btn-sm" data-add-part-order="'+escapeHtml(group.order_id)+'">+ اقتراح قطعة جديدة</button>') +
        (confirmation && !confirmationStale
          ? '<button type="button" class="btn btn-sm btn-confirmed-green" data-unconfirm-order="'+escapeHtml(group.order_id)+'" title="اضغط للتراجع عن التأكيد">✅ تم تأكيد المبلغ</button>'
          : (confirmation
              ? '<button type="button" class="btn btn-amber btn-sm" data-confirm-order="'+escapeHtml(group.order_id)+'" title="أكّدت '+fmtMoney(confirmedAmount)+' والمبلغ تغيّر بعدها">⚠️ المبلغ تغيّر — أكّد من جديد</button>'
              : '<button type="button" class="btn btn-ghost btn-sm" data-confirm-order="'+escapeHtml(group.order_id)+'">تأكيد المبلغ</button>')) +
      '</div>'
      : '') +
  '</div>';
}

function scrapyardSubtotalValuesHtml(subtotal, proposedSubtotal){
  return '<span class="num scrapyard-subtotal-current">'+fmtMoney(subtotal)+'</span>' +
    (proposedSubtotal!=null ? '<span class="scrapyard-subtotal-arrow">←</span><span class="num scrapyard-subtotal-new" title="المجموع الجديد بعد اقتراح السعر">'+fmtMoney(proposedSubtotal)+'</span>' : '');
}

/* تحديث المجموع الجديد فور الكتابة بخانة السعر — بدون إعادة رسم كامل الشاشة حتى لا يفقد التركيز */
function updateScrapyardSubtotalDisplay(orderId){
  const el = document.getElementById('scrapyard-subtotal-values-'+orderId);
  if(!el) return;
  const parts = scrapyardSharedState.parts.filter(p=>p.order_id===orderId);
  const subtotal = parts.reduce((s,p)=> s + (Number(p.cost_price)||0)*(Number(p.qty)||1), 0);
  const proposedSubtotal = scrapyardGroupProposedSubtotal({ order_id: orderId, parts });
  el.innerHTML = scrapyardSubtotalValuesHtml(subtotal, proposedSubtotal);
}

/* خلية سعر ثابتة (عرض فقط) بنفس أسلوب "سعر الشراء / سعر البيع" داخل الطلبية */
function scrapyardPriceCellHtml(label, value, variant){
  return '<div class="scrapyard-price-cell'+(variant?' scrapyard-price-cell-'+variant:'')+'">' +
    '<span>'+label+'</span>' +
    '<span class="scrapyard-price-static'+(variant==='proposed'?' scrapyard-price-static-proposed':'')+' num">'+fmtMoney(value)+'</span>' +
  '</div>';
}

function scrapyardPartRowHtml(p, canManage){
  const proposal = scrapyardProposalForPart(p.part_id);
  let priceCells, actions;

  if(proposal){
    if(proposal.action === 'delete'){
      priceCells = scrapyardPriceCellHtml('السعر الحالي', p.cost_price, 'current') +
        '<div class="scrapyard-price-cell scrapyard-price-cell-proposed"><span>المقترح</span><span class="stamp stamp-amber">حذف القطعة</span></div>';
    } else {
      priceCells = scrapyardPriceCellHtml('السعر الحالي', p.cost_price, 'current') +
        scrapyardPriceCellHtml('السعر المقترح', proposal.cost_price, 'proposed');
    }
    actions = canManage
      ? '<div class="scrapyard-mgmt-actions">' +
          '<button type="button" class="icon-btn icon-btn-accept" data-accept-proposal="'+escapeHtml(proposal.id)+'" title="قبول" aria-label="قبول">✅</button>' +
          '<button type="button" class="icon-btn icon-btn-reject" data-reject-proposal="'+escapeHtml(proposal.id)+'" title="رفض" aria-label="رفض">❌</button>' +
        '</div>'
      : '<div class="scrapyard-mgmt-actions">' +
          '<button type="button" class="icon-btn" data-withdraw-proposal="'+escapeHtml(proposal.id)+'" title="تراجع عن السعر المقترح" aria-label="تراجع">↩️</button>' +
        '</div>';
  } else if(canManage){
    priceCells = scrapyardPriceCellHtml('السعر', p.cost_price, 'current');
    actions = '';
  } else if(scrapyardEditOpenFor[p.part_id]){
    // خانة السعر المقترح تظهر فقط بعد الضغط على "تعديل" — نفس شكل إدخال أسعار القطعة بالطلبية
    const draftVal = scrapyardPriceDrafts[p.part_id];
    const inputVal = (draftVal===undefined || draftVal===null) ? '' : draftVal;
    priceCells = scrapyardPriceCellHtml('السعر الحالي', p.cost_price, 'current') +
      '<div class="scrapyard-price-cell scrapyard-price-cell-proposed">' +
        '<span>السعر المقترح</span>' +

/* إرسال السعر المقترح المكتوب داخل صف القطعة — بدون أي نافذة خارجية */
async function sendScrapyardPriceProposal(orderId, partId){
  if(scrapyardProposalSending.has(partId)) return; // إرسال ثاني قيد التنفيذ أصلًا لنفس القطعة
  const raw = scrapyardPriceDrafts[partId];
  const val = Number(raw);
  // `!val` كانت ترفض السعر 0 مع إنه اقتراح مشروع (قطعة صارت مجانية/بدل تالف) — الرفض
  // الصح هو الفاضي أو غير الرقمي أو السالب فقط.
  if(raw===undefined || raw===null || raw==='' || isNaN(val) || val<0){ showToast('اكتب السعر المقترح أولاً', 'error'); return; }
  const part = scrapyardSharedState.parts.find(p=>p.part_id===partId);
  if(part && Number(part.cost_price) === val){ showToast('السعر المقترح نفس السعر الحالي', 'error'); return; }
  scrapyardProposalSending.add(partId);
  const { error } = await sb.from('scrapyard_proposals').insert({
    order_id: orderId, part_id: partId, action: 'edit', cost_price: val, submitted_by: scrapyardSharedState.email, kind: scrapyardSharedState.activeKind
  });
  scrapyardProposalSending.delete(partId);
  if(error){ showToast('تعذر إرسال الاقتراح', 'error'); return; }
  delete scrapyardPriceDrafts[partId];
  delete scrapyardEditOpenFor[partId];
  showToast('تم إرسال السعر المقترح', 'ok');
  await loadScrapyardData(scrapyardSharedState.activeKind);
  renderScrapyardView();
}

/* إرسال اقتراح قطعة جديدة من صف الإدخال المباشر */
async function sendScrapyardAddProposal(orderId){
  if(scrapyardProposalSending.has(orderId)) return; // إرسال ثاني قيد التنفيذ أصلًا لنفس الطلبية
  const d = scrapyardAddDrafts[orderId];
  if(!d) return;
  const desc = (d.description||'').trim();
  const qty = Number(d.qty)||1;
  const price = Number(d.price);
  if(!desc){ showToast('أدخل وصف القطعة', 'error'); return; }
  if(!qty || qty<=0){ showToast('أدخل عدد صحيح', 'error'); return; }
  if(d.price===undefined || d.price===null || d.price==='' || isNaN(price) || price<0){ showToast('أدخل سعر صحيح', 'error'); return; }
  scrapyardProposalSending.add(orderId);
  const { error } = await sb.from('scrapyard_proposals').insert({
    order_id: orderId, action: 'add', description: desc, qty, cost_price: price, submitted_by: scrapyardSharedState.email, kind: scrapyardSharedState.activeKind
  });
  scrapyardProposalSending.delete(orderId);
  if(error){ showToast('تعذر إرسال الاقتراح', 'error'); return; }
  delete scrapyardAddDrafts[orderId];
  showToast('تم إرسال الاقتراح', 'ok');
  await loadScrapyardData(scrapyardSharedState.activeKind);
  renderScrapyardView();
}

/* لما صاحب الحساب يغيّر تصنيف القطعة (مستعمل/جديد) من داخل الطلبية، أي اقتراح معلّق
   عليها بشاشة سداد التشاليح/الجديد بيصير غير منطقي (مبني على التصنيف القديم) — فنلغيه تلقائيًا */
async function cancelPendingScrapyardProposalsForPart(partId){
  if(!sb) return;
  const { data, error } = await sb.from('scrapyard_proposals').select('id').eq('part_id', partId);
  if(error || !data || !data.length) return;
  const { error: delError } = await sb.from('scrapyard_proposals').delete().eq('part_id', partId);
  if(delError){ console.error('cancelPendingScrapyardProposalsForPart:', delError); return; }
  showToast('تم إلغاء الاقتراح المعلّق على هذه القطعة تلقائيًا بعد تغيير تصنيفها', 'ok');
  refreshScrapyardPendingCount();
}

/* ---------- presence ("من متصل الآن") — tied to real interaction, updated live via Supabase Realtime ---------- */
const PRESENCE_HEARTBEAT_MS = 15000;
const PRESENCE_ACTIVE_IDLE_LIMIT_MS = 60000; // must have interacted within the last minute to count as "online"
const PRESENCE_RECHECK_MS = 8000; // how often we re-derive the visible online list from the local cache (no network call)
// عامر وعبدالرحمن يشوفوا آخر ظهور بعض بس (مو باقي الموظفين) — نفس القيد مطبّق فعليًا بـ RLS
// على جدول presence (سياستي presence_select_paired_group)، هذا بس لإظهار/إخفاء الزر بالواجهة
const WHO_ONLINE_EXTRA_VISIBLE_EMAILS = ['amerpartech@gmail.com','manomahomed11223@gmail.com'];
let presenceTimer = null;
let presenceRecheckTimer = null;
let presenceEmail = null;
let lastActivityAt = Date.now();
let presenceCache = {}; // email -> last_seen (ms epoch), kept in sync via realtime
let presenceChannel = null;

function markActivity(){ lastActivityAt = Date.now(); }

function sendPresenceHeartbeat(){
  if(!sb || !presenceEmail) return;
  if(Date.now() - lastActivityAt > PRESENCE_ACTIVE_IDLE_LIMIT_MS) return; // idle — don't report as online
  sb.from('presence').upsert({ email: presenceEmail, last_seen: new Date(lastActivityAt).toISOString() }).then(()=>{}, ()=>{});
}

function computeOnlineList(){
  const cutoff = Date.now() - PRESENCE_ACTIVE_IDLE_LIMIT_MS;
  return Object.keys(presenceCache)
    .filter(email => presenceCache[email] >= cutoff)
    .sort((a,b)=> presenceCache[b] - presenceCache[a]);
}

function refreshOnlineBadge(){
  const online = computeOnlineList();
  ['btn-who-online','btn-who-online-scrapyard'].forEach(id=>{
    const btn = document.getElementById(id);
    if(btn) btn.textContent = '👥 ' + online.length;
  });
  // إذا نافذة "آخر ظهور" مفتوحة، حدّثها بنفس قائمة كل الموظفين (متصل + غير متصل) — بدون ما نرجّعها للشكل القديم
  if(document.getElementById('online-users-list')){
    loadAllPresenceRows().then(rows=>{
      const listEl = document.getElementById('online-users-list');
      if(listEl) listEl.innerHTML = presenceListHtml(rows);
    });
  }
}

async function loadPresenceCache(){
  try{
    const cutoff = new Date(Date.now() - PRESENCE_ACTIVE_IDLE_LIMIT_MS).toISOString();
    const { data, error } = await sb.from('presence').select('email,last_seen').gte('last_seen', cutoff);
    if(error) throw error;
    presenceCache = {};
    (data||[]).forEach(row=>{ presenceCache[row.email] = new Date(row.last_seen).getTime(); });
  }catch(e){ /* best-effort */ }
  refreshOnlineBadge();
}

function subscribePresenceRealtime(){
  if(!sb || presenceChannel) return;
  presenceChannel = sb.channel('presence-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'presence' }, (payload)=>{
      if(payload.eventType === 'DELETE'){
        const oldRow = payload.old;
        if(oldRow && oldRow.email) delete presenceCache[oldRow.email];
      } else if(payload.new && payload.new.email){
        presenceCache[payload.new.email] = new Date(payload.new.last_seen).getTime();
      }
      refreshOnlineBadge();
    })
    .subscribe();
}

function startPresenceHeartbeat(email){
  presenceEmail = email;
  lastActivityAt = Date.now();
  ['mousemove','keydown','mousedown','touchstart','scroll'].forEach(evt=>{
    document.addEventListener(evt, markActivity, { passive:true });
  });
  sendPresenceHeartbeat();
  loadPresenceCache();
  subscribePresenceRealtime();
  startContinuousLocationReporting();
  enforceLocationRequired(email);
  if(presenceTimer) clearInterval(presenceTimer);
  presenceTimer = setInterval(sendPresenceHeartbeat, PRESENCE_HEARTBEAT_MS);
  if(presenceRecheckTimer) clearInterval(presenceRecheckTimer);
  presenceRecheckTimer = setInterval(refreshOnlineBadge, PRESENCE_RECHECK_MS);
}

/* وقت نسبي بالعربي لآخر ظهور (قبل دقيقة/ساعة/يوم...) */
function arabicMinutesLabel(n){
  if(n === 1) return 'دقيقة';
  if(n === 2) return 'دقيقتين';
  if(n >= 3 && n <= 10) return n+' دقائق';
  return n+' دقيقة';
}
function arabicHoursLabel(n){
  if(n === 1) return 'ساعة';
  if(n === 2) return 'ساعتين';
  if(n >= 3 && n <= 10) return n+' ساعات';
  return n+' ساعة';
}
function arabicDaysCountLabel(n){
  if(n === 1) return 'يوم';
  if(n === 2) return 'يومين';
  if(n >= 3 && n <= 10) return n+' أيام';
  return n+' يوم';
}

/* وقت نسبي دقيق بالدقائق: قبل 30 دقيقة / قبل ساعة و30 دقيقة / قبل يوم و3 ساعات... */
function arabicRelativeTime(ms){
  const diffSec = Math.floor((Date.now() - ms) / 1000);
  const diffMin = Math.floor(diffSec / 60);
  if(diffMin < 1) return 'الآن';
  if(diffMin < 60) return 'قبل '+arabicMinutesLabel(diffMin);
  const diffHour = Math.floor(diffMin / 60);
  const remMin = diffMin % 60;
  if(diffHour < 24){
    return 'قبل '+arabicHoursLabel(diffHour)+(remMin>0 ? ' و '+arabicMinutesLabel(remMin) : '');
  }
  const diffDay = Math.floor(diffHour / 24);
  const remHour = diffHour % 24;
  if(diffDay <= 30){
    return 'قبل '+arabicDaysCountLabel(diffDay)+(remHour>0 ? ' و '+arabicHoursLabel(remHour) : '');
  }
  const diffMonth = Math.floor(diffDay / 30);
  if(diffMonth === 1) return 'قبل شهر';
  return 'قبل '+diffMonth+' أشهر';
}

/* كل الموظفين (متصلين وغير متصلين) مع وقت آخر ظهور لكل وحد */

/* ---------- تتبع موقع مستمر (بدون أي زر تفعيل/إيقاف — شغّال تلقائيًا لكل الموظفين طول ما
   التطبيق مفتوح وظاهر أمامهم، foreground-only مثل الإشعارات، بدون أي قراءة موقع بالخلفية).
   كل نقطة بتنسجل بجدول employee_location_history (append-only، ما فيها تعديل ولا حذف حتى
   لصاحبها) فبيصير فيها "آخر موقع" و"تاريخ كامل" سوا — مهاب استثنى حاله بالكامل: جهازه ما
   بيسجّل ولا بيرد على أي طلب موقع نهائيًا (LOCATION_SHARING_EXCLUDED_EMAILS). ---------- */
const LOCATION_SHARING_EXCLUDED_EMAILS = ['mohabalsamman1998@gmail.com']; // مهاب: لا تسجيل ولا طلب لموقعه أبدًا
// همام وبشار: المشاركة نفسها تبقى شغالة عادي لو سمحوا (نفس التتبع المستمر)، بس مو اجباري عليهم —
// لو رفضوا صلاحية الموقع ما يظهرلهم gate يحجب التطبيق (بعكس باقي الموظفين اللي يضلوا محجوبين لحد ما يوافقوا)
const LOCATION_MANDATORY_EXEMPT_EMAILS = ['homam.techno@gmail.com','sammaneng@gmail.com'];
const LOCATION_REPORT_INTERVAL_MS = 2*60*1000; // نقطة جديدة كل دقيقتين تلقائيًا
let locationRequestChannel = null;
let locationReportTimer = null;

function recordLocationPoint(){
  if(!sb || !presenceEmail || !navigator.geolocation) return;
  if(LOCATION_SHARING_EXCLUDED_EMAILS.includes(presenceEmail)) return;
  if(document.visibilityState !== 'visible') return; // فقط والصفحة مفتوحة وظاهرة فعليًا
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    try{
      await sb.from('employee_location_history').insert({
        email: presenceEmail, lat: pos.coords.latitude, lng: pos.coords.longitude,
        accuracy: pos.coords.accuracy, recorded_at: new Date().toISOString()
      });
    }catch(e){ console.error('recordLocationPoint:', e); }
  }, (e)=>{ console.error('geolocation error:', e); }, { enableHighAccuracy:false, timeout:15000, maximumAge:60000 });
}

function subscribeLocationRequests(){
  if(!sb || locationRequestChannel) return;
  if(presenceEmail && LOCATION_SHARING_EXCLUDED_EMAILS.includes(presenceEmail)) return; // ما منشترك أصلًا لحساب مهاب
  locationRequestChannel = sb.channel('location-requests-changes')
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'location_requests' }, ()=>{
      recordLocationPoint(); // نقطة فورية إضافية بطلب "تحديث الآن" من مهاب/همام/بشار
    })
    .subscribe();
}

function startContinuousLocationReporting(){
  if(!presenceEmail || LOCATION_SHARING_EXCLUDED_EMAILS.includes(presenceEmail)) return;
  if(locationReportTimer) clearInterval(locationReportTimer);
  locationReportTimer = setInterval(recordLocationPoint, LOCATION_REPORT_INTERVAL_MS);
  subscribeLocationRequests();
}

/* ---------- حجب إجباري: المتصفح ما بيسمح لأي موقع يفرض إذن الموقع (هذا قيد متصفح ثابت، مو
   قابل للتجاوز أبدًا) — أقصى شي ممكن هو منع الموظف من استخدام باقي التطبيق لحد ما يوافق. أول
   استدعاء ناجح لـ getCurrentPosition بيصير هو أول نقطة تسجّل بالتاريخ، فما في ازدواجية مع
   startContinuousLocationReporting (يلي بس بيبلش الفاصل الزمني + الاستماع لطلبات "تحديث الآن"). ---------- */
function showLocationGate(retryFn){
  let gate = document.getElementById('location-gate');
  if(!gate){
    gate = document.createElement('div');
    gate.id = 'location-gate';
    gate.className = 'location-gate';
    gate.innerHTML =
      '<div class="location-gate-card">' +
        '<div class="location-gate-icon">📍</div>' +
        '<div class="location-gate-title">لازم توافق على مشاركة الموقع للمتابعة</div>' +
        '<div class="location-gate-sub">هذا التطبيق يتطلب معرفة موقعك أثناء استخدامه. وافق من إعدادات الموقع بالمتصفح (أو الجوال)، وبعدين اضغط "حاول مرة ثانية".</div>' +
        '<button type="button" class="btn btn-primary" id="location-gate-retry-btn">حاول مرة ثانية</button>' +
      '</div>';
    document.body.appendChild(gate);
  }
  gate.style.display = 'flex';
  document.getElementById('location-gate-retry-btn').onclick = retryFn;
}
function hideLocationGate(){
  const gate = document.getElementById('location-gate');
  if(gate) gate.style.display = 'none';
}
function enforceLocationRequired(email){
  if(LOCATION_SHARING_EXCLUDED_EMAILS.includes(email)) return;
  if(!navigator.geolocation) return; // ما فينا نطلب شي بمتصفح ما بيدعم أصلًا — منكمل عادي
  function attempt(){
    navigator.geolocation.getCurrentPosition(async (pos)=>{
      hideLocationGate();
      if(!sb) return;
      try{
        await sb.from('employee_location_history').insert({
          email: email, lat: pos.coords.latitude, lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy, recorded_at: new Date().toISOString()
        });
      }catch(e){ console.error('enforceLocationRequired insert:', e); }
    }, (err)=>{
      // PERMISSION_DENIED بس — مو مشكلة إشارة/GPS مؤقتة. همام/بشار مستثنون من الحجب نفسه
      // (LOCATION_MANDATORY_EXEMPT_EMAILS) — لو رفضوا الصلاحية يكملوا استخدام التطبيق عادي.
      if(err.code === 1 && !LOCATION_MANDATORY_EXEMPT_EMAILS.includes(email)) showLocationGate(attempt);
    }, { enableHighAccuracy:false, timeout:15000 });
  }
  attempt();
}

/* ---------- خريطة مواقع الموظفين (مهاب/همام/بشار فقط — وموقع مهاب نفسه مستثنى دايمًا).
   تعرض آخر موقع معروف لكل موظف فورًا (فيو employee_latest_location)، وتتحدث لحظيًا مع كل نقطة
   جديدة. فيها كمان بحث "بوقت معيّن" يرجع أقرب نقطة مسجّلة قبل أي وقت تختاره. ---------- */
let employeeMapInstance = null;
let employeeMapMarkers = {};
let employeeMapChannel = null;
let employeeMapStaleTimer = null;
let employeeMapModalOpen = false;
let employeeMapHistoryMarker = null;
const EMPLOYEE_LOCATION_STALE_MS = 2*60*1000;

function employeeMapMarkerIcon(email, stale, variant){
  const label = displayNameForEmail(email);
  const dot = variant==='history' ? '🕐' : (stale?'⚪':'🟢');
  return L.divIcon({
    className: 'employee-map-marker'+(stale?' employee-map-marker-stale':''),
    html: '<div class="employee-map-marker-label">'+dot+' '+escapeHtml(label)+'</div>'
  });
}

function renderEmployeeMapMarkers(rows){
  if(!employeeMapInstance) return;
  const seen = new Set();
  (rows||[]).forEach(row=>{
    if(!row.email || row.lat==null || row.lng==null) return;
    seen.add(row.email);
    const stale = (Date.now() - new Date(row.recorded_at).getTime()) > EMPLOYEE_LOCATION_STALE_MS;
    const icon = employeeMapMarkerIcon(row.email, stale);
    const tooltipText = (stale?'قبل ':'محدَّث ')+arabicRelativeTime(new Date(row.recorded_at).getTime());
    if(employeeMapMarkers[row.email]){
      employeeMapMarkers[row.email].setLatLng([row.lat, row.lng]).setIcon(icon).setTooltipContent(tooltipText);
    } else {
      employeeMapMarkers[row.email] = L.marker([row.lat, row.lng], { icon }).addTo(employeeMapInstance).bindTooltip(tooltipText);
    }
  });
  Object.keys(employeeMapMarkers).forEach(email=>{
    if(!seen.has(email)){ employeeMapInstance.removeLayer(employeeMapMarkers[email]); delete employeeMapMarkers[email]; }
  });
}

async function loadEmployeeLocations(){
  if(!sb) return [];
  const { data, error } = await sb.from('employee_latest_location').select('email, lat, lng, accuracy, recorded_at');
  if(error){ console.error('loadEmployeeLocations:', error); return []; }
  return (data||[]).filter(row => !LOCATION_SHARING_EXCLUDED_EMAILS.includes(row.email));
}

async function loadEmployeeLocationHistoryEmails(){
  if(!sb) return [];
  const { data, error } = await sb.from('employee_location_history').select('email');
  if(error){ console.error('loadEmployeeLocationHistoryEmails:', error); return []; }
  const emails = Array.from(new Set((data||[]).map(r=>r.email))).filter(e => !LOCATION_SHARING_EXCLUDED_EMAILS.includes(e));
  emails.sort();
  return emails;
}

async function searchLocationAtTime(email, isoTime){
  if(!sb || !email || !isoTime) return null;
  const { data, error } = await sb.from('employee_location_history')
    .select('email, lat, lng, accuracy, recorded_at')
    .eq('email', email).lte('recorded_at', isoTime)
    .order('recorded_at', { ascending:false }).limit(1).maybeSingle();
  if(error){ console.error('searchLocationAtTime:', error); return null; }
  return data;
}

function pingEmployeeLocations(){
  if(!sb) return;
  sb.from('location_requests').update({ requested_at: new Date().toISOString(), requested_by: presenceEmail }).eq('id','ping')
    .then(({error})=>{ if(error) console.error('pingEmployeeLocations:', error); });
}

function subscribeEmployeeMapRealtime(){
  if(!sb || employeeMapChannel) return;
  employeeMapChannel = sb.channel('employee-location-history-changes')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'employee_location_history' }, async ()=>{
      renderEmployeeMapMarkers(await loadEmployeeLocations());
    })
    .subscribe();
}

let employeeMapOpenToken = 0;

function closeEmployeeMap(){
  employeeMapOpenToken++; // يبطل أي متابعة async معلّقة من فتحة سابقة (تحميل بيانات لسا ما خلص)
  const root = document.getElementById('confirm-root');
  root.innerHTML = '';
  root.classList.remove('modal-open');
  employeeMapModalOpen = false;
  document.removeEventListener('keydown', employeeMapEscListener);
  if(employeeMapChannel){ sb.removeChannel(employeeMapChannel); employeeMapChannel = null; }
  if(employeeMapStaleTimer){ clearInterval(employeeMapStaleTimer); employeeMapStaleTimer = null; }
  if(employeeMapInstance){ employeeMapInstance.remove(); employeeMapInstance = null; }
  employeeMapMarkers = {};
  employeeMapHistoryMarker = null;
}
function employeeMapEscListener(e){ if(e.key==='Escape') closeEmployeeMap(); }

async function handleEmployeeMapHistorySearch(){
  if(!employeeMapInstance) return;
  const select = document.getElementById('employee-map-history-select');
  const timeInput = document.getElementById('employee-map-history-time');
  const resultEl = document.getElementById('employee-map-history-result');
  const email = select && select.value;
  if(!email){ if(resultEl) resultEl.textContent = 'اختر موظف أولًا'; return; }
  const timeVal = timeInput && timeInput.value;
  // الوقت اختياري — لو ما اتحدد، نبحث عن آخر موقع معروف لهذا الموظف (نفس منطق searchLocationAtTime
  // بس بوقت "الآن" فيرجع أحدث نقطة مسجّلة له)
  const isLatest = !timeVal;
  const isoTime = isLatest ? new Date().toISOString() : new Date(timeVal).toISOString();
  if(resultEl) resultEl.textContent = 'جاري البحث…';
  const point = await searchLocationAtTime(email, isoTime);
  if(!employeeMapInstance) return; // تسكّرت الخريطة أثناء البحث
  if(!point){
    if(resultEl) resultEl.textContent = 'ما في أي موقع مسجّل لهذا الموظف'+(isLatest?'':' قبل هذا الوقت');
    return;
  }
  if(employeeMapHistoryMarker){ employeeMapInstance.removeLayer(employeeMapHistoryMarker); employeeMapHistoryMarker = null; }
  employeeMapHistoryMarker = L.marker([point.lat, point.lng], { icon: employeeMapMarkerIcon(point.email, false, 'history') }).addTo(employeeMapInstance);
  employeeMapInstance.setView([point.lat, point.lng], 15);
  const recordedLabel = new Date(point.recorded_at).toLocaleString('ar-SY', { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit', year:'numeric' });
  if(resultEl) resultEl.textContent = (isLatest?'آخر موقع معروف لـ ':'آخر موقع مسجّل لـ ')+displayNameForEmail(point.email)+' — الساعة '+recordedLabel;
}

          '<button class="icon-btn" id="employee-map-close-btn" aria-label="إغلاق">✕</button></div>' +

        '<div class="employee-map-history-row" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">' +

  }).addTo(employeeMapInstance);

          const suffix = ts ? ' — '+arabicRelativeTime(new Date(ts).getTime()) : '';
          return '<option value="'+escapeHtml(email)+'">'+escapeHtml(displayNameForEmail(email))+suffix+'</option>';
        }).join('')
      : '<option value="">لا يوجد سجل مواقع بعد</option>';
  }
  subscribeEmployeeMapRealtime();
  employeeMapStaleTimer = setInterval(async ()=>{ renderEmployeeMapMarkers(await loadEmployeeLocations()); }, 30000);
  pingEmployeeLocations();
}

let pendingAuthEmail = '';

function bindAuthGate(){
  const emailInput = document.getElementById('auth-email-input');
  const sendBtn = document.getElementById('auth-send-btn');
  const codeInput = document.getElementById('auth-code-input');
  const verifyBtn = document.getElementById('auth-verify-btn');
  const backBtn = document.getElementById('auth-back-btn');
  const stepEmail = document.getElementById('auth-step-email');
  const stepCode = document.getElementById('auth-step-code');

  const trySend = async ()=>{
    const email = emailInput.value.trim();
    if(!email){ showAuthGate('اكتب بريدك الإلكتروني أولاً', 'error'); return; }
    if(!sb){ showAuthGate('تعذر الاتصال بخدمة تسجيل الدخول', 'error'); return; }
    sendBtn.disabled = true;
    sendBtn.textContent = 'جاري الإرسال…';
    try{
      const { error } = await sb.auth.signInWithOtp({ email });
      if(error) throw error;
      pendingAuthEmail = email;
      stepEmail.style.display = 'none';
      stepCode.style.display = '';
      codeInput.value = '';
      showAuthGate('تم إرسال رمز الدخول إلى ' + email + ' — افتح بريدك وأدخل الرمز تحت.', 'ok');
      codeInput.focus();
    }catch(e){
      showAuthGate('تعذر إرسال رمز الدخول: ' + (e && e.message ? e.message : ''), 'error');
    }finally{
      sendBtn.disabled = false;
      sendBtn.textContent = 'إرسال رمز الدخول';
    }
  };

  const tryVerify = async ()=>{
    const code = codeInput.value.trim();
    if(!code){ showAuthGate('اكتب الرمز أولاً', 'error'); return; }
    if(!sb || !pendingAuthEmail){ showAuthGate('تعذر التحقق — ارجع وأدخل بريدك من جديد', 'error'); return; }
    verifyBtn.disabled = true;
    verifyBtn.textContent = 'جاري التحقق…';
    try{
      const { error } = await sb.auth.verifyOtp({ email: pendingAuthEmail, token: code, type: 'email' });
      if(error) throw error;
      // الجلسة صارت جاهزة — onAuthStateChange بياخذ من هون وطالع. تصفير pendingAuthEmail هون
      // (مش بس بزر "رجوع") ضروري حتى showAuthGate ما تفضّل تعتبرنا "لسا بمنتصف إدخال الرمز"
      // لو رجعت تنادى بعدين (مثلاً بريد غير مصرّح له بعد نجاح التحقق).
      pendingAuthEmail = '';
    }catch(e){
      showAuthGate('رمز غير صحيح أو منتهي الصلاحية: ' + (e && e.message ? e.message : ''), 'error');
    }finally{
      verifyBtn.disabled = false;
      verifyBtn.textContent = 'تأكيد الرمز';
    }
  };

  sendBtn.addEventListener('click', trySend);
  emailInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); trySend(); } });
  verifyBtn.addEventListener('click', tryVerify);
  codeInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); tryVerify(); } });
  backBtn.addEventListener('click', ()=>{
    pendingAuthEmail = '';
    stepCode.style.display = 'none';
    stepEmail.style.display = '';
    showAuthGate();
  });
}

/* ---------- day/night theme toggle — persisted per browser, applies even on the login screen ---------- */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  try{ localStorage.setItem('partech-theme', theme); }catch(e){}
  const emoji = theme === 'light' ? '🌙' : '🌞';
  const btn = document.getElementById('btn-theme-toggle');
  if(btn) btn.textContent = emoji;
  const scrapBtn = document.getElementById('btn-theme-toggle-scrapyard');
  if(scrapBtn) scrapBtn.textContent = emoji;
}

function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  applyTheme(current === 'light' ? 'dark' : 'light');
}

function handleLogout(){
  confirmAction({
    title: 'تسجيل الخروج؟',
    message: 'رح تحتاج تسجّل دخول من جديد لاستخدام التطبيق.',
    confirmLabel: 'تسجيل خروج',
    dangerous: true,
    onConfirm: async ()=>{
      await sb.auth.signOut();
      window.location.reload();
    }
  });
}

function scrapyardThemeToggleHtml(){
  const emoji = document.documentElement.getAttribute('data-theme') === 'light' ? '🌙' : '🌞';
  return '<button type="button" id="btn-theme-toggle-scrapyard" class="corner-mini-btn" title="تبديل الوضع الليلي/النهاري">'+emoji+'</button>';
}

function bindScrapyardThemeToggle(){
  const btn = document.getElementById('btn-theme-toggle-scrapyard');
  if(btn) btn.addEventListener('click', toggleTheme);
}

function initTheme(){
  let saved = 'dark';
  try{ saved = localStorage.getItem('partech-theme') || 'dark'; }catch(e){}
  applyTheme(saved);
}
initTheme();

const logoImgEl = document.getElementById('app-corner-logo-img');
if(logoImgEl){
  logoImgEl.src = PARTECH_LOGO_DATA_URI;
  logoImgEl.addEventListener('click', goHomeFromLogo);
}
const authLogoImgEl = document.getElementById('auth-logo-img');
if(authLogoImgEl) authLogoImgEl.src = PARTECH_LOGO_DATA_URI;

/* اللوجو موجود بكل الصفحات — الضغط عليه يرجّع للصفحة الرئيسية (الطلبيات) */
function goHomeFromLogo(){
  const scrapRoot = document.getElementById('scrapyard-root');
  if(scrapRoot && scrapRoot.style.display !== 'none'){
    if(!scrapyardSharedState.canManage){
      // موظف التشاليح (عامر) — يرجّعه لصفحته الرئيسية (قسم المشتريات)
      goToScrapyardHome();
      return;
    }
    closeScrapyardSharedView();
  }
  hideAllSecondaryViews();
  const ordersEl = document.getElementById('orders-view');
  if(ordersEl) ordersEl.style.display = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function getAuthErrorFromUrl(){
  try{
    const raw = (window.location.hash || '').replace(/^#/, '') || (window.location.search || '').replace(/^\?/, '');
    const params = new URLSearchParams(raw);
    const desc = params.get('error_description');
    const err = desc ? desc.replace(/\+/g, ' ') : params.get('error');
    // بنشيل جزء الخطأ من الرابط بعد ما نقرأه — غير هيك بيضل معلّق، فبعد أي خروج (يلي بيعيد
    // تحميل نفس الرابط) بترجع تظهر رسالة "الرابط منتهي الصلاحية" مع إنه ما صار شي.
    if(err && window.history && window.history.replaceState){
      window.history.replaceState(null, '', window.location.pathname);
    }
    return err;
  }catch(e){ return null; }
}

async function bootstrapAuth(){
  bindAuthGate();
  if(!sb){
    showAuthGate('تعذر الاتصال بخدمة تسجيل الدخول — تحقق من إعداد Supabase', 'error');
    return;
  }
  const urlError = getAuthErrorFromUrl();
  const noSessionMsg = urlError ? 'تعذر تسجيل الدخول: الرابط منتهي الصلاحية أو تم استخدامه من قبل. اطلب رابط دخول جديد من هذه الصفحة.' : undefined;
  sb.auth.onAuthStateChange((event, session)=>{
    if(session){
      // ما منفلتر على اسم الحدث: الفلترة على SIGNED_IN لحاله كانت بتفوّت إعادة البث بين
      // التبويبات، وبنفس الوقت خطر تكسير دخول رابط الإيميل لو المكتبة بعتت INITIAL_SESSION
      // بدل SIGNED_IN. بدلها، showAppIfAllowed نفسها فيها حارس (shownForEmail) بيتجاهل أي
      // حدث لنفس المستخدم المعروض أصلًا — فالتجديد الصامت ما بيعيد بناء الشاشة، وبنفس الوقت
      // كل مسارات الدخول بتشتغل.
      showAppIfAllowed(session);
    }
    else { showAuthGate(noSessionMsg, noSessionMsg ? 'error' : undefined); }
  });
  const { data: { session } } = await sb.auth.getSession();
  if(session){ showAppIfAllowed(session); } else { showAuthGate(noSessionMsg, noSessionMsg ? 'error' : undefined); }
}
bootstrapAuth();
</script>
