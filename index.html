function dmyToIso(str) {
    const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(str || "").trim());
    if (!m) return "";
    return m[3] + "-" + m[2].padStart(2, "0") + "-" + m[1].padStart(2, "0");
}

function isoToDmy(str) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(str || "").trim());
    if (!m) return "";
    return m[3] + "/" + m[2] + "/" + m[1];
}

function parseDMY(str) {
    if (!str) return null;
    const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(str).trim());
    if (!m) return null;
    const d = new Date(parseInt(m[3], 10), parseInt(m[2], 10) - 1, parseInt(m[1], 10));
    return isNaN(d.getTime()) ? null : d;
}

function dateMatchesPeriod(d, periodKey, customMonth, rangeFrom, rangeTo) {
    periodKey = periodKey || treasuryPeriodFilter;
    if (periodKey === "all") return true;
    if (!d) return false;
    if (periodKey === "customMonth") {
        const m = /^(\d{4})-(\d{2})$/.exec(customMonth || "");
        if (!m) return true;
        return d.getFullYear() === parseInt(m[1], 10) && d.getMonth() === parseInt(m[2], 10) - 1;
    }
    if (periodKey === "customRange") {
        const from = /^\d{4}-\d{2}-\d{2}$/.test(rangeFrom || "") ? new Date(rangeFrom + "T00:00:00") : null;
        const to = /^\d{4}-\d{2}-\d{2}$/.test(rangeTo || "") ? new Date(rangeTo + "T00:00:00") : null;
        if (from && d.getTime() < from.getTime()) return false;
        if (to && d.getTime() > to.getTime()) return false;
        return true;
    }
    const now = new Date;
    const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (periodKey === "today") {
        return d.getTime() === today0.getTime();
    }
    if (periodKey === "week") {
        const weekStart = new Date(today0);
        weekStart.setDate(weekStart.getDate() - now.getDay());
        return d.getTime() >= weekStart.getTime() && d.getTime() <= today0.getTime();
    }
    if (periodKey === "month") {
        return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    }
    if (periodKey === "lastMonth") {
        const lm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        return d.getFullYear() === lm.getFullYear() && d.getMonth() === lm.getMonth();
    }
    return true;
}

function entryMatchesPeriod(entry) {
    if (treasuryPeriodFilter === "all") return true;
    return dateMatchesPeriod(parseDMY(entry.date), treasuryPeriodFilter);
}

function isoDateMatches(d, isoDate) {
    if (!d || isNaN(d.getTime())) return false;
    return dateMatchesPeriod(d, "customRange", "", isoDate, isoDate);
}

function accountsActivityForDate(isoDate) {
    const matchDmy = dateStr => isoDateMatches(parseDMY(dateStr), isoDate);
    const matchIso = isoStr => {
        if (!isoStr) return false;
        const dt = new Date(isoStr);
        if (isNaN(dt.getTime())) return false;
        return isoDateMatches(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()), isoDate);
    };
    const customerPayments = [], customerRefunds = [], supplierPayments = [], expenses = [], support = [], custody = [], custodyOmar = [];
    (appData.orders || []).forEach(o => {
        if (o.isQuote) return;
        (o.customerPayments || []).forEach(p => {
            if (!matchDmy(p.date)) return;
            const row = {
                orderNumber: o.orderNumber,
                orderLabel: o.orderLabel,
                amount: Number(p.amount) || 0,
                method: p.method || ""
            };
            if (p.returnAdjustment) customerRefunds.push(row); else customerPayments.push(row);
        });
        if (matchIso(o.paidToSupplierAt)) {
            const amt = o.paidToSupplierAmountSnapshot != null ? Number(o.paidToSupplierAmountSnapshot) || 0 : orderTotals(o).costToSupplier;
            supplierPayments.push({
                orderNumber: o.orderNumber,
                orderLabel: o.orderLabel,
                amount: amt,
                kind: "مورد"
            });
        }
        if (matchIso(o.paidToAmerAt)) {
            const amt = o.paidToAmerAmountSnapshot != null ? Number(o.paidToAmerAmountSnapshot) || 0 : orderTotals(o).costToScrapyard;
            supplierPayments.push({
                orderNumber: o.orderNumber,
                orderLabel: o.orderLabel,
                amount: amt,
                kind: "تشليح (عامر)"
            });
        }
        if (matchIso(o.paidToOmarAt)) {
            const amt = o.paidToOmarAmountSnapshot != null ? Number(o.paidToOmarAmountSnapshot) || 0 : orderTotals(o).costToScrapyard;
            supplierPayments.push({
                orderNumber: o.orderNumber,
                orderLabel: o.orderLabel,
                amount: amt,
                kind: "تشليح (عمر)"
            });
        }
        if (matchIso(o.paidToSupplierNewAt)) {
            const amt = o.paidToSupplierNewAmountSnapshot != null ? Number(o.paidToSupplierNewAmountSnapshot) || 0 : orderTotals(o).costToSupplier;
            supplierPayments.push({
                orderNumber: o.orderNumber,
                orderLabel: o.orderLabel,
                amount: amt,
                kind: "مورد (جديد)"
            });
        }
        if (matchIso(o.paidToAmerNewAt)) {
            const amt = o.paidToAmerNewAmountSnapshot != null ? Number(o.paidToAmerNewAmountSnapshot) || 0 : orderTotals(o).costToSupplier;
            supplierPayments.push({
                orderNumber: o.orderNumber,
                orderLabel: o.orderLabel,
                amount: amt,
                kind: "جديد (عامر)"
            });
        }
        if (matchIso(o.paidToOmarNewAt)) {
            const amt = o.paidToOmarNewAmountSnapshot != null ? Number(o.paidToOmarNewAmountSnapshot) || 0 : orderTotals(o).costToSupplier;
            supplierPayments.push({
                orderNumber: o.orderNumber,
                orderLabel: o.orderLabel,
                amount: amt,
                kind: "جديد (عمر)"
            });
        }
    });
    EXPENSE_CATEGORIES.forEach(c => {
        (appData.treasury[c.key] || []).forEach(entry => {
            if (!matchDmy(entry.date)) return;
            expenses.push({
                label: c.label,
                amount: Number(entry.amount) || 0,
                note: entry.note || ""
            });
        });
    });
    (appData.treasury.support || []).forEach(entry => {
        if (!matchDmy(entry.date)) return;
        support.push({
            amount: Number(entry.amount) || 0,
            note: entry.note || ""
        });
    });
    (appData.treasury.amerCustody || []).forEach(entry => {
        if (!matchDmy(entry.date)) return;
        custody.push({
            amount: Number(entry.amount) || 0,
            note: entry.note || ""
        });
    });
    (appData.treasury.omarCustody || []).forEach(entry => {
        if (!matchDmy(entry.date)) return;
        custodyOmar.push({
            amount: Number(entry.amount) || 0,
            note: entry.note || ""
        });
    });
    const sum = arr => round2(arr.reduce((s, r) => s + (Number(r.amount) || 0), 0));
    const supplierPaymentsDirect = supplierPayments.filter(r => r.kind === "مورد");
    return {
        customerPayments: customerPayments,
        customerRefunds: customerRefunds,
        supplierPayments: supplierPayments,
        expenses: expenses,
        support: support,
        custody: custody,
        custodyOmar: custodyOmar,
        totals: {
            customerPayments: sum(customerPayments),
            customerRefunds: sum(customerRefunds),
            supplierPayments: sum(supplierPayments),
            supplierPaymentsDirect: sum(supplierPaymentsDirect),
            expenses: sum(expenses),
            support: sum(support),
            custody: sum(custody),
            custodyOmar: sum(custodyOmar)
        }
    };
}

function orderDateMatchesPeriod(order) {
    if (treasuryPeriodFilter === "all") return true;
    if (!order.updatedAt) return false;
    const dt = new Date(order.updatedAt);
    if (isNaN(dt.getTime())) return false;
    return dateMatchesPeriod(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()), treasuryPeriodFilter);
}

function orderMatchesExtraIndicatorsPeriod(order) {
    if (extraIndicatorsPeriod === "all") return true;
    const basis = order.suppliedAt || order.createdAt || order.updatedAt;
    if (!basis) return false;
    const dt = new Date(basis);
    if (isNaN(dt.getTime())) return false;
    return dateMatchesPeriod(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()), extraIndicatorsPeriod, extraIndicatorsCustomMonth, extraIndicatorsRangeFrom, extraIndicatorsRangeTo);
}

function entryMatchesExtraIndicatorsPeriod(entry) {
    if (extraIndicatorsPeriod === "all") return true;
    return dateMatchesPeriod(parseDMY(entry.date), extraIndicatorsPeriod, extraIndicatorsCustomMonth, extraIndicatorsRangeFrom, extraIndicatorsRangeTo);
}

function computeTreasuryVolumes() {
    const orders = appData.orders.filter(o => o.confirmed && !o.isQuote).filter(orderMatchesExtraIndicatorsPeriod);
    let paidToSuppliersTotal = 0, paidToScrapyardTotal = 0, customerReceiptsTotal = 0, collectedProfit = 0, fullProfit = 0;
    let costToSuppliersTotal = 0, costToScrapyardTotal = 0, sellTotalSum = 0;
    orders.forEach(o => {
        const t = orderTotals(o);
        if (newPartsCostSettled(o, t)) paidToSuppliersTotal += t.costToSupplier;
        if (scrapyardCostSettled(o, t)) paidToScrapyardTotal += t.costToScrapyard;
        costToSuppliersTotal += t.costToSupplier;
        costToScrapyardTotal += t.costToScrapyard;
        customerReceiptsTotal += t.customerPaidAmount;
        sellTotalSum += t.sellTotal;
        if (t.hasChargeable) {
            collectedProfit += t.collectedProfit;
            fullProfit += t.profit;
        }
    });
    return {
        purchaseVolume: round2(costToSuppliersTotal + costToScrapyardTotal),
        purchaseVolumePaid: round2(paidToSuppliersTotal + paidToScrapyardTotal),
        paidToSuppliersVolume: round2(paidToSuppliersTotal),
        paidToScrapyardVolume: round2(paidToScrapyardTotal),
        costToSuppliersVolume: round2(costToSuppliersTotal),
        costToScrapyardVolume: round2(costToScrapyardTotal),
        salesVolume: round2(sellTotalSum),
        salesVolumePaid: round2(customerReceiptsTotal),
        profitVolume: round2(fullProfit),
        profitVolumePaid: round2(collectedProfit)
    };
}

function treasurySupportTotal(matchFn) {
    const filterFn = matchFn || entryMatchesPeriod;
    return round2((appData.treasury.support || []).filter(filterFn).reduce((sum, entry) => sum + (Number(entry.amount) || 0), 0));
}

function treasuryTotals() {
    let totalExpenses = 0;
    EXPENSE_CATEGORIES.forEach(c => {
        (appData.treasury[c.key] || []).filter(entryMatchesPeriod).forEach(entry => {
            totalExpenses += Number(entry.amount) || 0;
        });
    });
    totalExpenses = round2(totalExpenses);
    const totalSupport = treasurySupportTotal();
    const fSnapshot = computeAggregateFinancials();
    let allTimeExpenses = 0;
    EXPENSE_CATEGORIES.forEach(c => {
        (appData.treasury[c.key] || []).forEach(entry => {
            allTimeExpenses += Number(entry.amount) || 0;
        });
    });
    allTimeExpenses = round2(allTimeExpenses);
    let extraIndicatorsExpenses = 0;
    const extraIndicatorsExpensesByCategory = [];
    EXPENSE_CATEGORIES.forEach(c => {
        let categoryTotal = 0;
        (appData.treasury[c.key] || []).filter(entryMatchesExtraIndicatorsPeriod).forEach(entry => {
            categoryTotal += Number(entry.amount) || 0;
        });
        extraIndicatorsExpenses += categoryTotal;
        if (categoryTotal > 0) extraIndicatorsExpensesByCategory.push({
            label: c.label,
            amount: categoryTotal
        });
    });
    const supportAllTime = treasurySupportTotal(() => true);
    const custodyTopupsAllTime = round2(amerCustodyTopupsTotalAll() + omarCustodyTopupsTotalAll());
    const paidToScrapyardForCustody = round2(paidToScrapyardTotalForCustody() + paidToScrapyardTotalForOmar());
    const amerBalancePart = !currentUserIsElevated && serverAmerCustodyBalance !== null ? serverAmerCustodyBalance : round2(amerCustodyTopupsTotalAll() - paidToScrapyardTotalForCustody());
    const omarBalancePart = !currentUserIsElevated && serverOmarCustodyBalance !== null ? serverOmarCustodyBalance : round2(omarCustodyTopupsTotalAll() - paidToScrapyardTotalForOmar());
    const custodyBalance = round2(amerBalancePart + omarBalancePart);
    const custodyDeficit = round2(Math.max(0, -custodyBalance));
    const supplierReturnReceivables = totalSupplierReturnReceivables();
    const customerRefundsPending = totalCustomerRefundsPending();
    const net = round2(fSnapshot.customerReceiptsTotal + supportAllTime - fSnapshot.paidToSuppliersTotal - custodyTopupsAllTime - allTimeExpenses);
    const netAfterSettlement = round2(net + fSnapshot.dueFromCustomers + custodyBalance - fSnapshot.dueToScrapyard - fSnapshot.dueToSuppliers + supplierReturnReceivables - customerRefundsPending);
    const debtsToSuppliers = round2(custodyDeficit + fSnapshot.dueToScrapyard + fSnapshot.dueToSuppliers);
    const volumes = computeTreasuryVolumes();
    const netProfitVolume = round2(volumes.profitVolumePaid - extraIndicatorsExpenses);
    const netProfitVolumeAfterSettlement = round2(volumes.profitVolume - extraIndicatorsExpenses);
    const term = (label, amount) => ({
        label: label,
        amount: Math.abs(round2(amount)),
        negative: amount < 0
    });
    const breakdowns = {
        net: [ term("دفعات الزبائن (صافي)", fSnapshot.customerReceiptsTotal), term("الدعم الخارجي", supportAllTime), term("المدفوع للموردين", -fSnapshot.paidToSuppliersTotal), term("سداد عهدة المشتريات", -custodyTopupsAllTime), term("المصاريف", -allTimeExpenses) ],
        netAfterSettlement: [ term("الصندوق حاليًا", net), term("مستحق من الزبائن", fSnapshot.dueFromCustomers), term("رصيد المشتريات", custodyBalance), term("مستحق للتشليح", -fSnapshot.dueToScrapyard), term("مستحق للموردين", -fSnapshot.dueToSuppliers), term("مرتجعات مستحقة لنا", supplierReturnReceivables), term("مرتجعات مستحقة للعملاء", -customerRefundsPending) ],
        uncollectedProfit: [ term("الربح المحصّل (كل الطلبيات)", fSnapshot.collectedProfit), term("الربح غير المحصّل", fSnapshot.uncollectedProfit) ],
        debtsToSuppliers: [ term("عجز عهدة المشتريات", custodyDeficit), term("مستحق للتشليح", fSnapshot.dueToScrapyard), term("مستحق للموردين", fSnapshot.dueToSuppliers) ],
        purchasingCustodyBalance: [ term("إجمالي المسدد للعهدة (بالإشارة)", custodyTopupsAllTime), term("المدفوع فعليًا للتشليح من العهدة", -paidToScrapyardForCustody) ],
        dueFromCustomers: {
            note: fSnapshot.dueFromCustomersCount > 0 ? "مجموع المتبقي على " + fSnapshot.dueFromCustomersCount + " طلبية مسلّمة لسه ما سُددت بالكامل" : "ما فيه طلبيات مسلّمة عليها مبلغ متبقي حاليًا"
        },
        purchaseVolume: [ term("التكلفة الكاملة — للموردين (بالفترة)", volumes.costToSuppliersVolume), term("التكلفة الكاملة — للتشليح (بالفترة)", volumes.costToScrapyardVolume), term("تم سداد منه — للموردين (بالفترة)", volumes.paidToSuppliersVolume), term("تم سداد منه — للتشليح (بالفترة)", volumes.paidToScrapyardVolume) ],
        salesVolume: [ term("إجمالي مستحق الزبائن (بالفترة)", volumes.salesVolume), term("تم تحصيل (بالفترة)", volumes.salesVolumePaid) ],
        expensesVolume: extraIndicatorsExpensesByCategory.length ? extraIndicatorsExpensesByCategory.map(c => term(c.label, c.amount)) : {
            note: "ما فيه مصاريف مسجّلة بهذه الفترة"
        },
        profitVolume: [ term("الربح الكامل (بافتراض التحصيل)", volumes.profitVolume), term("تم تحصيل", volumes.profitVolumePaid) ],
        netProfitVolumeAfterSettlement: [ term("الربح الكامل (بافتراض التحصيل)", volumes.profitVolume), term("المصاريف (الفترة)", -extraIndicatorsExpenses), term("تم تحصيل منه (صافي)", netProfitVolume) ]
    };
    return {
        totalExpenses: totalExpenses,
        totalSupport: totalSupport,
        net: net,
        netAfterSettlement: netAfterSettlement,
        debtsToSuppliers: debtsToSuppliers,
        dueFromCustomers: fSnapshot.dueFromCustomers,
        uncollectedProfit: fSnapshot.uncollectedProfit,
        purchaseVolume: volumes.purchaseVolume,
        purchaseVolumePaid: volumes.purchaseVolumePaid,
        salesVolume: volumes.salesVolume,
        salesVolumePaid: volumes.salesVolumePaid,
        profitVolume: volumes.profitVolume,
        profitVolumePaid: volumes.profitVolumePaid,
        expensesVolume: round2(extraIndicatorsExpenses),
        netProfitVolume: netProfitVolume,
        netProfitVolumeAfterSettlement: netProfitVolumeAfterSettlement,
        purchasingCustodyBalance: custodyBalance,
        purchasingCustodyDeficit: custodyDeficit,
        breakdowns: breakdowns
    };
}

function computeAllTimeTreasurySummary() {
    const savedPeriod = treasuryPeriodFilter;
    const savedExtraPeriod = extraIndicatorsPeriod;
    const savedExtraMonth = extraIndicatorsCustomMonth;
    treasuryPeriodFilter = "all";
    extraIndicatorsPeriod = "all";
    extraIndicatorsCustomMonth = "";
    const t = treasuryTotals();
    treasuryPeriodFilter = savedPeriod;
    extraIndicatorsPeriod = savedExtraPeriod;
    extraIndicatorsCustomMonth = savedExtraMonth;
    return t;
}

function refreshAccountsActivityModal() {

function bindTreasuryPeriodFilter() {
    const toggleBtn = document.getElementById("btn-toggle-treasury-filter");
    if (toggleBtn) {
        toggleBtn.addEventListener("click", () => {
            treasuryFilterOpen = !treasuryFilterOpen;
            const el = document.getElementById("treasury-period-filter");
            if (el) el.style.display = treasuryFilterOpen ? "flex" : "none";
        });
    }
    const el = document.getElementById("treasury-period-filter");
    if (!el) return;
    el.querySelectorAll("[data-period]").forEach(btn => {
        btn.addEventListener("click", () => {
            treasuryPeriodFilter = btn.getAttribute("data-period");
            treasuryFilterOpen = true;
            renderTreasuryView();
        });
    });
}

function bindExtraIndicatorsFilter() {
    const toggleBtn = document.getElementById("btn-toggle-extra-filter");
    if (toggleBtn) {
        toggleBtn.addEventListener("click", () => {
            extraIndicatorsFilterOpen = !extraIndicatorsFilterOpen;
            const el = document.getElementById("extra-indicators-period-filter");
            if (el) el.style.display = extraIndicatorsFilterOpen ? "flex" : "none";
        });
    }
    const el = document.getElementById("extra-indicators-period-filter");
    if (!el) return;
    el.querySelectorAll("[data-extra-period]").forEach(btn => {
        btn.addEventListener("click", () => {
            extraIndicatorsPeriod = btn.getAttribute("data-extra-period");
            extraIndicatorsCustomMonth = "";
            extraIndicatorsRangeFrom = "";
            extraIndicatorsRangeTo = "";
            extraIndicatorsFilterOpen = true;
            renderTreasuryView();
        });
    });
    const monthInput = document.getElementById("extra-indicators-month-input");
    if (monthInput) {
        monthInput.addEventListener("change", e => {
            if (!e.target.value) return;
            extraIndicatorsPeriod = "customMonth";
            extraIndicatorsCustomMonth = e.target.value;
            extraIndicatorsRangeFrom = "";
            extraIndicatorsRangeTo = "";
            extraIndicatorsFilterOpen = true;
            renderTreasuryView();
        });
    }
    const rangeFromInput = document.getElementById("extra-indicators-range-from");
    const rangeToInput = document.getElementById("extra-indicators-range-to");
    const applyRangeFilter = () => {
        const from = rangeFromInput ? rangeFromInput.value : "";
        const to = rangeToInput ? rangeToInput.value : "";
        if (!from && !to) return;
        extraIndicatorsPeriod = "customRange";
        extraIndicatorsCustomMonth = "";
        extraIndicatorsRangeFrom = from;
        extraIndicatorsRangeTo = to;
        extraIndicatorsFilterOpen = true;
        renderTreasuryView();
    };
    if (rangeFromInput) rangeFromInput.addEventListener("change", applyRangeFilter);
    if (rangeToInput) rangeToInput.addEventListener("change", applyRangeFilter);
}

        const key = btn.getAttribute("data-history-key");
        const label = btn.getAttribute("data-history-label") || "";
        btn.addEventListener("click", () => openExpenseHistoryModal(key, label));
    });
}

function bindTreasuryAddButtons() {
    const el = document.getElementById("treasury-view");
    el.querySelectorAll("[data-add-entry-key]").forEach(btn => {
        const key = btn.getAttribute("data-add-entry-key");
        const label = btn.getAttribute("data-add-entry-label") || "دعم الصندوق من الخارج";
        btn.addEventListener("click", () => {
            if (treasuryPeriodFilter !== "all" && !dateMatchesPeriod(parseDMY(todayNumeric()), treasuryPeriodFilter)) {
                treasuryPeriodFilter = "all";
                renderTreasuryView();
                showToast('رجّعنا فلتر الفترة لـ"الكل" حتى يظهر السجل الجديد', "ok");
            }
            if (!Array.isArray(appData.treasury[key])) appData.treasury[key] = [];
            const newEntry = {
                id: uid("exp"),
                amount: "",
                date: todayNumeric(),
                note: ""
            };
            appData.treasury[key].push(newEntry);
            editingExpenseEntries[newEntry.id] = true;
            unsavedDraftEntryIds.add(newEntry.id);
            openExpenseHistoryModal(key, label);
        });
    });
}

function sortEntriesNewestFirst(entries) {
    return entries.map((entry, i) => ({
        entry: entry,
        i: i
    })).sort((a, b) => {
        const da = parseDMY(a.entry.date), db = parseDMY(b.entry.date);
        const ta = da ? da.getTime() : -Infinity, tb = db ? db.getTime() : -Infinity;
        if (tb !== ta) return tb - ta;
        return b.i - a.i;
    }).map(x => x.entry);
}

function bindExpenseEntryEvents(key) {
    const list = document.querySelector('[data-entries-key="' + escapeHtml(key) + '"]');
    if (!list) return;
    list.querySelectorAll(".expense-entry-row").forEach(row => {
        const entryId = row.getAttribute("data-entry-id");
        const entry = (appData.treasury[key] || []).find(e => e.id === entryId);
        if (!entry) return;
        const editBtn = row.querySelector(".expense-entry-edit-btn");
        if (editBtn) {
            editBtn.addEventListener("click", () => {
                editingExpenseEntries[entryId] = true;
                refreshExpenseEntries(key);
            });
        }
        const saveBtn = row.querySelector(".expense-entry-save-btn");
        if (saveBtn) {
            saveBtn.addEventListener("click", async () => {
                const amt = Number(entry.amount);
                const isSupport = key === "support" || key === "amerCustody" || key === "omarCustody";
                if (entry.amount === "" || isNaN(amt) || amt === 0 || !isSupport && amt < 0) {
                    showToast("أدخل مبلغًا صحيحًا", "error");
                    return;
                }
                const liveEntry = (appData.treasury[key] || []).find(e => e.id === entryId);
                if (!liveEntry) {
                    showToast("تعذر الحفظ — يبدو إن هذا العنصر تغيّر أو انحذف من مكان آخر", "error");
                    delete editingExpenseEntries[entryId];
                    refreshExpenseEntries(key);
                    return;
                }
                const prev = {
                    amount: liveEntry.amount,
                    date: liveEntry.date,
                    note: liveEntry.note
                };
                liveEntry.amount = amt;
                liveEntry.date = entry.date;
                liveEntry.note = entry.note;
                const saved = await persistTreasuryEntry(liveEntry, key);
                if (!saved) {
                    Object.assign(liveEntry, prev);
                    refreshExpenseEntries(key);
                    return;
                }
                delete editingExpenseEntries[entryId];
                unsavedDraftEntryIds.delete(entryId);
                refreshExpenseEntries(key);
                showToast("تم حفظ المبلغ", "ok");
            });
        }
        const amountInput = row.querySelector(".expense-entry-amount-input");
        if (amountInput) {
            amountInput.addEventListener("input", e => {
                entry.amount = e.target.value === "" ? "" : Number(e.target.value);
                updateExpenseCategorySubtotal(key);
                updateTreasurySummary();
            });
        }
        const dateInput = row.querySelector(".expense-entry-date-input");
        if (dateInput) {
            dateInput.addEventListener("input", e => {
                entry.date = isoToDmy(e.target.value);
            });
        }
        const noteInput = row.querySelector(".expense-entry-note-input");
        if (noteInput) {
            noteInput.addEventListener("input", e => {
                entry.note = e.target.value;
            });
        }
        row.querySelector(".expense-entry-remove-btn").addEventListener("click", () => {
            if (unsavedDraftEntryIds.has(entryId)) {
                appData.treasury[key] = (appData.treasury[key] || []).filter(e => e.id !== entryId);
                delete editingExpenseEntries[entryId];
                unsavedDraftEntryIds.delete(entryId);
                refreshExpenseEntries(key);
                return;
            }
            confirmDeleteExpenseEntry(key, entryId);
        });
    });
}

function confirmDeleteExpenseEntry(key, entryId) {
    confirmAction({
        title: "حذف هذا المبلغ؟",
        message: "هذا الإجراء نهائي ولا يمكن التراجع عنه.",
        confirmLabel: "تأكيد الحذف",
        dangerous: true,
        onConfirm: async () => {
            const deleted = await deleteTreasuryEntry(entryId);
            if (!deleted) return;
            appData.treasury[key] = (appData.treasury[key] || []).filter(e => e.id !== entryId);
            delete editingExpenseEntries[entryId];
            refreshExpenseEntries(key);
            updateExpenseCategorySubtotal(key);
            updateTreasurySummary();
        }
    });
}

function refreshExpenseEntries(key) {
    const list = document.querySelector('[data-entries-key="' + escapeHtml(key) + '"]');
    if (!list) return;
    const matching = sortEntriesNewestFirst((appData.treasury[key] || []).filter(entryMatchesPeriod));
    list.innerHTML = matching.length ? matching.map(entry => expenseEntryRowHtml(entry, key)).join("") : '<div class="expense-empty-hint">ما فيه مبالغ ضمن هذه الفترة</div>';
    bindExpenseEntryEvents(key);
    updateExpenseCategorySubtotal(key);
    updateTreasurySummary();
    const historyBtn = document.querySelector('[data-history-key="' + escapeHtml(key) + '"]');
    if (historyBtn) historyBtn.textContent = "📋 " + matching.length;
}

function overdueCustomersCount() {
    const THRESHOLD_MS = 30 * 24 * 60 * 60 * 1e3;
    const now = Date.now();
    const overdueCustomerIds = new Set;
    (appData.orders || []).forEach(o => {
        if (!o.customerId || overdueCustomerIds.has(o.customerId)) return;
        if (!o.supplied) return;
        const t = orderTotals(o);
        if (!t.hasChargeable || t.customerFullyPaid) return;
        const refDate = o.suppliedAt || o.updatedAt;
        if (!refDate) return;
        const ref = new Date(refDate).getTime();
        if (isNaN(ref)) return;
        if (now - ref >= THRESHOLD_MS) overdueCustomerIds.add(o.customerId);
    });
    let count = 0;
    (appData.customers || []).forEach(c => {
        if (overdueCustomerIds.has(c.id)) count++;
    });
    return count;
}

function customersWithPendingRefundsCount() {
    const idx = customerRefundsPendingIndex();
    return (appData.customers || []).filter(c => (idx[c.id] || 0) > 0).length;
}

function totalCustomerRefundsPending() {
    let total = 0;
    (appData.orders || []).forEach(o => {
        if (!o.confirmed || o.isQuote) return;
        (o.parts || []).forEach(p => {
            if (!p.returned || p.customerRefundConfirmed) return;
            if (!partIsIncludedInOrder(o, p)) return;
            const adj = (o.customerPayments || []).find(pay => pay.returnAdjustment && pay.linkedPartId === p.id);
            if (adj) total += Number(adj.amount) || 0;
        });
    });
    return round2(total);
}

let serverAmerCustodyBalance = null;

let amerCustodyBalanceRequestSeq = 0;

async function refreshServerAmerCustodyBalance() {
    if (!sb) return;
    const mySeq = ++amerCustodyBalanceRequestSeq;
    const {data: data, error: error} = await withRetry(() => sb.rpc("get_amer_custody_balance"), 3, 1500);
    if (mySeq !== amerCustodyBalanceRequestSeq) return;
    if (!error) serverAmerCustodyBalance = Number(data) || 0;
}

function amerCustodyTopupsTotalAll() {
    return round2((appData.treasury.amerCustody || []).reduce((sum, entry) => sum + (Number(entry.amount) || 0), 0));
}

function amerCustodyTopupsTotal(matchFn) {
    const filterFn = matchFn || entryMatchesPeriod;
    return round2((appData.treasury.amerCustody || []).filter(filterFn).reduce((sum, entry) => sum + (Number(entry.amount) || 0), 0));
}

function paidToScrapyardTotalForCustody() {
    let total = 0;
    (appData.orders || []).forEach(o => {
        if (!o.confirmed || o.custodyLegacy || o.isQuote) return;
        const t = orderTotals(o);
        const mixed = orderIsMixedPartType(t);
        if (o.paidToAmer) total += mixed ? t.costToScrapyard : t.costTotal;
        if (o.paidToAmerNew && mixed) total += t.costToSupplier;
    });
    return round2(total);
}

function amerCustodyBalance() {
    if (!currentUserIsElevated && serverAmerCustodyBalance !== null) return serverAmerCustodyBalance;
    return round2(amerCustodyTopupsTotalAll() - paidToScrapyardTotalForCustody());
}

function amerCustodyDeficit() {
    return round2(Math.max(0, -amerCustodyBalance()));
}

function bindTaskCategoryEvents(key) {
    document.getElementById("btn-back-to-tasks-menu").addEventListener("click", () => {
        if (!currentUserIsElevated) {
            closeTasksView();
            return;
        }
        activeTaskCategory = null;
        renderTasksView();
    });
    const addBtn = document.getElementById("add-task-btn");
    const input = document.getElementById("new-task-input");
    if (addBtn && input) {
        const addTask = async () => {
            if (addBtn.disabled) return;
            const text = input.value.trim();
            if (!text) return;
            if (!Array.isArray(appData.tasks[key])) appData.tasks[key] = [];
            const newItem = {
                id: uid("task"),
                text: text,
                done: false,
                createdAt: (new Date).toISOString()
            };
            addBtn.disabled = true;
            const saved = await persistTaskItem(newItem, key);
            addBtn.disabled = false;
            if (!saved) return;
            appData.tasks[key].push(newItem);
            input.value = "";
            updateTasksBadge();
            refreshTaskItemsList(key);
        };
        addBtn.addEventListener("click", addTask);
        input.addEventListener("keydown", e => {
            if (e.key === "Enter") {
                e.preventDefault();
                addTask();
            }
        });
    }
    bindTaskItemEvents(key);
}

function bindTaskItemEvents(key) {
    const list = document.getElementById("task-items-list");
    if (!list) return;
    list.querySelectorAll(".task-item-row").forEach(row => {
        const tid = row.getAttribute("data-task-id");
        const item = (appData.tasks[key] || []).find(t => t.id === tid);
        if (!item) return;
        row.querySelector(".task-item-check").addEventListener("change", async e => {
            const liveItem = (appData.tasks[key] || []).find(t => t.id === tid);
            if (!liveItem) return;
            const prevDone = liveItem.done;
            liveItem.done = e.target.checked;
            row.classList.toggle("task-item-done", liveItem.done);
            updateTasksBadge();
            const saved = currentUserIsElevated ? await persistTaskItem(liveItem, key) : await setMyTaskDoneViaRpc(liveItem.id, liveItem.done);
            if (!saved) {
                liveItem.done = prevDone;
                e.target.checked = prevDone;
                row.classList.toggle("task-item-done", prevDone);
                updateTasksBadge();
            }
        });
        const removeBtn = row.querySelector(".task-item-remove-btn");
        if (removeBtn) removeBtn.addEventListener("click", async () => {
            const deleted = await deleteTaskItem(tid);
            if (!deleted) return;
            appData.tasks[key] = (appData.tasks[key] || []).filter(t => t.id !== tid);
            updateTasksBadge();
            refreshTaskItemsList(key);
        });
    });
}

function refreshTaskItemsList(key) {
    const list = document.getElementById("task-items-list");
    if (!list) return;
    const items = appData.tasks[key] || [];
    list.innerHTML = items.length ? items.map(taskItemRowHtml).join("") : '<div class="expense-empty-hint">ما فيه مهام مضافة بعد</div>';
    bindTaskItemEvents(key);
}

function sanitizeForExcelFormula(value) {
    if (typeof value !== "string" || !value.length) return value;
    if (/^[=+\-@\t\r]/.test(value)) return "'" + value;
    return value;
}

function sheetRowsSafe(rows) {
    return (rows || []).map(row => {
        const safe = {};
        Object.keys(row).forEach(k => {
            safe[k] = sanitizeForExcelFormula(row[k]);
        });
        return safe;
    });
}

async function importDataFromExcelFile(file) {
    try {
        await ensureXLSX();
    } catch (e) {}
    if (typeof XLSX === "undefined") {
        showToast("تعذر تحميل مكتبة Excel — تأكد من الاتصال بالإنترنت وحاول مرة أخرى", "error");
        return;
    }
    const reader = new FileReader;
    reader.onload = () => {
        let parsed;
        try {
            const wb = XLSX.read(reader.result, {
                type: "array"
            });
            const sheetName = wb.SheetNames.find(n => n.indexOf("نسخة احتياطية") === 0);
            if (!sheetName) throw new Error("NO_BACKUP_SHEET");
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {
                header: 1
            });
            const rawJson = rows.map(r => r && r[0] != null ? String(r[0]) : "").join("");
            parsed = JSON.parse(rawJson);
            if (!parsed || !Array.isArray(parsed.orders)) throw new Error("BAD_SHAPE");
        } catch (err) {
            showToast('هذا الملف لا يحتوي نسخة صالحة للاستيراد — لازم يكون نفس ملف "تصدير Excel" من هذا النظام', "error");
            return;
        }
        confirmImportOverwrite(parsed);
    };
    reader.onerror = () => showToast("تعذر قراءة الملف", "error");
    reader.readAsArrayBuffer(file);
}

function normalizeImportedOrder(o) {
    const base = {
        id: uid("ord"),
        orderNumber: "",
        orderLabel: "",
        parts: [],
        partsSelectionEnabled: false,
        paidToAmer: false,
        paidToOmar: false,
        paidToSupplier: false,
        supplied: false,
        customerPhone: "",
        customerPayments: [],
        confirmed: false,
        feeEnabled: false,
        feePercent: 0,
        serviceFeeEnabled: false,
        serviceFeePercent: 0,
        deliveryFeeEnabled: false,
        deliveryFeeAmount: 0,
        deliveryCost: 0,
        createdAt: (new Date).toISOString(),
        updatedAt: (new Date).toISOString()
    };
    const merged = Object.assign(base, o || {});
    if (!Array.isArray(merged.parts)) merged.parts = [];
    if (!Array.isArray(merged.customerPayments)) merged.customerPayments = [];
    return merged;
}

function confirmImportOverwrite(parsedData) {
    const orderCount = Array.isArray(parsedData.orders) ? parsedData.orders.length : 0;
    const hasSuppliersInFile = Array.isArray(parsedData.suppliers);
    const hasCustomersInFile = Array.isArray(parsedData.customers);
    confirmAction({
        title: "استيراد البيانات؟",
        message: "الملف يحتوي " + orderCount + " طلبية. سيتم استبدال كل البيانات الحالية (الطلبيات، الصندوق، المهام، الموردين، العملاء) بمحتوى هذا الملف — إجراء نهائي ولا يمكن التراجع عنه.",
        confirmLabel: "استبدال البيانات",
        dangerous: true,
        onConfirm: async () => {
            const previousAppData = appData;
            appData = {
                orders: (Array.isArray(parsedData.orders) ? parsedData.orders : []).map(normalizeImportedOrder),
                treasury: Object.assign(defaultTreasury(), parsedData.treasury || {}),
                tasks: Object.assign(defaultTasks(), parsedData.tasks || {}),
                suppliers: hasSuppliersInFile ? parsedData.suppliers : previousAppData.suppliers || [],
                customers: hasCustomersInFile ? parsedData.customers : previousAppData.customers || []
            };
            migrateLegacyCustomerPayment();
            migrateLegacyOrderLabel();
            migrateLegacyTreasury();
            migrateLegacyTasks();
            try {
                await replaceAllOrders(appData.orders);
                await replaceAllTreasuryEntries(appData.treasury);
                await replaceAllTaskItems(appData.tasks);
                if (hasSuppliersInFile) await replaceAllSuppliers(appData.suppliers);
                if (hasCustomersInFile) await replaceAllCustomers(appData.customers);
            } catch (e) {
                appData = previousAppData;
                showToast("تعذر استبدال البيانات: " + friendlyErrorText(e) + " — جاري إعادة التحميل من قاعدة البيانات", "error");
                try {
                    await loadData();
                } catch (e2) {}
                if (document.getElementById("treasury-view").style.display !== "none") {
                    renderTreasuryView();
                }
                renderKPIs();
                renderTable();
                renderQuotesList();
                updateTasksBadge();
                updateSuppliersBadge();
                updateCustomersBadge();
                return;
            }
            if (document.getElementById("treasury-view").style.display !== "none") {
                renderTreasuryView();
            }
            renderKPIs();
            renderTable();
            renderQuotesList();
            updateTasksBadge();
            updateSuppliersBadge();
            updateCustomersBadge();
            showToast("تم استيراد البيانات بنجاح", "ok");
        }
    });
}

function consumeNotifUrlParam() {
    const params = new URLSearchParams(location.search);
    if (params.get("notif") !== "1") return false;
    params.delete("notif");
    const qs = params.toString();
    history.replaceState(null, "", location.pathname + (qs ? "?" + qs : ""));
    return true;
}

function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
}

function isIosNonStandalone() {
    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.navigator.standalone === true || window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
    return isIos && !isStandalone;
}

function pushSupported() {
    return "serviceWorker" in navigator && "PushManager" in window;
}

async function getExistingPushSubscription() {

async function subscribeToPush() {
    if (isIosNonStandalone()) {
        showToast("لازم تضيف الموقع لشاشتك الرئيسية أولًا (زر المشاركة ← إضافة للشاشة الرئيسية بالآيفون) وتفتحه من هناك", "error");
        return;
    }
    if (!pushSupported()) {
        showToast("متصفحك ما يدعم إشعارات push", "error");
        return;
    }
    try {
        const permission = await Notification.requestPermission();
        if (permission !== "granted") {
            showToast("ما وافقت على الإشعارات من إعدادات المتصفح", "error");
            return;
        }
        const reg = await navigator.serviceWorker.register("sw.js");
        await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();
        if (!sub) {
            sub = await reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(PUSH_VAPID_PUBLIC_KEY)
            });
        }
        const subJson = sub.toJSON();
        const {error: error} = await sb.from("push_subscriptions").upsert({
            email: presenceEmail,
            endpoint: subJson.endpoint,
            p256dh: subJson.keys.p256dh,
            auth: subJson.keys.auth
        }, {
            onConflict: "endpoint"
        });
        if (error) {
            showToast("تعذر حفظ الاشتراك: " + error.message, "error");
            return;
        }
        updatePushButtonUi(true);
        showToast("تفعّلت الإشعارات على هذا الجهاز", "ok");
    } catch (e) {
        showToast("تعذر تفعيل الإشعارات: " + friendlyErrorText(e), "error");
    }
}

async function unsubscribeFromPush() {
    try {
        const sub = await getExistingPushSubscription();
        if (sub) {
            const endpoint = sub.endpoint;
            await sub.unsubscribe();
            if (sb) await sb.from("push_subscriptions").delete().eq("endpoint", endpoint);
        }
        updatePushButtonUi(false);
        showToast("تم إيقاف الإشعارات على هذا الجهاز", "ok");
    } catch (e) {
        showToast("تعذر إيقاف الإشعارات", "error");
    }
}

async function togglePushSubscription() {

}

async function replaceAllRowsSafely(table, rows) {
    const CHUNK = 100;
    const keepIds = new Set(rows.map(r => r.id));
    const {data: existing, error: selError} = await sb.from(table).select("id");
    if (selError) throw selError;
    const toDelete = (existing || []).map(r => r.id).filter(id => !keepIds.has(id));
    for (let i = 0; i < toDelete.length; i += CHUNK) {
        const {error: error} = await sb.from(table).delete().in("id", toDelete.slice(i, i + CHUNK));
        if (error) throw error;
    }
    for (let i = 0; i < rows.length; i += CHUNK) {
        const {error: error} = await sb.from(table).upsert(rows.slice(i, i + CHUNK));
        if (error) throw error;
    }
}

function supplierStatsRows() {
    const rows = (appData.suppliers || []).map(s => {
        const {ongoing: ongoing, past: past} = supplierPurchaseHistory(s.id);
        const purchaseTotal = round2(ongoing.reduce((sum, r) => sum + r.amount, 0) + past.reduce((sum, r) => sum + r.amount, 0));
        const {approved: approved, pending: pending} = supplierPricedHistory(s.id);
        return {
            name: s.name || s.phone || "مورد",
            purchaseTotal: purchaseTotal,
            purchaseOrdersCount: ongoing.length + past.length,
            approvedTotal: round2(approved.reduce((sum, r) => sum + r.amount, 0)),
            pendingTotal: round2(pending.reduce((sum, r) => sum + r.amount, 0)),
            pendingCount: pending.length,
            owedNow: supplierOwedAmount(s.id),
            receivables: supplierReturnReceivableTotal(s.id)
        };
    });
    rows.sort((a, b) => b.purchaseTotal - a.purchaseTotal);
    return rows.map((r, i) => ({
        "الترتيب": i + 1,

        "عدد طلبات التسعير المعلّقة": r.pendingCount,
        "المستحق له حاليًا (غير مسدد)": r.owedNow,
        "مرتجعات بانتظار التحصيل": r.receivables
    }));
}

async function importSuppliersFromExcelFile(file) {
    try {
        await ensureXLSX();
    } catch (e) {}
    if (typeof XLSX === "undefined") {
        showToast("تعذر تحميل مكتبة Excel — تأكد من الاتصال بالإنترنت وحاول مرة أخرى", "error");
        return;
    }
    const reader = new FileReader;
    reader.onload = async () => {
        let rows;
        try {
            const wb = XLSX.read(reader.result, {
                type: "array"
            });
            const sheetName = wb.SheetNames.includes("الموردين") ? "الموردين" : wb.SheetNames[0];
            rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {
                defval: ""
            });
        } catch (err) {
            showToast("تعذر قراءة الملف — تأكد إنه ملف Excel صالح", "error");
            return;
        }
        if (!rows || !rows.length) {
            showToast("الملف فاضي — ما فيه صفوف للاستيراد", "error");
            return;
        }
        const working = (appData.suppliers || []).map(s => Object.assign({}, s));
        const byId = new Map(working.map(s => [ s.id, s ]));
        const readYesNo = (v, fallback) => {
            const s = String(v == null ? "" : v).trim();
            if (!s) return fallback;
            return s === "نعم";
        };
        const toUpsertById = new Map;
        let skippedEmpty = 0;
        rows.forEach(row => {
            const id = String(row["المعرّف"] || "").trim();
            const name = String(row["الاسم"] || "").trim();
            const phone = String(row["الجوال"] || "").trim();
            if (!name && !phone) {
                skippedEmpty++;
                return;
            }
            const extraPhonesRaw = String(row["أرقام إضافية"] || "").trim();
            const extraPhones = extraPhonesRaw ? extraPhonesRaw.split("/").map(x => x.trim()).filter(Boolean) : [];
            const handlesNew = readYesNo(row["قطع جديدة"], true);
            const handlesUsed = readYesNo(row["قطع مستعملة"], true);
            const carMakesRaw = String(row["السيارات"] || "").trim();
            const carMakes = carMakesRaw ? carMakesRaw.split("/").map(x => x.trim()).filter(Boolean) : [];
            const notes = String(row["ملاحظات"] || "").trim();
            let target = id ? byId.get(id) : null;
            if (!target) target = findDuplicateSupplier(name, phone, working);
            if (target) {
                target.name = name;
                target.phone = phone;
                target.extraPhones = extraPhones;
                target.handlesNew = handlesNew;
                target.handlesUsed = handlesUsed;
                target.notes = notes;
                target.carMakes = carMakes;
                if (target._importIsNew === undefined) target._importIsNew = false;
            } else {
                target = {
                    id: uid("sup"),
                    name: name,
                    phone: phone,
                    notes: notes,
                    extraPhones: extraPhones,
                    handlesNew: handlesNew,
                    handlesUsed: handlesUsed,
                    carMakes: carMakes,
                    createdAt: (new Date).toISOString(),
                    _importIsNew: true
                };
                working.push(target);
                byId.set(target.id, target);
            }
            toUpsertById.set(target.id, target);
        });
        const toUpsert = Array.from(toUpsertById.values());
        if (!toUpsert.length) {
            showToast("ما فيه صفوف صالحة للاستيراد (لازم اسم أو جوال على الأقل بكل صف)", "error");
            return;
        }
        showToast("جاري استيراد " + toUpsert.length + " مورد…", "ok");
        const results = await Promise.all(toUpsert.map(s => persistSupplier(s)));
        let addedCount = 0, updatedCount = 0, failedCount = 0;
        toUpsert.forEach((s, i) => {
            if (!results[i]) {
                failedCount++;
                return;
            }
            if (s._importIsNew) addedCount++; else updatedCount++;
            delete s._importIsNew;
            const idx = (appData.suppliers || []).findIndex(x => x.id === s.id);
            if (idx >= 0) appData.suppliers[idx] = s; else {
                if (!Array.isArray(appData.suppliers)) appData.suppliers = [];
                appData.suppliers.push(s);
            }
        });
        refreshSuppliersList();
        updateSuppliersBadge();
        if (failedCount > 0) {
            showToast("تم استيراد " + (addedCount + updatedCount) + " من " + toUpsert.length + " — فشل حفظ " + failedCount + " (تحقق من الصلاحيات/الاتصال)", "error");
        } else {
            showToast("تم الاستيراد: " + addedCount + " مورد جديد، " + updatedCount + " تم تحديثه" + (skippedEmpty ? "، وتجاهلنا " + skippedEmpty + " صف فاضي" : ""), "ok");
        }
    };
    reader.onerror = () => showToast("تعذر قراءة الملف", "error");
    reader.readAsArrayBuffer(file);
}

function supplierOwedAmount(supplierId) {
    let total = 0;
    (appData.orders || []).forEach(o => {
        if (!o.supplied) return;
        (o.parts || []).forEach(p => {
            if (p.supplierId !== supplierId) return;
            if (p.returned) return;
            if (!partIsIncludedInOrder(o, p)) return;
            const paid = partPurchaseCostSettled(o, p);
            if (paid) return;
            total += (Number(p.qty) || 1) * (Number(p.costPrice) || 0);
        });
    });
    return round2(total);
}

function isoToDisplayDate(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "—";
    return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear();
}

function supplierPurchaseHistory(supplierId) {
    const ongoingMap = {}, pastMap = {};
    const ongoing = [], past = [];
    (appData.orders || []).forEach(o => {
        if (!o.supplied) return;
        (o.parts || []).forEach(p => {
            if (p.supplierId !== supplierId) return;
            if (p.returned) return;
            if (!partIsIncludedInOrder(o, p)) return;
            const paid = partPurchaseCostSettled(o, p);
            const map = paid ? pastMap : ongoingMap;
            const list = paid ? past : ongoing;
            if (!map[o.id]) {
                map[o.id] = {
                    orderId: o.id,
                    orderNumber: o.orderNumber,
                    orderLabel: o.orderLabel,
                    amount: 0,
                    count: 0,
                    date: o.suppliedAt || o.updatedAt || o.createdAt || ""
                };
                list.push(map[o.id]);
            }
            map[o.id].amount = round2(map[o.id].amount + (Number(p.qty) || 1) * (Number(p.costPrice) || 0));
            map[o.id].count++;
        });
    });
    const byDateDesc = (a, b) => new Date(b.date || 0) - new Date(a.date || 0);
    ongoing.sort(byDateDesc);
    past.sort(byDateDesc);
    return {
        ongoing: ongoing,
        past: past
    };
}

function supplierPricedHistory(supplierId) {
    const approvedMap = {}, pendingMap = {};
    const approved = [], pending = [];
    (appData.orders || []).forEach(o => {
        (o.parts || []).forEach(p => {
            if (p.supplierId !== supplierId) return;
            const isQuote = !!o.isQuote;
            const map = isQuote ? pendingMap : approvedMap;
            const list = isQuote ? pending : approved;
            if (!map[o.id]) {
                map[o.id] = {
                    orderId: o.id,
                    orderNumber: o.orderNumber,
                    orderLabel: o.orderLabel,
                    amount: 0,
                    count: 0,
                    date: o.suppliedAt || o.updatedAt || o.createdAt || "",
                    isQuote: isQuote,
                    supplied: !!o.supplied,
                    returnedCount: 0
                };
                list.push(map[o.id]);
            }
            map[o.id].amount = round2(map[o.id].amount + (Number(p.qty) || 1) * (Number(p.costPrice) || 0));
            map[o.id].count++;
            if (p.returned) map[o.id].returnedCount++;
        });
    });
    const byDateDesc = (a, b) => new Date(b.date || 0) - new Date(a.date || 0);
    approved.sort(byDateDesc);
    pending.sort(byDateDesc);
    return {
        approved: approved,
        pending: pending
    };
}

function supplierReturnReceivables(supplierId) {
    const rows = [];
    (appData.orders || []).forEach(o => {
        if (!o.confirmed) return;
        (o.parts || []).forEach(p => {
            if (p.supplierId !== supplierId) return;
            if (!p.returned || !p.returnHasReceivable || p.returnCollected) return;
            if (!partIsIncludedInOrder(o, p)) return;
            rows.push({
                orderId: o.id,
                orderNumber: o.orderNumber,
                orderLabel: o.orderLabel,
                partId: p.id,
                description: p.description || "",
                amount: round2((Number(p.qty) || 1) * (Number(p.costPrice) || 0)),
                used: !!p.used
            });
        });
    });
    return rows;
}

function supplierReturnReceivableTotal(supplierId) {
    return round2(supplierReturnReceivables(supplierId).reduce((s, r) => s + r.amount, 0));
}

function supplierReturnReceivablesIndex() {
    const bySupplierRaw = {};
    (appData.orders || []).forEach(o => {
        if (!o.confirmed) return;
        (o.parts || []).forEach(p => {
            if (!p.supplierId) return;
            if (!p.returned || !p.returnHasReceivable || p.returnCollected) return;
            if (!partIsIncludedInOrder(o, p)) return;
            const amount = round2((Number(p.qty) || 1) * (Number(p.costPrice) || 0));
            bySupplierRaw[p.supplierId] = (bySupplierRaw[p.supplierId] || 0) + amount;
        });
    });
    const bySupplier = {};
    let grandTotal = 0;
    Object.keys(bySupplierRaw).forEach(id => {
        bySupplier[id] = round2(bySupplierRaw[id]);
        grandTotal += bySupplier[id];
    });
    return {
        bySupplier: bySupplier,
        grandTotal: round2(grandTotal)
    };
}

function totalSupplierReturnReceivables() {

    return round2((appData.suppliers || []).reduce((sum, s) => sum + (idx[s.id] || 0), 0));
}

function openSupplierHistoryModal(supplierId) {
    openSupplierHistoryId = supplierId;
    const supplier = (appData.suppliers || []).find(s => s.id === supplierId);
    const label = supplier ? supplier.name || supplier.phone || "مورد" : "مورد";
    const {ongoing: ongoing, past: past} = supplierPurchaseHistory(supplierId);
    const ongoingTotal = round2(ongoing.reduce((s, r) => s + r.amount, 0));
    const pastTotal = round2(past.reduce((s, r) => s + r.amount, 0));
    const receivables = supplierReturnReceivables(supplierId);
    const receivablesTotal = round2(receivables.reduce((s, r) => s + r.amount, 0));
    const {approved: approved, pending: pending} = supplierPricedHistory(supplierId);
    const approvedTotal = round2(approved.reduce((s, r) => s + r.amount, 0));
    const pendingTotal = round2(pending.reduce((s, r) => s + r.amount, 0));
    const root = document.getElementById("modal-root");
    root.innerHTML = '<div class="modal-backdrop" data-close-backdrop>' + '<div class="modal-card modal-card-sm" role="dialog" aria-modal="true">' + '<div class="modal-header"><div class="modal-title">ملف المورد — ' + escapeHtml(label) + "</div>" + '<button type="button" class="icon-btn" id="supplier-history-close-btn" aria-label="إغلاق">✕</button></div>' + '<div class="purchase-history-section">' + '<div class="purchase-history-section-title"><span>المسعّر — معتمدة</span><span class="num">' + fmtMoney(approvedTotal) + "</span></div>" + (approved.length ? approved.map(pricedHistoryRowHtml).join("") : '<div class="expense-empty-hint">ما فيه قطع مسعّرة عنده بطلبيات معتمدة</div>') + "</div>" + '<div class="purchase-history-section">' + '<div class="purchase-history-section-title"><span>المسعّر — غير معتمدة (طلبات تسعير)</span><span class="num">' + fmtMoney(pendingTotal) + "</span></div>" + (pending.length ? pending.map(pricedHistoryRowHtml).join("") : '<div class="expense-empty-hint">ما فيه طلبات تسعير معلّقة عنده</div>') + "</div>" + (receivables.length ? '<div class="purchase-history-section">' + '<div class="purchase-history-section-title"><span>مرتجعات بانتظار التحصيل</span><span class="num text-green">' + fmtMoney(receivablesTotal) + "</span></div>" + receivables.map(returnReceivableRowHtml).join("") + "</div>" : "") + '<div class="purchase-history-section">' + '<div class="purchase-history-section-title"><span>جارية (غير مسددة)</span><span class="num text-rust">' + fmtMoney(ongoingTotal) + "</span></div>" + (ongoing.length ? ongoing.map(purchaseHistoryRowHtml).join("") : '<div class="expense-empty-hint">ما فيه مشتريات جارية</div>') + "</div>" + '<div class="purchase-history-section">' + '<div class="purchase-history-section-title"><span>سابقة (مسددة)</span><span class="num text-green">' + fmtMoney(pastTotal) + "</span></div>" + (past.length ? past.map(purchaseHistoryRowHtml).join("") : '<div class="expense-empty-hint">ما فيه مشتريات سابقة</div>') + "</div>" + "</div>" + "</div>";
    root.classList.add("modal-open");
    const close = () => {
        root.innerHTML = "";
        root.classList.remove("modal-open");
        openSupplierHistoryId = null;
    };
    root.querySelector("[data-close-backdrop]").addEventListener("click", e => {
        if (e.target.hasAttribute("data-close-backdrop")) close();
    });
    root.querySelector("#supplier-history-close-btn").addEventListener("click", close);
    root.querySelectorAll("[data-open-order]").forEach(btn => {
        btn.addEventListener("click", e => {
            if (e.target.closest(".proposal-pending-banner")) return;
            modalCloseCallback = () => openSupplierHistoryModal(supplierId);
            close();
            openModal("edit", btn.getAttribute("data-open-order"));
        });
    });
    root.querySelectorAll("[data-open-priced]").forEach(btn => {
        btn.addEventListener("click", () => {
            const orderId = btn.getAttribute("data-open-priced");
            const isQuote = btn.getAttribute("data-is-quote") === "1";
            modalCloseCallback = () => openSupplierHistoryModal(supplierId);
            close();
            if (isQuote) openQuoteModal("edit", orderId); else openModal("edit", orderId);
        });
    });
    root.querySelectorAll(".return-collect-btn").forEach(btn => {
        btn.addEventListener("click", async e => {
            e.stopPropagation();
            const orderId = btn.getAttribute("data-order-id");
            const partId = btn.getAttribute("data-part-id");
            if (!hasElevatedAccess()) {
                await requestReturnCollect(orderId, partId);
                openSupplierHistoryModal(supplierId);
                return;
            }
            const isUsed = btn.getAttribute("data-used") === "1";
            if (isUsed) {
                confirmCollectScrapyardReturn(orderId, partId, supplierId);
            } else {
                confirmAction({
                    title: "تأكيد تحصيل هذا المبلغ من المورد؟",
                    message: "رح يُضاف المبلغ تلقائيًا لصافي الصندوق.",
                    confirmLabel: "تم التحصيل",
                    onConfirm: async () => {
                        const order = appData.orders.find(o => o.id === orderId);
                        if (!order) return;
                        const part = (order.parts || []).find(p => p.id === partId);
                        if (!part) return;
                        const prevUpdatedAt = order.updatedAt;
                        part.returnCollected = true;
                        order.updatedAt = (new Date).toISOString();
                        const saved = await persistOrder(order);
                        if (!saved) {
                            part.returnCollected = false;
                            order.updatedAt = prevUpdatedAt;
                            return;
                        }
                        showToast("تم تسجيل التحصيل، وأُضيف المبلغ للصندوق", "ok");
                        refreshSuppliersList();
                        updateSuppliersBadge();
                        renderKPIs();
                        openSupplierHistoryModal(supplierId);
                    }
                });
            }
        });
    });
}

function suppliersMatchingSearch(receivablesIdx, sortIdx) {
    const idx = receivablesIdx || supplierReturnReceivablesIndex().bySupplier;
    const q = suppliersSearchQuery.trim().toLowerCase();
    let rows = appData.suppliers || [];
    const isEditing = s => !!editingSuppliers[s.id];
    if (suppliersKindFilter === "new") rows = rows.filter(s => isEditing(s) || s.handlesNew); else if (suppliersKindFilter === "used") rows = rows.filter(s => isEditing(s) || s.handlesUsed);
    if (q) {
        rows = rows.filter(s => {
            if (isEditing(s)) return true;
            const hay = [ s.name, s.phone ].concat(Array.isArray(s.extraPhones) ? s.extraPhones : []).join(" ").toLowerCase();
            return hay.includes(q);
        });
    }
    if (sortIdx) {
        return [ ...rows ].sort((a, b) => (sortIdx[b.id] || 0) - (sortIdx[a.id] || 0));
    }
    return [ ...rows ].sort((a, b) => {
        const ap = (idx[a.id] || 0) > 0 ? 1 : 0;
        const bp = (idx[b.id] || 0) > 0 ? 1 : 0;
        if (bp - ap) return bp - ap;
        return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
    });
}

function suppliersItemsListHtml() {
    const receivablesIdx = supplierReturnReceivablesIndex().bySupplier;
    const owedIdx = supplierOwedIndex();
    const sortIdx = suppliersSortBy === "purchases" ? supplierPurchaseTotalIndex() : suppliersSortBy === "pricing" ? supplierPricedTotalIndex() : null;
    const rows = suppliersMatchingSearch(receivablesIdx, sortIdx);
    if (!rows.length) return '<div class="expense-empty-hint">' + (suppliersSearchQuery.trim() ? "ما فيه نتائج مطابقة" : "ما فيه موردين مضافين بعد") + "</div>";

}

        }
    });

    });
    document.getElementById("suppliers-excel-import-input").addEventListener("change", e => {

    });

        });
    }
    bindBusyButton(document.getElementById("add-supplier-btn"), async () => {
        const nameInput = document.getElementById("new-supplier-name-input");
        const phoneInput = document.getElementById("new-supplier-phone-input");
        const handlesNewCheck = document.getElementById("new-supplier-handles-new-check");
        const handlesUsedCheck = document.getElementById("new-supplier-handles-used-check");
        const name = nameInput.value.trim();
        const phone = phoneInput.value.trim();
        if (!name && !phone) {
            showToast("اكتب اسم أو رقم جوال على الأقل", "error");
            return;
        }
        if (!handlesNewCheck.checked && !handlesUsedCheck.checked) {
            showToast("لازم تحدد نوع واحد على الأقل (قطع جديدة/مستعملة)", "error");
            return;
        }
        if (!newSupplierCarMakes.length) {
            showToast("لازم تحدد سيارة وحدة على الأقل", "error");
            return;
        }
        const dup = findDuplicateSupplier(name, phone);
        if (dup) {
            showToast("مورد موجود مسبقًا بنفس الاسم أو الرقم: " + (dup.name || dup.phone || "مورد"), "error");
            return;
        }
        const newSupplier = {
            id: uid("sup"),
            name: name,
            phone: phone,
            notes: "",
            extraPhones: [],
            handlesNew: handlesNewCheck.checked,
            handlesUsed: handlesUsedCheck.checked,
            carMakes: newSupplierCarMakes.slice(),
            createdAt: (new Date).toISOString()
        };
        if (!Array.isArray(appData.suppliers)) appData.suppliers = [];
        const saved = await persistSupplier(newSupplier);
        if (!saved) return;
        appData.suppliers.push(newSupplier);
        nameInput.value = "";
        phoneInput.value = "";
        handlesNewCheck.checked = false;
        handlesUsedCheck.checked = false;
        newSupplierCarMakes = [];
        refreshSuppliersList();
        updateSuppliersBadge();
        const wrap = document.getElementById("new-supplier-car-makes-wrap");
        if (wrap) {
            const chipsWrap = wrap.querySelector(".car-makes-chips");
            if (chipsWrap) chipsWrap.querySelectorAll(".chip-active").forEach(c => c.classList.remove("chip-active"));
            const searchInput = wrap.querySelector(".car-makes-search-input");
            if (searchInput) searchInput.value = "";
        }
    });
    const searchInput = document.getElementById("suppliers-search-input");
    let suppliersDebounceTimer;
    searchInput.addEventListener("input", e => {
        clearTimeout(suppliersDebounceTimer);
        const val = e.target.value;
        suppliersDebounceTimer = setTimeout(() => {
            suppliersSearchQuery = val;
            refreshSuppliersList();
        }, 150);
    });
    bindSupplierRowEvents();
}

function bindSupplierRowEvents() {
    document.querySelectorAll("#suppliers-items-list .task-item-row").forEach(row => {
        const sid = row.getAttribute("data-supplier-id");
        const supplier = (appData.suppliers || []).find(s => s.id === sid);

        const historyBtn = row.querySelector(".supplier-history-btn");
        if (historyBtn) historyBtn.addEventListener("click", () => openSupplierHistoryModal(sid));
        const contactBtn = row.querySelector(".supplier-contact-btn");
        if (contactBtn) contactBtn.addEventListener("click", () => openContactModal(supplier.phone, "المورد"));
        const removeBtn = row.querySelector(".task-item-remove-btn");
        if (removeBtn) {
            removeBtn.addEventListener("click", () => {
                const pendingReceivable = supplierReturnReceivableTotal(sid);
                confirmAction({
                    title: "حذف هذا المورد؟",
                    message: (pendingReceivable > 0 ? "⚠️ عنده مسترجع بانتظار التحصيل بقيمة " + fmtMoney(pendingReceivable) + " — بيختفي فورًا من قائمة الموردين ومؤشرات الرئيسية/الصندوق لو حذفته. " : "") + "الطلبيات القديمة المرتبطة به بتبقى، بس بدون اسم مورد محدد.",
                    confirmLabel: "تأكيد الحذف",
                    dangerous: true,
                    onConfirm: async () => {
                        const deleted = await deleteSupplier(sid);
                        if (!deleted) return;
                        appData.suppliers = (appData.suppliers || []).filter(s => s.id !== sid);
                        delete editingSuppliers[sid];
                        refreshSuppliersList();
                        updateSuppliersBadge();
                    }
                });
            });
        }
        const editBtn = row.querySelector(".supplier-edit-btn");
        if (editBtn) {
            editBtn.addEventListener("click", () => {
                editingSuppliers[sid] = true;
                refreshSuppliersList();
            });
        }
        const saveBtn = row.querySelector(".supplier-save-btn");
        if (saveBtn) {
            saveBtn.addEventListener("click", async () => {
                const s = freshSupplier();
                if (Array.isArray(s.extraPhones) && s.extraPhones.some(ph => !ph || !ph.trim())) {
                    const prev = {
                        extraPhones: s.extraPhones.slice()
                    };
                    s.extraPhones = s.extraPhones.filter(ph => ph && ph.trim());
                    await persistFieldOrRevert(s, prev, persistSupplier, refreshSuppliersList);
                }
                delete editingSuppliers[sid];
                refreshSuppliersList();
            });
        }
        const freshSupplier = () => (appData.suppliers || []).find(x => x.id === sid) || supplier;
        const nameInput = row.querySelector(".supplier-name-input");
        if (nameInput) {
            nameInput.addEventListener("change", async e => {
                const s = freshSupplier();
                const prev = {
                    name: s.name
                };
                const trimmed = e.target.value.trim();
                if (!trimmed) {
                    showToast("اسم المورد ما يصير يكون فاضي", "error");
                    s.name = prev.name;
                    refreshSuppliersList();
                    return;
                }
                s.name = trimmed;
                await persistFieldOrRevert(s, prev, persistSupplier, refreshSuppliersList);
            });
        }
        const phoneInput = row.querySelector(".supplier-phone-input");
        if (phoneInput) {
            phoneInput.addEventListener("change", async e => {
                const s = freshSupplier();
                const newPhone = e.target.value;
                const dup = findDuplicateSupplier(s.name, newPhone);
                if (dup && dup.id !== s.id) {
                    showToast("رقم الجوال هذا مستخدم أصلًا لمورد آخر: " + (dup.name || dup.phone || "مورد"), "error");
                    refreshSuppliersList();
                    return;
                }
                const prev = {
                    phone: s.phone
                };
                s.phone = newPhone;
                await persistFieldOrRevert(s, prev, persistSupplier, refreshSuppliersList);
            });
        }
        const addPhoneBtn = row.querySelector(".supplier-add-phone-btn");
        if (addPhoneBtn) {
            addPhoneBtn.addEventListener("click", () => {
                const s = freshSupplier();
                if (!Array.isArray(s.extraPhones)) s.extraPhones = [];
                s.extraPhones.push("");
                refreshSuppliersList();
            });
        }
        const handlesNewCheck = row.querySelector(".supplier-handles-new-check");
        if (handlesNewCheck) {
            handlesNewCheck.addEventListener("change", async e => {
                const s = freshSupplier();
                if (!e.target.checked && !s.handlesUsed) {
                    e.target.checked = true;
                    showToast("لازم تحدد نوع واحد على الأقل", "error");
                    return;
                }
                const prev = {
                    handlesNew: s.handlesNew
                };
                s.handlesNew = e.target.checked;
                await persistFieldOrRevert(s, prev, persistSupplier, refreshSuppliersList);
            });
        }
        const handlesUsedCheck = row.querySelector(".supplier-handles-used-check");
        if (handlesUsedCheck) {
            handlesUsedCheck.addEventListener("change", async e => {
                const s = freshSupplier();
                if (!e.target.checked && !s.handlesNew) {
                    e.target.checked = true;
                    showToast("لازم تحدد نوع واحد على الأقل", "error");
                    return;
                }
                const prev = {
                    handlesUsed: s.handlesUsed
                };
                s.handlesUsed = e.target.checked;
                await persistFieldOrRevert(s, prev, persistSupplier, refreshSuppliersList);
            });
        }
        const carMakesPicker = row.querySelector(".car-makes-picker");
        if (carMakesPicker) {
            bindCarMakesPicker(carMakesPicker, () => freshSupplier().carMakes || [], async (make, nowSelected, btn) => {
                const s = freshSupplier();
                const current = Array.isArray(s.carMakes) ? s.carMakes : [];
                if (!nowSelected && current.length <= 1) {
                    btn.classList.add("chip-active");
                    showToast("لازم تحدد سيارة وحدة على الأقل", "error");
                    return;
                }
                const prev = {
                    carMakes: current.slice()
                };
                s.carMakes = nowSelected ? current.concat([ make ]) : current.filter(m => m !== make);
                await persistFieldOrRevert(s, prev, persistSupplier, refreshSuppliersList);
            });
        }
        row.querySelectorAll(".supplier-extra-phone-input").forEach(inp => {
            inp.addEventListener("change", async e => {
                const idx = Number(inp.getAttribute("data-phone-index"));
                const s = freshSupplier();
                const prev = {
                    extraPhones: s.extraPhones.slice()
                };
                s.extraPhones[idx] = e.target.value;
                await persistFieldOrRevert(s, prev, persistSupplier, refreshSuppliersList);
            });
        });
        row.querySelectorAll(".supplier-remove-phone-btn").forEach(btn => {
            btn.addEventListener("click", async () => {
                const idx = Number(btn.getAttribute("data-phone-index"));
                const s = freshSupplier();

                    extraPhones: s.extraPhones.slice()
                };
                s.extraPhones.splice(idx, 1);
                refreshSuppliersList();
                await persistFieldOrRevert(s, prev, persistSupplier, refreshSuppliersList);
            });
        });
    });
}

function customerOrderStats(customerId) {
    let count = 0, remaining = 0;
    (appData.orders || []).forEach(o => {
        if (o.customerId !== customerId) return;
        if (!o.supplied) return;
        count++;
        const t = orderTotals(o);
        if (t.hasChargeable && !t.customerFullyPaid) remaining += t.customerRemaining;
    });
    return {
        count: count,
        remaining: round2(remaining)
    };
}

function customerStatsIndex() {
    const byCustomer = {};
    (appData.orders || []).forEach(o => {
        if (!o.customerId) return;
        if (!o.supplied) return;
        if (!byCustomer[o.customerId]) byCustomer[o.customerId] = {
            count: 0,
            remaining: 0
        };
        byCustomer[o.customerId].count++;
        const t = orderTotals(o);
        if (t.hasChargeable && !t.customerFullyPaid) byCustomer[o.customerId].remaining += t.customerRemaining;
    });
    Object.keys(byCustomer).forEach(id => {
        byCustomer[id].remaining = round2(byCustomer[id].remaining);
    });
    return byCustomer;
}

function customerPurchaseTotalIndex() {
    const idx = {};
    (appData.orders || []).forEach(o => {
        if (!o.customerId) return;
        if (!o.supplied) return;
        const t = orderTotals(o);
        if (!t.hasChargeable) return;
        idx[o.customerId] = (idx[o.customerId] || 0) + t.sellTotal;
    });
    Object.keys(idx).forEach(id => {
        idx[id] = round2(idx[id]);
    });
    return idx;
}

function customerRefundsPending(customerId) {
    const rows = [];
    (appData.orders || []).forEach(o => {
        if (o.customerId !== customerId) return;
        if (!o.confirmed) return;
        (o.parts || []).forEach(p => {
            if (!p.returned || p.customerRefundConfirmed) return;
            if (!partIsIncludedInOrder(o, p)) return;
            const adjustment = (o.customerPayments || []).find(pay => pay.returnAdjustment && pay.linkedPartId === p.id);
            if (!adjustment) return;
            rows.push({
                orderId: o.id,
                orderNumber: o.orderNumber,
                orderLabel: o.orderLabel,
                partId: p.id,
                description: p.description || "",
                amount: round2(Number(adjustment.amount) || 0)
            });
        });
    });
    return rows;
}

function customerRefundTotal(customerId) {
    return round2(customerRefundsPending(customerId).reduce((s, r) => s + r.amount, 0));
}

function customerRefundsPendingIndex() {
    const byCustomerRaw = {};
    (appData.orders || []).forEach(o => {
        if (!o.customerId) return;
        if (!o.confirmed) return;
        (o.parts || []).forEach(p => {
            if (!p.returned || p.customerRefundConfirmed) return;
            if (!partIsIncludedInOrder(o, p)) return;
            const adjustment = (o.customerPayments || []).find(pay => pay.returnAdjustment && pay.linkedPartId === p.id);
            if (!adjustment) return;
            const amount = round2(Number(adjustment.amount) || 0);
            byCustomerRaw[o.customerId] = (byCustomerRaw[o.customerId] || 0) + amount;
        });
    });
    const byCustomer = {};
    Object.keys(byCustomerRaw).forEach(id => {
        byCustomer[id] = round2(byCustomerRaw[id]);
    });
    return byCustomer;
}

function customerOrderHistory(customerId) {
    const ongoing = [], past = [];
    (appData.orders || []).forEach(o => {
        if (o.customerId !== customerId) return;
        if (!o.supplied) return;
        const t = orderTotals(o);
        const row = {
            orderId: o.id,
            orderNumber: o.orderNumber,
            orderLabel: o.orderLabel,
            total: t.hasChargeable ? t.sellTotal : 0,
            remaining: t.hasChargeable ? t.customerRemaining : 0,
            hasChargeable: t.hasChargeable,
            date: o.suppliedAt || o.updatedAt || o.createdAt || ""
        };
        (!t.customerFullyPaid ? ongoing : past).push(row);
    });
    const byDateDesc = (a, b) => new Date(b.date || 0) - new Date(a.date || 0);
    ongoing.sort(byDateDesc);
    past.sort(byDateDesc);
    return {
        ongoing: ongoing,
        past: past
    };
}

function customerPendingOrders(customerId) {
    const rows = [];
    (appData.orders || []).forEach(o => {
        if (o.customerId !== customerId) return;
        if (o.isQuote) return;
        if (o.supplied) return;
        rows.push({
            orderId: o.id,
            orderNumber: o.orderNumber,
            orderLabel: o.orderLabel,
            confirmed: !!o.confirmed,
            archived: !!o.archived,
            date: o.updatedAt || o.createdAt || ""
        });
    });
    rows.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
    return rows;
}
