<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://kbgvwphlgepfaarkjsjp.supabase.co; base-uri 'none'; form-action 'none'">
<title>إشعار تسليم · PARTECH</title>
<link rel="icon" href="icon-192-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null;">
<style>
  :root{--ink:#10201a;--ink2:#3a4a42;--muted:#6b7a72;--line:#dfe6e1;--paper:#ffffff;--bg:#eef2ef;--green:#0c8f51;--green-d:#096b3d;--green-bg:#e7f6ee;--amber:#9a6700;--amber-bg:#fff4d6;--red:#b42318;--red-bg:#fde8e6;--blue:#1d4ed8;--blue-bg:#e8efff;--radius:14px;--shadow:0 2px 14px rgba(16,32,26,.08)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:15px;padding-bottom:40px}
  .wrap{max-width:720px;margin:0 auto;padding:14px 12px 30px}
  .sheet{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;overflow:clip}
  .doc-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:3px solid var(--green);background:linear-gradient(180deg,#fff,#f6faf7)}
  .doc-head img{width:46px;height:46px;border-radius:10px;object-fit:contain;background:#0e1210}
  .doc-head .t{flex:1;min-width:0}
  .doc-head .t b{display:block;font-size:17px;font-weight:800}
  .doc-head .t small{color:var(--muted);font-size:12.5px}
  .dn-no{direction:ltr;font-weight:800;color:var(--green-d);font-size:13px;background:var(--green-bg);padding:3px 10px;border-radius:999px;white-space:nowrap}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
  .meta div{background:var(--paper);padding:9px 14px}
  .meta div:last-child:nth-child(odd){grid-column:1/-1}
  .meta span{display:block;font-size:11.5px;color:var(--muted)}
  .meta b{font-size:14px}
  .sec{padding:14px 16px;border-bottom:1px solid var(--line)}
  .sec:last-child{border-bottom:0}
  .sec h3{margin:0 0 10px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
  .callout{border-radius:12px;padding:11px 13px;margin:10px 0;font-size:14px}
  .callout.info{background:var(--blue-bg);color:#17398f}
  .callout.warn{background:var(--amber-bg);color:var(--amber)}
  .callout.ok{background:var(--green-bg);color:var(--green-d)}
  .callout.bad{background:var(--red-bg);color:var(--red)}
  .callout b{font-weight:800}
  .progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 2px}
  .progress i{display:block;height:100%;background:var(--green);width:0;transition:width .25s}
  .stick{position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 16px;border-bottom:1px solid var(--line);font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .group{margin:0 0 14px}
  .group-h{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#f3f7f4;border:1px solid var(--line);border-radius:12px 12px 0 0;padding:9px 12px;font-weight:700}
  .group-h small{font-weight:400;color:var(--muted);display:block}
  .group-h a{color:var(--green-d);font-weight:700;text-decoration:none;white-space:nowrap;border:1px solid var(--green);border-radius:999px;padding:4px 12px;font-size:13px}
  .item{border:1px solid var(--line);border-top:0;padding:12px}
  .group .item:last-child{border-radius:0 0 12px 12px}
  .item-top{display:flex;gap:10px;align-items:flex-start}
  .num{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:2px}
  .item-title{flex:1;min-width:0}
  .item-title b{font-size:15.5px;display:block}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .chip{font-size:12px;padding:1px 9px;border-radius:999px;background:#eef2ef;color:var(--ink2);font-weight:600}
  .chip.q{background:var(--ink);color:#fff}
  .chip.g{background:var(--green-bg);color:var(--green-d)}
  .chip.a{background:var(--amber-bg);color:var(--amber)}
  .pn{font-size:12.5px;color:var(--muted)}
  .pn bdi{font-weight:700;color:var(--ink2)}
  .seg{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:6px;margin-top:10px}
  .seg button{min-height:46px;border:1.5px solid var(--line);background:#fff;border-radius:11px;font:inherit;font-weight:700;font-size:13px;color:var(--ink2);cursor:pointer;padding:4px 2px;line-height:1.25}
  .seg button.on.ok{background:var(--green);border-color:var(--green);color:#fff}
  .seg button.on.warn{background:#d98a00;border-color:#d98a00;color:#fff}
  .seg button.on.bad{background:var(--red);border-color:var(--red);color:#fff}
  .seg button.on.gray{background:#475569;border-color:#475569;color:#fff}
  .more{margin-top:10px;display:grid;gap:8px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  label.f{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:3px}
  input[type=text],select,textarea{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;color:var(--ink);min-height:46px}
  textarea{min-height:76px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--green);border-color:var(--green)}
  .stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;width:max-content}
  .stepper button{width:46px;height:46px;border:0;background:#f3f7f4;font-size:22px;font-weight:700;cursor:pointer}
  .stepper b{min-width:54px;text-align:center;font-size:17px}
  .state{font-size:12.5px;margin-top:6px;color:var(--muted);min-height:18px}
  .state.ok{color:var(--green-d)} .state.warn{color:var(--amber)} .state.bad{color:var(--red)}
  .sig{border:2px dashed #94a3a0;border-radius:12px;background:#fbfdfc;touch-action:none;width:100%;height:170px;display:block}
  .sig-bar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12.5px;color:var(--muted)}
  .stmt{background:#f6faf7;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13.5px;color:var(--ink2);margin:10px 0}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:8px 0;cursor:pointer}
  .chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--green);flex:0 0 auto}
  .btn{display:block;width:100%;min-height:52px;border:0;border-radius:13px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;background:var(--green);color:#fff;padding:10px 16px}
  .btn:disabled{background:#b8c4be;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .btn.warn{background:#fff;color:var(--red);border:1.5px solid var(--red)}
  .btn+.btn{margin-top:10px}
  .link{background:none;border:0;color:var(--green-d);font:inherit;font-weight:700;cursor:pointer;padding:4px 0;text-decoration:underline}
  table.t{width:100%;border-collapse:collapse;font-size:13.5px}
  table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:right;vertical-align:top}
  table.t th{background:#f3f7f4;font-size:12px;color:var(--muted);font-weight:700}
  .badge{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:700}
  .badge.ok{background:var(--green-bg);color:var(--green-d)} .badge.warn{background:var(--amber-bg);color:var(--amber)} .badge.bad{background:var(--red-bg);color:var(--red)} .badge.gray{background:#eef2ef;color:var(--ink2)}
  .sigbox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .sigbox>div{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .sigbox img{max-width:100%;height:84px;object-fit:contain;display:block;margin:4px auto;background:#fff}
  .sigbox small{display:block;color:var(--muted);font-size:12px}
  .center{text-align:center;padding:34px 18px}
  .center .big{font-size:46px;line-height:1}
  .overlay{position:fixed;inset:0;background:rgba(10,20,16,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .modal{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px 22px;max-height:90vh;overflow:auto}
  .modal h4{margin:0 0 8px;font-size:17px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;max-width:92vw;text-align:center}
  .foot{text-align:center;color:var(--muted);font-size:12px;padding:14px 10px}
  .spin{display:inline-block;width:18px;height:18px;border:3px solid #cfe0d6;border-top-color:var(--green);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media print{
    body{background:#fff;padding:0} .wrap{max-width:none;padding:0} .sheet{box-shadow:none;border:0}
    .noprint,.stick,.toast,.overlay{display:none!important}
    .doc-head{background:#fff}
  }
</style>
</head>
<body>
<noscript><div class="wrap"><div class="sheet center"><b>يلزم تفعيل جافاسكربت لعرض إشعار التسليم.</b></div></div></noscript>
<div class="wrap"><div id="app"><div class="sheet center"><span class="spin"></span><p>جارٍ التحميل…</p></div></div>
<div class="foot noprint">PARTECH — إشعار تسليم إلكتروني · سجل موقَّع إلكترونيًا</div></div>
<script>
(function(){
'use strict';
var API = 'https://kbgvwphlgepfaarkjsjp.supabase.co/rest/v1/rpc/';
var KEY = 'sb_publishable_6EHXbpaVIocWUf10Agn-WQ_FIh3F0yy';
var TOKEN = (location.hash || '').replace(/^#/, '').trim();
var app = document.getElementById('app');
var S = { data: null, local: {}, view: '', mode: '', busy: false, sig: null, geo: null };

/* ---------- أدوات ---------- */
function h(tag, props){
  var e = document.createElement(tag);
  if(props) Object.keys(props).forEach(function(k){
    var v = props[k];
    if(v == null || v === false) return;
    if(k === 'class') e.className = v;
    else if(k === 'text') e.textContent = v;
    else if(k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else if(k === 'value') e.value = v;
    else if(k === 'checked') e.checked = !!v;
    else e.setAttribute(k, v === true ? '' : v);
  });
  for(var i = 2; i < arguments.length; i++){
    var c = arguments[i];
    if(c == null || c === false) continue;
    if(Array.isArray(c)) c.forEach(function(x){ if(x) e.appendChild(typeof x === 'string' ? document.createTextNode(x) : x); });
    else e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}
function fmt(iso){
  if(!iso) return '';
  try{ return new Date(iso).toLocaleString('ar-SA-u-nu-latn', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Riyadh' }); }catch(e){ return String(iso); }
}
function toast(msg){
  var t = h('div', { class: 'toast', role: 'alert', 'aria-live': 'assertive', text: msg });
  document.body.appendChild(t);
  setTimeout(function(){ try{ t.remove(); }catch(e){} }, 2800);
}
function telHref(p){ return 'tel:' + String(p || '').replace(/[^\d+]/g, ''); }
function rpc(name, p){
  return fetch(API + name, { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': KEY }, body: JSON.stringify({ p: p }) })
    .then(function(r){ return r.json().catch(function(){ return null; }).then(function(j){ if(r.ok && j && typeof j === 'object' && typeof j.ok === 'boolean') return j; throw new Error('http ' + r.status); }); });
}
// أي ردّ غير 2xx أو بلا حقل ok (خطأ بوابة/PostgREST/مهلة) = فشل اتصال مؤقت: تبقى مدخلات المستخدم ويُعاد المحاولة، لا يُعدّ حكمًا من الخادم
function sendWith(name, p){
  return rpc(name, Object.assign({ t: TOKEN }, p)).catch(function(){ return { ok: false, error: 'network', message: 'تعذّر الإرسال — تأكّد من الاتصال وحاول ثانية' }; });
}
function toLatinDigits(s){ return String(s || '').replace(/[٠-٩]/g, function(c){ return String(c.charCodeAt(0) - 1632); }).replace(/[۰-۹]/g, function(c){ return String(c.charCodeAt(0) - 1776); }); }
function lsKey(s){ return 'dn:' + s + ':' + TOKEN.slice(0, 16); }
function lsGet(s){ try{ return localStorage.getItem(lsKey(s)); }catch(e){ return null; } }
function lsSet(s, v){ try{ if(v == null) localStorage.removeItem(lsKey(s)); else localStorage.setItem(lsKey(s), v); }catch(e){} }

var PICK_STATUS = { picked: ['ok', 'مستلمة كاملة'], partial: ['warn', 'مستلمة جزئيًا'], missing: ['bad', 'غير متوفرة'], rejected: ['bad', 'مرفوضة'], pending: ['gray', 'بانتظار'] };
var DEL_STATUS = { accepted: ['ok', 'استلمها العميل'], partial: ['warn', 'استلم جزءًا'], returned: ['bad', 'أُرجعت'], pending: ['gray', 'بانتظار'] };
var REASONS = {
  partial: ['المورد يملك كمية أقل من المطلوب', 'جزء من الكمية غير مجهّز', 'أخرى'],
  missing: ['غير متوفرة عند المورد', 'المورد لم يجهّزها بعد', 'لم أجد المورد/المحل مغلق', 'أخرى'],
  rejected: ['القطعة تالفة', 'غير مطابقة للطلب', 'حالتها سيئة', 'أخرى'],
  ret: ['القطعة تالفة', 'غير مطابقة لطلبي', 'لا أرغب بها', 'أخرى']
};

/* ---------- لوحة التوقيع ---------- */
function SigPad(){
  var c = h('canvas', { class: 'sig', 'aria-label': 'مربع التوقيع' });
  var ctx = null, drawing = false, ink = 0, last = null, onchange = null;
  function size(){
    var r = c.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    var keep = (c.width && ink) ? c.toDataURL() : null;
    c.width = Math.max(300, Math.round(r.width * dpr)); c.height = Math.round(170 * dpr);
    ctx = c.getContext('2d'); ctx.lineWidth = 2.6 * dpr; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#10201a';
    if(keep){ var im = new Image(); im.onload = function(){ ctx.drawImage(im, 0, 0, c.width, c.height); }; im.src = keep; }
  }
  function pos(ev){ var r = c.getBoundingClientRect(); return { x: (ev.clientX - r.left) * c.width / r.width, y: (ev.clientY - r.top) * c.height / r.height }; }
  c.addEventListener('pointerdown', function(ev){ if(!ctx) size(); drawing = true; last = pos(ev); try{ c.setPointerCapture(ev.pointerId); }catch(e){} ev.preventDefault(); });
  c.addEventListener('pointermove', function(ev){
    if(!drawing) return; var p = pos(ev); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    ink += Math.abs(p.x - last.x) + Math.abs(p.y - last.y); last = p; ev.preventDefault(); if(onchange) onchange();
  });
  function end(){ drawing = false; last = null; if(onchange) onchange(); }
  c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end); c.addEventListener('pointerleave', function(){ if(drawing) end(); });
  setTimeout(size, 0); window.addEventListener('resize', function(){ if(!ink) size(); });
  return {
    el: c,
    empty: function(){ return ink < 220; },
    clear: function(){ ink = 0; ctx && ctx.clearRect(0, 0, c.width, c.height); if(onchange) onchange(); },
    onchange: function(f){ onchange = f; },
    png: function(){
      // تصغير إلى 560×190 تقريبًا للبقاء تحت حد الخادم (≈ 50 ألف حرف)
      var w = 560, hgt = Math.round(w * c.height / c.width), t = document.createElement('canvas'); t.width = w; t.height = hgt;
      var tc = t.getContext('2d'); tc.fillStyle = '#fff'; tc.fillRect(0, 0, w, hgt); tc.drawImage(c, 0, 0, w, hgt);
      var url = t.toDataURL('image/png');
      if(url.length > 65000){ t.width = 380; t.height = Math.round(380 * c.height / c.width); tc = t.getContext('2d'); tc.fillStyle = '#fff'; tc.fillRect(0, 0, t.width, t.height); tc.drawImage(c, 0, 0, t.width, t.height); url = t.toDataURL('image/png'); }
      return url;
    }
  };
}

/* ---------- الهيكل المشترك ---------- */
function head(note){
  return h('div', { class: 'doc-head' },
    h('img', { src: 'logo.png', alt: 'PARTECH' }),
    h('div', { class: 't' }, h('b', { text: 'إشعار تسليم إلكتروني' }), h('small', { text: 'PARTECH — احفظها' })),
    h('span', { class: 'dn-no', text: note.no || '' }));
}
function meta(note, extra){
  var cells = [['رقم الطلبية', note.order_number], ['السيارة', note.car || '—'], ['تاريخ الإصدار', fmt(note.created_at)], ['المندوب', note.agent_name]];
  (extra || []).forEach(function(x){ cells.push(x); });
  return h('div', { class: 'meta' }, cells.map(function(c){ return h('div', null, h('span', { text: c[0] }), h('b', { text: c[1] })); }));
}
function setView(node){ app.textContent = ''; app.appendChild(node); window.scrollTo(0, 0); }
function message(icon, title, text){
  setView(h('div', { class: 'sheet center' }, h('div', { class: 'big', text: icon }), h('h3', { text: title }), h('p', { text: text })));
}

/* ---------- مرحلة المندوب: الاستلام من الموردين ---------- */
function agentLocal(it){
  var l = S.local[it.id];
  if(!l){ l = S.local[it.id] = { status: it.pickup_status || 'pending', qty: it.pickup_status === 'partial' ? it.qty_picked : Math.max(1, it.qty - 1), reason: it.pickup_reason || '', custom: '', note: it.pickup_note || '', sync: 'saved' }; var all = REASONS[l.status]; if(all && l.reason && all.indexOf(l.reason) < 0){ l.custom = l.reason; l.reason = 'أخرى'; } }
  return l;
}
function effReason(l){ return l.reason === 'أخرى' ? (l.custom || '').trim() : (l.reason || '').trim(); }
function agentValid(it){
  var l = agentLocal(it);
  if(l.status === 'pending') return false;
  if(l.status === 'picked') return true;
  if(!effReason(l)) return false;
  if(l.status === 'partial') return l.qty >= 1 && l.qty < it.qty;
  return true;
}
var saveTimers = {}, saveInflight = {};
// حفظ تلقائي متسلسل لكل بند: لا يُرسَل طلب جديد وسابقه قيد الإرسال (وإلا تسابقا فكتب الأقدم فوق الأحدث وظهر «تم الحفظ» خطأً)؛ ما تغيّر أثناء الإرسال يُرسَل بعد انتهائه
function queueSave(it){
  var l = agentLocal(it);
  clearTimeout(saveTimers[it.id]);
  if(!agentValid(it)){ l.sync = l.status === 'pending' ? 'saved' : 'need'; paintItem(it); return; }
  l.sync = 'saving'; paintItem(it);
  saveTimers[it.id] = setTimeout(function run(){
    if(saveInflight[it.id]){ l.dirty = true; return; }
    saveInflight[it.id] = true; l.dirty = false;
    sendWith('dn_agent_save', { items: [{ id: it.id, status: l.status, qty: l.status === 'partial' ? l.qty : undefined, reason: l.status === 'picked' ? undefined : effReason(l), note: (l.note || '').trim() || undefined }] }).then(function(r){
      saveInflight[it.id] = false;
      if(l.dirty){ l.dirty = false; if(agentValid(it)) run(); return; }
      if(r && r.ok === false){ l.sync = 'err'; paintItem(it); if(r.error === 'stage'){ location.reload(); } else toast(r.message || 'تعذّر الحفظ'); return; }
      l.sync = 'saved'; paintItem(it);
    });
  }, 450);
}
var itemNodes = {};
function paintItem(it){
  var n = itemNodes[it.id]; if(!n) return;
  var l = agentLocal(it), st = n.querySelector('.state');
  if(st){
    var t = { saved: l.status === 'pending' ? 'اختر حالة هذا البند' : '✓ تم الحفظ', saving: 'جارٍ الحفظ…', need: 'اكتب/اختر السبب ليُحفظ', err: '⚠️ لم يُحفظ — حاول ثانية' }[l.sync];
    st.textContent = t; st.className = 'state ' + ({ saved: l.status === 'pending' ? '' : 'ok', saving: '', need: 'warn', err: 'bad' }[l.sync] || '');

            if(cs){ cs.className = 'state bad'; cs.textContent = (r.error === 'locked' ? '🔒 ' : '⚠️ ') + (r.message || 'رمز التأكيد غير صحيح') + (r.error === 'locked' ? ' — لا يمكن المتابعة من هذا الرابط حتى تجدّد PARTECH الرابط.' : ''); }
          }
          custUpdate(); toast((r && r.message) || 'تعذّر التسجيل'); return;
        }
        lsSet('custname', name); S.local = {}; render(r);
      });
    });
  });
}
/* شاشة المندوب بعد الاستلام: تسليم الجوال للعميل/مشاركة الرابط/تعذّر التسليم */
function renderAgentDone(d){
  var note = d.note, items = d.items || [];
  var body = h('div', { class: 'sec' },
    h('div', { class: 'callout ok' }, h('b', { text: '✅ تم تسجيل استلامك. ' }), 'القطع أدناه الآن في عهدتك ومسؤوليتك حتى يؤكّد العميل استلامه.'),
    h('table', { class: 't' }, h('tr', null, h('th', { text: 'القطعة' }), h('th', { text: 'الكمية' })), items.map(function(it){ return h('tr', null, h('td', { text: it.description }), h('td', { text: String(it.qty_picked) })); })));
  if((d.short || []).length) body.appendChild(h('div', { class: 'callout warn' }, h('b', { text: 'لم تُستلم من الموردين: ' }), d.short.map(function(s){ return s.description + ' (' + s.short_qty + ')'; }).join('، ')));
  body.appendChild(h('div', { class: 'callout info' }, 'عند التسليم: ', h('b', { text: 'سلّم جوالك للعميل' }), ' ليكتب ', h('b', { text: 'رمز التأكيد' }), ' (أرسلته له PARTECH على واتساب — لا تطلبه منه ولا تعرفه) ثم يؤكد الاستلام ويوقّع، أو أرسل له نفس الرابط ليفتحه على جواله.'));
  var share = function(){ var url = location.href, text = 'تأكيد استلام طلبك من PARTECH — الرابط: ' + url; if(navigator.share){ navigator.share({ title: 'تأكيد استلام', text: 'تأكيد استلام طلبك من PARTECH', url: url }).catch(function(){}); } else { window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener'); } };
  body.appendChild(h('button', { type: 'button', class: 'btn', onclick: function(){ S.view = 'customer-confirm'; renderCustomer(S.data); } }, '📱 تسليم الجوال للعميل لتأكيد الاستلام'));
  body.appendChild(h('button', { type: 'button', class: 'btn ghost', onclick: share }, '📲 إرسال الرابط للعميل'));
  body.appendChild(h('button', { type: 'button', class: 'btn warn', onclick: reportFail }, '⚠️ تعذّر التسليم'));
  setView(h('div', { class: 'sheet' }, head(note), meta(note), body));
}
function reportFail(){
  var ta = h('textarea', { placeholder: 'اكتب السبب (مثال: العميل لا يرد، العنوان غير واضح)…', maxlength: '500' });
  var ov = h('div', { class: 'overlay' }, h('div', { class: 'modal' }, h('h4', { text: 'تعذّر التسليم' }), ta,
    h('button', { type: 'button', class: 'btn', style: 'margin-top:12px', onclick: function(e){ var btn = e.currentTarget, t = ta.value.trim(); if(btn.disabled) return; if(!t){ toast('اكتب السبب'); return; } btn.disabled = true; sendWith('dn_report', { kind: 'delivery_failed', text: t }).then(function(r){ if(r && r.ok === false){ btn.disabled = false; toast(r.message || 'تعذّر الإرسال'); return; } ov.remove(); toast('تم إبلاغ الإدارة'); }); } }, 'إرسال للإدارة'),
    h('button', { type: 'button', class: 'btn ghost', onclick: function(){ ov.remove(); } }, 'رجوع')));
  document.body.appendChild(ov);
}

/* ---------- الإيصال النهائي ---------- */
function renderReceipt(d){
  S.mode = 'receipt'; var note = d.note, items = d.items || [], sigs = (d.signatures || []).filter(function(s){ return !s.superseded; });
  var oc = { complete: ['ok', '✅ تم التسليم كاملًا'], partial: ['warn', '⚠️ تم التسليم مع ملاحظات / إرجاع جزئي'], failed: ['bad', '⛔ لم يتم التسليم'] }[note.outcome] || ['gray', ''];
  var rows = items.map(function(it){
    var ps = PICK_STATUS[it.pickup_status] || PICK_STATUS.pending, ds = DEL_STATUS[it.delivery_status] || DEL_STATUS.pending;
    return h('tr', null, h('td', null, h('b', { text: it.description }), it.part_number ? h('div', { class: 'pn' }, h('bdi', { dir: 'ltr', text: it.part_number })) : null),
      h('td', { text: String(it.qty) }),
      h('td', null, h('span', { class: 'badge ' + ps[0], text: ps[1] + (it.pickup_status === 'partial' ? ' (' + it.qty_picked + ')' : '') })),
      h('td', null, it.qty_picked > 0 ? h('span', { class: 'badge ' + ds[0], text: ds[1] + (it.delivery_status === 'partial' ? ' (' + it.qty_accepted + ')' : '') }) : '—', it.delivery_reason ? h('div', { class: 'pn', style: 'direction:rtl', text: 'السبب: ' + it.delivery_reason }) : null, it.delivery_note ? h('div', { class: 'pn', style: 'direction:rtl', text: it.delivery_note }) : null));
  });
  var sb = h('div', { class: 'sigbox' }, ['agent', 'customer'].map(function(party){
    var s = sigs.filter(function(x){ return x.party === party; }).pop();
    return h('div', null, h('b', { text: party === 'agent' ? 'المندوب' : 'العميل' }), s ? [h('img', { src: s.image, alt: 'توقيع' }), h('b', { text: s.name }), h('small', { text: fmt(s.at) })] : h('small', { text: '— لا توقيع —' }));
  }));
  var body = h('div', { class: 'sec' }, h('div', { class: 'callout ' + oc[0] }, h('b', { text: oc[1] }), note.delivered_at ? h('div', { text: 'وقت التسليم: ' + fmt(note.delivered_at) }) : null),
    h('table', { class: 't' }, h('tr', null, h('th', { text: 'القطعة' }), h('th', { text: 'العدد' }), h('th', { text: 'الاستلام من المورد' }), h('th', { text: 'تسليم العميل' })), rows));
  var stmts = h('div', { class: 'sec' }, h('h3', { text: 'التوقيعات والإقرارات' }), sb);
  sigs.forEach(function(s){ stmts.appendChild(h('div', { class: 'stmt' }, h('b', { text: (s.party === 'agent' ? 'إقرار المندوب: ' : 'إقرار العميل: ') }), s.statement, s.note ? h('div', { style: 'margin-top:6px' }, h('b', { text: 'ملاحظات ' + (s.party === 'agent' ? 'المندوب' : 'العميل') + ': ' }), s.note) : null)); });
  var act = h('div', { class: 'sec noprint' }, h('button', { type: 'button', class: 'btn ghost', onclick: function(){ window.print(); } }, '🖨️ طباعة / حفظ PDF'));
  setView(h('div', { class: 'sheet' }, head(note), meta(note, [['العميل', note.customer_name || '—']]), body, stmts, act));
}

/* ---------- التوجيه ---------- */
function render(d){
  S.data = d;
  if(!d || d.ok !== true){ message('🔒', d && d.error === 'network' ? 'تعذّر الاتصال' : 'الرابط غير صالح', (d && d.message) || 'الرابط غير صحيح أو انتهى. اطلب رابطًا جديدًا من PARTECH.'); return; }
  S.view = d.view; try{ document.title = 'إشعار تسليم ' + ((d.note && d.note.no) || '') + ' · PARTECH'; }catch(e){}
  if(d.view === 'agent') renderAgent(d);
  else if(d.view === 'customer') renderCustomer(d);
  else if(d.view === 'receipt') renderReceipt(d);
  else if(d.view === 'cancelled') message('🚫', 'تم إلغاء هذا الإشعار', 'أُلغي إشعار التسليم ' + ((d.note && d.note.no) || '') + '. تواصل مع PARTECH للتفاصيل.');
  else if(d.view === 'expired') message('⌛', 'انتهت صلاحية الرابط', 'انتهت مدة صلاحية هذا الرابط. اطلب من PARTECH رابطًا جديدًا.');
  else message('⚠️', 'تعذّر العرض', 'حاول لاحقًا.');
}
if(!/^[0-9a-f]{64}$/.test(TOKEN)){ message('🔒', 'الرابط ناقص', 'افتح الرابط كاملًا كما وصلك من PARTECH.'); return; }
rpc('dn_view', { t: TOKEN }).then(render).catch(function(){
  app.textContent = ''; app.appendChild(h('div', { class: 'sheet center' }, h('div', { class: 'big', text: '📡' }), h('h3', { text: 'تعذّر الاتصال' }), h('p', { text: 'تأكّد من الإنترنت ثم أعد المحاولة.' }), h('button', { type: 'button', class: 'btn', onclick: function(){ location.reload(); } }, 'إعادة المحاولة')));
});
})();
</script>
